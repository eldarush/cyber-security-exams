name: Validate study site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild static site
        run: python3 scripts/build.py
      - name: Check content, calculations, links and JavaScript
        run: python3 scripts/validate.py
      - name: Check generated content is current
        run: git diff --exit-code
