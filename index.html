on class=\"forecast-review\"><h3>דרך הפתרון</h3><p>עבור כתובות HTTP(S) הרגילות שבשאלה, origin נקבע על ידי שלשה: scheme, host, port. כשלא נכתב פורט, HTTPS משתמש ב-443 ו-HTTP ב-80. הנתיב, השאילתה והמקטע אינם חלק משלשת ה-origin. מפרקים כל זוג לשלושת הרכיבים ואז משווים.</p><pre>origin = (scheme, host, effective port)\nhttps://shop.example/a → (https, shop.example, 443)\nhttps://shop.example/b → (https, shop.example, 443)</pre><h3>למה התשובה נכונה ולמה שאר האפשרויות שגויות</h3><p class=\"study-source\">מזהים כל חלופה לפי הטקסט שלה; אותיות התשובות משתנות בערבוב.</p><div class=\"option-review\" data-option-review=\"0\"><h4>נכונה — https://shop.example/a וכן https://shop.example/b</h4><p>בשתי הכתובות הסכמה היא https, המארח shop.example והפורט האפקטיבי 443. השינוי מ-/a ל-/b הוא שינוי נתיב בלבד, ולכן המקור זהה.</p></div><div class=\"option-review\" data-option-review=\"1\"><h4>שגויה — http://shop.example וכן https://shop.example</h4><p>http ו-https הן סכמות שונות, וגם פורטי ברירת המחדל שונים. זהות שם המארח בלבד אינה מספיקה לקביעת אותו origin.</p></div><div class=\"option-review\" data-option-review=\"2\"><h4>שגויה — https://shop.example:8443 וכן https://shop.example</h4><p>8443 אינו פורט ברירת המחדל 443 של HTTPS. גם אם אותו שרת פיזי מאזין בשניהם, מדובר בשני origins לפי ההגדרה.</p></div><div class=\"option-review\" data-option-review=\"3\"><h4>שגויה — https://shop.example וכן https://api.shop.example</h4><p>api.shop.example הוא שם מארח שונה מ-shop.example. תת-דומיין משותף או בעלות משותפת אינם מאחדים origins.</p></div><h3>דגש והנחות שחשוב לזכור</h3><p>למשל https://shop.example:443/a ו-https://shop.example/b כן היו באותו origin אחרי נרמול הפורט. אין לבלבל בין origin לבין site המשמש בהקשרים אחרים כגון cookies. גם גישה באותו origin אינה פוטרת שרת מבדיקת הרשאות המשתמש למשאב.</p><p class=\"study-source\">מקורות לבדיקת המנגנון: <a href=\"https://developer.mozilla.org/en-US/docs/Web/Security/Defenses/Same-origin_policy\">MDN — same-origin policy</a></p></section>","title":"SOP — השווא מודה.</p><pre>SQL structure: SELECT ... WHERE user_name = ?\nBound value:   the supplied user-name string</pre><h3>למה התשובה נכונה ולמה שאר האפשרויות שגויות</h3><p class=\"study-source\">מזהים כל חלופה לפי הטקסט שלה; אותיות התשובות משתנות בערבוב.</p><div class=\"option-review\" data-option-review=\"0\"><h4>נכונה — שאילתה עם פרמטר קשור, כך שהערך מטופל כנתון ולא כתחביר SQL.</h4><p>פרמטר קשור מפריד בין הערך לבין מבנה הפקודה. כך ערך כגון מחרוזת עם גרש נשאר ערך להשוואה ואינו סוגר מחרוזת ומוסיף תנאי לשאילתה.</p></div><div class=\"option-review\" data-option-review=\"1\"><h4>שגויה — מחיקת המילה union פעם אחת מן הקלט.</h4><p>מתקפות SQL injection אינן חייבות להשתמש במילה union. סינון נקודתי של מילה אחת אינו מפריד נתונים מתחביר וניתן לעקיפה בדרכים תלויות הקשר.</p></div><div class=\"option-review\" data-option-review=\"2\"><h4>שגויה — בדיקת JavaScript בדפדפן בלבד.</h4><p>תוקף אינו חייב להפעיל את קוד JavaScript של האתר. הוא יכול לשלוח בקשה ישירה לשרת, ולכן בדיקת לקוח לבדה אינה מגינה על בניית השאילתה.</p></div><div class=\"option-review\" data-option-review=\"3\"><h4>שגויה — הגדרת X-Frame-Options ללא שינוי השאילתה.</h4><p>X-Frame-Options עוסק בהטמעת דף במסגרת ובסיכוני clickjacking. הוא אינו משנה את האופן שבו מסד הנתונים מפרש את פקודת SQL.</p></div><h3>דגש והנחות שחשוב לזכור</h3><p>אין לשרשר קלט לשאילתה ואז לקרוא לה ״מוכנה״: הקישור עצמו צריך לשמור על הערך כנתון. רכיבים מבניים שאינם ניתנים לפרמטריזציה דורשים בחירה מבוקרת מתוך רשימת ערכים מותרת. גם שאילתה בטוחה מהזרקה עדיין דורשת בדיקות הרשאה מתאימות.</p><p class=\"study-source\">מקורות לבדיקת המנגנון: <a href=\"https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html\">OWASP — SQL injection prevention</a></p></section>","title":"SQL injection — הפרדת ערך ממבנה שאילתה","old_number":29,"id":"P28","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":28}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam" דויק.","question_type":"multiple-choice","solution":"solutions/P28.html"},{"stem":"resolver שולח בקשה יחידה עם TXID שנבחר באופן אחיד מכל 16 הביטים, ופורט המקור ידוע. תוקף off-path שולח ניחוש יחיד, כאשר שאר תנאי הקבלה והתזמון מתקיימים. מה סיכוי ניחוש ה-TXID?","options":["1/65536","1/256","1/16","1/2"],"topic":"רשתות: ARP, DNS, DoS ו-Firewall","answer_html":"<section class=\"forecast-review\"><h3>דרך הפתרון</h3><p>מזהה אחיד בן 16 ביט יכול לקבל 2¹⁶=65,536 ערכים. יש בקשה אחת ומועמד ניחוש אחד, והפורט ושאר השדות הותנו כנכונים. לכן בדיוק ערך אחד מבין 65,536 הערכים יצליח בבדיקת ה-TXID, וההסתברות היא 1/65,536.</p><pre>Possible TXIDs = 2^16 = 65,536\nOne guess / one target: P = 1 / 65,536</pre><h3>למה התשובה נכונה ולמה שאר האפשרויות שגויות</h3><p class=\"study-source\">מזהים כל חלופה לפי הטקסט שלה; אותיות התשובות משתנות בערבוב.</p><div class=\"option-review\" data-option-review=\"0\"><h4>נכונה — 1/65536</h4><p>1/65536 הוא אחד חלקי גודל מרחב המזהים. מדובר בסיכוי ניחוש של שדה יחיד, בהנחה שהערך אחיד ואינו ידוע לתוקף.</p></div><div class=\"option-review\" data-option-review=\"1\"><h4>שגויה — 1/256</h4><p>1/256 היה מתאים לניחוש של מזהה בן 8 ביט, לא 16. השורש של 2¹⁶ מופיע בסדרי גודל של התנגשויות מרובות, לא בניחוש יחיד של יעד קבוע.</p></div><div class=\"option-review\" data-option-review=\"2\"><h4>שגויה — 1/16</h4><p>1/16 מתבלבל בין מספר הביטים למספר הערכים. כל ביט מכפיל את מספר האפשרויות, ולכן מספר הערכים הוא 2¹⁶ ולא 16.</p></div><div class=\"option-review\" data-option-review=\"3\"><h4>שגויה — 1/2</h4><p>1/2 הוא סיכוי ניחוש של ביט אחד. כאן יש צורך לנחש את כל המזהה בן 16 הביטים במדויק, ולא רק מאפיין בינארי שלו.</p></div><h3>דגש והנחות שחשוב לזכור</h3><p>זה אינו אומדן מלא להצלחת הרעלת DNS בכל רשת. בפועל נדרשים תזמון ושדות נוספים, וייתכנו אימות או הגנות אחרות. השאלה מתנה את שאר התנאים ומבקשת רק את סיכוי ה-TXID. תוקף off-path אינו רואה את המזהה; פורט אקראי שאינו ידוע היה מוסיף אי-ודאות, אך כאן הוא ידוע.</p><p class=\"study-source\">מקורות לבדיקת המנגנון: <a href=\"https://www.rfc-editor.org/rfc/rfc5452.html#section-7.1\">RFC 5452 — DNS forged answers</a></p></section>","title":"DNS — הסתברות לניחוש TXID יחיד","old_number":20,"id":"P29","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":29}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"רשת ביטחון","evidence":["Q030","Q037","Q052","Q171"],"mock":3,"answer_origin":"תרגיל 20 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת · ההסבר נבדק ונערך מחדש ב-14/11/2026, כולל כל ארבע החלופות","accepted_indices":[0],"reviewed":"2026-11-14","option_explanations":[{"option":"1/65536","correct":true,"reason":"1/65536 הוא אחד חלקי גודל מרחב המזהים. מדובר בסיכוי ניחוש של שדה יחיד, בהנחה שהערך אחיד ואינו ידוע לתוקף."},{"option":"1/256","correct":false,"reason":"1/256 היה מתאים לניחוש של מזהה בן 8 ביט, לא 16. השורש של 2¹⁶ מופיע בסדרי גודל של התנגשויות מרובות, לא בניחוש יחיד של יעד קבוע."},{"option":"1/16","correct":false,"reason":"1/16 מתבלבל בין מספר הביטים למספר הערכים. כל ביט מכפיל את מספר האפשרויות, ולכן מספר הערכים הוא 2¹⁶ ולא 16."},{"option":"1/2","correct":false,"reason":"1/2 הוא סיכוי ניחוש של ביט אחד. כאן יש צורך לנחש את כל המזהה בן 16 הביטים במדויק, ולא רק מאפיין בינארי שלו."}],"confidence":33,"confidence_kind":"skill-confidence-not-probability","skill":"dns-guess","skill_label":"ניחוש מזהים ופורטים במענה DNS","confidence_basis":{"topic_counts":{"exams":12,"a":6,"b":5,"both":5,"summer_b":2},"total_exams":18,"total_pairs":7,"summer_pairs":3,"skill_dates":["04/12/2022","08/08/2023"],"skill_evidence":["Q030","Q052"],"latest_a_skill":false,"components":{"all_exams":9.75,"b_exams":16.6667,"a_to_b":11.25,"summer_b":9.0,"skill_support":6.6667,"latest_a":0},"extension_deduction":20},"confidence_reason":"משפחת הנושא הופיעה ב-12/18 מועדים וב-5/7 מועדי ב׳; נמשכה מא׳ לב׳ ב-5/6 זוגות שבהם הופיעה בא׳; במועדי ב׳ של קיץ: 2/3. למיומנות המתועדת יש סימוכין ב-2 תאריכים שונים. \">מקורות לבדיקת המנגנון: <a href=\"https://www.rfc-editor.org/rfc/rfc8017.html#section-5.2.2\">RFC 8017 — RSA primitives</a></p></section>","confidence":52,"confidence_kind":"skill-confidence-not-probability","skill":"rsa-create","skill_label":"חישוב חתימת textbook RSA במפתח פרטי","confidence_basis":{"topic_counts":{"exams":13,"a":6,"b":4,"both":4,"summer_b":3},"total_exams":18,"total_pairs":7,"summer_pairs":3,"skill_dates":["24/11/2024","21/07/2025"],"skill_evidence":["Q100","Q105"],"latest_a_skill":false,"components":{"all_exams":10.5,"b_exams":13.8889,"a_to_b":9.375,"summer_b":12.0,"skill_support":6.6667,"latest_a":0},"extension_deduction":0},"confidence_reason":"משפחת הנושא הופיעה ב-13/18 מועדים וב-4/7 מועדי ב׳; נמשכה מא׳ לב׳ ב-4/6 זוגות שבהם הופיעה בא׳; במועדי ב׳ של קיץ: 3/3. למיומנות המתועדת יש סימוכין ב-2 תאריכים שונים. אין סימוכין למיומנות הזו באוקטובר 2026 במיפוי המסוים. השאלה מתרגלת וריאציה של מיומנות מתועדת; המספר אינו סיכוי לניסוח המדויק.","question_type":"multiple-choice","solution":"solutions/P31.html"},{"id":"P32","title":"RSA — פענוח במקום חתימה","stem":"ב-textbook RSA, n=55, e=3 ו-d=27. התקבל ciphertext שערכו c=8. מהו ה-plaintext?","options":["2","8","3","27"],"topic":"RSA, מפתח ציבורי וחתימות","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":32}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"רשת ביטחון","evidence":["Q100","Q104","Q105","Q113","Q138","Q155","Q175"],"mock":5,"answer_origin":"וריאציה חדשה למועד ב׳ · נובמבר 2026 · ההסבר נבדק ונערך מחדש ב-14/11/2026, כולל כל ארבע החלופות","accepted_indices":[0],"reviewed":"2026-11-14","option_explanations":[{"option":"2","correct":true,"reason":"2 הוא ערך שמתפענח מהצופן הנתון, ובדיקת הצפנתו מחזירה בדיוק את 8 תחת אותו מפתח פומבי."},{"option":"8","correct":false,"reason":"8 הוא הצופן שהתקבל, ולא הפענוח. הצפנת 8 בחזקה 3 נותנת 17 מודולו 55, ולכן אינו הפתרון."},{  קטן פי 16</h4><p>הכיוון הפוך: יעד קטן יותר דורש hash נדיר יותר ולא מאפשר למצוא פתרון בקלות רבה יותר.</p></div><div class=\"option-review\" data-option-review=\"2\"><h4>שגויה — אינו משתנה</h4><p>היעד הוא תנאי הקבלה של העבודה. שינויו משנה את הסתברות ההצלחה גם בלי לשנות את פונקציית ה-hash.</p></div><div class=\"option-review\" data-option-review=\"3\"><h4>שגויה — גדל פי 4</h4><p>שורש ריבועי מתאים לבעיית התנגשויות מסוימת, לא לחיפוש hash שנמצא בטווח יעד קבוע כמו בתרחיש הזה.</p></div><h3>דגש והנחות שחשוב לזכור</h3><p>זו תוחלת ולא הבטחה: ניסוי יחיד יכול להצליח מיד או לקחת זמן רב. אין כאן חיפוש התנגשות ואין צורך לשחזר מפתח פרטי. זהו שינוי יעד במודל השאלה, שאינו קובע אם היעד החדש מותר לפי כללי ביטקוין. שינוי פונקציית ה-hash בכללי הקונצנזוס הוא תרחיש שונה: אם צמתים לא מעודכנים דוחים בלוקים חדשים, הוא עלול ליצור hard fork.</p><p class=\"study-source\">מקורות לבדיקת המנגנון: <a href=\"https://developer.bitcoin.org/devguide/block_chain.html\">Bitcoin Developer Guide — consensus and proof of work</a></p></section>","confidence":51,"confidence_kind":"skill-confidence-not-probability","skill":"pow","skill_label":"כרייה ו-Proof of Work","confidence_basis":{"topic_counts":{"exams":17,"a":6,"b":7,"both":6,"summer_b":3},"total_exams":18,"total_pairs":7,"summer_pairs":3,"skill_dates":["04/12/2022","07/07/2023","04/07/2024"],"skill_evidence":["Q029","Q042","Q046","Q072"],"latest_a_skill":false,"components":{"all_exams":13.5,"b_exams":22.2222,"a_to_b":13.125,"summer_b":12.0,"skill_support":10.0,"latest_a":0},"extension_deduction":20},"confidence_reason":"משפחת הנושא הופיעה ב-17/18 מועדים וב-7/7 מועדי ב׳; נמשכה מא׳ לב׳ ב-6/6 זוגות שבהם הופיעה בא׳; במועדי ב׳ של קיץ: 3/3. למיומנות המתועדת יש סימוכין ב-3 תאריכים שונים. אין סימוכין למיומנות הזו באוקטובר 2026 במיפוי המסוים. הופחתו 20 נקודות כי השאלה מרחיבה את המיומנות למקרה שלא תועד באותו אופן בבחינות.","question_type":"multiple-choice","solution":"solutions/P43.html"},{"id":"P44","title":"מרקל — אילו צמתים משתנים?","stem":"בעץ מרקל בינארי מוש const HEB = /[֐-׿]/;
function inline(text, rtl){
  if (text.includes('`')) return text.split('`').map((p,i) => i%2 ? `<bdi dir="ltr"><code>${esc(p)}</code></bdi>` : inline(p, rtl)).join('');
  const PH = {'<sub>':'\x01','</sub>':'\x02','<sup>':'\x03','</sup>':'\x04'};
  for (const [t,p] of Object.entries(PH)) text = text.split(t).join(p);
  const fin = s => { s = esc(s); for (const [t,p] of Object.entries(PH)) s = s.split(p).join(t); return s; };
  if (!rtl) return fin(text);
  let out = '', pos = 0; const re = /[A-Za-z0-9\x01\x03][^֐-׿]*/g; let m;
  while ((m = re.exec(text))){
    let run = m[0];
    const cnt = (s,c) => s.split(c).length-1;
    while (run && (' .,:;?!(-–'.includes(run.at(-1)) || (')]'.includes(run.at(-1)) && cnt(run,'(')+cnt(run,'[') < cnt(run,')')+cnt(run,']')))) run = run.slice(0,-1);
    out += fin(text.slice(pos, m.index)) + `<bdi dir="ltr">${fin(run)}</bdi>`;
    pos = m.index + run.length; re.lastIndex = pos > m.index ? pos : m.index + 1;
  }
  return out + fin(text.slice(pos));
}
function rich(text){
  const L = text.split('\n'); let out = '', i = 0;
  const dir = s => HEB.test(s) ? 'rtl' : 'ltr';
  while (i < L.length){
    const l = L[i];
    if (l.trim().startsWith('```')){ const c=[]; i++; while(i<L.length && !L[i].trim().startsWith('```')) c.push(L[i++]); i++; out += `<pre>${esc(c.join('\n'))}</pre>`; continue; }
    if (l.trim().startsWith('|')){
      const rows=[]; while(i<L.length && L[i].trim().startsWith('|')) rows.push(L[i++].trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
      out += '<div class="tbl"><table>' + rows.map((r,ri)=>'<tr>'+r.map(c=>`<${ri?'td':'th'} dir="${dir(c)}">${inline(c,dir(c)==='rtl')}</${ri?'td':'th'}>`).join('')+'</tr>').join('') + '</table></div>';
      continue;
    }
    if (l.trim()) out += `<div class="ln" dir="${dir(l)}">${inline(l, dir(l)==='rtl')}</div>`;
    i++;
  }
  return out;
}

    if ((a.revision || 1) === (currentRevisions.get(a.id) || 1)) latest.set(a.id, a.ok);
  }
  return new Set([...latest].filter(([,ok]) => !ok).map(([id]) => id));
}
function pool(){
  const c = S.cfg, wrong = c.wrongOnly ? wrongQuestionIds() : new Set();
  return QS.filter(q =>
    (!c.onlyMultipleChoice || q.question_type === 'multiple-choice') &&
    (!c.topics.length || c.topics.includes(q.topic)) &&
    (!c.years.length || yearsOf(q).some(y => c.years.includes(y))) &&
    (!c.skipNoted || !q.note || q.id.startsWith('P')) &&
    (!c.wrongOnly || wrong.has(q.id)));
}

function makeItems(qs, r){
  return qs.map(q => ({ q, order: AnswerOrder.indices(q.options.length), ans: null, flag: false }));
}
function start(ids){
  const c = S.cfg;
  const seed = c.seed ? +c.seed : Math.floor(Math.random()*900000)+100000;
  const r = rng(seed);
  const P = Array.isArray(ids) ? QS.filter(q => ids.includes(q.id) && (!c.onlyMultipleChoice || q.question_type === 'multiple-choice')) : pool();
  const n = Array.isArray(ids) ? P.length : Math.min(c.n, P.length);
  if (!n) return;
  if (c.mode === 'print' && !Array.isArray(ids)){
    const versions = []; let remaining = P.slice(); const base = shuffle(P, r).slice(0, n);
    for (let v=0; v<c.versions; v++){
      let chosen;
      if (c.verMode==='same') chosen = shuffle(base, r);
      else if (c.verMode==='norepeat'){ chosen = shuffle(remaining, r).slice(0,n); remaining = remaining.filter(q => !chosen.includes(q)); }
      else chosen = shuffle(P, r).slice(0, n);
      versions.push(makeItems(chosen, r));
    }
    S.print = {seed, versions}; go('print'); return;
  }
  const mode = Array.isArray(ids) ? 'digital' : c.mode;
  const minutes = mode!=='digital' ? 0 : Array.isArray(ids) ? Math.round(n*8) : (c.minutes ?? Math.round(n*8));
  S.exam = {seed, mode, items: makeItems(shuffle(P, r).slice(0, n), r), cur: 0, start: Date.now(), limit: minutes*60, done: false};
  go('exam'); startTimer();
}

let timerId = null;
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(() => {
    const E = S.exam; if (!E || E.done){ clearInterval(timerId); return; }
    const el = $('#timer'); if (!el) return;
    const t = timerText(E); el.textContent = t.text; el.classList.toggle('low', t.low);
    if (E.limit && (Date.now()-E.start)/1000 >= E.limit) submit(true);
  }, 1000);
}
function timerText(E){
  const el = Math.floor((Date.now()-E.start)/1000);
  const sec = E.limit ? Math.max(0, E.limit - el) : el;
  const f = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  return {text: (E.limit ? '' : '⏱ ') + f(sec), low: E.limit && sec < 300};
}

  $('#prev').onclick = () => { E.cur--; renderExam(app); };
  if ($('#next')) $('#next').onclick = () => { E.cur++; renderExam(app); };
  $('#flag').onclick = () => { it.flag = !it.flag; renderExam(app); };
  $('#submit').onclick = () => submit(false);
  if ($('#submit2')) $('#submit2').onclick = () => submit(false);
}
document.addEventListener('keydown', e => {
  if (S.tab !== 'exam' || !S.exam || S.exam.done || $('.modal')) return;
  if (e.target.matches('input,select,textarea')) return;
  const E = S.exam;
  if (e.key === 'ArrowLeft' && E.cur < E.items.length-1){ E.cur++; render(); }
  else if (e.key === 'ArrowRight' && E.cur > 0){ E.cur--; render(); }
  else if (/^[1-4]$/.test(e.key)){ const b = document.querySelector(`.opts .opt[data-j="${+e.key-1}"]`); if (b && !b.disabled) b.click(); }
});
function submit(timeUp){
  const E = S.exam;
  const un = E.items.filter(x => x.ans === null).length;
  const fl = E.items.filter(x => x.flag).length;
  if (!timeUp && E.mode === 'digital' && (un || fl)){
    confirmModal(`${un ? `נשארו ${un} שאלות בלי תשובה.` : ''} ${fl ? `${fl} שאלות מסומנות לחזרה.` : ''} להגיש בכל זאת?`, 'הגש מבחן', finish);
    return;
  }
  finish(timeUp);
}
function finish(timeUp){
  const E = S.exam; E.done = true; clearInterval(timerId);
  reviewFilter = 'all';
  const secs = Math.round((Date.now()-E.start)/1000);
  const answers = E.items.map(x => ({id: x.q.id, revision: x.q.revision || 1, topic: x.q.topic, ok: x.ans !== null && isCorrect(x.q,x.order[x.ans]), skipped: x.ans === null}));
  const counted = E.mode === 'practice' ? answers.filter(a => !a.skipped) : answers;
  const correct = counted.filter(a => a.ok).length;
  const score = counted.length ? Math.round(correct / counted.length * 100) : 0;
  S.result = {exam: E, secs, correct, total: counted.length, score, timeUp};
  if (counted.length){
    const hist = store.get('history', []);
    hist.push({t: Date.now(), mode: E.mode, seed: E.seed, n: counted.length, correct, score, secs, answers: counted});
    store.set('history', hist.slice(-200));
  }
  go('result');
}

      <div><h3>טענות שחוזרות</h3><p class="sub" style="font-size:13px">אותה טענה (אחת מהתשובות) הופיעה בשאלות שונות ובמועדים שונים. כדאי להכיר אותן היטב.</p></div>
      <div class="list">${stm.slice(0, 25).map(s => `<div class="li"><div>${rich(s.text)}</div><div class="m">${s.exams} מועדים · ${s.dates.join(' · ')} · ${s.questions.join(', ')}</div></div>`).join('')}</div>
      ${stm.length>25?`<details><summary>עוד ${stm.length-25} טענות</summary><div class="list" style="margin-top:10px">${stm.slice(25).map(s => `<div class="li"><div>${rich(s.text)}</div><div class="m">${s.exams} מועדים · ${s.dates.join(' · ')}</div></div>`).join('')}</div></details>`:''}
    </div>

    <div class="panel stack">
      <div><h3>איך חולקו הנושאים</h3>
      <p class="sub" style="font-size:13px">כל שאלה (גוף + תשובות) הומרה לווקטור TF-IDF של מילות התוכן, ואז רץ K-Means עם 9 מרכזים שעוגנו במילות מפתח של נושאי הקורס. המרכזים זזים לפי הנתונים עצמם, וכל שאלה משויכת לאשכול הקרוב ביותר (דמיון קוסינוס). ${QS.filter(q=>q.topic_manual).length} שאלות שהשתייכו לכמה נושאים שויכו ידנית. אלה המילים החזקות בכל אשכול:</p></div>
      <div class="grid2">${TOPICS.map(t => `<div><b style="font-size:14px">${esc(t)}</b> <span class="sub mono" style="font-size:12px">${BANK.meta.topics[t].count}</span><div class="terms">${BANK.meta.topics[t].top_terms.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>`).join('')}</div>
    </div>
  </div>`;
  bindTips(app);
}
const strip = s => s.replace(/<[^>]+>/g,'').replace(/```/g,'');
function firstLine(q){ const s = strip(q.stem).replace(/\s+/g,' ').trim(); return s.length > 45 ? s.slice(0,120) + (s.length>120?'…':'') : (s + ' ' + strip(q.options[0])).slice(0,120); }

/* ---------- shared UI ---------- */
function bindTips(root){
  const tip = $('#tip');
  root.querySelectorAll('[data-tip]').forEach(el => {
    el.onmousemove = e => { tip.textContent = el.dataset.tip; tip.hidden = false; tip.style.left = Math.min(e.clientX + 12, innerWidth - 270) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; };
    el.onmouseleave = () => tip.hidden = true;
  });
}
function confirmModal(msg, okText, onOk){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="panel" role="dialog" aria-modal="true"><div>${esc(msg)}</div><div class="row" style="justify-content:flex-end"><button class="btn" data-x>ביטול</button><button class="btn primary" data-ok>${esc(okText)}</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('[data-ok]').onclick = () => { m.remove(); onOk(); };
  m.onclick = e => { if (e.target === m) m.remove(); };
  m.querySelector('[data-ok]').focus();
}

if ((S.cfg.collection || '') !== selectedSet) {
  S.cfg = {...S.cfg, collection:selectedSet, mode:['forecast-best','forecast-lecture','forecast-no-latest'].includes(selectedSet)?'digital':S.cfg.mode, n:selectedSet==='forecast-best'?10:['forecast-lecture','forecast-no-latest'].includes(selectedSet)?QS.length:Math.min(S.cfg.n,QS.length),topics:[],years:[],wrongOnly:false,skipNoted:false,minutes:null,shuffle:true,onlyMultipleChoice:true};
  store.set('cfg', S.cfg);
}
tabFromHash();
render();
