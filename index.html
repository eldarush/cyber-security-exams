ין היא באמצעות mining pools.","אם אליס היא הבעלים כרגע של x ביטקוין כתוצאה מטרנזקציה y, היא תמיד תהיה הבעלים של המטבעות הללו, בתנאי שהיא לא בזבזה אותם.","הבנק שעומד מאחורי ביטקוין דואג להזרים כסף למערכת לפי הצורך.","אחד היתרונות של ביטקוין הוא שהוא מונע double spending לחלוטין."],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":6},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.254,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-07-06\" data-doc=\"original-07\" data-body-words=\"370\"><h3>שאלה 6 — איזו טענה על ביטקוין נכונה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> mining pools מאגדות עבודה ומחלקות תגמולים בין כורים. אין בנק שמזרים ביטקוין לפי צורך; קבלה נוכחית של תשלום אינה מבטיחה שלא יתבטל בארגון מחדש, ו־double spending מצומצם הסתברותית ואינו נמנע לחלוטין בכל מודל תוקף.</p>\n<h4>עסקאות, הרשאת הוצאה ומצב הרשת</h4>\n<p>ביטקוין מתאר בעלות באמצעות פלטי עסקאות שטרם הוצאו, המכונים UTXO. פלט מגדיר סכום ותנאי הרשאה להוצאה עתידית. עסקה חדשה מצביעה על פלטים קודמים ומספקת את הנתונים הדרושים לקיום התנאים, בדרך רגילה חתימה מתאימה. אין צורך להשתתף בכרייה כדי ליצור עסקה או לקבל תשלום. המידע בשרשרת פומבי, ולכן אפשר לעקוב אחר פלטים של כתובת ולחשב יתרה בשרשרת נתונה, אף שהכתובת אינה חושפת בהכרח את זהות האדם או את כל כתובותיו.</p>\n<p>כורה מציע בלוק וצומת מאמת בודק אותו לפי כללי הקונצנזוס. בין הבדיקות נמצאים הרשאות ההוצאה, סכומים, העדר הוצאה כפולה באותו מצב, קישור להורה ותנאים קריפטוגרפיים. פרסום בלוק אינו מאפשר לכותבו לדרוש מאחרים לקבל עסקה בלתי תקפה. יש להבחין בין האפשרות לשנות קובץ מקומי לבין שכנוע הרשת לאמץ היסטוריה אחרת. אישורים נוספים מקשים על החלפת היסטוריה אך אינם הופכים כל קבלה להבטחה מוחלטת בכל מודל תוקף. אין בנקאי מרכזי המתקן תשלום שנשלח ליעד שגוי, וגם יוצר המערכת אינו מחזיק הרשאת ניהול שמאשרת לבדו שינויים. ההתנהגות נקבעת בידי תוכנות המשתתפים וכללי הקבלה שהם אוכפים.</p>\n<h4>כרייה, קושי וזמן הפצת מידע</h4>\n<p>Proof of Work דורש מכורה למצוא כותרת בלוק שהגיבוב שלה עומד ביעד מספרי שנקבע לפי הקושי. הכורה משנה nonce ונתונים נוספים במועמד ומנסה שוב; לא קיימת דרך כללית להבטיח שמספר מסוים של ניסיונות יניב פתרון. כשמוצאים בלוק, מפיצים אותו ברשת, וצמתים אחרים בודקים אותו. זמן ההפצה אינו אפס, ולכן לפרק זמן קצר משתתפים שונים עשויים לעבוד על מצבים שונים ולמצוא בלוקים מתחרים.</p>\n<p>היחס בין זמן יצירת בלוקים לזמן הפצתם חשוב לתפקוד הקונצנזוס. אם מוצאים בלוקים מהר בהרבה מכפי שהמידע מתפשט, שיעור העבודה על ענפים שלא יישארו בהיסטוריה המועדפת גדל. בעלי קישוריות מהירה יכולים ליהנות מיתרון, ושינוי מספר בדיקה בתוכנה אינו מקצר בעצמו את השהיית הרשת. מאגרי כרייה מאפשרים לכורים לאחד עבודה ולחלק תגמול, וכך לצמצם את השונות בהכנסה ביחס לכרייה בודדת; אין מכאן שינוי בתנאי תקפות הבלוק. גם תוקף בעל רוב כוח חישוב אינו יכול לזייף חתימה של אדם אחר, אבל הוא עשוי לצנזר עסקאות או לבנות ענף חלופי תקף. לכן צריך להבחין בין כמות כוח, מהירות גילוי, תקפות עסקאות ומדיניות בחירת השרשרת.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_07072023_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q042.html"},{"id":"Q043","year":"2023","stem":"במנגנון החלפת המפתחות של דיפי הלמן מחליטים על שני מספרים פומביים n,g ואז אליס ובוב כל אחד בוחרים מספר סודי x, ובעזרת מספרים אלו מחשבים את y. הסעיפים הבאים מתארים תהליכים שמתרחשים או קשורים למנגנון. בחרו את הסעיף שאינו נכון.","options":["אליס ובוב (כל אחד בנפרד) מעלים את x בחזקת g (מודולו n) וכך מחשבים את y. הם שולחים את התוצאה אחד לשני (אליס לבוב ובוב לאליס).","אליס מקבלת מבוב את y, ומעלה אותו בחזקת x (מודולו n). התוצאה המתקבלת היא המפתח המשותף.","אליס ובוב (כל אחד בנפרד) מעלים את g בחזקת x (מודולו n) וכך מחשבים את y. הם שולחים את התוצאה אחד לשני (אליס לבוב ובוב לאליס).","בוב מקבל מאליס את y, ומעלה אותו בחזקת x (מודולו n). תוקף מאזין אינו יכול לגלות את המפתח המשותף בגלל הקושי של בעיית הלוגריתם הדיסקרטי."],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":7},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"דיפי-הלמן והחלפת מפתחות","topic_score":0.452,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-07-07\" data-doc=\"original-07\" data-body-words=\"382\"><h3>שאלה 7 — איזה שלב בתיאור DH שגוי?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> סעיף א מחשב x^g mod n במקום g^x mod n. כל צד בוחר סוד x ומפרסם y=g^x mod n; הוא מעלה את y של הצד השני בחזקת הסוד שלו ומקבל g^(ab). הלוגריתם הדיסקרטי מסביר את הסתרת המעריך; הנחת CDH היא ההנחה הישירה לחישוב הסוד משני ערכים פומביים.</p>\n<h4>כיצד שני צדדים מחשבים סוד בלי לשלוח אותו</h4>\n<p>בדיפי־הלמן הצדדים מסכימים על קבוצה ועל בסיס פומבי מתאים. אליס בוחרת מעריך סודי a, מחשבת A=g^a ושולחת את A; בוב בוחר b ושולח B=g^b. כל החישובים נעשים בקבוצה שנבחרה, למשל מודולו מספר ראשוני. אליס מחשבת B^a ובוב מחשב A^b, ושני הביטויים שווים ל־g^(ab). הערכים a,b אינם נשלחים. לכן חילוף ערכים פומביים אינו שקול לשליחת המפתח הסימטרי עצמו בגלוי.</p>\n<p>בדוגמה חישובית יש לשמור היטב על תפקידי הבסיס והמעריך: g^a אינו a^g. אפשר לצמצם מודולו בכל כפל כדי להימנע ממספרים עצומים, ולבדוק את התוצאה משני הצדדים. הנחת הקושי הישירה היא שלא ניתן לחשב ביעילות את הסוד המשותף מתוך שני הערכים הפומביים בפרמטרים מתאימים. בעיית הלוגריתם הדיסקרטי מסבירה מדוע קשה לחלץ את המעריכים, אך אין צורך לטעון שכל מושגי הקושי שקולים מתמטית בכל קבוצה. בפרוטוקול שימושי מעבירים את הסוד דרך פונקציית גזירת מפתחות הקושרת גם הקשר. המספרים הזעירים שמופיעים בתרגיל ניתנים לחיפוש ידני ולכן מדגימים רק נכונות חשבונית, לא רמת אבטחה מעשית.</p>\n<h4>תוקף פעיל ובדיקת ערכי הפרוטוקול</h4>\n<p>הסכמה על סוד אינה זהה לאימות האדם שבצד השני. כאשר החלפת דיפי־הלמן רגילה אינה מאומתת, תוקף יכול להחליף את שני הערכים הפומביים וליצור סוד אחד מול אליס וסוד אחר מול בוב. הוא מפענח הודעות בצד אחד ומצפין אותן מחדש לצד האחר. לכן העובדה שאליס הצליחה להצפין אינה מוכיחה שבוב הוא היודע את המפתח השני. יש לקשור את חילוף הערכים לזהויות באמצעות חתימות, סוד קיים או פרוטוקול מאומת מתאים.</p>\n<p>בנוסף צריך לבדוק את הערכים שמתקבלים, ולא רק את זהות השולח. אם ערך כמו 1 מתקבל ללא בדיקה, העלאתו בכל מעריך נותנת 1, והתוקף יודע את תוצאת ההסכמה בלי ללמוד את המעריך הפרטי. בקבוצות מסוימות קיימים גם ערכים מסדר קטן שמצמצמים את מרחב הסודות האפשריים. הצפנת הודעה בדרך אינה מתקנת בהכרח בעיית תחום כזאת, מפני שכל אחד יכול להצפין לנמען במפתחו הפומבי. הניתוח צריך אפוא להפריד בין סודיות ערכי הביניים, תקפותם המתמטית ואימות ההקשר. בפרוטוקול שלם בודקים שייכות לקבוצה או לתת־חבורה הנדרשת, דוחים ערכים אסורים ומאמתים שהצד השני אכן מחזיק במפתח שנגזר. אין להניח שכל הפרטים האלה מתקיימים רק מפני שהופיע השם DH.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_07072023_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q043.html"},{"id":"Q044","year":"2023","stem":"נתון:\n• PKA הינו המפתח הפומבי של אליס ו SKA הוא המפתח הפרטי של אליס. בוב יודע את PKA.\n• PKB הינו המפתח הפומבי של בוב ו SKB הוא המפתח הפרטי של בוב. אליס יודעת את PKB.\n• Enc<sub>x</sub> הינה פונק׳ הצפנה סימטרית עם המפתח x, ו Dec<sub>x</sub> הינה פונק׳ הפענוח הסימטרית.\n• E<sub>x</sub> הינה פונק׳ הצפנה אסימטרית עם המפתח x , ו D<sub>y</sub> הינה פונק׳ הפענוח האסימטרית עם המפתח y.\n• H הינה פונק׳ hash.\n• S<sub>x</sub> הינה פונק׳ המבצעת חתימה דיגיטלית עם המפתח x, ו V<sub>y</sub> הינה פונק׳ וידוא חתימה דיגיטלית עם המפתח y. אליס רוצה לשלוח הודעה M (קצרה) בצורה מאובטחת לבוב. הדרישה היא שהאופן בו ההודעה נשלחת יקיים סודיות, ויאפשר לבוב וידוא אותנטיות השולח ואמינות המידע. להלן הצעות שונות כיצד אליס רוצה לעשות זאת. ביחרו את ההצעה (היחידה) שמקיימת את הדרישה.","options":["אליס שולחת לבוב:\nE<sub>PKB</sub>(M),S<sub>SKA</sub>(H(M))","אליס מייצרת מפתח סימטרי סודי s, ושולחת לבוב:\nE<sub>PKB</sub>(s),Enc<sub>s</sub>(M)","אליס מייצרת מפתח סימטרי סודי s, ושולחת לבוב:\nE<sub>PKA</sub>(s),Enc<sub>s</sub>(M)","אליס שולחת לבוב:\nE<sub>PKB</sub>(M),S<sub>SKB</sub>(H(M))"],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":8},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.271,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-07-08\" data-doc=\"original-07\" data-body-words=\"437\"><h3>שאלה 8 — סודיות, אותנטיות ושלמות: איזו הודעה מאליס לבוב מתאימה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> א: Enc_PKB(M), Sign_SKA(H(M)). בוב מפענח עם SKB ומאמת עם PKA. ב היא הצפנה היברידית בלי אימות אליס; כל אחד יכול לבחור s ולשלוח אותה. ג מצפינה את s עבור אליס ולכן בוב אינו יכול לפענחו. ד מחייבת את SKB שאינו ברשות אליס וגם אינה חתימה של אליס. <strong>דיוק:</strong> חתימה דטרמיניסטית פומבית על hash של הודעה קצרה מאפשרת לנחש הודעות ולאמת ניחוש בעזרת PKA; לכן א היא התשובה במודל הקורס, אך אינה מבטיחה סודיות סמנטית מלאה לטקסט בעל אנטרופיה נמוכה. פתרון חזק יותר מצפין גם את החתימה עם ההודעה.</p>\n<h4>מפתחות פומביים לעומת מפתחות סודיים</h4>\n<p>בקריפטוגרפיית מפתח פומבי לכל משתתף זוג מפתחות מקושרים: מפתח פומבי שמותר להפיץ ומפתח פרטי שרק בעליו אמור להחזיק. בהצפנה לנמען משתמשים במפתח הפומבי של הנמען, מפני שהפענוח דורש את המפתח הפרטי התואם. לכן אפשר לפרסם את מפתח בוב ועדיין לשמור הודעות המיועדות אליו בסוד. המפתח הפומבי אינו סיסמה שיש להעביר בערוץ נסתר; השאלה העיקרית בהפצתו היא כיצד יודעים שזהו באמת המפתח של בוב ולא מפתח של מתחזה.</p>\n<p>יש להבחין בין מאזין פסיבי לבין תוקף פעיל. מאזין רואה את הערכים שעוברים אך אינו משנה אותם; תוקף פעיל יכול להחליף מפתחות, לפתוח חיבורים ולשלוח הודעות משלו. פרוטוקול שעובד נגד הראשון עלול להיכשל נגד השני אם אין אימות זהות. תעודה חתומה או מפתח שנלמד מראש בערוץ אמין מספקים בסיס לשיוך הזהות, אך עדיין צריך להשתמש במפתח בתפקיד הנכון. דוגמה מעשית היא שליחת מפתח סימטרי אקראי בהצפנה לבוב ואז שימוש בו לקובץ גדול. מותר לכל אדם להצפין לבוב; עצם היכולת הזאת אינה מזהה את השולח כאליס. כדי לזהות אותה נדרשת גם הוכחה המתבססת על סוד שלה, למשל חתימה דיגיטלית.</p>\n<h4>חתימה, אימות ואי־התכחשות</h4>\n<p>חתימה דיגיטלית היא מנגנון שבו בעל מפתח פרטי יוצר הוכחה הקשורה לתוכן מסוים, וכל מי שמכיר את המפתח הפומבי המתאים יכול לבדוק אותה. בפועל חותמים בדרך כלל על ייצוג מקודד של תקציר ההודעה. תפקיד הגיבוב הוא לקשור את ההוכחה לכל תוכן ההודעה ביעילות; תפקיד מפתח החתימה הוא למנוע ממי שאינו מחזיק בסוד ליצור הוכחות חדשות. אלה שני תפקידים נפרדים, ולכן גיבוב ללא חתימה אינו מחליף חתימה, והצפנה לנמען אינה הוכחה לזהות השולח.</p>\n<p>מקבל חייב לבדוק שהמפתח הפומבי שבו הוא משתמש אכן משויך לחותם הרצוי. לאחר מכן עליו לבדוק את החתימה על התוכן המדויק שקיבל, לרבות הקשר חשוב כמו זהות נמען, סוג פעולה ומספר פעולה. חתימה על מפתח בלבד אינה בהכרח חתימה על כל ההודעות שייווצרו בעתיד בעזרתו. באופן דומה, חתימה תקפה אינה מבטיחה שהודעה טרייה: אפשר להחזיר הודעה חתומה ישנה ללא שינוי. כדי למנוע ביצוע חוזר נדרש מנגנון מתאים, כגון מזהה פעולה שנחתם ונבדק מול מצב שמור. אי־התכחשות היא יתרון לעומת MAC משותף, אך פירושה מותנה בהגנה על המפתח וביכולת לשייך אותו לבעליו; אין להסיק ממנה שהמסר מוצפן או שהחותם בהכרח פעל מרצונו החופשי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_07072023_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q044.html"},{"id":"Q045","year":"2023","stem":"ssh הוא פרוטוקול סטנדרטי לתקשורת בין קליינט לסרבר מעל TCP. שרת ssh מאזין בפורט 22 עבור בקשות חיבור נכנסות. ברשת מסויימת יש שרת ssh וכמו כן שרת פרוקסי. שרת הפרוקסי מאזין בפורט 8080 (בלבד). רוצים לבנות טבלת חוקים ב firewall שתאפשר תנועה נכנסת ויוצאת של תעבורת ssh בלבד, כלומר, רוצים לאפשר קיום תקשורת ssh מתוך הרשת החוצה ומחוץ לרשת פנימה, אבל, שלא תתאפשר שום תעבורה אחרת. לכן הגדירו את הטבלה הבאה: (סדר החוקים מופיע בעמודה הימנית והוא גם סדר השורות בטבלה. כלומר, החוק הראשון הוא ראשון גם מבחינת סדר וכו')\n| חוק מספר | כיוון תעבורה | Src IP | Src port | Destination IP | Destination Port | פרוטוקול | פעולה |\n| 1 | נכנסת | חיצונית | * | פנימית | 22 | TCP | Allow |\n| 2 | יוצאת | פנימית | 22 | חיצונית | * | TCP | Allow |\n| 3 | יוצאת | פנימית | * | חיצונית | 22 | TCP | Allow |\n| 4 | נכנסת | חיצונית | 22 | פנימית | * | TCP | Allow |\n| 5 | * | * | * | * | * | * | Drop |\nאיזה טענה אינה נכונה?","options":["תוקף שנמצא מחוץ לרשת אינו יכול להקים חיבור TCP מול שרת הפרוקסי שנמצא בתוך הרשת.","ניתן היה לשפר את הבטיחות של הטבלה הנ\"ל בעזרת הוספת עמודת flags, כלומר, לאפשר להגדיר חוק גם לפי דגלי TCP.","החוקים כתובים בצורת whitelist.","טבלת החוקים המתוארת בשאלה מאפשרת תנועה נכנסת ויוצאת של תעבורת ssh מהרשת החוצה ומחוץ לרשת פנימה."],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":9},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.219,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-07-09\" data-doc=\"original-07\" data-body-words=\"431\"><h3>שאלה 9 — חוקי firewall ל־SSH בלבד — איזו טענה שגויה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> הטענה שתוקף חיצוני אינו יכול להתחבר לפרוקסי הפנימי שגויה. הוא פותח חיבור ממקור TCP port 22 ליעד proxy:8080: כלל 4 מאשר כניסה ממקור 22 לכל פורט פנימי; תשובת הפרוקסי יוצאת אל port 22 ומאושרת בכלל 3. לכן ניתן להשלים TCP handshake בלי פרוטוקול SSH. סינון flags מסייע אך אינו אימות SSH; עדיף מעקב מצב המאפשר תשובות רק לחיבור יוצא מוכר. הכללים הם allowlist עם ברירת מחדל Drop.</p>\n<h4>סינון חבילות, מדיניות ומצב חיבורים</h4>\n<p>חומת אש בוחנת תעבורה העוברת דרכה ומחליטה לאשר או לדחות לפי כללים. מסנן חבילות יכול להשתמש בכיוון התעבורה, כתובות מקור ויעד, פורטים ופרוטוקול. כללי allowlist מאפשרים רק את התעבורה שהוגדרה ומשאירים כלל דחייה כברירת מחדל. עם זאת, מספר פורט אינו הוכחה לזהות יישום: תוקף יכול לנסות לשלוח חיבור מפורט שבחר, ושירות יכול לרוץ בפורט שאינו המקובל שלו. לכן צריך לקרוא את תנאי הכלל ממש, ולא את כוונת האדם שכתב אותו.</p>\n<p>חומת אש שמנהלת מצב יכולה לבדוק אם חבילה היא חלק מחיבור שכבר נפתח ואושר. מסנן חסר מצב שמאפשר תשובות רק בגלל פורט מקור מוכר עלול לאפשר גם התחלת חיבור זדוני הנראית כך. סינון דגלים משפר דיוק במקרים מסוימים, אך אינו תחליף מלא למעקב מצב ולאימות יישומי. יש גם גבול טופולוגי: חומת אש בגבול הרשת אינה רואה בהכרח חבילות ששני מחשבים פנימיים מחליפים ישירות. בדומה לכך, בלי בדיקת תוכן יישום אין להניח שהיא מזהה קוד זדוני בתוך אימייל. סינון מקורות חשודים יכול לצמצם זיוף כתובות, אבל אינו הופך כל כתובת מקור לזהות אמינה. לכל כלל צריך לבנות גם מסלול הלוך וגם מסלול חזור ולבדוק אם שניהם עוברים.</p>\n<h4>לחיצת היד של TCP והמשמעות של RST</h4>\n<p>בחיבור TCP רגיל הלקוח שולח SYN, השרת מחזיר SYN+ACK, והלקוח משלים ACK. במימוש ששומר מצב כבר אחרי ההודעה הראשונה, כל ניסיון התחלה יכול לתפוס מקום גם לפני שנבדק שהמקור באמת מסוגל לקבל תשובה. SYN flood מנצלת זאת באמצעות הרבה ניסיונות שאינם מושלמים. אם כתובת המקור מזויפת, התשובה הולכת למחשב אחר ולא לתוקף, ולכן צריך לבחון מה אותו מחשב יעשה כשיקבל הודעה שלא ציפה לה.</p>\n<p>מחשב חי עשוי להחזיר RST עבור חיבור שאינו מכיר. הודעה זו יכולה לגרום לשרת לשחרר את המצב החצי פתוח, ולכן מבחינת התוקף זו תוצאה לא רצויה. בחירת מקורות שאינם משיבים מצמצמת את האפשרות הזו. מנגד, כאשר השרת משתמש ב־SYN cookies, הוא מקודד מידע מתאים במספר הרצף של תשובתו ואינו חייב לשמור את כל מצב החיבור מיד. רק ACK תקין מאפשר לשחזר ולאשר את המידע. המנגנון מצמצם סוג מסוים של התשת מצב, אך אינו מבטיח חסינות מהצפת רוחב פס או מכל תקיפת יישום. אין גם קשר בין המילה cookies כאן לבין cookie הזדהות של דפדפן. אלה עצמים שונים לגמרי, ולכן SYN cookies אינם הגנת CSRF ואינם בדיקת הרשאות של משתמש באתר.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_07072023_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q045.html"},{"id":"Q046","year":"2023","stem":"להלן מספר הצעות לשינויים לרשת ביטקוין, כאשר כל שינוי מלווה בטענה. עליכם לבחור את הסעיף עם הטענה שאינה נכונה.","options":["כדי לחסוך בחשמל, מציעים שכריית בלוקים חדשים תתבצע רק כאשר יש כמות x של עסקאות חדשות שרוצות להיכנס לבלוקצ׳יין. כלומר, אם כרגע ידוע על פחות מ x עסקאות חדשות, הminerים לא עושים כלום, והם יתחילו לחפש את הבלוק הבא רק כאשר יהיו x עסקאות חדשות או יותר. שינוי זה אינו מאפשר לתוקף לבצע double-spending.","לאליס יש בעלות על 1 ביטקוין, ותוקף רשע ומרושע רוצה למנוע ממנה להעביר אותו למישהו אחר. התוקף שלנו הינו גאון, והצליח לפתח חומרה מיוחדת שמחשבת hash יותר מהר מכל miner קיים. למעשה, החומרה הזו כל כך חזקה, כך שכאשר הוא משתמש בה, היא מהווה 51% מהכוח החישובי של כל רשת הביטקוין. חומרה זו מאפשרת לו להשיג את מטרתו, אפילו אם אליס לעיתים תחשוב (זמנית) שהיא הצליחה להעביר את הביטקוין שלה למישהו אחר.","אליס מחליטה לממש בעצמה תוכנה שתעקוב אחר הבלוקצ׳יין ותוודא את תקינות הבלוקים והטרנזקציות בו. אליס חוששת שיגמר לה הזיכרון אם היא תשמור את כל הבלוקצ׳יין. לכן, במקום לשמור את כל הבלוקצ׳יין, היא שומרת את הבלוק האחרון שנוסף לבלוקצ׳יין ואת רשימת כל העסקאות שעדיין לא בוזבזו. כאשר היא שומעת על בלוק חדש שנוסף, היא עושה את כל הבדיקות הרגילות שמחשבים שחברים בביטקוין עושים, כלומר, שהבלוק החדש כולל hash של הבלוק האחרון הנוכחי, שכל העסקאות בבלוק החדש תקינות (חתומות תקין, מבזבזות עסקאות שלא בוזבזו בלבד וכו׳), הhash של הבלוק מכיל מספיק אפסים וכו׳. אם הבלוק תקין, התוכנה שומרת אותו במקום הבלוק האחרון הנוכחי ששמור, ומעדכנת את רשימת העסקאות שלא בוזבזו בהתאם. המימוש הזה בעייתי ביחס למימוש הרגיל (שיש לו את כל הבלוקצ׳יין), בגלל שאינו מתמודד טוב עם פיצולים (forks).","נניח שלוקח 1 דקה עד שעסקה חדשה שפורסמה או בלוק חדש שנמצא מגיעים לכל המחשבים ברשת הביטקוין מהרגע שהם נוצרו (שהרי ביטקוין היא רשת peer to peer ולוקח זמן למידע להתפשט ברשת ממחשב אחד לשני). מציעים להוריד את משך הזמן הממוצע עד מציאת בלוק חדש מ10 דק׳ ל10 שניות. רעיון זה אינו טוב."],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":10},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.25,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-07-10\" data-doc=\"original-07\" data-body-words=\"403\"><h3>שאלה 10 — איזו טענה על שינויים בביטקוין שגויה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> סעיף א טוען שהפסקת הכרייה עד הגעה לסף עסקאות אינה מאפשרת double spending. דווקא בזמן שכורים ישרים ממתינים תוקף יכול לצבור עבודה ולנסות לפרסם ענף המבטל תשלום. יש להתייחס לסף ולכללי תקפות כפי שמוסבר במבחן נובמבר 2022. יתר הסעיפים מתארים נכונה סכנת צנזורה/ארגון מחדש בידי רוב כוח, כשל קליינט שאין לו שחזור ענפים, וקצב בלוקים מהיר מזמן ההפצה.</p>\n<h4>כרייה, קושי וזמן הפצת מידע</h4>\n<p>Proof of Work דורש מכורה למצוא כותרת בלוק שהגיבוב שלה עומד ביעד מספרי שנקבע לפי הקושי. הכורה משנה nonce ונתונים נוספים במועמד ומנסה שוב; לא קיימת דרך כללית להבטיח שמספר מסוים של ניסיונות יניב פתרון. כשמוצאים בלוק, מפיצים אותו ברשת, וצמתים אחרים בודקים אותו. זמן ההפצה אינו אפס, ולכן לפרק זמן קצר משתתפים שונים עשויים לעבוד על מצבים שונים ולמצוא בלוקים מתחרים.</p>\n<p>היחס בין זמן יצירת בלוקים לזמן הפצתם חשוב לתפקוד הקונצנזוס. אם מוצאים בלוקים מהר בהרבה מכפי שהמידע מתפשט, שיעור העבודה על ענפים שלא יישארו בהיסטוריה המועדפת גדל. בעלי קישוריות מהירה יכולים ליהנות מיתרון, ושינוי מספר בדיקה בתוכנה אינו מקצר בעצמו את השהיית הרשת. מאגרי כרייה מאפשרים לכורים לאחד עבודה ולחלק תגמול, וכך לצמצם את השונות בהכנסה ביחס לכרייה בודדת; אין מכאן שינוי בתנאי תקפות הבלוק. גם תוקף בעל רוב כוח חישוב אינו יכול לזייף חתימה של אדם אחר, אבל הוא עשוי לצנזר עסקאות או לבנות ענף חלופי תקף. לכן צריך להבחין בין כמות כוח, מהירות גילוי, תקפות עסקאות ומדיניות בחירת השרשרת.</p>\n<h4>פיצול זמני, ארגון מחדש ושינוי כללים</h4>\n<p>כאשר שני בלוקים תקפים נמצאים כמעט במקביל לאותו הורה, צמתים שונים עשויים לראות ענפים שונים. בהמשך הרשת מעדיפה ענף לפי העבודה המצטברת, ולא לפי העובדה שמחשב יחיד שמע עליו ראשון. מעבר מענף שנבחר קודם לענף עדיף נקרא ארגון מחדש, והוא מחייב לבטל את השפעת עסקאות הענף הישן ולהחיל את החדשות. לכן שמירת מצב נוכחי בלבד אינה מספיקה תמיד: צריך דרך לשחזר מצב קודם, מידע משלים או אפשרות אימות מחדש.</p>\n<p>המונחים soft fork ו־hard fork עוסקים גם ביחס בין כללי תקפות חדשים לישנים, ולא רק בפיצול זמני שנגרם מהשהיה. אם כל בלוק שמותר לפי הכללים החדשים מותר גם לפי הישנים, השינוי מצמצם את קבוצת הבלוקים התקפים ויכול להיות soft fork. אם הכללים החדשים מתירים בלוק שצומת ישן דוחה, זהו כיוון התאימות של hard fork. עצם השם ״שיפור״, גודל השינוי בקוד או החיסכון במקום אינם קובעים את הסיווג. צריך להראות מה צומת שלא עודכן יעשה לבלוק חדש. גם תאימות אינה הבטחה שלא יהיו בעיות אימוץ, וצומת ישן אינו בהכרח אוכף את ההגבלות החדשות אף כשהוא מקבל את הענף שנוצר על פיהן.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_07072023_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q046.html"},{"id":"Q047","year":"2023","stem":"הבטיחות של מנגנון החלפת המפתחות של דיפי-הלמן מתבססת על?","options":["בעיית הלוגריתם הדיסקרטי","פרדוקס יום ההולדת","מנגנון One time pad","עקרון קרקהוף"],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":1},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"דיפי-הלמן והחלפת מפתחות","topic_score":0.309,"exam_count":1,"in_sample_exam":false,"variant_group":"V08","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-09-01\" data-doc=\"original-09\" data-body-words=\"372\"><h3>שאלה 1 — על איזו בעיה נשענת בטיחות DH?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> בעיית הלוגריתם הדיסקרטי היא התשובה ברמת הקורס: קשה לשחזר a מתוך g^a בפרמטרים מתאימים. באופן מדויק, חישוב סוד g^(ab) מערכים g^a,g^b קשור להנחת CDH; קושי DLP לבדו אינו שקילות מוכחת בכל קבוצה. DH ללא אימות חשוף ל־MitM.</p>\n<h4>כיצד שני צדדים מחשבים סוד בלי לשלוח אותו</h4>\n<p>בדיפי־הלמן הצדדים מסכימים על קבוצה ועל בסיס פומבי מתאים. אליס בוחרת מעריך סודי a, מחשבת A=g^a ושולחת את A; בוב בוחר b ושולח B=g^b. כל החישובים נעשים בקבוצה שנבחרה, למשל מודולו מספר ראשוני. אליס מחשבת B^a ובוב מחשב A^b, ושני הביטויים שווים ל־g^(ab). הערכים a,b אינם נשלחים. לכן חילוף ערכים פומביים אינו שקול לשליחת המפתח הסימטרי עצמו בגלוי.</p>\n<p>בדוגמה חישובית יש לשמור היטב על תפקידי הבסיס והמעריך: g^a אינו a^g. אפשר לצמצם מודולו בכל כפל כדי להימנע ממספרים עצומים, ולבדוק את התוצאה משני הצדדים. הנחת הקושי הישירה היא שלא ניתן לחשב ביעילות את הסוד המשותף מתוך שני הערכים הפומביים בפרמטרים מתאימים. בעיית הלוגריתם הדיסקרטי מסבירה מדוע קשה לחלץ את המעריכים, אך אין צורך לטעון שכל מושגי הקושי שקולים מתמטית בכל קבוצה. בפרוטוקול שימושי מעבירים את הסוד דרך פונקציית גזירת מפתחות הקושרת גם הקשר. המספרים הזעירים שמופיעים בתרגיל ניתנים לחיפוש ידני ולכן מדגימים רק נכונות חשבונית, לא רמת אבטחה מעשית.</p>\n<h4>תוקף פעיל ובדיקת ערכי הפרוטוקול</h4>\n<p>הסכמה על סוד אינה זהה לאימות האדם שבצד השני. כאשר החלפת דיפי־הלמן רגילה אינה מאומתת, תוקף יכול להחליף את שני הערכים הפומביים וליצור סוד אחד מול אליס וסוד אחר מול בוב. הוא מפענח הודעות בצד אחד ומצפין אותן מחדש לצד האחר. לכן העובדה שאליס הצליחה להצפין אינה מוכיחה שבוב הוא היודע את המפתח השני. יש לקשור את חילוף הערכים לזהויות באמצעות חתימות, סוד קיים או פרוטוקול מאומת מתאים.</p>\n<p>בנוסף צריך לבדוק את הערכים שמתקבלים, ולא רק את זהות השולח. אם ערך כמו 1 מתקבל ללא בדיקה, העלאתו בכל מעריך נותנת 1, והתוקף יודע את תוצאת ההסכמה בלי ללמוד את המעריך הפרטי. בקבוצות מסוימות קיימים גם ערכים מסדר קטן שמצמצמים את מרחב הסודות האפשריים. הצפנת הודעה בדרך אינה מתקנת בהכרח בעיית תחום כזאת, מפני שכל אחד יכול להצפין לנמען במפתחו הפומבי. הניתוח צריך אפוא להפריד בין סודיות ערכי הביניים, תקפותם המתמטית ואימות ההקשר. בפרוטוקול שלם בודקים שייכות לקבוצה או לתת־חבורה הנדרשת, דוחים ערכים אסורים ומאמתים שהצד השני אכן מחזיק במפתח שנגזר. אין להניח שכל הפרטים האלה מתקיימים רק מפני שהופיע השם DH.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_08082023_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q047.html"},{"id":"Q048","year":"2023","stem":"איזו טענה אינה נכונה?","options":["ב Certificate Transparency משתמשים ב cookie למציאת התעודה הבאה","בביטקוין משתמשים ב proof of work למציאת הבלוק הבא","ב Certificate Transparency משתמשים במבנה הנתונים עץ מרקל","בביטקוין משתמשים במבנה הנתונים עץ מרקל"],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":2},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.232,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-09-02\" data-doc=\"original-09\" data-body-words=\"386\"><h3>שאלה 2 — CT ו־Bitcoin — איזו טענה שגויה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> CT אינו מוצא ״תעודה הבאה״ בעזרת cookie. ב־Certificate Transparency לוגים מחזיקים רישום append-only של תעודות/קדם־תעודות, ומוניטורים קוראים ומנטרים את הלוגים כדי לגלות הנפקות חשודות. המבנה משתמש בעץ מרקל להוכחות הכללה ועקביות; המוניטורים אינם לוגים של לוגרים אחרים ואינם מסתפקים בפנייה ישירה ל־CA. בביטקוין PoW משמש למציאת כותרת בלוק מתאימה, ועץ מרקל מתחייב על העסקאות.</p>\n<h4>שקיפות תעודות אינה החלטה על תוקף התעודה</h4>\n<p>Certificate Transparency מוסיף יכולת תיעוד וביקורת להנפקת תעודות. לוגר מקבל רשומות ומתחזק יומן שבו אפשר לבדוק הכללה של תעודה. מוניטורים קוראים את היומנים ומחפשים הנפקות חריגות, למשל תעודה לדומיין שלהם שהונפקה בלי ידיעתם. מכיוון שגם רשות אישור מהימנה יכולה לטעות או להיפגע, פרסום ההנפקות מסייע לזהות אירועים שלא היו נחשפים מתוך בדיקת חתימה של לקוח בודד.</p>\n<p>עץ מרקל מאפשר להתחייב על מספר גדול של רשומות בשורש קצר ולהציג ראיות יעילות. הוכחת הכללה מראה שרשומה כלולה בעץ מסוים; הוכחת עקביות בוחנת שהעץ גדל בלי לשנות את עברו. התחייבות לוגר לתיעוד בעתיד אינה זהה להוכחה שהרשומה כבר מופיעה בעץ נוכחי. אף אחת מן הראיות האלה אינה מוכיחה שלבעל התעודה הייתה זכות לקבל אותה, שמפתחו לא נגנב או שהתעודה לא בוטלה. אלה שאלות נפרדות הדורשות בדיקות אחרות. לכן CT משלים את PKI ואינו מחליף את שרשרת האמון או את בדיקות הביטול. cookies אינם מנגנון בחירת הרשומה הבאה ביומן, ומוניטור אינו גורם שתפקידו לחתום על תעודות במקום רשות האישור.</p>\n<h4>בניית התחייבות על הרבה רשומות</h4>\n<p>עץ מרקל הוא מבנה שבו העלים מייצגים ערכי גיבוב של נתונים, וכל צומת פנימי מחושב מתוך ילדיו בסדר מוגדר. חישוב חוזר עד לשורש נותן ערך קצר שמתחייב, בהנחות הגיבוב המתאימות, על הנתונים ועל מבנה העץ. כדי להראות שעלה מסוים כלול בעץ אין צורך להעביר את כל העלים: אפשר להעביר את ערכי האחים במסלול לשורש ולציין באיזה צד כל אחד נמצא. המאמת משחזר את השורש ומשווה לערך ידוע ומאומת.</p>\n<p>סדר הילדים הוא חלק מהנתונים. בדרך כלל H(L||R) אינו H(R||L), ולכן יש לקרוא תרגיל בעברית בזהירות כאשר מספרים ומחרוזות לטיניות מוצגים בכיוונים שונים. בבניית העץ הנתון עדיף לכתוב כל רמה משמאל לימין ולהשתמש באותה פונקציה בדיוק לכל זוג שכנים. צריך להבחין גם בין hash של תוכן העלה לבין פונקציית החיבור הפנימית שהתרגיל הגדיר. אם פונקציית צעצוע פשוט שולפת תווים, מחשבים אותה כפי שנמסרה אבל אין מסיקים מכך עמידות קריפטוגרפית. המבנה משמש גם בהתחייבות לעסקאות של בלוק וגם ביומני שקיפות תעודות; השימוש המשותף אינו אומר שכל מנגנון יעילות או בדיקת תעודות אחר משתמש בהכרח בעץ כזה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_08082023_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q048.html"},{"id":"Q049","year":"2023","stem":"איזו טענה אינה נכונה?","options":["ב One time pad הבטיחות תלויה בטקסט שרוצים להצפין","ב One time pad לא משתמשים באותו מפתח יותר מפעם אחת","ב One time pad המפתח צריך להיות בגודל הטקסט","ב One time pad ההצפנה והפענוח מתבצעות על ידי xor"],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":3},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.285,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-09-03\" data-doc=\"original-09\" data-body-words=\"387\"><h3>שאלה 3 — OTP — איזו טענה שגויה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> בטיחות OTP תקין אינה תלויה בתוכן הטקסט. עבור מפתח אחיד, בלתי תלוי, סודי וחד־פעמי באורך ההודעה, לכל c,m באורך n מתקיים Pr[C=c|M=m]=2^(−n). ההצפנה והפענוח הן XOR; שימוש חוזר חושף C1 XOR C2=M1 XOR M2. אורך ההודעה עצמו עשוי להיחשף.</p>\n<h4>סודיות מושלמת ותנאי השימוש החד־פעמי</h4>\n<p>ב־One Time Pad בוחרים מפתח אקראי אחיד, בלתי תלוי בהודעה, באורך המספיק לה, ומשתמשים בו פעם אחת בלבד. בייצוג ביטים ההצפנה היא XOR של ההודעה והמפתח, והפענוח הוא XOR נוסף עם אותו מפתח. עבור כל טקסט מוצפן וכל הודעה אפשרית באותו אורך קיים בדיוק מפתח מתאים. כאשר כל המפתחות שווי הסתברות, הצפנה אינה מעדיפה הודעה אחת על אחרת, ולכן אין למאזין מידע נוסף על התוכן מעבר למידע שכבר היה לו ולאורך.</p>\n<p>הבטחה חזקה זו תלויה בתנאים. אם אותו מפתח משמש שתי הודעות, XOR של שני הטקסטים המוצפנים מבטל את המפתח וחושף XOR של ההודעות. מידע לשוני או קטע ידוע יכולים לסייע להמשך שחזור. אם המפתח נוצר ממקור קטן וצפוי, גם הארכתו אינה מייצרת סודיות מושלמת. הבעיה המעשית של העברת סוד ארוך לצד השני נשארת משמעותית; אי אפשר פשוט לשלוח את ה־pad גלוי בערוץ שהמאזין רואה. מנגד, אין תנאי שהטקסט יהיה בעל שפה או תוכן מסוימים כדי לקבל את הוכחת הסודיות. זו אחת הדרכים להבחין בין בטיחות אלגוריתמית מותנית לבין השאלה עד כמה נוח או אפשרי ליישם את המנגנון במערכת מסוימת.</p>\n<h4>המושגים והנחות האבטחה</h4>\n<p>ניתוח קריפטוגרפי מתחיל בשאלה מה רוצים להגן, מה התוקף יודע ואילו פעולות מותרות לו. סודיות פירושה שהמידע אינו נחשף למי שאינו מורשה; שלמות פירושה שאפשר לזהות שינוי לא מורשה; אותנטיות קושרת מידע לגורם שמותר לו ליצור אותו. אלה תכונות שונות, ולכן מנגנון שמצליח במשימה אחת אינו מקבל אוטומטית את האחרות. למשל, הצפנה יכולה להסתיר סכום העברה בלי להוכיח מי בחר אותו, וחתימה יכולה להוכיח מי אישר מסמך בלי להסתיר את תוכנו. הבחנה זו חשובה במיוחד כשנוסח החלופה משתמש במילה הכללית ״מאובטח״.</p>\n<p>עקרון העבודה הוא להניח שהאלגוריתם עצמו ידוע לתוקף, ורק חומר המפתח שנדרש להיות סודי נשאר נסתר. מחפשים אפוא מה תוקף יכול לחשב מתוך המידע הגלוי, ולא מסתמכים על כך שאינו מכיר את התוכנה. גם גודל המפתח אינו מספיק לבדו: המפתח צריך להיבחר כראוי, להישמר בצורה מתאימה ולהיות משויך לתפקיד הנכון. במענה לבחינה יש לנסח את ההנחות במפורש, להראות פעולה קונקרטית של המקבל או של התוקף, ואז להסיק איזו תכונה מתקיימת ואיזו חסרה. הצבעה על שם של אלגוריתם בלי להסביר את תפקידו אינה מוכיחה שהשימוש המסוים בו נכון.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_08082023_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q049.html"},{"id":"Q050","year":"2023","stem":"מחשב סטנדרטי ברשת ביטקוין שמריץ תוכנת ביטקוין סטנדרטית מקבל בלוק חדש והוסיף אותו לעותק המקומי של הבלוקצ׳יין (בתור הבלוק הבא בתור). איזה מבין הטענות הבאות אינה נכונה?","options":["המחשב מוסיף חתימה משלו לבלוק.","ה hash של הבלוק מתחיל עם מספיק אפסים בהתאם לכמות הנדרשת כעת.","הבלוק אינו מכיל double spending של טרנזקציה אחרת שקיימת באחד מהבלוקים שקודמים לו בבלוקצ׳יין.","הבלוק מכיל טרנזקציה אחת לפחות."],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":4},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":4},{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.281,"exam_count":2,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-09-04\" data-doc=\"original-09\" data-body-words=\"380\"><h3>שאלה 4 — צומת קיבל בלוק חדש — איזו טענה שגויה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> צומת מאמת אינו מוסיף חתימה משלו לבלוק. הוא בודק PoW מול target, קישור להורה ותקפות עסקאות ומעדכן את המצב. בלוק חייב לכלול coinbase, ולכן יש לפחות עסקה אחת. ״מספיק אפסים״ הוא קירוב לימודי להשוואת hash מספרי ליעד, שאינו תמיד מספר שלם של ספרות אפס.</p>\n<h4>עסקאות, הרשאת הוצאה ומצב הרשת</h4>\n<p>ביטקוין מתאר בעלות באמצעות פלטי עסקאות שטרם הוצאו, המכונים UTXO. פלט מגדיר סכום ותנאי הרשאה להוצאה עתידית. עסקה חדשה מצביעה על פלטים קודמים ומספקת את הנתונים הדרושים לקיום התנאים, בדרך רגילה חתימה מתאימה. אין צורך להשתתף בכרייה כדי ליצור עסקה או לקבל תשלום. המידע בשרשרת פומבי, ולכן אפשר לעקוב אחר פלטים של כתובת ולחשב יתרה בשרשרת נתונה, אף שהכתובת אינה חושפת בהכרח את זהות האדם או את כל כתובותיו.</p>\n<p>כורה מציע בלוק וצומת מאמת בודק אותו לפי כללי הקונצנזוס. בין הבדיקות נמצאים הרשאות ההוצאה, סכומים, העדר הוצאה כפולה באותו מצב, קישור להורה ותנאים קריפטוגרפיים. פרסום בלוק אינו מאפשר לכותבו לדרוש מאחרים לקבל עסקה בלתי תקפה. יש להבחין בין האפשרות לשנות קובץ מקומי לבין שכנוע הרשת לאמץ היסטוריה אחרת. אישורים נוספים מקשים על החלפת היסטוריה אך אינם הופכים כל קבלה להבטחה מוחלטת בכל מודל תוקף. אין בנקאי מרכזי המתקן תשלום שנשלח ליעד שגוי, וגם יוצר המערכת אינו מחזיק הרשאת ניהול שמאשרת לבדו שינויים. ההתנהגות נקבעת בידי תוכנות המשתתפים וכללי הקבלה שהם אוכפים.</p>\n<h4>כרייה, קושי וזמן הפצת מידע</h4>\n<p>Proof of Work דורש מכורה למצוא כותרת בלוק שהגיבוב שלה עומד ביעד מספרי שנקבע לפי הקושי. הכורה משנה nonce ונתונים נוספים במועמד ומנסה שוב; לא קיימת דרך כללית להבטיח שמספר מסוים של ניסיונות יניב פתרון. כשמוצאים בלוק, מפיצים אותו ברשת, וצמתים אחרים בודקים אותו. זמן ההפצה אינו אפס, ולכן לפרק זמן קצר משתתפים שונים עשויים לעבוד על מצבים שונים ולמצוא בלוקים מתחרים.</p>\n<p>היחס בין זמן יצירת בלוקים לזמן הפצתם חשוב לתפקוד הקונצנזוס. אם מוצאים בלוקים מהר בהרבה מכפי שהמידע מתפשט, שיעור העבודה על ענפים שלא יישארו בהיסטוריה המועדפת גדל. בעלי קישוריות מהירה יכולים ליהנות מיתרון, ושינוי מספר בדיקה בתוכנה אינו מקצר בעצמו את השהיית הרשת. מאגרי כרייה מאפשרים לכורים לאחד עבודה ולחלק תגמול, וכך לצמצם את השונות בהכנסה ביחס לכרייה בודדת; אין מכאן שינוי בתנאי תקפות הבלוק. גם תוקף בעל רוב כוח חישוב אינו יכול לזייף חתימה של אדם אחר, אבל הוא עשוי לצנזר עסקאות או לבנות ענף חלופי תקף. לכן צריך להבחין בין כמות כוח, מהירות גילוי, תקפות עסקאות ומדיניות בחירת השרשרת.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_08082023_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q050.html"},{"id":"Q051","year":"2023","stem":"תעודות הינן רכיב חשוב בתקשורת מאובטחת. איזה מידע אסור שיופיע בתעודה?","options":["מפתח פרטי","התאריך שממנו התעודה תקפה","החתימה הדיגיטלית של ה CA שחתם על התעודה","השם של ה CA שחתם על התעודה"],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":5},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.173,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-09-05\" data-doc=\"original-09\" data-body-words=\"362\"><h3>שאלה 5 — מה אסור שיופיע בתעודה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> מפתח פרטי. תעודה נועדה להפצה וכוללת מפתח פומבי, זהות, תאריכי תוקף, מנפיק וחתימתו. חשיפת המפתח הפרטי מאפשרת התחזות לבעליו; שאר השדות המוצעים הם שדות תקינים.</p>\n<h4>תעודות ושרשרת אמון</h4>\n<p>תעודה דיגיטלית קושרת זהות למפתח פומבי ומכילה חתימה של גורם מנפיק. היא אינה מכילה את המפתח הפרטי, שהרי התעודה נשלחת ברשת והסוד אמור להישאר אצל בעליו. בעל האתר יכול ליצור את זוג המפתחות בעצמו ולהעביר למנפיק בקשה המכילה את המפתח הפומבי. המנפיק מבצע את בדיקותיו וחותם על תעודה; אין מכאן צורך שהמנפיק ייצור את סוד האתר או ילמד אותו.</p>\n<p>הלקוח אינו סומך על חתימה רק מפני שהיא תקפה מתמטית. הוא צריך להתחיל בעוגן אמון מוכר, לבדוק את שרשרת החתימות ואת מגבלות ההאצלה עד לתעודת האתר, ולוודא שהשם שהתבקש מתאים לשמות שבתעודה. תאריך תוקף, שימושי מפתח ומצב ביטול הם בדיקות נוספות בהתאם למדיניות. בדרך נפוצה רשות שורש חותמת על רשות ביניים, ורשות הביניים מנפיקה את תעודת האתר. לכן המנפיק הישיר אינו חייב להיות מותקן בעצמו כרשות שורש בדפדפן. אם האתר חותם על התעודה שלו, אפשר לבדוק שהחתימה מתאימה למפתח שבו, אך הדבר אינו יוצר מאליו אמון בזהותו. גם תעודה אמינה אינה מעידה שהשרת נקי מחולשות יישום או שהמשתמש התכוון לכל פעולה שתעבור בערוץ.</p>\n<h4>מפתחות פומביים לעומת מפתחות סודיים</h4>\n<p>בקריפטוגרפיית מפתח פומבי לכל משתתף זוג מפתחות מקושרים: מפתח פומבי שמותר להפיץ ומפתח פרטי שרק בעליו אמור להחזיק. בהצפנה לנמען משתמשים במפתח הפומבי של הנמען, מפני שהפענוח דורש את המפתח הפרטי התואם. לכן אפשר לפרסם את מפתח בוב ועדיין לשמור הודעות המיועדות אליו בסוד. המפתח הפומבי אינו סיסמה שיש להעביר בערוץ נסתר; השאלה העיקרית בהפצתו היא כיצד יודעים שזהו באמת המפתח של בוב ולא מפתח של מתחזה.</p>\n<p>יש להבחין בין מאזין פסיבי לבין תוקף פעיל. מאזין רואה את הערכים שעוברים אך אינו משנה אותם; תוקף פעיל יכול להחליף מפתחות, לפתוח חיבורים ולשלוח הודעות משלו. פרוטוקול שעובד נגד הראשון עלול להיכשל נגד השני אם אין אימות זהות. תעודה חתומה או מפתח שנלמד מראש בערוץ אמין מספקים בסיס לשיוך הזהות, אך עדיין צריך להשתמש במפתח בתפקיד הנכון. דוגמה מעשית היא שליחת מפתח סימטרי אקראי בהצפנה לבוב ואז שימוש בו לקובץ גדול. מותר לכל אדם להצפין לבוב; עצם היכולת הזאת אינה מזהה את השולח כאליס. כדי לזהות אותה נדרשת גם הוכחה המתבססת על סוד שלה, למשל חתימה דיגיטלית.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_08082023_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q051.html"},{"id":"Q052","year":"2023","stem":"איזו מהטענות הבאות נכונה?","options":["שולחים בקשת DNS מפורט אקראי כדי להקשות על ניחוש הפורט ע\"י תוקף.","בכדי ש SSL/TLS יגן על מידע רגיש, חובה על הלקוח והשרת להיות מצוידים בתעודה תקנית המוכיחה את זהותם.","אפשר להשתמש בבוטים רק למטרות DDoS.","משתמשים ב DMZ כאשר לא ניתן להשתמש בחומת אש."],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":6},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.163,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-09-06\" data-doc=\"original-09\" data-body-words=\"385\"><h3>שאלה 6 — DNS, TLS, bots ו־DMZ — הטענה הנכונה</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> פורט מקור אקראי לכל בקשת DNS מוסיף אנטרופיה ומקשה ניחוש תשובה בידי off-path attacker. בדרך הרגילה אין חובה לתעודת לקוח ב־TLS; בוטים משמשים גם לספאם ולמטרות אחרות; DMZ היא הפרדה רשתית שבדרך כלל נתמכת בסינון, לא תחליף הכרחי להיעדר firewall.</p>\n<h4>התאמת תשובת DNS לשאילתה והזדמנות הזיוף</h4>\n<p>resolver הוא רכיב המבקש תשובה לשם דומיין ושומר תוצאות לזמן מוגבל במטמון. כאשר פרוטוקול התשובה אינו מאומת קריפטוגרפית, רכיב המקבל צריך להחליט אם חבילה באמת שייכת לבקשה פתוחה. בין הנתונים הנבדקים נמצאים המזהה, שם השאילתה, השרת המצופה ופורט המקור של הבקשה. תוקף יכול לזייף מקור של תשובה ולנסות לפגוע בניחוש הערכים הדרושים לפני שמגיעה התשובה האמיתית. כניסה של ערך כוזב למטמון עלולה להשפיע גם על לקוחות נוספים המשתמשים בו.</p>\n<p>תוקף הנמצא בנתיב רואה יותר מידע מתוקף מרוחק שאינו רואה את הבקשה, אך אין פירוש הדבר שרק הראשון יכול לתקוף. אם המרחב לניחוש קטן והתוקף מקבל מספיק הזדמנויות, קיימת גם מתקפת off-path. מזהה אחיד בן שש עשרה סיביות נותן שישים וחמישה אלף וחמש מאות שלושים ושישה ערכים אפשריים; פורט אקראי עצמאי מוסיף אי־ודאות רק אם אינו ידוע לתוקף. חשוב להפריד בין סיכוי בניסיון בודד לבין סיכוי מצטבר לאורך ניסיונות חוזרים. מדיניות שמבטלת שאילתה אחרי תגובות שגויות עלולה למנוע גם את קבלת התשובה הנכונה וליצור מניעת שירות. הוספת זיהוי התקפה אינה שקולה לאימות התשובה, וגם התרעה אינה חסימה.</p>\n<h4>מה מספק TLS ובאילו שכבות הוא פועל</h4>\n<p>TLS יוצר ערוץ מוצפן ומאומת מעל תעבורה שבפני עצמה יכולה להיות חשופה למאזין או לתוקף פעיל. תחילה הצדדים מסכימים על פרמטרים ומקימים חומר מפתח, ובתצורה הנפוצה השרת מוכיח זהות באמצעות תעודה ומפתח פרטי מתאים. אחר כך מידע היישום מוגן במפתחות סימטריים. הבחירה במנגנון סימטרי להעברת מידע רב נובעת מיעילותו; המנגנונים האסימטריים פותרים בעיקר את בעיית ההקמה והאימות בלי סוד משותף שהותקן מראש.</p>\n<p>יש להבדיל בין הגנת הערוץ לבין תקינות התוכנה שמשתמשת בו. TLS לא מונע מהיישום להפעיל שאילתת SQL מסוכנת, לשלב קוד תוקף בדף או לקבל בקשת פעולה שהמשתמש לא התכוון אליה. הוא גם אינו מעניק אוטומטית זהות לכל לקוח: בתצורות רבות רק השרת מציג תעודה והמשתמש מזדהה אחר כך בסיסמה או באמצעי יישומי. תוקף שולט ברשת יכול עדיין לחסום את החיבור ולגרום למניעת שירות, גם כשאינו יכול לקרוא או לשנות תוכן מאומת. בתשובה על המצגת יש לציין אם מדובר ב־TLS הישן עם RSA או במנגנון אחר, משום שפרטי החלפת המפתח וההודעות השתנו בין גרסאות. ערבוב כל הזרימות לתיאור יחיד עלול להוביל לתשובה שגויה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_08082023_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q052.html"},{"id":"Q053","year":"2023","stem":"לאליס יש ביטקוין 1 כתוצאה מטרנזקציה X1 בבלוק B1. אליס מבזבזת את המטבע בטרנזקציה X2 בבלוק B2. לאחר כמה שעות, אליס מבינה שהיא טעתה, והעבירה בעלות על המטבע לארנק הלא נכון. לכן, אליס משנה את העותק הלוקאלי של הבלוקצ'יין שלה, כך שיכיל בלוק אחר במקום בלוק B2, והבלוק החדש יכיל את הטרנזקציה המתוקנת. אליס שולחת לעמיתיה את הבלוק המתוקן וממשיכה לבנות את הבלוקצ'יין על בסיס הבלוק הזה. מהי הטענה הנכונה?","options":["כל עוד הבלוקצ'יין המעודכן המוצע ע\"י אליס אינו ארוך יותר מהמקורי, סיכוייה להצליח אינם גבוהים.","אליס תצליח תמיד לתקן את הטעות שעשתה.","אליס תלויה בבנקאי שיאשר לה את הבקשה להחלפת הבלוק.","כדי שאליס תצליח, עליה להמשיך ולכרות על השרשרת הלוקאלית שלה למשך לפחות 100 בלוקים, מה שיבטיח ששאר העמיתים יקבלו את השרשרת שלה בתור השרשרת המוסכמת."],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":7},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.202,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-09-07\" data-doc=\"original-09\" data-body-words=\"403\"><h3>שאלה 7 — אליס מחליפה תשלום שגוי בבלוק B2 מקומי</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> שינוי העסקה משנה את שורש מרקל ואת כותרת הבלוק, ולכן צריך לכרות מחדש את B2 ואת המשכו. הרשת מאמצת ענף תקף בעל העבודה המצטברת המרבית, ובקושי קבוע זה מתואר בקירוב כ״ארוך יותר״. ענף מקומי קצר יותר לא יגבר; מספר קבוע של 100 בלוקים אינו מבטיח הצלחה. אין בנקאי המתקן עסקאות. לכן א היא הבחירה הטובה ביותר, בהנחה שהענף החלופי תקף.</p>\n<h4>עסקאות, הרשאת הוצאה ומצב הרשת</h4>\n<p>ביטקוין מתאר בעלות באמצעות פלטי עסקאות שטרם הוצאו, המכונים UTXO. פלט מגדיר סכום ותנאי הרשאה להוצאה עתידית. עסקה חדשה מצביעה על פלטים קודמים ומספקת את הנתונים הדרושים לקיום התנאים, בדרך רגילה חתימה מתאימה. אין צורך להשתתף בכרייה כדי ליצור עסקה או לקבל תשלום. המידע בשרשרת פומבי, ולכן אפשר לעקוב אחר פלטים של כתובת ולחשב יתרה בשרשרת נתונה, אף שהכתובת אינה חושפת בהכרח את זהות האדם או את כל כתובותיו.</p>\n<p>כורה מציע בלוק וצומת מאמת בודק אותו לפי כללי הקונצנזוס. בין הבדיקות נמצאים הרשאות ההוצאה, סכומים, העדר הוצאה כפולה באותו מצב, קישור להורה ותנאים קריפטוגרפיים. פרסום בלוק אינו מאפשר לכותבו לדרוש מאחרים לקבל עסקה בלתי תקפה. יש להבחין בין האפשרות לשנות קובץ מקומי לבין שכנוע הרשת לאמץ היסטוריה אחרת. אישורים נוספים מקשים על החלפת היסטוריה אך אינם הופכים כל קבלה להבטחה מוחלטת בכל מודל תוקף. אין בנקאי מרכזי המתקן תשלום שנשלח ליעד שגוי, וגם יוצר המערכת אינו מחזיק הרשאת ניהול שמאשרת לבדו שינויים. ההתנהגות נקבעת בידי תוכנות המשתתפים וכללי הקבלה שהם אוכפים.</p>\n<h4>פיצול זמני, ארגון מחדש ושינוי כללים</h4>\n<p>כאשר שני בלוקים תקפים נמצאים כמעט במקביל לאותו הורה, צמתים שונים עשויים לראות ענפים שונים. בהמשך הרשת מעדיפה ענף לפי העבודה המצטברת, ולא לפי העובדה שמחשב יחיד שמע עליו ראשון. מעבר מענף שנבחר קודם לענף עדיף נקרא ארגון מחדש, והוא מחייב לבטל את השפעת עסקאות הענף הישן ולהחיל את החדשות. לכן שמירת מצב נוכחי בלבד אינה מספיקה תמיד: צריך דרך לשחזר מצב קודם, מידע משלים או אפשרות אימות מחדש.</p>\n<p>המונחים soft fork ו־hard fork עוסקים גם ביחס בין כללי תקפות חדשים לישנים, ולא רק בפיצול זמני שנגרם מהשהיה. אם כל בלוק שמותר לפי הכללים החדשים מותר גם לפי הישנים, השינוי מצמצם את קבוצת הבלוקים התקפים ויכול להיות soft fork. אם הכללים החדשים מתירים בלוק שצומת ישן דוחה, זהו כיוון התאימות של hard fork. עצם השם ״שיפור״, גודל השינוי בקוד או החיסכון במקום אינם קובעים את הסיווג. צריך להראות מה צומת שלא עודכן יעשה לבלוק חדש. גם תאימות אינה הבטחה שלא יהיו בעיות אימוץ, וצומת ישן אינו בהכרח אוכף את ההגבלות החדשות אף כשהוא מקבל את הענף שנוצר על פיהן.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_08082023_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q053.html"},{"id":"Q054","year":"2023","stem":"נתון שרת שהותקף במתקפת DDoS מסוג HTTP flood. לגבי החבילות שהקורבן (השרת שהותקף) קיבל במהלך ההתקפה, איזה מהשדות הבאים בחבילות היו בעלי ערכים שונים ואילו בעלי ערכים זהים?","options":["ערכים שונים – Source IP, Source Port, ערכים זהים – Destination IP, Destination port","ערכים שונים – Destination IP, Source Port, ערכים זהים – Source IP, Destination port","ערכים שונים – Source IP, Destination port, ערכים זהים – Destination IP, Source port","ערכים זהים – Source IP, Source Port, ערכים שונים – Destination IP, Destination port"],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":8},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.249,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-09-08\" data-doc=\"original-09\" data-body-words=\"411\"><h3>שאלה 8 — HTTP flood: אילו שדות חבילה משתנים ואילו קבועים?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> במודל של שרת יחיד ושירות בפורט יחיד: כתובת ופורט היעד זהים, וכתובות המקור מפוזרות בין הבוטים; פורטי המקור עשויים להשתנות בין החיבורים. א היא הבחירה הטובה ביותר. אין דרישה שכל שתי חבילות יהיו עם source port שונה: חבילות באותו חיבור חולקות פורטים, ובוטים שונים יכולים לבחור אותו פורט מקור. יעד עם כמה כתובות או שירותים משנה את ההנחה.</p>\n<h4>מניעת שירות היא פגיעה במשאב מוגבל</h4>\n<p>מטרת DoS היא להקשות על משתמשים לגיטימיים לקבל שירות. המשאב המותקף יכול להיות רוחב פס, זיכרון, מקום בטבלת חיבורים, זמן מעבד או משאב יישומי אחר. בהתקפה מבוזרת מקורות רבים פועלים יחד, למשל מחשבים נגועים ב־botnet, ולכן קשה יותר להסתפק בחסימת כתובת יחידה. אין הכרח שכל מקור יהיה מחשב אישי או שההתקפה תתרחש דווקא בשכבת הרשת; גם רכיבי תקשורת ומכשירי קצה יכולים להשתתף, וגם בקשות יישום יכולות להתיש שרת.</p>\n<p>Slowloris מדגימה שמתקפה אינה חייבת לשלוח כמות בתים עצומה. התוקף מחזיק בקשות HTTP לא שלמות ומתקדם באיטיות, כך שהשרת ממשיך להקצות להן משאבים. SYN flood פועלת בשלב אחר ומשתמשת במצב חיבור שטרם הושלם. ההבחנה קובעת מהי הגנה מועילה: הגבלת זמן לקבלת כותרות ומספר חיבורים מתאימה לבקשות איטיות, בעוד שמנגנון SYN cookies מטפל בהקצאת מצב מוקדמת בחיבור TCP. הגנה גורפת מדי יכולה לפגוע גם בלקוח איטי או בשירות גיבוי לגיטימי. לכן שיעור תעבורה גבוה הוא סימן לבדיקה ולא הוכחה לזדון, והסבר טוב צריך לזהות איזה משאב נשמר, באיזה שלב הוא מוקצה, וכיצד התוקף גורם לו להישאר תפוס.</p>\n<h4>סינון חבילות, מדיניות ומצב חיבורים</h4>\n<p>חומת אש בוחנת תעבורה העוברת דרכה ומחליטה לאשר או לדחות לפי כללים. מסנן חבילות יכול להשתמש בכיוון התעבורה, כתובות מקור ויעד, פורטים ופרוטוקול. כללי allowlist מאפשרים רק את התעבורה שהוגדרה ומשאירים כלל דחייה כברירת מחדל. עם זאת, מספר פורט אינו הוכחה לזהות יישום: תוקף יכול לנסות לשלוח חיבור מפורט שבחר, ושירות יכול לרוץ בפורט שאינו המקובל שלו. לכן צריך לקרוא את תנאי הכלל ממש, ולא את כוונת האדם שכתב אותו.</p>\n<p>חומת אש שמנהלת מצב יכולה לבדוק אם חבילה היא חלק מחיבור שכבר נפתח ואושר. מסנן חסר מצב שמאפשר תשובות רק בגלל פורט מקור מוכר עלול לאפשר גם התחלת חיבור זדוני הנראית כך. סינון דגלים משפר דיוק במקרים מסוימים, אך אינו תחליף מלא למעקב מצב ולאימות יישומי. יש גם גבול טופולוגי: חומת אש בגבול הרשת אינה רואה בהכרח חבילות ששני מחשבים פנימיים מחליפים ישירות. בדומה לכך, בלי בדיקת תוכן יישום אין להניח שהיא מזהה קוד זדוני בתוך אימייל. סינון מקורות חשודים יכול לצמצם זיוף כתובות, אבל אינו הופך כל כתובת מקור לזהות אמינה. לכל כלל צריך לבנות גם מסלול הלוך וגם מסלול חזור ולבדוק אם שניהם עוברים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_08082023_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q054.html"},{"id":"Q055","year":"2023","stem":"נתון ciphertext באורך 7 תוים, אשר כולם זהים. ה ciphertext נוצר על ידי צופן החלפה (צופן החלפה ממש ולא \"סתם\" צופן הזזה), ונתון שהא\"ב של השפה מורכב מ 28 תוים. כמה plaintexts ישנם שיכולים להתאים ל ciphertext הנ\"ל?","options":["28","28 בחזקת 7","28 * 7","7!"],"note":"התקבל גם סעיף ב","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":9},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":9}],"flags":["note"],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.293,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0,1],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-09-09\" data-doc=\"original-09\" data-body-words=\"399\"><h3>שאלה 9 — צופן החלפה, 7 תווים מוצפנים זהים, אלפבית 28</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> יש 28 plaintexts אפשריים: עבור כל סמל a באלפבית, הטקסט aaaaaaa. אין 28^7 אפשרויות בצופן החלפה חד־אלפביתי, משום שכל שבע ההופעות כפופות לאותו מיפוי. בגרסת docx מצוין שגם ב התקבל, אך תחת הגדרת צופן ההחלפה שבשאלה התוצאה המתמטית היא 28; אין בכך הצדקה ל־28^7.</p>\n<h4>צופן החלפה כספירה של תמורות</h4>\n<p>בצופן החלפה חד־אלפביתי מפתח קבוע משייך לכל סמל מקורי סמל מוצפן אחר, באמצעות תמורה של האלפבית. כל הופעה של אותו סמל מקורי משתמשת באותו שיוך במשך ההודעה. ההפיכות מחייבת שגם שני סמלים מוצפנים שונים יפוענחו לשני סמלים מקוריים שונים. לכן תבנית החזרות בטקסט נשמרת: רצף של תו מוצפן החוזר חמש פעמים מתאים לרצף של תו מקורי החוזר חמש פעמים, ולא לחמש בחירות בלתי תלויות.</p>\n<p>בבעיות ספירה צריך לברר אם מבקשים מספר מפתחות, מספר טקסטים מקוריים או מספר אפשרויות עבור עמדות מסוימות. אם נראו רק כמה סמלים בהודעה, החלפות שונות על שאר האלפבית מגדירות מפתחות שונים אך עשויות לתת בדיוק אותו plaintext בהודעה הנתונה. כאשר כל התווים הנתונים שונים, בוחרים סמל ראשון מכל האלפבית, שני מכל הסמלים שנותרו, וכך הלאה. זהו מכפלת יורדת ולא חזקה עם חזרות. למשל באלפבית של שלושה סמלים, צמד מוצפן שונה יכול להתאים לשישה צמדים מקוריים, בעוד שצמד זהה מתאים לשלושה בלבד. התרגיל סופר אפשרויות מבניות לפני שימוש בידע לשוני; שכיחות אותיות ומילים עשויה בהמשך לצמצם מועמדים סבירים, אך אינה משנה את מספר השיוכים המותר לפי הגדרת הצופן.</p>\n<h4>מה סופרים ואיך בודקים את התוצאה</h4>\n<p>בחישוב מספר טקסטים אפשריים מתחילים מתיאור המבנה שמותר לטקסט המקורי לקבל. כאשר המיפוי קבוע וחד־חד־ערכי, מספר המקומות בהודעה אינו בהכרח מספר הבחירות החופשיות. אם כל המקומות מייצגים אותו סמל מוצפן, יש רק בחירה אחת של סמל מקורי, ואותה בחירה קובעת את כל המקומות. אם הסמלים שונים, כל בחירה מוציאה סמל ממאגר האפשרויות של המקומות הבאים. זוהי ספירה של בחירות תלויות בלי חזרות, ולא של הגרלות נפרדות שמחזירות את הסמל למאגר.</p>\n<p>אפשר לבדוק את ההיגיון בדוגמה קטנה שקל למנות ידנית. באלפבית בן שלוש אותיות, עבור סימן מוצפן יחיד יש שלוש אפשרויות מקוריות. חזרה על הסימן עשר פעמים עדיין נותנת שלוש אפשרויות בלבד. לעומת זאת, שני סימנים שונים נותנים שלוש אפשרויות לראשון ושתיים לשני, כלומר שישה צמדים. לכל צמד אפשר להשלים מפתח מלא עבור שאר האלפבית, אך ההשלמה אינה משנה את הצמד שכבר נכתב. אם מבקשים מספר מפתחות צריך לספור גם את ההשלמות, ואם מבקשים מספר טקסטים אסור להכפיל בהן. זה גם מסביר מדוע חזקת גודל האלפבית מתאימה למודל אחר, שבו כל עמדה יכולה להיבחר באופן בלתי תלוי, ולא לצופן ההחלפה הקבוע שבנתונים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_08082023_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q055.html"},{"id":"Q056","year":"2023","stem":"אליס ובוב רוצים לדבר ביניהם בצורה מוצפנת ומאובטחת כך שחווה לא תוכל לדעת מה תוכן ההודעות שהם שולחים אחד לשניה. הדרך היחידה של אליס ובוב לתקשר הוא דרך ערוץ התקשורת שביניהם. נתון שלחווה יש יכולות האזנה, כלומר היא יכולה לראות הודעה הנשלחת בין אליס לבוב אך אין לה יכולות אחרות, בפרט, לחווה אין יכולות MitM והיא אינה יכולה לשלוח הודעות לאליס/בוב כלל - גם לא לשלוח הודעות משוכפלות מאליס/בוב. מוצעות להלן מספר הצעות לקיום התקשורת בין אליס לבוב כך שהתקשורת תהיה מאובטחת. באיזו שיטה אסור להם להשתמש?","options":["אליס ובוב יתקשרו באמצעות הצפנה סימטרית. כל אחד מייצר מפתח סימטרי משלו ושולח לשני דרך הערוץ ומאותו הרגע כל ההודעות מוצפנות בהתאם.","אליס ובוב יתקשרו באמצעות הצפנה א-סימטרית. כל אחד מהם שולח לשני דרך הערוץ את המפתח הפומבי שלו ומאותו הרגע כל ההודעות מוצפנות בהתאם.","אליס ובוב יתקשרו באמצעות הצפנת מפתח פומבי. הם ישלחו כל אחד לשני את התעודה שCA שכולם סומכים עליו הנפיק להם ומאותו הרגע כל ההודעות מוצפנות בהתאם (הצפנת מפתח פומבי רגילה).","אליס ובוב יתקשרו באמצעות הצפנה סימטרית. הם מקיימים ביניהם החלפת מפתחות מבוססת דיפי-הלמן ומאותו הרגע כל ההודעות מוצפנות בהתאם."],"note":"","sources":[{"file":"2023/689156_08082023_0 (1).pdf","date":"08/08/2023","num":10},{"file":"2023/689156_08082023_0.docx.pdf","date":"08/08/2023","num":10},{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"דיפי-הלמן והחלפת מפתחות","topic_score":0.249,"exam_count":2,"in_sample_exam":false,"variant_group":"V06","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-09-10\" data-doc=\"original-09\" data-body-words=\"391\"><h3>שאלה 10 — באיזו שיטת תקשורת אסור להשתמש מול מאזינה פסיבית?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> שליחת מפתח סימטרי גלוי בערוץ החשוף חושפת גם את תוכן כל ההודעות המוצפנות בו. מפתח פומבי מותר לחשיפה, ו־DH מתאים נגד מאזינה פסיבית בפרמטרים תקינים. מול תוקף פעיל יש צורך באימות מפתחות/הסכמה, אך השאלה שוללת יכולת זו.</p>\n<h4>מפתחות פומביים לעומת מפתחות סודיים</h4>\n<p>בקריפטוגרפיית מפתח פומבי לכל משתתף זוג מפתחות מקושרים: מפתח פומבי שמותר להפיץ ומפתח פרטי שרק בעליו אמור להחזיק. בהצפנה לנמען משתמשים במפתח הפומבי של הנמען, מפני שהפענוח דורש את המפתח הפרטי התואם. לכן אפשר לפרסם את מפתח בוב ועדיין לשמור הודעות המיועדות אליו בסוד. המפתח הפומבי אינו סיסמה שיש להעביר בערוץ נסתר; השאלה העיקרית בהפצתו היא כיצד יודעים שזהו באמת המפתח של בוב ולא מפתח של מתחזה.</p>\n<p>יש להבחין בין מאזין פסיבי לבין תוקף פעיל. מאזין רואה את הערכים שעוברים אך אינו משנה אותם; תוקף פעיל יכול להחליף מפתחות, לפתוח חיבורים ולשלוח הודעות משלו. פרוטוקול שעובד נגד הראשון עלול להיכשל נגד השני אם אין אימות זהות. תעודה חתומה או מפתח שנלמד מראש בערוץ אמין מספקים בסיס לשיוך הזהות, אך עדיין צריך להשתמש במפתח בתפקיד הנכון. דוגמה מעשית היא שליחת מפתח סימטרי אקראי בהצפנה לבוב ואז שימוש בו לקובץ גדול. מותר לכל אדם להצפין לבוב; עצם היכולת הזאת אינה מזהה את השולח כאליס. כדי לזהות אותה נדרשת גם הוכחה המתבססת על סוד שלה, למשל חתימה דיגיטלית.</p>\n<h4>פעולת הצפנה סימטרית והמשמעות של בלוקים</h4>\n<p>בהצפנה סימטרית אותו סוד מאפשר לבצע הצפנה ופענוח, גם אם פעולות האלגוריתם בשני הכיוונים שונות. יש לספק את הסוד לשני הצדדים בלי שהתוקף ילמד אותו. צופן בלוקים פועל על בלוק בעל אורך קבוע; עבור מפתח נתון הוא תמורה הפיכה על כל הבלוקים האפשריים. משמעות ההפיכות היא ששני קלטים שונים אינם יכולים להפיק אותו פלט תחת אותו מפתח. לעומת זאת, שני מופעים של אותו קלט אכן מפיקים אותו פלט אם אין מידע נוסף שמשנה את החישוב.</p>\n<p>כדי להצפין הודעה ארוכה משתמשים במצב פעולה שמגדיר כיצד לחלקה לבלוקים וכיצד לקשר את החישובים. לכן בטיחות צופן בסיסי כמו AES אינה מבטיחה בטיחות לכל נוסחה שמרכיבים ממנו. ערך התחלתי אקראי מועיל רק אם אופן שילובו מסתיר את המבנה הרצוי; אם אפשר לבטל אותו בחישוב פומבי, עצם נוכחותו אינה מונעת דליפה. בבדיקת מצב פעולה כדאי לכתוב את המשוואות עבור שני בלוקים ולבדוק מה מאזין יכול לחשב מהפלטים. למשל שוויון בין בלוקים עשוי לחשוף תבנית בתמונה או שדות חוזרים במסמך גם כאשר התוכן המדויק נשאר נסתר. יש לבדוק בנפרד גם שלמות, כי מצב הצפנה שאינו כולל אימות עשוי לאפשר שינויים שלא יתגלו.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_08082023_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q056.html"},{"id":"Q057","year":"2024","stem":"אליס לקחה plaintext והצפינה אותו, ואז חישבה MAC על ה plaintext. אליס שלחה לבוב את ה ciphertext ואת הtag. באיזה שיטה אליס עבדה?","options":["MAC and Encrypt","דיפי הלמן","Encrypt then MAC","MAC then Encrypt"],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.308,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-25-01\" data-doc=\"original-25\" data-body-words=\"402\"><h2>שאלה 1 — הצפנת מסר ו־MAC על plaintext</h2><div class=\"answer-body\">\n<p><strong>1 — MAC and Encrypt, המכונה גם Encrypt and MAC.</strong> נשלחים E_K(m) ולצדו MAC_K′(m). 2 דיפי–הלמן הוא חילוף מפתחות; 3 Encrypt then MAC היה מחשב תג על ciphertext; 4 MAC then Encrypt היה מצפין יחד את המסר והתג. עצם העובדה שחישוב ה־MAC בוצע כרונולוגית אחרי ההצפנה אינה משנה את הסיווג: חשוב על מה מחושב התג והאם הוא מוצפן.</p>\n<h3>מה מתויג ומה מוצפן</h3>\n<p>כדי לסווג שילוב של הצפנה ותיוג צריך לענות על שתי שאלות: על איזה רצף בתים מחושב התג, והאם התג עצמו נמצא בתוך ההצפנה או לצידה. סדר שורות בקוד אינו מספיק, משום ששולח יכול לבצע חישובים עצמאיים בסדר כלשהו ולהישאר באותה בנייה קריפטוגרפית. החלק החשוב הוא מבנה התוצאה שהמקבל מקבל ואילו בדיקות עליו לבצע כדי לקבל בחזרה הודעה מאומתת.</p>\n<p>כאשר מצפינים ואז מתייגים, התג מחושב על התוכן המוצפן. המקבל יכול לבדוק את תקינות הקלט עוד לפני שפענח אותו. כאשר מתייגים ואז מצפינים, התג מחושב על המסר הגלוי ונכנס יחד איתו לתוך ההצפנה. המקבל חייב תחילה לפענח כדי לחלץ את שני החלקים, ורק אז הוא יכול לחשב תג ולבדוק התאמה. בבנייה השלישית מצפינים את המסר ובנפרד שולחים תג על המסר הגלוי; התג נמצא מחוץ להצפנה אך אינו מאמת ישירות את התוכן המוצפן.</p>\n<h3>קריאת קוד המקבל והשלכות אבטחתיות</h3>\n<p>קוד פענוח מספק בדרך כלל דרך פשוטה לזהות את הבנייה של השולח. אם השורה הראשונה מחשבת או בודקת תג של הטקסט המוצפן, מדובר במסלול של תיוג אחרי הצפנה. אם הפענוח מחזיר זוג של מסר ותג, ברור שבצד השולח שני אלה הוצפנו יחד. אם התג התקבל בנפרד ונבדק מול המסר המפוענח, זהו מסלול נפרד של הצפנה ותיוג. ההבחנה נקבעת לפי זרימת המידע, ולא לפי דמיון מילולי בין שמות האפשרויות.</p>\n<p>הצפנה לבדה נועדה לסודיות ואינה מתחייבת לזהות שינוי עוין. תיוג מוסיף שלמות ואימות מול מי שאינו מכיר את המפתח. עם זאת אין להסיק שכל חיבור שרירותי שלהם בטוח: טיפול שונה בשגיאות פענוח, חשיפת פרטי ריפוד או שימוש לא מתאים באותם מפתחות יכולים לפתוח ערוצי תקיפה. בתכנון מסודר מגדירים גם איך נמסר הווקטור ההתחלתי, על אילו שדות מחושב התג ומתי בודקים אותו. זיהוי שם הבנייה בשאלה אינו אישור אוטומטי לכל מימוש אפשרי שלה, אלא תיאור מדויק של היחס בין הפעולות והנתונים.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בעת העברת התג והטקסט המוצפן יש להגדיר גם את דרך הפרדת השדות. אם שני פורמטים שונים מתפרשים כאותו רצף בתים מאומת, עשוי להיווצר בלבול למרות שימוש בפרימיטיבים תקינים. לפיכך תיאור בנייה מלא כולל מבנה מסר חד־משמעי, מפתחות מתאימים וכללי דחייה. בשאלון זרימת הנתונים מספיקה לסיווג, אך היא אינה תחליף למפרט כזה במימוש אמיתי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_31052024_0.docx (2).pdf","question_type":"multiple-choice","solution":"solutions/Q057.html"},{"id":"Q058","year":"2024","stem":"בטרנזקציה x נעלו את הפלט בעזרת ה output script הבא:\n```\nDUP HASH160 [Key Hash] EQUALVERIFY CHECKSIG\n```\nמה מבין הבאים הינו input script מתאים שיאפשר לבזבז את ה output script בטרנזקציה עתידית?","options":["[Signature] [Public Key]","CHECKSIG EQUALVERIFY","[Public Key] [Key Hash]","[Key Hash] [Public Key]"],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.365,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-25-03\" data-doc=\"original-25\" data-body-words=\"382\"><h2>שאלה 3 — input script של P2PKH</h2><div class=\"answer-body\">\n<p><strong>1 — [Signature] [Public Key].</strong> DUP משכפל את המפתח הפומבי, HASH160 מגבב אותו, EQUALVERIFY משווה ל־Key Hash הנעול, ו־CHECKSIG בודק את החתימה על הטרנזקציה. 2 אינו מספק חתימה ומפתח; 3 ו־4 מספקים hash ומפתח אך לא חתימה. hash של מפתח אינו תחליף להוכחת החזקת המפתח הפרטי.</p>\n<h3>נעילת פלט והוכחת הזכות להוציא אותו</h3>\n<p>בביטקוין אין צורך שהארנק ימסור את המפתח הפרטי לכורה או לשרת מרכזי. פלט של עסקה קודמת מכיל תנאי נעילה, ועסקה שמנסה להוציא אותו צריכה לספק נתונים שמקיימים את התנאי. בתבנית הנדונה התנאי מתייחס לגיבוב של מפתח ציבורי מסוים, ולכן המוציא מציג את המפתח עצמו וחתימה שנוצרה באמצעות הפרטי המתאים. אלה שני תפקידים משלימים: המפתח מאפשר לבדוק שהפונה מתאים לזהות הנעולה, והחתימה מוכיחה יכולת שימוש בסוד.</p>\n<p>אפשר לחשוב על ההבדל בין כתובת למשלוח מכתב לבין חתימה המאשרת הוראת תשלום. כתובת היעד אינה עצמה הרשאה לבצע פעולה, ובאותו אופן ידיעת גיבוב המפתח אינה הוכחת שליטה במטבעות. הגיבוב רשום כבר בפלט הציבורי וכל אחד יכול להעתיק אותו. לכן חלופה שמספקת רק מפתח ציבורי וגיבוב, ללא חתימה, אינה מסוגלת להוכיח שהמוציא מחזיק במפתח הפרטי.</p>\n<h3>ביצוע הסקריפט על המחסנית</h3>\n<p>סדר הנתונים חשוב משום שסקריפט פועל באמצעות מחסנית: כל פעולה לוקחת פריטים שהוכנסו לפניה ומחזירה תוצאה או נכשלת. תחילה נדחפות החתימה והמפתח הציבורי. פעולת השכפול משאירה עותק של המפתח לשלב אימות החתימה, בעוד העותק האחר נשלח לגיבוב. ערך הגיבוב המחושב מושווה לערך שנכתב בתנאי הנעילה. אם הם שונים הבדיקה נכשלת מיד; אם הם שווים, נותר לבדוק את החתימה בעזרת המפתח הציבורי המקורי.</p>\n<p>הבדיקה האחרונה קושרת את ההרשאה לעסקה שעליה נחתם. בתנאי חתימה רגילים אי אפשר להעתיק חתימה לעסקה אחרת עם נמענים אחרים ולצפות שתאומת, משום שהתוכן הנחתם השתנה. כשמציגים בשאלה את הסקריפט המשולב, צריך אפוא לעקוב לא רק אחרי רשימת המילים אלא גם אחרי סדר הדחיפה, אילו פריטים נשארים ואיזו פעולה צורכת אותם. היעדר פעולת אימות חתימה הוא כשל מהותי בתבנית התקנית, גם אם רצף אחר מסוגל לסיים ריצה בתנאים מסוימים. הציבוריות של המפתח אינה פוגעת בסודיות הפרטי, ואין צורך או הצדקה לחשוף את הפרטי במהלך הפדיון.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>מפתח ציבורי שאינו תואם לגיבוב הנעול ייכשל עוד לפני בדיקת החתימה, גם אם החתימה תקינה עבור אותו מפתח אחר. לעומת זאת, מפתח מתאים בלי חתימה נכונה יעבור את השוואת הגיבוב וייכשל בשלב האחרון. חלוקת הכשל לשני שלבים מבהירה מדוע שניהם הכרחיים: זיהוי תנאי היעד והוכחת הרשאה הם בדיקות שונות, ואין נתון יחיד המחליף את שניהם.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_31052024_0.docx (2).pdf","question_type":"multiple-choice","solution":"solutions/Q058.html"},{"id":"Q059","year":"2024","stem":"נתון שתוקף הצליח לגנוב את המפתח הפרטי של אתר אינטרנט, אשר משמש אותו להקמת חיבורי TLS עם לקוחות. איזה טענה אינה נכונה?","options":["התוקף יוכל לזייף הודעות Online Certificate Status Protocol (OCSP) בשם ה CA שהנפיק את התעודה לאתר האינטרנט.","אם לתוקף יש העתק של תקשורת עבר מוצפנת שמבוססת על ה key exchange בין השרת ללקוחות שהתבצע בעזרת RSA עם המפתח שנגנב בהקמת חיבור TLS, הוא יוכל לפענח את התקשורת המוצפנת הזו.","תוקף בעל יכולת Man in the Middle יוכל להתחזות לשרת ולהצליח להקים חיבור TLS עם לקוחות כאילו הוא השרת.","אם האתר יגלה שהמפתח הפרטי שלו נגנב, הוא יפנה ל CA שהנפיק את התעודה לאתר האינטרנט ויבקש מה CA שיבטל אותה."],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.213,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-25-04\" data-doc=\"original-25\" data-body-words=\"402\"><h2>שאלה 4 — גניבת מפתח פרטי של שרת</h2><div class=\"answer-body\">\n<p><strong>1 — הטענה על זיוף OCSP בשם CA אינה נכונה.</strong> תגובת OCSP נחתמת במפתח הרשות או משיב מורשה, לא במפתח שרת האתר. 2 נכונה בחילוף מפתחות RSA הישן: הקלטת ClientKeyExchange מאפשרת לשחזר pre-master secret ולפענח עבר. 3 נכונה: MITM עם המפתח והתעודה עשוי להתחזות לשרת. 4 נכונה: יש לבקש ביטול תעודה והחלפת מפתח. חתימת תעודת שרת כשלעצמה ב־RSA אינה מספיקה לפענוח עבר אם חילוף המפתחות היה ECDHE.</p>\n<h3>ביטול תעודה הוא עדכון אמון ולא שינוי במתמטיקה</h3>\n<p>תעודה עשויה להיות חתומה כחוק ועדיין להפסיק להיות אמינה לפני תאריך הפקיעה שלה, למשל מפני שמפתח פרטי נגנב. החתימה על התעודה אינה נעלמת כאשר הרשות מחליטה לבטל אותה, ולכן הלקוח זקוק למידע נוסף על סטטוסה. רשימת ביטול מפרסמת אוסף תעודות שבוטלו, ושירות סטטוס מקוון מאפשר לברר את המצב של תעודה מסוימת. בשני המקרים המקבל צריך לאמת שהמידע הגיע מגורם מורשה ושאינו ישן מדי.</p>\n<p>למפתח הפרטי של שרת האתר ולמפתח החתימה של רשות התעודות יש תפקידים שונים. גניבת מפתח האתר מאפשרת להתחזות לאתר בהקשרים שבהם התעודה עוד מתקבלת, אך אינה מאפשרת לחתום בשם הרשות על רשימת ביטול או תשובת סטטוס. אחרת כל שרת היה יכול לבטל את ביטולה של תעודתו בעצמו, וכל שרשרת האמון הייתה מאבדת את משמעותה. גם העתקת אישור קיים אינה מאפשרת לשנות את השדות שלו בלי לפגוע בחתימה.</p>\n<h3>הצמדה, פרטיות וכשל תקשורת</h3>\n<p>כאשר הדפדפן פונה ישירות לשירות הסטטוס, השירות עשוי ללמוד באיזו תעודת אתר הדפדפן מתעניין, ונוספות השהיה ותלות בזמינות רשת. הצמדת תשובת סטטוס מאפשרת לשרת האתר לקבל תשובה חתומה ולהגיש אותה ללקוחות במהלך ההקמה. השרת מעביר ראיה חתומה, ואינו מחליף את המשיב המורשה כחותם. הלקוח עדיין בודק התאמה, חתימה וטריות.</p>\n<p>מדיניות המשך במקרה כשל פירושה שאם הבירור אינו אפשרי, הלקוח עשוי להמשיך במקום לחסום. הדבר משפר זמינות אך עלול לאפשר לתוקף לחסום גישה לשירות הסטטוס ולנצל תעודה שכבר בוטלה. מכאן שפער בין ביטול אצל הרשות לבין אכיפה אצל משתמשים אינו מצביע בהכרח על זיוף חתימה: ייתכנו כשל תקשורת או מידע שמור שעוד נחשב עדכני. שקיפות תעודות פותרת בעיית גילוי הנפקות ואינה מחליפה את העברת הסטטוס הזה. גם שרתי שורש של מערכת שמות מתחם אינם רשויות ההפצה של ביטול תעודות, אף שבשני התחומים משתמשים במושג שורש.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>יש להבדיל גם בין ביטול תעודה לבין יצירת תעודה חדשה. הנפקת חלופה אינה גורמת אוטומטית לכל הדפדפנים להפסיק לקבל את הישנה, ותוקף עשוי להמשיך להציג את העותק שבידו. ניהול האירוע כולל לכן החלפת מפתח, הפצת מידע ביטול ובדיקת אכיפה אצל לקוחות. פעולה בצד שרת האתר בלבד אינה משנה את כל עוגני האמון והמטמונים של המשתמשים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_31052024_0.docx (2).pdf","question_type":"multiple-choice","solution":"solutions/Q059.html"},{"id":"Q060","year":"2024","stem":"נתון שרת אשר בונה שאילתא בעזרת המחרוזת הבאה על בסיס ערכי המשתנים InputUsername, InputPassword, אשר נשלחים לשרת מהדפדפן:\n```\n\"SELECT * FROM users WHERE username = '\" + InputUsername + \"' AND password = '\" + InputPassword + \"'\"\n```\nאיזה ערכים יהוו sql injection תקין?","options":["InputUsername = alice, InputPassword = 1234' or '1' = '1","InputUsername = alice, InputPassword = 1234' and '1' = '1","InputUsername = alice, InputPassword = 1234' and \"1\" = \"1","InputUsername = 'Alice', InputPassword = 1234' or 1 = 1"],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.276,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-25-05\" data-doc=\"original-25\" data-body-words=\"420\"><h2>שאלה 5 — SQL injection במחרוזת התחברות</h2><div class=\"answer-body\">\n<p><strong>1 — username=alice והסיסמה 1234′ or ′1′=′1.</strong> אחרי החלפת גרשיים טיפוגרפיים בגרשי SQL רגילים מתקבל WHERE username='alice' AND password='1234' or '1'='1'. בגלל קדימות AND לפני OR, התנאי כולו אמת. 2 רק מוסיפה AND עם אמת ואינה עוקפת סיסמה שגויה; 3 משתמשת במרכאות שאינן משנות זאת וייתכן שאינן מילוליות מחרוזת באותו DB; 4 אינה מאזנת את הגרש הסופי ואת גרשי username, ולכן אינה payload תקין בנוסח הנתון. תיקון הוא שאילתה פרמטרית.</p>\n<h3>מתי קלט מפסיק להיות נתון והופך לתחביר</h3>\n<p>הזרקת שאילתות מתרחשת כשהיישום בונה פקודת מסד נתונים באמצעות חיבור טקסט של קלט משתמש אל קטעי פקודה. התוקף מנצל את העובדה שמפרש השאילתה אינו מכיר את הגבול שהמפתח התכוון להציב בין ערך הסיסמה לבין אופרטורים, תנאים והערות. אם גרש בקלט סוגר את מחרוזת הנתונים, ההמשך עלול להתפרש כפקודה ולא כשם משתמש או סיסמה.</p>\n<p>דרך מסודרת לבדוק חלופה היא להציב את הקלט בדיוק בתוך תבנית השאילתה, כולל הגרש הפותח, הגרש הסוגר והטקסט שמגיע אחריו. אחרי ההצבה מסמנים אילו חלקים נשארים בתוך מחרוזות ואילו חלקים הפכו לתחביר. לא מספיק לזהות את המילה המציינת או ואת התנאי שתמיד מתקיים; אם נשאר גרש עודף בסוף השאילתה, ייתכן שכל הביטוי ייכשל כשגיאת תחביר ולא יעקוף את האימות.</p>\n<h3>קדימות תנאים, הערות ותיקון מבני</h3>\n<p>תנאי חיבור לוגי מסוג וגם נבדק בדרך כלל לפני תנאי מסוג או. משום כך הוספת תנאי אמת באמצעות או יכולה להפוך את הביטוי הכולל לאמת גם כשהסיסמה אינה נכונה. הוספת אותו תנאי אמת באמצעות וגם אינה מבטלת את הצורך שסיסמת המקור תתאים. שימוש בהערת שורה עשוי לבטל את יתרת התנאי, אך יש לבדוק את תחביר מנוע המסד, לרבות דרישה אפשרית לרווח אחרי סימן ההערה. גרשיים טיפוגרפיים במסמך לימודי צריכים להתפרש כייצוג של התווים התחביריים המתאימים, ולא כהוכחה שכל תו מודפס יתקבל בכל מנוע.</p>\n<p>התיקון העקרוני הוא שימוש בשאילתה פרמטרית, שבה מבנה הפקודה נמסר בנפרד מן הערכים. כך המפרש מתייחס למחרוזת המשתמש כנתון גם כשהיא מכילה תווים מיוחדים. מנגנוני הצפנת תעבורה, הגנה מפני מסגור וטוקנים נגד זיוף בקשות אינם משנים את האופן שבו מסד הנתונים מפרש חיבור מחרוזות. גם סינון נקודתי של מילה או תו אינו תחליף להפרדה המבנית, משום שקיימות צורות תחביר רבות ותלויות הקשר. בשאלה מספיק להראות איזו הצבה יוצרת ביטוי חוקי ומעקף, ולמה יתר ההצבות נשארות טקסט, שגויות תחבירית או אינן משנות את תוצאת האימות.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>כדי להמחיש את ההבדל בין מתקפה לבין קלט חשוד, אפשר לבחור סיסמת ניסיון שגויה ולבדוק את הביטוי לאחר ההצבה. אם התנאי נשאר שקר, לא נוצר מעקף רק מפני שהקלט מכיל מילת מפתח. אם הפקודה אינה ניתנת לפירוש, התקבלה שגיאה ולא כניסה חוקית. ניתוח תחביר ותוצאת אמת נדרשים יחד, וזו הסיבה שיש להציב כל חלופה במלואה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_31052024_0.docx (2).pdf","question_type":"multiple-choice","solution":"solutions/Q060.html"},{"id":"Q061","year":"2024","stem":"איזה טענה נכונה?","options":["בהודעת ה client finish הלקוח שולח לשרת את תוצאת הפעלת הצפנה ו MAC על ה hash של ההודעות שנשלחו עד כה ב handshake והשרת מפענח ומוודא תקינות עם אותם מפתחות שהקליינט השתמש בהם כדי להצפין ולבצע MAC.","בהודעת ה server finish השרת שולח ללקוח את תוצאת הפעלת הצפנה ו MAC על ה hash של ההודעות שנשלחו עד כה ב handshake והלקוח מפענח ומוודא תקינות עם ה public key מהתעודה.","לאחר הקמת חיבור ה TLS, ההודעות שהלקוח שולח לשרת לאורך החיבור מוצפנות בעזרת מפתח X (מסויים), והשרת מפענח אותן בעזרת מפתח Y (ששונה מX).","לאחר הקמת חיבור ה TLS, ההודעות שהלקוח שולח לשרת לאורך החיבור מוצפנות בעזרת ה public key של השרת בהצפנה א-סימטרית."],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"TLS / HTTPS","topic_score":0.283,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-25-07\" data-doc=\"original-25\" data-body-words=\"390\"><h2>שאלה 7 — אימות Finished ב־TLS</h2><div class=\"answer-body\">\n<p><strong>1 — ClientFinished מוגן במפתחות סימטריים משותפים, ונבדק בשרת בעזרת מפתחות הכיוון המתאים.</strong> תוכנו נגזר גם מ־hash תמליל ה־handshake. 2 שגויה: לא מפענחים Finished במפתח הפומבי שבתעודה; 3 שגויה: אותה תעבורה סימטרית מוצפנת ומפוענחת באותו מפתח, גם אם המפתחות בשני הכיוונים שונים; 4 שגויה: תעבורת היישום אינה מוצפנת כולה ב־RSA של השרת. הניסוח הוא תיאור מפושט של TLS הישן: verify_data אינו פשוט ״הצפנת hash״ אלא ערך נגזר באמצעות PRF והגנת שכבת הרשומות.</p>\n<h3>חלוקת התפקידים בהקמת הערוץ</h3>\n<p>בתחילת החיבור הלקוח והשרת עדיין אינם חולקים את מפתחות התעבורה החדשים. הלקוח פותח במשא ומתן על פרמטרים, השרת בוחר מבין האפשרויות המותרות ומציג אמצעי אימות מתאים, ובהמשך הצדדים מפיקים סוד משותף וממנו מפתחות. בהקשר מבוסס תעודות הלקוח בודק שהמפתח שהוצג קשור לשם האתר שאליו התכוון להגיע וששרשרת החתימות מובילה לשורש אמין. קיום חתימה חוקית כשלעצמו אינו מספיק אם התעודה שייכת לאתר אחר או אם אינה בתוקף.</p>\n<p>בשאלות המתארות חילוף מפתחות באמצעות הצפנה במפתח ציבורי של השרת, הלקוח יוצר סוד ראשוני ומצפין אותו כך שרק בעל המפתח הפרטי יוכל לפענחו. זהו מסלול היסטורי, ואין להשליך ממנו שכל חיבור מודרני פועל כך. בחילוף מפתחות זמני מבוסס דיפי–הלמן, מפתח התעודה משמש לאימות פרמטרים והסוד אינו מועבר באותה הצפנת מפתח ציבורי. להבחנה יש משמעות כאשר מפתח התעודה נגנב לאחר הקלטת התקשורת.</p>\n<h3>תמליל מאומת וגזירת מפתחות</h3>\n<p>בסוף הקמת החיבור הצדדים בודקים ערכים התלויים בתמליל הודעות ההקמה ובסודות שהפיקו. כך ניתן לזהות תוקף שהחליף הודעה בדרך גם אם היא נראית תקינה מבחינת התחביר. אם כל צד זוכר תמליל אחר, ערכי האימות אינם תואמים. שינוי שהורס תחביר או מונע הסכמה יכול כמובן לגרום לכשל מוקדם יותר, ולכן יש להבחין בין זיהוי אפשרי לבין זיהוי קריפטוגרפי מובטח בשלב האימות.</p>\n<p>מספרים אקראיים והקשר ההקמה נכללים בגזירת המפתחות כדי להבחין בין חיבורים ולהקטין שימוש חוזר בלתי רצוי בחומר מפתחות. נגזרים מפתחות נפרדים לכיווני התעבורה; באותו כיוון הצד המצפין והצד המפענח משתמשים בסוד הסימטרי המתאים. לאחר ההקמה אין צורך להצפין כל הודעת יישום בעזרת המפתח הציבורי שבתעודה. ההצפנה הסימטרית מגינה על התעבורה, ואימות השלמות מונע שינויים שקטים. כל זאת עדיין תלוי בבדיקה נכונה של זהות השרת ובהגנת המפתחות.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>יש גם להבחין בין מפתח ארוך־טווח שמזהה אתר לבין מפתח זמני של חיבור מסוים. תעודה יכולה לשמש חיבורים רבים, בעוד מפתחות תעבורה חדשים מופקים בכל הקמה מתאימה. לכן ידיעת תעודה ציבורית אינה ידיעת מפתח הפענוח של הסשן. חזרה של תעודת האתר בחיבורים שונים אינה כשלעצמה שימוש חוזר באותו מפתח הצפנה סימטרי לתוכן המשתמשים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_31052024_0.docx (2).pdf","question_type":"multiple-choice","solution":"solutions/Q061.html"},{"id":"Q062","year":"2024","stem":"נתון:\n- כתובת ה ip של אליס היא 192.168.0.1 וכתובת ה MAC שלה היא AA:AA:AA:AA:AA:AA\n- כתובת ה ip של בוב היא 192.168.0.2 וכתובת ה MAC שלו היא BB:BB:BB:BB:BB:BB\n- כתובת ה ip של התוקף היא 192.168.0.6 וכתובת ה MAC שלו היא 66:66:66:66:66:66 לאחר שהתוקף ביצע בהצלחה התקפת ARP poisoning, כאשר אליס שולחת הודעה לבוב, לאיזה כתובת ip היא תשלח ולאיזה כתובת MAC?","options":["לכתובת ip של 192.168.0.2 ולכתובת MAC של 66:66:66:66:66:66","לכתובת ip של 192.168.0.6 ולכתובת MAC של 66:66:66:66:66:66","לכתובת ip של 192.168.0.2 ולכתובת MAC של BB:BB:BB:BB:BB:BB","לכתובת ip של 192.168.0.6 ולכתובת MAC של BB:BB:BB:BB:BB:BB"],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":6},{"file":"2024/689156_04_20102024_0 3.pdf","date":"20/10/2024","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.264,"exam_count":2,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-25-06\" data-doc=\"original-25\" data-body-words=\"397\"><h2>שאלה 6 — כתובות לאחר ARP poisoning</h2><div class=\"answer-body\">\n<p><strong>1 — IP יעד 192.168.0.2 ו־MAC יעד 66:66:66:66:66:66.</strong> אליס עדיין פונה לבוב בשכבת IP, אך cache מורעל מכוון את מסגרת Ethernet למתאם התוקף. 2 משנה בטעות את יעד IP לתוקף; 3 מתארת מצב ללא הרעלה; 4 משלבת יעד IP שגוי עם MAC שאינו של התוקף. ARP משנה פתרון כתובת שכבה שנייה, לא את יעד החבילה המקורי.</p>\n<h3>מסלול החבילה לפני ההרעלה ואחריה</h3>\n<p>ברשת מקומית יש להבחין בין כתובת היעד של חבילת האינטרנט לבין כתובת המתאם שאליו נמסרת המסגרת המקומית. כתובת אינטרנט מזהה את היעד הלוגי של התקשורת, ואילו כתובת חומרה משמשת למסירת מסגרת ברשת המקומית. כאשר היעד נמצא באותה רשת, המחשב צריך למצוא איזו כתובת חומרה מתאימה לכתובת האינטרנט שלו. פרוטוקול פתרון הכתובות מספק את המיפוי הזה ושומר אותו במטמון כדי שלא יהיה צורך לשאול מחדש בכל מסגרת.</p>\n<p>הכשל שנוצל במודל השאלה הוא היעדר אימות קריפטוגרפי של הודעות המיפוי. התוקף משדר הודעה שלפיה כתובת האינטרנט של הקורבן האחר נמצאת בכתובת החומרה של התוקף. הקורבן מעדכן את המטמון וממשיך לבנות חבילות לאותו יעד מקורי, אך עוטף אותן במסגרת המיועדת לתוקף. אם התוקף מעביר את החבילות הלאה, התקשורת עשויה להיראות רגילה והמשתמשים אינם מקבלים בהכרח סימן גלוי להרעלה.</p>\n<h3>יכולות התוקף וגבולות ההתקפה</h3>\n<p>כדי לקבל מיקום בין שני הצדדים בדרך כלל מרעילים את המיפוי בכל אחד מהם, או את המיפוי בין הקורבן לשער ברירת המחדל. התוקף יכול אז לצפות, לעכב, להשמיט ולהעביר מסגרות, ובהיעדר הגנות גבוהות יותר גם לשנות נתונים. מכאן לא נובעת ידיעה של מפתח הצפנה: כאשר מופעל ערוץ מוצפן ומאומת כראוי, הנתונים נשארים מוצפנים ושינויים בלתי מורשים מתגלים. עצם ההגעה לתעבורה אינה מאפשרת לייצר חתימה דיגיטלית בשם אחר.</p>\n<p>המושג הזרקה מחוץ לנתיב מתאר כאן תוקף שיש לו גישה מתאימה לאותו תחום שידור, אך עדיין אינו מעביר את התקשורת דרכו. ההרעלה היא שיוצרת לו עמדה כזאת. אין פירוש הדבר שכל מחשב מרוחק באינטרנט יכול לשלוח הודעות כאלה דרך נתבים. יש גם להבחין מהצפת טבלת מתג: זו התקפה על למידת מיקומי כתובות חומרה במתג, בעוד כאן משנים את הבנת המחשבים לגבי הקשר בין שתי שכבות כתובות. בקרות ברשת המקומית או אימות הערוץ בשכבות העליונות מתמודדים עם היבטים שונים של הבעיה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>במקרה שבו יעד החבילה נמצא מחוץ לרשת המקומית, המחשב בדרך כלל פותר את כתובת החומרה של שער ברירת המחדל ולא של השרת המרוחק. התוקף יכול להתחזות לשער באותו מנגנון עקרוני. גם אז כתובת היעד של חבילת האינטרנט נשארת כתובת השרת; רק התחנה המקומית הראשונה שאליה נמסרת המסגרת הוחלפה. הבחנה זו מונעת בלבול בין הרעלה לשינוי נתיב לוגי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_31052024_0.docx (2).pdf","question_type":"multiple-choice","solution":"solutions/Q062.html"},{"id":"Q063","year":"2024","stem":"איזה טענה נכונה?","options":["מנגנון Certificate Transparency משתמש בעץ Merkle כדי ליצור שקיפות בהקשר של התעודות ש CAים מנפיקים, ומסייע בזיהוי מוקדם של תעודות זדוניות.","מנגנון Certificate Transparency הינו מנגנון המשמש להצפנת חיבורי TLS בין לקוח לשרת בהקשר של שקיפות אלגוריתמי ה cipher suites הנתמכים בין הלקוח לשרת.","מנגנון Certificate Transparency הינו מנגנון המשמש להצפנת חיבורי TLS בין שרת לשרת בהקשר של שקיפות אלגוריתמי ה cipher suites הנתמכים בין השרתים ולקוחותיהם.","מנגנון Certificate Transparency הינו מנגנון המשמש להצפנת חיבורי TLS בין לקוח לשרת בהקשר של שקיפות אלגוריתמי ה cipher suites המסוכמים בין הלקוח והשרת בהודעות ה server finish וה client finish."],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":8}],"topic":"PKI, תעודות, CT ו-OCSP","topic_manual":true,"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-25-08\" data-doc=\"original-25\" data-body-words=\"371\"><h2>שאלה 8 — CT ועץ מרקל</h2><div class=\"answer-body\">\n<p><strong>1 — לוגי CT משתמשים בעץ מרקל לצורך שקיפות והוכחות רישום/עקביות.</strong> ניתן לעקוב אחרי הנפקות תעודות ולגלות הנפקות זדוניות. 2,3,4 מייחסות ל־CT הצפנת חיבורים ושקיפות של cipher suites; אלה אינם תפקידיו. עץ מרקל מחייב את הלוג לרשומותיו ואינו מסתיר אותן.</p>\n<h3>מדוע שרשרת אמון אינה מספיקה לביקורת הנפקות</h3>\n<p>רשות מוסמכת יכולה להנפיק בטעות תעודה לדומיין שאינו שייך למבקש, או שמפתח שלה עלול להיות מנוצל לרעה. לקוח הבודק רק חתימות עשוי לראות תעודה בעלת שרשרת חוקית, אף שבעל הדומיין האמיתי כלל לא ביקש אותה. שקיפות תעודות מוסיפה יכולת תצפית ציבורית: התעודות והתחייבויות הרישום שלהן מופיעות ביומנים שאפשר לבדוק ולנטר. המטרה אינה להצפין את התעודה או להסתיר את זהות האתר, אלא לאפשר גילוי של הנפקות חריגות גם לאחר שעברו את בדיקת החתימות הרגילה.</p>\n<p>יש להפריד בין הרשות המנפיקה, היומן והמנטר. היומן מקבל תעודות ומנהל מבנה נתונים שניתן לביקורת. המנטר קורא רישומים ומחפש למשל תעודות חדשות עבור דומיינים שהארגון מנהל. בעל דומיין שרואה תעודה שלא הזמין יכול לפתוח בירור ולבקש טיפול. עצם העובדה שתעודה מופיעה ביומן אינה אומרת שהיומן אישר שהמבקש הוא בעל הדומיין; בדי
