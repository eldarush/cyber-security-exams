קת הזכאות להנפקה היא אחריות נפרדת.</p>\n<h3>התחייבות חתומה, הוכחת הכלה וביטול</h3>\n<p>חותמת הזמן החתומה היא הבטחה של יומן מסוים לכלול את התעודה בהתאם לכלליו. חתימת היומן מאפשרת לדפדפן לזהות מי נטל את ההתחייבות ולוודא שלא שינו אותה. היא שונה מהוכחת הכלה בעץ מרקל, שמראה כי רשומה מסוימת כבר נכללה במצב מסוים של היומן. הוכחת עקביות נועדה להראות שהיומן גדל באמצעות הוספה ולא שכתב את עברו. מבני הנתונים האלה מאפשרים ביקורת יעילה גם בלי שכל לקוח יוריד כל רשומה.</p>\n<p>דפדפן יכול לדרוש התחייבויות מיומנים שהוא מכיר, בהתאם למדיניותו, ועדיין חייב לבדוק זהות דומיין, שרשרת אמון וזמני תוקף. מנגנוני ביטול כגון רשימות ביטול או תשובות סטטוס פותרים בעיה אחרת: תעודה שהייתה קיימת כעת אינה אמורה להתקבל. רישום פומבי אינו מוחק תעודה ואינו מונע לבדו שימוש במפתח שנגנב. לכן חלופה המחליפה שקיפות בביטול, או טוענת שחותמת היומן פותרת את פרטיות בירור הסטטוס, מבלבלת בין מנגנונים שונים.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>נניח שבעל אתר מגלה ביומן תעודה שהונפקה בשמו בלי ידיעתו. הממצא מאפשר לפתוח בירור מול המנפיק ולנקוט פעולות ביטול והחלפה, אך היומן אינו מתקן לבדו את ההנפקה. זהו ההבדל בין ראיה ציבורית שמסייעת לגילוי ולהרתעה לבין אמצעי אכיפה שמונע קבלת תעודה מסוימת. שני התפקידים משלימים זה את זה ונחוצים בזמנים שונים של הטיפול באירוע.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_31052024_0.docx (2).pdf","question_type":"multiple-choice","solution":"solutions/Q063.html"},{"id":"Q064","year":"2024","stem":"אליס הצפינה בעזרת צופן DES (שגודל הבלוק שלו הוא 8 בתים) ושיטת הפעלה (mode of operation)\nשל ECB, את הbytes של ה plaintext הבא:\nABCDEFGHABCDEFGH עם מפתח ההצפנה שמורכב מהbytes של המחרוזת lemonlem . מה הייצוג ההקסדצימלי של ה bytes\nשל ה ciphertext שיצא לה?","options":["437d7e60707604f3437d7e60707604f3","618142157df60e232e6fea24db009df9","00112233445566778899aabbccddeeff","2e6fea24db009df9ced6000330c42994"],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":2},{"file":"2024/689156_04_20102024_0 3.pdf","date":"20/10/2024","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.46,"exam_count":2,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-25-02\" data-doc=\"original-25\" data-body-words=\"430\"><h2>שאלה 2 — DES ECB לשני בלוקים זהים</h2><div class=\"answer-body\">\n<p><strong>1 — 437d7e60707604f3437d7e60707604f3.</strong> DES מעבד בלוקים של 8 בתים; המסר מתחלק ל־ABCDEFGH ול־ABCDEFGH. ב־ECB מתקיים C₁=E_K(P₁), C₂=E_K(P₂), ולכן P₁=P₂ מחייב C₁=C₂. בפלט 1 שני בלוקי 8 הבתים זהים: 437d7e60707604f3. בפלטים 2,3,4 חצאי הפלט שונים ולכן אינם יכולים להתאים. הפלט נבדק גם בחישוב DES ממשי באמצעות ספריית ההצפנה של .NET, במצב ECB וללא padding. לצורך בחירה בין האפשרויות אין צורך לחשב ידנית את סבבי DES; ההנחה היא הצפנת שני הבלוקים הנתונים בלי הוספת בלוק padding מלא.</p>\n<h3>הבלוק, המפתח ושיטת ההפעלה</h3>\n<p>צופן בלוקים מגדיר פעולה הפיכה על מקטע בגודל קבוע תחת מפתח סודי. עבור אותו מפתח ואותו בלוק קלט מתקבל אותו בלוק פלט, והפענוח באמצעות המפתח המתאים מחזיר את הקלט. הגדרה זו אינה אומרת כיצד להצפין מסמך ארוך, איך לטפל במקטע אחרון קצר או איך למנוע חשיפת דפוסים בין בלוקים. לצרכים האלה בוחרים שיטת הפעלה ומגדירים כללי אתחול וריפוד מתאימים.</p>\n<p>בשיטת ספר קוד אלקטרוני כל בלוק מוצפן בנפרד, בלי תלות במיקומו או בבלוקים שכנים. לפיכך שני בלוקים זהים באותה הודעה ובאותו מפתח חייבים לתת פלט זהה. אפשר לנצל את הכלל הזה בשאלת בחירה בלי לחשב את הסבבים הפנימיים של הצופן: מחלקים את המסר לפי גודל הבלוק, מזהים חזרות ומשווים את המקטעים המקבילים בכל הצעת פלט. ייצוג הקסדצימלי משתמש בשני תווים לכל בית, ולכן צריך להקפיד על גבולות הבלוק ולא להשוות רק קטעים שנראים דומים.</p>\n<h3>מה אפשר ללמוד ומה אי אפשר להסיק מן הדפוס</h3>\n<p>חזרת בלוקים היא גם חולשה: הצופן אינו מסתיר שהופיעו מקטעים שווים, אפילו אם אינו חושף מיד מה תוכנם. לכן צופן בלוקים שנחשב חזק אינו הופך כל שיטת הפעלה לבטוחה. שימוש מעשי דורש בחירה לפי תכונות המידע והאיומים, ובדרך כלל גם אימות שלמות שמונע החלפת בלוקים או שינויים לא מורשים. הצפנה וסודיות אינן אותו דבר כמו הרשאה או מקור מאומת.</p>\n<p>ריפוד הוא עניין נפרד. אם מדיניות ההצפנה מוסיפה תמיד בלוק ריפוד גם כשהמסר כבר באורך מדויק, הפלט יהיה ארוך יותר ממספר בלוקי המסר המקוריים. בשאלה המציגה רק את שני הבלוקים המוצפנים צריך לקרוא את ההנחות ולא להמציא בלוק נוסף. גם אורך מפתח אינו גודל בלוק, והיותו מחרוזת קריאה אינו משנה את הכלל הדטרמיניסטי. לעומת הצפנה סימטרית, אלגוריתם מפתח ציבורי מחלק את יכולות ההצפנה או האימות והפענוח או החתימה בין מפתחות שונים. מדיניות דפדפן או יומן תעודות אינם כלל אלגוריתמי להצפנת בלוקים, גם אם מופיעות בהם אותיות לועזיות דומות.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>שוויון בין בלוקי פלט הוא תנאי הכרחי בהצפנה עצמאית של בלוקי קלט שווים, אך אינו מוכיח לבדו שכל שיטת הצפנה אחרת שגויה תמיד. ההכרעה כאן נשענת על הגדרת השיטה והמפתח הקבוע בשאלה. בשיטה הכוללת שרשור או קלט אתחול, אותה חזרה בקלט יכולה לתת פלט שונה. לכן יש לבדוק תחילה את שיטת ההפעלה ורק אז להסיק מסקנה מן הדפוס.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_31052024_0.docx (2).pdf","question_type":"multiple-choice","solution":"solutions/Q064.html"},{"id":"Q065","year":"2024","stem":"איזו מבין הטענות הבאות נכונה?","options":["אתר אינטרנט יכול להשתמש ב Content Security Policy (CSP) כדי להגדיר מאיזה כתובות מותר לטעון משאבים כמו קבצי JS שירצו באתר האינטרנט על ידי הדפדפן של הלקוח","ב PKI, שרת אינטרנט X שקיבל תעודה חתומה מ CA על ה public key שלו, חייב ש ה CA שנתן לו (ל X) את התעודה יהיה ב root store של הלקוחות","ב TLS, שרת האינטרנט מייצר את התעודה עבור חיבור ה TLS","על מנת לבצע התקפת ARP poisoning, התוקף זקוק ליכולת Man in the Middle"],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.298,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-25-09\" data-doc=\"original-25\" data-body-words=\"387\"><h2>שאלה 9 — טענה נכונה על CSP</h2><div class=\"answer-body\">\n<p><strong>1 — CSP מגדירה מקורות מורשים לטעינת משאבים, כולל סקריפטים.</strong> 2 שגויה: מנפיק התעודה הישיר יכול להיות intermediate CA שאינו ב־root store, כל עוד שרשרת מובילה לשורש אמין. 3 שגויה בהקשר Web PKI: CA מנפיק וחותם על התעודה, והשרת אינו נדרש לייצרה מחדש לכל חיבור. 4 שגויה: הזרקת ARP ברשת המקומית יכולה ליצור יכולת MITM; אין צורך שהיא תתקיים לפני ההרעלה.</p>\n<h3>מדיניות שמגבילה מה העמוד רשאי לטעון</h3>\n<p>דף אינטרנט הוא מסמך שמסוגל לטעון רכיבים ממקורות רבים: קוד, תמונות, גופנים, מסגרות ועוד. בלי מגבלה נוספת, חולשת הזרקה עשויה לאפשר לתוקף להוסיף הוראה שטוענת קובץ קוד משרת שבשליטתו. מדיניות אבטחת תוכן מאפשרת לשרת למסור לדפדפן רשימת כללים שמגדירה אילו סוגי משאבים רשאים להגיע מאילו מקורות. הדפדפן אוכף את הכללים בזמן הטעינה או ההרצה, גם אם תגית שמבקשת משאב אסור כבר נמצאת במסמך.</p>\n<p>למשל, מדיניות שמאפשרת סקריפטים רק ממקור האתר יכולה לחסום תגית שמפנה לקובץ קוד באתר תוקף. אפשר להגדיר הוראות נפרדות לסקריפטים, תמונות וחיבורים, ולשלב מזהים אקראיים או גיבובים כדי לאשר קוד מסוים. המנגנון אינו מנחש מה בטוח מתוך שם הקובץ; הוא אוכף את המדיניות שהאתר ניסח. משום כך מדיניות רחבה מדי, או מקור מורשה שמאפשר לתוקפים להעלות תוכן פעיל, עלולים להשאיר מסלול תקיפה.</p>\n<h3>ההבדל מהצפנה ומאימות בקשות</h3>\n<p>הכללים אינם מצפינים את המסמך ואינם מסתירים אותו ממאזין בדרך. סודיות התעבורה ניתנת באמצעות ערוץ מוצפן. הם גם אינם דורשים מהמשתמש להקליד טוקן לכל פעולה, ואינם מחליפים אימות שהבקשה אכן נוצרה מתוך הטופס והסשן המתאימים. אתר יכול לקיים מדיניות תוכן טובה ובכל זאת לקבל בקשת פעולה מזויפת אם אינו בודק את מקור הכוונה וההרשאה.</p>\n<p>תפקידה העיקרי בהקשר השאלה הוא שכבת צמצום נזק מול הזרקת תוכן פעיל. היא משלימה קידוד פלט נכון ואינה מבטלת את הצורך בו, משום שלא כל תוכן מסוכן חייב להגיע מקובץ חיצוני חדש. גם שקיפות תעודות ובדיקת ביטול אינן שייכות לכללים האלה: הן עוסקות בזהות מפתח האתר ובתוקף האמון בו, בעוד כאן מגדירים התנהגות של המסמך לאחר שהגיע לדפדפן. בעת ניתוח חלופות צריך לבדוק איזה נכס כל מנגנון מגן עליו, ולא לבחור לפי כך שכל השמות קשורים באופן כללי לאבטחת רשת.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>רכיב מורשה אינו בטוח רק משום שהוא נטען מכתובת שמופיעה ברשימה. אם האתר מאפשר למשתמש לפרסם קובץ קוד באותו מקור מורשה, הזרקה עשויה לנצל אותו בלי לטעון כתובת חיצונית. לכן ניסוח המדיניות צריך להתאים למבנה האתר ולשליטת המשתמשים בתוכן. זו דוגמה לגבול מעשי שמסביר מדוע מדיניות משלימה נדרשת לצד טיפול נכון בקלט ובפלט.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_31052024_0.docx (2).pdf","question_type":"multiple-choice","solution":"solutions/Q065.html"},{"id":"Q066","year":"2024","stem":"איזו מבין הטענות הבאות נכונה?","options":["בביטקוין משתמשים במפתחות א-סימטריים.","מגדירים cookies להיות samesite עם הערך strict כאשר רוצים להגדיר את ה HTTP Strict Transport Security (HSTS).","מגדירים token להיות samesite עם הערך strict כאשר רוצים להגדיר את ה HTTP Strict Transport Security (HSTS).","CAים משתמשים בעץ מרקל כדי שיוכלו לתחזק בעץ את ה hash של הלקוחות הניגשים לתעודות של אתרי האינטרנט."],"note":"","sources":[{"file":"2024/689156_31052024_0.docx (2).pdf","date":"31/05/2024","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.312,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-25-10\" data-doc=\"original-25\" data-body-words=\"373\"><h2>שאלה 10 — טענה נכונה על ביטקוין</h2><div class=\"answer-body\">\n<p><strong>1 — ביטקוין משתמש במפתחות א־סימטריים.</strong> מחזיק המפתח הפרטי חותם והאחרים מאמתים במפתח הפומבי. 2 ו־3 מבלבלות SameSite, שמגביל cookies בין אתרים, עם HSTS, שכופה HTTPS. 4 מבלבלת לוגי תעודות ועצי מרקל עם מעקב אחר לקוחות שגולשים; זה אינו תפקיד CA או CT.</p>\n<h3>חוקיות עסקאות לעומת הכרעה על סדר ההיסטוריה</h3>\n<p>עסקת ביטקוין מנסה להוציא פלטים קיימים ולהגדיר פלטים חדשים. הצמתים בודקים בין היתר שהפלטים הנצרכים קיימים, שלא נצרכו כבר בהיסטוריה הרלוונטית, שתנאי הפדיון מתקיימים ושהסכומים עומדים בכללי הפרוטוקול. חתימה תקינה מוכיחה הרשאה להשתמש בפלט מסוים, אך אינה פותרת לבדה מצב שבו בעל המפתח חתם על שתי עסקאות סותרות. לשתי עסקאות יכולות להיות חתימות תקינות, בעוד שאי אפשר לקבל את שתיהן באותה היסטוריה תקפה.</p>\n<p>הקונצנזוס מספק דרך להכריע איזו היסטוריה תיחשב פעילה כשיש ענפים מתחרים. כורים אוספים עסקאות לבלוק מועמד ומחפשים כותרת שעומדת ביעד הוכחת העבודה. צמתים המקבלים בלוק אינם צריכים לסמוך על הכרזת הכורה: הם מחשבים ובודקים את העבודה ואת חוקיות התוכן בעצמם. כורה רשאי לבחור מבין עסקאות תקינות, ואין כלל בסיסי שמחייב אותו לבחור דווקא את בעלות העמלות הגבוהות ביותר.</p>\n<h3>אישורים, הסתעפויות והיעדר סמכות מרכזית</h3>\n<p>שני כורים יכולים למצוא בלוקים קרובים בזמן ולגרום להסתעפות זמנית. בהמשך מתווספת עבודה לאחד הענפים, והצמתים מעדיפים את השרשרת התקפה בעלת העבודה המצטברת המרבית. אישורים נוספים מגדילים את העבודה שתידרש כדי להחליף את העסקה בהיסטוריה מתחרה. זו הגנה התלויה בהנחות על כוח התוקף ועל תנאי הרשת, ולא משפט שלפיו ארגון מחדש בלתי אפשרי לאחר מספר קבוע של בלוקים.</p>\n<p>לא נדרש שרת מרכזי שיחתום על כל בלוק שהתקבל, ולא נדרש מכל משתמש לכרות כדי לבצע עסקה. הארנק מנהל מפתחות וחתימות, הכורים מציעים סדר באמצעות בלוקים, והצמתים מאמתים באופן עצמאי. אין גם מנגנון כללי שבו כורה חייב להפקיד ערבון שנחתך בגלל הוצאה כפולה; רעיון כזה שייך לתכנונים אחרים ואינו הבסיס המתואר כאן. עצי מרקל מאפשרים לחייב אוסף עסקאות ולהוכיח הכלה ביעילות, אך אינם מצפינים אותן ואינם מחליפים את בדיקות החוקיות. ההפרדה בין התפקידים מונעת בלבול בין פרטיות, הרשאה, הוכחת עבודה וקונצנזוס.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בעת שינוי כללי הרשת צריך לבדוק גם תאימות בין צמתים שכבר עודכנו לבין צמתים ישנים. כלל חדש שמקבל בלוקים שנדחו בעבר עלול ליצור שרשראות שכל קבוצה מקבלת אחרת. כלל מצמצם בלבד יכול לאפשר תאימות מסוג אחר. לכן סיווג שינוי נקבע לפי קבוצת הבלוקים החוקיים ולא לפי השאלה אם ההצעה נשמעת מועילה, מהירה או חדשנית.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_31052024_0.docx (2).pdf","question_type":"multiple-choice","solution":"solutions/Q066.html"},{"id":"Q067","year":"2024","stem":"תכונת ה second pre image resistance מוגדרת כ:","options":["בהינתן הודעה אקראית m, קשה למצוא הודעה m’ ששונה מ m, כך ש h(m) = h(m’)","בהינתן digest d של הודעה אקראית, קשה למצוא הודעה m כך ש h(m)=d","בהינתן הודעה אקראית m, קשה למצוא הודעה m’ ששונה מ m, כך ש h(m) שונה מ h(m’)","בהינתן digest d של הודעה אקראית, קשה למצוא digest d’ כך ש d שונה מ d’"],"note":"","sources":[{"file":"2024/689156_04072024_0 (2).pdf","date":"04/07/2024","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.263,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-15-01\" data-doc=\"original-15\" data-body-words=\"379\"><h2>שאלה 1 — קדם־תמונה שנייה</h2><div class=\"answer-body\">\n<p><strong>א — בהינתן m קשה למצוא m′≠m כך ש־h(m)=h(m′).</strong> ב היא preimage resistance, שבה נתון digest ולא מסר. ג מבקשת הודעה עם hash שונה, דבר קל. ד מבקשת digest שונה בלבד, גם הוא קל. המאפיין המכריע הוא שהמסר הראשון קבוע מראש.</p>\n<h3>שלוש בעיות חיפוש שונות</h3>\n<p>פונקציית גיבוב ממפה מסרים באורכים שונים לתוצאה באורך קבוע. מכיוון שיש יותר מסרים מתוצאות אפשריות, קיימים בהכרח מסרים שונים בעלי אותה תוצאה. דרישת האבטחה אינה שאין התנגשויות כלל, אלא שלא תהיה לתוקף דרך מעשית למצוא את ההתאמות המסוכנות הנדרשות בתקיפה. כדי להבין איזו תכונה נשאלת צריך קודם לשאול מה כבר ניתן לתוקף ומה הוא רשאי לבחור בעצמו.</p>\n<p>בעמידות לקדם־תמונה התוקף מקבל תוצאה ומנסה למצוא מסר שמגיע אליה. הוא אינו חייב למצוא דווקא את המסר המקורי; כל מסר בעל אותה תוצאה מספיק. בעמידות לקדם־תמונה שנייה התוקף מקבל מסר מסוים, וצריך למצוא מסר אחר בעל אותו גיבוב. בעמידות להתנגשויות שני המסרים נתונים לבחירתו, כל עוד יהיו שונים ויגיעו לאותה תוצאה. ההבדל בין קיבוע מסר אחד לבין בחירת שני מסרים מסביר מדוע שמות התכונות אינם ניתנים להחלפה.</p>\n<h3>קישור למקרה מעשי ולמסיחים</h3>\n<p>במערכת אימות סיסמאות, נתון חשבון מסוים עם ערך בדיקה שנוצר מסיסמה מסוימת. אם סיסמה שונה עוברת את אותה בדיקה תחת אותו ערך המלחה, שני קלטים שונים הובילו לאותו גיבוב. עצם האירוע הוא התנגשות; תקיפה מכוונת של החשבון הקבוע נוגעת לקדם־תמונה שנייה. הוספת ערך המלחה אינה מבטלת את האפשרות המתמטית להתנגשויות, אך מונעת שימוש באותו חישוב מוקדם עבור משתמשים רבים.</p>\n<p>לשם השוואה, מציאת שני מסרים עם תוצאות שונות היא פעולה קלה ורצויה. אם כמעט כל מסר היה מקבל אותה תוצאה, הפונקציה הייתה חסרת תועלת לזיהוי שינויים. גם יצירת מחרוזת תוצאה שונה מזו שניתנה אינה מעידה על קושי קריפטוגרפי. לכן חלופות שמחליפות את סימן השוויון באי־שוויון אינן וריאציה קטנה של ההגדרה אלא טענה אחרת לגמרי. מונחים מתחומים כגון תעודות, כפיית הצפנה או סוד נוסף באחסון סיסמאות עשויים להיות קשורים להגנה הכוללת, אך אינם מגדירים את בעיית החיפוש של הגיבוב עצמו. הבחירה הנכונה מבוססת על הקלט, יעד החיפוש ותנאי ההצלחה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אורך התוצאה משפיע על עלות התקיפות הכלליות: בחיפוש זוג חופשי קיימת תופעת יום ההולדת, שמאפשרת לפגוש התנגשות מוקדם יחסית לחיפוש קדם־תמונה של תוצאה קבועה. אין צורך לחשב את העלות המדויקת כדי לזהות את ההגדרה, אך העיקרון מסביר מדוע אסור להחליף בין שני סוגי החיפוש. חופש הבחירה של התוקף משנה את הבעיה גם באותה פונקציה עצמה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04072024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q067.html"},{"id":"Q068","year":"2024","stem":"עבור n=19 ו g=3 , אליס ובוב הריצו את פרוטוקול Diffie-Hellman. במהלך הרצת הפרוטוקול, אליס שלחה לבוב את המספר 15 ובוב שלח לה את המספר 5. מה מהבאים יכול להיות המספר הסודי המשותף שנבחר? (כלומר, מה המפתח המשותף שיצא לשניהם בסוף התהליך)","options":["9","4","12","11"],"note":"","sources":[{"file":"2024/689156_04072024_0 (2).pdf","date":"04/07/2024","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"דיפי-הלמן והחלפת מפתחות","topic_score":0.491,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-15-02\" data-doc=\"original-15\" data-body-words=\"371\"><h2>שאלה 2 — דיפי–הלמן g=3,n=19</h2><div class=\"answer-body\">\n<p><strong>א — 9.</strong> 3⁵≡15 mod19 ו־3⁴≡5 mod19, ולכן אפשר לבחור a=5,b=4. המפתח K=5⁵ mod19: 5²≡6, 5⁴≡36≡17, 5⁵≡85≡9. מהצד השני 15²≡16, 15⁴≡256≡9. ב 4, ג 12 וד 11 אינם המפתח המתאים.</p>\n<h3>איך נוצר סוד משותף בלי לשלוח אותו</h3>\n<p>בחילוף המפתחות הנדון שני הצדדים מסכימים על קבוצה מתמטית, בסיס ומודולוס. כל צד בוחר מעריך פרטי, מעלה את הבסיס בחזקה שלו ושולח רק את התוצאה הציבורית. לאחר מכן הוא מעלה את הערך שקיבל בחזקת הסוד הפרטי שלו. חוקי החזקות מבטיחים ששני הצדדים יגיעו לאותו ערך, משום שכפל המעריכים מתחלף. התמליל הציבורי כולל אפוא את הבסיס ושני ערכי החזקה, אך אינו כולל במפורש את שני המעריכים או את הסוד המשותף.</p>\n<p>בשאלות מספריות קטנות אפשר למצוא את המעריך המתאים לערך ציבורי באמצעות טבלת חזקות. אין כאן סתירה לביטחון העקרוני: המודולוסים הזעירים נבחרו כדי לאפשר חישוב בבחינה, ולא כדי לייצג פרמטרים בטוחים. אחרי שמוצאים מעריכים אפשריים, מחשבים את הסוד בשתי דרכים ובודקים התאמה. ריבועים חוזרים וצמצום השארית בכל צעד מקטינים את המספרים ומאפשרים לתפוס שגיאת חשבון לפני בחירת האפשרות.</p>\n<h3>הנחת הקושי לעומת אימות הזהויות</h3>\n<p>בעיית הלוגריתם הדיסקרטי שואלת כיצד לשחזר מעריך מתוך הבסיס ותוצאת החזקה. חישוב הסוד המשותף ישירות מתוך שני ערכים ציבוריים מנוסח באמצעות הנחת קושי קשורה, שאינה זהה בכל קבוצה מתמטית. במסגרת השאלון הייחוס ללוגריתם דיסקרטי הוא ההבחנה המבוקשת מול צפנים קלאסיים או מנגנוני קונצנזוס. בפרוטוקול מעשי צריך גם לבדוק את תקינות ערכי הקלט, לבחור קבוצה מתאימה ולהפיק מן הסוד מפתחות באמצעות פונקציית גזירה.</p>\n<p>המתמטיקה לבדה אינה מאמתת עם מי הוחלפו הערכים. תוקף פעיל יכול להציב ערך ציבורי משלו מול כל צד, ליצור שני סודות שונים ולתווך בין הצדדים. לעומת זאת, מאזין פסיבי שאינו משנה הודעות אינו יכול לבצע החלפה כזאת. לכן בתרחיש שמגביל במפורש את התוקף להאזנה, אין לפסול את השיטה רק מפני שהיא פגיעה לתוקף פעיל חזק יותר. כשנדרש אימות אפשר לחתום על ערכי ההחלפה והקשרם או להשתמש במנגנון מאומת אחר. יש להפריד בכל תשובה בין סודיות מול מאזין, חישוב הסוד המספרי והבטחת זהות הצד האחר.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אם מוצאים כמה מעריכים שמניבים אותו ערך ציבורי בקבוצה הקטנה, אין לבחור ביניהם לפי מראית עין. הם יכולים להיות שקולים לפי סדר תת־הקבוצה שנוצרת מן הבסיס, ולכן לייצר אותו סוד משותף. החישוב צריך להיעשות בתוך הקבוצה והמודולוס הנתונים. לא מחברים את הערכים הציבוריים זה לזה ולא מתייחסים לאחד מהם אוטומטית כאל המפתח הסופי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04072024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q068.html"},{"id":"Q069","year":"2024","stem":"רוצים לבנות טבלת משתמשים ב DB שתשמור את המידע שישמש להתחברות לאתר. כל אחת מההצעות הבאות מתארת אילו עמודות יהיו בטבלה - כלומר, גם אלו ערכים יהיו בהן. איזה מבין ההצעות הבאות מציגה שימוש לא נכון ב salt ו/או pepper מבחינה אבטחתית (כלומר, היישום המוצג לא משיג את מטרת חיזוק האבטחה ע״י מנגנונים אלו)?\n(h היא פונק' hash והסימן || הוא שרשור)","options":["username, salt, h(password) || h(salt || pepper)","username, salt, h(password || salt || pepper)","username, salt, h(password || salt)","username, h(password || pepper)"],"note":"","sources":[{"file":"2024/689156_04072024_0 (2).pdf","date":"04/07/2024","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.3,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-15-03\" data-doc=\"original-15\" data-body-words=\"413\"><h2>שאלה 3 — שימוש שגוי ב־salt ו־pepper</h2><div class=\"answer-body\">\n<p><strong>א — username,salt,h(password)||h(salt||pepper).</strong> הרכיב h(password) נשאר חשוף ונבדק לבדו מול ניחושי סיסמאות; הוספת hash נפרד אינה הופכת אותו למומלח או למפולפל. ב מערבת את שניהם באותו hash ותורמת את שתי ההגנות; ג משתמשת ב־salt כראוי ומונעת טבלאות משותפות; ד משלבת pepper סודי ומקשה על תוקף שגנב רק DB. ג וד אינן מספקות בדיוק אותן הגנות כמו שילוב שניהם, אך אינן הכשל המוצג בא.</p>\n<h3>מה צריך להישמר כדי שאפשר יהיה לבדוק סיסמה</h3>\n<p>שרת שאינו שומר סיסמאות גלויות צריך בכל זאת להיות מסוגל לבדוק ניסיון כניסה. לשם כך הוא שומר ערך בדיקה שאפשר לחשב מחדש מסיסמת הניסיון ומפרמטרים זמינים. ערך המלחה אקראי ושונה לכל משתמש נשמר לצד ערך הבדיקה ואינו אמור להיות סוד. הוא גורם לכך שגם שתי סיסמאות זהות של משתמשים שונים יניבו קלטי גיבוב שונים, ולכן תוקף אינו יכול להשתמש באותה טבלת חישובים מוכנה עבור כולם.</p>\n<p>סוד נוסף הנשמר בנפרד ממסד הנתונים ממלא תפקיד אחר: הוא מקשה על מי שגנב רק את הטבלה לבצע ניחושים לא מקוונים. כדי שההגנה תהיה רלוונטית, הסיסמה, ערך ההמלחה והסוד הנוסף צריכים להשפיע על אותו ערך בדיקה. אם שומרים גיבוב חשוף של הסיסמה ולצידו גיבוב אחר של פרמטרים, התוקף יכול להתעלם מן הרכיב השני ולבדוק את הראשון לבדו. זו דוגמה לכך שצירוף שמות של מנגנונים אינו מספיק; צריך לנתח מה נדרש לכל ניסיון ניחוש.</p>\n<h3>זמינות פרמטרים ועלות ניחוש</h3>\n<p>הסתרת ערך ההמלחה באמצעות גיבוב בלבד יכולה דווקא לשבור את האימות החוקי: השרת מכיר את סיסמת הניסיון אך אינו יודע איזה ערך צריך לשרשר אליה. אם הערך המקורי אקראי וארוך, אין דרך מעשית לשחזר אותו מהגיבוב. קושי שהתכוון המפתח להטיל על התוקף הוטל במקרה זה גם על עצמו. לעומת זאת, שרשור שם משתמש שמור או הפעלת גיבוב נוסף הם חישובים שאפשר לשחזר מן הנתונים הזמינים.</p>\n<p>הגדלת מספר סבבי החישוב יכולה להעלות את המחיר של כל ניחוש. השרת מבצע את החישוב רק בכניסות לגיטימיות, בעוד תוקף שבודק מיליוני סיסמאות משלם את העלות שוב ושוב. הגרלת הרבה ערכי המלחה ושמירת האחרון בלבד אינה משיגה זאת, כי בבדיקת ניחוש לא חוזרים על ההגרלות שנזרקו. עלות מכוונת חייבת להיות חלק מחישוב ערך הבדיקה. פתרונות מעשיים משתמשים בפונקציית גזירת סיסמאות ייעודית ובפרמטרי עלות, אך בשאלה יש לנתח קודם את המבנה המוצע ולא להניח שכל שימוש בפונקציית גיבוב הוא בטוח אוטומטית.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>גם לאחר בחירת מבנה תקין יש להגביל ניסיונות כניסה מקוונים, להגן על ערוץ השליחה ולשמור הרשאות מצומצמות למסד. ערך המלחה אינו מגדיל את האקראיות של הסיסמה שהמשתמש בחר, ולכן סיסמה נפוצה עדיין עשויה להימצא בניחוש. ההגנה גורמת לתוקף לעבוד בנפרד לכל משתמש; היא אינה הופכת כל סיסמה קצרה לסוד ארוך ואקראי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04072024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q069.html"},{"id":"Q070","year":"2024","stem":"איזו מבין הטענות הבאות נכונה?","options":["ב TLS , מנגנון ה chain of trust מאפשר ללקוח הגולש לשרת foo.com לוודא את תקינות התעודה שקיבל כחלק מתהליך הקמת החיבור המוצפן.","ב TLS, משתמשים במפתחות זהים להצפין תעבורה הנשלחת מהשרת ללקוח ותעבורה הנשלחת מהלקוח לשרת.","ב TLS, שרת חייב לוודא את תקינות התעודה של הלקוח לפני השלמת החיבור.","לא ניתן להקים חיבור TLS בלי ביצוע מנגנון Diffie Hellman."],"note":"","sources":[{"file":"2024/689156_04072024_0 (2).pdf","date":"04/07/2024","num":4}],"topic":"PKI, תעודות, CT ו-OCSP","topic_manual":true,"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-15-04\" data-doc=\"original-15\" data-body-words=\"369\"><h2>שאלה 4 — טענה נכונה על TLS</h2><div class=\"answer-body\">\n<p><strong>א — שרשרת האמון מאפשרת לאמת את תעודת השרת.</strong> ב שגויה: נגזרים מפתחות נפרדים לכיוון לקוח→שרת ושרת→לקוח. ג שגויה: אימות לקוח באמצעות תעודה אינו חובה בחיבור TLS רגיל. ד שגויה במודל TLS 1.2 שנלמד, שבו קיים גם RSA key exchange ולא בהכרח DH. תעודה דורשת בנוסף בדיקת דומיין, זמן ושימוש מורשה.</p>\n<h3>חלוקת התפקידים בהקמת הערוץ</h3>\n<p>בתחילת החיבור הלקוח והשרת עדיין אינם חולקים את מפתחות התעבורה החדשים. הלקוח פותח במשא ומתן על פרמטרים, השרת בוחר מבין האפשרויות המותרות ומציג אמצעי אימות מתאים, ובהמשך הצדדים מפיקים סוד משותף וממנו מפתחות. בהקשר מבוסס תעודות הלקוח בודק שהמפתח שהוצג קשור לשם האתר שאליו התכוון להגיע וששרשרת החתימות מובילה לשורש אמין. קיום חתימה חוקית כשלעצמו אינו מספיק אם התעודה שייכת לאתר אחר או אם אינה בתוקף.</p>\n<p>בשאלות המתארות חילוף מפתחות באמצעות הצפנה במפתח ציבורי של השרת, הלקוח יוצר סוד ראשוני ומצפין אותו כך שרק בעל המפתח הפרטי יוכל לפענחו. זהו מסלול היסטורי, ואין להשליך ממנו שכל חיבור מודרני פועל כך. בחילוף מפתחות זמני מבוסס דיפי–הלמן, מפתח התעודה משמש לאימות פרמטרים והסוד אינו מועבר באותה הצפנת מפתח ציבורי. להבחנה יש משמעות כאשר מפתח התעודה נגנב לאחר הקלטת התקשורת.</p>\n<h3>תמליל מאומת וגזירת מפתחות</h3>\n<p>בסוף הקמת החיבור הצדדים בודקים ערכים התלויים בתמליל הודעות ההקמה ובסודות שהפיקו. כך ניתן לזהות תוקף שהחליף הודעה בדרך גם אם היא נראית תקינה מבחינת התחביר. אם כל צד זוכר תמליל אחר, ערכי האימות אינם תואמים. שינוי שהורס תחביר או מונע הסכמה יכול כמובן לגרום לכשל מוקדם יותר, ולכן יש להבחין בין זיהוי אפשרי לבין זיהוי קריפטוגרפי מובטח בשלב האימות.</p>\n<p>מספרים אקראיים והקשר ההקמה נכללים בגזירת המפתחות כדי להבחין בין חיבורים ולהקטין שימוש חוזר בלתי רצוי בחומר מפתחות. נגזרים מפתחות נפרדים לכיווני התעבורה; באותו כיוון הצד המצפין והצד המפענח משתמשים בסוד הסימטרי המתאים. לאחר ההקמה אין צורך להצפין כל הודעת יישום בעזרת המפתח הציבורי שבתעודה. ההצפנה הסימטרית מגינה על התעבורה, ואימות השלמות מונע שינויים שקטים. כל זאת עדיין תלוי בבדיקה נכונה של זהות השרת ובהגנת המפתחות.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>יש גם להבחין בין מפתח ארוך־טווח שמזהה אתר לבין מפתח זמני של חיבור מסוים. תעודה יכולה לשמש חיבורים רבים, בעוד מפתחות תעבורה חדשים מופקים בכל הקמה מתאימה. לכן ידיעת תעודה ציבורית אינה ידיעת מפתח הפענוח של הסשן. חזרה של תעודת האתר בחיבורים שונים אינה כשלעצמה שימוש חוזר באותו מפתח הצפנה סימטרי לתוכן המשתמשים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04072024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q070.html"},{"id":"Q071","year":"2024","stem":"איזו טענה אינה נכונה?","options":["בהינתן הודעה m להצפנה ומפתחות הצפנה k1,k2,k3 ששונים אחד מהשני, אין הבדל בפלט של 3DES במידה והוא ממומש על ידי הצפנה-הצפנה-הצפנה או הצפנה-פענוח-הצפנה.","בהינתן הודעה m להצפנה ומפתח הצפנה k, ניתן לייצר בעזרת 3DES את אותו הפלט ש DES היה מוציא.","AES הוא דוגמא לצופן בלוקים.","גם ב AES אנחנו צריכים להגדיר את ה mode of operation."],"note":"","sources":[{"file":"2024/689156_04072024_0 (2).pdf","date":"04/07/2024","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.348,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-15-05\" data-doc=\"original-15\" data-body-words=\"394\"><h2>שאלה 5 — הטענה שאינה נכונה על 3DES</h2><div class=\"answer-body\">\n<p><strong>א — EEE ו־EDE אינם זהים עבור מפתחות שונים.</strong> ההרכבות E_K3(E_K2(E_K1(m))) ו־E_K3(D_K2(E_K1(m))) משתמשות בפעולה שונה בשלב האמצעי, ובדרך כלל נותנות פלטים שונים. ב נכונה: EDE עם שלושה מפתחות שווים מצטמצם ל־DES יחיד. ג נכונה: AES הוא צופן בלוקים. ד נכונה: להצפנת הודעות יש לבחור mode מתאים, למשל GCM, ולא להסתפק בשם AES.</p>\n<h3>הרכבת פעולות הפיכות</h3>\n<p>כאשר מפעילים צופן מספר פעמים, צריך לכתוב במפורש איזה מפתח משמש בכל שלב והאם הפעולה היא הצפנה או פענוח. פענוח הוא הפעולה ההפוכה להצפנה באותו מפתח, ולא שם אחר לאותו חישוב. לכן החלפת שלב אמצעי של הצפנה בפענוח משנה בדרך כלל את הפלט, אפילו אם מספר השלבים נשאר שלוש. מפתחות שונים אינם מאפשרים לבטל שתי פעולות סמוכות כאילו השתמשו באותו מפתח.</p>\n<p>במבנה התקני הנדון מפעילים תחילה הצפנה במפתח הראשון, אחריה פענוח בשני, ולבסוף הצפנה בשלישי. את סדר הביצוע קוראים מתוך הביטוי מבפנים החוצה: ההודעה היא קלט הפעולה הפנימית, והפלט שלה עובר לשלב הבא. כדי לפענח את התוצאה הופכים גם את הפעולות וגם את סדר השלבים. צורת קריאה זו חיונית למניעת טעות כששמות המפתחות מופיעים ברצף חזותי שונה מן הרצף הכרונולוגי.</p>\n<h3>תאימות לאחור ומה היא אינה מוכיחה</h3>\n<p>היתרון ההיסטורי של הכנסת פענוח באמצע הוא שאפשר להציב את אותו מפתח בשלוש העמדות ולקבל בסוף פעולה השקולה להצפנה יחידה בצופן המקורי. ההצפנה והפענוח הסמוכים באותו מפתח מבטלים זה את זה. זאת בדיקה אלגברית ולא תכונה של מסר מסוים, ולכן היא צריכה להתקיים לכל מסר מתאים ולכל מפתח שאפשר להשתמש בו.</p>\n<p>עם זאת, עצם הדרישה שתהיה אפשרות לצמצם הרכבה לצעד אחד אינה מייחדת כל כתיב אפשרי של שלוש פעולות. ניתן לבנות גם הרכבות אחרות עם ביטול כאשר כל המפתחות שווים. משום כך בשאלה המבקשת את הגדרת האלגוריתם נדרשת התאמה למבנה התקני ולסדר המפתחות, ולא רק בדיקת תאימות במצב מיוחד. מנגד, הטענה ששתי הרכבות שונות חייבות לתת תמיד אותו פלט אינה נובעת מהיותן בעלות אותה כמות מפתחות או שלבים. עוד יש להבחין בין מספר מפתחות נומינלי לבין רמת ביטחון בפועל, ובין מבנה הצופן לבין שיטת ההפעלה על הודעה ארוכה. הדיון כאן מסביר את ההרכבה ואת התאימות המבוקשות בבחינה, ואינו ממליץ להשתמש בצופן ההיסטורי למערכת חדשה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אפשר לנתח את ההרכבה גם באמצעות שמות ביניים: רושמים את תוצאת השלב הראשון, אחריה את תוצאת השני ולבסוף את השלישי. כאשר בודקים תאימות מציבים את המפתחות השווים רק לאחר כתיבת שלושת השלבים. סדר זה מונע ביטול של פעולות שאינן סמוכות או שמשתמשות במפתחות שונים. השיטה מועילה גם להבנת מסיחים שהחליפו רק מיקום של מפתח אחד.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04072024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q071.html"},{"id":"Q072","year":"2024","stem":"מחליטים לבצע שינוי לאופן שבו ביטקוין עובד. השינוי הוא שהחליטו לשנות את פונק׳ ה hash שמשתמשים בה לתהליך ה proof of work. איזו מבין הטענות הבאות נכונה?","options":["זאת דוגמא ל hard fork.","זאת דוגמא ל hashing fork.","זאת דוגמא ל proof of work fork.","זאת דוגמה ל soft fork."],"note":"","sources":[{"file":"2024/689156_04072024_0 (2).pdf","date":"04/07/2024","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.259,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-15-06\" data-doc=\"original-15\" data-body-words=\"375\"><h2>שאלה 6 — שינוי פונקציית PoW בביטקוין</h2><div class=\"answer-body\">\n<p><strong>א — hard fork.</strong> בלוקים שעומדים בהוכחת העבודה החדשה אינם בהכרח עומדים בכלל הישן, ולכן צמתים ישנים אינם מקבלים אותם. ד soft fork היה שינוי מצמצם שבו בלוקים חדשים עדיין חוקיים לפי הכללים הישנים. ב וג אינן קטגוריות התאימות המקובלות של fork ומופיעות כמסיחי שמות.</p>\n<h3>חוקיות עסקאות לעומת הכרעה על סדר ההיסטוריה</h3>\n<p>עסקת ביטקוין מנסה להוציא פלטים קיימים ולהגדיר פלטים חדשים. הצמתים בודקים בין היתר שהפלטים הנצרכים קיימים, שלא נצרכו כבר בהיסטוריה הרלוונטית, שתנאי הפדיון מתקיימים ושהסכומים עומדים בכללי הפרוטוקול. חתימה תקינה מוכיחה הרשאה להשתמש בפלט מסוים, אך אינה פותרת לבדה מצב שבו בעל המפתח חתם על שתי עסקאות סותרות. לשתי עסקאות יכולות להיות חתימות תקינות, בעוד שאי אפשר לקבל את שתיהן באותה היסטוריה תקפה.</p>\n<p>הקונצנזוס מספק דרך להכריע איזו היסטוריה תיחשב פעילה כשיש ענפים מתחרים. כורים אוספים עסקאות לבלוק מועמד ומחפשים כותרת שעומדת ביעד הוכחת העבודה. צמתים המקבלים בלוק אינם צריכים לסמוך על הכרזת הכורה: הם מחשבים ובודקים את העבודה ואת חוקיות התוכן בעצמם. כורה רשאי לבחור מבין עסקאות תקינות, ואין כלל בסיסי שמחייב אותו לבחור דווקא את בעלות העמלות הגבוהות ביותר.</p>\n<h3>אישורים, הסתעפויות והיעדר סמכות מרכזית</h3>\n<p>שני כורים יכולים למצוא בלוקים קרובים בזמן ולגרום להסתעפות זמנית. בהמשך מתווספת עבודה לאחד הענפים, והצמתים מעדיפים את השרשרת התקפה בעלת העבודה המצטברת המרבית. אישורים נוספים מגדילים את העבודה שתידרש כדי להחליף את העסקה בהיסטוריה מתחרה. זו הגנה התלויה בהנחות על כוח התוקף ועל תנאי הרשת, ולא משפט שלפיו ארגון מחדש בלתי אפשרי לאחר מספר קבוע של בלוקים.</p>\n<p>לא נדרש שרת מרכזי שיחתום על כל בלוק שהתקבל, ולא נדרש מכל משתמש לכרות כדי לבצע עסקה. הארנק מנהל מפתחות וחתימות, הכורים מציעים סדר באמצעות בלוקים, והצמתים מאמתים באופן עצמאי. אין גם מנגנון כללי שבו כורה חייב להפקיד ערבון שנחתך בגלל הוצאה כפולה; רעיון כזה שייך לתכנונים אחרים ואינו הבסיס המתואר כאן. עצי מרקל מאפשרים לחייב אוסף עסקאות ולהוכיח הכלה ביעילות, אך אינם מצפינים אותן ואינם מחליפים את בדיקות החוקיות. ההפרדה בין התפקידים מונעת בלבול בין פרטיות, הרשאה, הוכחת עבודה וקונצנזוס.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בעת שינוי כללי הרשת צריך לבדוק גם תאימות בין צמתים שכבר עודכנו לבין צמתים ישנים. כלל חדש שמקבל בלוקים שנדחו בעבר עלול ליצור שרשראות שכל קבוצה מקבלת אחרת. כלל מצמצם בלבד יכול לאפשר תאימות מסוג אחר. לכן סיווג שינוי נקבע לפי קבוצת הבלוקים החוקיים ולא לפי השאלה אם ההצעה נשמעת מועילה, מהירה או חדשנית.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04072024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q072.html"},{"id":"Q073","year":"2024","stem":"איזו טענה אינה נכונה?","options":["מנגנון ה Online Certificate Status Protocols (OCSP) משמש miners כחלק מתהליך בדיקת חוקיות של בלוק חדש המיועד להצטרף לבלוקצ׳יין.","מנגנון ה OCSP stapling נועד לפתור בעיית פרטיות במנגנון ה OCSP.","מנגנון Certificate Transparency ומנגנון Certificate Revocation List (CRL) פותרים בעיות שונות.","מנגנון Certificate Transparency בא לידי ביטוי ב certificates על ידי ערכי ה Signed Certificate Timestamp (SCT)."],"note":"","sources":[{"file":"2024/689156_04072024_0 (2).pdf","date":"04/07/2024","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.405,"exam_count":1,"in_sample_exam":false,"variant_group":"V09","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-15-07\" data-doc=\"original-15\" data-body-words=\"384\"><h2>שאלה 7 — הטענה שאינה נכונה על OCSP</h2><div class=\"answer-body\">\n<p><strong>א — OCSP אינו משמש כורים לאימות בלוק.</strong> הוא שירות לבירור סטטוס ביטול תעודות PKI. ב נכונה: stapling מפחית פניות ישירות של הדפדפן ל־OCSP ומסייע לפרטיות. ג נכונה: CRL עוסק בביטול, CT בשקיפות הנפקות. ד נכונה במובן ש־SCTs משמשים הוכחת התחייבות לרישום CT ונמסרים עם התעודה או בערוץ נלווה.</p>\n<h3>ביטול תעודה הוא עדכון אמון ולא שינוי במתמטיקה</h3>\n<p>תעודה עשויה להיות חתומה כחוק ועדיין להפסיק להיות אמינה לפני תאריך הפקיעה שלה, למשל מפני שמפתח פרטי נגנב. החתימה על התעודה אינה נעלמת כאשר הרשות מחליטה לבטל אותה, ולכן הלקוח זקוק למידע נוסף על סטטוסה. רשימת ביטול מפרסמת אוסף תעודות שבוטלו, ושירות סטטוס מקוון מאפשר לברר את המצב של תעודה מסוימת. בשני המקרים המקבל צריך לאמת שהמידע הגיע מגורם מורשה ושאינו ישן מדי.</p>\n<p>למפתח הפרטי של שרת האתר ולמפתח החתימה של רשות התעודות יש תפקידים שונים. גניבת מפתח האתר מאפשרת להתחזות לאתר בהקשרים שבהם התעודה עוד מתקבלת, אך אינה מאפשרת לחתום בשם הרשות על רשימת ביטול או תשובת סטטוס. אחרת כל שרת היה יכול לבטל את ביטולה של תעודתו בעצמו, וכל שרשרת האמון הייתה מאבדת את משמעותה. גם העתקת אישור קיים אינה מאפשרת לשנות את השדות שלו בלי לפגוע בחתימה.</p>\n<h3>הצמדה, פרטיות וכשל תקשורת</h3>\n<p>כאשר הדפדפן פונה ישירות לשירות הסטטוס, השירות עשוי ללמוד באיזו תעודת אתר הדפדפן מתעניין, ונוספות השהיה ותלות בזמינות רשת. הצמדת תשובת סטטוס מאפשרת לשרת האתר לקבל תשובה חתומה ולהגיש אותה ללקוחות במהלך ההקמה. השרת מעביר ראיה חתומה, ואינו מחליף את המשיב המורשה כחותם. הלקוח עדיין בודק התאמה, חתימה וטריות.</p>\n<p>מדיניות המשך במקרה כשל פירושה שאם הבירור אינו אפשרי, הלקוח עשוי להמשיך במקום לחסום. הדבר משפר זמינות אך עלול לאפשר לתוקף לחסום גישה לשירות הסטטוס ולנצל תעודה שכבר בוטלה. מכאן שפער בין ביטול אצל הרשות לבין אכיפה אצל משתמשים אינו מצביע בהכרח על זיוף חתימה: ייתכנו כשל תקשורת או מידע שמור שעוד נחשב עדכני. שקיפות תעודות פותרת בעיית גילוי הנפקות ואינה מחליפה את העברת הסטטוס הזה. גם שרתי שורש של מערכת שמות מתחם אינם רשויות ההפצה של ביטול תעודות, אף שבשני התחומים משתמשים במושג שורש.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>יש להבדיל גם בין ביטול תעודה לבין יצירת תעודה חדשה. הנפקת חלופה אינה גורמת אוטומטית לכל הדפדפנים להפסיק לקבל את הישנה, ותוקף עשוי להמשיך להציג את העותק שבידו. ניהול האירוע כולל לכן החלפת מפתח, הפצת מידע ביטול ובדיקת אכיפה אצל לקוחות. פעולה בצד שרת האתר בלבד אינה משנה את כל עוגני האמון והמטמונים של המשתמשים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04072024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q073.html"},{"id":"Q074","year":"2024","stem":"איזו מבין הטענות הבאות נכונה?","options":["הגדרת same site cookie להיות strict מסייע בהגנה מפני התקפת cross-site request forgery.","התקפת cross-site request forgery בנויה על כך שהדפדפן מצרף xss לבקשות.","ב Dom-based XSS החולשה נמצאת בקוד שרץ ב db.","אחת מהדרכים להגן מפני התקפת cross-site request forgery היא בעזרת anti-csrf token. הגנה זאת מבקשת מהמשתמש להזין ידנית קוד מיוחד לשדה הזנת טקסט ייעודי באתר."],"note":"","sources":[{"file":"2024/689156_04072024_0 (2).pdf","date":"04/07/2024","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.267,"exam_count":1,"in_sample_exam":false,"variant_group":"V01","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-15-08\" data-doc=\"original-15\" data-body-words=\"384\"><h2>שאלה 8 — SameSite והתקפות דפדפן</h2><div class=\"answer-body\">\n<p><strong>א — SameSite=Strict מסייע נגד CSRF.</strong> הדפדפן מגביל צירוף העוגייה להקשרים חוצי־אתרים. ב שגויה: מצרפים cookies, לא ״XSS״. ג שגויה: DOM-based XSS נובע מקוד בדפדפן ולא מקוד DB. ד שגויה: anti-CSRF token מוכנס ונשלח אוטומטית בטופס/קוד, ללא הקלדת קוד ידנית בידי המשתמש. זה שונה מאימות רב־שלבי.</p>\n<h3>האימות שמצליח והכוונה שאינה נבדקת</h3>\n<p>זיוף בקשות בין אתרים מנצל מצב שבו הדפדפן מוסיף הרשאה לבקשה באופן אוטומטי, בעוד האתר מפרש את עצם קבלת הבקשה כאילו המשתמש התכוון לבצע פעולה. התוקף אינו חייב לדעת את הסיסמה או לקרוא את עוגיית הכניסה. די בכך שהמשתמש כבר מחובר, שהדפדפן מצרף את העוגייה בהקשר התקיפה, ושהשרת מקבל פעולה רגישה ללא בדיקה נוספת של מקורה והקשרה.</p>\n<p>אפשר לדמיין דף תוקף שמפעיל ניווט לכתובת המעדכנת העדפה או מפרסמת הודעה בחשבון. מבחינת שרת היעד הגיעה בקשה בעלת עוגייה חוקית. מבחינת המשתמש הוא רק ביקר באתר אחר ולא אישר את השינוי. גם אם מדיניות המקור הזהה מונעת מהתוקף לקרוא את התשובה, עצם השינוי כבר עלול להתבצע. לכן תגובה ריקה או היעדר גישה למידע החוזר אינם שוללים את ההתקפה.</p>\n<h3>אילו הגנות משנות את תנאי התקיפה</h3>\n<p>טוקן אקראי שאינו נגיש לאתר התוקף מוסיף ערך שהדפדפן אינו מצרף אוטומטית רק מפני שיש לו עוגייה. האתר החוקי מכניס את הטוקן לטופס או לקוד שלו, והשרת בודק את התאמתו לסשן לפני הפעולה. המשתמש בדרך כלל אינו מקליד אותו. הגבלה של עוגיות בין אתרים יכולה למנוע את הצטרפות ההרשאה במסלולים מסוימים, ובדיקת מקור הבקשה מוסיפה מידע על ההקשר שממנו יצאה. חשוב לבדוק כל הגנה לפי פרטי המימוש ולא להניח שהיא פועלת רק משום ששמה מופיע בתיאור.</p>\n<p>שימוש בבקשה שאינה מיועדת לשנות מצב מתאים לתכנון פעולה פסיבית בלבד, ואינו מנגנון הרשאה. גם מעבר משליחת פרמטרים בכתובת לשליחת טופס אינו לבדו תיקון, משום שתוקף מסוגל להגיש טפסים. שמירת סיסמאות באופן מומלח מגינה על גניבת מאגר ולא על כוונת הבקשה. בנוסף, אם קיימת באתר הזרקת סקריפט, הקוד עשוי לקרוא את הטוקן ולשלוח פעולה תקינה בשם הקורבן. לפיכך הגנה טובה על בקשות רגילות והגנה מפני הרצת קוד לא מהימן משלימות זו את זו, וכל אחת תלויה בהנחת איום אחרת.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>פעולה רגישה צריכה לעבור גם בדיקת הרשאה רגילה: טוקן תקין אינו מתיר למשתמש שאינו מנהל לבצע פעולה ניהולית. הטוקן עוזר להראות שהבקשה שייכת להקשר הנכון, בעוד ההרשאה קובעת מה אותו משתמש רשאי לעשות. ערבוב שתי הבדיקות עלול ליצור מערכת שמונעת חלק מהבקשות המזויפות אך עדיין מאפשרת שימוש לרעה בחשבון בעל הרשאות נמוכות.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04072024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q074.html"},{"id":"Q075","year":"2024","stem":"איזו מבין הטענות הבאות נכונה?","options":["בפרוטוקול Address Resolution Protocol (ARP), התקפת הרעלת ARP מסתמכת על כך שאם הגיעו שתי תשובות שונות ולגיטימיות לאותה שאלה אחת אחרי השניה, התשובה האחרונה תדרוס את התשובה הראשונה. ב DNS לעומת זאת, אם מנסים לבצע התקפת הרעלה, אם הגיעו שתי תשובות שונות ולגיטימיות לאותה שאלה אחת אחרי השניה כל אחת עם TTL ארוך, התשובה הראשונה קובעת ולא נדרסת על ידי אלו שבאות אחריה למשך ה TTL.","בפרוטוקול Address Resolution Protocol (ARP), התקפת הרעלת ARP מסתמכת על כך שאם הגיעו שתי תשובות שונות ולגיטימיות לאותה שאלה אחת אחרי השניה, התשובה הראשונה קובעת ולא נדרסת על ידי אלו שבאות אחריה. באופן דומה, ב DNS, אם מנסים לבצע התקפת הרעלה, אם הגיעו שתי תשובות שונות ולגיטימיות לאותה שאלה אחת אחרי השניה כל אחת עם TTL ארוך, התשובה הראשונה קובעת ולא נדרסת על ידי אלו שבאות אחריה למשך ה TTL.","בפרוטוקול Address Resolution Protocol (ARP), התקפת הרעלת ARP מסתמכת על כך שאם הגיעו שתי תשובות שונות ולגיטימיות לאותה שאלה אחת אחרי השניה, התשובה האחרונה תדרוס את התשובה הראשונה. באופן דומה, ב DNS, אם מנסים לבצע התקפת הרעלה, אם הגיעו שתי תשובות שונות ולגיטימיות לאותה שאלה אחת אחרי השניה כל אחת עם TTL ארוך, התשובה האחרונה תדרוס את התשובה הראשונה.","בפרוטוקול Address Resolution Protocol (ARP), התקפת הרעלת ARP מסתמכת על כך שאם הגיעו שתי תשובות שונות ולגיטימיות לאותה שאלה אחת אחרי השניה, התשובה הראשונה קובעת ולא נדרסת על ידי אלו שבאות אחריה. ב DNS לעומת זאת, אם מנסים לבצע התקפת הרעלה, אם הגיעו שתי תשובות שונות ולגיטימיות לאותה שאלה אחת אחרי השניה כל אחת עם TTL ארוך, התשובה האחרונה תדרוס את התשובה הראשונה."],"note":"","sources":[{"file":"2024/689156_04072024_0 (2).pdf","date":"04/07/2024","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.198,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-15-09\" data-doc=\"original-15\" data-body-words=\"404\"><h2>שאלה 9 — הבדל הרעלת ARP לעומת DNS</h2><div class=\"answer-body\">\n<p><strong>א — במודל שנלמד ARP נדרס בידי מיפוי חדש, וב־DNS התשובה הראשונה שנקלטה נותרת במטמון עד TTL.</strong> לכן בהרעלת DNS התוקף מנסה לנצח בתחרות לפני התשובה החוקית, בעוד ARP מאפשר הודעות עדכון כוזבות חוזרות. ב וד שוגות ביחס ל־ARP; ג שוגה ביחס למטמון DNS. זהו מודל לימודי: קבלת ARP, bailiwick, transaction IDs ומדיניות מטמון תלויים במימוש, ואין כלל אוניברסלי שכל תגובה תמיד מתקבלת.</p>\n<h3>מסלול החבילה לפני ההרעלה ואחריה</h3>\n<p>ברשת מקומית יש להבחין בין כתובת היעד של חבילת האינטרנט לבין כתובת המתאם שאליו נמסרת המסגרת המקומית. כתובת אינטרנט מזהה את היעד הלוגי של התקשורת, ואילו כתובת חומרה משמשת למסירת מסגרת ברשת המקומית. כאשר היעד נמצא באותה רשת, המחשב צריך למצוא איזו כתובת חומרה מתאימה לכתובת האינטרנט שלו. פרוטוקול פתרון הכתובות מספק את המיפוי הזה ושומר אותו במטמון כדי שלא יהיה צורך לשאול מחדש בכל מסגרת.</p>\n<p>הכשל שנוצל במודל השאלה הוא היעדר אימות קריפטוגרפי של הודעות המיפוי. התוקף משדר הודעה שלפיה כתובת האינטרנט של הקורבן האחר נמצאת בכתובת החומרה של התוקף. הקורבן מעדכן את המטמון וממשיך לבנות חבילות לאותו יעד מקורי, אך עוטף אותן במסגרת המיועדת לתוקף. אם התוקף מעביר את החבילות הלאה, התקשורת עשויה להיראות רגילה והמשתמשים אינם מקבלים בהכרח סימן גלוי להרעלה.</p>\n<h3>יכולות התוקף וגבולות ההתקפה</h3>\n<p>כדי לקבל מיקום בין שני הצדדים בדרך כלל מרעילים את המיפוי בכל אחד מהם, או את המיפוי בין הקורבן לשער ברירת המחדל. התוקף יכול אז לצפות, לעכב, להשמיט ולהעביר מסגרות, ובהיעדר הגנות גבוהות יותר גם לשנות נתונים. מכאן לא נובעת ידיעה של מפתח הצפנה: כאשר מופעל ערוץ מוצפן ומאומת כראוי, הנתונים נשארים מוצפנים ושינויים בלתי מורשים מתגלים. עצם ההגעה לתעבורה אינה מאפשרת לייצר חתימה דיגיטלית בשם אחר.</p>\n<p>המושג הזרקה מחוץ לנתיב מתאר כאן תוקף שיש לו גישה מתאימה לאותו תחום שידור, אך עדיין אינו מעביר את התקשורת דרכו. ההרעלה היא שיוצרת לו עמדה כזאת. אין פירוש הדבר שכל מחשב מרוחק באינטרנט יכול לשלוח הודעות כאלה דרך נתבים. יש גם להבחין מהצפת טבלת מתג: זו התקפה על למידת מיקומי כתובות חומרה במתג, בעוד כאן משנים את הבנת המחשבים לגבי הקשר בין שתי שכבות כתובות. בקרות ברשת המקומית או אימות הערוץ בשכבות העליונות מתמודדים עם היבטים שונים של הבעיה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>במקרה שבו יעד החבילה נמצא מחוץ לרשת המקומית, המחשב בדרך כלל פותר את כתובת החומרה של שער ברירת המחדל ולא של השרת המרוחק. התוקף יכול להתחזות לשער באותו מנגנון עקרוני. גם אז כתובת היעד של חבילת האינטרנט נשארת כתובת השרת; רק התחנה המקומית הראשונה שאליה נמסרת המסגרת הוחלפה. הבחנה זו מונעת בלבול בין הרעלה לשינוי נתיב לוגי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04072024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q075.html"},{"id":"Q076","year":"2024","stem":"בגרסאות מסויימות של דפדפן מוכר, ניתן היה לטעון בתוך iframe לא רק עמודי אינטרנט אחרים, אלא גם את ה ”view-source “ שלהם, כלומר, להציג ב iframe את ה html של עמוד אינטרנט במקום את\nהתרגום הויזואלי של אותו html. תוקף הצליח לנצל זאת לרעה על ידי שהוא הציג לקורבנות אזור מאוד ספציפי ב html, וביקש מהמשתמשים להזין ולשלוח לתוקף את הטקסט שכתוב באיזור זה, כי לתוקף אין גישה ל html הספציפי שמוצג לקורבנות. בעזרת הטקסט שהקורבנות שלחו לתוקף, הצליח התוקף לעקוף מנגנון הגנה. באיזה מנגנון הגנה מדובר?","options":["Anti CSRF token","קידוד (Encoding)","חיטוי (Sanitization)","Certificate Transparency"],"note":"","sources":[{"file":"2024/689156_04072024_0 (2).pdf","date":"04/07/2024","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.243,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-15-10\" data-doc=\"original-15\" data-body-words=\"396\"><h2>שאלה 10 — העתקת טקסט מתוך view-source</h2><div class=\"answer-body\">\n<p><strong>א — עקיפת anti-CSRF token באמצעות המשתמש.</strong> הטוקן קיים ב־HTML של הדף הממוסגר. SOP מונע מהתוקף לקרוא אותו בתוכנית, אך המשתמש שרואה ומעתיק את הקטע יכול להעביר לתוקף את הסוד, ומאפשר זיוף בקשה תקינה. ב וג עוסקות בהזרקת תוכן ולא בסוד שמשמש לאימות בקשות. ד CT אינה קשורה. זהו ניצול ממשק/הנדסה חברתית ואינו שובר את האקראיות של הטוקן.</p>\n<h3>האימות שמצליח והכוונה שאינה נבדקת</h3>\n<p>זיוף בקשות בין אתרים מנצל מצב שבו הדפדפן מוסיף הרשאה לבקשה באופן אוטומטי, בעוד האתר מפרש את עצם קבלת הבקשה כאילו המשתמש התכוון לבצע פעולה. התוקף אינו חייב לדעת את הסיסמה או לקרוא את עוגיית הכניסה. די בכך שהמשתמש כבר מחובר, שהדפדפן מצרף את העוגייה בהקשר התקיפה, ושהשרת מקבל פעולה רגישה ללא בדיקה נוספת של מקורה והקשרה.</p>\n<p>אפשר לדמיין דף תוקף שמפעיל ניווט לכתובת המעדכנת העדפה או מפרסמת הודעה בחשבון. מבחינת שרת היעד הגיעה בקשה בעלת עוגייה חוקית. מבחינת המשתמש הוא רק ביקר באתר אחר ולא אישר את השינוי. גם אם מדיניות המקור הזהה מונעת מהתוקף לקרוא את התשובה, עצם השינוי כבר עלול להתבצע. לכן תגובה ריקה או היעדר גישה למידע החוזר אינם שוללים את ההתקפה.</p>\n<h3>אילו הגנות משנות את תנאי התקיפה</h3>\n<p>טוקן אקראי שאינו נגיש לאתר התוקף מוסיף ערך שהדפדפן אינו מצרף אוטומטית רק מפני שיש לו עוגייה. האתר החוקי מכניס את הטוקן לטופס או לקוד שלו, והשרת בודק את התאמתו לסשן לפני הפעולה. המשתמש בדרך כלל אינו מקליד אותו. הגבלה של עוגיות בין אתרים יכולה למנוע את הצטרפות ההרשאה במסלולים מסוימים, ובדיקת מקור הבקשה מוסיפה מידע על ההקשר שממנו יצאה. חשוב לבדוק כל הגנה לפי פרטי המימוש ולא להניח שהיא פועלת רק משום ששמה מופיע בתיאור.</p>\n<p>שימוש בבקשה שאינה מיועדת לשנות מצב מתאים לתכנון פעולה פסיבית בלבד, ואינו מנגנון הרשאה. גם מעבר משליחת פרמטרים בכתובת לשליחת טופס אינו לבדו תיקון, משום שתוקף מסוגל להגיש טפסים. שמירת סיסמאות באופן מומלח מגינה על גניבת מאגר ולא על כוונת הבקשה. בנוסף, אם קיימת באתר הזרקת סקריפט, הקוד עשוי לקרוא את הטוקן ולשלוח פעולה תקינה בשם הקורבן. לפיכך הגנה טובה על בקשות רגילות והגנה מפני הרצת קוד לא מהימן משלימות זו את זו, וכל אחת תלויה בהנחת איום אחרת.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>פעולה רגישה צריכה לעבור גם בדיקת הרשאה רגילה: טוקן תקין אינו מתיר למשתמש שאינו מנהל לבצע פעולה ניהולית. הטוקן עוזר להראות שהבקשה שייכת להקשר הנכון, בעוד ההרשאה קובעת מה אותו משתמש רשאי לעשות. ערבוב שתי הבדיקות עלול ליצור מערכת שמונעת חלק מהבקשות המזויפות אך עדיין מאפשרת שימוש לרעה בחשבון בעל הרשאות נמוכות.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04072024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q076.html"},{"id":"Q077","year":"2024","stem":"איזו מהטענות הבאות נכונה בהקשר של Certificate Transparency (CT)?","options":["CT מחייב את ה CAים לרשום כל תעודה דיגיטלית אצל Logger, כך שניתן יהיה לזהות ולחקור תעודות לא תקינות (תעודות שהן Fraudulent).","CT מחייב את ה CAים לרשום כל תעודה דיגיטלית אצל Monitor, כך שניתן יהיה לזהות ולחקור תעודות לא תקינות (תעודות שהן Fraudulent).","CT מחייב את ה Loggerים לרשום כל תעודה דיגיטלית אצל Monitor, כך שניתן יהיה לזהות ולחקור תעודות לא תקינות (תעודות שהן Fraudulent).","CT מחייב את ה Monitorים לרשום כל תעודה דיגיטלית אצל ה CAים, כך שניתן יהיה לזהות ולחקור תעודות לא תקינות (תעודות שהן Fraudulent)."],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.351,"exam_count":1,"in_sample_exam":false,"variant_group":"V10","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-16-01\" data-doc=\"original-16\" data-body-words=\"391\"><h2>שאלה 1 — תפקידי CT</h2><div class=\"answer-body\">\n<p><strong>א — רישום תעודות ב־Logger ציבורי כדי לאתר הנפקות חשודות.</strong> CA או גורם מגיש אחר יכולים להגיש תעודה ללוג; א מתארת את הכוונה במודל הקורס, אף שהמילה ״מחייב״ אינה כלל לכל CA/תעודה בעולם. ב מבלבלת Monitor, הסורק את הלוג, עם מי שמנהל אותו. ג וד הופכות את יחסי התפקידים: Monitor אינו יומן ההגשה ו־CA אינו שרת אחסון CT בשם monitor.</p>\n<h3>מדוע שרשרת אמון אינה מספיקה לביקורת הנפקות</h3>\n<p>רשות מוסמכת יכולה להנפיק בטעות תעודה לדומיין שאינו שייך למבקש, או שמפתח שלה עלול להיות מנוצל לרעה. לקוח הבודק רק חתימות עשוי לראות תעודה בעלת שרשרת חוקית, אף שבעל הדומיין האמיתי כלל לא ביקש אותה. שקיפות תעודות מוסיפה יכולת תצפית ציבורית: התעודות והתחייבויות הרישום שלהן מופיעות ביומנים שאפשר לבדוק ולנטר. המטרה אינה להצפין את התעודה או להסתיר את זהות האתר, אלא לאפשר גילוי של הנפקות חריגות גם לאחר שעברו את בדיקת החתימות הרגילה.</p>\n<p>יש להפריד בין הרשות המנפיקה, היומן והמנטר. היומן מקבל תעודות ומנהל מבנה נתונים שניתן לביקורת. המנטר קורא רישומים ומחפש למשל תעודות חדשות עבור דומיינים שהארגון מנהל. בעל דומיין שרואה תעודה שלא הזמין יכול לפתוח בירור ולבקש טיפול. עצם העובדה שתעודה מופיעה ביומן אינה אומרת שהיומן אישר שהמבקש הוא בעל הדומיין; בדיקת הזכאות להנפקה היא אחריות נפרדת.</p>\n<h3>התחייבות חתומה, הוכחת הכלה וביטול</h3>\n<p>חותמת הזמן החתומה היא הבטחה של יומן מסוים לכלול את התעודה בהתאם לכלליו. חתימת היומן מאפשרת לדפדפן לזהות מי נטל את ההתחייבות ולוודא שלא שינו אותה. היא שונה מהוכחת הכלה בעץ מרקל, שמראה כי רשומה מסוימת כבר נכללה במצב מסוים של היומן. הוכחת עקביות נועדה להראות שהיומן גדל באמצעות הוספה ולא שכתב את עברו. מבני הנתונים האלה מאפשרים ביקורת יעילה גם בלי שכל לקוח יוריד כל רשומה.</p>\n<p>דפדפן יכול לדרוש התחייבויות מיומנים שהוא מכיר, בהתאם למדיניותו, ועדיין חייב לבדוק זהות דומיין, שרשרת אמון וזמני תוקף. מנגנוני ביטול כגון רשימות ביטול או תשובות סטטוס פותרים בעיה אחרת: תעודה שהייתה קיימת כעת אינה אמורה להתקבל. רישום פומבי אינו מוחק תעודה ואינו מונע לבדו שימוש במפתח שנגנב. לכן חלופה המחליפה שקיפות בביטול, או טוענת שחותמת היומן פותרת את פרטיות בירור הסטטוס, מבלבלת בין מנגנונים שונים.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>נניח שבעל אתר מגלה ביומן תעודה שהונפקה בשמו בלי ידיעתו. הממצא מאפשר לפתוח בירור מול המנפיק ולנקוט פעולות ביטול והחלפה, אך היומן אינו מתקן לבדו את ההנפקה. זהו ההבדל בין ראיה ציבורית שמסייעת לגילוי ולהרתעה לבין אמצעי אכיפה שמונע קבלת תעודה מסוימת. שני התפקידים משלימים זה את זה ונחוצים בזמנים שונים של הטיפול באירוע.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_17092024_0 2 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q077.html"},{"id":"Q078","year":"2024","stem":"אליס רוצה לשלוח הודעות לבוב ולקרול אשר יתקיימו בהן גם תכונת ה integrity וגם תכונת ה authenticity. (לא מעניין את אליס סודיות)\nכעת נתאר כיצד אליס שולחת הודעה לבוב. שליחה לקרול היא אותו דבר, רק שבכל מקום בתיאור שכתוב בוב, יש להחליף את בוב בקרול. (למשל, אם כאשר אליס שולחת הודעה לבוב היא משתמשת במפתח פומבי של בוב, אז כאשר אליס שולחת לקרול היא משתמשת במפתח הפומבי של קרול וכו׳).\n- ראשית, אליס בוחרת לכל הודעה בנפרד מפתח סימטרי K אקראי וארוך.\n- אליס שולחת לבוב הודעה M ובנוסף לשליחת ההודעה M מצרפת גם:\n- MAC<sub>K</sub>(M) (כלומר, את הפלט של ביצוע MAC בעזרת המפתח K על ההודעה M)\n- Enc<sub>PK<sub>B</sub></sub>(K) (כלומר, תוצאת ההצפנה של המפתח K, כאשר ההצפנה הינה הצפנה א-סימטרית בעזרת המפתח הפומבי האמיתי של בוב.)\n- Sign<sub>SK<sub>A</sub></sub>(hash(K)) (כלומר, חתימה דיגיטלית על תוצאת ביצוע hash על K, כאשר החתימה מבוצעת בעזרת המפתח הפרטי של אליס)\nנתון כי בוב וקרול יודעים את המפתח הפומבי האמיתי של אליס, ואלגוריתמי ה MAC, ההצפנה, החתימה וה hash המצויינים בשאלה בטוחים.\nמהי הטענה הנכונה מבין הבאות?","options":["צורת הפעולה של אליס המתוארת בשאלה אינה מבטיחה את תכונת ה authenticity, כי לאחר שבוב יקבל הודעה מאליס הוא יוכל לגרום לקרול לחשוב שאליס שלחה לקרול הודעה שאליס לא שלחה כלל.","צורת הפעולה של אליס המתוארת בשאלה מבטיחה את תכונת ה integrity וגם תכונת ה authenticity, אבל לא מבטיחה סודיות.","צורת הפעולה של אליס המתוארת בשאלה מבטיחה את תכונת ה integrity וגם תכונת ה authenticity, ולמרות שלא מעניין את אליס סודיות, היא גם מבטיחה סודיות.","צורת הפעולה של אליס המתוארת בשאלה אינה מבטיחה את תכונת ה integrity ותכונת ה authenticity, כי אליס שולחת את ההודעה M בצורה גלויה, מה שנוגד את תכונות ה integrity ו authenticity."],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.229,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-16-02\" data-doc=\"original-16\" data-body-words=\"432\"><h2>שאלה 2 — חתימה על מפתח MAC בלבד</h2><div class=\"answer-body\">\n<p><strong>א — האותנטיות אינה מובטחת.</strong> אליס שולחת M,‏ MAC_K(M),‏ Enc_PKB(K),‏ Sign_SKA(h(K)). בוב מפענח את K ובוחר M′ שאליס מעולם לא כתבה. הוא מחשב MAC_K(M′), מצפין את K במפתח הפומבי של קרול ומצרף את החתימה המקורית של אליס על h(K). קרול מאמתת הכל אך טועה לחשוב שאליס חיברה את M′. ב וג שגויות בגלל התקיפה, וג גם טוענת לסודיות למרות M הגלוי. ד נותנת נימוק שגוי: טקסט גלוי יכול להיות אותנטי ושלם; הכשל הוא שהחתימה אינה קושרת את המסר והנמען למפתח. פתרון: חתימה על המסר וההקשר, לא רק על K.</p>\n<h3>חתימה מאמתת רק את מה שנכלל בה</h3>\n<p>חתימה דיגיטלית מוכיחה שמי שמחזיק במפתח החתימה הפרטי אישר רצף נתונים מסוים. היא אינה משלימה בעצמה שדות שהושמטו, ואינה קובעת למה התכוון המקבל בבקשה ששלח קודם. אם שרת מדריך חותם על מפתח ציבורי וזמן אבל אינו כולל את שם בעל המפתח, המקבל יכול לבדוק שהשרת אישר את המפתח ובכל זאת לשייך אותו לאדם הלא נכון. תאריך רענן מונע שימוש בתשובה ישנה במקרים מסוימים, אך אינו מתקן בלבול זהויות.</p>\n<p>אפשר לבחון זאת בהחלפת בקשה: התוקף גורם לשרת החוקי לענות על זהות שבשליטת התוקף, ואז מוסר את התשובה החתומה למי שביקש זהות אחרת. אין צורך לזייף חתימה או לשבור גיבוב. כל הביטים המכוסים בחתימה נשארים בדיוק כפי שהשרת יצר אותם; רק ההקשר שבו המקבל מפרש אותם שגוי. מכאן שמנגנון חתימה תקין אינו מבטיח שפרוטוקול שלם תוכנן נכון.</p>\n<h3>חתימה על מפתח ביניים לעומת חתימה על המסר</h3>\n<p>כשל דומה מופיע כאשר שולח חותם רק על מפתח סימטרי המשמש אחר כך לתיוג הודעות. מקבל שיודע את אותו מפתח יכול ליצור תגים להודעות נוספות. אם הוא יכול להעביר את המפתח והחתימה למקבל אחר, המקבל החדש רואה הוכחה שהשולח אישר את המפתח אך אינו רואה הוכחה שהשולח אישר את ההודעה המסוימת. חתימה על הסוד אינה הופכת כל שימוש עתידי בסוד לחתימת השולח המקורי.</p>\n<p>בתכנון מתוקן יש לקשור יחד את זהות השולח, זהות הנמען, המסר או המפתח, ההקשר ומזהי הפעולה לפי צורכי הפרוטוקול. טוקן זמן או אתגר יכולים לתרום טריות, אך אינם מחליפים קישור לזהות. גם הצפנת המפתח למקבל אינה מתקנת לבדה חתימה שחסרים בה השדות הדרושים, כי מקבל חוקי מסוגל לפענח ואז להעביר הלאה נתונים שהוא יודע. בשאלה חשוב להראות תמליל תקיפה מלא: מה התוקף מקבל, איזה חלק הוא משנה, איזה חלק חתום נשמר ומדוע כל בדיקות המקבל עדיין מצליחות. כך נבדל ניתוח פרוטוקול מהסתפקות באמירה שכל הפרימיטיבים בטוחים.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>חשוב לבדוק בתקיפה גם מדוע המקבל אינו מבחין בשינוי: החתימה ממשיכה להתאמת, ערך הזמן נשאר רענן וההצפנה מיועדת למקבל הנוכחי. הכישלון מתרחש ברמת המשמעות שהמקבל מייחס לנתונים המאומתים. ראיה על מפתח אינה בהכרח ראיה על בעל מפתח, וראיה על בעל מפתח אינה בהכרח ראיה על הודעה מסוימת שלא נכללה בחתימה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_17092024_0 2 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q078.html"},{"id":"Q079","year":"2024","stem":"איזו מהטענות הבאות אינה נכונה לגבי מנגנון הבלוקצ'יין בביטקוין?","options":["הבלוקצ'יין משתמש ב Merkle Tree כדי להבטיח את פרטיות העסקאות, כך שרק המשתתפים הישירים בעסקה יכולים לראות את פרטי העסקה המלאים","ביטקוין משתמש במנגנון של hash, כדי לחשב את ה digest של בלוקים בבלוקצ׳יין.","ביטקוין משתמש במנגנון של Proof of Work, שבו כורים מתחרים בפתרון חידה קריפטוגרפית מורכבת על מנת להוסיף בלוקים חדשים לשרשרת.","ביטקוין מאפשר לכורים לבחור את העסקאות שיופיעו בבלוקים, ולכן, אם כורה רוצה, הוא יכול להרכיב בלוק של עסקאות שנותנות עמלות נמוכות, למרות שיש עסקאות אחרות שהכורה יכל לבחור בהן שנותנות עמלות גבוהות יותר."],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.311,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-16-03\" data-doc=\"original-16\" data-body-words=\"380\"><h2>שאלה 3 — טענה שגויה על בלוקצ׳יין</h2><div class=\"answer-body\">\n<p><strong>א — עץ מרקל אינו מצפין ואינו מבטיח פרטיות העסקאות.</strong> הוא מאפשר commitment והוכחת הכלה. ב נכונה: נעשה שימוש ב־hash לחישוב מזהי בלוקים. ג נכונה: PoW הוא תחרות חישובית להוספת בלוקים. ד נכונה: כורה רשאי לבחור עסקאות חוקיות לפי שיקוליו, גם אם העמלות פחות משתלמות; חוקיות אינה מחייבת מקסום עמלה.</p>\n<h3>חוקיות עסקאות לעומת הכרעה על סדר ההיסטוריה</h3>\n<p>עסקת ביטקוין מנסה להוציא פלטים קיימים ולהגדיר פלטים חדשים. הצמתים בודקים בין היתר שהפלטים הנצרכים קיימים, שלא נצרכו כבר בהיסטוריה הרלוונטית, שתנאי הפדיון מתקיימים ושהסכומים עומדים בכללי הפרוטוקול. חתימה תקינה מוכיחה הרשאה להשתמש בפלט מסוים, אך אינה פותרת לבדה מצב שבו בעל המפתח חתם על שתי עסקאות סותרות. לשתי עסקאות יכולות להיות חתימות תקינות, בעוד שאי אפשר לקבל את שתיהן באותה היסטוריה תקפה.</p>\n<p>הקונצנזוס מספק דרך להכריע איזו היסטוריה תיחשב פעילה כשיש ענפים מתחרים. כורים אוספים עסקאות לבלוק מועמד ומחפשים כותרת שעומדת ביעד הוכחת העבודה. צמתים המקבלים בלוק אינם צריכים לסמוך על הכרזת הכורה: הם מחשבים ובודקים את העבודה ואת חוקיות התוכן בעצמם. כורה רשאי לבחור מבין עסקאות תקינות, ואין כלל בסיסי שמחייב אותו לבחור דווקא את בעלות העמלות הגבוהות ביותר.</p>\n<h3>אישורים, הסתעפויות והיעדר סמכות מרכזית</h3>\n<p>שני כורים יכולים למצוא בלוקים קרובים בזמן ולגרום להסתעפות זמנית. בהמשך מתווספת עבודה לאחד הענפים, והצמתים מעדיפים את השרשרת התקפה בעלת העבודה המצטברת המרבית. אישורים נוספים מגדילים את העבודה שתידרש כדי להחליף את העסקה בהיסטוריה מתחרה. זו הגנה התלויה בהנחות על כוח התוקף ועל תנאי הרשת, ולא משפט שלפיו ארגון מחדש בלתי אפשרי לאחר מספר קבוע של בלוקים.</p>\n<p>לא נדרש שרת מרכזי שיחתום על כל בלוק שהתקבל, ולא נדרש מכל משתמש לכרות כדי לבצע עסקה. הארנק מנהל מפתחות וחתימות, הכורים מציעים סדר באמצעות בלוקים, והצמתים מאמתים באופן עצמאי. אין גם מנגנון כללי שבו כורה חייב להפקיד ערבון שנחתך בגלל הוצאה כפולה; רעיון כזה שייך לתכנונים אחרים ואינו הבסיס המתואר כאן. עצי מרקל מאפשרים לחייב אוסף עסקאות ולהוכיח הכלה ביעילות, אך אינם מצפינים אותן ואינם מחליפים את בדיקות החוקיות. ההפרדה בין התפקידים מונעת בלבול בין פרטיות, הרשאה, הוכחת עבודה וקונצנזוס.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בעת שינוי כללי הרשת צריך לבדוק גם תאימות בין צמתים שכבר עודכנו לבין צמתים ישנים. כלל חדש שמקבל בלוקים שנדחו בעבר עלול ליצור שרשראות שכל קבוצה מקבלת אחרת. כלל מצמצם בלבד יכול לאפשר תאימות מסוג אחר. לכן סיווג שינוי נקבע לפי קבוצת הבלוקים החוקיים ולא לפי השאלה אם ההצעה נשמעת מועילה, מהירה או חדשנית.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_17092024_0 2 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q079.html"},{"id":"Q080","year":"2024","stem":"איזו מהטענות הבאות אינה נכונה?","options":["אם CA הנפיק תעודה עבור שרת אינטרנט כלשהו (לא מדובר על שרת האינטרנט של הארגון שאליו שייך ה CA), ה CA הזה יכול לפענח תעבורת TLS בין שרת האינטרנט והלקוחות של שרת האינטרנט.","בהינתן MAC של הודעה שחושב על ידי בוב, אליס אינה יכולה להוכיח לאחרים על בסיס MAC זה שההודעה נשלחה בהכרח על ידי בוב.","תוקף מעוניין לגנוב cookie של סטודנטים באתר colman.ac.il. לשם כך הוא בונה אתר שלו בכתובת evil.co.il ושם סקריפט בעמוד הראשי של evil.co.il שניגש ל cookie של הלקוח באתר colman.ac.il ושולח את הcookie לתוקף. התקפה זו תיחסם על ידי הדפדפן.","מתקפת XSS עשויה להיות תולדה של מתקפת SQL injection."],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.21,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-16-04\" data-doc=\"original-16\" data-body-words=\"418\"><h2>שאלה 4 — טענה שגויה על CA ו־TLS</h2><div class=\"answer-body\">\n<p><strong>א — עצם הנפקת התעודה אינה מאפשרת ל־CA לפענח תעבורת TLS.</strong> CA יודע מפתח פומבי ואינו אמור לקבל את הפרטי או את סודות החיבור. ב נכונה: MAC אינו ראיה לצד שלישי משום שגם המקבל יכול לייצרו. ג נכונה לפי SOP: סקריפט של evil.co.il אינו יכול לקרוא ישירות cookies של colman.ac.il. ד נכונה: SQL injection יכול למשל לשתול קוד במאגר, שיוצג אחר כך ויהפוך ל־stored XSS. CA זדוני עלול לאפשר התחזות פעילה באמצעות תעודה אחרת; זו אינה פענוח אוטומטי מכוח ההנפקה המקורית.</p>\n<h3>איך מפתח ציבורי נקשר לזהות</h3>\n<p>מפתח ציבורי ניתן לפרסום, אך ידיעת מפתח כלשהו אינה מספיקה כדי לדעת שהוא שייך לאתר המבוקש. תעודה פותרת את בעיית הקישור באמצעות חתימה של מנפיק על פרטי זהות, מפתח, תקופת תוקף ושדות הרשאה. הלקוח בודק את חתימת המנפיק באמצעות המפתח הציבורי שלו, ואם גם המנפיק אינו מוכר ישירות, ממשיך דרך תעודות ביניים עד לשורש אמון שכבר קיים אצלו.</p>\n<p>לכן לא נדרש שהמנפיק הישיר של כל אתר יופיע במאגר השורשים. רשות ביניים יכולה להיות מוסמכת בידי רשות גבוהה יותר, וההסמכה עצמה מיוצגת בתעודה חתומה עם מגבלות מתאימות. מנגד, חתימה עצמית של אתר אינה יוצרת אמון רק משום שהיא נכונה מבחינה מתמטית; כל אחד יכול ליצור זוג מפתחות ולחתום על תעודה של עצמו. עוגן האמון צריך להגיע ממקור שהלקוח כבר בחר לקבל.</p>\n<h3>אילו בדיקות נפרדות נדרשות</h3>\n<p>אימות כל החתימות בשרשרת הוא חלק הכרחי, אך צריך לבדוק גם התאמה לשם השרת, תקופות תוקף, הרשאות שימוש ומגבלות של הרשויות. זמני הפקיעה של כל התעודות אינם צריכים להיות זהים; כל תעודה צריכה להיות מתאימה למועד ולתפקיד בבדיקה. תעודה חוקית לאתר אחד אינה מתירה לתוקף להציג אותה כראיה לזהותו של אתר אחר. זהות היעד שהמשתמש ביקש היא חלק מן ההחלטה, ולא רק העובדה שקיימת חתימה ממנפיק מוכר.</p>\n<p>הרשות חותמת על נתונים הכוללים מפתח ציבורי ואינה צריכה לקבל את המפתח הפרטי של האתר. כתוצאה מכך עצם ההנפקה אינה מעניקה לה יכולת לפענח כל חיבור של האתר. כדי להבין פגיעה בעקבות גניבת מפתח צריך לברר איזה מפתח נגנב ואיזה פרוטוקול חילוף מפתחות הופעל. אין לערבב בין מפתחות תעודות, מפתחות תעבורה סימטריים ומפתחות של משיבי סטטוס. כל אחד מהם משמש להרשאה אחרת, וחתימה המתקבלת בהקשר אחד אינה בהכרח קבילה בהקשר אחר. ההפרדה הזאת היא הבסיס לבדיקת החלופות בשאלת שרשרת אמון ולהבנת גבולות הנזק של מפתח שנחשף.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בדיקת שם האתר צריכה להתייחס ליעד שהלקוח התכוון אליו לפני קבלת התעודה, ולא לשם שהתוקף הציג בתוך התעודה עצמה. אחרת תעודה חוקית לכל אתר הייתה מספיקה להתחזות לכל אתר אחר. זהו מקרה פרטי של קישור להקשר חיצוני מהימן: החתימה מאשרת שדות, והיישום צריך להשוות אותם לציפייה שלו כדי לקבל החלטת אמון.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_17092024_0 2 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q080.html"},{"id":"Q081","year":"2024","stem":"אליס רצתה להבטיח את שלמותה (אמינות/אותנטיות) ואת סודיותה של הודעה שהיא שולחת. ולכן, היא הצפינה את ההודעה וחישבה MAC על ה ciphertext. באיזה שיטה עבדה אליס?","options":["Encrypt then MAC.","MAC and Encrypt.","Sign then Encrypt.","MAC then Decrypt."],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.275,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-16-05\" data-doc=\"original-16\" data-body-words=\"386\"><h2>שאלה 5 — סדר הצפנה ותיוג</h2><div class=\"answer-body\">\n<p><strong>א — Encrypt then MAC.</strong> ראשית C=Enc_K(M), ואז T=MAC_K′(C). ב מתארת תג על plaintext לצד הצפנה; ג דורשת חתימה ולא MAC; ד אינה סדר בנייה סטנדרטי של ערוץ מאובטח. בדיקת MAC לפני פענוח מונעת טיפול ב־ciphertext שלא אומת כאשר הבנייה מיושמת כראוי.</p>\n<h3>מה מתויג ומה מוצפן</h3>\n<p>כדי לסווג שילוב של הצפנה ותיוג צריך לענות על שתי שאלות: על איזה רצף בתים מחושב התג, והאם התג עצמו נמצא בתוך ההצפנה או לצידה. סדר שורות בקוד אינו מספיק, משום ששולח יכול לבצע חישובים עצמאיים בסדר כלשהו ולהישאר באותה בנייה קריפטוגרפית. החלק החשוב הוא מבנה התוצאה שהמקבל מקבל ואילו בדיקות עליו לבצע כדי לקבל בחזרה הודעה מאומתת.</p>\n<p>כאשר מצפינים ואז מתייגים, התג מחושב על התוכן המוצפן. המקבל יכול לבדוק את תקינות הקלט עוד לפני שפענח אותו. כאשר מתייגים ואז מצפינים, התג מחושב על המסר הגלוי ונכנס יחד איתו לתוך ההצפנה. המקבל חייב תחילה לפענח כדי לחלץ את שני החלקים, ורק אז הוא יכול לחשב תג ולבדוק התאמה. בבנייה השלישית מצפינים את המסר ובנפרד שולחים תג על המסר הגלוי; התג נמצא מחוץ להצפנה אך אינו מאמת ישירות את התוכן המוצפן.</p>\n<h3>קריאת קוד המקבל והשלכות אבטחתיות</h3>\n<p>קוד פענוח מספק בדרך כלל דרך פשוטה לזהות את הבנייה של השולח. אם השורה הראשונה מחשבת או בודקת תג של הטקסט המוצפן, מדובר במסלול של תיוג אחרי הצפנה. אם הפענוח מחזיר זוג של מסר ותג, ברור שבצד השולח שני אלה הוצפנו יחד. אם התג התקבל בנפרד ונבדק מול המסר המפוענח, זהו מסלול נפרד של הצפנה ותיוג. ההבחנה נקבעת לפי זרימת המידע, ולא לפי דמיון מילולי בין שמות האפשרויות.</p>\n<p>הצפנה לבדה נועדה לסודיות ואינה מתחייבת לזהות שינוי עוין. תיוג מוסיף שלמות ואימות מול מי שאינו מכיר את המפתח. עם זאת אין להסיק שכל חיבור שרירותי שלהם בטוח: טיפול שונה בשגיאות פענוח, חשיפת פרטי ריפוד או שימוש לא מתאים באותם מפתחות יכולים לפתוח ערוצי תקיפה. בתכנון מסודר מגדירים גם איך נמסר הווקטור ההתחלתי, על אילו שדות מחושב התג ומתי בודקים אותו. זיהוי שם הבנייה בשאלה אינו אישור אוטומטי לכל מימוש אפשרי שלה, אלא תיאור מדויק של היחס בין הפעולות והנתונים.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בעת העברת התג והטקסט המוצפן יש להגדיר גם את דרך הפרדת השדות. אם שני פורמטים שונים מתפרשים כאותו רצף בתים מאומת, עשוי להיווצר בלבול למרות שימוש בפרימיטיבים תקינים. לפיכך תיאור בנייה מלא כולל מבנה מסר חד־משמעי, מפתחות מתאימים וכללי דחייה. בשאלון זרימת הנתונים מספיקה לסיווג, אך היא אינה תחליף למפרט כזה במימוש אמיתי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_17092024_0 2 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q081.html"},{"id":"Q082","year":"2024","stem":"תכונת ה pre image resistance מוגדרת כ: (h הינה פונק׳ hash)","options":["בהינתן digest d של הודעה אקראית, קשה למצוא הודעה m כך ש h(m)=d","בהינתן הודעה אקראית m, קשה למצוא הודעה m’ ששונה מ m, כך ש h(m) = h(m’)","בהינתן הודעה אקראית m, קשה למצוא הודעה m’ ששונה מ m, כך ש h(m) שונה מ h(m’)","בהינתן digest d של הודעה אקראית, קשה למצוא digest d’ כך ש d שונה מ d’"],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.282,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-16-06\" data-doc=\"original-16\" data-body-words=\"379\"><h2>שאלה 6 — הגדרת preimage resistance</h2><div class=\"answer-body\">\n<p><strong>א — בהינתן d קשה למצוא m עם h(m)=d.</strong> ב היא קדם־תמונה שנייה; ג מנסה למצוא מסר בעל digest שונה; ד מנסה למצוא digest אחר, ושתי המשימות האחרונות קלות ואינן תכונות אבטחה. לא נדרש לשחזר דווקא את המסר שממנו נוצר d.</p>\n<h3>שלוש בעיות חיפוש שונות</h3>\n<p>פונקציית גיבוב ממפה מסרים באורכים שונים לתוצאה באורך קבוע. מכיוון שיש יותר מסרים מתוצאות אפשריות, קיימים בהכרח מסרים שונים בעלי אותה תוצאה. דרישת האבטחה אינה שאין התנגשויות כלל, אלא שלא תהיה לתוקף דרך מעשית למצוא את ההתאמות המסוכנות הנדרשות בתקיפה. כדי להבין איזו תכונה נשאלת צריך קודם לשאול מה כבר ניתן לתוקף ומה הוא רשאי לבחור בעצמו.</p>\n<p>בעמידות לקדם־תמונה התוקף מקבל תוצאה ומנסה למצוא מסר שמגיע אליה. הוא אינו חייב למצוא דווקא את המסר המקורי; כל מסר בעל אותה תוצאה מספיק. בעמידות לקדם־תמונה שנייה התוקף מקבל מסר מסוים, וצריך למצוא מסר אחר בעל אותו גיבוב. בעמידות להתנגשויות שני המסרים נתונים לבחירתו, כל עוד יהיו שונים ויגיעו לאותה תוצאה. ההבדל בין קיבוע מסר אחד לבין בחירת שני מסרים מסביר מדוע שמות התכונות אינם ניתנים להחלפה.</p>\n<h3>קישור למקרה מעשי ולמסיחים</h3>\n<p>במערכת אימות סיסמאות, נתון חשבון מסוים עם ערך בדיקה שנוצר מסיסמה מסוימת. אם סיסמה שונה עוברת את אותה בדיקה תחת אותו ערך המלחה, שני קלטים שונים הובילו לאותו גיבוב. עצם האירוע הוא התנגשות; תקיפה מכוונת של החשבון הקבוע נוגעת לקדם־תמונה שנייה. הוספת ערך המלחה אינה מבטלת את האפשרות המתמטית להתנגשויות, אך מונעת שימוש באותו חישוב מוקדם עבור משתמשים רבים.</p>\n<p>לשם השוואה, מציאת שני מסרים עם תוצאות שונות היא פעולה קלה ורצויה. אם כמעט כל מסר היה מקבל אותה תוצאה, הפונקציה הייתה חסרת תועלת לזיהוי שינויים. גם יצירת מחרוזת תוצאה שונה מזו שניתנה אינה מעידה על קושי קריפטוגרפי. לכן חלופות שמחליפות את סימן השוויון באי־שוויון אינן וריאציה קטנה של ההגדרה אלא טענה אחרת לגמרי. מונחים מתחומים כגון תעודות, כפיית הצפנה או סוד נוסף באחסון סיסמאות עשויים להיות קשורים להגנה הכוללת, אך אינם מגדירים את בעיית החיפוש של הגיבוב עצמו. הבחירה הנכונה מבוססת על הקלט, יעד החיפוש ותנאי ההצלחה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אורך התוצאה משפיע על עלות התקיפות הכלליות: בחיפוש זוג חופשי קיימת תופעת יום ההולדת, שמאפשרת לפגוש התנגשות מוקדם יחסית לחיפוש קדם־תמונה של תוצאה קבועה. אין צורך לחשב את העלות המדויקת כדי לזהות את ההגדרה, אך העיקרון מסביר מדוע אסור להחליף בין שני סוגי החיפוש. חופש הבחירה של התוקף משנה את הבעיה גם באותה פונקציה עצמה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_17092024_0 2 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q082.html"},{"id":"Q083","year":"2024","stem":"איזו טענה היא הנכונה?","options":["כדי לבצע התקפת ARP poisoning מספיק יכולת off-path.","כדי לבצע התקפת ARP poisoning חייבים יכולת Eavesdropper.","כדי לבצע התקפת ARP poisoning חייבים יכולת Man-in-the-Middle.","כדי לבצע התקפת DNS poisoning חייבים יכולת Man-in-the-Middle."],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.279,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-16-07\" data-doc=\"original-16\" data-body-words=\"411\"><h2>שאלה 7 — יכולת התחלתית להרעלת ARP</h2><div class=\"answer-body\">\n<p><strong>א — הזרקה ללא עמדה קיימת בנתיב מספיקה, במודל off-path של הרשת המקומית.</strong> התוקף יכול לשדר ARP מזויף וליצור באמצעותו את עמדת ה־MITM. ב אינה הכרחית: ניתן לייצר הודעת הרעלה גם בלי האזנה קודמת; ג הופכת תוצאה לדרישת סף; ד שגויה: גם הרעלת DNS יכולה להסתמך על הזרקה וניחוש או תחרות תשובות בלי MITM קיים. הסתייגות: ARP הוא פרוטוקול LAN; אין להסיק שתוקף מרוחק באינטרנט יכול להזריק ARP דרך נתבים.</p>\n<h3>מסלול החבילה לפני ההרעלה ואחריה</h3>\n<p>ברשת מקומית יש להבחין בין כתובת היעד של חבילת האינטרנט לבין כתובת המתאם שאליו נמסרת המסגרת המקומית. כתובת אינטרנט מזהה את היעד הלוגי של התקשורת, ואילו כתובת חומרה משמשת למסירת מסגרת ברשת המקומית. כאשר היעד נמצא באותה רשת, המחשב צריך למצוא איזו כתובת חומרה מתאימה לכתובת האינטרנט שלו. פרוטוקול פתרון הכתובות מספק את המיפוי הזה ושומר אותו במטמון כדי שלא יהיה צורך לשאול מחדש בכל מסגרת.</p>\n<p>הכשל שנוצל במודל השאלה הוא היעדר אימות קריפטוגרפי של הודעות המיפוי. התוקף משדר הודעה שלפיה כתובת האינטרנט של הקורבן האחר נמצאת בכתובת החומרה של התוקף. הקורבן מעדכן את המטמון וממשיך לבנות חבילות לאותו יעד מקורי, אך עוטף אותן במסגרת המיועדת לתוקף. אם התוקף מעביר את החבילות הלאה, התקשורת עשויה להיראות רגילה והמשתמשים אינם מקבלים בהכרח סימן גלוי להרעלה.</p>\n<h3>יכולות התוקף וגבולות ההתקפה</h3>\n<p>כדי לקבל מיקום בין שני הצדדים בדרך כלל מרעילים את המיפוי בכל אחד מהם, או את המיפוי בין הקורבן לשער ברירת המחדל. התוקף יכול אז לצפות, לעכב, להשמיט ולהעביר מסגרות, ובהיעדר הגנות גבוהות יותר גם לשנות נתונים. מכאן לא נובעת ידיעה של מפתח הצפנה: כאשר מופעל ערוץ מוצפן ומאומת כראוי, הנתונים נשארים מוצפנים ושינויים בלתי מורשים מתגלים. עצם ההגעה לתעבורה אינה מאפשרת לייצר חתימה דיגיטלית בשם אחר.</p>\n<p>המושג הזרקה מחוץ לנתיב מתאר כאן תוקף שיש לו גישה מתאימה לאותו תחום שידור, אך עדיין אינו מעביר את התקשורת דרכו. ההרעלה היא שיוצרת לו עמדה כזאת. אין פירוש הדבר שכל מחשב מרוחק באינטרנט יכול לשלוח הודעות כאלה דרך נתבים. יש גם להבחין מהצפת טבלת מתג: זו התקפה על למידת מיקומי כתובות חומרה במתג, בעוד כאן משנים את הבנת המחשבים לגבי הקשר בין שתי שכבות כתובות. בקרות ברשת המקומית או אימות הערוץ בשכבות העליונות מתמודדים עם היבטים שונים של הבעיה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>במקרה שבו יעד החבילה נמצא מחוץ לרשת המקומית, המחשב בדרך כלל פותר את כתובת החומרה של שער ברירת המחדל ולא של השרת המרוחק. התוקף יכול להתחזות לשער באותו מנגנון עקרוני. גם אז כתובת היעד של חבילת האינטרנט נשארת כתובת השרת; רק התחנה המקומית הראשונה שאליה נמסרת המסגרת הוחלפה. הבחנה זו מונעת בלבול בין הרעלה לשינוי נתיב לוגי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_17092024_0 2 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q083.html"},{"id":"Q084","year":"2024","stem":"בהקשר של חתימה דיגיטלית לפי textbook RSA (כלומר ללא hash), יצא ש n = 33. לוקחים את ההודעה 20 והחתימה הדיגיטלית שיצאה על הודעה זו הינה 26. באיזה ערכי d ו e השתמשו?","options":["e=3, d=7","e=3, d=11","e=7, d=11","e=5, d=7"],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.386,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-16-08\" data-doc=\"original-16\" data-body-words=\"364\"><h2>שאלה 8 — מפתחות חתימת RSA</h2><div class=\"answer-body\">\n<p><strong>א — e=3,d=7.</strong> n=33=3·11 ולכן φ(n)=2·10=20. צריך ed≡1 mod20: 3·7=21≡1. החתימה היא 20⁷ mod33: 20²≡4, 20⁴≡16, ולכן 20⁷≡16·4·20=1280≡26. ב: 3·11≡13; ג: 7·11≡17; ד: 5·7≡15, ולכן אינם זוגות RSA תקינים. בפרט e=5 אינו זר ל־20. אימות: 26³ mod33=20.</p>\n<h3>בניית המפתח ומשמעות החשבון המודולרי</h3>\n<p>באלגוריתם הנדון בוחרים שני ראשוניים שונים, מכפילים אותם לקבלת המודולוס, ומחשבים את מספר השאריות הזרות למודולוס. במקרה של מכפלת שני ראשוניים המספר הזה הוא מכפלת שני המספרים הקטנים באחד מן הראשוניים. לאחר מכן בוחרים מעריך ציבורי הזר למספר שהתקבל, ומוצאים לו הופכי כפל מודולרי שישמש כמעריך הפרטי. המודולוס משותף לשני המפתחות; החלפתו במספר אחר אינה יוצרת מפתח פרטי מתאים לאותו מפתח ציבורי.</p>\n<p>הדרישה להופכי פירושה שמכפלת שני המעריכים משאירה שארית אחת בחלוקה במספר השאריות הזרות. לכן אין צורך שהמעריכים יהיו שונים, גדולים במיוחד או אחד ראשוני ואחד לא. יש לבדוק את משוואת ההופכי במפורש. באימות חלופות של מפתח, חישוב המכפלה והשארית הוא בדיקה ישירה וקצרה הרבה יותר מניסיון להצפין אוסף מסרים ולקוות שהכול עובד.</p>\n<h3>חתימה, אימות ודרך חישוב יעילה</h3>\n<p>בחתימת ספר לימוד על מסר מספרי מעלים את המסר בחזקת המעריך הפרטי ומצמצמים מודולו המודולוס. לא מצפינים במפתח הציבורי כדי לחתום. כדי לאמת מעלים את החתימה בחזקת המעריך הציבורי ובודקים שחזר המסר. כאשר נדרשים לשחזר מסר מחתימה, זהו אותו כיוון אימות, גם אם השאלה מספקת תחילה דווקא את המעריך הפרטי. ההסבר המקדים לכל שאלה מיישם את התפקידים האלה על המספרים המסוימים שבה.</p>\n<p>אפשר לבצע את החזקות באמצעות ריבועים חוזרים: מחשבים חזקה שנייה, ממנה רביעית וכן הלאה, ובכל שלב שומרים רק את השארית. אחר כך מכפילים את החזקות המתאימות לפירוק הבינארי של המעריך. כך נשמרים מספרים קטנים ונמנעות טעויות של כתיבת מספר עצום. כל המספרים הקטנים בשאלון נועדו להדגים את המתמטיקה ואינם מפתחות בטוחים לשימוש. חתימה מעשית גם אינה חתימת ספר לימוד ישירה על מספר שרירותי; נדרשים גיבוב, קידוד חתימה תקני ובדיקת תקינות של המפתחות כדי למנוע מניפולציות שלא נלמדות מן החשבון הפשוט בלבד.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בדיקה נוספת מועילה היא להחזיר את התוצאה דרך הפעולה ההפוכה: אם חושבה חתימה, מאמתים אותה ומוודאים שחזר המסר; אם נבחר מעריך פרטי, בודקים את מכפלתו במעריך הציבורי. שאריות שליליות מותרות בזמן החישוב, אבל את התוצאה הסופית נוח להציג כנציג שאינו שלילי וקטן מן המודולוס. כך ניתן לזהות מסיח שמייצג מספר גדול או פעולה בכיוון הלא נכון.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_17092024_0 2 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q084.html"},{"id":"Q085","year":"2024","stem":"מחליטים לשנות מנגנון הזדהות מול אתר אינטרנט, כך שימשיכו להשתמש בפונק׳ hash בטוחה קריפטוגרפית אך שבמקום להשתמש ב salt & pepper, יבצעו את אחד מהשינויים הבאים. איזה מהשינויים הבאים הכי יתרום לבטיחות (ויתרום יותר ביחס לשימוש רק ב salt) ועדיין יאפשר אימות מול אתר האינטרנט? (לאורך השאלה, כאשר מתייחסים ל i מתכוונים למספר שלם חיובי גדול מ 1)","options":["כאשר משתמש נרשם למערכת, מחשבים hash על שרשור של ה salt (שהינו אקראי וארוך) והסיסמא של המשתמש, אך במקום ביצוע hash פעם אחת - עושים hash שוב ושוב i פעמים (בכל פעם שעושים שוב hash כוללים בקלט את הפלט שיצא בפעם הקודמת של הפעלת ה hash), ושומרים ב db את\nהusername, את ה salt ואת תוצאת ביצוע ה hash אחרי הפעם ה i.","כאשר משתמש נרשם למערכת, מגרילים salt (שהינו אקראי וארוך) שוב ושוב i פעמים, כלומר, מגרילים פעם אחת ומתעלמים מהתוצאה, מגרילים פעם נוספת ומתעלמים מהתוצאה, ורק על ה salt שיוצא בפעם הi מחשבים hash פעם אחת על שרשור של הsalt והסיסמא של המשתמש ושומרים ב db את הusername, את ה salt ואת תוצאת ביצוע ה hash.","כאשר משתמש נרשם למערכת, מגרילים ערך i אקראי, ומחשבים hash פעם אחת על שרשור של ערך הi שיצא והסיסמא של המשתמש ושומרים ב db את הusername, את ערך ה i ואת תוצאת ביצוע ה hash.","כאשר משתמש נרשם למערכת, מגרילים salt (שהינו אקראי וארוך) שוב ושוב i פעמים, כלומר, מגרילים פעם אחת ומתעלמים מהתוצאה, מגרילים פעם נוספת ומתעלמים מהתוצאה. לוקחים את ה salt שיוצא\nבפעם הi ומחשבים hash על ה salt (שיצא בפעם הi), אך במקום ביצוע hash פעם אחת - עושים hash\nשוב ושוב i פעמים (בכל פעם שעושים שוב hash כוללים בקלט את הפלט שיצא בפעם הקודמת של הפעלת ה hash), ושומרים ב db את הusername, את ה salt ואת תוצאת ביצוע ה hash אחרי הפעם ה i."],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.217,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-16-09\" data-doc=\"original-16\" data-body-words=\"420\"><h2>שאלה 9 — חיזוק אחסון סיסמאות</h2><div class=\"answer-body\">\n<p><strong>א — איטרציות hash על password ו־salt.</strong> אם H₁=h(salt||password),‏ H_j=h(H_{j−1}), האימות חוזר על אותו תהליך. כל ניחוש עולה בערך i חישובים במקום אחד, וה־salt עדיין מונע שיתוף חישוב בין משתמשים. ב מגרילה הרבה ומוחקת הכל חוץ מהאחרון, השקול ל־salt אחד; ג משתמשת במספר אקראי שמור כ־salt בלבד; ד אינה כוללת את הסיסמה ולכן אינה מאפשרת אימות סיסמה. זהו חיזוק יחסי במודל השאלה, ולא המלצה להשתמש ב־hash מהיר במקום KDF ייעודי.</p>\n<h3>מה צריך להישמר כדי שאפשר יהיה לבדוק סיסמה</h3>\n<p>שרת שאינו שומר סיסמאות גלויות צריך בכל זאת להיות מסוגל לבדוק ניסיון כניסה. לשם כך הוא שומר ערך בדיקה שאפשר לחשב מחדש מסיסמת הניסיון ומפרמטרים זמינים. ערך המלחה אקראי ושונה לכל משתמש נשמר לצד ערך הבדיקה ואינו אמור להיות סוד. הוא גורם לכך שגם שתי סיסמאות זהות של משתמשים שונים יניבו קלטי גיבוב שונים, ולכן תוקף אינו יכול להשתמש באותה טבלת חישובים מוכנה עבור כולם.</p>\n<p>סוד נוסף הנשמר בנפרד ממסד הנתונים ממלא תפקיד אחר: הוא מקשה על מי שגנב רק את הטבלה לבצע ניחושים לא מקוונים. כדי שההגנה תהיה רלוונטית, הסיסמה, ערך ההמלחה והסוד הנוסף צריכים להשפיע על אותו ערך בדיקה. אם שומרים גיבוב חשוף של הסיסמה ולצידו גיבוב אחר של פרמטרים, התוקף יכול להתעלם מן הרכיב השני ולבדוק את הראשון לבדו. זו דוגמה לכך שצירוף שמות של מנגנונים אינו מספיק; צריך לנתח מה נדרש לכל ני
