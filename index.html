ף וחמש מאות שלושים ושישה ערכים אפשריים; פורט אקראי עצמאי מוסיף אי־ודאות רק אם אינו ידוע לתוקף. חשוב להפריד בין סיכוי בניסיון בודד לבין סיכוי מצטבר לאורך ניסיונות חוזרים. מדיניות שמבטלת שאילתה אחרי תגובות שגויות עלולה למנוע גם את קבלת התשובה הנכונה וליצור מניעת שירות. הוספת זיהוי התקפה אינה שקולה לאימות התשובה, וגם התרעה אינה חסימה.</p>\n<h4>מיפוי כתובות ברשת מקומית</h4>\n<p>ARP מאפשר למחשב ברשת מקומית ללמוד איזו כתובת MAC משמשת יעד מסוים בעל כתובת IP. המחשב זקוק למיפוי כדי לשלוח מסגרת בקישור המקומי, למשל אל שער ברירת המחדל. בפרוטוקול הבסיסי אין חתימה המאמתת שכל הודעת מיפוי אכן נשלחה מבעל הכתובת. תוקף מקומי יכול לנצל זאת ולגרום לקורבן לשמור מיפוי שגוי, כך שמסגרות יגיעו אליו במקום ליעד המקורי. אם הוא מעביר אותן הלאה, הוא עשוי להשיג תיווך בתעבורה בלי לנתק אותה מיד.</p>\n<p>אין צורך שהתוקף כבר יהיה MitM כדי להתחיל הרעלת ARP; לעיתים ההרעלה היא הדרך שבה הוא משיג יכולת זו. עם זאת, הודעות ARP רגילות מוגבלות למקטע הקישור ואינן כלי שמאפשר לכל מחשב מרוחק באינטרנט לשנות טבלה מקומית דרך נתבים. מיפויים סטטיים או בדיקות מתג מתאימות יכולים לצמצם את הסיכון, ואין צורך לבטל כל שימוש בכתובות MAC. מצד שני, כתובת MAC עצמה אינה סוד ואינה הוכחת זהות קריפטוגרפית. גם תוקף ששולט בנתיב אינו מקבל אוטומטית מפתחות TLS תקינים. יש להפריד בין הסבת חבילות ברשת לבין שבירת הגנות שכבות גבוהות, ובין כתובת חומרה המשמשת למשלוח מסגרות לבין הרשאה לבצע פעולה רגישה בממשק אינטרנטי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_06112022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q019.html"},{"id":"Q020","year":"2022","stem":"איזה מבין הטענות הבאות נכונה בהקשר של חתימה דיגיטלית?","options":["מחשבים את ה hash של המידע שרוצים לחתום עליו. מצפינים את ה hash עם המפתח הפרטי של השולח. האימות מתבצע על ידי המקבל ע\"י פענוח ה hash המוצפן בעזרת המפתח הפומבי של השולח והשוואתו לתוצאת ביצוע hash על המידע שנשלח.","מחשבים את ה hash של המידע שרוצים לחתום עליו. מצפינים את ה hash עם המפתח הפומבי של השולח. האימות מתבצע על ידי המקבל ע\"י פענוח ה hash המוצפן בעזרת המפתח הפרטי של השולח והשוואתו לתוצאת ביצוע hash על המידע שנשלח.","מחשבים את ה hash של המידע שרוצים לחתום עליו. מצפינים את ה hash עם המפתח הפומבי של השולח. האימות מתבצע על ידי המקבל ע\"י פענוח ה hash המוצפן בעזרת המפתח הפומבי של השולח והשוואתו לתוצאת ביצוע hash על המידע שנשלח.","מחשבים את ה hash של המידע שרוצים לחתום עליו. מצפינים את ה hash עם המפתח הפרטי של השולח. האימות מתבצע על ידי המקבל ע\"י פענוח ה hash המוצפן בעזרת המפתח הפרטי של השולח והשוואתו לתוצאת ביצוע hash על המידע שנשלח."],"note":"","sources":[{"file":"2022/689156_06112022_0.pdf","date":"06/11/2022","num":8},{"file":"ללא תאריך/c22b - מקודד.docx.pdf","date":"06/11/2022","num":8},{"file":"ללא תאריך/דוגמא פורמט 2.pdf","date":null,"num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.248,"exam_count":1,"in_sample_exam":true,"variant_group":"V04","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-03-12\" data-doc=\"original-03\" data-body-words=\"392\"><h3>שאלה 8 — כיצד חותמים ומאמתים חתימה דיגיטלית?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> חתימה נוצרת באמצעות המפתח הפרטי של החותם ונבדקת באמצעות המפתח הפומבי שלו. המקבל מחשב מחדש את תקציר ההודעה ובודק שהחתימה תקפה עבורו. הביטוי ״הצפנת hash במפתח פרטי״ הוא הפשטה לימודית המתאימה לתיאור RSA; חתימה תקנית משתמשת בסכמת חתימה וקידוד מאובטחים ואינה פעולת הצפנה כללית.</p>\n<h4>חתימה, אימות ואי־התכחשות</h4>\n<p>חתימה דיגיטלית היא מנגנון שבו בעל מפתח פרטי יוצר הוכחה הקשורה לתוכן מסוים, וכל מי שמכיר את המפתח הפומבי המתאים יכול לבדוק אותה. בפועל חותמים בדרך כלל על ייצוג מקודד של תקציר ההודעה. תפקיד הגיבוב הוא לקשור את ההוכחה לכל תוכן ההודעה ביעילות; תפקיד מפתח החתימה הוא למנוע ממי שאינו מחזיק בסוד ליצור הוכחות חדשות. אלה שני תפקידים נפרדים, ולכן גיבוב ללא חתימה אינו מחליף חתימה, והצפנה לנמען אינה הוכחה לזהות השולח.</p>\n<p>מקבל חייב לבדוק שהמפתח הפומבי שבו הוא משתמש אכן משויך לחותם הרצוי. לאחר מכן עליו לבדוק את החתימה על התוכן המדויק שקיבל, לרבות הקשר חשוב כמו זהות נמען, סוג פעולה ומספר פעולה. חתימה על מפתח בלבד אינה בהכרח חתימה על כל ההודעות שייווצרו בעתיד בעזרתו. באופן דומה, חתימה תקפה אינה מבטיחה שהודעה טרייה: אפשר להחזיר הודעה חתומה ישנה ללא שינוי. כדי למנוע ביצוע חוזר נדרש מנגנון מתאים, כגון מזהה פעולה שנחתם ונבדק מול מצב שמור. אי־התכחשות היא יתרון לעומת MAC משותף, אך פירושה מותנה בהגנה על המפתח וביכולת לשייך אותו לבעליו; אין להסיק ממנה שהמסר מוצפן או שהחותם בהכרח פעל מרצונו החופשי.</p>\n<h4>מה מצפים מפונקציית גיבוב קריפטוגרפית</h4>\n<p>פונקציית גיבוב ממפה הודעה באורך משתנה לתקציר באורך קבוע. מכיוון שמספר הקלטים גדול ממספר הפלטים, התנגשויות בהכרח קיימות; הדרישה אינה שלא יהיו התנגשויות כלל, אלא שיהיה קשה חישובית למצוא אותן. בהתנגשות התוקף בוחר שתי הודעות שונות שמניבות אותו תקציר. בקדם־תמונה נתון רק תקציר ומנסים למצוא הודעה מתאימה. בקדם־תמונה שנייה ניתנת הודעה מסוימת, והתוקף מחפש הודעה אחרת עם אותו תקציר. חשוב לזהות איזה מידע נקבע לפני שהחיפוש מתחיל.</p>\n<p>אם פונקציה מאפשרת חיבור חילופי פשוט או מתעלמת מחלק מהתווים, אפשר לעיתים לכתוב זוג מתנגש בלי לבצע חיפוש כלשהו. זה חמור יותר מאמירה כללית על מספר הפלטים, משום שמוצגת התקפה יעילה ומפורשת. לדוגמה, פונקציה שרק סוכמת ערכי אותיות לא מבחינה בהחלפת סדרן; תקציר שווה לא מוכיח ששני קבצים זהים. גם תקציר חזק לבדו אינו מוכיח מי יצר הודעה, שהרי כל אדם יכול לחשב אותו על הודעה חדשה. לאימות מול תוקף צריך לקשור את התקציר לסוד, באמצעות MAC, או לחתימה מאומתת. בשאלת חישוב יש לבצע בדיוק את הפעולה שהוגדרה, לרבות המודולו, ולא להניח ששם הפעולה מעניק לה בטיחות.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_06112022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q020.html"},{"id":"Q021","year":"2022","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["OCSP stapling הינו יעיל בזכות השימוש בעץ מרקל.","OCSP stapling הינו מנגנון שונה לחלוטין מOCSP רגיל.","ניתן לתמוך ב OCSP וגם ב CRL, ולא חייבים לבחור רק אחד מהם.","השימוש ב CRL תורם לבטיחות של PKI."],"note":"התקבל גם סעיף ב","sources":[{"file":"2022/689156_06112022_0.pdf","date":"06/11/2022","num":9},{"file":"ללא תאריך/c22b - מקודד.docx.pdf","date":"06/11/2022","num":9}],"flags":["note"],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.258,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0,1],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-03-13\" data-doc=\"original-03\" data-body-words=\"395\"><h3>שאלה 9 — OCSP stapling — איזו טענה אינה נכונה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: אין יחידה.</strong> <strong>גם א וגם ב שגויות בניסוחן.</strong> א: היעילות אינה נובעת מעץ מרקל; השרת מצרף תגובת OCSP חתומה ותקפה שקיבל מראש, וכך חוסך ללקוחות פנייה נפרדת למשיב. ב: זה אינו מנגנון ״שונה לחלוטין״ מ־OCSP — הוא משנה את דרך מסירת תגובת הסטטוס. אפשר לתמוך גם ב־CRL וגם ב־OCSP. גם כאן אין להסיק נכונות מתווית כל־א; בקובץ המקוצר מצוין שגם ב התקבל.</p>\n<h4>ביטול תעודות והעברת תשובות סטטוס</h4>\n<p>תעודה כוללת תאריך תפוגה, אך לעיתים צריך להפסיק לסמוך עליה עוד קודם, למשל משום שהמפתח הפרטי נחשף. CRL היא רשימה חתומה של תעודות שבוטלו לפי המנפיק, ו־OCSP מאפשר לקבל תשובת סטטוס חתומה עבור תעודה. יש לאמת את החתימה, את זהות הגורם המוסמך לענות ואת הזמנים שבתשובה. תוקף שמציג תשובה ישנה עשוי לנסות להסתיר שינוי במצב התעודה, ולכן עצם קיומם של בתים הנראים כתשובה אינו מספיק.</p>\n<p>ב־OCSP stapling השרת משיג תשובה חתומה ומצרף אותה לתקשורת עם הלקוחות. הלקוח אינו נדרש לפנות בעצמו למשיב עבור כל ביקור, ולכן אפשר להפחית השהיה, עומס וחשיפה של הרגלי גלישה. השרת מעביר הוכחה שקיבל; הוא אינו רשאי להכריז כרצונו שתעודתו תקפה. מנגנון זה עדיין משתמש ביסודות OCSP הרגיל, ושינוי דרך ההובלה אינו הופך אותו למנגנון שונה לחלוטין. גם אין צורך לייחס את יעילותו לעץ מרקל: עץ כזה מרכזי ל־CT, שמטרתו שקיפות הנפקות. אפשר לתמוך בכמה שיטות בדיקת ביטול במקביל. ההבחנה המעשית היא בין מקור האמון בסטטוס, מי מביא את התשובה ללקוח, והאם התשובה עדכנית ומכסה את התעודה המתאימה.</p>\n<h4>תעודות ושרשרת אמון</h4>\n<p>תעודה דיגיטלית קושרת זהות למפתח פומבי ומכילה חתימה של גורם מנפיק. היא אינה מכילה את המפתח הפרטי, שהרי התעודה נשלחת ברשת והסוד אמור להישאר אצל בעליו. בעל האתר יכול ליצור את זוג המפתחות בעצמו ולהעביר למנפיק בקשה המכילה את המפתח הפומבי. המנפיק מבצע את בדיקותיו וחותם על תעודה; אין מכאן צורך שהמנפיק ייצור את סוד האתר או ילמד אותו.</p>\n<p>הלקוח אינו סומך על חתימה רק מפני שהיא תקפה מתמטית. הוא צריך להתחיל בעוגן אמון מוכר, לבדוק את שרשרת החתימות ואת מגבלות ההאצלה עד לתעודת האתר, ולוודא שהשם שהתבקש מתאים לשמות שבתעודה. תאריך תוקף, שימושי מפתח ומצב ביטול הם בדיקות נוספות בהתאם למדיניות. בדרך נפוצה רשות שורש חותמת על רשות ביניים, ורשות הביניים מנפיקה את תעודת האתר. לכן המנפיק הישיר אינו חייב להיות מותקן בעצמו כרשות שורש בדפדפן. אם האתר חותם על התעודה שלו, אפשר לבדוק שהחתימה מתאימה למפתח שבו, אך הדבר אינו יוצר מאליו אמון בזהותו. גם תעודה אמינה אינה מעידה שהשרת נקי מחולשות יישום או שהמשתמש התכוון לכל פעולה שתעבור בערוץ.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_06112022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q021.html"},{"id":"Q022","year":"2022","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["בהתקפת stored xss העובדה שהדפדפן מצרף cookies לבקשות מהותית.","בהתקפת csrf השרת אינו יודע שהבקשה אינה באמת של הקורבן.","שימוש ב x-frame-options אינו מיועד להגנה מפני sql injection.","אחת מהדרכים להגן מפני התקפת csrf היא בעזרת CSRF token."],"note":"","sources":[{"file":"2022/689156_06112022_0.pdf","date":"06/11/2022","num":10},{"file":"ללא תאריך/c22b - מקודד.docx.pdf","date":"06/11/2022","num":10},{"file":"ללא תאריך/דוגמא פורמט 2.pdf","date":null,"num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.356,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-03-14\" data-doc=\"original-03\" data-body-words=\"384\"><h3>שאלה 10 — stored XSS, CSRF ו־X-Frame-Options — הטענה השגויה</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> XSS יכולה לפעול גם אצל משתמש אנונימי בלי cookies: מהותה הרצת תוכן תוקף בהקשר האתר. הצירוף האוטומטי של אמצעי הזדהות הוא מרכזי ל־CSRF הקלאסית. X-Frame-Options עוסק בהטמעה במסגרת, לא ב־SQLi; token ייעודי מסייע להגן מפני CSRF.</p>\n<h4>כיצד נתון הופך לקוד בדפדפן</h4>\n<p>בחולשת XSS יישום משלב מידע בשליטת תוקף בהקשר שבו הדפדפן מפרש אותו כתוכן פעיל. ב־stored XSS המידע נשמר באתר ומוצג לאחרים; ב־reflected XSS הוא מוחזר בעקבות בקשה; ב־DOM XSS קוד צד לקוח מעביר מידע לא מהימן ליעד מסוכן בדפדפן. המשותף הוא שבירת הגבול בין מידע לבין הוראות ביצוע. אין הכרח שתהיה חולשה במימוש הדפדפן: בדרך כלל הוא פשוט מריץ את מה שהאתר סיפק לו.</p>\n<p>הסקריפט רץ בהקשר המקור של האתר הפגיע, ולכן עשוי לקרוא מידע בעמוד, לשנות תצוגה וליזום פעולות בהרשאות המשתמש. גניבת cookies היא אפשרות אחת, ולא ההגדרה היחידה של ההתקפה. גם משתמש לא מזוהה יכול להיפגע משינוי תוכן או מהפניה זדונית. אם cookie מוגדר HttpOnly, קריאתו הישירה נחסמת, אך הסקריפט עדיין עשוי לבצע בקשות שהדפדפן יצרף להן אותו. ההגנה המרכזית היא טיפול נכון במידע לפי ההקשר, כגון קידוד פלט ופעולות DOM בטוחות; מדיניות CSP היא שכבה נוספת. אין לטעון שהפעלת HTTPS או עצם קיומו של SOP מונעות XSS, מפני שהקוד הזדוני מגיע כאן מתוך ההקשר שהלקוח ממילא סומך עליו.</p>\n<h4>מדוע בקשה תקינה יכולה לבטא רצון של תוקף</h4>\n<p>CSRF מנצלת מצב שבו הדפדפן מצרף אוטומטית אמצעי הזדהות לבקשה, והשרת מסתפק בכך כדי לבצע פעולה. התוקף אינו חייב לדעת את הסיסמה או לקרוא cookie: הוא יכול להביא את הקורבן לדף הגורם למשלוח בקשה לאתר האחר. השרת רואה הרשאות תקפות אך אינו יודע בהכרח שהפעולה נגרמה מבחוץ ולא מתוך ממשק שהמשתמש בחר להפעיל. גם אם התוקף אינו קורא את התשובה, שינוי כתובת דואר, העברת כסף או שינוי הגדרת נתב כבר עלולים להתבצע.</p>\n<p>token תקין הוא ערך בלתי צפוי הקשור להקשר המשתמש או הפעולה, שהאתר מוסיף לבקשה והשרת מאמת. אתר תוקף אינו אמור לדעת אותו רק מכוח היכולת ליצור טופס. לרוב המשתמש אינו מקליד את הערך: הוא נשמר בשדה נסתר או מועבר בכותרת בידי קוד האתר. בדיקות מקור בקשה ומדיניות cookies מתאימה יכולות להוסיף שכבות הגנה. לעומת זאת, קוד XSS באותו מקור עשוי לקרוא token או להפעיל את הממשק המורשה, ולכן הגנת CSRF אינה תחליף למניעת XSS. גם בחירת POST אינה מספקת לבדה; סוג הבקשה אינו הוכחת כוונה. יש לבדוק את הגורם שמאשר את הפעולה ולא להסתפק בזהות המחשב ששלח בפועל את החבילות.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_06112022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q022.html"},{"id":"Q023","year":"2022","stem":"איזו מבין הטענות הבאות נכונה?","options":["ב TLS, משתמשים ב chain of trust","לקוח הגולש לשרת foo.com מוודא את תקינות התעודה שקיבל מהשרת ע\"י וידוא שהתעודה נחתמה באופן קריפטוגרפי חוקי ע\"י foo.com","שרת אינטרנט מייצר ניגש ל Root CA ומבקש ממנו לחתום על המפתח הפומבי של שרת האינטרנט","שרת Root CA חותם ישירות על המפתח הפומבי של שרת האינטרנט"],"note":"","sources":[{"file":"2022/689156_06112022_0.pdf","date":"06/11/2022","num":11},{"file":"ללא תאריך/c22b - מקודד.docx.pdf","date":"06/11/2022","num":11},{"file":"ללא תאריך/דוגמא פורמט 2.pdf","date":null,"num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.294,"exam_count":1,"in_sample_exam":true,"variant_group":"V05","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-03-15\" data-doc=\"original-03\" data-body-words=\"385\"><h3>שאלה 11 — TLS ותעודות — הטענה הנכונה</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> באימות TLS מבוסס תעודות בונים שרשרת חתימות מתעודת האתר דרך CA מתווכים אל עוגן אמון מקומי; בודקים גם שם שרת, תוקף ושימושים מותרים. ה־CA שהנפיק ישירות אינו חייב להיכלל במאגר השורשים. אין הכרח שהשורש יחתום ישירות על תעודת האתר, וחתימה עצמית של האתר אינה מספיקה לאמון ציבורי.</p>\n<h4>תעודות ושרשרת אמון</h4>\n<p>תעודה דיגיטלית קושרת זהות למפתח פומבי ומכילה חתימה של גורם מנפיק. היא אינה מכילה את המפתח הפרטי, שהרי התעודה נשלחת ברשת והסוד אמור להישאר אצל בעליו. בעל האתר יכול ליצור את זוג המפתחות בעצמו ולהעביר למנפיק בקשה המכילה את המפתח הפומבי. המנפיק מבצע את בדיקותיו וחותם על תעודה; אין מכאן צורך שהמנפיק ייצור את סוד האתר או ילמד אותו.</p>\n<p>הלקוח אינו סומך על חתימה רק מפני שהיא תקפה מתמטית. הוא צריך להתחיל בעוגן אמון מוכר, לבדוק את שרשרת החתימות ואת מגבלות ההאצלה עד לתעודת האתר, ולוודא שהשם שהתבקש מתאים לשמות שבתעודה. תאריך תוקף, שימושי מפתח ומצב ביטול הם בדיקות נוספות בהתאם למדיניות. בדרך נפוצה רשות שורש חותמת על רשות ביניים, ורשות הביניים מנפיקה את תעודת האתר. לכן המנפיק הישיר אינו חייב להיות מותקן בעצמו כרשות שורש בדפדפן. אם האתר חותם על התעודה שלו, אפשר לבדוק שהחתימה מתאימה למפתח שבו, אך הדבר אינו יוצר מאליו אמון בזהותו. גם תעודה אמינה אינה מעידה שהשרת נקי מחולשות יישום או שהמשתמש התכוון לכל פעולה שתעבור בערוץ.</p>\n<h4>מה מספק TLS ובאילו שכבות הוא פועל</h4>\n<p>TLS יוצר ערוץ מוצפן ומאומת מעל תעבורה שבפני עצמה יכולה להיות חשופה למאזין או לתוקף פעיל. תחילה הצדדים מסכימים על פרמטרים ומקימים חומר מפתח, ובתצורה הנפוצה השרת מוכיח זהות באמצעות תעודה ומפתח פרטי מתאים. אחר כך מידע היישום מוגן במפתחות סימטריים. הבחירה במנגנון סימטרי להעברת מידע רב נובעת מיעילותו; המנגנונים האסימטריים פותרים בעיקר את בעיית ההקמה והאימות בלי סוד משותף שהותקן מראש.</p>\n<p>יש להבדיל בין הגנת הערוץ לבין תקינות התוכנה שמשתמשת בו. TLS לא מונע מהיישום להפעיל שאילתת SQL מסוכנת, לשלב קוד תוקף בדף או לקבל בקשת פעולה שהמשתמש לא התכוון אליה. הוא גם אינו מעניק אוטומטית זהות לכל לקוח: בתצורות רבות רק השרת מציג תעודה והמשתמש מזדהה אחר כך בסיסמה או באמצעי יישומי. תוקף שולט ברשת יכול עדיין לחסום את החיבור ולגרום למניעת שירות, גם כשאינו יכול לקרוא או לשנות תוכן מאומת. בתשובה על המצגת יש לציין אם מדובר ב־TLS הישן עם RSA או במנגנון אחר, משום שפרטי החלפת המפתח וההודעות השתנו בין גרסאות. ערבוב כל הזרימות לתיאור יחיד עלול להוביל לתשובה שגויה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_06112022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q023.html"},{"id":"Q024","year":"2022","stem":"איזו מבין הטענות הבאות נכונה?","options":["ב CT, המוניטורים מנטרים את הלוגרים, והלוגרים מתחזקים לוג של תעודות שהונפקו על ידי CAים","ב CT, המוניטורים מנטרים את הCAים, והלוגרים את המוניטורים","ב CT, המוניטורים מנטרים את הלוגרים, והלוגרים את המוניטורים","ב CT, הלוגרים מתחזקים לוג של תעודות שהונפקו על ידי CAים, והמוניטורים מנטרים את הCAים"],"note":"","sources":[{"file":"2022/689156_06112022_0.pdf","date":"06/11/2022","num":12},{"file":"ללא תאריך/c22b - מקודד.docx.pdf","date":"06/11/2022","num":12},{"file":"ללא תאריך/דוגמא פורמט 2.pdf","date":null,"num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.274,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-03-16\" data-doc=\"original-03\" data-body-words=\"367\"><h3>שאלה 12 — תפקידי לוגרים ומוניטורים ב־CT</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> ב־Certificate Transparency לוגים מחזיקים רישום append-only של תעודות/קדם־תעודות, ומוניטורים קוראים ומנטרים את הלוגים כדי לגלות הנפקות חשודות. המבנה משתמש בעץ מרקל להוכחות הכללה ועקביות; המוניטורים אינם לוגים של לוגרים אחרים ואינם מסתפקים בפנייה ישירה ל־CA.</p>\n<h4>שקיפות תעודות אינה החלטה על תוקף התעודה</h4>\n<p>Certificate Transparency מוסיף יכולת תיעוד וביקורת להנפקת תעודות. לוגר מקבל רשומות ומתחזק יומן שבו אפשר לבדוק הכללה של תעודה. מוניטורים קוראים את היומנים ומחפשים הנפקות חריגות, למשל תעודה לדומיין שלהם שהונפקה בלי ידיעתם. מכיוון שגם רשות אישור מהימנה יכולה לטעות או להיפגע, פרסום ההנפקות מסייע לזהות אירועים שלא היו נחשפים מתוך בדיקת חתימה של לקוח בודד.</p>\n<p>עץ מרקל מאפשר להתחייב על מספר גדול של רשומות בשורש קצר ולהציג ראיות יעילות. הוכחת הכללה מראה שרשומה כלולה בעץ מסוים; הוכחת עקביות בוחנת שהעץ גדל בלי לשנות את עברו. התחייבות לוגר לתיעוד בעתיד אינה זהה להוכחה שהרשומה כבר מופיעה בעץ נוכחי. אף אחת מן הראיות האלה אינה מוכיחה שלבעל התעודה הייתה זכות לקבל אותה, שמפתחו לא נגנב או שהתעודה לא בוטלה. אלה שאלות נפרדות הדורשות בדיקות אחרות. לכן CT משלים את PKI ואינו מחליף את שרשרת האמון או את בדיקות הביטול. cookies אינם מנגנון בחירת הרשומה הבאה ביומן, ומוניטור אינו גורם שתפקידו לחתום על תעודות במקום רשות האישור.</p>\n<h4>בניית התחייבות על הרבה רשומות</h4>\n<p>עץ מרקל הוא מבנה שבו העלים מייצגים ערכי גיבוב של נתונים, וכל צומת פנימי מחושב מתוך ילדיו בסדר מוגדר. חישוב חוזר עד לשורש נותן ערך קצר שמתחייב, בהנחות הגיבוב המתאימות, על הנתונים ועל מבנה העץ. כדי להראות שעלה מסוים כלול בעץ אין צורך להעביר את כל העלים: אפשר להעביר את ערכי האחים במסלול לשורש ולציין באיזה צד כל אחד נמצא. המאמת משחזר את השורש ומשווה לערך ידוע ומאומת.</p>\n<p>סדר הילדים הוא חלק מהנתונים. בדרך כלל H(L||R) אינו H(R||L), ולכן יש לקרוא תרגיל בעברית בזהירות כאשר מספרים ומחרוזות לטיניות מוצגים בכיוונים שונים. בבניית העץ הנתון עדיף לכתוב כל רמה משמאל לימין ולהשתמש באותה פונקציה בדיוק לכל זוג שכנים. צריך להבחין גם בין hash של תוכן העלה לבין פונקציית החיבור הפנימית שהתרגיל הגדיר. אם פונקציית צעצוע פשוט שולפת תווים, מחשבים אותה כפי שנמסרה אבל אין מסיקים מכך עמידות קריפטוגרפית. המבנה משמש גם בהתחייבות לעסקאות של בלוק וגם ביומני שקיפות תעודות; השימוש המשותף אינו אומר שכל מנגנון יעילות או בדיקת תעודות אחר משתמש בהכרח בעץ כזה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_06112022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q024.html"},{"id":"Q025","year":"2022","stem":"אליס ובוב רוצים לדבר ביניהם בצורה מוצפנת ומאובטחת כך שחווה לא תוכל לדעת מה תוכן ההודעות שהם שולחים אחד לשניה. הדרך היחידה של אליס ובוב לתקשר הוא דרך ערוץ התקשורת שביניהם. נתון שלחווה יש יכולות האזנה, כלומר היא יכולה לראות הודעה הנשלחת בין אליס לבוב אך אין לה יכולות אחרות, בפרט, לחווה אין יכולות MitM והיא אינה יכולה לשלוח הודעות לאליס/בוב כלל - גם לא לשלוח הודעות משוכפלות מאליס/בוב. מוצעות להלן מספר הצעות לקיום התקשורת בין אליס לבוב כך שהתקשורת תהיה מאובטחת. איזו שיטה לא תעבוד?","options":["אליס ובוב יתקשרו באמצעות הצפנה א-סימטרית. כל אחד מהם שולח לשני דרך הערוץ את המפתח הפומבי שלו ומאותו הרגע אליס שולחת לבוב את ההודעות שלה מוצפנות בעזרת המפתח הפומבי שלה (בוב אותו דבר, שולח הודעות שמוצפנות בעזרת המפתח הפומבי שלו).","אליס ובוב יתקשרו באמצעות הצפנה סימטרית. הם מקיימים ביניהם החלפת מפתחות מבוססת דיפי-הלמן ומאותו הרגע כל ההודעות מוצפנות בהתאם.","אליס ובוב יתקשרו באמצעות הצפנה סימטרית. הם ישלחו כל אחד לשני את התעודה שCA שכולם סומכים עליו הנפיק לכל אחד מהם, ואז יריצו את אלגוריתם דיפי-הלמן (וישתמשו בתעודות לאבטחת התהליך) ומאותו הרגע כל ההודעות מוצפנות בהתאם.","אליס ובוב יתקשרו לסירוגין באמצעות הצפנה סימטרית והצפנה א-סימטרית. כאשר הם מתקשרים בהצפנה סימטרית הם מקיימים ביניהם החלפת מפתחות מבוססת דיפי-הלמן ומאותו הרגע כל ההודעות מוצפנות בהתאם. כאשר הם מתקשרים באמצעות הצפנה א-סימטרית הם ישלחו כל אחד לשני את התעודה שCA שכולם סומכים עליו הנפיק להם ומאותו הרגע כל ההודעות מוצפנות בהתאם (כמו שמצפינים ומפענחים בהצפנת מפתח פומבי רגילה)."],"note":"","sources":[{"file":"2022/689156_04122022_0 (1).pdf","date":"04/12/2022","num":1},{"file":"2022/689156_04122022_0מועד 6 (1).pdf","date":"04/12/2022","num":1},{"file":"ללא תאריך/דוגמא פורמט.pdf","date":null,"num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"דיפי-הלמן והחלפת מפתחות","topic_score":0.271,"exam_count":1,"in_sample_exam":true,"variant_group":"V06","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-01-06\" data-doc=\"original-01\" data-body-words=\"385\"><h3>שאלה 1 — איזו שיטת תקשורת לא תעבוד מול מאזינה פסיבית?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> בסעיף א כל שולח מצפין במפתח הפומבי של עצמו. המקבל אינו מחזיק את המפתח הפרטי המתאים ולכן אינו יכול לפענח. יש להצפין במפתח הפומבי של הנמען. DH מספיק נגד מאזינה פסיבית בהנחות חישוביות ופרמטרים תקינים; תעודות מוסיפות אימות הנחוץ מול תוקף פעיל.</p>\n<h4>מפתחות פומביים לעומת מפתחות סודיים</h4>\n<p>בקריפטוגרפיית מפתח פומבי לכל משתתף זוג מפתחות מקושרים: מפתח פומבי שמותר להפיץ ומפתח פרטי שרק בעליו אמור להחזיק. בהצפנה לנמען משתמשים במפתח הפומבי של הנמען, מפני שהפענוח דורש את המפתח הפרטי התואם. לכן אפשר לפרסם את מפתח בוב ועדיין לשמור הודעות המיועדות אליו בסוד. המפתח הפומבי אינו סיסמה שיש להעביר בערוץ נסתר; השאלה העיקרית בהפצתו היא כיצד יודעים שזהו באמת המפתח של בוב ולא מפתח של מתחזה.</p>\n<p>יש להבחין בין מאזין פסיבי לבין תוקף פעיל. מאזין רואה את הערכים שעוברים אך אינו משנה אותם; תוקף פעיל יכול להחליף מפתחות, לפתוח חיבורים ולשלוח הודעות משלו. פרוטוקול שעובד נגד הראשון עלול להיכשל נגד השני אם אין אימות זהות. תעודה חתומה או מפתח שנלמד מראש בערוץ אמין מספקים בסיס לשיוך הזהות, אך עדיין צריך להשתמש במפתח בתפקיד הנכון. דוגמה מעשית היא שליחת מפתח סימטרי אקראי בהצפנה לבוב ואז שימוש בו לקובץ גדול. מותר לכל אדם להצפין לבוב; עצם היכולת הזאת אינה מזהה את השולח כאליס. כדי לזהות אותה נדרשת גם הוכחה המתבססת על סוד שלה, למשל חתימה דיגיטלית.</p>\n<h4>המושגים והנחות האבטחה</h4>\n<p>ניתוח קריפטוגרפי מתחיל בשאלה מה רוצים להגן, מה התוקף יודע ואילו פעולות מותרות לו. סודיות פירושה שהמידע אינו נחשף למי שאינו מורשה; שלמות פירושה שאפשר לזהות שינוי לא מורשה; אותנטיות קושרת מידע לגורם שמותר לו ליצור אותו. אלה תכונות שונות, ולכן מנגנון שמצליח במשימה אחת אינו מקבל אוטומטית את האחרות. למשל, הצפנה יכולה להסתיר סכום העברה בלי להוכיח מי בחר אותו, וחתימה יכולה להוכיח מי אישר מסמך בלי להסתיר את תוכנו. הבחנה זו חשובה במיוחד כשנוסח החלופה משתמש במילה הכללית ״מאובטח״.</p>\n<p>עקרון העבודה הוא להניח שהאלגוריתם עצמו ידוע לתוקף, ורק חומר המפתח שנדרש להיות סודי נשאר נסתר. מחפשים אפוא מה תוקף יכול לחשב מתוך המידע הגלוי, ולא מסתמכים על כך שאינו מכיר את התוכנה. גם גודל המפתח אינו מספיק לבדו: המפתח צריך להיבחר כראוי, להישמר בצורה מתאימה ולהיות משויך לתפקיד הנכון. במענה לבחינה יש לנסח את ההנחות במפורש, להראות פעולה קונקרטית של המקבל או של התוקף, ואז להסיק איזו תכונה מתקיימת ואיזו חסרה. הצבעה על שם של אלגוריתם בלי להסביר את תפקידו אינה מוכיחה שהשימוש המסוים בו נכון.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04122022_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q025.html"},{"id":"Q026","year":"2022","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["אליס בנתה אתר בית שרץ על foo.com בכתובת: http://foo.com/~alice ונתנה גישה לאתר הבית שלה לכל חבריה. לבוב, שאינו חבר של אליס, יש אתר בית משלו על foo.com בכתובת: http://foo.com/~bob. בוב החליט שכאשר ויקי, אחת מחברותיה של אליס, תגלוש לאתר הבית שלו, הוא ישים באתר הבית שלו iframe\nעם כתובת האתר של אליס ויקרא ממנו את התוכן של אתר הבית של אליס באמצעות javascript. כאשר בוב ינסה זאת, הוא יגלה, לצערו, שמנגנון ה same origin policy ימנע מהסקריפט שלו גישה למידע החוזר מאתר הבית של אליס.","ניצול חולשת SQL injection כדי לבצע התקפת XSS הינו תרחיש הגיוני.","אתר מסויים השתמש בחיטוי קלט כדי למנוע התקפות SQL injections. האתר הסיר את התווים: '=- (כל אחד בנפרד) מהקלטים של המשתמשים. למרבה הצער, הם שכחו את התו ; וזה מה שגרם להתקפת sql injection כנגד האתר. זאת דוגמא קלאסית לחסרון של שיטת blacklisting.","בהתקפות stored XSS ו reflected XSS, הקוד הזדוני מוחזר כחלק מהתשובה של השרת"],"note":"","sources":[{"file":"2022/689156_04122022_0 (1).pdf","date":"04/12/2022","num":2},{"file":"2022/689156_04122022_0מועד 6 (1).pdf","date":"04/12/2022","num":2},{"file":"ללא תאריך/דוגמא פורמט.pdf","date":null,"num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.329,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-01-07\" data-doc=\"original-01\" data-body-words=\"394\"><h3>שאלה 2 — SOP, SQL injection ו־XSS — הטענה השגויה</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> שני הנתיבים http://foo.com/~alice ו־http://foo.com/~bob חולקים scheme, host ו־port, ולכן אותו origin. הנתיב אינו גבול אבטחה של SOP: סקריפט של בוב עשוי לקרוא iframe של אליס בהרשאות ויקי. יש לבודד תוכן לא מהימן ל־origin אחר. SQL injection יכולה לשתול תוכן שיהפוך ל־stored XSS; רשימה שחורה של תווים אינה הגנה שלמה, וקוד זדוני ב־stored/reflected XSS יכול להגיע בתשובת השרת.</p>\n<h4>מהו origin ואיך הדפדפן משתמש בו</h4>\n<p>origin של כתובת נקבע בעיקר לפי סכמת התקשורת, שם המארח והפורט. הנתיב בתוך האתר אינו רכיב שמפריד origins. לכן שתי תיקיות שונות באותו שרת אינן מקבלות בידוד אבטחה אוטומטי רק מפני שהן שייכות למשתמשים שונים. לעומת זאת, שינוי בין HTTP ל־HTTPS, שינוי של שם מארח או שימוש בפורט אחר יכול ליצור מקור אחר. כאשר פורט ברירת המחדל מושמט, משווים לערך ברירת המחדל המתאים ולא לטקסט הכתובת בלבד.</p>\n<p>Same Origin Policy נאכף בדפדפן ומגביל בין היתר קריאת מידע מגורם שמקורו שונה. הוא אינו מנגנון הרשאות של מסד הנתונים ואינו בדיקה שמחליפה אימות בצד השרת. חשוב במיוחד להבדיל בין יכולת לשלוח בקשה לבין יכולת לקרוא את תשובתה: במצבים רבים בקשה בין אתרים יכולה להישלח גם כשאסור לסקריפט לקרוא את התוכן החוזר. זהו הבסיס להבנת CSRF. אם תוכן פעיל לא מהימן מתארח באותו מקור עם תוכן רגיש, גבול ההפרדה כבר נחלש עוד לפני משלוח הבקשה. הפרדה נכונה עשויה לדרוש מארח נפרד או sandbox מוגדר כראוי; השמות ״אליס״ ו״בוב״ בנתיבים אינם מייצרים מדיניות זהות שהדפדפן מבין מעצמו.</p>\n<h4>כיצד נתון הופך לקוד בדפדפן</h4>\n<p>בחולשת XSS יישום משלב מידע בשליטת תוקף בהקשר שבו הדפדפן מפרש אותו כתוכן פעיל. ב־stored XSS המידע נשמר באתר ומוצג לאחרים; ב־reflected XSS הוא מוחזר בעקבות בקשה; ב־DOM XSS קוד צד לקוח מעביר מידע לא מהימן ליעד מסוכן בדפדפן. המשותף הוא שבירת הגבול בין מידע לבין הוראות ביצוע. אין הכרח שתהיה חולשה במימוש הדפדפן: בדרך כלל הוא פשוט מריץ את מה שהאתר סיפק לו.</p>\n<p>הסקריפט רץ בהקשר המקור של האתר הפגיע, ולכן עשוי לקרוא מידע בעמוד, לשנות תצוגה וליזום פעולות בהרשאות המשתמש. גניבת cookies היא אפשרות אחת, ולא ההגדרה היחידה של ההתקפה. גם משתמש לא מזוהה יכול להיפגע משינוי תוכן או מהפניה זדונית. אם cookie מוגדר HttpOnly, קריאתו הישירה נחסמת, אך הסקריפט עדיין עשוי לבצע בקשות שהדפדפן יצרף להן אותו. ההגנה המרכזית היא טיפול נכון במידע לפי ההקשר, כגון קידוד פלט ופעולות DOM בטוחות; מדיניות CSP היא שכבה נוספת. אין לטעון שהפעלת HTTPS או עצם קיומו של SOP מונעות XSS, מפני שהקוד הזדוני מגיע כאן מתוך ההקשר שהלקוח ממילא סומך עליו.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04122022_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q026.html"},{"id":"Q027","year":"2022","stem":"איזו מבין הטענות הבאות נכונה?","options":["miner שמתחזק את כל הבלוקצ'יין באופן שוטף, יכול לעקוב אחר טרנזקציות ולדעת כמה ביטקוין יש לכתובת ביטקוין מסויימת ברגע נתון","כדי לבזבז ביטקוין אין צורך במפתח הפרטי של הארנק הרלוונטי","ביצוע שינויים במטבע הביטקוין מחייב אישור של סטושי","ב micro payments, אליס חייבת לסמוך על בוב (ספק השירות) שישחרר לה את הכסף המגיע לה"],"note":"","sources":[{"file":"2022/689156_04122022_0 (1).pdf","date":"04/12/2022","num":3},{"file":"2022/689156_04122022_0מועד 6 (1).pdf","date":"04/12/2022","num":3},{"file":"ללא תאריך/דוגמא פורמט.pdf","date":null,"num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.306,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-01-08\" data-doc=\"original-01\" data-body-words=\"383\"><h3>שאלה 3 — איזו טענה על ביטקוין נכונה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> רישום העסקאות פומבי. ניתן לסכום פלטים שטרם נבזבזו השייכים לכתובת ולחשב את היתרה בשרשרת הנבחנת. אין בכך זיהוי האדם שמאחורי הכתובת או יתרת כל ארנקו. הוצאה רגילה דורשת הרשאת חתימה מתאימה; אין רשות מרכזית של סטושי המאשרת שינויים.</p>\n<h4>עסקאות, הרשאת הוצאה ומצב הרשת</h4>\n<p>ביטקוין מתאר בעלות באמצעות פלטי עסקאות שטרם הוצאו, המכונים UTXO. פלט מגדיר סכום ותנאי הרשאה להוצאה עתידית. עסקה חדשה מצביעה על פלטים קודמים ומספקת את הנתונים הדרושים לקיום התנאים, בדרך רגילה חתימה מתאימה. אין צורך להשתתף בכרייה כדי ליצור עסקה או לקבל תשלום. המידע בשרשרת פומבי, ולכן אפשר לעקוב אחר פלטים של כתובת ולחשב יתרה בשרשרת נתונה, אף שהכתובת אינה חושפת בהכרח את זהות האדם או את כל כתובותיו.</p>\n<p>כורה מציע בלוק וצומת מאמת בודק אותו לפי כללי הקונצנזוס. בין הבדיקות נמצאים הרשאות ההוצאה, סכומים, העדר הוצאה כפולה באותו מצב, קישור להורה ותנאים קריפטוגרפיים. פרסום בלוק אינו מאפשר לכותבו לדרוש מאחרים לקבל עסקה בלתי תקפה. יש להבחין בין האפשרות לשנות קובץ מקומי לבין שכנוע הרשת לאמץ היסטוריה אחרת. אישורים נוספים מקשים על החלפת היסטוריה אך אינם הופכים כל קבלה להבטחה מוחלטת בכל מודל תוקף. אין בנקאי מרכזי המתקן תשלום שנשלח ליעד שגוי, וגם יוצר המערכת אינו מחזיק הרשאת ניהול שמאשרת לבדו שינויים. ההתנהגות נקבעת בידי תוכנות המשתתפים וכללי הקבלה שהם אוכפים.</p>\n<h4>חתימה, אימות ואי־התכחשות</h4>\n<p>חתימה דיגיטלית היא מנגנון שבו בעל מפתח פרטי יוצר הוכחה הקשורה לתוכן מסוים, וכל מי שמכיר את המפתח הפומבי המתאים יכול לבדוק אותה. בפועל חותמים בדרך כלל על ייצוג מקודד של תקציר ההודעה. תפקיד הגיבוב הוא לקשור את ההוכחה לכל תוכן ההודעה ביעילות; תפקיד מפתח החתימה הוא למנוע ממי שאינו מחזיק בסוד ליצור הוכחות חדשות. אלה שני תפקידים נפרדים, ולכן גיבוב ללא חתימה אינו מחליף חתימה, והצפנה לנמען אינה הוכחה לזהות השולח.</p>\n<p>מקבל חייב לבדוק שהמפתח הפומבי שבו הוא משתמש אכן משויך לחותם הרצוי. לאחר מכן עליו לבדוק את החתימה על התוכן המדויק שקיבל, לרבות הקשר חשוב כמו זהות נמען, סוג פעולה ומספר פעולה. חתימה על מפתח בלבד אינה בהכרח חתימה על כל ההודעות שייווצרו בעתיד בעזרתו. באופן דומה, חתימה תקפה אינה מבטיחה שהודעה טרייה: אפשר להחזיר הודעה חתומה ישנה ללא שינוי. כדי למנוע ביצוע חוזר נדרש מנגנון מתאים, כגון מזהה פעולה שנחתם ונבדק מול מצב שמור. אי־התכחשות היא יתרון לעומת MAC משותף, אך פירושה מותנה בהגנה על המפתח וביכולת לשייך אותו לבעליו; אין להסיק ממנה שהמסר מוצפן או שהחותם בהכרח פעל מרצונו החופשי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04122022_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q027.html"},{"id":"Q028","year":"2022","stem":"איזו מבין הטענות הבאות נכונה?","options":["הכח של ההמונים, למשל באמצעות botnet, הוא הכח המניע מאחורי התקפת DDoS","התקפת קמינסקי היא בראש ובראשונה התקפת DoS","התקפות DoS נעשות אך ורק בשכבה הפיזית, הלינק, התעבורה, והרשת","ראשי התיבות DoS הן של התקפות Disk on Stack"],"note":"","sources":[{"file":"2022/689156_04122022_0 (1).pdf","date":"04/12/2022","num":4},{"file":"2022/689156_04122022_0מועד 6 (1).pdf","date":"04/12/2022","num":4},{"file":"ללא תאריך/דוגמא פורמט.pdf","date":null,"num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.292,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-01-09\" data-doc=\"original-01\" data-body-words=\"380\"><h3>שאלה 4 — איזו טענה על DDoS נכונה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> ריבוי מקורות, לדוגמה botnet, מאפשר להציף משאב קורבן. DDoS היא Distributed Denial of Service, ויש גם מניעת שירות בשכבת היישום. קמינסקי היא בראש ובראשונה הרעלת DNS ולא שם נרדף ל־DoS.</p>\n<h4>מניעת שירות היא פגיעה במשאב מוגבל</h4>\n<p>מטרת DoS היא להקשות על משתמשים לגיטימיים לקבל שירות. המשאב המותקף יכול להיות רוחב פס, זיכרון, מקום בטבלת חיבורים, זמן מעבד או משאב יישומי אחר. בהתקפה מבוזרת מקורות רבים פועלים יחד, למשל מחשבים נגועים ב־botnet, ולכן קשה יותר להסתפק בחסימת כתובת יחידה. אין הכרח שכל מקור יהיה מחשב אישי או שההתקפה תתרחש דווקא בשכבת הרשת; גם רכיבי תקשורת ומכשירי קצה יכולים להשתתף, וגם בקשות יישום יכולות להתיש שרת.</p>\n<p>Slowloris מדגימה שמתקפה אינה חייבת לשלוח כמות בתים עצומה. התוקף מחזיק בקשות HTTP לא שלמות ומתקדם באיטיות, כך שהשרת ממשיך להקצות להן משאבים. SYN flood פועלת בשלב אחר ומשתמשת במצב חיבור שטרם הושלם. ההבחנה קובעת מהי הגנה מועילה: הגבלת זמן לקבלת כותרות ומספר חיבורים מתאימה לבקשות איטיות, בעוד שמנגנון SYN cookies מטפל בהקצאת מצב מוקדמת בחיבור TCP. הגנה גורפת מדי יכולה לפגוע גם בלקוח איטי או בשירות גיבוי לגיטימי. לכן שיעור תעבורה גבוה הוא סימן לבדיקה ולא הוכחה לזדון, והסבר טוב צריך לזהות איזה משאב נשמר, באיזה שלב הוא מוקצה, וכיצד התוקף גורם לו להישאר תפוס.</p>\n<h4>סריקה, ניצול חולשה ואכיפת הגנה</h4>\n<p>סריקת רשת היא איסוף מידע על כתובות, פורטים ושירותים שנענים. השירות שמאזין עשוי לחשוף גרסה או מאפיין שימושי לבדיקה נוספת. כלי סריקה יכול לעזור למנהל למפות את המערכת ולתוקף לבחור מטרות, אבל גילוי פורט פתוח אינו הוכחה שניתן להשתלט על המחשב. נדרש שלב נוסף, כגון ניצול חולשה מתאימה או שימוש בהרשאות שנחשפו. זו ההבחנה בין מציאת משטח תקיפה לבין הצלחת חדירה.</p>\n<p>מסגרת כמו Metasploit מסייעת בארגון ובביצוע בדיקות ניצול, ואינה מסנן חבילות או WAF רק מפני שמשתמשים בה בתחום האבטחה. חומת אש מפעילה מדיניות על תעבורה; IDS מחפש התנהגות חשודה; סורק ומסגרת ניצול בודקים מטרות בדרכים אחרות. לפעמים מוצר אחד כולל כמה רכיבים, אך אין בכך שינוי בהגדרה של כל תפקיד. גם מיקום התקנה שונה אינו משנה זאת: הגנות יכולות לרוץ בתחנת קצה, בשרת או ברכיב מרכזי. תהליך תקיפה היוצר botnet עשוי להתחיל בסריקה, להמשיך בניצול ולהסתיים בהפעלת מחשבים רבים לצורך DDoS או שימוש אחר. יש להבין את רצף הפעולות ולא לדלג מן המילה ״סריקה״ לטענה שכל מחשב שנסרק כבר הפך לבוט. ההבחנה מאפשרת לפסול ניסוחים רחבים מדי גם כשכיוון הטענה הכללי מוכר.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04122022_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q028.html"},{"id":"Q029","year":"2022","stem":"היכן ביטקוין משתמש ב nonce?","options":["בתהליך החיפוש אחר בלוק חדש (הבלוק הבא שיצטרף לבלוקצ'יין)","כאשר miner מצטרף אל הרשת","ב hard fork","ב soft fork"],"note":"","sources":[{"file":"2022/689156_04122022_0 (1).pdf","date":"04/12/2022","num":5},{"file":"2022/689156_04122022_0מועד 6 (1).pdf","date":"04/12/2022","num":5},{"file":"ללא תאריך/דוגמא פורמט.pdf","date":null,"num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.353,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-01-10\" data-doc=\"original-01\" data-body-words=\"362\"><h3>שאלה 5 — היכן משמש nonce בביטקוין?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> כורה משנה nonce ושדות נוספים בכותרת מועמדת עד ש־hash הכותרת עומד ביעד הקושי. הוא אינו טקס הצטרפות לרשת ואינו מנגנון המגדיר hard/soft fork.</p>\n<h4>כרייה, קושי וזמן הפצת מידע</h4>\n<p>Proof of Work דורש מכורה למצוא כותרת בלוק שהגיבוב שלה עומד ביעד מספרי שנקבע לפי הקושי. הכורה משנה nonce ונתונים נוספים במועמד ומנסה שוב; לא קיימת דרך כללית להבטיח שמספר מסוים של ניסיונות יניב פתרון. כשמוצאים בלוק, מפיצים אותו ברשת, וצמתים אחרים בודקים אותו. זמן ההפצה אינו אפס, ולכן לפרק זמן קצר משתתפים שונים עשויים לעבוד על מצבים שונים ולמצוא בלוקים מתחרים.</p>\n<p>היחס בין זמן יצירת בלוקים לזמן הפצתם חשוב לתפקוד הקונצנזוס. אם מוצאים בלוקים מהר בהרבה מכפי שהמידע מתפשט, שיעור העבודה על ענפים שלא יישארו בהיסטוריה המועדפת גדל. בעלי קישוריות מהירה יכולים ליהנות מיתרון, ושינוי מספר בדיקה בתוכנה אינו מקצר בעצמו את השהיית הרשת. מאגרי כרייה מאפשרים לכורים לאחד עבודה ולחלק תגמול, וכך לצמצם את השונות בהכנסה ביחס לכרייה בודדת; אין מכאן שינוי בתנאי תקפות הבלוק. גם תוקף בעל רוב כוח חישוב אינו יכול לזייף חתימה של אדם אחר, אבל הוא עשוי לצנזר עסקאות או לבנות ענף חלופי תקף. לכן צריך להבחין בין כמות כוח, מהירות גילוי, תקפות עסקאות ומדיניות בחירת השרשרת.</p>\n<h4>מה מצפים מפונקציית גיבוב קריפטוגרפית</h4>\n<p>פונקציית גיבוב ממפה הודעה באורך משתנה לתקציר באורך קבוע. מכיוון שמספר הקלטים גדול ממספר הפלטים, התנגשויות בהכרח קיימות; הדרישה אינה שלא יהיו התנגשויות כלל, אלא שיהיה קשה חישובית למצוא אותן. בהתנגשות התוקף בוחר שתי הודעות שונות שמניבות אותו תקציר. בקדם־תמונה נתון רק תקציר ומנסים למצוא הודעה מתאימה. בקדם־תמונה שנייה ניתנת הודעה מסוימת, והתוקף מחפש הודעה אחרת עם אותו תקציר. חשוב לזהות איזה מידע נקבע לפני שהחיפוש מתחיל.</p>\n<p>אם פונקציה מאפשרת חיבור חילופי פשוט או מתעלמת מחלק מהתווים, אפשר לעיתים לכתוב זוג מתנגש בלי לבצע חיפוש כלשהו. זה חמור יותר מאמירה כללית על מספר הפלטים, משום שמוצגת התקפה יעילה ומפורשת. לדוגמה, פונקציה שרק סוכמת ערכי אותיות לא מבחינה בהחלפת סדרן; תקציר שווה לא מוכיח ששני קבצים זהים. גם תקציר חזק לבדו אינו מוכיח מי יצר הודעה, שהרי כל אדם יכול לחשב אותו על הודעה חדשה. לאימות מול תוקף צריך לקשור את התקציר לסוד, באמצעות MAC, או לחתימה מאומתת. בשאלת חישוב יש לבצע בדיוק את הפעולה שהוגדרה, לרבות המודולו, ולא להניח ששם הפעולה מעניק לה בטיחות.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04122022_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q029.html"},{"id":"Q030","year":"2022","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["הגדרה נכונה של IDS מונעת התקפות DNS poisoning","תוקף בעל יכולות eavesdropping בין קורבן לשרת ה DNS שאליו פנה לא תמיד יצליח בהתקפת DNS poisoning","תוקף בעל יכולות MitM בין קורבן לשרת ה DNS שאליו פנה אינו צריך לנחש את ה transaction Id כדי להצליח בהתקפת DNS poisoning","פרדוקס יום ההולדת אינו עקרון ייעודי עבור התקפת הרעלת ה DNS של קמינסקי, והוא עקרון שעומד בפני עצמו ושימושי גם לדברים אחרים."],"note":"","sources":[{"file":"2022/689156_04122022_0 (1).pdf","date":"04/12/2022","num":6},{"file":"2022/689156_04122022_0מועד 6 (1).pdf","date":"04/12/2022","num":6},{"file":"ללא תאריך/דוגמא פורמט.pdf","date":null,"num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.321,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-01-11\" data-doc=\"original-01\" data-body-words=\"402\"><h3>שאלה 6 — IDS והרעלת DNS — הטענה השגויה</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> IDS מזהה ומתריע; כשלעצמו אינו חוסם חבילות. IPS יכול לבצע חסימה/תגובה. לכן טענה שלפיה עצם הגדרת IDS מונעת הרעלת DNS שגויה. מיפוי ARP סטטי יכול לסייע נגד החלפת המיפוי, ו־nmap מסייע במיפוי שירותים ובבדיקות חולשות מתאימות. האזנה בלבד אינה מבטיחה ניצחון במרוץ או יכולת הזרקה; MitM שרואה שאילתה רואה גם את המזהה ואינו חייב לנחשו.</p>\n<h4>ההבדל בין גילוי, מניעה והוכחת תקינות</h4>\n<p>IDS מיועד לניטור ולזיהוי התנהגות חשודה. הוא עשוי לנתח תבניות מוכרות, חריגות בתעבורה או אירועים במחשב, ולהתריע למפעיל. מתן התרעה אינו כשלעצמו עצירת החבילה או ביטול הפעולה שכבר נעשתה. IPS מוסיף יכולת תגובה פעילה, למשל חסימת תעבורה העוברת דרכו. לכן שימוש במילה ״מונע״ לגבי IDS טהור מחליף משימה אחת באחרת. אפשר לבנות מערכת שבה התרעות מפעילות כלים נוספים, אך אז צריך לתאר במפורש את שרשרת התגובה ולא לייחס אותה לשם IDS לבדו.</p>\n<p>גם מנגנון חוסם אינו נותן הבטחה גורפת שכל תקיפה תיעצר. כלל זיהוי עשוי להחמיץ התקפה חדשה או לסווג פעילות רגילה כחשודה. לדוגמה, שרת גיבוי יכול לייצר נפח גדול בלי להיות תוקף, בעוד שניחוש מזהי DNS יכול להיראות כחבילות קצרות רגילות. ההגנה הישירה צריכה להימצא גם בפרוטוקול או בקוד: אימות נתונים, הפרדת תחביר מנתונים, בדיקת הרשאות ועדכון רכיבים פגיעים. סריקה בכלי כמו nmap עוזרת לגלות שירותים וממצאים אפשריים, אבל אינה מוכיחה שהמערכת בטוחה אחרי שהסריקה הסתיימה. בניתוח כל חלופה יש לשאול אם היא מתארת תצפית, אכיפת מדיניות או תכונת בטיחות; אלה תפקידים משלימים שאינם מילים נרדפות.</p>\n<h4>התאמת תשובת DNS לשאילתה והזדמנות הזיוף</h4>\n<p>resolver הוא רכיב המבקש תשובה לשם דומיין ושומר תוצאות לזמן מוגבל במטמון. כאשר פרוטוקול התשובה אינו מאומת קריפטוגרפית, רכיב המקבל צריך להחליט אם חבילה באמת שייכת לבקשה פתוחה. בין הנתונים הנבדקים נמצאים המזהה, שם השאילתה, השרת המצופה ופורט המקור של הבקשה. תוקף יכול לזייף מקור של תשובה ולנסות לפגוע בניחוש הערכים הדרושים לפני שמגיעה התשובה האמיתית. כניסה של ערך כוזב למטמון עלולה להשפיע גם על לקוחות נוספים המשתמשים בו.</p>\n<p>תוקף הנמצא בנתיב רואה יותר מידע מתוקף מרוחק שאינו רואה את הבקשה, אך אין פירוש הדבר שרק הראשון יכול לתקוף. אם המרחב לניחוש קטן והתוקף מקבל מספיק הזדמנויות, קיימת גם מתקפת off-path. מזהה אחיד בן שש עשרה סיביות נותן שישים וחמישה אלף וחמש מאות שלושים ושישה ערכים אפשריים; פורט אקראי עצמאי מוסיף אי־ודאות רק אם אינו ידוע לתוקף. חשוב להפריד בין סיכוי בניסיון בודד לבין סיכוי מצטבר לאורך ניסיונות חוזרים. מדיניות שמבטלת שאילתה אחרי תגובות שגויות עלולה למנוע גם את קבלת התשובה הנכונה וליצור מניעת שירות. הוספת זיהוי התקפה אינה שקולה לאימות התשובה, וגם התרעה אינה חסימה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04122022_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q030.html"},{"id":"Q031","year":"2022","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["מניעת התקפות הרעלת ARP משמעותה הפסקה גורפת בשימוש בכתובות MAC","תוקף MitM עלול לנסות לבצע התקפת degradation כנגד הקמת חיבור SSL/TLS","התקפת degradation כנגד switch מבוצעת ע\"י תוקפים הרוצים לקבל יכולות האזנה ברשת","התקפת ARP poisoning עובדת כי בפרוטוקול ARP אין שימוש באימות ההודעות"],"note":"","sources":[{"file":"2022/689156_04122022_0 (1).pdf","date":"04/12/2022","num":7},{"file":"2022/689156_04122022_0מועד 6 (1).pdf","date":"04/12/2022","num":7},{"file":"ללא תאריך/דוגמא פורמט.pdf","date":null,"num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.329,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-01-12\" data-doc=\"original-01\" data-body-words=\"397\"><h3>שאלה 7 — מניעת הרעלת ARP — הטענה השגויה</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> אין צורך להפסיק להשתמש ב־MAC כדי להגן על ARP: למשל מיפויים סטטיים או בדיקות מתג מתאימות. חולשת ARP נובעת מחוסר אימות ההודעות. מתקפות הצפת טבלת MAC במתג עשויות לגרום להצפת מסגרות ולסייע להאזנה; הגנות מתג יכולות לצמצם זאת.</p>\n<h4>מיפוי כתובות ברשת מקומית</h4>\n<p>ARP מאפשר למחשב ברשת מקומית ללמוד איזו כתובת MAC משמשת יעד מסוים בעל כתובת IP. המחשב זקוק למיפוי כדי לשלוח מסגרת בקישור המקומי, למשל אל שער ברירת המחדל. בפרוטוקול הבסיסי אין חתימה המאמתת שכל הודעת מיפוי אכן נשלחה מבעל הכתובת. תוקף מקומי יכול לנצל זאת ולגרום לקורבן לשמור מיפוי שגוי, כך שמסגרות יגיעו אליו במקום ליעד המקורי. אם הוא מעביר אותן הלאה, הוא עשוי להשיג תיווך בתעבורה בלי לנתק אותה מיד.</p>\n<p>אין צורך שהתוקף כבר יהיה MitM כדי להתחיל הרעלת ARP; לעיתים ההרעלה היא הדרך שבה הוא משיג יכולת זו. עם זאת, הודעות ARP רגילות מוגבלות למקטע הקישור ואינן כלי שמאפשר לכל מחשב מרוחק באינטרנט לשנות טבלה מקומית דרך נתבים. מיפויים סטטיים או בדיקות מתג מתאימות יכולים לצמצם את הסיכון, ואין צורך לבטל כל שימוש בכתובות MAC. מצד שני, כתובת MAC עצמה אינה סוד ואינה הוכחת זהות קריפטוגרפית. גם תוקף ששולט בנתיב אינו מקבל אוטומטית מפתחות TLS תקינים. יש להפריד בין הסבת חבילות ברשת לבין שבירת הגנות שכבות גבוהות, ובין כתובת חומרה המשמשת למשלוח מסגרות לבין הרשאה לבצע פעולה רגישה בממשק אינטרנטי.</p>\n<h4>סינון חבילות, מדיניות ומצב חיבורים</h4>\n<p>חומת אש בוחנת תעבורה העוברת דרכה ומחליטה לאשר או לדחות לפי כללים. מסנן חבילות יכול להשתמש בכיוון התעבורה, כתובות מקור ויעד, פורטים ופרוטוקול. כללי allowlist מאפשרים רק את התעבורה שהוגדרה ומשאירים כלל דחייה כברירת מחדל. עם זאת, מספר פורט אינו הוכחה לזהות יישום: תוקף יכול לנסות לשלוח חיבור מפורט שבחר, ושירות יכול לרוץ בפורט שאינו המקובל שלו. לכן צריך לקרוא את תנאי הכלל ממש, ולא את כוונת האדם שכתב אותו.</p>\n<p>חומת אש שמנהלת מצב יכולה לבדוק אם חבילה היא חלק מחיבור שכבר נפתח ואושר. מסנן חסר מצב שמאפשר תשובות רק בגלל פורט מקור מוכר עלול לאפשר גם התחלת חיבור זדוני הנראית כך. סינון דגלים משפר דיוק במקרים מסוימים, אך אינו תחליף מלא למעקב מצב ולאימות יישומי. יש גם גבול טופולוגי: חומת אש בגבול הרשת אינה רואה בהכרח חבילות ששני מחשבים פנימיים מחליפים ישירות. בדומה לכך, בלי בדיקת תוכן יישום אין להניח שהיא מזהה קוד זדוני בתוך אימייל. סינון מקורות חשודים יכול לצמצם זיוף כתובות, אבל אינו הופך כל כתובת מקור לזהות אמינה. לכל כלל צריך לבנות גם מסלול הלוך וגם מסלול חזור ולבדוק אם שניהם עוברים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04122022_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q031.html"},{"id":"Q032","year":"2022","stem":"איזו מבין הטענות הבאות נכונה?","options":["ב syn-flood תוקף יעדיף כתובת IP מזוייפות כ source ובעיקר כאלו שלא יענו, כדי, בין השאר, למנוע החזרת RST על ה syn+ack ולמנוע חסימה של ההתקפה ע\"י חסימת כתובות ספציפיות","לא ניתן למנוע התקפות שנמוך כנגד switch","על מנת לבצע ARP poisoning, התוקף זקוק ליכולת MITM","שימוש ב syn-cookies מכריח את השרת לשמור אצלו בזיכרון את כל ה TCB החל מקבלת ה syn הראשוני"],"note":"","sources":[{"file":"2022/689156_04122022_0 (1).pdf","date":"04/12/2022","num":8},{"file":"2022/689156_04122022_0מועד 6 (1).pdf","date":"04/12/2022","num":8},{"file":"ללא תאריך/דוגמא פורמט.pdf","date":null,"num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.288,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-01-13\" data-doc=\"original-01\" data-body-words=\"392\"><h3>שאלה 8 — SYN flood — איזו טענה נכונה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> זיוף מקורות שאינם משיבים עשוי למנוע RST שהיה סוגר מצב חצי פתוח, ולהקשות חסימה לפי מקור יחיד. SYN cookies מצמצמות שמירת מצב עד ל־ACK מאמת, ולא מחייבות שמירת TCB מלא עם ה־SYN הראשון. ARP poisoning אינה דורשת MitM קיים.</p>\n<h4>לחיצת היד של TCP והמשמעות של RST</h4>\n<p>בחיבור TCP רגיל הלקוח שולח SYN, השרת מחזיר SYN+ACK, והלקוח משלים ACK. במימוש ששומר מצב כבר אחרי ההודעה הראשונה, כל ניסיון התחלה יכול לתפוס מקום גם לפני שנבדק שהמקור באמת מסוגל לקבל תשובה. SYN flood מנצלת זאת באמצעות הרבה ניסיונות שאינם מושלמים. אם כתובת המקור מזויפת, התשובה הולכת למחשב אחר ולא לתוקף, ולכן צריך לבחון מה אותו מחשב יעשה כשיקבל הודעה שלא ציפה לה.</p>\n<p>מחשב חי עשוי להחזיר RST עבור חיבור שאינו מכיר. הודעה זו יכולה לגרום לשרת לשחרר את המצב החצי פתוח, ולכן מבחינת התוקף זו תוצאה לא רצויה. בחירת מקורות שאינם משיבים מצמצמת את האפשרות הזו. מנגד, כאשר השרת משתמש ב־SYN cookies, הוא מקודד מידע מתאים במספר הרצף של תשובתו ואינו חייב לשמור את כל מצב החיבור מיד. רק ACK תקין מאפשר לשחזר ולאשר את המידע. המנגנון מצמצם סוג מסוים של התשת מצב, אך אינו מבטיח חסינות מהצפת רוחב פס או מכל תקיפת יישום. אין גם קשר בין המילה cookies כאן לבין cookie הזדהות של דפדפן. אלה עצמים שונים לגמרי, ולכן SYN cookies אינם הגנת CSRF ואינם בדיקת הרשאות של משתמש באתר.</p>\n<h4>מניעת שירות היא פגיעה במשאב מוגבל</h4>\n<p>מטרת DoS היא להקשות על משתמשים לגיטימיים לקבל שירות. המשאב המותקף יכול להיות רוחב פס, זיכרון, מקום בטבלת חיבורים, זמן מעבד או משאב יישומי אחר. בהתקפה מבוזרת מקורות רבים פועלים יחד, למשל מחשבים נגועים ב־botnet, ולכן קשה יותר להסתפק בחסימת כתובת יחידה. אין הכרח שכל מקור יהיה מחשב אישי או שההתקפה תתרחש דווקא בשכבת הרשת; גם רכיבי תקשורת ומכשירי קצה יכולים להשתתף, וגם בקשות יישום יכולות להתיש שרת.</p>\n<p>Slowloris מדגימה שמתקפה אינה חייבת לשלוח כמות בתים עצומה. התוקף מחזיק בקשות HTTP לא שלמות ומתקדם באיטיות, כך שהשרת ממשיך להקצות להן משאבים. SYN flood פועלת בשלב אחר ומשתמשת במצב חיבור שטרם הושלם. ההבחנה קובעת מהי הגנה מועילה: הגבלת זמן לקבלת כותרות ומספר חיבורים מתאימה לבקשות איטיות, בעוד שמנגנון SYN cookies מטפל בהקצאת מצב מוקדמת בחיבור TCP. הגנה גורפת מדי יכולה לפגוע גם בלקוח איטי או בשירות גיבוי לגיטימי. לכן שיעור תעבורה גבוה הוא סימן לבדיקה ולא הוכחה לזדון, והסבר טוב צריך לזהות איזה משאב נשמר, באיזה שלב הוא מוקצה, וכיצד התוקף גורם לו להישאר תפוס.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04122022_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q032.html"},{"id":"Q033","year":"2022","stem":"בפרוטוקול TLS, ה pre master secret מוצפן באמצעות?","options":["המפתח הציבורי של השרת","המפתח הסימטרי של ה CA","המפתח הציבורי של הלקוח","המפתח הפרטי של הלקוח"],"note":"","sources":[{"file":"2022/689156_04122022_0 (1).pdf","date":"04/12/2022","num":9},{"file":"2022/689156_04122022_0מועד 6 (1).pdf","date":"04/12/2022","num":9},{"file":"ללא תאריך/דוגמא פורמט.pdf","date":null,"num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"TLS / HTTPS","topic_score":0.385,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-01-14\" data-doc=\"original-01\" data-body-words=\"382\"><h3>שאלה 9 — באיזה מפתח מוצפן premaster secret?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> התשובה היא המפתח הציבורי של השרת, בהקשר RSA key exchange ב־SSL/TLS הישן הנלמד. השרת מפענח באמצעות מפתחו הפרטי. אין להכליל זאת ל־(EC)DHE או TLS 1.3: שם הסוד המשותף נגזר מהסכמה על מפתח ואינו נשלח כמחרוזת premaster מוצפנת ב־RSA.</p>\n<h4>הפרדת תפקידים וחומר מפתח בחיבור</h4>\n<p>במודל RSA של TLS הישן הלקוח יוצר premaster secret ושולח אותו מוצפן במפתח הפומבי של השרת. רק המפתח הפרטי התואם אמור לאפשר לשרת לשחזר אותו. לאחר מכן שני הצדדים גוזרים את סודות החיבור ואת המפתחות הדרושים בעזרת אותו חומר בסיסי ונתוני הקמה פומביים. ה־CA אינו מקבל את הסוד ואינו משמש כשרת שמצפין את כל התעבורה; תפקידו לאשר את הקשר בין זהות האתר למפתח שבתעודה.</p>\n<p>גזירת המפתחות מפרידה בין כיווני התעבורה ובין תפקידים שונים, כגון הצפנה ואימות במודל הנלמד. כך אין שימוש בלתי מבוקר באותו רצף מפתח לכל מטרה. הנתונים האקראיים שנשלחים בהקמה יכולים להיות גלויים, מפני שתפקידם לתרום טריות והבחנה בין חיבורים, ולא לשמש לבדם סוד. יש להבחין בין מודל זה לבין החלפת מפתחות אפמרלית: אם מפתח RSA הפרטי נחשף בעתיד, הקלטה של חילוף RSA ישן עלולה לאפשר שחזור סודות העבר. זו הסיבה שחייבים לציין את מנגנון ההקמה כששואלים אם מפתח מסוים מוצפן או נגזר. מפתח תעודה, סוד משותף ומפתח תעבורת יישום אינם שלושה שמות לאותו עצם, ואין לערבב את מיקום השמירה או אופן ההפצה שלהם.</p>\n<h4>מה מספק TLS ובאילו שכבות הוא פועל</h4>\n<p>TLS יוצר ערוץ מוצפן ומאומת מעל תעבורה שבפני עצמה יכולה להיות חשופה למאזין או לתוקף פעיל. תחילה הצדדים מסכימים על פרמטרים ומקימים חומר מפתח, ובתצורה הנפוצה השרת מוכיח זהות באמצעות תעודה ומפתח פרטי מתאים. אחר כך מידע היישום מוגן במפתחות סימטריים. הבחירה במנגנון סימטרי להעברת מידע רב נובעת מיעילותו; המנגנונים האסימטריים פותרים בעיקר את בעיית ההקמה והאימות בלי סוד משותף שהותקן מראש.</p>\n<p>יש להבדיל בין הגנת הערוץ לבין תקינות התוכנה שמשתמשת בו. TLS לא מונע מהיישום להפעיל שאילתת SQL מסוכנת, לשלב קוד תוקף בדף או לקבל בקשת פעולה שהמשתמש לא התכוון אליה. הוא גם אינו מעניק אוטומטית זהות לכל לקוח: בתצורות רבות רק השרת מציג תעודה והמשתמש מזדהה אחר כך בסיסמה או באמצעי יישומי. תוקף שולט ברשת יכול עדיין לחסום את החיבור ולגרום למניעת שירות, גם כשאינו יכול לקרוא או לשנות תוכן מאומת. בתשובה על המצגת יש לציין אם מדובר ב־TLS הישן עם RSA או במנגנון אחר, משום שפרטי החלפת המפתח וההודעות השתנו בין גרסאות. ערבוב כל הזרימות לתיאור יחיד עלול להוביל לתשובה שגויה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04122022_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q033.html"},{"id":"Q034","year":"2022","stem":"איזו מבין הטענות הבאות נכונה בהקשר של חתימה דיגיטלית?","options":["מחשבים את ה hash של המידע שרוצים לחתום עליו. מצפינים את ה hash עם המפתח הפרטי של השולח, ושולחים את הhash המוצפן והמידע עצמו. האימות מתבצע על ידי המקבל ע\"י פענוח ה hash המוצפן בעזרת המפתח הפומבי של החותם והשוואתו לתוצאת ביצוע hash על המידע שנשלח.","מחשבים את ה hash של המידע שרוצים לחתום עליו. מצפינים את ה hash עם המפתח הפרטי של השולח, ושולחים את הhash המוצפן והמידע עצמו. האימות מתבצע על ידי המקבל ע\"י פענוח ה hash המוצפן בעזרת המפתח הפרטי של החותם והשוואתו לתוצאת ביצוע hash על המידע שנשלח.","מחשבים את ה hash של המידע שרוצים לחתום עליו. מצפינים את ה hash עם המפתח הפומבי של השולח, ושולחים את הhash המוצפן והמידע עצמו. האימות מתבצע על ידי המקבל ע\"י ביצוע hash על ה hash המוצפן שהתקבל והשוואתו למידע שנשלח.","מחשבים את ה hash של המידע שרוצים לחתום עליו. מצפינים את ה hash עם המפתח הפומבי של השולח, ושולחים את הhash המוצפן והמידע עצמו. האימות מתבצע על ידי המקבל ע\"י פענוח ה hash המוצפן בעזרת המפתח הפרטי של החותם והשוואתו לתוצאת ביצוע hash על המידע שנשלח."],"note":"","sources":[{"file":"2022/689156_04122022_0 (1).pdf","date":"04/12/2022","num":10},{"file":"2022/689156_04122022_0מועד 6 (1).pdf","date":"04/12/2022","num":10},{"file":"ללא תאריך/דוגמא פורמט.pdf","date":null,"num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.244,"exam_count":1,"in_sample_exam":true,"variant_group":"V04","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-01-15\" data-doc=\"original-01\" data-body-words=\"392\"><h3>שאלה 10 — חתימה דיגיטלית — איזו הצעה נכונה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> חתימה נוצרת באמצעות המפתח הפרטי של החותם ונבדקת באמצעות המפתח הפומבי שלו. המקבל מחשב מחדש את תקציר ההודעה ובודק שהחתימה תקפה עבורו. הביטוי ״הצפנת hash במפתח פרטי״ הוא הפשטה לימודית המתאימה לתיאור RSA; חתימה תקנית משתמשת בסכמת חתימה וקידוד מאובטחים ואינה פעולת הצפנה כללית.</p>\n<h4>חתימה, אימות ואי־התכחשות</h4>\n<p>חתימה דיגיטלית היא מנגנון שבו בעל מפתח פרטי יוצר הוכחה הקשורה לתוכן מסוים, וכל מי שמכיר את המפתח הפומבי המתאים יכול לבדוק אותה. בפועל חותמים בדרך כלל על ייצוג מקודד של תקציר ההודעה. תפקיד הגיבוב הוא לקשור את ההוכחה לכל תוכן ההודעה ביעילות; תפקיד מפתח החתימה הוא למנוע ממי שאינו מחזיק בסוד ליצור הוכחות חדשות. אלה שני תפקידים נפרדים, ולכן גיבוב ללא חתימה אינו מחליף חתימה, והצפנה לנמען אינה הוכחה לזהות השולח.</p>\n<p>מקבל חייב לבדוק שהמפתח הפומבי שבו הוא משתמש אכן משויך לחותם הרצוי. לאחר מכן עליו לבדוק את החתימה על התוכן המדויק שקיבל, לרבות הקשר חשוב כמו זהות נמען, סוג פעולה ומספר פעולה. חתימה על מפתח בלבד אינה בהכרח חתימה על כל ההודעות שייווצרו בעתיד בעזרתו. באופן דומה, חתימה תקפה אינה מבטיחה שהודעה טרייה: אפשר להחזיר הודעה חתומה ישנה ללא שינוי. כדי למנוע ביצוע חוזר נדרש מנגנון מתאים, כגון מזהה פעולה שנחתם ונבדק מול מצב שמור. אי־התכחשות היא יתרון לעומת MAC משותף, אך פירושה מותנה בהגנה על המפתח וביכולת לשייך אותו לבעליו; אין להסיק ממנה שהמסר מוצפן או שהחותם בהכרח פעל מרצונו החופשי.</p>\n<h4>מה מצפים מפונקציית גיבוב קריפטוגרפית</h4>\n<p>פונקציית גיבוב ממפה הודעה באורך משתנה לתקציר באורך קבוע. מכיוון שמספר הקלטים גדול ממספר הפלטים, התנגשויות בהכרח קיימות; הדרישה אינה שלא יהיו התנגשויות כלל, אלא שיהיה קשה חישובית למצוא אותן. בהתנגשות התוקף בוחר שתי הודעות שונות שמניבות אותו תקציר. בקדם־תמונה נתון רק תקציר ומנסים למצוא הודעה מתאימה. בקדם־תמונה שנייה ניתנת הודעה מסוימת, והתוקף מחפש הודעה אחרת עם אותו תקציר. חשוב לזהות איזה מידע נקבע לפני שהחיפוש מתחיל.</p>\n<p>אם פונקציה מאפשרת חיבור חילופי פשוט או מתעלמת מחלק מהתווים, אפשר לעיתים לכתוב זוג מתנגש בלי לבצע חיפוש כלשהו. זה חמור יותר מאמירה כללית על מספר הפלטים, משום שמוצגת התקפה יעילה ומפורשת. לדוגמה, פונקציה שרק סוכמת ערכי אותיות לא מבחינה בהחלפת סדרן; תקציר שווה לא מוכיח ששני קבצים זהים. גם תקציר חזק לבדו אינו מוכיח מי יצר הודעה, שהרי כל אדם יכול לחשב אותו על הודעה חדשה. לאימות מול תוקף צריך לקשור את התקציר לסוד, באמצעות MAC, או לחתימה מאומתת. בשאלת חישוב יש לבצע בדיוק את הפעולה שהוגדרה, לרבות המודולו, ולא להניח ששם הפעולה מעניק לה בטיחות.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04122022_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q034.html"},{"id":"Q035","year":"2022","stem":"מהי התקפת blind sql injection?","options":["התוקף אינו מקבל את הפלט המקורי של הרצת השאילתא מהשרת, ולכן בונה את השאילתא באופן כזה שבדרך \"עקיפה\" יבין האם התשובה לשאילתא היא נכונה או לא. (מנגנון של True/false)","התוקף מבצע ניסוי וטעיה של התקפות שונות מפני שאינו יכול (blind) לבצע התקפות מסוג sql injection. ההתקפות הללו שייכות למשפחות התקפות אחרות, למשל XSS ו CSRF","התוקף גורם לקורבנות להזין פרמטרים לשאילתת sql, כך שהקורבנות לא מודעים לכך, כלומר, עיוורים.","התוקף משתמש בדפדפנים של הקורבנות לביצוע התקפתה מסוג sql injection, כך שהשרת לא יודע מי התוקף, כלומר, עיוור."],"note":"","sources":[{"file":"2022/689156_04122022_0 (1).pdf","date":"04/12/2022","num":11},{"file":"2022/689156_04122022_0מועד 6 (1).pdf","date":"04/12/2022","num":11}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.301,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-01-16\" data-doc=\"original-01\" data-body-words=\"382\"><h3>שאלה 11 — מהי blind SQL injection?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> התוקף אינו מקבל את תוצאת השאילתה ישירות, ומסיק על נתונים באמצעות הבדל בתגובה, תנאי אמת/שקר או זמן תגובה. אין הכוונה לכך שהוא אינו יודע לבצע SQLi או שהקורבן ״עיוור״ לזהות התוקף.</p>\n<h4>הפרדה בין מבנה שאילתה לבין נתוני משתמש</h4>\n<p>SQL injection מתרחשת כאשר קלט משתמש נעשה חלק מתחביר שאילתת מסד נתונים. אם השרת בונה מחרוזת SQL באמצעות שרשור, תוקף עשוי לסגור ביטוי, להוסיף תנאי או לשנות את המשך השאילתה. ההתקפה אינה תלויה בכך שהמשתמש הקליד ערך דרך הטופס הרגיל; כל נתון שמגיע ממקור לא מהימן עשוי להגיע לבניית השאילתה. ההגנה הישירה היא שימוש בפרמטרים קשורים, כך שמנוע המסד מקבל את מבנה הפקודה בנפרד מערכי הנתונים.</p>\n<p>בהתקפה עיוורת היישום אינו מציג את תוצאת השאילתה ישירות. התוקף יכול עדיין לשאול שאלות שהשפעתן נראית בתשובת השרת או בזמן התגובה, ולבנות מידע בהדרגה. למשל הבדל בין דף רגיל לשגיאה עשוי לשמש תשובת אמת או שקר. לכן העלמת הודעות שגיאה אינה תיקון מספק לקוד הפגיע. רשימה שחורה של תווים או מילות מפתח עלולה להחמיץ תחביר חלופי; גם WAF הוא שכבת הגנה נוספת ולא הוכחה שהשאילתה בטוחה. התוצאה יכולה להיות קריאת מידע, שינויו או שתילת תוכן שיוצג אחר כך באתר ויוביל גם ל־XSS. יש לזהות תחילה איזה מפרש מקבל את הקלט, ורק אחר כך לבחור את ההגנה המתאימה; מנגנוני iframe או הצפנת תעבורה אינם משנים את פירוש השאילתה במסד.</p>\n<h4>גבול האמון בין ממשק המשתמש לבין השרת</h4>\n<p>כל קלט שמגיע לשרת צריך להיחשב לא מהימן גם אם ממשק האתר הרגיל בדק אותו קודם. תוקף יכול לשנות את הקוד בדפדפן שלו, לשלוח בקשה בכלי אחר או לפנות ישירות לכתובת שאינה מופיעה במסך. לכן בדיקות בצד הלקוח מועילות לשימושיות ולמשוב מהיר, אך אינן גבול אבטחה שהשרת יכול להסתמך עליו. בצד השרת יש לאמת סוגים, טווחים והרשאות לפי הפעולה המיועדת.</p>\n<p>המונח ״חיטוי״ עלול להסתיר הבדלים חשובים. ערך מספרי צריך בדרך כלל להיפרס למספר בתחום מותר; ערך המשולב ב־SQL צריך לעבור כפרמטר; טקסט שמוצג בדף צריך קידוד פלט המתאים למיקום שלו. מחיקת רשימת תווים קבועה אינה פתרון אוניברסלי, משום שלכל שפה והקשר יש תחביר אחר. לדוגמה, סינון גרש אינו מספק הוכחה ששאילתה דינמית בטוחה, וקידוד HTML אינו הופך טקסט לבטוח אוטומטית בתוך JavaScript. כדאי לשמור הפרדה בין נתון גולמי לבין ייצוג שמיועד לתצוגה, כדי למנוע גם קידוד כפול ושיבוש נתונים. ההגנה צריכה להשתלב במקום שבו הנתון מקבל משמעות: כשמפרשים שאילתה, מציגים תוכן או מאשרים פעולה, ולא רק בשדה הטופס הראשון שהמשתמש רואה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04122022_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q035.html"},{"id":"Q036","year":"2022","stem":"עבור n=23 ו g=3, אליס ובוב הריצו את פרוטוקול Diffie-Hellman. במהלך הרצת הפרוטוקול, אליס שלחה לבוב את המספר 12 ובוב שלח לה את המספר 13. מה מהבאים יכול להיות המספר הסודי שנבחר?","options":["18","15","16","17"],"note":"","sources":[{"file":"2022/689156_04122022_0 (1).pdf","date":"04/12/2022","num":12},{"file":"2022/689156_04122022_0מועד 6 (1).pdf","date":"04/12/2022","num":12}],"flags":[],"fixed_order":false,"exclude":false,"topic":"דיפי-הלמן והחלפת מפתחות","topic_score":0.411,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-01-17\" data-doc=\"original-01\" data-body-words=\"373\"><h3>שאלה 12 — DH: מודולו 23, בסיס 3, ערכים פומביים 12 ו־13</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> מחפשים חזקות: 3^4 mod 23=12, ו־3^5 mod 23=13. לכן הסוד המשותף הוא 13^4 mod 23=18; באותה מידה 12^5 mod 23=18. למשל 13² mod 23=8 ו־8² mod 23=18. המחזור של 3 הוא 11, ובחירת מעריכים שקולים נותנת אותו סוד.</p>\n<h4>כיצד שני צדדים מחשבים סוד בלי לשלוח אותו</h4>\n<p>בדיפי־הלמן הצדדים מסכימים על קבוצה ועל בסיס פומבי מתאים. אליס בוחרת מעריך סודי a, מחשבת A=g^a ושולחת את A; בוב בוחר b ושולח B=g^b. כל החישובים נעשים בקבוצה שנבחרה, למשל מודולו מספר ראשוני. אליס מחשבת B^a ובוב מחשב A^b, ושני הביטויים שווים ל־g^(ab). הערכים a,b אינם נשלחים. לכן חילוף ערכים פומביים אינו שקול לשליחת המפתח הסימטרי עצמו בגלוי.</p>\n<p>בדוגמה חישובית יש לשמור היטב על תפקידי הבסיס והמעריך: g^a אינו a^g. אפשר לצמצם מודולו בכל כפל כדי להימנע ממספרים עצומים, ולבדוק את התוצאה משני הצדדים. הנחת הקושי הישירה היא שלא ניתן לחשב ביעילות את הסוד המשותף מתוך שני הערכים הפומביים בפרמטרים מתאימים. בעיית הלוגריתם הדיסקרטי מסבירה מדוע קשה לחלץ את המעריכים, אך אין צורך לטעון שכל מושגי הקושי שקולים מתמטית בכל קבוצה. בפרוטוקול שימושי מעבירים את הסוד דרך פונקציית גזירת מפתחות הקושרת גם הקשר. המספרים הזעירים שמופיעים בתרגיל ניתנים לחיפוש ידני ולכן מדגימים רק נכונות חשבונית, לא רמת אבטחה מעשית.</p>\n<h4>תוקף פעיל ובדיקת ערכי הפרוטוקול</h4>\n<p>הסכמה על סוד אינה זהה לאימות האדם שבצד השני. כאשר החלפת דיפי־הלמן רגילה אינה מאומתת, תוקף יכול להחליף את שני הערכים הפומביים וליצור סוד אחד מול אליס וסוד אחר מול בוב. הוא מפענח הודעות בצד אחד ומצפין אותן מחדש לצד האחר. לכן העובדה שאליס הצליחה להצפין אינה מוכיחה שבוב הוא היודע את המפתח השני. יש לקשור את חילוף הערכים לזהויות באמצעות חתימות, סוד קיים או פרוטוקול מאומת מתאים.</p>\n<p>בנוסף צריך לבדוק את הערכים שמתקבלים, ולא רק את זהות השולח. אם ערך כמו 1 מתקבל ללא בדיקה, העלאתו בכל מעריך נותנת 1, והתוקף יודע את תוצאת ההסכמה בלי ללמוד את המעריך הפרטי. בקבוצות מסוימות קיימים גם ערכים מסדר קטן שמצמצמים את מרחב הסודות האפשריים. הצפנת הודעה בדרך אינה מתקנת בהכרח בעיית תחום כזאת, מפני שכל אחד יכול להצפין לנמען במפתחו הפומבי. הניתוח צריך אפוא להפריד בין סודיות ערכי הביניים, תקפותם המתמטית ואימות ההקשר. בפרוטוקול שלם בודקים שייכות לקבוצה או לתת־חבורה הנדרשת, דוחים ערכים אסורים ומאמתים שהצד השני אכן מחזיק במפתח שנגזר. אין להניח שכל הפרטים האלה מתקיימים רק מפני שהופיע השם DH.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04122022_0 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q036.html"},{"id":"Q037","year":"2023","stem":"איזו מבין הטכניקות הבאות בשימוש בביצוע הרעלת DNS?","options":["IP spoofing","SYN flooding","XSS","SQL injection"],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":1},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.326,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-07-01\" data-doc=\"original-07\" data-body-words=\"377\"><h3>שאלה 1 — איזו טכניקה משמשת להרעלת DNS?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> IP spoofing מאפשר להציג תשובה כאילו הגיעה מהשרת הצפוי. עדיין נדרשים התאמת שאילתה, מזהה, פורט ומרוץ לתשובה האמיתית. SYN flood, XSS ו־SQLi אינם מנגנון הרעלת DNS המתואר.</p>\n<h4>התאמת תשובת DNS לשאילתה והזדמנות הזיוף</h4>\n<p>resolver הוא רכיב המבקש תשובה לשם דומיין ושומר תוצאות לזמן מוגבל במטמון. כאשר פרוטוקול התשובה אינו מאומת קריפטוגרפית, רכיב המקבל צריך להחליט אם חבילה באמת שייכת לבקשה פתוחה. בין הנתונים הנבדקים נמצאים המזהה, שם השאילתה, השרת המצופה ופורט המקור של הבקשה. תוקף יכול לזייף מקור של תשובה ולנסות לפגוע בניחוש הערכים הדרושים לפני שמגיעה התשובה האמיתית. כניסה של ערך כוזב למטמון עלולה להשפיע גם על לקוחות נוספים המשתמשים בו.</p>\n<p>תוקף הנמצא בנתיב רואה יותר מידע מתוקף מרוחק שאינו רואה את הבקשה, אך אין פירוש הדבר שרק הראשון יכול לתקוף. אם המרחב לניחוש קטן והתוקף מקבל מספיק הזדמנויות, קיימת גם מתקפת off-path. מזהה אחיד בן שש עשרה סיביות נותן שישים וחמישה אלף וחמש מאות שלושים ושישה ערכים אפשריים; פורט אקראי עצמאי מוסיף אי־ודאות רק אם אינו ידוע לתוקף. חשוב להפריד בין סיכוי בניסיון בודד לבין סיכוי מצטבר לאורך ניסיונות חוזרים. מדיניות שמבטלת שאילתה אחרי תגובות שגויות עלולה למנוע גם את קבלת התשובה הנכונה וליצור מניעת שירות. הוספת זיהוי התקפה אינה שקולה לאימות התשובה, וגם התרעה אינה חסימה.</p>\n<h4>מיפוי כתובות ברשת מקומית</h4>\n<p>ARP מאפשר למחשב ברשת מקומית ללמוד איזו כתובת MAC משמשת יעד מסוים בעל כתובת IP. המחשב זקוק למיפוי כדי לשלוח מסגרת בקישור המקומי, למשל אל שער ברירת המחדל. בפרוטוקול הבסיסי אין חתימה המאמתת שכל הודעת מיפוי אכן נשלחה מבעל הכתובת. תוקף מקומי יכול לנצל זאת ולגרום לקורבן לשמור מיפוי שגוי, כך שמסגרות יגיעו אליו במקום ליעד המקורי. אם הוא מעביר אותן הלאה, הוא עשוי להשיג תיווך בתעבורה בלי לנתק אותה מיד.</p>\n<p>אין צורך שהתוקף כבר יהיה MitM כדי להתחיל הרעלת ARP; לעיתים ההרעלה היא הדרך שבה הוא משיג יכולת זו. עם זאת, הודעות ARP רגילות מוגבלות למקטע הקישור ואינן כלי שמאפשר לכל מחשב מרוחק באינטרנט לשנות טבלה מקומית דרך נתבים. מיפויים סטטיים או בדיקות מתג מתאימות יכולים לצמצם את הסיכון, ואין צורך לבטל כל שימוש בכתובות MAC. מצד שני, כתובת MAC עצמה אינה סוד ואינה הוכחת זהות קריפטוגרפית. גם תוקף ששולט בנתיב אינו מקבל אוטומטית מפתחות TLS תקינים. יש להפריד בין הסבת חבילות ברשת לבין שבירת הגנות שכבות גבוהות, ובין כתובת חומרה המשמשת למשלוח מסגרות לבין הרשאה לבצע פעולה רגישה בממשק אינטרנטי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_07072023_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q037.html"},{"id":"Q038","year":"2023","stem":"איזה מנגנון מאפשר לשרת להגיד לדפדפן אלו משאבים מותר לדפדפן לטעון/להריץ בהקשר של העמוד הנוכחי?","options":["CSP","HSTS","CT","NMAP"],"note":"לפנים משורת הדין, בשאלה זו התקבל גם סעיף ב","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":2},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":2}],"flags":["note"],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.094,"exam_count":1,"in_sample_exam":false,"variant_group":"V07","accepted_indices":[0,1],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-07-02\" data-doc=\"original-07\" data-body-words=\"371\"><h3>שאלה 2 — איזה מנגנון מגדיר לדפדפן משאבים המותרים לטעינה/הרצה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> CSP, באמצעות מדיניות כגון script-src ו־default-src. HSTS כופה שימוש ב־HTTPS ואינו מגדיר את כלל מקורות הסקריפטים והמשאבים. בגרסה המסומנת נכתב שגם ב התקבל, אך יש להבחין בין מדיניות מקורות כללית לבין כפיית תעבורה מוצפנת.</p>\n<h4>מדיניות שהשרת מבקש מהדפדפן לאכוף</h4>\n<p>CSP היא מדיניות אבטחת תוכן שהשרת מוסר לדפדפן, בדרך כלל בכותרת תגובה. המדיניות יכולה להגדיר מאילו מקורות מותר לטעון ולהריץ סוגי משאבים מסוימים. כך אפשר לצמצם נזק של הזרקה, למשל למנוע הרצת סקריפט שלא עומד במדיניות script-src. ההחלטה נוגעת לפירוש תוכן בדפדפן, ולא להצפנת מנות הרשת או לאימות כל משתמש במערכת.</p>\n<p>אפשר להגדיר מדיניות לפי מקורות מורשים או באמצעות מאפיינים כמו nonce אקראי לסקריפטים שאושרו לתגובה מסוימת. יש להיזהר ממדיניות מתירנית שמאפשרת בפועל גם את המשאב הזדוני, ולכן עצם קיומה של כותרת אינו הוכחה שכל XSS נחסמת. CSP משלימה קידוד פלט ובניית DOM בטוחה ולא מחליפה אותם. HSTS, לעומתה, עוסקת בכפיית שימוש ב־HTTPS עבור אתר שהדפדפן מכיר את מדיניותו, ולא ברשימת מקורות כללית של קוד ותמונות. CT עוסקת בתיעוד הנפקות תעודות, ו־nmap הוא כלי למיפוי רשת. כשנוסח השאלה שואל ״מה מותר לטעון או להריץ בהקשר הדף״, צריך לקשור את המילים האלה למנגנון אכיפת תוכן. אין להחליף אותו בכל מנגנון שיכול להשפיע בעקיפין על גלישה, כי הבחנה בין מטרות המנגנונים היא בדיוק מה שהחלופות בודקות.</p>\n<h4>כיצד נתון הופך לקוד בדפדפן</h4>\n<p>בחולשת XSS יישום משלב מידע בשליטת תוקף בהקשר שבו הדפדפן מפרש אותו כתוכן פעיל. ב־stored XSS המידע נשמר באתר ומוצג לאחרים; ב־reflected XSS הוא מוחזר בעקבות בקשה; ב־DOM XSS קוד צד לקוח מעביר מידע לא מהימן ליעד מסוכן בדפדפן. המשותף הוא שבירת הגבול בין מידע לבין הוראות ביצוע. אין הכרח שתהיה חולשה במימוש הדפדפן: בדרך כלל הוא פשוט מריץ את מה שהאתר סיפק לו.</p>\n<p>הסקריפט רץ בהקשר המקור של האתר הפגיע, ולכן עשוי לקרוא מידע בעמוד, לשנות תצוגה וליזום פעולות בהרשאות המשתמש. גניבת cookies היא אפשרות אחת, ולא ההגדרה היחידה של ההתקפה. גם משתמש לא מזוהה יכול להיפגע משינוי תוכן או מהפניה זדונית. אם cookie מוגדר HttpOnly, קריאתו הישירה נחסמת, אך הסקריפט עדיין עשוי לבצע בקשות שהדפדפן יצרף להן אותו. ההגנה המרכזית היא טיפול נכון במידע לפי ההקשר, כגון קידוד פלט ופעולות DOM בטוחות; מדיניות CSP היא שכבה נוספת. אין לטעון שהפעלת HTTPS או עצם קיומו של SOP מונעות XSS, מפני שהקוד הזדוני מגיע כאן מתוך ההקשר שהלקוח ממילא סומך עליו.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_07072023_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q038.html"},{"id":"Q039","year":"2023","stem":"איזה מהאלגוריתמים הבאים הינו אלגוריתם הצפנה (ופענוח) סימטרי?","options":["DES","RSA","Hellman-Diffie","SHA256"],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":3},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.26,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-07-03\" data-doc=\"original-07\" data-body-words=\"381\"><h3>שאלה 3 — איזה אלגוריתם הוא הצפנה סימטרית?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> DES משתמש באותו סוד להצפנה ולפענוח. RSA הוא אסימטרי, DH הוא הסכמה על מפתח, ו־SHA-256 הוא hash. זיהוי סוג האלגוריתם אינו המלצה להשתמש ב־DES לצורך אבטחה חדשה.</p>\n<h4>פעולת הצפנה סימטרית והמשמעות של בלוקים</h4>\n<p>בהצפנה סימטרית אותו סוד מאפשר לבצע הצפנה ופענוח, גם אם פעולות האלגוריתם בשני הכיוונים שונות. יש לספק את הסוד לשני הצדדים בלי שהתוקף ילמד אותו. צופן בלוקים פועל על בלוק בעל אורך קבוע; עבור מפתח נתון הוא תמורה הפיכה על כל הבלוקים האפשריים. משמעות ההפיכות היא ששני קלטים שונים אינם יכולים להפיק אותו פלט תחת אותו מפתח. לעומת זאת, שני מופעים של אותו קלט אכן מפיקים אותו פלט אם אין מידע נוסף שמשנה את החישוב.</p>\n<p>כדי להצפין הודעה ארוכה משתמשים במצב פעולה שמגדיר כיצד לחלקה לבלוקים וכיצד לקשר את החישובים. לכן בטיחות צופן בסיסי כמו AES אינה מבטיחה בטיחות לכל נוסחה שמרכיבים ממנו. ערך התחלתי אקראי מועיל רק אם אופן שילובו מסתיר את המבנה הרצוי; אם אפשר לבטל אותו בחישוב פומבי, עצם נוכחותו אינה מונעת דליפה. בבדיקת מצב פעולה כדאי לכתוב את המשוואות עבור שני בלוקים ולבדוק מה מאזין יכול לחשב מהפלטים. למשל שוויון בין בלוקים עשוי לחשוף תבנית בתמונה או שדות חוזרים במסמך גם כאשר התוכן המדויק נשאר נסתר. יש לבדוק בנפרד גם שלמות, כי מצב הצפנה שאינו כולל אימות עשוי לאפשר שינויים שלא יתגלו.</p>\n<h4>מפתחות פומביים לעומת מפתחות סודיים</h4>\n<p>בקריפטוגרפיית מפתח פומבי לכל משתתף זוג מפתחות מקושרים: מפתח פומבי שמותר להפיץ ומפתח פרטי שרק בעליו אמור להחזיק. בהצפנה לנמען משתמשים במפתח הפומבי של הנמען, מפני שהפענוח דורש את המפתח הפרטי התואם. לכן אפשר לפרסם את מפתח בוב ועדיין לשמור הודעות המיועדות אליו בסוד. המפתח הפומבי אינו סיסמה שיש להעביר בערוץ נסתר; השאלה העיקרית בהפצתו היא כיצד יודעים שזהו באמת המפתח של בוב ולא מפתח של מתחזה.</p>\n<p>יש להבחין בין מאזין פסיבי לבין תוקף פעיל. מאזין רואה את הערכים שעוברים אך אינו משנה אותם; תוקף פעיל יכול להחליף מפתחות, לפתוח חיבורים ולשלוח הודעות משלו. פרוטוקול שעובד נגד הראשון עלול להיכשל נגד השני אם אין אימות זהות. תעודה חתומה או מפתח שנלמד מראש בערוץ אמין מספקים בסיס לשיוך הזהות, אך עדיין צריך להשתמש במפתח בתפקיד הנכון. דוגמה מעשית היא שליחת מפתח סימטרי אקראי בהצפנה לבוב ואז שימוש בו לקובץ גדול. מותר לכל אדם להצפין לבוב; עצם היכולת הזאת אינה מזהה את השולח כאליס. כדי לזהות אותה נדרשת גם הוכחה המתבססת על סוד שלה, למשל חתימה דיגיטלית.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_07072023_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q039.html"},{"id":"Q040","year":"2023","stem":"איזו מהטענות הבאות אינה נכונה?","options":["Metasploit הינו חומת אש אפליקטיבית.","סריקת כתובות IP ופורטים פתוחים היא טכניקה המאפשרת השתלטות על מחשבים וגיוסם כבוטים.","בעזרת סריקת כתובות IP אפשר לאסוף מידע על הקורבנות.","חומת אש יכולה להיות מותקנת על מכשירי קצה (של לקוחות) או על שרתים או על רכיבי תקשורת מרכזיים."],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":4},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.221,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-07-04\" data-doc=\"original-07\" data-body-words=\"391\"><h3>שאלה 4 — איזו טענה על Metasploit וסריקה שגויה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> Metasploit הוא מסגרת בדיקת חדירות וניצול חולשות, ולא חומת אש אפליקטיבית. סריקת כתובות/פורטים אוספת מידע ומסייעת לאתר מטרות; הסריקה לבדה אינה השתלטות אוטומטית או גיוס בוט ללא חולשה/אמצעי חדירה נוסף.</p>\n<h4>סריקה, ניצול חולשה ואכיפת הגנה</h4>\n<p>סריקת רשת היא איסוף מידע על כתובות, פורטים ושירותים שנענים. השירות שמאזין עשוי לחשוף גרסה או מאפיין שימושי לבדיקה נוספת. כלי סריקה יכול לעזור למנהל למפות את המערכת ולתוקף לבחור מטרות, אבל גילוי פורט פתוח אינו הוכחה שניתן להשתלט על המחשב. נדרש שלב נוסף, כגון ניצול חולשה מתאימה או שימוש בהרשאות שנחשפו. זו ההבחנה בין מציאת משטח תקיפה לבין הצלחת חדירה.</p>\n<p>מסגרת כמו Metasploit מסייעת בארגון ובביצוע בדיקות ניצול, ואינה מסנן חבילות או WAF רק מפני שמשתמשים בה בתחום האבטחה. חומת אש מפעילה מדיניות על תעבורה; IDS מחפש התנהגות חשודה; סורק ומסגרת ניצול בודקים מטרות בדרכים אחרות. לפעמים מוצר אחד כולל כמה רכיבים, אך אין בכך שינוי בהגדרה של כל תפקיד. גם מיקום התקנה שונה אינו משנה זאת: הגנות יכולות לרוץ בתחנת קצה, בשרת או ברכיב מרכזי. תהליך תקיפה היוצר botnet עשוי להתחיל בסריקה, להמשיך בניצול ולהסתיים בהפעלת מחשבים רבים לצורך DDoS או שימוש אחר. יש להבין את רצף הפעולות ולא לדלג מן המילה ״סריקה״ לטענה שכל מחשב שנסרק כבר הפך לבוט. ההבחנה מאפשרת לפסול ניסוחים רחבים מדי גם כשכיוון הטענה הכללי מוכר.</p>\n<h4>סינון חבילות, מדיניות ומצב חיבורים</h4>\n<p>חומת אש בוחנת תעבורה העוברת דרכה ומחליטה לאשר או לדחות לפי כללים. מסנן חבילות יכול להשתמש בכיוון התעבורה, כתובות מקור ויעד, פורטים ופרוטוקול. כללי allowlist מאפשרים רק את התעבורה שהוגדרה ומשאירים כלל דחייה כברירת מחדל. עם זאת, מספר פורט אינו הוכחה לזהות יישום: תוקף יכול לנסות לשלוח חיבור מפורט שבחר, ושירות יכול לרוץ בפורט שאינו המקובל שלו. לכן צריך לקרוא את תנאי הכלל ממש, ולא את כוונת האדם שכתב אותו.</p>\n<p>חומת אש שמנהלת מצב יכולה לבדוק אם חבילה היא חלק מחיבור שכבר נפתח ואושר. מסנן חסר מצב שמאפשר תשובות רק בגלל פורט מקור מוכר עלול לאפשר גם התחלת חיבור זדוני הנראית כך. סינון דגלים משפר דיוק במקרים מסוימים, אך אינו תחליף מלא למעקב מצב ולאימות יישומי. יש גם גבול טופולוגי: חומת אש בגבול הרשת אינה רואה בהכרח חבילות ששני מחשבים פנימיים מחליפים ישירות. בדומה לכך, בלי בדיקת תוכן יישום אין להניח שהיא מזהה קוד זדוני בתוך אימייל. סינון מקורות חשודים יכול לצמצם זיוף כתובות, אבל אינו הופך כל כתובת מקור לזהות אמינה. לכל כלל צריך לבנות גם מסלול הלוך וגם מסלול חזור ולבדוק אם שניהם עוברים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_07072023_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q040.html"},{"id":"Q041","year":"2023","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["ב syn-flood תוקף יעדיף כתובת IP מזוייפות כ source ובעיקר כאלו שלא יענו, כדי, בין השאר, לשפר את הסיכוי שישלח בחזרה RST על ה syn+ack","IDS אינו מונע התקפות DNS poisoning","תוקף בעל יכולות eavesdropping בין קורבן לשרת ה DNS שאליו פנה לא תמיד יצליח בהתקפת DNS poisoning","על מנת לבצע ARP poisoning, התוקף אינו זקוק ליכולת MITM"],"note":"","sources":[{"file":"2023/689156_07072023_0 (5).pdf","date":"07/07/2023","num":5},{"file":"2023/689156_07072023_0 (6).pdf","date":"07/07/2023","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.371,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-07-05\" data-doc=\"original-07\" data-body-words=\"441\"><h3>שאלה 5 — SYN flood, IDS ו־ARP — הטענה השגויה</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> בסעיף א נטען שמקורות שלא יענו נבחרים כדי להגדיל חזרת RST; זה הפוך. התוקף רוצה למנוע RST שהיה מבטל את המצב החצי פתוח. IDS אינו מונע כשלעצמו DNS poisoning, והאזנה אינה מבטיחה הצלחה. הרעלת DNS יכולה להתבצע גם בידי תוקף מחוץ לנתיב שמזייף תשובות ומנחש מזהים ופורט, בתנאי שהתשובה מתקבלת לפני התשובה האמיתית ובכפוף לבדיקות המקבל. אין הכרח ב־MitM. הרעלת ARP יכולה להתחיל בלי האזנה/שליטה בנתיב, אך בדרך כלל דורשת גישה למקטע הקישור המקומי; ״off-path״ אינו פירושו תוקף אינטרנט מרוחק היכול להעביר ARP דרך נתבים.</p>\n<h4>לחיצת היד של TCP והמשמעות של RST</h4>\n<p>בחיבור TCP רגיל הלקוח שולח SYN, השרת מחזיר SYN+ACK, והלקוח משלים ACK. במימוש ששומר מצב כבר אחרי ההודעה הראשונה, כל ניסיון התחלה יכול לתפוס מקום גם לפני שנבדק שהמקור באמת מסוגל לקבל תשובה. SYN flood מנצלת זאת באמצעות הרבה ניסיונות שאינם מושלמים. אם כתובת המקור מזויפת, התשובה הולכת למחשב אחר ולא לתוקף, ולכן צריך לבחון מה אותו מחשב יעשה כשיקבל הודעה שלא ציפה לה.</p>\n<p>מחשב חי עשוי להחזיר RST עבור חיבור שאינו מכיר. הודעה זו יכולה לגרום לשרת לשחרר את המצב החצי פתוח, ולכן מבחינת התוקף זו תוצאה לא רצויה. בחירת מקורות שאינם משיבים מצמצמת את האפשרות הזו. מנגד, כאשר השרת משתמש ב־SYN cookies, הוא מקודד מידע מתאים במספר הרצף של תשובתו ואינו חייב לשמור את כל מצב החיבור מיד. רק ACK תקין מאפשר לשחזר ולאשר את המידע. המנגנון מצמצם סוג מסוים של התשת מצב, אך אינו מבטיח חסינות מהצפת רוחב פס או מכל תקיפת יישום. אין גם קשר בין המילה cookies כאן לבין cookie הזדהות של דפדפן. אלה עצמים שונים לגמרי, ולכן SYN cookies אינם הגנת CSRF ואינם בדיקת הרשאות של משתמש באתר.</p>\n<h4>ההבדל בין גילוי, מניעה והוכחת תקינות</h4>\n<p>IDS מיועד לניטור ולזיהוי התנהגות חשודה. הוא עשוי לנתח תבניות מוכרות, חריגות בתעבורה או אירועים במחשב, ולהתריע למפעיל. מתן התרעה אינו כשלעצמו עצירת החבילה או ביטול הפעולה שכבר נעשתה. IPS מוסיף יכולת תגובה פעילה, למשל חסימת תעבורה העוברת דרכו. לכן שימוש במילה ״מונע״ לגבי IDS טהור מחליף משימה אחת באחרת. אפשר לבנות מערכת שבה התרעות מפעילות כלים נוספים, אך אז צריך לתאר במפורש את שרשרת התגובה ולא לייחס אותה לשם IDS לבדו.</p>\n<p>גם מנגנון חוסם אינו נותן הבטחה גורפת שכל תקיפה תיעצר. כלל זיהוי עשוי להחמיץ התקפה חדשה או לסווג פעילות רגילה כחשודה. לדוגמה, שרת גיבוי יכול לייצר נפח גדול בלי להיות תוקף, בעוד שניחוש מזהי DNS יכול להיראות כחבילות קצרות רגילות. ההגנה הישירה צריכה להימצא גם בפרוטוקול או בקוד: אימות נתונים, הפרדת תחביר מנתונים, בדיקת הרשאות ועדכון רכיבים פגיעים. סריקה בכלי כמו nmap עוזרת לגלות שירותים וממצאים אפשריים, אבל אינה מוכיחה שהמערכת בטוחה אחרי שהסריקה הסתיימה. בניתוח כל חלופה יש לשאול אם היא מתארת תצפית, אכיפת מדיניות או תכונת בטיחות; אלה תפקידים משלימים שאינם מילים נרדפות.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_07072023_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q041.html"},{"id":"Q042","year":"2023","stem":"אילו מהטענות הבאות נכונה?","options":["כיום, אחת השיטות הנפוצות לכרות ביטקו
