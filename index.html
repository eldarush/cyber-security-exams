<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Suez+One&display=swap">
<style>
/* Layout: answer-sheet metaphor — question on the main column, a "דף קידוד" bubble grid beside it; tabs on top. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f8f9fc; --ink:#141a26; --muted:#5b6474; --faint:#8a93a3;
  --line:#dde2ea; --accent:#2b4fd8; --accent-ink:#ffffff; --accent-soft:#e7ecfd;
  --good:#1e8a4c; --good-soft:#e3f4ea; --bad:#c4372c; --bad-soft:#fbe8e6; --warn:#a96a12;
  --bar:#2a78d6; --code:#eef1f6;
  --f-body:"IBM Plex Sans Hebrew","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --f-display:"Suez One","IBM Plex Sans Hebrew",Georgia,serif;
  --f-mono:"IBM Plex Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#161b24; --surface-2:#1b212c; --ink:#e7ebf2; --muted:#9ba5b6; --faint:#6f7a8c;
  --line:#2a313d; --accent:#7f9bff; --accent-ink:#0e1218; --accent-soft:#1e274a;
  --good:#47c17e; --good-soft:#15301f; --bad:#ff7466; --bad-soft:#3a1a17; --warn:#e2a548;
  --bar:#3987e5; --code:#1f2632; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#161b24; --surface-2:#1b212c; --ink:#e7ebf2; --muted:#9ba5b6; --faint:#6f7a8c;
  --line:#2a313d; --accent:#7f9bff; --accent-ink:#0e1218; --accent-soft:#1e274a;
  --good:#47c17e; --good-soft:#15301f; --bad:#ff7466; --bad-soft:#3a1a17; --warn:#e2a548;
  --bar:#3987e5; --code:#1f2632; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.2px;white-space:nowrap}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-inline-start:8px;font-weight:500}
nav.tabs{display:flex;gap:4px;margin-inline-start:auto;align-items:center}
nav.tabs button{border:0;background:none;padding:7px 14px;border-radius:8px;color:var(--muted);font-weight:600;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs a.tab-link{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-size:14px;transition:background .15s,color .15s}
nav.tabs a.tab-link:hover{background:var(--surface-2);color:var(--ink)}
main{padding-block:24px 64px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:20px} h3{font-size:16px}
.sub{color:var(--muted);margin:4px 0 0}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:18px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip .n{color:var(--faint);font-family:var(--f-mono);font-size:12px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"] .n{color:var(--accent)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
label.field{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input[type=number],input[type=text],input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=number]{width:90px}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);cursor:pointer;text-align:start;display:grid;gap:4px}
.mode b{font-size:15px}
.mode span{font-size:13px;color:var(--muted);line-height:1.5}
.mode[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode[aria-checked="true"] b{color:var(--accent)}
.group{display:grid;gap:8px}
.group .chips{display:flex;flex-wrap:wrap;gap:6px}
.summary{position:sticky;top:76px;display:grid;gap:14px}
.big{font-family:var(--f-display);font-size:44px;line-height:1}
.summary .big small{font-family:var(--f-body);font-size:14px;color:var(--muted);margin-inline-start:6px}

/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
.exambar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:4;background:var(--bg);padding-block:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.timer{font-family:var(--f-mono);font-size:18px;font-weight:500;padding:3px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.progress{flex:1;min-width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qnum{font-weight:700;font-size:17px}
.stem{font-size:16px;line-height:1.75}
.stem .ln,.opt .ln{margin:1px 0}
.ln[dir=ltr]{text-align:right}
pre{direction:ltr;text-align:left;background:var(--code);border-radius:8px;padding:10px 12px;font:13px/1.55 var(--f-mono);overflow-x:auto;white-space:pre;margin:8px 0}
code{font:13.5px var(--f-mono);background:var(--code);padding:1px 5px;border-radius:4px}
.tbl{overflow-x:auto;margin:8px 0}
.tbl table{border-collapse:collapse;font-size:13.5px}
.tbl td,.tbl th{border:1px solid var(--line);padding:4px 9px;text-align:center}
.tbl th{background:var(--surface-2)}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;line-height:1.6}
.opt:hover{border-color:var(--faint)}
.opt .t{flex:1;min-width:0}
.bub{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .bub{background:var(--good);border-color:var(--good);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.mark{font-size:12px;font-weight:700;margin-inline-start:auto;white-space:nowrap}
.mark.okm{color:var(--good)} .mark.badm{color:var(--bad)}
.qnav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.feedback{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:14px}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.meta-line{color:var(--muted);font-size:12.5px;margin-top:10px}

/* answer sheet */
.sheet{position:sticky;top:130px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;max-height:calc(100vh - 150px);overflow:auto}
.sheet h3{font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between}
.srow{display:grid;grid-template-columns:30px repeat(4,22px) 14px;gap:6px;align-items:center;padding:3px 4px;border-radius:6px}
.srow.cur{background:var(--accent-soft)}
.srow .sn{font-family:var(--f-mono);font-size:12px;color:var(--muted);cursor:pointer;background:none;border:0;padding:0;text-align:start}
.sb{width:22px;height:22px;border-radius:50%;border:1.3px solid var(--faint);background:none;cursor:pointer;font-size:10px;color:var(--faint);padding:0;display:grid;place-items:center}
.sb.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.sb.ok{background:var(--good);border-color:var(--good);color:#fff}
.sb.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.flag{font-size:11px;color:var(--warn)}
.legend{font-size:12px;color:var(--muted);margin-top:8px;display:grid;gap:2px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,22,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal .panel{max-width:420px;width:100%;display:grid;gap:14px}

/* results */
.result-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.score{font-family:var(--f-display);font-size:72px;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-family:var(--f-display);font-size:28px;line-height:1.1}
.kpi .k{font-size:13px;color:var(--muted)}
.review-item{border-top:1px solid var(--line);padding-block:16px}
.review-item .opt{cursor:default}

/* charts */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:14px;position:relative}
.bar .fill{position:absolute;inset-block:0;right:0;background:var(--bar);border-radius:4px 0 0 4px;min-width:2px}
.bar .val{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:left}
.heat{border-collapse:separate;border-spacing:2px;font-size:12.5px;min-width:520px;width:100%}
.heat th{font-weight:600;color:var(--muted);padding:4px 6px;text-align:center}
.heat th.rowh{text-align:start;color:var(--ink);font-weight:500;white-space:nowrap}
.heat td{width:72px;height:32px;text-align:center;border-radius:4px;font-family:var(--f-mono)}
.tip{position:fixed;z-index:30;background:var(--ink);color:var(--surface);font-size:12.5px;padding:6px 9px;border-radius:6px;pointer-events:none;max-width:260px;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.list{display:grid;gap:10px;align-content:start}
.li{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface);font-size:14px;display:grid;gap:4px}
.li .m{font-size:12.5px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
.terms{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.terms span{font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 5px}

/* bank */
.bankq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.bankq .opt{padding:6px 10px;border-width:1px}
.bankq .opts{gap:5px;margin-top:10px}

/* print view */
.printdoc .ver{break-before:page}
.printdoc .ver:first-child{break-before:auto}
.pq{break-inside:avoid;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px;background:var(--surface)}
.pq ol{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px}
.pq li{display:flex;gap:10px}
.keytbl{border-collapse:collapse;font-size:13px;width:100%}
.keytbl td,.keytbl th{border:1px solid var(--line);padding:4px 8px;text-align:center}
.empty{color:var(--muted);text-align:center;padding:40px 10px}

@media (max-width:860px){
  .setup,.exam{grid-template-columns:minmax(0,1fr)}
  .summary,.sheet{position:static;max-height:none}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .modes{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:minmax(0,1fr) 54px}
  .bar .lbl{grid-column:1/-1}
  .result-head{grid-template-columns:minmax(0,1fr)}
  nav.tabs{margin-inline-start:0;width:100%}
  .exambar{position:static}
  .qcard{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff;color:#000}
  body::before,.top,.noprint{display:none!important}
  main{padding:0}
  .pq{border-color:#999;background:#fff}
  @page{margin:14mm}
}
</style>

:["07/10/2022","04/12/2022"],"questions":["Q002","Q028"]},{"text":"שימוש ב x-frame-options אינו מיועד להגנה מפני sql injection.","exams":2,"dates":["06/11/2022","24/11/2024"],"questions":["Q022","Q102"]},{"text":"שרת אינטרנט מייצר ניגש ל Root CA ומבקש ממנו לחתום על המפתח הפומבי של שרת האינטרנט","exams":2,"dates":["06/11/2022","20/10/2024"],"questions":["Q023","Q090"]},{"text":"תוקף בעל יכולות eavesdropping בין קורבן לשרת ה DNS שאליו פנה לא תמיד יצליח בהתקפת DNS poisoning","exams":2,"dates":["04/12/2022","07/07/2023"],"questions":["Q030","Q041"]}],"topics":{"הצפנה סימטרית וצפנים קלאסיים":{"count":17},"RSA, מפתח ציבורי וחתימות":{"count":18},"דיפי-הלמן והחלפת מפתחות":{"count":10},"Hash, MAC וסיסמאות":{"count":22},"PKI, תעודות, CT ו-OCSP":{"count":28},"TLS / HTTPS":{"count":12},"אבטחת Web":{"count":28},"רשתות: ARP, DNS, DoS ו-Firewall":{"count":23},"ביטקוין ובלוקצ׳יין":{"count":24}},"updated":"2026-11-14"},"questions":[{"id":"Q001","year":"2022","stem":"נתונה חומת אש על התעבורה הנכנסת אל רשת מסויימת ויוצאת מהרשת החוצה, כאשר חומת האש אינה עובדת בשכבת האפליקציה. איזו מבין ההתקפות הבאות חומת אש שכזו כן מגינה מפניה?","options":["התקפה המבצעת spoofing","התקפה המתבצעת ע״י אימייל המכיל קוד זדוני","התקפה המנצלת חולשה במימוש של חומת האש","התקפה בה התוקף נמצא בתוך הרשת והוא תוקף מחשב אחר ברשת"],"note":"","sources":[{"file":"2022/File_1_689156_07102022_0.pdf","date":"07/10/2022","num":1},{"file":"2022/__689156_07102022_0 מסודר_.pdf","date":"07/10/2022","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.185,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-05-05\" data-doc=\"original-05\" data-body-words=\"400\"><h3>שאלה 1 — חומת אש שאינה פועלת בשכבת היישום — מפני מה יכולה להגן?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> ניתן לסנן חבילות עם מקור שאינו מתאים לממשק/טווח הצפוי ולהקשות spoofing. אין פירוש הדבר שחומת אש עוצרת כל זיוף. היא אינה מנתחת תוכן אימייל כשאין בדיקת יישום, אינה מגינה אוטומטית על חולשת המימוש שלה, ולא רואה תעבורה פנימית שאינה עוברת דרכה.</p>\n<h4>סינון חבילות, מדיניות ומצב חיבורים</h4>\n<p>חומת אש בוחנת תעבורה העוברת דרכה ומחליטה לאשר או לדחות לפי כללים. מסנן חבילות יכול להשתמש בכיוון התעבורה, כתובות מקור ויעד, פורטים ופרוטוקול. כללי allowlist מאפשרים רק את התעבורה שהוגדרה ומשאירים כלל דחייה כברירת מחדל. עם זאת, מספר פורט אינו הוכחה לזהות יישום: תוקף יכול לנסות לשלוח חיבור מפורט שבחר, ושירות יכול לרוץ בפורט שאינו המקובל שלו. לכן צריך לקרוא את תנאי הכלל ממש, ולא את כוונת האדם שכתב אותו.</p>\n<p>חומת אש שמנהלת מצב יכולה לבדוק אם חבילה היא חלק מחיבור שכבר נפתח ואושר. מסנן חסר מצב שמאפשר תשובות רק בגלל פורט מקור מוכר עלול לאפשר גם התחלת חיבור זדוני הנראית כך. סינון דגלים משפר דיוק במקרים מסוימים, אך אינו תחליף מלא למעקב מצב ולאימות יישומי. יש גם גבול טופולוגי: חומת אש בגבול הרשת אינה רואה בהכרח חבילות ששני מחשבים פנימיים מחליפים ישירות. בדומה לכך, בלי בדיקת תוכן יישום אין להניח שהיא מזהה קוד זדוני בתוך אימייל. סינון מקורות חשודים יכול לצמצם זיוף כתובות, אבל אינו הופך כל כתובת מקור לזהות אמינה. לכל כלל צריך לבנות גם מסלול הלוך וגם מסלול חזור ולבדוק אם שניהם עוברים.</p>\n<h4>מיפוי כתובות ברשת מקומית</h4>\n<p>ARP מאפשר למחשב ברשת מקומית ללמוד איזו כתובת MAC משמשת יעד מסוים בעל כתובת IP. המחשב זקוק למיפוי כדי לשלוח מסגרת בקישור המקומי, למשל אל שער ברירת המחדל. בפרוטוקול הבסיסי אין חתימה המאמתת שכל הודעת מיפוי אכן נשלחה מבעל הכתובת. תוקף מקומי יכול לנצל זאת ולגרום לקורבן לשמור מיפוי שגוי, כך שמסגרות יגיעו אליו במקום ליעד המקורי. אם הוא מעביר אותן הלאה, הוא עשוי להשיג תיווך בתעבורה בלי לנתק אותה מיד.</p>\n<p>אין צורך שהתוקף כבר יהיה MitM כדי להתחיל הרעלת ARP; לעיתים ההרעלה היא הדרך שבה הוא משיג יכולת זו. עם זאת, הודעות ARP רגילות מוגבלות למקטע הקישור ואינן כלי שמאפשר לכל מחשב מרוחק באינטרנט לשנות טבלה מקומית דרך נתבים. מיפויים סטטיים או בדיקות מתג מתאימות יכולים לצמצם את הסיכון, ואין צורך לבטל כל שימוש בכתובות MAC. מצד שני, כתובת MAC עצמה אינה סוד ואינה הוכחת זהות קריפטוגרפית. גם תוקף ששולט בנתיב אינו מקבל אוטומטית מפתחות TLS תקינים. יש להפריד בין הסבת חבילות ברשת לבין שבירת הגנות שכבות גבוהות, ובין כתובת חומרה המשמשת למשלוח מסגרות לבין הרשאה לבצע פעולה רגישה בממשק אינטרנטי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"File_1_689156_07102022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q001.html"},{"id":"Q002","year":"2022","stem":"להלן טענות לגבי DoS. איזו מבין הטענות נכונה?","options":["התקפת slow loris מחזיקה הרבה חיבורי http פתוחים כמה זמן שהיא יכולה","מטרת התקפות Syn flood היא לפגוע בשרת המותקף על ידי העמסה על רוחב הפס שלו","ראשי התיבות DoS הן של התקפות Disk on Stack","התקפות DoS נעשות אך ורק בשכבה הפיזית, הלינק, התעבורה והרשת"],"note":"","sources":[{"file":"2022/File_1_689156_07102022_0.pdf","date":"07/10/2022","num":2},{"file":"2022/__689156_07102022_0 מסודר_.pdf","date":"07/10/2022","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.236,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-05-06\" data-doc=\"original-05\" data-body-words=\"383\"><h3>שאלה 2 — טענה נכונה על DoS</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> Slowloris מחזיקה חיבורי HTTP פתוחים ומקדמת אותם באיטיות כדי להתיש משאבי שרת. SYN flood הקלאסית מתישה מצב חיבור חצי פתוח, ולא מוגדרת דווקא כהתשת רוחב פס. יש DoS בשכבת היישום.</p>\n<h4>מניעת שירות היא פגיעה במשאב מוגבל</h4>\n<p>מטרת DoS היא להקשות על משתמשים לגיטימיים לקבל שירות. המשאב המותקף יכול להיות רוחב פס, זיכרון, מקום בטבלת חיבורים, זמן מעבד או משאב יישומי אחר. בהתקפה מבוזרת מקורות רבים פועלים יחד, למשל מחשבים נגועים ב־botnet, ולכן קשה יותר להסתפק בחסימת כתובת יחידה. אין הכרח שכל מקור יהיה מחשב אישי או שההתקפה תתרחש דווקא בשכבת הרשת; גם רכיבי תקשורת ומכשירי קצה יכולים להשתתף, וגם בקשות יישום יכולות להתיש שרת.</p>\n<p>Slowloris מדגימה שמתקפה אינה חייבת לשלוח כמות בתים עצומה. התוקף מחזיק בקשות HTTP לא שלמות ומתקדם באיטיות, כך שהשרת ממשיך להקצות להן משאבים. SYN flood פועלת בשלב אחר ומשתמשת במצב חיבור שטרם הושלם. ההבחנה קובעת מהי הגנה מועילה: הגבלת זמן לקבלת כותרות ומספר חיבורים מתאימה לבקשות איטיות, בעוד שמנגנון SYN cookies מטפל בהקצאת מצב מוקדמת בחיבור TCP. הגנה גורפת מדי יכולה לפגוע גם בלקוח איטי או בשירות גיבוי לגיטימי. לכן שיעור תעבורה גבוה הוא סימן לבדיקה ולא הוכחה לזדון, והסבר טוב צריך לזהות איזה משאב נשמר, באיזה שלב הוא מוקצה, וכיצד התוקף גורם לו להישאר תפוס.</p>\n<h4>לחיצת היד של TCP והמשמעות של RST</h4>\n<p>בחיבור TCP רגיל הלקוח שולח SYN, השרת מחזיר SYN+ACK, והלקוח משלים ACK. במימוש ששומר מצב כבר אחרי ההודעה הראשונה, כל ניסיון התחלה יכול לתפוס מקום גם לפני שנבדק שהמקור באמת מסוגל לקבל תשובה. SYN flood מנצלת זאת באמצעות הרבה ניסיונות שאינם מושלמים. אם כתובת המקור מזויפת, התשובה הולכת למחשב אחר ולא לתוקף, ולכן צריך לבחון מה אותו מחשב יעשה כשיקבל הודעה שלא ציפה לה.</p>\n<p>מחשב חי עשוי להחזיר RST עבור חיבור שאינו מכיר. הודעה זו יכולה לגרום לשרת לשחרר את המצב החצי פתוח, ולכן מבחינת התוקף זו תוצאה לא רצויה. בחירת מקורות שאינם משיבים מצמצמת את האפשרות הזו. מנגד, כאשר השרת משתמש ב־SYN cookies, הוא מקודד מידע מתאים במספר הרצף של תשובתו ואינו חייב לשמור את כל מצב החיבור מיד. רק ACK תקין מאפשר לשחזר ולאשר את המידע. המנגנון מצמצם סוג מסוים של התשת מצב, אך אינו מבטיח חסינות מהצפת רוחב פס או מכל תקיפת יישום. אין גם קשר בין המילה cookies כאן לבין cookie הזדהות של דפדפן. אלה עצמים שונים לגמרי, ולכן SYN cookies אינם הגנת CSRF ואינם בדיקת הרשאות של משתמש באתר.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"File_1_689156_07102022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q002.html"},{"id":"Q003","year":"2022","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["אם ימציאו חומרה היכולה לבצע את כל פעולות הקריפטוגרפיה באפס זמן (כלומר, שביצוע פעולות קריפטו לא \"עולה\" שום זמן), הורדת עמוד אינטרנט על גבי HTTPS יקח אותו משך זמן כמו הורדת אותו העמוד על גבי HTTP רגיל","בTLS, משתמשים במפתחות שונים להצפין תעבורה הנשלחת מהשרת ללקוח לעומת תעבורה הנשלחת מהלקוח לשרת","בTLS משתמשים בהצפנה סימטרית וגם בהצפנה א-סימטרית","בTLS לקוח הגולש לשרת foo.com מוודא את תקינות התעודה שקיבל כחלק מתהליך הקמת החיבור המוצפן"],"note":"","sources":[{"file":"2022/File_1_689156_07102022_0.pdf","date":"07/10/2022","num":3},{"file":"2022/__689156_07102022_0 מסודר_.pdf","date":"07/10/2022","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"TLS / HTTPS","topic_score":0.197,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-05-07\" data-doc=\"original-05\" data-body-words=\"387\"><h3>שאלה 3 — HTTPS עם קריפטוגרפיה באפס זמן — הטענה השגויה</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> גם אם זמן החישוב הקריפטוגרפי אפס, עדיין יש הודעות handshake, זמני RTT, תוספת בתים ועיבוד פרוטוקול. לכן אין הבטחה שזמן ההורדה יהיה זהה ל־HTTP. ההשוואה כאן היא להקמה מלאה לפי המודל הנלמד; חיבור ממוחזר או פרוטוקולים אחרים משנים את מדידת הזמנים.</p>\n<h4>מה מספק TLS ובאילו שכבות הוא פועל</h4>\n<p>TLS יוצר ערוץ מוצפן ומאומת מעל תעבורה שבפני עצמה יכולה להיות חשופה למאזין או לתוקף פעיל. תחילה הצדדים מסכימים על פרמטרים ומקימים חומר מפתח, ובתצורה הנפוצה השרת מוכיח זהות באמצעות תעודה ומפתח פרטי מתאים. אחר כך מידע היישום מוגן במפתחות סימטריים. הבחירה במנגנון סימטרי להעברת מידע רב נובעת מיעילותו; המנגנונים האסימטריים פותרים בעיקר את בעיית ההקמה והאימות בלי סוד משותף שהותקן מראש.</p>\n<p>יש להבדיל בין הגנת הערוץ לבין תקינות התוכנה שמשתמשת בו. TLS לא מונע מהיישום להפעיל שאילתת SQL מסוכנת, לשלב קוד תוקף בדף או לקבל בקשת פעולה שהמשתמש לא התכוון אליה. הוא גם אינו מעניק אוטומטית זהות לכל לקוח: בתצורות רבות רק השרת מציג תעודה והמשתמש מזדהה אחר כך בסיסמה או באמצעי יישומי. תוקף שולט ברשת יכול עדיין לחסום את החיבור ולגרום למניעת שירות, גם כשאינו יכול לקרוא או לשנות תוכן מאומת. בתשובה על המצגת יש לציין אם מדובר ב־TLS הישן עם RSA או במנגנון אחר, משום שפרטי החלפת המפתח וההודעות השתנו בין גרסאות. ערבוב כל הזרימות לתיאור יחיד עלול להוביל לתשובה שגויה.</p>\n<h4>מדוע תהליך ההקמה אינו מסתיים בשליחת סוד</h4>\n<p>תהליך הקמת חיבור צריך להבטיח לא רק ששני צדדים מחזיקים חומר מפתח, אלא שהם מסכימים על אותם פרמטרים ועל אותו רצף הודעות. הודעות הפתיחה מציעות ובוחרות גרסה ואלגוריתמים, ובהמשך מועברים חומרי החלפת מפתח ואימות. במודל הישן של המצגת, לאחר ClientKeyExchange עדיין יש שלבים נוספים לפני שניתן לראות את ההקמה כמוצלחת. הודעת Finished מאמתת ערך הנגזר מסודות החיבור ומתמליל ההקמה, ולכן בודקת גם שההודעות שהצדדים ראו תואמות.</p>\n<p>לדוגמה, תוקף עשוי לשנות רשימת אלגוריתמים בהודעה הראשונה בלי לשבור את התחביר. אם הלקוח כולל בחישוב את הנוסח המקורי והשרת את הנוסח ששונה, ערכי האימות בסיום אינם תואמים. זו סיבה לכך שאי אפשר להשמיט את אימות הסיום רק מפני שכבר הועבר סוד בצורה מוצפנת. גם אם החישובים הקריפטוגרפיים היו מהירים ללא עלות, ההודעות עצמן עדיין דורשות זמן משלוח ולעיתים סבבי רשת נוספים. חידוש חיבור יכול לקצר עבודה באמצעות מצב מוסכם מחיבור קודם, אך אינו מתיר לבטל את בדיקות הקבלה שלו. מזהה session אינו מפתח סודי ואינו הוכחה עצמאית לזהות; הוא מצביע על מצב שהצדדים כבר נדרשים להכיר ולאמת בהתאם לפרוטוקול.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"File_1_689156_07102022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q003.html"},{"id":"Q004","year":"2022","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["אחת מהדרכים להגן מפני התקפת cross-site request forgery היא בעזרת csrf token. הגנה זאת מבקשת מהמשתמש להזין ידנית קוד מיוחד לשדה הזנת טקסט ייעודי באתר","ב XSS מסוג DOM based החולשה נמצאת בקוד שרץ בצד הקליינט","התקפת cross-site request forgery בנויה על כך שהדפדפן מצרף cookies לבקשות","בהתקפת cross-site request forgery השרת אינו יודע שהבקשה אינה באמת של הקורבן"],"note":"","sources":[{"file":"2022/File_1_689156_07102022_0.pdf","date":"07/10/2022","num":4},{"file":"2022/__689156_07102022_0 מסודר_.pdf","date":"07/10/2022","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.263,"exam_count":1,"in_sample_exam":false,"variant_group":"V01","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-05-08\" data-doc=\"original-05\" data-body-words=\"389\"><h3>שאלה 4 — CSRF token — הטענה השגויה</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> CSRF token נמסר בדרך כלל אוטומטית בעמוד ונשלח חזרה בשדה נסתר/כותרת; אין דרישה שהמשתמש יקליד אותו ידנית. הוא בלתי צפוי לתוקף ומאומת בשרת. DOM XSS נובע מעיבוד פגיע בצד הלקוח; CSRF קלאסית מנצלת צירוף אוטומטי של אמצעי הזדהות.</p>\n<h4>מדוע בקשה תקינה יכולה לבטא רצון של תוקף</h4>\n<p>CSRF מנצלת מצב שבו הדפדפן מצרף אוטומטית אמצעי הזדהות לבקשה, והשרת מסתפק בכך כדי לבצע פעולה. התוקף אינו חייב לדעת את הסיסמה או לקרוא cookie: הוא יכול להביא את הקורבן לדף הגורם למשלוח בקשה לאתר האחר. השרת רואה הרשאות תקפות אך אינו יודע בהכרח שהפעולה נגרמה מבחוץ ולא מתוך ממשק שהמשתמש בחר להפעיל. גם אם התוקף אינו קורא את התשובה, שינוי כתובת דואר, העברת כסף או שינוי הגדרת נתב כבר עלולים להתבצע.</p>\n<p>token תקין הוא ערך בלתי צפוי הקשור להקשר המשתמש או הפעולה, שהאתר מוסיף לבקשה והשרת מאמת. אתר תוקף אינו אמור לדעת אותו רק מכוח היכולת ליצור טופס. לרוב המשתמש אינו מקליד את הערך: הוא נשמר בשדה נסתר או מועבר בכותרת בידי קוד האתר. בדיקות מקור בקשה ומדיניות cookies מתאימה יכולות להוסיף שכבות הגנה. לעומת זאת, קוד XSS באותו מקור עשוי לקרוא token או להפעיל את הממשק המורשה, ולכן הגנת CSRF אינה תחליף למניעת XSS. גם בחירת POST אינה מספקת לבדה; סוג הבקשה אינו הוכחת כוונה. יש לבדוק את הגורם שמאשר את הפעולה ולא להסתפק בזהות המחשב ששלח בפועל את החבילות.</p>\n<h4>מהו origin ואיך הדפדפן משתמש בו</h4>\n<p>origin של כתובת נקבע בעיקר לפי סכמת התקשורת, שם המארח והפורט. הנתיב בתוך האתר אינו רכיב שמפריד origins. לכן שתי תיקיות שונות באותו שרת אינן מקבלות בידוד אבטחה אוטומטי רק מפני שהן שייכות למשתמשים שונים. לעומת זאת, שינוי בין HTTP ל־HTTPS, שינוי של שם מארח או שימוש בפורט אחר יכול ליצור מקור אחר. כאשר פורט ברירת המחדל מושמט, משווים לערך ברירת המחדל המתאים ולא לטקסט הכתובת בלבד.</p>\n<p>Same Origin Policy נאכף בדפדפן ומגביל בין היתר קריאת מידע מגורם שמקורו שונה. הוא אינו מנגנון הרשאות של מסד הנתונים ואינו בדיקה שמחליפה אימות בצד השרת. חשוב במיוחד להבדיל בין יכולת לשלוח בקשה לבין יכולת לקרוא את תשובתה: במצבים רבים בקשה בין אתרים יכולה להישלח גם כשאסור לסקריפט לקרוא את התוכן החוזר. זהו הבסיס להבנת CSRF. אם תוכן פעיל לא מהימן מתארח באותו מקור עם תוכן רגיש, גבול ההפרדה כבר נחלש עוד לפני משלוח הבקשה. הפרדה נכונה עשויה לדרוש מארח נפרד או sandbox מוגדר כראוי; השמות ״אליס״ ו״בוב״ בנתיבים אינם מייצרים מדיניות זהות שהדפדפן מבין מעצמו.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"File_1_689156_07102022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q004.html"},{"id":"Q005","year":"2022","stem":"להלן טענות בהקשר של תהליך ה handshake של SSL/TLS. ביחרו את הטענה הלא נכונה.","options":["לאחר שהלקוח העביר לשרת את המפתח המשותף הסודי בצורה מאובטחת (ClientKeyExchange), ה handshake מסתיים והצדדים יכולים מיד להעביר את המידע בצורה מאובטחת","בתחילת ה handshake הלקוח מציע את האלגוריתמים שהוא תומך בהם לשרת ואת הגרסא המקס 'שהוא תומך בה","אם הלקוח רוצה handshake מקוצר, הוא שולח לשרת session id מחיבור קודם. אם השרת מסכים לhandshake מקוצר, הוא מחזיר את אותו session id שהלקוח שלח לו, אחרת, הוא שולח session id אחר","אם הלקוח רוצה handshake חדש הוא שולח לשרת session id שווה לאפס, אחרת, שולח session id מחיבור קודם. אם השרת מסכים לhandshake מקוצר, הוא מחזיר את אותו session id שהלקוח שלח לו, אחרת, הוא שולח session id אחר"],"note":"","sources":[{"file":"2022/File_1_689156_07102022_0.pdf","date":"07/10/2022","num":5},{"file":"2022/__689156_07102022_0 מסודר_.pdf","date":"07/10/2022","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"TLS / HTTPS","topic_score":0.359,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-05-09\" data-doc=\"original-05\" data-body-words=\"384\"><h3>שאלה 5 — האם TLS handshake מסתיים ב־ClientKeyExchange?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> לא. בזרימה הישנה נדרשים המשך גזירת מפתחות, ChangeCipherSpec ו־Finished מאומתים, ולעיתים הודעות אימות נוספות. Finished מאמת את transcript ומאשר החזקת מפתח. תיאורי session ID בסעיפים האחרים הם בהקשר TLS ישן; ״אפס״ משמעו שדה ריק ולא מזהה מספרי מיוחד.</p>\n<h4>מדוע תהליך ההקמה אינו מסתיים בשליחת סוד</h4>\n<p>תהליך הקמת חיבור צריך להבטיח לא רק ששני צדדים מחזיקים חומר מפתח, אלא שהם מסכימים על אותם פרמטרים ועל אותו רצף הודעות. הודעות הפתיחה מציעות ובוחרות גרסה ואלגוריתמים, ובהמשך מועברים חומרי החלפת מפתח ואימות. במודל הישן של המצגת, לאחר ClientKeyExchange עדיין יש שלבים נוספים לפני שניתן לראות את ההקמה כמוצלחת. הודעת Finished מאמתת ערך הנגזר מסודות החיבור ומתמליל ההקמה, ולכן בודקת גם שההודעות שהצדדים ראו תואמות.</p>\n<p>לדוגמה, תוקף עשוי לשנות רשימת אלגוריתמים בהודעה הראשונה בלי לשבור את התחביר. אם הלקוח כולל בחישוב את הנוסח המקורי והשרת את הנוסח ששונה, ערכי האימות בסיום אינם תואמים. זו סיבה לכך שאי אפשר להשמיט את אימות הסיום רק מפני שכבר הועבר סוד בצורה מוצפנת. גם אם החישובים הקריפטוגרפיים היו מהירים ללא עלות, ההודעות עצמן עדיין דורשות זמן משלוח ולעיתים סבבי רשת נוספים. חידוש חיבור יכול לקצר עבודה באמצעות מצב מוסכם מחיבור קודם, אך אינו מתיר לבטל את בדיקות הקבלה שלו. מזהה session אינו מפתח סודי ואינו הוכחה עצמאית לזהות; הוא מצביע על מצב שהצדדים כבר נדרשים להכיר ולאמת בהתאם לפרוטוקול.</p>\n<h4>הפרדת תפקידים וחומר מפתח בחיבור</h4>\n<p>במודל RSA של TLS הישן הלקוח יוצר premaster secret ושולח אותו מוצפן במפתח הפומבי של השרת. רק המפתח הפרטי התואם אמור לאפשר לשרת לשחזר אותו. לאחר מכן שני הצדדים גוזרים את סודות החיבור ואת המפתחות הדרושים בעזרת אותו חומר בסיסי ונתוני הקמה פומביים. ה־CA אינו מקבל את הסוד ואינו משמש כשרת שמצפין את כל התעבורה; תפקידו לאשר את הקשר בין זהות האתר למפתח שבתעודה.</p>\n<p>גזירת המפתחות מפרידה בין כיווני התעבורה ובין תפקידים שונים, כגון הצפנה ואימות במודל הנלמד. כך אין שימוש בלתי מבוקר באותו רצף מפתח לכל מטרה. הנתונים האקראיים שנשלחים בהקמה יכולים להיות גלויים, מפני שתפקידם לתרום טריות והבחנה בין חיבורים, ולא לשמש לבדם סוד. יש להבחין בין מודל זה לבין החלפת מפתחות אפמרלית: אם מפתח RSA הפרטי נחשף בעתיד, הקלטה של חילוף RSA ישן עלולה לאפשר שחזור סודות העבר. זו הסיבה שחייבים לציין את מנגנון ההקמה כששואלים אם מפתח מסוים מוצפן או נגזר. מפתח תעודה, סוד משותף ומפתח תעבורת יישום אינם שלושה שמות לאותו עצם, ואין לערבב את מיקום השמירה או אופן ההפצה שלהם.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"File_1_689156_07102022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q005.html"},{"id":"Q006","year":"2022","stem":"פירצת cross site scripting נמצאת ב:","options":["בקוד האתר הפגיע","דפדפן","שרת DB","ב firewall"],"note":"","sources":[{"file":"2022/File_1_689156_07102022_0.pdf","date":"07/10/2022","num":6},{"file":"2022/__689156_07102022_0 מסודר_.pdf","date":"07/10/2022","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.304,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-05-10\" data-doc=\"original-05\" data-body-words=\"367\"><h3>שאלה 6 — היכן נמצאת חולשת XSS?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> בקוד האתר הפגיע: שילוב קלט לא מהימן בהקשר פלט פעיל בלי טיפול מתאים, או שימוש פגיע ב־DOM. הדפדפן מריץ את הקוד בהתאם לדף; אין הכרח בחולשה בדפדפן, ב־DB או בחומת אש.</p>\n<h4>כיצד נתון הופך לקוד בדפדפן</h4>\n<p>בחולשת XSS יישום משלב מידע בשליטת תוקף בהקשר שבו הדפדפן מפרש אותו כתוכן פעיל. ב־stored XSS המידע נשמר באתר ומוצג לאחרים; ב־reflected XSS הוא מוחזר בעקבות בקשה; ב־DOM XSS קוד צד לקוח מעביר מידע לא מהימן ליעד מסוכן בדפדפן. המשותף הוא שבירת הגבול בין מידע לבין הוראות ביצוע. אין הכרח שתהיה חולשה במימוש הדפדפן: בדרך כלל הוא פשוט מריץ את מה שהאתר סיפק לו.</p>\n<p>הסקריפט רץ בהקשר המקור של האתר הפגיע, ולכן עשוי לקרוא מידע בעמוד, לשנות תצוגה וליזום פעולות בהרשאות המשתמש. גניבת cookies היא אפשרות אחת, ולא ההגדרה היחידה של ההתקפה. גם משתמש לא מזוהה יכול להיפגע משינוי תוכן או מהפניה זדונית. אם cookie מוגדר HttpOnly, קריאתו הישירה נחסמת, אך הסקריפט עדיין עשוי לבצע בקשות שהדפדפן יצרף להן אותו. ההגנה המרכזית היא טיפול נכון במידע לפי ההקשר, כגון קידוד פלט ופעולות DOM בטוחות; מדיניות CSP היא שכבה נוספת. אין לטעון שהפעלת HTTPS או עצם קיומו של SOP מונעות XSS, מפני שהקוד הזדוני מגיע כאן מתוך ההקשר שהלקוח ממילא סומך עליו.</p>\n<h4>גבול האמון בין ממשק המשתמש לבין השרת</h4>\n<p>כל קלט שמגיע לשרת צריך להיחשב לא מהימן גם אם ממשק האתר הרגיל בדק אותו קודם. תוקף יכול לשנות את הקוד בדפדפן שלו, לשלוח בקשה בכלי אחר או לפנות ישירות לכתובת שאינה מופיעה במסך. לכן בדיקות בצד הלקוח מועילות לשימושיות ולמשוב מהיר, אך אינן גבול אבטחה שהשרת יכול להסתמך עליו. בצד השרת יש לאמת סוגים, טווחים והרשאות לפי הפעולה המיועדת.</p>\n<p>המונח ״חיטוי״ עלול להסתיר הבדלים חשובים. ערך מספרי צריך בדרך כלל להיפרס למספר בתחום מותר; ערך המשולב ב־SQL צריך לעבור כפרמטר; טקסט שמוצג בדף צריך קידוד פלט המתאים למיקום שלו. מחיקת רשימת תווים קבועה אינה פתרון אוניברסלי, משום שלכל שפה והקשר יש תחביר אחר. לדוגמה, סינון גרש אינו מספק הוכחה ששאילתה דינמית בטוחה, וקידוד HTML אינו הופך טקסט לבטוח אוטומטית בתוך JavaScript. כדאי לשמור הפרדה בין נתון גולמי לבין ייצוג שמיועד לתצוגה, כדי למנוע גם קידוד כפול ושיבוש נתונים. ההגנה צריכה להשתלב במקום שבו הנתון מקבל משמעות: כשמפרשים שאילתה, מציגים תוכן או מאשרים פעולה, ולא רק בשדה הטופס הראשון שהמשתמש רואה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"File_1_689156_07102022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q006.html"},{"id":"Q007","year":"2022","stem":"מנגנון ה same origin policy ממומש ב:","options":["דפדפן","שרת אינטרנט","שרת DB","באפליקציה האינטרנטית"],"note":"","sources":[{"file":"2022/File_1_689156_07102022_0.pdf","date":"07/10/2022","num":7},{"file":"2022/__689156_07102022_0 מסודר_.pdf","date":"07/10/2022","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.278,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-05-11\" data-doc=\"original-05\" data-body-words=\"357\"><h3>שאלה 7 — היכן ממומש SOP?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> בדפדפן. שרת יכול להגדיר כותרות כגון CORS שמשפיעות על ההרשאות, אך אכיפת הבידוד בין מסמכי origins שונים נעשית אצל הלקוח.</p>\n<h4>מהו origin ואיך הדפדפן משתמש בו</h4>\n<p>origin של כתובת נקבע בעיקר לפי סכמת התקשורת, שם המארח והפורט. הנתיב בתוך האתר אינו רכיב שמפריד origins. לכן שתי תיקיות שונות באותו שרת אינן מקבלות בידוד אבטחה אוטומטי רק מפני שהן שייכות למשתמשים שונים. לעומת זאת, שינוי בין HTTP ל־HTTPS, שינוי של שם מארח או שימוש בפורט אחר יכול ליצור מקור אחר. כאשר פורט ברירת המחדל מושמט, משווים לערך ברירת המחדל המתאים ולא לטקסט הכתובת בלבד.</p>\n<p>Same Origin Policy נאכף בדפדפן ומגביל בין היתר קריאת מידע מגורם שמקורו שונה. הוא אינו מנגנון הרשאות של מסד הנתונים ואינו בדיקה שמחליפה אימות בצד השרת. חשוב במיוחד להבדיל בין יכולת לשלוח בקשה לבין יכולת לקרוא את תשובתה: במצבים רבים בקשה בין אתרים יכולה להישלח גם כשאסור לסקריפט לקרוא את התוכן החוזר. זהו הבסיס להבנת CSRF. אם תוכן פעיל לא מהימן מתארח באותו מקור עם תוכן רגיש, גבול ההפרדה כבר נחלש עוד לפני משלוח הבקשה. הפרדה נכונה עשויה לדרוש מארח נפרד או sandbox מוגדר כראוי; השמות ״אליס״ ו״בוב״ בנתיבים אינם מייצרים מדיניות זהות שהדפדפן מבין מעצמו.</p>\n<h4>כיצד נתון הופך לקוד בדפדפן</h4>\n<p>בחולשת XSS יישום משלב מידע בשליטת תוקף בהקשר שבו הדפדפן מפרש אותו כתוכן פעיל. ב־stored XSS המידע נשמר באתר ומוצג לאחרים; ב־reflected XSS הוא מוחזר בעקבות בקשה; ב־DOM XSS קוד צד לקוח מעביר מידע לא מהימן ליעד מסוכן בדפדפן. המשותף הוא שבירת הגבול בין מידע לבין הוראות ביצוע. אין הכרח שתהיה חולשה במימוש הדפדפן: בדרך כלל הוא פשוט מריץ את מה שהאתר סיפק לו.</p>\n<p>הסקריפט רץ בהקשר המקור של האתר הפגיע, ולכן עשוי לקרוא מידע בעמוד, לשנות תצוגה וליזום פעולות בהרשאות המשתמש. גניבת cookies היא אפשרות אחת, ולא ההגדרה היחידה של ההתקפה. גם משתמש לא מזוהה יכול להיפגע משינוי תוכן או מהפניה זדונית. אם cookie מוגדר HttpOnly, קריאתו הישירה נחסמת, אך הסקריפט עדיין עשוי לבצע בקשות שהדפדפן יצרף להן אותו. ההגנה המרכזית היא טיפול נכון במידע לפי ההקשר, כגון קידוד פלט ופעולות DOM בטוחות; מדיניות CSP היא שכבה נוספת. אין לטעון שהפעלת HTTPS או עצם קיומו של SOP מונעות XSS, מפני שהקוד הזדוני מגיע כאן מתוך ההקשר שהלקוח ממילא סומך עליו.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"File_1_689156_07102022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q007.html"},{"id":"Q008","year":"2022","stem":"חיטוי קלט הכי חשוב שיתבצע ב:","options":["צד השרת","צד הלקוח","בדפדפן","במחשבים ללא anti virus"],"note":"","sources":[{"file":"2022/File_1_689156_07102022_0.pdf","date":"07/10/2022","num":8},{"file":"2022/__689156_07102022_0 מסודר_.pdf","date":"07/10/2022","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.127,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-05-12\" data-doc=\"original-05\" data-body-words=\"378\"><h3>שאלה 8 — היכן חשוב ביותר לבצע אימות/חיטוי קלט?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> בצד השרת: תוקף יכול לעקוף ממשק, JavaScript ובדיקות דפדפן ולשלוח בקשות ישירות. ל־SQLi משתמשים בפרמטרים; ל־XSS יש לקודד פלט לפי ההקשר ולא להסתמך על חיטוי כללי בלבד.</p>\n<h4>גבול האמון בין ממשק המשתמש לבין השרת</h4>\n<p>כל קלט שמגיע לשרת צריך להיחשב לא מהימן גם אם ממשק האתר הרגיל בדק אותו קודם. תוקף יכול לשנות את הקוד בדפדפן שלו, לשלוח בקשה בכלי אחר או לפנות ישירות לכתובת שאינה מופיעה במסך. לכן בדיקות בצד הלקוח מועילות לשימושיות ולמשוב מהיר, אך אינן גבול אבטחה שהשרת יכול להסתמך עליו. בצד השרת יש לאמת סוגים, טווחים והרשאות לפי הפעולה המיועדת.</p>\n<p>המונח ״חיטוי״ עלול להסתיר הבדלים חשובים. ערך מספרי צריך בדרך כלל להיפרס למספר בתחום מותר; ערך המשולב ב־SQL צריך לעבור כפרמטר; טקסט שמוצג בדף צריך קידוד פלט המתאים למיקום שלו. מחיקת רשימת תווים קבועה אינה פתרון אוניברסלי, משום שלכל שפה והקשר יש תחביר אחר. לדוגמה, סינון גרש אינו מספק הוכחה ששאילתה דינמית בטוחה, וקידוד HTML אינו הופך טקסט לבטוח אוטומטית בתוך JavaScript. כדאי לשמור הפרדה בין נתון גולמי לבין ייצוג שמיועד לתצוגה, כדי למנוע גם קידוד כפול ושיבוש נתונים. ההגנה צריכה להשתלב במקום שבו הנתון מקבל משמעות: כשמפרשים שאילתה, מציגים תוכן או מאשרים פעולה, ולא רק בשדה הטופס הראשון שהמשתמש רואה.</p>\n<h4>הפרדה בין מבנה שאילתה לבין נתוני משתמש</h4>\n<p>SQL injection מתרחשת כאשר קלט משתמש נעשה חלק מתחביר שאילתת מסד נתונים. אם השרת בונה מחרוזת SQL באמצעות שרשור, תוקף עשוי לסגור ביטוי, להוסיף תנאי או לשנות את המשך השאילתה. ההתקפה אינה תלויה בכך שהמשתמש הקליד ערך דרך הטופס הרגיל; כל נתון שמגיע ממקור לא מהימן עשוי להגיע לבניית השאילתה. ההגנה הישירה היא שימוש בפרמטרים קשורים, כך שמנוע המסד מקבל את מבנה הפקודה בנפרד מערכי הנתונים.</p>\n<p>בהתקפה עיוורת היישום אינו מציג את תוצאת השאילתה ישירות. התוקף יכול עדיין לשאול שאלות שהשפעתן נראית בתשובת השרת או בזמן התגובה, ולבנות מידע בהדרגה. למשל הבדל בין דף רגיל לשגיאה עשוי לשמש תשובת אמת או שקר. לכן העלמת הודעות שגיאה אינה תיקון מספק לקוד הפגיע. רשימה שחורה של תווים או מילות מפתח עלולה להחמיץ תחביר חלופי; גם WAF הוא שכבת הגנה נוספת ולא הוכחה שהשאילתה בטוחה. התוצאה יכולה להיות קריאת מידע, שינויו או שתילת תוכן שיוצג אחר כך באתר ויוביל גם ל־XSS. יש לזהות תחילה איזה מפרש מקבל את הקלט, ורק אחר כך לבחור את ההגנה המתאימה; מנגנוני iframe או הצפנת תעבורה אינם משנים את פירוש השאילתה במסד.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"File_1_689156_07102022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q008.html"},{"id":"Q009","year":"2022","stem":"אליס ובוב רוצים לתקשר ביניהם בצורה מאובטחת, באופן כזה שאם X שולח הודעה, X לא יוכל לאחר מכן להתכחש שהוא שלח את ההודעה. בכדי להשיג תקשורת שכזאת, עליהם להשתמש ב:","options":["public key cryptography","One Time Pad","DNS","כלל בייליויק"],"note":"","sources":[{"file":"2022/File_1_689156_07102022_0.pdf","date":"07/10/2022","num":9},{"file":"2022/__689156_07102022_0 מסודר_.pdf","date":"07/10/2022","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.19,"exam_count":1,"in_sample_exam":false,"variant_group":"V02","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-05-13\" data-doc=\"original-05\" data-body-words=\"394\"><h3>שאלה 9 — איזה כלי דרוש לאי־התכחשות?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> מבין האפשרויות, קריפטוגרפיית מפתח פומבי מאפשרת חתימות: רק בעל המפתח הפרטי יוצר חתימה, וכל צד יכול לבדוק אותה. הצפנת מפתח פומבי כשלעצמה אינה מספיקה; צריך חתימה עם שיוך מפתח לזהות ושמירת ראיות. MAC/OTP משותפים אינם מבדילים בין הצדדים שיכולים ליצור הודעה.</p>\n<h4>חתימה, אימות ואי־התכחשות</h4>\n<p>חתימה דיגיטלית היא מנגנון שבו בעל מפתח פרטי יוצר הוכחה הקשורה לתוכן מסוים, וכל מי שמכיר את המפתח הפומבי המתאים יכול לבדוק אותה. בפועל חותמים בדרך כלל על ייצוג מקודד של תקציר ההודעה. תפקיד הגיבוב הוא לקשור את ההוכחה לכל תוכן ההודעה ביעילות; תפקיד מפתח החתימה הוא למנוע ממי שאינו מחזיק בסוד ליצור הוכחות חדשות. אלה שני תפקידים נפרדים, ולכן גיבוב ללא חתימה אינו מחליף חתימה, והצפנה לנמען אינה הוכחה לזהות השולח.</p>\n<p>מקבל חייב לבדוק שהמפתח הפומבי שבו הוא משתמש אכן משויך לחותם הרצוי. לאחר מכן עליו לבדוק את החתימה על התוכן המדויק שקיבל, לרבות הקשר חשוב כמו זהות נמען, סוג פעולה ומספר פעולה. חתימה על מפתח בלבד אינה בהכרח חתימה על כל ההודעות שייווצרו בעתיד בעזרתו. באופן דומה, חתימה תקפה אינה מבטיחה שהודעה טרייה: אפשר להחזיר הודעה חתומה ישנה ללא שינוי. כדי למנוע ביצוע חוזר נדרש מנגנון מתאים, כגון מזהה פעולה שנחתם ונבדק מול מצב שמור. אי־התכחשות היא יתרון לעומת MAC משותף, אך פירושה מותנה בהגנה על המפתח וביכולת לשייך אותו לבעליו; אין להסיק ממנה שהמסר מוצפן או שהחותם בהכרח פעל מרצונו החופשי.</p>\n<h4>אימות באמצעות סוד משותף</h4>\n<p>MAC הוא תג אימות המחושב מתוך הודעה ומפתח סודי משותף. השולח מחשב תג, והמקבל מחשב או בודק אותו באמצעות אותו סוד. אם התג אינו מתאים להודעה שקיבל, המקבל דוחה אותה. עבור מנגנון תקין, תוקף שאינו מכיר את המפתח אינו אמור להצליח ליצור תג תקף להודעה חדשה שבחר. כך אפשר לזהות שינוי בתוכן ולייחס יצירה למישהו מקבוצת מחזיקי הסוד. אין צורך שהתג עצמו יהיה סודי, אבל הסוד שעליו מבוססת הבדיקה חייב להישמר.</p>\n<p>שיתוף הסוד הוא גם גבול ההוכחה. אם אליס ובוב מכירים את המפתח, כל אחד משניהם יכול ליצור הודעה ותג תקפים; לכן בוב אינו יכול להציג את הזוג לצד שלישי ולהוכיח שרק אליס יכלה ליצור אותו. זהו ההבדל המרכזי בין אימות סימטרי לבין חתימה בעלת אימות פומבי. בנוסף, MAC אינו מסתיר את ההודעה: אדם שרואה את המידע הגלוי יכול לקרוא אותו גם אם אינו מסוגל לשנותו בהצלחה. אין לבלבל בין MAC בהקשר הזה לבין כתובת MAC ברשת מקומית. השם הזהה אינו קשר בין המנגנונים: הראשון הוא פונקציה קריפטוגרפית עם מפתח, והשנייה היא מזהה המשמש למשלוח מסגרות ואינה הוכחת זהות מאובטחת.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"File_1_689156_07102022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q009.html"},{"id":"Q010","year":"2022","stem":"איזו מבין הטענות הבאות נכונה?","options":["ב PKI, שרת אינטרנט X שקיבל תעודה חתומה מ CA על ה public key שלו, אינו חייב ש ה CA שנתן לו (ל X) את התעודה יהיה ב root store של הלקוחות","שימוש ב Syn cookies מונע התקפת XSRF","הקמת חיבור TLS מחייבת שימוש בתעודה רק במקרה והחיבור מוקם בין שני שרתים","ב TLS, שרת האינטרנט מייצר את התעודה עבור חיבור ה TLS"],"note":"","sources":[{"file":"2022/File_1_689156_07102022_0.pdf","date":"07/10/2022","num":10},{"file":"2022/__689156_07102022_0 מסודר_.pdf","date":"07/10/2022","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.316,"exam_count":1,"in_sample_exam":false,"variant_group":"V03","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-05-14\" data-doc=\"original-05\" data-body-words=\"385\"><h3>שאלה 10 — האם CA מנפיק חייב להיות ב־root store?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> באימות TLS מבוסס תעודות בונים שרשרת חתימות מתעודת האתר דרך CA מתווכים אל עוגן אמון מקומי; בודקים גם שם שרת, תוקף ושימושים מותרים. ה־CA שהנפיק ישירות אינו חייב להיכלל במאגר השורשים. אין הכרח שהשורש יחתום ישירות על תעודת האתר, וחתימה עצמית של האתר אינה מספיקה לאמון ציבורי.</p>\n<h4>תעודות ושרשרת אמון</h4>\n<p>תעודה דיגיטלית קושרת זהות למפתח פומבי ומכילה חתימה של גורם מנפיק. היא אינה מכילה את המפתח הפרטי, שהרי התעודה נשלחת ברשת והסוד אמור להישאר אצל בעליו. בעל האתר יכול ליצור את זוג המפתחות בעצמו ולהעביר למנפיק בקשה המכילה את המפתח הפומבי. המנפיק מבצע את בדיקותיו וחותם על תעודה; אין מכאן צורך שהמנפיק ייצור את סוד האתר או ילמד אותו.</p>\n<p>הלקוח אינו סומך על חתימה רק מפני שהיא תקפה מתמטית. הוא צריך להתחיל בעוגן אמון מוכר, לבדוק את שרשרת החתימות ואת מגבלות ההאצלה עד לתעודת האתר, ולוודא שהשם שהתבקש מתאים לשמות שבתעודה. תאריך תוקף, שימושי מפתח ומצב ביטול הם בדיקות נוספות בהתאם למדיניות. בדרך נפוצה רשות שורש חותמת על רשות ביניים, ורשות הביניים מנפיקה את תעודת האתר. לכן המנפיק הישיר אינו חייב להיות מותקן בעצמו כרשות שורש בדפדפן. אם האתר חותם על התעודה שלו, אפשר לבדוק שהחתימה מתאימה למפתח שבו, אך הדבר אינו יוצר מאליו אמון בזהותו. גם תעודה אמינה אינה מעידה שהשרת נקי מחולשות יישום או שהמשתמש התכוון לכל פעולה שתעבור בערוץ.</p>\n<h4>מה מספק TLS ובאילו שכבות הוא פועל</h4>\n<p>TLS יוצר ערוץ מוצפן ומאומת מעל תעבורה שבפני עצמה יכולה להיות חשופה למאזין או לתוקף פעיל. תחילה הצדדים מסכימים על פרמטרים ומקימים חומר מפתח, ובתצורה הנפוצה השרת מוכיח זהות באמצעות תעודה ומפתח פרטי מתאים. אחר כך מידע היישום מוגן במפתחות סימטריים. הבחירה במנגנון סימטרי להעברת מידע רב נובעת מיעילותו; המנגנונים האסימטריים פותרים בעיקר את בעיית ההקמה והאימות בלי סוד משותף שהותקן מראש.</p>\n<p>יש להבדיל בין הגנת הערוץ לבין תקינות התוכנה שמשתמשת בו. TLS לא מונע מהיישום להפעיל שאילתת SQL מסוכנת, לשלב קוד תוקף בדף או לקבל בקשת פעולה שהמשתמש לא התכוון אליה. הוא גם אינו מעניק אוטומטית זהות לכל לקוח: בתצורות רבות רק השרת מציג תעודה והמשתמש מזדהה אחר כך בסיסמה או באמצעי יישומי. תוקף שולט ברשת יכול עדיין לחסום את החיבור ולגרום למניעת שירות, גם כשאינו יכול לקרוא או לשנות תוכן מאומת. בתשובה על המצגת יש לציין אם מדובר ב־TLS הישן עם RSA או במנגנון אחר, משום שפרטי החלפת המפתח וההודעות השתנו בין גרסאות. ערבוב כל הזרימות לתיאור יחיד עלול להוביל לתשובה שגויה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"File_1_689156_07102022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q010.html"},{"id":"Q011","year":"2022","stem":"חברה חדשה מציעה חומת אש הפועלת בטכנולוגיה הבאה:\nחומת האש בודקת את כל כתובות ה source IP של החבילות שרוצות לצאת מתוך הרשת החוצה ובמידה והיא מוצאת כתובת IP שאחראית ליותר מ X אחוזים מהתעבורה בשעה האחרונה, היא אוטו' מוסיפה חוק שמסנן את כל החבילות מהכתובת הזאת למשך 24 שעות. איזו מהטענות הבאות נכונה?","options":["הטכנולוגיה עלולה לשבש את התעבורה התקינה, מפני שהיא עלולה לחסום מחשבים לגיטימיים שמייצרים הרבה תעבורה לגיטימית","מחשב זדוני שנמצא בתוך הרשת אינו יכול להשתמש ב spoofed source ip - ולכן אינו יכול לגרום לחסימה של כתובות ip לגיטימיות","הטכנולוגיה הנ\"ל נותנת מענה כנגד התקפות המנצלות חולשה באופן שבו מומשה חומת האש","הטכנולוגיה הנ\"ל מונעת כל התקפה המנצלות חולשה במחשב שנמצא בתוך הרשת, למשל מחשב הפגיע ל Ping of death"],"note":"","sources":[{"file":"2022/File_1_689156_07102022_0.pdf","date":"07/10/2022","num":11},{"file":"2022/__689156_07102022_0 מסודר_.pdf","date":"07/10/2022","num":11}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.242,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-05-15\" data-doc=\"original-05\" data-body-words=\"393\"><h3>שאלה 11 — חסימת מקור ל־24 שעות מעל X אחוז מהתעבורה</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> הטכנולוגיה עלולה לחסום מקור לגיטימי כגון גיבוי או שרת קבצים. שיעור תעבורה יחסי אינו ראיה לזדון. תוקף פנימי גם עשוי לזייף מקור ולגרום להפללת מחשב אחר. אין הגנה כללית על חולשות firewall או על כל התקפה פנימית.</p>\n<h4>סינון חבילות, מדיניות ומצב חיבורים</h4>\n<p>חומת אש בוחנת תעבורה העוברת דרכה ומחליטה לאשר או לדחות לפי כללים. מסנן חבילות יכול להשתמש בכיוון התעבורה, כתובות מקור ויעד, פורטים ופרוטוקול. כללי allowlist מאפשרים רק את התעבורה שהוגדרה ומשאירים כלל דחייה כברירת מחדל. עם זאת, מספר פורט אינו הוכחה לזהות יישום: תוקף יכול לנסות לשלוח חיבור מפורט שבחר, ושירות יכול לרוץ בפורט שאינו המקובל שלו. לכן צריך לקרוא את תנאי הכלל ממש, ולא את כוונת האדם שכתב אותו.</p>\n<p>חומת אש שמנהלת מצב יכולה לבדוק אם חבילה היא חלק מחיבור שכבר נפתח ואושר. מסנן חסר מצב שמאפשר תשובות רק בגלל פורט מקור מוכר עלול לאפשר גם התחלת חיבור זדוני הנראית כך. סינון דגלים משפר דיוק במקרים מסוימים, אך אינו תחליף מלא למעקב מצב ולאימות יישומי. יש גם גבול טופולוגי: חומת אש בגבול הרשת אינה רואה בהכרח חבילות ששני מחשבים פנימיים מחליפים ישירות. בדומה לכך, בלי בדיקת תוכן יישום אין להניח שהיא מזהה קוד זדוני בתוך אימייל. סינון מקורות חשודים יכול לצמצם זיוף כתובות, אבל אינו הופך כל כתובת מקור לזהות אמינה. לכל כלל צריך לבנות גם מסלול הלוך וגם מסלול חזור ולבדוק אם שניהם עוברים.</p>\n<h4>ההבדל בין גילוי, מניעה והוכחת תקינות</h4>\n<p>IDS מיועד לניטור ולזיהוי התנהגות חשודה. הוא עשוי לנתח תבניות מוכרות, חריגות בתעבורה או אירועים במחשב, ולהתריע למפעיל. מתן התרעה אינו כשלעצמו עצירת החבילה או ביטול הפעולה שכבר נעשתה. IPS מוסיף יכולת תגובה פעילה, למשל חסימת תעבורה העוברת דרכו. לכן שימוש במילה ״מונע״ לגבי IDS טהור מחליף משימה אחת באחרת. אפשר לבנות מערכת שבה התרעות מפעילות כלים נוספים, אך אז צריך לתאר במפורש את שרשרת התגובה ולא לייחס אותה לשם IDS לבדו.</p>\n<p>גם מנגנון חוסם אינו נותן הבטחה גורפת שכל תקיפה תיעצר. כלל זיהוי עשוי להחמיץ התקפה חדשה או לסווג פעילות רגילה כחשודה. לדוגמה, שרת גיבוי יכול לייצר נפח גדול בלי להיות תוקף, בעוד שניחוש מזהי DNS יכול להיראות כחבילות קצרות רגילות. ההגנה הישירה צריכה להימצא גם בפרוטוקול או בקוד: אימות נתונים, הפרדת תחביר מנתונים, בדיקת הרשאות ועדכון רכיבים פגיעים. סריקה בכלי כמו nmap עוזרת לגלות שירותים וממצאים אפשריים, אבל אינה מוכיחה שהמערכת בטוחה אחרי שהסריקה הסתיימה. בניתוח כל חלופה יש לשאול אם היא מתארת תצפית, אכיפת מדיניות או תכונת בטיחות; אלה תפקידים משלימים שאינם מילים נרדפות.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"File_1_689156_07102022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q011.html"},{"id":"Q012","year":"2022","stem":"לחבילות בשכבת הרשת יש שדה ID-IP המשמש לפרגמנטציה. חבילות שונות (שאינן תוצאה של פרגמנטציה) נדרשות להיות עם ID-IP שונה כל אחת בתקשורת בין שני מחשבים. ישנן מ\"ה אשר משתמשות במונה גלובלי אשר גדל ב1 על כל חבילה שנשלחת והערך של ה ID-IP הוא לפי מונה זה.\nנתון מחשב A בשליטת תוקף ונתון מחשב V אחר אשר מ\"ה שלו מממשת מונה גלובלי עבור ID-IP כפי שמוזכר לעיל. כמו כן, במידה ומחשב V מקבל בקשת פינג (ping) הוא משיב עליה בתשובת פינג (ping). האם ניתן לגלות האם מחשב V תיקשר עם מחשבים אחרים במהלך פרק זמן מסויים?","options":["כן. שולחים ping ל V מ A בתחילת פרק הזמן ושולחים ping נוסף ל V מ A בסוף פרק הזמן. בודקים את ההפרש בין ה IP-ID שהתקבל בכל אחד מהתשובות, ומסיקים (גדול מ1 ⇐ הייתה תקשורת עם אחרים בין לבין)","כן. שולחים ping ל V מ A בתחילת פרק הזמן ושולחים ping נוסף ל V מ A בסוף פרק הזמן. אם קיבלנו בפעם השניה את אותו ה IP-ID שהתקבל בראשונה, סימן שלא הייתה תקשורת עם אחרים בין לבין","לא. כדי לדעת דבר שכזה, חובה להחזיק חיבור TCP רצוף בין A ל V, ולכן מנגנון ה syn cookies ישבש את המונה","לא. מנגנון ה same-origin-policy יחסום זאת"],"note":"","sources":[{"file":"2022/File_1_689156_07102022_0.pdf","date":"07/10/2022","num":12},{"file":"2022/__689156_07102022_0 מסודר_.pdf","date":"07/10/2022","num":12}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.167,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-05-16\" data-doc=\"original-05\" data-body-words=\"419\"><h3>שאלה 12 — זיהוי פעילות אחרת דרך מונה IP-ID גלובלי</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> שולחים ping בתחילה ובסוף ורואים IDs i,j בתשובות. לפי מודל השאלה, ללא חבילות נוספות j−i=1; הפרש גדול מ־1 מעיד על חבילות יוצאות נוספות בין התשובות. צריך לחשב מודולו גודל השדה ולהניח שאין הקפות מלאות, שינוי/אקראיות מונה או תעבורה אחרת של הניסוי. זו ראיה לשליחה נוספת, לא הוכחה לזהות הנמען או לקיום שיחה דו־כיוונית; תעבורה נכנסת בלבד שאינה מעוררת תשובה אינה נחשפת כך.</p>\n<h4>מונה גלובלי כערוץ צדדי</h4>\n<p>ערוץ צדדי חושף מידע על פעולה דרך תוצאה נלווית, גם כשהמערכת אינה מציגה את הפעולה עצמה. בדגם הנתון מערכת ההפעלה מגדילה מונה משותף לכל חבילה יוצאת ומשתמשת בו בשדה IP-ID. משום שהמונה גלובלי, חבילה למחשב אחד משנה גם את הערך שיופיע בחבילה הבאה למחשב אחר. זהו שיתוף מצב שמאפשר לצופה חיצוני לקבל מדידה עקיפה של פעילות נוספת.</p>\n<p>כדי למדוד, התוקף גורם למחשב להחזיר שתי תשובות שידוע שהן נשלחו בתחילת חלון הזמן ובסופו. הוא קורא את המזהה בתשובה הראשונה ומשווה לשנייה. אם כל מה שנשלח בין שתי המדידות הוא התשובה השנייה, המונה מתקדם פעם אחת. אם ההפרש גדול יותר, נשלחו גם חבילות נוספות לפי הנחת המודל. אין צורך בחיבור TCP רציף; גם שתי תשובות ping יכולות לחשוף את השדה ברמת הרשת. מצד שני, שדה בעל גודל מוגבל חוזר לבסוף לערכים קודמים, ולכן צריך להימנע מחלון שבו אפשר להקיף את כל הטווח בלי להבחין בכך. המדידה אינה חושפת את תוכן החבילות או את כתובות יעדיהן, ואינה מגלה בהכרח תעבורה נכנסת שלא גרמה לתשובה. שינוי למונים נפרדים או לערכים שאינם גלובליים צפויים יכול לשנות את הניתוח.</p>\n<h4>פירוש מדידה ברמת הרשת והגבלותיה</h4>\n<p>יש להפריד בין תצפית ישירה על שיחה לבין מסקנה ממצב משותף. כאן אין לתוקף בהכרח האזנה לחבילות שנשלחו ליעדים אחרים; הוא רואה רק שתי תשובות שמופנות אליו. האפשרות להסיק משהו נובעת מהנחת התרגיל שכל החבילות היוצאות משתמשות באותו מונה. אם המימוש היה מחזיק מונה נפרד לכל יעד, חבילה למחשב אחר לא הייתה משנה בהכרח את המדידה. לכן תכונת מימוש נקודתית היא תנאי חיוני להתקפה, ולא חוק כללי של כל מערכת הפעלה.</p>\n<p>הפרש בין שני ערכים צריך להיבדק ביחס לגודל השדה ולהתנהגות המונה. כאשר המונה מחזורי, ערך שני קטן מספרית מהראשון אינו מוכיח שאין פעילות; ייתכן שהיתה גלישה דרך סוף הטווח. מצד שני, חלון ארוך מאוד יכול לאפשר מספר הקפות ולהסתיר את מספר החבילות האמיתי. גם חבילות שהתוקף עצמו עורר צריכות להיכלל בחשבון הבסיס, כדי שלא יסווג אותן בטעות כתקשורת עם אחרים. כדאי לתאר בדיוק מה אפשר להסיק: מספר נוסף של חבילות יוצאות או לפחות עצם קיומן, בהתאם לתנאים. אין מכאן ידיעה של תוכנן, היישום שיצר אותן או זהות הנמען. מנגנון בדפדפן כמו SOP ומנגנון סינון של TCP אינם משנים מאליהם מונה בכותרת IP.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"File_1_689156_07102022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q012.html"},{"id":"Q013","year":"2022","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["בעיה גדולה ב One Time Pad היא העברת המפתחות","בעיה גדולה ב Public Key Cryptography היא העברת המפתחות","בעיה גדולה ב RSA היא העברת המפתחות","בעיה גדולה ב Diffie Hellman היא העברת המפתחות"],"note":"התקבלו כל הסעיפים","sources":[{"file":"2022/689156_06112022_0.pdf","date":"06/11/2022","num":1},{"file":"ללא תאריך/c22b - מקודד.docx.pdf","date":"06/11/2022","num":1}],"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_manual":true,"flags":["note"],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0,1,2,3],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-03-05\" data-doc=\"original-03\" data-body-words=\"431\"><h3>שאלה 1 — העברת מפתחות — איזו טענה אינה נכונה?</h3><div class=\"answer-body\">\n<p><strong>בחירה: אין יחידה.</strong> <strong>אין תשובה יחידה בניסוח הנתון.</strong> א (העברת מפתח היא בעיה גדולה ב־OTP) נכונה: צריך סוד אקראי באורך ההודעה. ב וג מציגות העברת מפתח כסוד נדרש גם במפתח פומבי/RSA, וזה אינו התיאור הרגיל: המפתח הפומבי יכול להיחשף, אך אימותו חיוני. ד שגויה אם היא מתכוונת לצורך לשלוח את הסוד המשותף ב־DH — הוא אינו נשלח. אם ״העברת מפתחות״ כוללת אימות מפתחות, יש בעיית ניסוח נוספת. בקובץ המקוצר מופיעה הערה שכל הסעיפים התקבלו; מבחינה מקצועית אין לבחור א כטענה השגויה רק בגלל כותרת ״הכול א״.</p>\n<h4>סודיות מושלמת ותנאי השימוש החד־פעמי</h4>\n<p>ב־One Time Pad בוחרים מפתח אקראי אחיד, בלתי תלוי בהודעה, באורך המספיק לה, ומשתמשים בו פעם אחת בלבד. בייצוג ביטים ההצפנה היא XOR של ההודעה והמפתח, והפענוח הוא XOR נוסף עם אותו מפתח. עבור כל טקסט מוצפן וכל הודעה אפשרית באותו אורך קיים בדיוק מפתח מתאים. כאשר כל המפתחות שווי הסתברות, הצפנה אינה מעדיפה הודעה אחת על אחרת, ולכן אין למאזין מידע נוסף על התוכן מעבר למידע שכבר היה לו ולאורך.</p>\n<p>הבטחה חזקה זו תלויה בתנאים. אם אותו מפתח משמש שתי הודעות, XOR של שני הטקסטים המוצפנים מבטל את המפתח וחושף XOR של ההודעות. מידע לשוני או קטע ידוע יכולים לסייע להמשך שחזור. אם המפתח נוצר ממקור קטן וצפוי, גם הארכתו אינה מייצרת סודיות מושלמת. הבעיה המעשית של העברת סוד ארוך לצד השני נשארת משמעותית; אי אפשר פשוט לשלוח את ה־pad גלוי בערוץ שהמאזין רואה. מנגד, אין תנאי שהטקסט יהיה בעל שפה או תוכן מסוימים כדי לקבל את הוכחת הסודיות. זו אחת הדרכים להבחין בין בטיחות אלגוריתמית מותנית לבין השאלה עד כמה נוח או אפשרי ליישם את המנגנון במערכת מסוימת.</p>\n<h4>מפתחות פומביים לעומת מפתחות סודיים</h4>\n<p>בקריפטוגרפיית מפתח פומבי לכל משתתף זוג מפתחות מקושרים: מפתח פומבי שמותר להפיץ ומפתח פרטי שרק בעליו אמור להחזיק. בהצפנה לנמען משתמשים במפתח הפומבי של הנמען, מפני שהפענוח דורש את המפתח הפרטי התואם. לכן אפשר לפרסם את מפתח בוב ועדיין לשמור הודעות המיועדות אליו בסוד. המפתח הפומבי אינו סיסמה שיש להעביר בערוץ נסתר; השאלה העיקרית בהפצתו היא כיצד יודעים שזהו באמת המפתח של בוב ולא מפתח של מתחזה.</p>\n<p>יש להבחין בין מאזין פסיבי לבין תוקף פעיל. מאזין רואה את הערכים שעוברים אך אינו משנה אותם; תוקף פעיל יכול להחליף מפתחות, לפתוח חיבורים ולשלוח הודעות משלו. פרוטוקול שעובד נגד הראשון עלול להיכשל נגד השני אם אין אימות זהות. תעודה חתומה או מפתח שנלמד מראש בערוץ אמין מספקים בסיס לשיוך הזהות, אך עדיין צריך להשתמש במפתח בתפקיד הנכון. דוגמה מעשית היא שליחת מפתח סימטרי אקראי בהצפנה לבוב ואז שימוש בו לקובץ גדול. מותר לכל אדם להצפין לבוב; עצם היכולת הזאת אינה מזהה את השולח כאליס. כדי לזהות אותה נדרשת גם הוכחה המתבססת על סוד שלה, למשל חתימה דיגיטלית.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_06112022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q013.html"},{"id":"Q014","year":"2022","stem":"תוקף הצליח לגנוב קובץ שמכיל סיסמאות לאימות של משתמשים. מטעמי אבטחה, כל הסיסמאות בו לא נשמרו כמות שהן, אלא הוחלפו בhash שלהן. איזה מבין ההתקפות הבאות ינסה התוקף לבצע כדי להשיג את הסיסמאות המקוריות דרך הקובץ הנ\"ל?","options":["התקפת brute force","התקפת spoofing","התקפת sql injection","התקפת csrf"],"note":"","sources":[{"file":"2022/689156_06112022_0.pdf","date":"06/11/2022","num":2},{"file":"ללא תאריך/c22b - מקודד.docx.pdf","date":"06/11/2022","num":2},{"file":"ללא תאריך/דוגמא פורמט 2.pdf","date":null,"num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.129,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-03-06\" data-doc=\"original-03\" data-body-words=\"376\"><h3>שאלה 2 — גניבת קובץ hashes של סיסמאות</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> התוקף מנחש סיסמה, מחשב את פונקציית הגיבוב עם אותם salt ופרמטרים אם ישנם, ומשווה לתוצאה השמורה. זו מתקפת ניחוש offline, לרבות dictionary/brute force. אין ״פענוח hash״; פונקציה אטית ו־salt מייקרים את החיפוש.</p>\n<h4>מה מצפים מפונקציית גיבוב קריפטוגרפית</h4>\n<p>פונקציית גיבוב ממפה הודעה באורך משתנה לתקציר באורך קבוע. מכיוון שמספר הקלטים גדול ממספר הפלטים, התנגשויות בהכרח קיימות; הדרישה אינה שלא יהיו התנגשויות כלל, אלא שיהיה קשה חישובית למצוא אותן. בהתנגשות התוקף בוחר שתי הודעות שונות שמניבות אותו תקציר. בקדם־תמונה נתון רק תקציר ומנסים למצוא הודעה מתאימה. בקדם־תמונה שנייה ניתנת הודעה מסוימת, והתוקף מחפש הודעה אחרת עם אותו תקציר. חשוב לזהות איזה מידע נקבע לפני שהחיפוש מתחיל.</p>\n<p>אם פונקציה מאפשרת חיבור חילופי פשוט או מתעלמת מחלק מהתווים, אפשר לעיתים לכתוב זוג מתנגש בלי לבצע חיפוש כלשהו. זה חמור יותר מאמירה כללית על מספר הפלטים, משום שמוצגת התקפה יעילה ומפורשת. לדוגמה, פונקציה שרק סוכמת ערכי אותיות לא מבחינה בהחלפת סדרן; תקציר שווה לא מוכיח ששני קבצים זהים. גם תקציר חזק לבדו אינו מוכיח מי יצר הודעה, שהרי כל אדם יכול לחשב אותו על הודעה חדשה. לאימות מול תוקף צריך לקשור את התקציר לסוד, באמצעות MAC, או לחתימה מאומתת. בשאלת חישוב יש לבצע בדיוק את הפעולה שהוגדרה, לרבות המודולו, ולא להניח ששם הפעולה מעניק לה בטיחות.</p>\n<h4>מה אפשר לעשות אחרי גניבת קובץ סיסמאות מגובבות</h4>\n<p>במערכת שאינה שומרת סיסמה גלויה נשמר ערך בדיקה שמחושב ממנה. בזמן כניסה המשתמש מספק מועמד לסיסמה, והשרת מחשב שוב את אותה פונקציה עם הפרמטרים המתאימים ומשווה לתוצאה השמורה. השרת אינו חייב לדעת כיצד להפוך את הגיבוב כדי לבצע אימות. אותה יכולת השוואה זמינה גם לתוקף שגנב את הקובץ, ולכן הגיבוב אינו מבטל את האפשרות לבדוק ניחושים: הוא רק משנה את האופן והעלות של החיפוש.</p>\n<p>התוקף יכול להתחיל במילים נפוצות, דפוסי סיסמאות ושינויים מוכרים, או לעבור על מרחב מועמדים בצורה שיטתית. לכל מועמד הוא מחשב גיבוב ומשווה לערך היעד. זהו חיפוש קדם־תמונה בהגבלה מעשית של בחירות אנושיות, ולא שבירה של עמידות להתנגשות באמצעות זוג קלטים שרירותי. salt שונה לכל משתמש מונע שימוש חוזר באותה טבלת חישובים עבור רבים, אך בדרך כלל נשמר עם הערך ואינו מונע חיפוש לכל משתמש בנפרד. פונקציית סיסמאות אטית נועדה לייקר כל ניסיון. מגבלת ניסיונות בשרת אינה מגבילה בהכרח את החיפוש המקומי של מי שמחזיק בקובץ. לכן בודקים במפורש אם התרחיש הוא ניחוש מקוון דרך אתר או ניחוש לא מקוון לאחר דליפה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_06112022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q014.html"},{"id":"Q015","year":"2022","stem":"איזו מבין הטענות הבאות נכונה?","options":["בקריפטוגרפיה, MAC המיושם נכון מספק אמינות המידע","בקריפטוגרפיה, מטרת השימוש בלCBC בצופן בלוקים היא לספק אמינות המידע","בקריפטוגרפיה, CA חותם על המפתחות שהCA יצר עבור שרת האינטרנט שפנה אל הCA","בקריפטוגרפיה, PKI נועד לוודא שימוש מאובטח ב ARP"],"note":"","sources":[{"file":"2022/689156_06112022_0.pdf","date":"06/11/2022","num":3},{"file":"ללא תאריך/c22b - מקודד.docx.pdf","date":"06/11/2022","num":3},{"file":"ללא תאריך/דוגמא פורמט 2.pdf","date":null,"num":2}],"topic":"Hash, MAC וסיסמאות","topic_manual":true,"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-03-07\" data-doc=\"original-03\" data-body-words=\"383\"><h3>שאלה 3 — MAC, CBC, CA ו־PKI — הטענה הנכונה</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> MAC תקין מספק שלמות ואימות מקור בין מחזיקי סוד משותף. CBC להצפנה בלבד אינו מספק שלמות. בדרך הרגילה בעל האתר יוצר את זוג המפתחות, ה־CA מאשר את הקישור לזהות באמצעות תעודה, ו־PKI אינו מנגנון אבטחת ARP.</p>\n<h4>אימות באמצעות סוד משותף</h4>\n<p>MAC הוא תג אימות המחושב מתוך הודעה ומפתח סודי משותף. השולח מחשב תג, והמקבל מחשב או בודק אותו באמצעות אותו סוד. אם התג אינו מתאים להודעה שקיבל, המקבל דוחה אותה. עבור מנגנון תקין, תוקף שאינו מכיר את המפתח אינו אמור להצליח ליצור תג תקף להודעה חדשה שבחר. כך אפשר לזהות שינוי בתוכן ולייחס יצירה למישהו מקבוצת מחזיקי הסוד. אין צורך שהתג עצמו יהיה סודי, אבל הסוד שעליו מבוססת הבדיקה חייב להישמר.</p>\n<p>שיתוף הסוד הוא גם גבול ההוכחה. אם אליס ובוב מכירים את המפתח, כל אחד משניהם יכול ליצור הודעה ותג תקפים; לכן בוב אינו יכול להציג את הזוג לצד שלישי ולהוכיח שרק אליס יכלה ליצור אותו. זהו ההבדל המרכזי בין אימות סימטרי לבין חתימה בעלת אימות פומבי. בנוסף, MAC אינו מסתיר את ההודעה: אדם שרואה את המידע הגלוי יכול לקרוא אותו גם אם אינו מסוגל לשנותו בהצלחה. אין לבלבל בין MAC בהקשר הזה לבין כתובת MAC ברשת מקומית. השם הזהה אינו קשר בין המנגנונים: הראשון הוא פונקציה קריפטוגרפית עם מפתח, והשנייה היא מזהה המשמש למשלוח מסגרות ואינה הוכחת זהות מאובטחת.</p>\n<h4>המושגים והנחות האבטחה</h4>\n<p>ניתוח קריפטוגרפי מתחיל בשאלה מה רוצים להגן, מה התוקף יודע ואילו פעולות מותרות לו. סודיות פירושה שהמידע אינו נחשף למי שאינו מורשה; שלמות פירושה שאפשר לזהות שינוי לא מורשה; אותנטיות קושרת מידע לגורם שמותר לו ליצור אותו. אלה תכונות שונות, ולכן מנגנון שמצליח במשימה אחת אינו מקבל אוטומטית את האחרות. למשל, הצפנה יכולה להסתיר סכום העברה בלי להוכיח מי בחר אותו, וחתימה יכולה להוכיח מי אישר מסמך בלי להסתיר את תוכנו. הבחנה זו חשובה במיוחד כשנוסח החלופה משתמש במילה הכללית ״מאובטח״.</p>\n<p>עקרון העבודה הוא להניח שהאלגוריתם עצמו ידוע לתוקף, ורק חומר המפתח שנדרש להיות סודי נשאר נסתר. מחפשים אפוא מה תוקף יכול לחשב מתוך המידע הגלוי, ולא מסתמכים על כך שאינו מכיר את התוכנה. גם גודל המפתח אינו מספיק לבדו: המפתח צריך להיבחר כראוי, להישמר בצורה מתאימה ולהיות משויך לתפקיד הנכון. במענה לבחינה יש לנסח את ההנחות במפורש, להראות פעולה קונקרטית של המקבל או של התוקף, ואז להסיק איזו תכונה מתקיימת ואיזו חסרה. הצבעה על שם של אלגוריתם בלי להסביר את תפקידו אינה מוכיחה שהשימוש המסוים בו נכון.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_06112022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q015.html"},{"id":"Q016","year":"2022","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["הגדרה נכונה של IDS מונעת התקפות DNS poisoning","הגדרה נכונה של IPS מאפשרת להגיב להתקפות שזוהו","הגדרה של מחשב עם מיפוי סטטי בין כתובות IP וכתובות MAC יכולה לסייע כנגד התקפות ARP poisoning/spoofing","שימוש ב nmap יכול לסייע לזהות חולשות"],"note":"","sources":[{"file":"2022/689156_06112022_0.pdf","date":"06/11/2022","num":4},{"file":"ללא תאריך/c22b - מקודד.docx.pdf","date":"06/11/2022","num":4},{"file":"ללא תאריך/דוגמא פורמט 2.pdf","date":null,"num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.384,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-03-08\" data-doc=\"original-03\" data-body-words=\"387\"><h3>שאלה 4 — IDS/IPS, ARP ו־nmap — הטענה השגויה</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> IDS מזהה ומתריע; כשלעצמו אינו חוסם חבילות. IPS יכול לבצע חסימה/תגובה. לכן טענה שלפיה עצם הגדרת IDS מונעת הרעלת DNS שגויה. מיפוי ARP סטטי יכול לסייע נגד החלפת המיפוי, ו־nmap מסייע במיפוי שירותים ובבדיקות חולשות מתאימות.</p>\n<h4>ההבדל בין גילוי, מניעה והוכחת תקינות</h4>\n<p>IDS מיועד לניטור ולזיהוי התנהגות חשודה. הוא עשוי לנתח תבניות מוכרות, חריגות בתעבורה או אירועים במחשב, ולהתריע למפעיל. מתן התרעה אינו כשלעצמו עצירת החבילה או ביטול הפעולה שכבר נעשתה. IPS מוסיף יכולת תגובה פעילה, למשל חסימת תעבורה העוברת דרכו. לכן שימוש במילה ״מונע״ לגבי IDS טהור מחליף משימה אחת באחרת. אפשר לבנות מערכת שבה התרעות מפעילות כלים נוספים, אך אז צריך לתאר במפורש את שרשרת התגובה ולא לייחס אותה לשם IDS לבדו.</p>\n<p>גם מנגנון חוסם אינו נותן הבטחה גורפת שכל תקיפה תיעצר. כלל זיהוי עשוי להחמיץ התקפה חדשה או לסווג פעילות רגילה כחשודה. לדוגמה, שרת גיבוי יכול לייצר נפח גדול בלי להיות תוקף, בעוד שניחוש מזהי DNS יכול להיראות כחבילות קצרות רגילות. ההגנה הישירה צריכה להימצא גם בפרוטוקול או בקוד: אימות נתונים, הפרדת תחביר מנתונים, בדיקת הרשאות ועדכון רכיבים פגיעים. סריקה בכלי כמו nmap עוזרת לגלות שירותים וממצאים אפשריים, אבל אינה מוכיחה שהמערכת בטוחה אחרי שהסריקה הסתיימה. בניתוח כל חלופה יש לשאול אם היא מתארת תצפית, אכיפת מדיניות או תכונת בטיחות; אלה תפקידים משלימים שאינם מילים נרדפות.</p>\n<h4>מיפוי כתובות ברשת מקומית</h4>\n<p>ARP מאפשר למחשב ברשת מקומית ללמוד איזו כתובת MAC משמשת יעד מסוים בעל כתובת IP. המחשב זקוק למיפוי כדי לשלוח מסגרת בקישור המקומי, למשל אל שער ברירת המחדל. בפרוטוקול הבסיסי אין חתימה המאמתת שכל הודעת מיפוי אכן נשלחה מבעל הכתובת. תוקף מקומי יכול לנצל זאת ולגרום לקורבן לשמור מיפוי שגוי, כך שמסגרות יגיעו אליו במקום ליעד המקורי. אם הוא מעביר אותן הלאה, הוא עשוי להשיג תיווך בתעבורה בלי לנתק אותה מיד.</p>\n<p>אין צורך שהתוקף כבר יהיה MitM כדי להתחיל הרעלת ARP; לעיתים ההרעלה היא הדרך שבה הוא משיג יכולת זו. עם זאת, הודעות ARP רגילות מוגבלות למקטע הקישור ואינן כלי שמאפשר לכל מחשב מרוחק באינטרנט לשנות טבלה מקומית דרך נתבים. מיפויים סטטיים או בדיקות מתג מתאימות יכולים לצמצם את הסיכון, ואין צורך לבטל כל שימוש בכתובות MAC. מצד שני, כתובת MAC עצמה אינה סוד ואינה הוכחת זהות קריפטוגרפית. גם תוקף ששולט בנתיב אינו מקבל אוטומטית מפתחות TLS תקינים. יש להפריד בין הסבת חבילות ברשת לבין שבירת הגנות שכבות גבוהות, ובין כתובת חומרה המשמשת למשלוח מסגרות לבין הרשאה לבצע פעולה רגישה בממשק אינטרנטי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_06112022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q016.html"},{"id":"Q017","year":"2022","stem":"מניעת התקפת injection, לא תתבצע על ידי:","options":["IDS","חיטוי הקלט בצד השרת","סינון קלט המשמש לביצוע שאילתת ה SQL","חומת אש אפליקטיבית"],"note":"","sources":[{"file":"2022/689156_06112022_0.pdf","date":"06/11/2022","num":5},{"file":"ללא תאריך/c22b - מקודד.docx.pdf","date":"06/11/2022","num":5},{"file":"ללא תאריך/דוגמא פורמט 2.pdf","date":null,"num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.236,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-03-09\" data-doc=\"original-03\" data-body-words=\"386\"><h3>שאלה 5 — איזה אמצעי אינו מונע injection כשלעצמו?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> IDS הוא אמצעי זיהוי ולא חסימה. חיטוי/אימות קלט והגנה אפליקטיבית עשויים לסייע, אך ההגנה המרכזית ל־SQLi היא שאילתות עם פרמטרים המפרידות נתונים מקוד. WAF ורשימות סינון אינן תחליף לתיקון הקוד.</p>\n<h4>הפרדה בין מבנה שאילתה לבין נתוני משתמש</h4>\n<p>SQL injection מתרחשת כאשר קלט משתמש נעשה חלק מתחביר שאילתת מסד נתונים. אם השרת בונה מחרוזת SQL באמצעות שרשור, תוקף עשוי לסגור ביטוי, להוסיף תנאי או לשנות את המשך השאילתה. ההתקפה אינה תלויה בכך שהמשתמש הקליד ערך דרך הטופס הרגיל; כל נתון שמגיע ממקור לא מהימן עשוי להגיע לבניית השאילתה. ההגנה הישירה היא שימוש בפרמטרים קשורים, כך שמנוע המסד מקבל את מבנה הפקודה בנפרד מערכי הנתונים.</p>\n<p>בהתקפה עיוורת היישום אינו מציג את תוצאת השאילתה ישירות. התוקף יכול עדיין לשאול שאלות שהשפעתן נראית בתשובת השרת או בזמן התגובה, ולבנות מידע בהדרגה. למשל הבדל בין דף רגיל לשגיאה עשוי לשמש תשובת אמת או שקר. לכן העלמת הודעות שגיאה אינה תיקון מספק לקוד הפגיע. רשימה שחורה של תווים או מילות מפתח עלולה להחמיץ תחביר חלופי; גם WAF הוא שכבת הגנה נוספת ולא הוכחה שהשאילתה בטוחה. התוצאה יכולה להיות קריאת מידע, שינויו או שתילת תוכן שיוצג אחר כך באתר ויוביל גם ל־XSS. יש לזהות תחילה איזה מפרש מקבל את הקלט, ורק אחר כך לבחור את ההגנה המתאימה; מנגנוני iframe או הצפנת תעבורה אינם משנים את פירוש השאילתה במסד.</p>\n<h4>ההבדל בין גילוי, מניעה והוכחת תקינות</h4>\n<p>IDS מיועד לניטור ולזיהוי התנהגות חשודה. הוא עשוי לנתח תבניות מוכרות, חריגות בתעבורה או אירועים במחשב, ולהתריע למפעיל. מתן התרעה אינו כשלעצמו עצירת החבילה או ביטול הפעולה שכבר נעשתה. IPS מוסיף יכולת תגובה פעילה, למשל חסימת תעבורה העוברת דרכו. לכן שימוש במילה ״מונע״ לגבי IDS טהור מחליף משימה אחת באחרת. אפשר לבנות מערכת שבה התרעות מפעילות כלים נוספים, אך אז צריך לתאר במפורש את שרשרת התגובה ולא לייחס אותה לשם IDS לבדו.</p>\n<p>גם מנגנון חוסם אינו נותן הבטחה גורפת שכל תקיפה תיעצר. כלל זיהוי עשוי להחמיץ התקפה חדשה או לסווג פעילות רגילה כחשודה. לדוגמה, שרת גיבוי יכול לייצר נפח גדול בלי להיות תוקף, בעוד שניחוש מזהי DNS יכול להיראות כחבילות קצרות רגילות. ההגנה הישירה צריכה להימצא גם בפרוטוקול או בקוד: אימות נתונים, הפרדת תחביר מנתונים, בדיקת הרשאות ועדכון רכיבים פגיעים. סריקה בכלי כמו nmap עוזרת לגלות שירותים וממצאים אפשריים, אבל אינה מוכיחה שהמערכת בטוחה אחרי שהסריקה הסתיימה. בניתוח כל חלופה יש לשאול אם היא מתארת תצפית, אכיפת מדיניות או תכונת בטיחות; אלה תפקידים משלימים שאינם מילים נרדפות.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_06112022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q017.html"},{"id":"Q018","year":"2022","stem":"איזו מבין הטענות הבאות נכונה?","options":["ב micro payments, אליס יודעת שבוב ישחרר לה את הכסף שמגיע לה (אחרת הוא יפסיד כסף)","ב escrow transactions, המתווך חייב לאשר את העסקה כדי שהיא תהיה חוקית","בביטקוין, להשתתף בתהליך כריית ביטקוין אם רוצים לבצע עסקאות בביטקוין","בביטקוין, משתמשים ב One Time Pad בכדי לייצר את הארנקים"],"note":"","sources":[{"file":"2022/689156_06112022_0.pdf","date":"06/11/2022","num":6},{"file":"ללא תאריך/c22b - מקודד.docx.pdf","date":"06/11/2022","num":6},{"file":"ללא תאריך/דוגמא פורמט 2.pdf","date":null,"num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.271,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-03-10\" data-doc=\"original-03\" data-body-words=\"507\"><h3>שאלה 6 — micropayments, escrow, כרייה וארנקים</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> במנגנון ערוץ התשלומים הנלמד נבנית אפשרות סגירה/החזר עם התחייבויות ותמריצים שמונעת מהספק להרוויח מעיכוב הכסף; אין צורך לסמוך רק על רצונו הטוב. הטענה מתייחסת למבנה הפרוטוקול המסוים ואינה משפט על כל מוצר המכונה micropayments. ב־escrow מסוג 2-of-3 יכולים הצדדים להסכים בלי המתווך, משתמש רגיל אינו חייב לכרות, וארנק אינו נוצר באמצעות OTP.</p>\n<h4>דוגמה מתוך מנגנון התשלומים שבמצגת</h4>\n<p>במצגת Cryptocurrency בעמודים 216–226 אליס מפקידה כסף לפלט שהוצאתו דורשת את חתימות אליס ובוב. בכל שימוש היא חותמת על עסקה חלופית שמעניקה לבוב את הסכום המצטבר ולעצמה את היתרה. למשל, מערבון של עשר יחידות, העסקה הראשונה עשויה להעניק יחידה לבוב ותשע לאליס, והבאה שתי יחידות לבוב ושמונה לאליס. בוב משלים את חתימתו ומפרסם רק את העסקה האחרונה; העסקאות החלופיות מוציאות את אותו פלט ולכן אינן מתפרסמות כתשלומים נפרדים. בתחילת ההתקשרות מכינים גם עסקת החזר חתומה המחזירה לאליס את הכסף, אבל נעולה עד מועד מוסכם. אם בוב אינו סוגר בזמן הוא מסתכן שאליס תקבל את ההחזר והוא יאבד את התמורה. זהו התמריץ המסוים שבחלופה א, ולא אמירה שמערכת מונעת מאדם לא רציונלי להפסיד בכוונה.</p>\n<h4>תנאי הוצאה, חתימות ותמריצים</h4>\n<p>עסקת ביטקוין אינה הוראה לבנקאי לשנות יתרה; היא מוציאה פלטים קודמים בתנאים שנקבעו עבורם ויוצרת פלטים חדשים. אפשר להשתמש בתנאים מורכבים יותר מחתימה של גורם יחיד. ב־escrow מסוג שניים מתוך שלושה, כל שני בעלי מפתחות מורשים שונים יכולים לשתף פעולה. אם קונה ומוכר מסכימים, חתימות שניהם מספיקות; הבורר נדרש בדרך כלל כשאין הסכמה ואחד הצדדים מבקש שיתוף פעולה ממנו. הוא אינו חייב לחתום בכל מסלול אפשרי.</p>\n<p>ערוץ תשלומים ומנגנוני micropayments מבקשים לאפשר רצף תשלומים קטנים בלי לפרסם כל שינוי בודד כעסקה נפרדת בשרשרת. הבטיחות נשענת על התחייבויות חתומות, תנאי סגירה ולעיתים תנאי זמן או החזר, בהתאם למנגנון הנלמד. התיאור ״הספק יפסיד אם לא ישתף פעולה״ מסביר תמריץ מסוים, ואינו משפט על כל שירות שנקרא תשלום זעיר. צריך לזהות מי יכול להוציא כל פלט ובאיזה מסלול הצד השני מקבל את חלקו. ההבחנה בין אמון באדם לבין אכיפת תנאי קריפטוגרפי חשובה: חתימה תקפה מאפשרת פעולה לפי התנאי, אך אינה הופכת כל צד להוגן. כמו כן, ידיעת כתובת או הוכחת כרייה אינן מחליפות הרשאת הוצאה מתאימה של המטבעות.</p>\n<h4>עסקאות, הרשאת הוצאה ומצב הרשת</h4>\n<p>ביטקוין מתאר בעלות באמצעות פלטי עסקאות שטרם הוצאו, המכונים UTXO. פלט מגדיר סכום ותנאי הרשאה להוצאה עתידית. עסקה חדשה מצביעה על פלטים קודמים ומספקת את הנתונים הדרושים לקיום התנאים, בדרך רגילה חתימה מתאימה. אין צורך להשתתף בכרייה כדי ליצור עסקה או לקבל תשלום. המידע בשרשרת פומבי, ולכן אפשר לעקוב אחר פלטים של כתובת ולחשב יתרה בשרשרת נתונה, אף שהכתובת אינה חושפת בהכרח את זהות האדם או את כל כתובותיו.</p>\n<p>כורה מציע בלוק וצומת מאמת בודק אותו לפי כללי הקונצנזוס. בין הבדיקות נמצאים הרשאות ההוצאה, סכומים, העדר הוצאה כפולה באותו מצב, קישור להורה ותנאים קריפטוגרפיים. פרסום בלוק אינו מאפשר לכותבו לדרוש מאחרים לקבל עסקה בלתי תקפה. יש להבחין בין האפשרות לשנות קובץ מקומי לבין שכנוע הרשת לאמץ היסטוריה אחרת. אישורים נוספים מקשים על החלפת היסטוריה אך אינם הופכים כל קבלה להבטחה מוחלטת בכל מודל תוקף. אין בנקאי מרכזי המתקן תשלום שנשלח ליעד שגוי, וגם יוצר המערכת אינו מחזיק הרשאת ניהול שמאשרת לבדו שינויים. ההתנהגות נקבעת בידי תוכנות המשתתפים וכללי הקבלה שהם אוכפים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_06112022_0.pdf","question_type":"multiple-choice","solution":"solutions/Q018.html"},{"id":"Q019","year":"2022","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["ביצוע התקפת הרעלת DNS מחייבת יכולות MitM","ביצוע התקפת הרעלת ARP אפשרית עם יכולות Off path","ביצוע התקפת DDoS יכולה להתבצע בעזרת Mirai","הצלחה בביצוע התקפת Syn flood קשה יותר אם משתמשים בSyn cookies"],"note":"","sources":[{"file":"2022/689156_06112022_0.pdf","date":"06/11/2022","num":7},{"file":"ללא תאריך/c22b - מקודד.docx.pdf","date":"06/11/2022","num":7},{"file":"ללא תאריך/דוגמא פורמט 2.pdf","date":null,"num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.383,"exam_count":1,"in_sample_exam":true,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-03-11\" data-doc=\"original-03\" data-body-words=\"416\"><h3>שאלה 7 — האם הרעלת DNS מחייבת MitM?</h3><div class=\"answer-body\">\n<p><strong>בחירה: א.</strong> הרעלת DNS יכולה להתבצע גם בידי תוקף מחוץ לנתיב שמזייף תשובות ומנחש מזהים ופורט, בתנאי שהתשובה מתקבלת לפני התשובה האמיתית ובכפוף לבדיקות המקבל. אין הכרח ב־MitM. הרעלת ARP יכולה להתחיל בלי האזנה/שליטה בנתיב, אך בדרך כלל דורשת גישה למקטע הקישור המקומי; ״off-path״ אינו פירושו תוקף אינטרנט מרוחק היכול להעביר ARP דרך נתבים. Mirai מדגים botnet ל־DDoS; SYN cookies מקשות על התשת זיכרון חיבורי TCP חצי פתוחים.</p>\n<h4>התאמת תשובת DNS לשאילתה והזדמנות הזיוף</h4>\n<p>resolver הוא רכיב המבקש תשובה לשם דומיין ושומר תוצאות לזמן מוגבל במטמון. כאשר פרוטוקול התשובה אינו מאומת קריפטוגרפית, רכיב המקבל צריך להחליט אם חבילה באמת שייכת לבקשה פתוחה. בין הנתונים הנבדקים נמצאים המזהה, שם השאילתה, השרת המצופה ופורט המקור של הבקשה. תוקף יכול לזייף מקור של תשובה ולנסות לפגוע בניחוש הערכים הדרושים לפני שמגיעה התשובה האמיתית. כניסה של ערך כוזב למטמון עלולה להשפיע גם על לקוחות נוספים המשתמשים בו.</p>\n<p>תוקף הנמצא בנתיב רואה יותר מידע מתוקף מרוחק שאינו רואה את הבקשה, אך אין פירוש הדבר שרק הראשון יכול לתקוף. אם המרחב לניחוש קטן והתוקף מקבל מספיק הזדמנויות, קיימת גם מתקפת off-path. מזהה אחיד בן שש עשרה סיביות נותן שישים וחמישה אל
