חה</h3>\n<p>במקרה שבו יעד החבילה נמצא מחוץ לרשת המקומית, המחשב בדרך כלל פותר את כתובת החומרה של שער ברירת המחדל ולא של השרת המרוחק. התוקף יכול להתחזות לשער באותו מנגנון עקרוני. גם אז כתובת היעד של חבילת האינטרנט נשארת כתובת השרת; רק התחנה המקומית הראשונה שאליה נמסרת המסגרת הוחלפה. הבחנה זו מונעת בלבול בין הרעלה לשינוי נתיב לוגי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_01_12072026_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q154.html"},{"id":"Q155","year":"2026","stem":"בהקשר של textbook RSA , נתונים המספרים הראשוניים p=5 ו q=7. נוצר מפתח פומבי עם הערך e=11. מהו המפתח הפרטי d המתאים?","options":["11","5","7","13"],"note":"","sources":[{"file":"2026/689156_01_12072026_0 (2).pdf","date":"12/07/2026","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.33,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-13-03\" data-doc=\"original-13\" data-body-words=\"350\"><h2>שאלה 3 — מפתח RSA פרטי</h2><div class=\"answer-body\">\n<p><strong>א — d=11.</strong> מחשבים n=5·7=35 ו־φ(n)=4·6=24. צריך 11d≡1 mod 24. מאחר ש־11·11=121=5·24+1, מתקבל d=11. ב: 11·5≡7; ג: 11·7≡5; ד: 11·13≡23, ולכן אינם הופכיים.</p>\n<h3>בניית המפתח ומשמעות החשבון המודולרי</h3>\n<p>באלגוריתם הנדון בוחרים שני ראשוניים שונים, מכפילים אותם לקבלת המודולוס, ומחשבים את מספר השאריות הזרות למודולוס. במקרה של מכפלת שני ראשוניים המספר הזה הוא מכפלת שני המספרים הקטנים באחד מן הראשוניים. לאחר מכן בוחרים מעריך ציבורי הזר למספר שהתקבל, ומוצאים לו הופכי כפל מודולרי שישמש כמעריך הפרטי. המודולוס משותף לשני המפתחות; החלפתו במספר אחר אינה יוצרת מפתח פרטי מתאים לאותו מפתח ציבורי.</p>\n<p>הדרישה להופכי פירושה שמכפלת שני המעריכים משאירה שארית אחת בחלוקה במספר השאריות הזרות. לכן אין צורך שהמעריכים יהיו שונים, גדולים במיוחד או אחד ראשוני ואחד לא. יש לבדוק את משוואת ההופכי במפורש. באימות חלופות של מפתח, חישוב המכפלה והשארית הוא בדיקה ישירה וקצרה הרבה יותר מניסיון להצפין אוסף מסרים ולקוות שהכול עובד.</p>\n<h3>חתימה, אימות ודרך חישוב יעילה</h3>\n<p>בחתימת ספר לימוד על מסר מספרי מעלים את המסר בחזקת המעריך הפרטי ומצמצמים מודולו המודולוס. לא מצפינים במפתח הציבורי כדי לחתום. כדי לאמת מעלים את החתימה בחזקת המעריך הציבורי ובודקים שחזר המסר. כאשר נדרשים לשחזר מסר מחתימה, זהו אותו כיוון אימות, גם אם השאלה מספקת תחילה דווקא את המעריך הפרטי. ההסבר המקדים לכל שאלה מיישם את התפקידים האלה על המספרים המסוימים שבה.</p>\n<p>אפשר לבצע את החזקות באמצעות ריבועים חוזרים: מחשבים חזקה שנייה, ממנה רביעית וכן הלאה, ובכל שלב שומרים רק את השארית. אחר כך מכפילים את החזקות המתאימות לפירוק הבינארי של המעריך. כך נשמרים מספרים קטנים ונמנעות טעויות של כתיבת מספר עצום. כל המספרים הקטנים בשאלון נועדו להדגים את המתמטיקה ואינם מפתחות בטוחים לשימוש. חתימה מעשית גם אינה חתימת ספר לימוד ישירה על מספר שרירותי; נדרשים גיבוב, קידוד חתימה תקני ובדיקת תקינות של המפתחות כדי למנוע מניפולציות שלא נלמדות מן החשבון הפשוט בלבד.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בדיקה נוספת מועילה היא להחזיר את התוצאה דרך הפעולה ההפוכה: אם חושבה חתימה, מאמתים אותה ומוודאים שחזר המסר; אם נבחר מעריך פרטי, בודקים את מכפלתו במעריך הציבורי. שאריות שליליות מותרות בזמן החישוב, אבל את התוצאה הסופית נוח להציג כנציג שאינו שלילי וקטן מן המודולוס. כך ניתן לזהות מסיח שמייצג מספר גדול או פעולה בכיוון הלא נכון.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_01_12072026_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q155.html"},{"id":"Q156","year":"2026","stem":"כיצד דפדפנים אוכפים את השימוש במנגנון ה-Certificate Transparency (CT)?","options":["הדפדפן דורש שלתעודה יהיו חתימות מלוגרים מוכרים","הדפדפן מבצע אימות מול שרת DNS מאובטח","הדפדפן דורש הצפנה של התעודה במפתח סימטרי","הדפדפן בודק את התעודה מול רשימת ה CRL של ה CA"],"note":"","sources":[{"file":"2026/689156_01_12072026_0 (2).pdf","date":"12/07/2026","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.293,"exam_count":1,"in_sample_exam":false,"variant_group":"V14","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-13-04\" data-doc=\"original-13\" data-body-words=\"371\"><h2>שאלה 4 — אכיפת Certificate Transparency</h2><div class=\"answer-body\">\n<p><strong>א — חתימות של לוגים מוכרים.</strong> הדפדפן בודק SCTs, הבטחות חתומות של לוגים מוכרים לרשום את התעודה, בהתאם למדיניות האמון שלו. ב עוסקת ב־DNS; ג אינה תפקיד CT ואין מפתח סימטרי משותף לדפדפן וללוג; ד עוסקת בביטול תעודות, בעיה אחרת.</p>\n<h3>מדוע שרשרת אמון אינה מספיקה לביקורת הנפקות</h3>\n<p>רשות מוסמכת יכולה להנפיק בטעות תעודה לדומיין שאינו שייך למבקש, או שמפתח שלה עלול להיות מנוצל לרעה. לקוח הבודק רק חתימות עשוי לראות תעודה בעלת שרשרת חוקית, אף שבעל הדומיין האמיתי כלל לא ביקש אותה. שקיפות תעודות מוסיפה יכולת תצפית ציבורית: התעודות והתחייבויות הרישום שלהן מופיעות ביומנים שאפשר לבדוק ולנטר. המטרה אינה להצפין את התעודה או להסתיר את זהות האתר, אלא לאפשר גילוי של הנפקות חריגות גם לאחר שעברו את בדיקת החתימות הרגילה.</p>\n<p>יש להפריד בין הרשות המנפיקה, היומן והמנטר. היומן מקבל תעודות ומנהל מבנה נתונים שניתן לביקורת. המנטר קורא רישומים ומחפש למשל תעודות חדשות עבור דומיינים שהארגון מנהל. בעל דומיין שרואה תעודה שלא הזמין יכול לפתוח בירור ולבקש טיפול. עצם העובדה שתעודה מופיעה ביומן אינה אומרת שהיומן אישר שהמבקש הוא בעל הדומיין; בדיקת הזכאות להנפקה היא אחריות נפרדת.</p>\n<h3>התחייבות חתומה, הוכחת הכלה וביטול</h3>\n<p>חותמת הזמן החתומה היא הבטחה של יומן מסוים לכלול את התעודה בהתאם לכלליו. חתימת היומן מאפשרת לדפדפן לזהות מי נטל את ההתחייבות ולוודא שלא שינו אותה. היא שונה מהוכחת הכלה בעץ מרקל, שמראה כי רשומה מסוימת כבר נכללה במצב מסוים של היומן. הוכחת עקביות נועדה להראות שהיומן גדל באמצעות הוספה ולא שכתב את עברו. מבני הנתונים האלה מאפשרים ביקורת יעילה גם בלי שכל לקוח יוריד כל רשומה.</p>\n<p>דפדפן יכול לדרוש התחייבויות מיומנים שהוא מכיר, בהתאם למדיניותו, ועדיין חייב לבדוק זהות דומיין, שרשרת אמון וזמני תוקף. מנגנוני ביטול כגון רשימות ביטול או תשובות סטטוס פותרים בעיה אחרת: תעודה שהייתה קיימת כעת אינה אמורה להתקבל. רישום פומבי אינו מוחק תעודה ואינו מונע לבדו שימוש במפתח שנגנב. לכן חלופה המחליפה שקיפות בביטול, או טוענת שחותמת היומן פותרת את פרטיות בירור הסטטוס, מבלבלת בין מנגנונים שונים.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>נניח שבעל אתר מגלה ביומן תעודה שהונפקה בשמו בלי ידיעתו. הממצא מאפשר לפתוח בירור מול המנפיק ולנקוט פעולות ביטול והחלפה, אך היומן אינו מתקן לבדו את ההנפקה. זהו ההבדל בין ראיה ציבורית שמסייעת לגילוי ולהרתעה לבין אמצעי אכיפה שמונע קבלת תעודה מסוימת. שני התפקידים משלימים זה את זה ונחוצים בזמנים שונים של הטיפול באירוע.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_01_12072026_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q156.html"},{"id":"Q157","year":"2026","stem":"נתון אתר אינטרנט המוגן היטב מפני CSRF על ידי שימוש ב-Anti-CSRF Tokens ייחודיים לכל סשן. אם תוקף מוצא באתר זה חולשת XSS, האם הוא יכול לבצע פעולות בשם הקורבן (למשל, שינוי סיסמה)?","options":["כן, כי התוקף יכול לגנוב את ה anti-CSRF token בעזרת ה XSS.","לא, מנגנון ה anti-CSRF token יגן וימנע מהתוקף.","לא, חולשת XSS מאפשרת רק גניבת cookies.","כן, אבל רק אם ה anti-CSRF token נוצר במצב CBC."],"note":"","sources":[{"file":"2026/689156_01_12072026_0 (2).pdf","date":"12/07/2026","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.213,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-13-05\" data-doc=\"original-13\" data-body-words=\"378\"><h2>שאלה 5 — XSS מול anti-CSRF token</h2><div class=\"answer-body\">\n<p><strong>א — כן.</strong> קוד XSS רץ בהקשר המקור של האתר ויכול לקרוא את הטוקן מן הטופס ולשלוח בקשה בשם המשתמש. ב מתעלמת מכך שהטוקן כבר נגיש לתוקף בתוך אותו origin. ג שגויה משום ש־XSS מאפשר הרבה מעבר לגניבת עוגיות; ד אינה קשורה למצב הצפנה CBC.</p>\n<h3>כיצד קוד מוזרק מקבל את הרשאות האתר</h3>\n<p>הדפדפן אינו יודע איזו פיסת קוד נכתבה בכוונה בידי מפתח האתר ואיזו נכנסה בגלל חיבור לא בטוח של קלט אל תוכן העמוד. כאשר טקסט שמקורו בפרמטר, במסד נתונים או בכתובת מוכנס להקשר שמפורש כקוד, הוא עלול לרוץ כחלק מן האתר. הסקריפט מקבל אז את ההרשאות של מקור האתר הפגיע, ולא של האתר שבו התוקף הכין את הקלט. זו הסיבה שמדיניות ההפרדה בין מקורות אינה הגנה מספקת לאחר שההזרקה כבר הצליחה.</p>\n<p>בהזרקה מוחזרת השרת מחזיר קלט של הבקשה לתוך התגובה בצורה מסוכנת. בהזרקה שמורה הקלט נשמר קודם, למשל בהודעת משתמש, ומוצג בהמשך למבקרים. בהזרקה מבוססת מסמך הקוד הפגיע שרץ בדפדפן קורא קלט לא אמין ומעביר אותו לפעולה שמפרשת תוכן. חשוב להבדיל בין המיקום שבו נמצאת החולשה לבין המקום שבו הקוד הזדוני רץ: בכל המקרים הנדונים קוד התקיפה רץ בדפדפן, אך במסלול המבוסס על המסמך גם העיבוד הפגיע עשוי להתרחש שם ללא יצירת התוכן הפגום בשרת.</p>\n<h3>מדוע טוקן חבוי אינו מגן מקוד באותו מקור</h3>\n<p>טוקן נגד זיוף בקשות אמור להיות סוד שהתוקף שמפעיל אתר אחר אינו יכול לקרוא, אף שהדפדפן יכול לשלוח עוגיית כניסה אוטומטית. כאשר לתוקף יש קוד בתוך האתר עצמו, ההנחה הזאת נשברת: הקוד יכול לקרוא שדה חבוי, לאתר טופס, ולהגיש בקשה עם הטוקן יחד עם הרשאות הסשן. שדה חבוי מסתיר רכיב מהתצוגה הרגילה, אך אינו מצפין אותו ואינו מסתיר אותו מתוכנית בדפדפן.</p>\n<p>גם שימוש בבקשת שליחה שאינה כוללת פרמטרים בכתובת אינו מונע קריאה של הטוקן מתוך העמוד. בדומה לכך, חסימת קריאת עוגייה בסקריפט אינה מונעת מהסקריפט להפעיל פעולה שהדפדפן שולח אליה את העוגייה בעצמו. ההגנה הראשונית היא מניעת הזרקת הקוד באמצעות קידוד המתאים להקשר, פעולות מסמך בטוחות ומדיניות תוכן משלימה. הגנות אלה פועלות לפני שהקוד מקבל את הרשאות המקור.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>דוגמת פעולה תקינה שהופכת למסוכנת היא הצגת שם משתמש: אם המפתח מכניס את השם באמצעות פעולה שמפרשת תגיות, תו שנועד להיות חלק מהשם עלול לפתוח רכיב פעיל. אם אותו שם מוכנס כטקסט בלבד, התגים מוצגים ולא מבוצעים. ההבדל הוא באופן השימוש בקלט, ולא בהכרח במקור שממנו הגיע או בהרשאות המשתמש שהקליד אותו.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_01_12072026_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q157.html"},{"id":"Q158","year":"2026","stem":"בתהליך ה-TLS Handshake, הלקוח והשרת מחליפים ביניהם מספרים אקראיים (ClientHello.random ו-ServerHello.random). מהי המטרה העיקרית של צירוף ערכים אלו?","options":["להבטיח שהמפתח הסימטרי שיהיה בשימוש יהיה שונה בכל חיבור","לאמת את תעודת השרת","לאפשר הצפנה א-סימטרית מהירה יותר על ידי IV (וקטור איתחול) מתאים.","להסתיר את גרסת ה TLS מפני אויב מאזין."],"note":"","sources":[{"file":"2026/689156_01_12072026_0 (2).pdf","date":"12/07/2026","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"TLS / HTTPS","topic_score":0.283,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-13-06\" data-doc=\"original-13\" data-body-words=\"375\"><h2>שאלה 6 — תפקיד ערכי random ב־TLS</h2><div class=\"answer-body\">\n<p><strong>א — תרומה למפתחות שונים בחיבורים שונים.</strong> ערכי הלקוח והשרת נכללים בגזירת המפתחות ומוסיפים טריות גם כשחומר סודי אחר חוזר. ב: אימות תעודה נעשה באמצעות שרשרת אמון ובדיקות זהות; ג: random אינו IV להצפנה א־סימטרית; ד: גרסת TLS אינה מוסתרת באמצעות ערכים אלה. זהו תיאור מודל TLS שנלמד, ולא טענה שכל מפתח נקבע רק על ידי random.</p>\n<h3>חלוקת התפקידים בהקמת הערוץ</h3>\n<p>בתחילת החיבור הלקוח והשרת עדיין אינם חולקים את מפתחות התעבורה החדשים. הלקוח פותח במשא ומתן על פרמטרים, השרת בוחר מבין האפשרויות המותרות ומציג אמצעי אימות מתאים, ובהמשך הצדדים מפיקים סוד משותף וממנו מפתחות. בהקשר מבוסס תעודות הלקוח בודק שהמפתח שהוצג קשור לשם האתר שאליו התכוון להגיע וששרשרת החתימות מובילה לשורש אמין. קיום חתימה חוקית כשלעצמו אינו מספיק אם התעודה שייכת לאתר אחר או אם אינה בתוקף.</p>\n<p>בשאלות המתארות חילוף מפתחות באמצעות הצפנה במפתח ציבורי של השרת, הלקוח יוצר סוד ראשוני ומצפין אותו כך שרק בעל המפתח הפרטי יוכל לפענחו. זהו מסלול היסטורי, ואין להשליך ממנו שכל חיבור מודרני פועל כך. בחילוף מפתחות זמני מבוסס דיפי–הלמן, מפתח התעודה משמש לאימות פרמטרים והסוד אינו מועבר באותה הצפנת מפתח ציבורי. להבחנה יש משמעות כאשר מפתח התעודה נגנב לאחר הקלטת התקשורת.</p>\n<h3>תמליל מאומת וגזירת מפתחות</h3>\n<p>בסוף הקמת החיבור הצדדים בודקים ערכים התלויים בתמליל הודעות ההקמה ובסודות שהפיקו. כך ניתן לזהות תוקף שהחליף הודעה בדרך גם אם היא נראית תקינה מבחינת התחביר. אם כל צד זוכר תמליל אחר, ערכי האימות אינם תואמים. שינוי שהורס תחביר או מונע הסכמה יכול כמובן לגרום לכשל מוקדם יותר, ולכן יש להבחין בין זיהוי אפשרי לבין זיהוי קריפטוגרפי מובטח בשלב האימות.</p>\n<p>מספרים אקראיים והקשר ההקמה נכללים בגזירת המפתחות כדי להבחין בין חיבורים ולהקטין שימוש חוזר בלתי רצוי בחומר מפתחות. נגזרים מפתחות נפרדים לכיווני התעבורה; באותו כיוון הצד המצפין והצד המפענח משתמשים בסוד הסימטרי המתאים. לאחר ההקמה אין צורך להצפין כל הודעת יישום בעזרת המפתח הציבורי שבתעודה. ההצפנה הסימטרית מגינה על התעבורה, ואימות השלמות מונע שינויים שקטים. כל זאת עדיין תלוי בבדיקה נכונה של זהות השרת ובהגנת המפתחות.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>יש גם להבחין בין מפתח ארוך־טווח שמזהה אתר לבין מפתח זמני של חיבור מסוים. תעודה יכולה לשמש חיבורים רבים, בעוד מפתחות תעבורה חדשים מופקים בכל הקמה מתאימה. לכן ידיעת תעודה ציבורית אינה ידיעת מפתח הפענוח של הסשן. חזרה של תעודת האתר בחיבורים שונים אינה כשלעצמה שימוש חוזר באותו מפתח הצפנה סימטרי לתוכן המשתמשים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_01_12072026_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q158.html"},{"id":"Q159","year":"2026","stem":"אם בבלוק ביטקוין נתון עץ מרקל המכיל 1024 טרנזקציות (עלים). כמה צמתים (hashים) יצטרך לבקש\nלקוח קל (כלומר לקוח שאין לו את כל העץ) מהצומת המלא (זה שיש לו את כל העץ) כדי לאמת שטרנזקציה אחת ספציפית קיימת בבלוק? יש לבחור את התשובה הקרובה ביותר.","options":["10","2","512","1024"],"note":"","sources":[{"file":"2026/689156_01_12072026_0 (2).pdf","date":"12/07/2026","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.227,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-13-07\" data-doc=\"original-13\" data-body-words=\"385\"><h2>שאלה 7 — הוכחת מרקל ל־1024 עלים</h2><div class=\"answer-body\">\n<p><strong>א — 10 ערכי hash.</strong> בעץ בינארי מלא עומק העלה הוא log₂1024=10. הלקוח מקבל בכל רמה את אחיו של הצומת שבידו, מחשב כלפי מעלה ומשווה לשורש האמין בכותרת. ב קטנה מדי; ג וד שולחות כמות ליניארית שאינה נחוצה. החישוב מניח שהטרנזקציה עצמה וכותרת הבלוק ידועות.</p>\n<h3>כיצד מחויבות לשורש נוצרת מן העלים</h3>\n<p>עץ מרקל הוא דרך לצמצם אוסף נתונים לערך קצר שמחייב את כל תוכנו. בעלים נמצאים ערכי גיבוב של פריטי המידע, וכל צומת פנימי מחושב מגיבוב של ערכי ילדיו לפי סדר מוגדר. חוזרים על הפעולה עד שמתקבל ערך יחיד בשורש. אם משנים פריט אחד, משתנה הגיבוב בעלה המתאים, ואז משתנים הקלטים של אביו ושל אבותיו עד השורש. ענף שאין בו את הפריט נשאר עם אותם קלטים, ולכן אינו צריך להשתנות.</p>\n<p>התלות הזאת מסבירה גם מה אינו מתקבל מן העץ: הנתונים אינם מוצפנים. מי שרואה את העסקאות יכול לקרוא אותן, ומי שרואה גיבוב אינו מקבל מכך הרשאה או הוכחה שמי שיצר עסקה היה מורשה. העץ מחייב סדר ואוסף נתונים ומאפשר להוכיח השתייכות אליהם. חוקיות העסקאות, חתימות הבעלים והסכמה על הבלוק הן בדיקות נוספות שמתקיימות במקום אחר במערכת.</p>\n<h3>בניית הוכחה יעילה ובדיקתה</h3>\n<p>כדי להוכיח עלה מסוים אין צורך לשלוח את כל העץ. מספיקים הנתון, הערכים של האחים לאורך הדרך לשורש ומיקומו של כל אח ביחס לצומת שכבר חושב. המקבל מחשב בכל רמה את גיבוב ההורה ומשווה בסיום לשורש שהוא כבר סומך עליו. אם השורש נמסר רק בידי אותו גורם לא אמין שמסר את ההוכחה, התוקף יכול להמציא עץ משלו; לכן מקור האמון בשורש הוא חלק הכרחי מן הפרוטוקול.</p>\n<p>בעץ בינארי מלא כל רמה מכפילה את מספר העלים שניתן להכיל, ולכן מספר ערכי ההוכחה גדל לוגריתמית ולא ביחס ישר למספר הפריטים. הכפלת מספר העלים מוסיפה רק רמה אחת. כאשר מספר העלים אינו חזקה של שתיים, נדרש כלל מוגדר לטיפול בעלה ללא אח או למבנה העץ, אך עדיין רק אבות הנתון תלויים בו. הטענה ששינוי בהכרח משנה גיבוב מניחה את מודל הביטחון של פונקציית הגיבוב: באופן מתמטי יכולה להיות התנגשות, אלא שבפונקציה מתאימה לא אמורה להיות לתוקף דרך מעשית לייצר אותה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בעת אימות הוכחה סדר הצירוף הוא מידע מהותי: גיבוב של ילד שמאלי ואחריו ימני אינו בהכרח שווה לגיבוב באותו סדר הפוך. לכן רשימת ערכי אחים בלי מיקומים או בלי דרך להסיק אותם אינה מספיקה בכל פורמט. במקרה הביטקוין גם כותרת הבלוק צריכה להיות קשורה לשרשרת שהלקוח מקבל, אחרת הוכחה נכונה לעץ מומצא אינה מועילה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_01_12072026_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q159.html"},{"id":"Q160","year":"2026","stem":"אתר אינטרנט רוצה להבטיח שדפדפנים תמיד ייגשו אליו דרך HTTPS בלבד, גם אם המשתמש מקליד ידנית http://. איזה מנגנון מאפשר זאת?","options":["HTTP Strict Transport Security (HSTS).","Same Origin Policy.","Certificate Transparency.","OCSP Stapling."],"note":"","sources":[{"file":"2026/689156_01_12072026_0 (2).pdf","date":"12/07/2026","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"TLS / HTTPS","topic_score":0.312,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-13-08\" data-doc=\"original-13\" data-body-words=\"377\"><h2>שאלה 8 — כפיית HTTPS</h2><div class=\"answer-body\">\n<p><strong>א — HSTS.</strong> לאחר שהדפדפן מכיר את המדיניות הוא משדרג גישה ל־HTTP ל־HTTPS. ב היא מדיניות גישה בין מקורות; ג שקיפות תעודות; ד העברת סטטוס ביטול. הסתייגות חשובה: להבטחה כבר בביקור הראשון נדרש HSTS preload או ידע קודם; כותרת HSTS לבדה אינה פותרת את הביקור הראשון.</p>\n<h3>כיצד הדפדפן לומד שאין להשתמש בחיבור פתוח</h3>\n<p>כאשר משתמש מקליד כתובת שאינה מציינת ערוץ מוצפן, או פותח קישור המתחיל בפרוטוקול פתוח, הפניה רגילה של השרת לערוץ מוצפן מגיעה רק אחרי שהבקשה הראשונה כבר יצאה. תוקף השולט בדרך עשוי לנצל את הבקשה הזאת כדי לשנות את ההפניה או להחזיר תוכן משלו. מדיניות אבטחת תעבורה מחמירה מאפשרת לדפדפן לזכור מראש שעבור שם אתר מסוים אין להתחיל בערוץ הפתוח, אלא לשדרג מקומית לערוץ מוצפן עוד לפני יציאת הבקשה.</p>\n<p>במסלול הלמידה הרגיל האתר שולח כותרת מדיניות בתגובה שהתקבלה בחיבור מוצפן ומאומת. הכותרת כוללת משך זמן שבו המדיניות נשמרת, ולעיתים מציינת שגם שמות המשנה נכללים. הדפדפן אינו אמור לסמוך על הוראה כזאת שנשלחה בחיבור פתוח, כי תוקף יכול היה ליצור אותה. לאחר שלמד את המדיניות, גם הקלדה מפורשת של כתובת פתוחה לא מחייבת שליחת בקשה פתוחה בפועל.</p>\n<h3>בעיית הביקור הראשון והמשמעות של טעינה מראש</h3>\n<p>הזיכרון המקומי אינו פותר לבדו ביקור בדפדפן שמעולם לא פגש את האתר. לרשימת טעינה מראש יש תפקיד שונה: המידע שהאתר מחייב ערוץ מוצפן נכלל במידע שמופץ עם הדפדפן, ולכן ניתן לשדרג גם בביקור הראשון. זאת הנקודה שמכריעה בשאלה אם אפשר להבטיח את המדיניות ללקוחות חדשים לגמרי, ולא רק לאלו שכבר קיבלו כותרת תקפה.</p>\n<p>המנגנון אינו מאמת בעצמו שתעודת השרת הונפקה כראוי, אינו מחליף שרשרת אמון ואינו מאחסן סטטוס ביטול תעודה. הוא קובע באיזה סוג ערוץ מותר לנסות להשתמש, והערוץ המוצפן עדיין צריך לעבור את בדיקותיו הרגילות. גם הגבלת גישה בין מקורות וטוקנים נגד זיוף בקשות פותרים בעיות אחרות: אתר יכול לחייב הצפנה ועדיין להיות פגיע לקוד מוזרק או לפעולה שנשלחה ללא כוונת המשתמש. יש גם משמעות להגדרת שמות המשנה ולמשך המדיניות; הצהרה על אתר אחד אינה מחילה אוטומטית מדיניות על כל אתר בעל שם דומה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>הפניה של השרת והחלטה מקומית של הדפדפן עשויות להיראות למשתמש דומות, משום שבשתיהן הוא מגיע בסוף לכתובת מוצפנת. מבחינת תוקף רשת ההבדל מכריע: בהפניה כבר נשלחה בקשה ראשונה שניתן להשפיע עליה, ובהחלטה מקומית היא כלל לא יוצאת בערוץ הפתוח. לכן לא די לבדוק את הכתובת הסופית; צריך להבין מה קרה לפני תחילת התקשורת.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_01_12072026_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q160.html"},{"id":"Q161","year":"2026","stem":"מהי המטרה המרכזית של הגדרת Header מסוג Content Security Policy (CSP) בתגובות שרת Web?","options":["להגדיר לדפדפן מאילו origins מותר לו לטעון ולהריץ משאבים בעמוד מה שיכול לסייע כנגד התקפות XSS.","למנוע מהמשתמש לבצע פעולות רגישות ללא הזנת Anti-CSRF token בכל טופס מחדש.","שמירת הסודיות של תוכן ה HTML המועבר בין השרת ללקוח כנגד אויב מאזין.","להנחות את הדפדפן לאמת את תעודת ה TLS של האתר מול יומני ה Certificate Transparency."],"note":"","sources":[{"file":"2026/689156_01_12072026_0 (2).pdf","date":"12/07/2026","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.199,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-13-09\" data-doc=\"original-13\" data-body-words=\"367\"><h2>שאלה 9 — מטרת CSP</h2><div class=\"answer-body\">\n<p><strong>א — להגביל מקורות ומשאבים שהדפדפן רשאי לטעון ולהריץ.</strong> למשל script-src מצמצמת הרצת JavaScript וכך מסייעת נגד XSS. ב מתארת טוקני CSRF ולא CSP; ג היא סודיות תעבורה שמספק TLS; ד עוסקת ב־CT. CSP מסייעת להגנה ואינה תחליף לקידוד פלט תקין.</p>\n<h3>מדיניות שמגבילה מה העמוד רשאי לטעון</h3>\n<p>דף אינטרנט הוא מסמך שמסוגל לטעון רכיבים ממקורות רבים: קוד, תמונות, גופנים, מסגרות ועוד. בלי מגבלה נוספת, חולשת הזרקה עשויה לאפשר לתוקף להוסיף הוראה שטוענת קובץ קוד משרת שבשליטתו. מדיניות אבטחת תוכן מאפשרת לשרת למסור לדפדפן רשימת כללים שמגדירה אילו סוגי משאבים רשאים להגיע מאילו מקורות. הדפדפן אוכף את הכללים בזמן הטעינה או ההרצה, גם אם תגית שמבקשת משאב אסור כבר נמצאת במסמך.</p>\n<p>למשל, מדיניות שמאפשרת סקריפטים רק ממקור האתר יכולה לחסום תגית שמפנה לקובץ קוד באתר תוקף. אפשר להגדיר הוראות נפרדות לסקריפטים, תמונות וחיבורים, ולשלב מזהים אקראיים או גיבובים כדי לאשר קוד מסוים. המנגנון אינו מנחש מה בטוח מתוך שם הקובץ; הוא אוכף את המדיניות שהאתר ניסח. משום כך מדיניות רחבה מדי, או מקור מורשה שמאפשר לתוקפים להעלות תוכן פעיל, עלולים להשאיר מסלול תקיפה.</p>\n<h3>ההבדל מהצפנה ומאימות בקשות</h3>\n<p>הכללים אינם מצפינים את המסמך ואינם מסתירים אותו ממאזין בדרך. סודיות התעבורה ניתנת באמצעות ערוץ מוצפן. הם גם אינם דורשים מהמשתמש להקליד טוקן לכל פעולה, ואינם מחליפים אימות שהבקשה אכן נוצרה מתוך הטופס והסשן המתאימים. אתר יכול לקיים מדיניות תוכן טובה ובכל זאת לקבל בקשת פעולה מזויפת אם אינו בודק את מקור הכוונה וההרשאה.</p>\n<p>תפקידה העיקרי בהקשר השאלה הוא שכבת צמצום נזק מול הזרקת תוכן פעיל. היא משלימה קידוד פלט נכון ואינה מבטלת את הצורך בו, משום שלא כל תוכן מסוכן חייב להגיע מקובץ חיצוני חדש. גם שקיפות תעודות ובדיקת ביטול אינן שייכות לכללים האלה: הן עוסקות בזהות מפתח האתר ובתוקף האמון בו, בעוד כאן מגדירים התנהגות של המסמך לאחר שהגיע לדפדפן. בעת ניתוח חלופות צריך לבדוק איזה נכס כל מנגנון מגן עליו, ולא לבחור לפי כך שכל השמות קשורים באופן כללי לאבטחת רשת.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>רכיב מורשה אינו בטוח רק משום שהוא נטען מכתובת שמופיעה ברשימה. אם האתר מאפשר למשתמש לפרסם קובץ קוד באותו מקור מורשה, הזרקה עשויה לנצל אותו בלי לטעון כתובת חיצונית. לכן ניסוח המדיניות צריך להתאים למבנה האתר ולשליטת המשתמשים בתוכן. זו דוגמה לגבול מעשי שמסביר מדוע מדיניות משלימה נדרשת לצד טיפול נכון בקלט ובפלט.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_01_12072026_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q161.html"},{"id":"Q162","year":"2026","stem":"טרנזקציה טיפוסית וסטנדרטית במערכת הביטקוין משתמשת בסקריפט הניתוב הנפוץ P2PKH (Pay to Public Key Hash). בתהליך הפדיון (כלומר בזבוז המטבעות), מה בדיוק חייב המשתמש לספק ב Input Script שלו כדי להוכיח לכורים כי הכסף אכן שייך לו?","options":["את ה public key של הארנק שלו וחתימה דיגיטלית שנחתמה בעזרת ה private key של הארנק שלו.","את תוצאת ה hash על ה public key של הארנק שלו וחתימה דיגיטלית שנחתמה בעזרת ה public key של הארנק שלו.","את תוצאת ה hash על ה public key של הארנק שלו וחתימה דיגיטלית שנחתמה בעזרת ה private key של הארנק שלו.","את ה public key של הארנק שלו וחתימה דיגיטלית שנחתמה בעזרת ה public key של הארנק שלו."],"note":"","sources":[{"file":"2026/689156_01_12072026_0 (2).pdf","date":"12/07/2026","num":10}],"topic":"ביטקוין ובלוקצ׳יין","topic_manual":true,"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-13-10\" data-doc=\"original-13\" data-body-words=\"387\"><h2>שאלה 10 — פדיון P2PKH</h2><div class=\"answer-body\">\n<p><strong>א — המפתח הפומבי וחתימה במפתח הפרטי המתאים.</strong> בסקריפט הפדיון מקובל הסדר [Signature] [Public Key]. HASH160 של המפתח הפומבי חייב להתאים לערך הנעול, ו־CHECKSIG מאמת את החתימה. ב וד מציעות חתימה במפתח פומבי, שאינו מפתח חתימה; ג מספקת רק hash במקום המפתח הפומבי הדרוש לאימות. המפתח הפרטי לעולם אינו נשלח לכורים.</p>\n<h3>נעילת פלט והוכחת הזכות להוציא אותו</h3>\n<p>בביטקוין אין צורך שהארנק ימסור את המפתח הפרטי לכורה או לשרת מרכזי. פלט של עסקה קודמת מכיל תנאי נעילה, ועסקה שמנסה להוציא אותו צריכה לספק נתונים שמקיימים את התנאי. בתבנית הנדונה התנאי מתייחס לגיבוב של מפתח ציבורי מסוים, ולכן המוציא מציג את המפתח עצמו וחתימה שנוצרה באמצעות הפרטי המתאים. אלה שני תפקידים משלימים: המפתח מאפשר לבדוק שהפונה מתאים לזהות הנעולה, והחתימה מוכיחה יכולת שימוש בסוד.</p>\n<p>אפשר לחשוב על ההבדל בין כתובת למשלוח מכתב לבין חתימה המאשרת הוראת תשלום. כתובת היעד אינה עצמה הרשאה לבצע פעולה, ובאותו אופן ידיעת גיבוב המפתח אינה הוכחת שליטה במטבעות. הגיבוב רשום כבר בפלט הציבורי וכל אחד יכול להעתיק אותו. לכן חלופה שמספקת רק מפתח ציבורי וגיבוב, ללא חתימה, אינה מסוגלת להוכיח שהמוציא מחזיק במפתח הפרטי.</p>\n<h3>ביצוע הסקריפט על המחסנית</h3>\n<p>סדר הנתונים חשוב משום שסקריפט פועל באמצעות מחסנית: כל פעולה לוקחת פריטים שהוכנסו לפניה ומחזירה תוצאה או נכשלת. תחילה נדחפות החתימה והמפתח הציבורי. פעולת השכפול משאירה עותק של המפתח לשלב אימות החתימה, בעוד העותק האחר נשלח לגיבוב. ערך הגיבוב המחושב מושווה לערך שנכתב בתנאי הנעילה. אם הם שונים הבדיקה נכשלת מיד; אם הם שווים, נותר לבדוק את החתימה בעזרת המפתח הציבורי המקורי.</p>\n<p>הבדיקה האחרונה קושרת את ההרשאה לעסקה שעליה נחתם. בתנאי חתימה רגילים אי אפשר להעתיק חתימה לעסקה אחרת עם נמענים אחרים ולצפות שתאומת, משום שהתוכן הנחתם השתנה. כשמציגים בשאלה את הסקריפט המשולב, צריך אפוא לעקוב לא רק אחרי רשימת המילים אלא גם אחרי סדר הדחיפה, אילו פריטים נשארים ואיזו פעולה צורכת אותם. היעדר פעולת אימות חתימה הוא כשל מהותי בתבנית התקנית, גם אם רצף אחר מסוגל לסיים ריצה בתנאים מסוימים. הציבוריות של המפתח אינה פוגעת בסודיות הפרטי, ואין צורך או הצדקה לחשוף את הפרטי במהלך הפדיון.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>מפתח ציבורי שאינו תואם לגיבוב הנעול ייכשל עוד לפני בדיקת החתימה, גם אם החתימה תקינה עבור אותו מפתח אחר. לעומת זאת, מפתח מתאים בלי חתימה נכונה יעבור את השוואת הגיבוב וייכשל בשלב האחרון. חלוקת הכשל לשני שלבים מבהירה מדוע שניהם הכרחיים: זיהוי תנאי היעד והוכחת הרשאה הם בדיקות שונות, ואין נתון יחיד המחליף את שניהם.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_01_12072026_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q162.html"},{"id":"Q163","year":"2026","stem":"להלן פסאודו-קוד המציג פונקציה המטפלת במידע בצורה קריפטוגרפית:\n```\nfunction foo(key_encryption, key_mac, ciphertext, tag):\n    if VerifyMAC(key_mac, ciphertext) != tag:\n        return \"Invalid!\"\n    else:\n        return Decrypt(key_encryption, ciphertext)\n```\nמהי השיטה הנמצאת בשימוש על פי קוד זה?","options":["Encrypt then MAC","MAC then Encrypt","MAC and Encrypt","Digital signatures"],"note":"","sources":[{"file":"2026/File_0_689156_01_09082026_0.pdf","date":"09/08/2026","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.348,"exam_count":1,"in_sample_exam":false,"variant_group":"V12","accepted_indices":[0],"answer_html":"<p><strong>Encrypt then MAC.</strong> הקוד בודק תג על ciphertext ורק לאחר הצלחה מפענח אותו. זהו סדר הפעולות המקביל בצד השולח: C=Enc(Ke,M), ואז T=MAC(Km,C). המקבל מחשב או מאמת תג על אותו C בעזרת Km; אם אין התאמה, הוא דוחה. רק אחרי אימות הוא מפעיל Dec(Ke,C).</p><p>ב-MAC then Encrypt התג מחושב על plaintext ונארז יחד איתו בתוך ההצפנה; המקבל נאלץ לפענח לפני בדיקת התג. ב-Encrypt and MAC מצפינים את M ובמקביל מחשבים תג על M. לכן לא מספיק לראות גם Decrypt וגם MAC: צריך לזהות מהו הקלט לתג והאם הבדיקה קודמת לפענוח.</p><p>זו אינה חתימה דיגיטלית: נעשה שימוש במפתח MAC סודי משותף, ולכן גם בוב שמכיר אותו יכול ליצור תג. אין בכך אי-התכחשות פומבית. שמות המשתנים מציינים מפתחות נפרדים, וזו הפרדה חשובה; במימוש אמיתי נדרשים גם אלגוריתמים וקידוד מתאימים, השוואת תג בטוחה והכללת ה-IV וההקשר הנדרשים באימות.</p><p>השם VerifyMAC בקוד אינו חתימה של API מסוים: לפי הפסאודו-קוד משווים את התוצאה ל-tag. קוראים אותו כפי שהשאלה מגדירה, ולא מנסים להסיק שגיאה בגלל שם פונקציה. התג מאמת שהצופן לא השתנה ושנוצר בידי בעל מפתח מתאים; הוא אינו מבטיח טריות. כדי למנוע replay צריך לאמת גם מספר רצף או מזהה הודעה ולדחות חזרות.</p>","answer_origin":"פתרון חדש שנכתב ונבדק במסגרת עדכון נובמבר 2026","question_type":"multiple-choice","solution":"solutions/Q163.html"},{"id":"Q164","year":"2026","stem":"עבור n=23 ו g=3, אליס ובוב מבצעים פרוטוקול Diffie-Hellman. אליס שלחה לבוב את המספר 13 ובוב\nשלח לה את 4. מהו המפתח המשותף שיצא להם בסוף התהליך?","options":["12","10","13","17"],"note":"","sources":[{"file":"2026/File_0_689156_01_09082026_0.pdf","date":"09/08/2026","num":2}],"flags":["table?"],"fixed_order":false,"exclude":false,"topic":"דיפי-הלמן והחלפת מפתחות","topic_score":0.453,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<p><strong>המפתח המשותף הוא 12.</strong> נתונים p=23, g=3 והערכים הפומביים A=13, B=4. לצורך תרגיל במספרים קטנים אפשר למצוא מעריך סודי מתאים באמצעות חזקות עוקבות. מתקבל 3⁴ mod 23=12, ‏3⁵ mod 23=13, ‏3³ mod 23=4. לכן אפשר לבחור a=5 ו-b=3.</p><p>כעת K=Bᵃ mod p=4⁵ mod 23. מחשבים 4²=16; ‏4⁴ mod 23=256 mod 23=3; ואז 4⁵ mod 23=12. מהכיוון השני 13³ mod 23=12. זו בדיקה עצמאית שנותנת את אותו מפתח בשני הצדדים.</p><p>אין להכפיל את הערכים הפומביים 13×4 ולקרוא לתוצאה מפתח. אין גם להעלות g בחזקת סכום המעריכים: המפתח הוא g^(ab), והערכים הציבוריים הם g^a ו-g^b. במימוש אמיתי הקבוצה גדולה ומציאת מעריך מתוך ערך ציבורי אמורה להיות קשה. כאן המספרים קטנים במכוון כדי לאפשר חשבון ידני.</p><p>הפרוטוקול הבסיסי ללא אימות אינו מונע MitM פעיל שיחליף ערכים וייצור סוד נפרד עם כל צד. החישוב הנכון של K בהעדר התקפה אינו הוכחת זהות. זו הבחנה שנבחנה גם בשאלות המילוליות על DH, ולכן כדאי לתרגל יחד את האלגברה ואת מודל התוקף.</p>","answer_origin":"פתרון חדש שנכתב ונבדק במסגרת עדכון נובמבר 2026","question_type":"multiple-choice","solution":"solutions/Q164.html"},{"id":"Q165","year":"2026","stem":"בביטקוין, מהי מטרתו העיקרית של שימוש במבנה נתונים מסוג 'עץ מרקל' עבור אוסף הטרנזקציות שבתוך הבלוק?","options":["לאפשר ללקוחות שלא מחזיקים את כל הבלוקצ׳יין המלא אפשרות לאמת האם טרנזקציה נכללת בבלוק ספציפי.","למנוע מצב של double spending על ידי תכונת הסודיות שהעץ מבטיח.","להצפין את הטרנזקציות כך שרק הקלטים והפלטים של הטרנזקציה יוכלו לראות את סכום ההעברה בטרנזקציה.","עץ מרקל מבטיח שfork יתבצע רק אם רמת הקושי למציאת nonce לא השתנתה במשך 3 בלוקים."],"note":"","sources":[{"file":"2026/File_0_689156_01_09082026_0.pdf","date":"09/08/2026","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.257,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<p><strong>עץ מרקל מאפשר הוכחת הכללה יעילה.</strong> הלקוח מחזיק שורש מאומת, מחשב hash של הטרנזקציה ומקבל את ערכי האחים במסלול אל השורש. בכל רמה הוא מחבר לפי סדר שמאל/ימין נכון ומחשב hash חדש. אם התוצאה שווה לשורש הידוע, התקבלה ראיה שהטרנזקציה נכללת ברשימה שאליה השורש מתחייב, תחת הנחות בטיחות ה-hash.</p><p>בעץ מושלם עם 2^k עלים דרושים k ערכי אחים, ולכן ההוכחה קצרה בהרבה מהבלוק כולו. יש צורך לדעת גם את סדר האחים. אם השורש עצמו הגיע ממקור לא מהימן, תוקף יכול לבנות עץ משלו; בדיקת הכללה ביחס אליו אינה מוכיחה שזהו הבלוק שהרשת קיבלה.</p><p>העץ אינו מצפין טרנזקציות, אינו מספק סודיות ואינו קובע לבדו אם אותו UTXO כבר בוזבז. הוא גם אינו מגביל forks לפי שלושה בלוקים או לפי שינוי nonce. חוקיות השרשרת, הוכחת העבודה וכללי אימות הטרנזקציות הם שכבות נוספות.</p><p>מבחינת תרגול, הפרידו בין ״העסקה ברשימה״, ״העסקה חוקית״ ו״הרשימה נמצאת בהיסטוריה המקובלת״. ההוכחה הקצרה עונה ישירות רק על הראשונה ביחס לשורש שסומכים עליו. זו אותה משפחת רעיונות כמו שאלת ספירת hashes מיולי 2026, אבל הפעם נבחן התפקיד ולא המספר.</p>","answer_origin":"פתרון חדש שנכתב ונבדק במסגרת עדכון נובמבר 2026","question_type":"multiple-choice","solution":"solutions/Q165.html"},{"id":"Q166","year":"2026","stem":"עבור הצפנת AES במצב ECB, מה המשפט הנכון:","options":["התוקף יכול לגלות חזרות שהופיעו בטקסט המקורי.","הצפנת בלוק תלויה בהצפנת הבלוק לפניו, ולכן זה מצב בטוח יותר מ-CBC.","AES הוא Stream Cipher, ולכן הצפנת כל תו שונה מהצפנת התו הקודם.","אחד מתוצרי הלוואי של הפעולה מאפשר וידוא integrity של ההודעה, ביעד."],"note":"","sources":[{"file":"2026/File_0_689156_01_09082026_0.pdf","date":"09/08/2026","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.247,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<p><strong>ECB חושף חזרות של בלוקים.</strong> תחת אותו מפתח, הצפנת בלוק היא פונקציה דטרמיניסטית וחד-חד-ערכית: אם Pᵢ=Pⱼ אז Eₖ(Pᵢ)=Eₖ(Pⱼ). לכן צופה ב-ciphertext יכול לזהות בלוקים זהים גם בלי לדעת מה תוכנם. אין צורך לשבור את AES עצמו.</p><p>החזרה היא ברמת בלוק של AES, שאורכו 128 ביט, ולא בהכרח ברמת אות. שתי אותיות זהות בתוך בלוקים שונים אינן מבטיחות בלוקים מוצפנים זהים. יישור גבולות הבלוקים חשוב: מחרוזת חוזרת בהיסט שאינו כפולה של אורך הבלוק אינה בהכרח יוצרת אותה תבנית.</p><p>ECB אינו משרשר את הבלוק הקודם; זו בדיוק אחת ההבחנות בינו לבין CBC. AES הוא צופן בלוקים, לא צופן זרם שמצפין כל תו בנפרד. הצפנת ECB גם אינה מספקת שלמות: תוקף יכול לשנות או להחליף בלוקים בלי שתג אימות מובנה יחשוף זאת, כי אין תג כזה.</p><p>הגנה על מידע אינה מסתכמת בבחירת אלגוריתם חזק. יש לבחור גם mode ופרמטרים מתאימים ולאמת את הנתונים. בשאלה נדרש לזהות דליפת דפוסים במצב ההפעלה, לא לטעון שכל השימושים ב-AES חלשים. ניסוי נייר מועיל: כתבו P,Q,P והצפינו סימבולית ל-A,B,A; כך רואים בדיוק מה נחשף ומה נשאר לא ידוע.</p>","answer_origin":"פתרון חדש שנכתב ונבדק במסגרת עדכון נובמבר 2026","question_type":"multiple-choice","solution":"solutions/Q166.html"},{"id":"Q167","year":"2026","stem":"בהנחה שקבוצת כורים זדונית מצליחה להשיג 51% מכוח החישוב (Hash Power) הכולל ברשת הביטקוין, אילו מהפעולות הבאות הם אינם יכולים לבצע?","options":["אינם יכולים לשחזר את המפתחות הפרטיים של ארנקים.","אינם יכולים לשנות את היסטוריית הבלוקים האחרונה ולבצע double spending.","אינם יכולים להתעלם מעסקאות של משתמשים ספציפיים.","אינם יכולים להתעלם מבלוקים שנכרו על ידי ה 49% האחרים."],"note":"","sources":[{"file":"2026/File_0_689156_01_09082026_0.pdf","date":"09/08/2026","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.195,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<p><strong>רוב כוח כרייה אינו מאפשר לשחזר מפתחות פרטיים.</strong> כוח hash קשור לתחרות על יצירת בלוקים והעבודה המצטברת של ענפים. הוא אינו מעניק פתרון לבעיה הקריפטוגרפית שעליה נשענות החתימות, ואינו מאפשר להוציא פלט של אדם אחר ללא ההרשאה הדרושה.</p><p>רוב זדוני יכול לנסות לצנזר עסקאות, לבנות ענף חלופי ולשנות את ההיסטוריה האחרונה כך שעסקה שלו תוחלף בהוצאה סותרת. הוא יכול לכרות בלי לכלול בלוקים של אחרים ולהתחרות בענף שלהם. לכן הטענות שאינו יכול לעשות זאת הן המסיחים, בעוד אי-היכולת לשחזר מפתחות היא הגבול הנכון.</p><p>גם בעל רוב אינו יכול לשכנע צמתים מאמתים לקבל בלוק שעובר על כללי הקונצנזוס שלהם רק משום שיש לו הרבה עבודה. חתימה בלתי תקינה, יצירת מטבעות מעבר לכללים או הוצאה של פלט שאינו קיים אינן נעשות חוקיות מעצמן. צריך להבחין בין החלפת סדר/בחירת היסטוריה תקפה לבין שינוי חוקי האימות.</p><p>הניסוח ״אינם יכולים״ חשוב: מחפשים מגבלה של התוקף, לא פעולה שבדרך כלל מזוהה עם מתקפת 51%. המתנה לאישורים נועדה להפחית סיכון תחת מודל מתאים, אבל אינה הופכת רוב זדוני מתמשך לחסר יכולת. הבנה זו משלימה את שאלת ששת האישורים מאוקטובר 2026.</p>","answer_origin":"פתרון חדש שנכתב ונבדק במסגרת עדכון נובמבר 2026","question_type":"multiple-choice","solution":"solutions/Q167.html"},{"id":"Q168","year":"2026","stem":"בצופן בלוקים בשיטת CBC , נניח ומצפינים 10 בלוקים, ונתון שביט אחד בבלוק השני השתבש במהלך שידור ה ciphertext. כיצד הדבר ישפיע על הפענוח בצד המקבל?","options":["הבלוק השני של הplaintext שהתקבל בפענוח יהיה שונה לחלוטין מהבלוק השני בplaintext המקורי שהוצפן, והבלוק השלישי בplaintext שהתקבל בפענוח יהיה שונה בדיוק בביט אחד לעומת הplaintext המקורי שהוצפן.","כל הבלוקים החל מהבלוק השני יהרסו לחלוטין.","הבלוק השלישי של הplaintext שהתקבל בפענוח יהיה שונה לחלוטין מהבלוק השלישי בplaintext המקורי שהוצפן, והבלוק השני בplaintext שהתקבל בפענוח יהיה שונה בדיוק בביט אחד לעומת הplaintext המקורי שהוצפן.","הבלוק השני של הplaintext שהתקבל בפענוח יהיה שונה לחלוטין מהבלוק השני בplaintext המקורי שהוצפן, אבל הבלוק השלישי בplaintext שהתקבל בפענוח יהיה זהה בדיוק לבלוק השלישי בplaintext המקורי שהוצפן."],"note":"","sources":[{"file":"2026/File_0_689156_01_09082026_0.pdf","date":"09/08/2026","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.223,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<p><strong>בלוק 2 מתערבל, ובבלוק 3 מתהפך בדיוק הביט המקביל.</strong> נוסחת פענוח CBC היא Pᵢ=Dₖ(Cᵢ) XOR Cᵢ₋₁. שינוי ביט בתוך C₂ משנה את הקלט ל-Dₖ בחישוב P₂; עבור צופן טוב השינוי מתפזר על פני הבלוק, ולא ניתן לחזות אילו ביטים ישתנו.</p><p>בחישוב P₃, לעומת זאת, C₂ מופיע אחרי הפענוח כחלק מ-XOR. לכן אם C₂′=C₂ XOR Δ, מתקבל P₃′=P₃ XOR Δ. כש-Δ כולל ביט אחד, בדיוק הביט הזה משתנה ב-P₃. ב-P₄ משתמשים ב-C₄ וב-C₃, שלא השתנו, ולכן ההתפשטות נעצרת.</p><p>P₁ אינו נפגע. החלופה שטוענת שכל הבלוקים מהשני והלאה נהרסים מבלבלת בין שרשרת ההצפנה לבין שימוש ב-ciphertext שכבר התקבל בפענוח. החלופה המהפכת בין שני הבלוקים מתעלמת מהמיקום של Dₖ; והטענה ש-P₃ נשאר זהה מתעלמת מה-XOR עם C₂.</p><p>״שונה לחלוטין״ בנוסח הבחינה מתאר אפקט ערבול, ולא הבטחה שכל ביט ב-P₂ מתהפך. בצופן אידאלי מצפים שכמחצית מהביטים ישתנו בממוצע. הניתוח מניח CBC ללא אימות שדוחה את ההודעה קודם; בסכמה מאומתת תקינה שינוי בתעבורה צריך לגרום לדחייה, ולא לקבלת plaintext ששונה. כתיבת נוסחת הפענוח לפני קריאת החלופות מונעת את רוב הטעויות.</p>","answer_origin":"פתרון חדש שנכתב ונבדק במסגרת עדכון נובמבר 2026","question_type":"multiple-choice","solution":"solutions/Q168.html"},{"id":"Q169","year":"2026","stem":"נתונה פונקציית Hash המייצרת פלט באורך של 16 ביטים. על פי פרדוקס יום ההולדת, מהו בקירוב מספר הקלטים האקראיים השונים שיש לבדוק כדי למצוא התנגשות (Collision) בהסתברות של כ-%50? יש לבחור את התשובה הקרובה ביותר.","options":["307","32,768","65,536","16"],"note":"","sources":[{"file":"2026/File_0_689156_01_09082026_0.pdf","date":"09/08/2026","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.14,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<p><strong>307 היא החלופה הקרובה ביותר.</strong> לפלט של 16 ביט יש N=2¹⁶=65,536 ערכים. לאחר k קלטים עצמאיים שהפלטים שלהם בקירוב אחידים, הסתברות ההתנגשות היא בקירוב 1−exp(−k(k−1)/(2N)). מחפשים קירוב ל-0.5, ולא מספר שמבטיח התנגשות בוודאות.</p><p>מפתרון הקירוב מקבלים k≈sqrt(2N ln 2)≈1.1774×256≈301.4. לכן המספר הקרוב ברשימת החלופות הוא 307; הוא אינו השוויון המדויק ל-50%. שימוש ב-2^(n/2)=256 נותן סדר גודל טוב, אך חסר את המקדם המתאים להסתברות 50%.</p><p>32,768 ו-65,536 שייכים לסקאלה ליניארית בגודל מרחב הפלט, ואינם מתארים חיפוש התנגשות כללית. 16 הוא אורך הפלט בביטים ולא כמות ניסיונות. ההאצה נוצרת מפני שכל קלט חדש מושווה לכל הקודמים: יש בקירוב k²/2 זוגות אפשריים.</p><p>הפרדוקס אינו נותן אותה עלות ל-preimage. אם נקבע digest מסוים מראש, כל ניסוי פוגע בו בהסתברות 1/N, ואיננו מרוויחים את כל זוגות ההשוואה. גם second preimage קובע הודעה אחת מראש. הנחות האחידות והעצמאות חשובות; hash צעצוע עם מבנה אלגברי יכול להיות חלש יותר מהחסם הכללי. זו הרחבה טובה לשאלת ה-hash מאוקטובר, שבה מוצאים התנגשות מפורשת בלי להסתמך על birthday search.</p>","answer_origin":"פתרון חדש שנכתב ונבדק במסגרת עדכון נובמבר 2026","question_type":"multiple-choice","solution":"solutions/Q169.html"},{"id":"Q170","year":"2026","stem":"איזו בעיה מרכזית של פרוטוקול OCSP הרגיל נפתרת על ידי שימוש במנגנון OCSP Stapling בחיבורי TLS?","options":["פגיעה בפרטיות של המשתמשים.","הצורך של ה CA לאחסן מספר עצום של תעודות שבוטלו טרם זמנן.","הצורך של ה CA לאחסן מספר עצום של תעודות שלא בוטלו טרם זמנן.","הצורך של ה CA להצפין את התעודות לפני שהוא חותם עליהן."],"note":"","sources":[{"file":"2026/File_0_689156_01_09082026_0.pdf","date":"09/08/2026","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.296,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<p><strong>OCSP stapling מפחית פגיעה בפרטיות הלקוח.</strong> ב-OCSP ישיר הלקוח עשוי לפנות למשיב לגבי תעודת האתר שאליו הוא גולש. המשיב רואה את פרטי הבקשה ואת מקור הפנייה, ולכן יכול ללמוד מידע על דפוסי הגלישה. ב-stapling השרת משיג תשובה חתומה ומצרף אותה לחיבור, כך שהלקוח אינו צריך לפנות ישירות למשיב עבור אותו אימות.</p><p>הלקוח עדיין צריך לבדוק את חתימת התשובה, לאיזו תעודה היא מתייחסת, את הסטטוס ואת חלון הזמן שלה. העובדה שהשרת הוא שמעביר אותה אינה הופכת אותו לסמכות שיכולה להכריז בעצמה על אי-ביטול. תשובה ישנה או לא מתאימה אינה ראיה מספקת.</p><p>המנגנון אינו משנה באופן יסודי את מספר התעודות שה-CA מנפיק או מבטל, ואינו מחייב את ה-CA להצפין תעודות לפני חתימה. תעודות מיועדות להפצה; חתימה מאמתת אותן. ייתכנו גם יתרונות ביצועים וזמינות עקב צמצום פניות ישירות, אך שאלת הבחינה מבקשת את בעיית הפרטיות.</p><p>יש להפריד מ-CT: ‏OCSP מדבר על סטטוס ביטול ותוקף של תשובת סטטוס; CT מדבר על שקיפות הנפקה והתחייבויות לוגים. SCT אינו תחליף לתשובת OCSP, ותשובת OCSP אינה הוכחה שהתעודה נרשמה ביומן שקיפות.</p>","answer_origin":"פתרון חדש שנכתב ונבדק במסגרת עדכון נובמבר 2026","question_type":"multiple-choice","solution":"solutions/Q170.html"},{"id":"Q171","year":"2026","stem":"מה מבין הדברים הבאים יוכל לבצע תוקף בעל יכולות MITM, ללא מידע נוסף?","options":["יוכל לשנות כתובות IP בתשובות לשאילתות DNS שאינן cached.","יוכל לשנות דפי HTML שמועברים על גבי חיבור HTTPS שכבר הוקם בין שרת ולקוח.","יוכל לגנוב את ה coinbase transaction, כלומר, יוכל לשנות את התגמול שאמור לקבל ה miner שמצא את הבלוק כך שהתגמול יוענק לתוקף במקום.","לזייף חתימה דיגיטלית של אחד מהצדדים."],"note":"","sources":[{"file":"2026/File_0_689156_01_09082026_0.pdf","date":"09/08/2026","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.186,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<p><strong>לפי מודל הקורס של DNS רגיל לא מאומת, MitM יכול לשנות כתובת בתשובת DNS.</strong> אם התשובה עוברת דרכו ואינה מוגנת באימות מתאים, הוא יכול להחליף את המידע שמוחזר לקורבן. האזכור של שאילתה שאינה cached נועד לכך שיש תעבורת רשת חדשה לתקוף.</p><p>לעומת זאת, נוכחות בנתיב אינה נותנת מפתחות TLS. שינוי דפי HTML בתוך חיבור HTTPS מאומת שהוקם כראוי אמור להיכשל בבדיקת שלמות. תוקף יכול לחסום תעבורה ולפגוע בזמינות, אבל זו אינה אותה פעולה כמו שינוי שקוף בתוכן שהלקוח יקבל כאותנטי.</p><p>שינוי תגמול ה-coinbase בבלוק שנכרה משנה את התחייבות הבלוק לטרנזקציות ומחייב הוכחת עבודה תקפה מחדש. היכולת להעביר חבילות אינה מאפשרת ״לגנוב״ את הבלוק תוך שימור ה-hash התקף. גם זיוף חתימה דיגיטלית אינו נובע ממיקום התוקף ברשת.</p><p>החלופה הראשונה אינה משפט נכון לכל פריסת DNS בעולם: אימות DNSSEC או ערוץ DNS מוגן עשויים למנוע שינוי מקובל אצל לקוח שמאמת נכון. אלה הנחות נוספות שלא ניתנו בשאלה. בפתרון חשוב לציין את מודל הפרוטוקול ולא להרחיב את ״MitM״ לכוח בלתי מוגבל. זהו חיבור שימושי בין שאלות ARP, DNS ו-TLS: השגת מיקום בנתיב היא שלב אחד, ושבירת קריפטוגרפיה מאומתת היא שלב אחר.</p>","answer_origin":"פתרון חדש שנכתב ונבדק במסגרת עדכון נובמבר 2026","question_type":"multiple-choice","solution":"solutions/Q171.html"},{"id":"Q172","year":"2026","stem":"לבנק של אליס יש מנגנון הגנה נגד ניחוש סיסמאות. כל מי שטועה בהקלדת הסיסמה שלו 5 פעמים\nבשעה, ננעל מחוץ לחשבון שלו למשך יום. איזו התקפה יכול לבצע תוקף שיודע את שם המשתמש של אליס?","options":["Denial of Service.","XSS.","CSRF.","Brute force."],"note":"","sources":[{"file":"2026/File_0_689156_01_09082026_0.pdf","date":"09/08/2026","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.124,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<p><strong>Denial of Service באמצעות נעילת החשבון.</strong> התוקף יודע את שם המשתמש ויכול לשלוח חמש סיסמאות שגויות בתוך שעה. מדיניות האתר תנעל את החשבון ליום, ולכן המשתמשת הלגיטימית לא תוכל להיכנס גם עם הסיסמה הנכונה. המטרה המיידית היא פגיעה בזמינות, לא גילוי סוד.</p><p>זו דוגמה להגנה שמייצרת אפשרות לניצול כשהעונש קשור רק לחשבון ולא לזהות או להקשר הניסיון. התוקף אינו זקוק ל-cookie של הקורבן, להרצת סקריפט בדפדפן או לביקור שלה באתר זדוני. לכן XSS ו-CSRF אינם מתארים את התרחיש.</p><p>שליחת סיסמאות שגויות יכולה להיות חלק מניחוש סיסמה בהתקפה אחרת, אבל כאן הסף הנמוך מאפשר הצלחה של נעילה בלי לנחש נכון. לכן Brute force אינו הסיווג המדויק לתוצאה שהתוקף יכול להשיג מן הנתונים. הביטוי ״מנגנון נגד ניחוש״ בשאלה הוא מלכודת אם בוחרים מיד בהתקפת ניחוש.</p><p>מבחינה תכנונית אפשר לשקול השהיות מדורגות, הערכת סיכון והגבלות לפי כמה ממדים, תוך שמירה על מסלול התאוששות מתאים. שום מנגנון יחיד אינו מושלם: צריך לאזן עמידות לניחוש עם זמינות למשתמשים. לבחינה מספיק לזהות את הנכס שנפגע—זמינות החשבון—ולהציג את רצף הפעולות הקצר שמוביל לנעילה.</p>","answer_origin":"פתרון חדש שנכתב ונבדק במסגרת עדכון נובמבר 2026","question_type":"multiple-choice","solution":"solutions/Q172.html"},{"id":"Q173","year":"2026","topic":"הצפנה סימטרית וצפנים קלאסיים","title":"Vigenère — חיבור מחזורי של המפתח","stem":"אליס מצפינה בצופן Vigenère את ה-plaintext ATTACKATDAWN בעזרת המפתח LEMON, כאשר A=0, B=1, …, Z=25. מהו ה-ciphertext?","options":["LXFOPVEFRNHR","BUUBDLBUEBXO","LXFOPVEFRNHS","LXFOPVLXFOPV"],"note":"","sources":[{"file":"2026/File_0_689156_19102026_0.pdf","date":"19/10/2026","num":1}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"answer_html":"<p><strong>התשובה הנכונה היא LXFOPVEFRNHR.</strong> בצופן Vigenère כל אות של הטקסט מוזזת לפי הערך המספרי של אות המפתח שמתחתיה. המפתח חוזר מחזורית עד לאורך ההודעה. כאן יש 12 אותיות בטקסט ו-5 במפתח, ולכן כותבים LEMONLEMONLE. אין להוסיף רווחים ואין להתחיל מחדש את המפתח בתחילת מילה: הנתון הוא המחרוזת הרציפה ATTACKATDAWN.</p><p>ממירים אותיות לערכים בין 0 ל-25. בכל מיקום מחשבים Cᵢ=(Pᵢ+Kᵢ) mod 26. למשל A+L נותן 0+11=11, כלומר L; האות השנייה T+E נותנת 19+4=23, כלומר X. במיקום השלישי T+M נותן 31, ומפחיתים 26 כדי לקבל 5, כלומר F.</p><pre dir=\"ltr\">P: A  T  T  A  C  K  A  T  D  A  W  N\nK: L  E  M  O  N  L  E  M  O  N  L  E\nC: L  X  F  O  P  V  E  F  R  N  H  R</pre><p>הבדיקה האחרונה חשובה: N+E=13+4=17, ולכן האות האחרונה היא R ולא S. החלופה המסתיימת ב-S נועדה לתפוס שגיאה מקומית. BUUBDLBUEBXO מתקבל מהזזה קבועה באחד, שאינה משתמשת במפתח LEMON. החלופה LXFOPVLXFOPV חוזרת על קטע מוצפן כאילו חזרה על טקסט מחייבת אותו פלט בלי להתחשב במיקום המפתח; זו אינה שיטת Vigenère.</p><p>בדיקת הבנה: בפענוח מבצעים Pᵢ=(Cᵢ−Kᵢ) mod 26. במקרה של תוצאה שלילית מוסיפים 26. יש להבחין בין צופן הזזה עם מספר קבוע, צופן החלפה כללי, ו-Vigenère עם סדרת הזזות מחזורית. זהו צופן לימודי היסטורי: מפתח קצר שחוזר אינו OTP ואינו מעניק סודיות מושלמת. בשאלה מספרית עדיף לכתוב שלוש שורות מיושרות ולבדוק אות מההתחלה, מהאמצע ומהסוף, במקום לזהות רק תחילית מוכרת.</p>","accepted_indices":[0],"answer_origin":"פתרון חדש · המפתח הרשמי בקובץ: א׳ · ההסבר הוא חומר לימוד עצמאי","question_type":"multiple-choice","solution":"solutions/Q173.html"},{"id":"Q174","year":"2026","topic":"PKI, תעודות, CT ו-OCSP","title":"מי מאמת את חתימת התעודה?","stem":"שרשרת התעודות היא Root CA (R) ← Intermediate CA (I) ← תעודת השרת foo.com. באיזה מפתח הלקוח משתמש כדי לאמת את החתימה שעל תעודת השרת?","options":["במפתח הפומבי של I","במפתח הפומבי של R","במפתח הפרטי של R","במפתח הפומבי של foo.com"],"note":"","sources":[{"file":"2026/File_0_689156_19102026_0.pdf","date":"19/10/2026","num":2}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"answer_html":"<p><strong>התשובה היא המפתח הפומבי של I.</strong> הכלל הוא: מאמתים חתימה באמצעות המפתח הפומבי של מי שחתם. בתיאור השאלה, רשות הביניים I היא המנפיקה שחתמה על תעודת האתר בעזרת המפתח הפרטי שלה. לכן הלקוח לוקח את המפתח הפומבי של I ומאמת באמצעותו את חתימת התעודה של foo.com.</p><p>לשרשרת יש שתי בדיקות שונות. תחילה אפשר לאמת את חתימת R על תעודת I בעזרת המפתח הפומבי של R שכבר מהימן ללקוח. לאחר שמפתחה של I מקושר לשרשרת אמון תקפה, משתמשים בו לבדיקת תעודת האתר. R הוא עוגן האמון, אבל אינו בהכרח החותם הישיר על כל תעודת קצה. לכן הביטוי ״ה-Root הוא מהימן״ אינו אומר ״משתמשים במפתח ה-Root לכל בדיקה״.</p><pre dir=\"ltr\">R public key  -> verifies signature on I certificate\nI public key  -> verifies signature on foo.com certificate</pre><p>המפתח הפרטי של R אינו אמור להימסר ללקוח; חשיפתו תאפשר התחזות לרשות. מפתח האתר עצמו אינו מאמת את חתימת המנפיק על תעודת האתר. הוא משמש בתפקידים אחרים בפרוטוקול, כגון אימות הוכחת החזקה במפתח הפרטי המתאים, בהתאם לגרסת TLS ולסכמה.</p><p>אימות החתימה לבדו עדיין אינו כל בדיקת התעודה. נדרשים גם שם מארח מתאים, תוקף זמנים, הרשאות CA בתעודות ביניים, שימושי מפתח ומדיניות רלוונטית. אילו I הייתה חתומה על ידי רשות שאינה מהימנה ללקוח, ייתכן שהחתימה על תעודת האתר הייתה תקינה מתמטית ובכל זאת השרשרת הייתה נדחית. השאלה שואלת רק מי מאמת את חתימת תעודת השרת, ולכן אין להחליף את התשובה ברשימת כל בדיקות TLS.</p>","accepted_indices":[0],"answer_origin":"פתרון חדש · המפתח הרשמי בקובץ: א׳ · ההסבר הוא חומר לימוד עצמאי","question_type":"multiple-choice","solution":"solutions/Q174.html"},{"id":"Q175","year":"2026","topic":"RSA, מפתח ציבורי וחתימות","title":"אימות חתימת textbook RSA","stem":"המפתח הפומבי של בוב ב-textbook RSA (בלי hash) הוא n=33 ו-e=3. איזה זוג (הודעה m, חתימה σ) מכיל חתימה תקינה?","options":["m=4, σ=16","m=5, σ=25","m=7, σ=13","m=8, σ=5"],"note":"","sources":[{"file":"2026/File_0_689156_19102026_0.pdf","date":"19/10/2026","num":3}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"answer_html":"<p><strong>הזוג התקין הוא m=4, σ=16.</strong> באימות textbook RSA ללא גיבוב מחשבים את החתימה בחזקת המעריך הפומבי מודולו n ומשווים להודעה. אין צורך למצוא את המפתח הפרטי ואין להצפין את m במקום את החתימה. הבדיקה היא σ³ mod 33 = m.</p><p>לחלופה הראשונה: 16²=256, ששאריתה בחלוקה ב-33 היא 25. מכפילים ב-16: 25×16=400, ושארית 400 בחלוקה ב-33 היא 4. לכן אימות החתימה מחזיר בדיוק את m הנתונה. עבודה עם שאריות בכל שלב שומרת על מספרים קטנים ומפחיתה טעויות חישוב.</p><pre dir=\"ltr\">16^3 mod 33 = 4096 mod 33 = 4\n25^3 mod 33 = 15625 mod 33 = 16  != 5\n13^3 mod 33 = 2197 mod 33 = 19   != 7\n 5^3 mod 33 = 125 mod 33 = 26    != 8</pre><p>החלופות האחרות נכשלות בהשוואה: העובדה ששני מספרים נראים קשורים אינה מספיקה. במיוחד, לא מחשבים m³ ומשווים ל-σ, מפני שזה הופך את כיוון פעולת האימות. חתימה נוצרת עם המעריך הפרטי, ואימות משתמש במעריך הפומבי. במודל הצעצוע כל אחד יכול לבצע את בדיקת התקינות בלי להחזיק את הסוד של בוב.</p><p>במערכת אמיתית לא משתמשים ב-textbook RSA כפי שהוא. חתימות משתמשות בגיבוב ובקידוד מוגדר, למשל RSA-PSS, ובמודולוס גדול. השאלה מסירה במפורש את הגיבוב כדי לאפשר תרגיל בחזקות מודולריות. אין להסיק מכך שחתימה דיגיטלית רגילה ״מצפינה את המסמך״ או שכל חתימה חושפת את ההודעה. זו תכונה של מודל השאלה המסוים. כלל תרגול יעיל: סמנו קודם את הפעולה המבוקשת—יצירת מפתח, חתימה או אימות—ורק אחר כך בחרו נוסחה.</p>","accepted_indices":[0],"answer_origin":"פתרון חדש · המפתח הרשמי בקובץ: א׳ · ההסבר הוא חומר לימוד עצמאי","question_type":"multiple-choice","solution":"solutions/Q175.html"},{"id":"Q176","year":"2026","topic":"ביטקוין ובלוקצ׳יין","title":"UTXO, עודף ועמלה","stem":"לאליס UTXO בסך 5 BTC. היא רוצה לשלם לבוב 3 BTC ולתת לכורה עמלה של 0.1 BTC. אילו פלטים ממש צריכים להיות בטרנזקציה החדשה?","options":["שני פלטים: 3 BTC לבוב ו-1.9 BTC לאליס","פלט אחד: 3 BTC לבוב","שלושה פלטים: 3 BTC לבוב, 2 BTC לאליס ו-0.1 BTC לכורה","שני פלטים: 3 BTC לבוב ו-2 BTC לאליס"],"note":"","sources":[{"file":"2026/File_0_689156_19102026_0.pdf","date":"19/10/2026","num":4}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"answer_html":"<p><strong>שני פלטים: 3 BTC לבוב ו-1.9 BTC כעודף לאליס.</strong> בטרנזקציה רגילה העמלה היא ההפרש בין סכום הקלטים לבין סכום הפלטים. אין פלט עמלה נפרד לכורה בתוך הטרנזקציה הרגילה הזאת. הכורה רשאי לגבות את העמלות באמצעות טרנזקציית ה-coinbase של הבלוק, יחד עם סובסידיית הבלוק בהתאם לכללים.</p><pre dir=\"ltr\">input = payment + change + fee\n5 = 3 + 1.9 + 0.1\nfee = 5 - (3 + 1.9) = 0.1 BTC</pre><p>UTXO נצרך בשלמותו. אין משאירים אוטומטית 2 BTC ב״קלט הישן״ לאחר ששילמנו 3: צריך ליצור פלט עודף מפורש. אם יוצרים פלט יחיד של 3 BTC, סכום הפלטים הוא 3 והעמלה תהיה 2 BTC, ולא 0.1. פלטי 3 ו-2 משאירים עמלה אפס. החלופה עם שלושה פלטים מסתכמת ב-5.1 BTC ומנסה להוציא יותר מהקלט; בנוסף היא מתייחסת לעמלה כאילו הייתה פלט תשלום רגיל.</p><p>אפשר לתת טיפ מפורש לכתובת מסוימת, אבל זה יהיה פלט רגיל לאותה כתובת ולא מנגנון עמלת הכורה המתואר בשאלה. יש להבחין גם בין כתובת ארנק לבין יתרה חשבונאית: ארנק מנהל מפתחות ואוסף פלטים שניתן להוציא, ויכול להשתמש בכתובת חדשה לעודף. השאלה מפשטת זאת לכתובת אליס.</p><p>לבדיקה עצמית כתבו תמיד שלוש שורות: סכום הקלטים, סכום הפלטים, ההפרש. ודאו שההפרש אינו שלילי ושהוא בדיוק העמלה המבוקשת. ההרחבה ממבחן קודם—חישוב עמלה מתוך פלטים נתונים—והשאלה הזאת—חישוב עודף מתוך עמלה נתונה—משתמשות באותה משוואה, אבל דורשות לבודד איבר אחר.</p>","accepted_indices":[0],"answer_origin":"פתרון חדש · המפתח הרשמי בקובץ: א׳ · ההסבר הוא חומר לימוד עצמאי","question_type":"multiple-choice","solution":"solutions/Q176.html"},{"id":"Q177","year":"2026","topic":"ביטקוין ובלוקצ׳יין","title":"למה מחכים לאישורים?","stem":"מדוע סוחר שמקבל תשלום בביטקוין נוהג לחכות לכ-6 בלוקים (confirmations) לפני שהוא שולח את הסחורה?","options":["כדי להקטין את ההסתברות ל-double spending","כי הטרנזקציה מוצפנת במשך 6 בלוקים ורק אחר כך אפשר לקרוא אותה","כי נדרשים 6 בלוקים עד שהטרנזקציה מגיעה לכל הצמתים","כי טרנזקציה צריכה חתימות של 6 כורים כדי להיות חוקית"],"note":"","sources":[{"file":"2026/File_0_689156_19102026_0.pdf","date":"19/10/2026","num":5}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"answer_html":"<p><strong>המתנה לאישורים מקטינה את הסיכון ל-double spending.</strong> כאשר הטרנזקציה נכללת בבלוק, ייתכן שענף מתחרה יחליף אותו. ככל שנוספים בלוקים על גבי הבלוק המכיל את התשלום, תוקף המבקש להחליף את ההיסטוריה הזאת צריך להשלים יותר עבודה מצטברת. תחת ההנחות המקובלות על כוח החישוב של התוקף והרשת, הסיכון להחלפה פוחת עם העומק.</p><p>אישור ראשון הוא בדרך כלל עצם ההכללה בבלוק, וחמישה בלוקים נוספים מעליו מביאים לשישה אישורים. אין כאן מספר קסם שמעניק ודאות מוחלטת. הסיכון תלוי בין השאר בחלקו של התוקף בכוח החישוב, בתנאי הרשת ובערך העסקה. אם לתוקף רוב מתמשך של כוח החישוב, אין להצדיק הבטחת בטיחות רק על בסיס ״שישה״.</p><p>הטרנזקציות אינן נעשות קריאות רק לאחר שישה בלוקים: התוכן אינו מוצפן באמצעות מנגנון ההמתנה הזה. הפצה לרשת אינה מונה קבוע של שישה בלוקים, והחוקיות אינה מבוססת על שש חתימות כורים. חתימת בעל הזכות להוציא את הפלט מוכיחה הרשאה להוצאה, אך אינה לבדה פותרת התנגשות בין שתי הוצאות מורשות של אותו UTXO.</p><p>חשוב להפריד שלוש שאלות: האם חתימת ההוצאה תקינה; האם הפלט טרם בוזבז במצב השרשרת שהצומת מאמת; ועד כמה עמוקה ההכללה בשרשרת בעלת העבודה המצטברת התקפה. עץ מרקל יכול להוכיח הכללה תחת שורש מסוים, אבל אינו הופך את הבלוק לבלתי ניתן להחלפה. בבחינה, חפשו אם השאלה עוסקת בהרשאה, בהכללה או בסופיות הסתברותית—אלה מנגנונים שונים.</p>","accepted_indices":[0],"answer_origin":"פתרון חדש · המפתח הרשמי בקובץ: א׳ · ההסבר הוא חומר לימוד עצמאי","question_type":"multiple-choice","solution":"solutions/Q177.html"},{"id":"Q178","year":"2026","topic":"RSA, מפתח ציבורי וחתימות","title":"ספירת מפתחות בארגון","stem":"בארגון 100 עובדים, וכל שני עובדים צריכים לתקשר בסודיות בלי שאחרים יקראו. כמה מפתחות נדרשים בהצפנה סימטרית (מפתח נפרד לכל זוג), וכמה בהצפנה א-סימטרית?","options":["4,950 מפתחות סימטריים לעומת 100 זוגות מפתחות א-סימטריים","9,900 מפתחות סימטריים לעומת 200 זוגות א-סימטריים","10,000 מפתחות סימטריים לעומת 100 זוגות א-סימטריים","100 מפתחות סימטריים לעומת 200 זוגות א-סימטריים"],"note":"","sources":[{"file":"2026/File_0_689156_19102026_0.pdf","date":"19/10/2026","num":6}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"answer_html":"<p><strong>נדרשים 4,950 מפתחות סימטריים ו-100 זוגות מפתחות א-סימטריים.</strong> במודל הסימטרי שהוגדר, כל זוג עובדים מקבל סוד אחר. זוג אליס–בוב הוא אותו זוג כמו בוב–אליס, ואין צורך בזוג של עובד עם עצמו. לכן מספר הסודות השונים הוא מספר הזוגות הלא מסודרים מתוך 100 עובדים.</p><pre dir=\"ltr\">C(n,2) = n(n-1)/2\n100 * 99 / 2 = 4,950\nAsymmetric: 100 key pairs = 100 public + 100 private keys</pre><p>המספר 9,900 סופר כל זוג פעמיים, פעם לכל כיוון. מודל שבו חייבים מפתח שונה לכל כיוון היה נותן תשובה אחרת, אבל אינו מה שנכתב. 10,000 כולל גם תקשורת עצמית וגם ספירה לפי כיוון. שימוש במפתח סימטרי אחד לכל הארגון מאפשר לכל עובד לקרוא תקשורת של האחרים, ולכן אינו עומד בדרישה.</p><p>במודל הא-סימטרי לכל עובד זוג אישי. כדי לשלוח לבוב, מצפינים באמצעות המפתח הפומבי של בוב; בוב מפענח בפרטי שלו. 100 זוגות הם 200 רכיבי מפתח, ולכן צריך לקרוא היטב אם החלופה סופרת ״מפתחות״ או ״זוגות״. אין צורך בזוג נפרד לכל זוג מתקשרים במודל הזה.</p><p>הספירה אינה טענה שמערכת אמיתית תשתמש רק ב-100 זוגות לכל מטרותיה. בפועל ייתכנו מפתחות סשן, הפרדה בין חתימה להצפנה, החלפה תקופתית ומפתחות לתעודות. גם אמינות המפתחות הפומביים אינה מגיעה מספירתם: צריך לוודא שהמפתח המזוהה עם בוב אכן שלו. השאלה היא תרגיל ניהול מפתחות תחת הנחות פשוטות. דרך טובה לזכור את הנוסחה היא לצייר ארבעה עובדים: יש שש צלעות, ולא 12 או 16.</p>","accepted_indices":[0],"answer_origin":"פתרון חדש · המפתח הרשמי בקובץ: א׳ · ההסבר הוא חומר לימוד עצמאי","question_type":"multiple-choice","solution":"solutions/Q178.html"},{"id":"Q179","year":"2026","topic":"הצפנה סימטרית וצפנים קלאסיים","title":"OTP: סודיות אינה שלמות","stem":"אליס מצפינה את YES (שלושה בתים ב-ASCII) ב-OTP עם מפתח אקראי תקין שנעשה בו שימוש פעם אחת. חווה היא MitM שאינה יודעת את המפתח אבל יודעת שההודעה YES. איזו טענה נכונה?","options":["חווה יכולה לגרום לבוב לפענח NO! כאילו אליס שלחה זאת","חווה אינה יכולה לשנות את ההודעה באופן מבוקר כי ל-OTP יש perfect secrecy","חווה חייבת לדעת לפחות חצי מביטי המפתח כדי לשנות את ההודעה","בוב יגלה כל שינוי, כי פענוח OTP של ciphertext ששונה נכשל"],"note":"","sources":[{"file":"2026/File_0_689156_19102026_0.pdf","date":"19/10/2026","num":7}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"answer_html":"<p><strong>חווה יכולה לשנות את הפענוח ל-NO!.</strong> OTP מספק סודיות מושלמת כאשר המפתח אחיד, ארוך כמו ההודעה, סודי וחד פעמי. הוא אינו מוסיף תג אימות או מנגנון שלמות. ידיעת טקסט המקור ומיקום הבתים מאפשרת שינוי מכוון בלי צורך לדעת מראש את המפתח.</p><p>נסמן M=YES ו-M′=NO!, ואת הטקסט המוצפן C=M XOR K. חווה שולחת C′=C XOR M XOR M′. בוב מפענח עם אותו K, ושני העותקים של K ושני העותקים של M מתבטלים. לכן מתקבל בדיוק M′. כאן לשתי ההודעות שלושה בתים, כך שאפשר לבצע את השינוי באותו אורך.</p><pre dir=\"ltr\">C' = C XOR M XOR M'\nC' XOR K = (M XOR K) XOR M XOR M' XOR K = M'\nYES (hex): 59 45 53\nNO! (hex): 4E 4F 21\ndelta:     17 0A 72</pre><p>חווה יכולה גם לחשב את מקטע המפתח המתאים מתוך C XOR M במקרה שבו היא יודעת את כל M; זה אינו סותר סודיות מושלמת, שמתייחסת למידע שהצופן מוסיף על הודעה שאינה ידועה. נוסחת השינוי עצמה מספיקה לפתרון ואינה מחייבת חילוץ מפורש של המפתח.</p><p>הטעות המרכזית במסיחים היא בלבול בין חוסר יכולת ללמוד הודעה לא ידועה לבין חוסר יכולת לשנות הודעה. OTP רגיל אינו ״נכשל״ בפענוח של מחרוזת באורך מתאים: כל מחרוזת כזאת מפוענחת למשהו. כדי לזהות שינוי פעיל משתמשים באימות הודעות מתאים, עם ניהול מפתחות נכון; במערכות מעשיות מקובל להשתמש בסכמת הצפנה מאומתת. אל תבלבלו את השאלה הזאת עם שימוש חוזר במפתח OTP: גם עם מפתח חד פעמי תקין, העדר אימות משאיר את הפגיעות לשינוי.</p>","accepted_indices":[0],"answer_origin":"פתרון חדש · המפתח הרשמי בקובץ: א׳ · ההסבר הוא חומר לימוד עצמאי","question_type":"multiple-choice","solution":"solutions/Q179.html"},{"id":"Q180","year":"2026","topic":"אבטחת Web","title":"XSS עם HttpOnly ו-CSRF token","stem":"ה-cookie שמזהה משתמש מוגדר HttpOnly. תוקף מצא XSS ויכול להריץ JavaScript בדפדפן הקורבן. איזו טענה נכונה?","options":["אם בעמוד יש anti-CSRF token, התוקף יכול לקרוא אותו מהדף ולבצע בקשות באתר בשם הקורבן","HttpOnly מונע הרצת JavaScript ולכן מונע XSS","HttpOnly מונע שליחת cookie גם בבקשות fetch מאותו origin, ולכן התוקף יכול רק לשנות עיצוב","התוקף יכול לקרוא את ה-cookie המוגן דרך document.cookie ולשלוח אותו לשרת שלו"],"note":"","sources":[{"file":"2026/File_0_689156_19102026_0.pdf","date":"19/10/2026","num":8}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"answer_html":"<p><strong>החלופה הראשונה נכונה.</strong> HttpOnly מגביל חשיפת cookie לממשקי סקריפט כגון document.cookie. הוא אינו מכבה JavaScript ואינו מונע מהדפדפן לצרף cookie מתאים לבקשה. XSS שרץ בהקשר המקור של האתר יכול לפעול מתוך ההקשר המורשה של המשתמש, גם אם אין לו אפשרות לקרוא את ערך ה-cookie.</p><p>טוקן CSRF נועד בדרך כלל להקשות על אתר חיצוני ליצור בקשה מורשית בלי לדעת ערך סודי הקשור לסשן או לפעולה. כאשר הקוד הזדוני כבר רץ באותו origin והטוקן נמצא ב-DOM הנגיש לו, הוא יכול לקרוא אותו ולשלוח בקשה מתאימה. לכן טוקן תקין אינו תחליף למניעת XSS. ה-cookie יכול להישאר חסוי מסקריפט ועדיין להיות מצורף על ידי הדפדפן לבקשה המזיקה.</p><p>חלופה ב מייחסת ל-HttpOnly חסימת קוד שאינה תפקידו. חלופה ג מבלבלת בין קריאת cookie לבין שליחתו ברשת. חלופה ד מציעה דווקא את הפעולה ש-HttpOnly חוסם: קריאת ה-cookie המוגן דרך document.cookie. העובדה שיש cookies אחרים שהסקריפט יכול לקרוא אינה הופכת את ה-cookie המסומן HttpOnly לנגיש.</p><p>תרגול מועיל הוא לבנות טבלת יכולות: קריאת ערך ה-cookie — לא; קריאת token גלוי בדף מאותו מקור — כן, לפי הנתון; שליחת בקשה מאותו מקור עם הרשאות המשתמש — כן; פענוח TLS באמצעות XSS — אינו המנגנון הנדון. ההגנה צריכה לטפל במקור ה-XSS באמצעות קידוד פלט לפי הקשר, שימוש בטוח ב-DOM ומדיניות CSP מתאימה כשכבה נוספת. התנאים בשאלה חשובים: אין כאן טענה שכל token בכל מערכת נגיש לכל סקריפט, אלא תרחיש שבו הוא נמצא בדף נגיש לקוד שהוזרק.</p>","accepted_indices":[0],"answer_origin":"פתרון חדש · המפתח הרשמי בקובץ: א׳ · ההסבר הוא חומר לימוד עצמאי","question_type":"multiple-choice","solution":"solutions/Q180.html"},{"id":"Q181","year":"2026","topic":"PKI, תעודות, CT ו-OCSP","title":"CT מול CA שנפרץ","stem":"תוקף פרץ ל-CA שנמצא ב-root store והנפיק לעצמו תעודה ל-bank.com. הוא לא שלח אותה לאף לוג Certificate Transparency. מה יקרה בדפדפן שאוכף CT?","options":["הדפדפן ידחה את התעודה כי אין SCTs תקינים מלוגים","הדפדפן יקבל כי ה-CA מוכר; CT רלוונטי רק לתעודות שבוטלו","התוקף יכול לזייף SCT בעזרת מפתח ה-CA שנפרץ ולכן הדפדפן יקבל","הדפדפן יקבל וירשום בעצמו את התעודה בלוג דרך שרת OCSP"],"note":"","sources":[{"file":"2026/File_0_689156_19102026_0.pdf","date":"19/10/2026","num":9}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"answer_html":"<p><strong>לפי הנחות השאלה, הדפדפן ידחה את התעודה.</strong> חתימת CA מהימן ועמידה בדרישות CT הן בדיקות נפרדות. דפדפן שאוכף את מדיניות CT המתאימה דורש ראיות קבילות מהלוגים. התוקף השיג מפתח של CA, אבל לא השיג בכך את מפתחות החתימה של לוגי CT ולא יצר SCTs תקינים.</p><p>SCT הוא התחייבות חתומה של לוג לכלול את התעודה או הרשומה המתאימה בתוך מסגרת הזמן המוגדרת. הוא אינו חתימת ה-CA ואינו הוכחת בעלות בדומיין. לכן CA שנפרץ יכול להנפיק תעודה עם חתימת CA תקינה, אך אינו יכול להמציא חתימת לוג תקינה רק באמצעות אותו מפתח. אם התוקף כן יגיש את התעודה ללוג ויעמוד במדיניות, CT אינו מבטיח חסימה של ההתחזות; השקיפות מסייעת לחשיפת הנפקה חריגה ולפיקוח עליה.</p><p>CT אינו מנגנון ביטול תעודות. CRL ו-OCSP עוסקים בסטטוס ביטול, ולא ברישום ציבורי של הנפקה. OCSP אינו שירות שבעזרתו הדפדפן רושם בעצמו תעודה חסרה ואז מכשיר אותה. בנוסף, אין להסיק ש-SCT חייב תמיד להיות מוטמע בתוך גוף התעודה: קיימים מסלולי מסירה שונים לפי הפרוטוקול ומדיניות הלקוח. בשאלה נאמר שלא הייתה הגשה לאף לוג, ולכן חסרה הראיה עצמה ולא רק מיקומה.</p><p>במבחן סמנו את שרשרת הסמכויות: CA חותם על התעודה, לוגר חותם על SCT, דפדפן בודק מדיניות, ומוניטור מחפש הנפקות חשודות. ההפרדה הזאת מונעת את הטעות שלפיה שליטה ברכיב אחד מעניקה אוטומטית את מפתחות כל הרכיבים. התשובה מתייחסת במפורש לדפדפן שאוכף CT ולתעודה שחייבת במדיניות זו, ולא לכל לקוח TLS אפשרי.</p>","accepted_indices":[0],"answer_origin":"פתרון חדש · המפתח הרשמי בקובץ: א׳ · ההסבר הוא חומר לימוד עצמאי","question_type":"multiple-choice","solution":"solutions/Q181.html"},{"id":"Q182","year":"2026","topic":"Hash, MAC וסיסמאות","title":"לשבור hash צעצוע באופן מפורש","stem":"פונקציית hash למחרוזות a–z מחברת את מיקום כל אות (a=0, …, z=25) ומחזירה את הסכום מודולו 26. איזו טענה נכונה?","options":["הפונקציה לא בטוחה כי קל למצוא התנגשויות","הפונקציה עמידה להתנגשויות אבל לא ל-preimage","פעולת המודולו מסתירה את הסכום המקורי ולכן הפונקציה בטוחה","הפונקציה חשופה רק להתנגשויות ועמידה ל-preimage"],"note":"","sources":[{"file":"2026/File_0_689156_19102026_0.pdf","date":"19/10/2026","num":10}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"answer_html":"<p><strong>הפונקציה אינה בטוחה, וקל למצוא בה התנגשויות.</strong> מספיק להציג שתי מחרוזות שונות עם אותו פלט. למשל h(ab)=(0+1) mod 26=1 וגם h(ba)=(1+0) mod 26=1. שינוי סדר האותיות אינו משנה את הסכום, ולכן הפונקציה מאבדת מבנה חשוב של ההודעה. גם הוספת a אינה משנה את הערך.</p><p>הבעיה אינה רק העובדה שמתמטית קיימות התנגשויות: בכל hash בעל פלט קבוע ותחום קלט גדול חייבות להיות התנגשויות. הדרישה הקריפטוגרפית היא שקשה למצוא אותן. כאן מוצאים אותן ישירות, בלי חיפוש יקר ובלי לשבור שום הנחה חישובית.</p><pre dir=\"ltr\">h(ab) = 1 = h(ba),  ab != ba\nh(b) = 1 = h(ba)\nFor digest d in {0,...,25}: choose the single letter with index d.</pre><p>גם preimage resistance נכשלת. בהינתן פלט d בין 0 ל-25, מחזירים את האות שמספרה d; למשל לפלט 3 מתאימה d. אם נדרשת מחרוזת באורך מסוים שאינו אפס, אפשר להשלים באותיות a. לכן הטענה שהפונקציה חשופה ״רק״ להתנגשויות שגויה. גם second preimage פשוט: להודעה נתונה אפשר לצרף a ולקבל הודעה שונה עם אותו פלט, כל עוד אורך ההודעה אינו מוגבל באופן אחר.</p><p>פעולת modulo הופכת מידע ללא חד-חד-ערכי, אבל אובדן מידע אינו תנאי מספיק לחד-כיווניות קשה. יש כאן רק 26 פלטים ומבנה אלגברי פשוט במיוחד. במבחן, עדיף לכתוב דוגמה קטנה שמפריכה בטיחות מאשר להסתפק במשפט ״modulo לא בטוח״, שגם אינו נכון כטענה כללית: חשבון מודולרי משמש גם בבניות תקינות. יש לזהות את חולשת הבנייה המסוימת.</p>","accepted_indices":[0],"answer_origin":"פתרון חדש · המפתח הרשמי בקובץ: א׳ · ההסבר הוא חומר לימוד עצמאי","question_type":"multiple-choice","solution":"solutions/Q182.html"}]};

review=\"0\"><h4>נכונה — P₄ מתערבל, וב-P₅ מתהפך הביט המקביל; שאר הבלוקים נשארים</h4><p>P₄ נפגע דרך קלט הפענוח, ואילו P₅ נפגע דרך ה-XOR עם הבלוק הקודם. לכן רק שני הבלוקים האלה מושפעים, וב-P₅ מיקום הביט המשתנה ידוע בדיוק.</p></div><div class=\"option-review\" data-option-review=\"1\"><h4>שגויה — רק P₄ משתנה בביט אחד</h4><p>אין כאן היפוך מבוקר של ביט אחד ב-P₄. התוקף שינה את הקלט של Dₖ עבורו, ולכן תבנית השינוי אינה נקבעת רק ממיקום הביט ששונה ב-C₄.</p></div><div class=\"option-review\" data-option-review=\"2\"><h4>שגויה — כל הבלוקים החל מ-P₄ נהרסים</h4><p>P₆ תלוי ב-C₆ וב-C₅, שלא השתנו. כך גם הבלוקים המאוחרים יותר. הפענוח אינו משתמש ב-P₅ הפגום כדי לחשב את P₆, ולכן אין שרשרת נזק אינסופית.</p></div><div class=\"option-review\" data-option-review=\"3\"><h4>שגויה — P₃ מתערבל ו-P₄ משתנה בביט אחד</h4><p>P₃ תלוי ב-C₃ וב-C₂ ולא ב-C₄, ולכן אינו מושפע. הבלוק עם היפוך הביט המבוקר הוא P₅, ולא P₄; הכיוון בחלופה הוזז לאחור.</p></div><h3>דגש והנחות שחשוב לזכור</h3><p>״מתערבל״ אינו אומר שכל ביט ב-P₄ בהכרח מתהפך. בצופן בלוקים חזק מצפים לשינוי לא צפוי, בקירוב בכמחצית הביטים. אם יופעלו בהמשך בדיקות ריפוד או מבנה, ייתכן שהיישום ידחה את המסר; השאלה עוסקת בתוצאת פענוח הבלוקים, לא בקבלת המסר ביישום.</p><p class=\"study-source\">מקורות לבדיקת המנגנון: <a href=\"https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-38a.pdf\">NIST SP 800-38A — ECB, CBC and error propagation</a></p></section>","title":"שיבוש בבלוק CBC","guide":"Q168","id":"P13","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":13}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"משלים","evidence":["Q168"],"mock":2,"answer_origin":"וריאציה חדשה לצורך תרגול מועד ב׳ · ההסבר נבדק ונערך מחדש ב-14/11/2026, כולל כל ארבע החלופות","accepted_indices":[0],"reviewed":"2026-11-14","option_explanations":[{"option":"P₄ מתערבל, וב-P₅ מתהפך הביט המקביל; שאר הבלוקים נשארים","correct":true,"re st ואין הודעה.","סודיות מושלמת של OTP.","עמידות להתנגשות שבה התוקף חופשי לבחור את שתי ההודעות מלכתחילה."],"topic":"Hash, MAC וסיסמאות","answer_html":"<section class=\"forecast-review\"><h3>דרך הפתרון</h3><p>הנתון המכריע הוא שהתוקף מקבל את ההודעה המסוימת m₀ מראש. הוא אינו חופשי לבחור אותה, ועליו למצוא הודעה אחרת באותו hash. זו בדיוק בעיית second preimage. יש לשאול מה התוקף יודע ומה הוא רשאי לבחור, ולא לזהות את סוג התקיפה רק לפי הופעת שוויון בין פלטים.</p><pre>Preimage:        given y, find m with h(m)=y\nSecond preimage: given m₀, find m₁≠m₀ with h(m₁)=h(m₀)\nCollision:       choose m₀≠m₁ with equal hashes</pre><h3>למה התשובה נכונה ולמה שאר האפשרויות שגויות</h3><p class=\"study-source\">מזהים כל חלופה לפי הטקסט שלה; אותיות התשובות משתנות בערבוב.</p><div class=\"option-review\" data-option-review=\"0\"><h4>נכונה — Second pre-image resistance.</h4><p>Second pre-image resistance דורשת שיהיה קשה למצוא m₁ שונה עבור m₀ הנתונה, עם h(m₁)=h(m₀). תנאי הקלט וההצלחה תואמים במדויק לשאלה.</p></div><div class=\"option-review\" data-option-review=\"1\"><h4>שגויה — Pre-image resistance כאשר נתון רק digest ואין הודעה.</h4><p>ב-preimage נתון יעד hash ומחפשים קלט שמגיע אליו. כאן ניתן גם המסר המקורי ויש דרישה מפורשת למסרים שונים, ולכן זו הבעיה הספציפית של קדם-תמונה שנייה.</p></div><div class=\"option-review\" data-option-review=\"2\"><h4>שגויה — סודיות מושלמת של OTP.</h4><p>סודיות מושלמת של OTP עוסקת במידע שהצופן חושף על הודעה. כאן אין מפתח OTP או ciphertext, אלא חיפוש קלטים לפונקציית hash.</p></div><div class=\"option-review\" data-option-review=\"3\"><h4>שגויה — עמידות להתנגשות שבה התוקף חופשי לבחור את שתי ההודעות מלכתחילה.</h4><p>הזוג המתקבל אכן מהווה התנגשות; אין טענה אחרת. אך החלופה מתארת ניסוי שבו שני המסרים חופשיים לבחירה, בעוד שבשאלה m₀ נכפתה מראש. לכן היא אינה שם הניסוי המסוים שהתבקש: second preimage.</p></div><h3>דגש והנחות שחשוב לזכור</h3><p>השוואה לאימות סיסמאות: כאשר נגנב hash של סיסמה אך הסיסמה עצמה אינה ידועה, חיפוש סיסמה שמאמתת הוא ניחוש סיסמאות או חיפוש קדם-תמונה. הוא אינו אוטומטית second preimage רק משום שהחשבון קבוע. כדי לנסח את המשחק האחרון צריך מסר מקורי נתון ולחפש מסר אחר.</p><p class=\"study-source\">מקורות לבדיקת המנגנון: <a href=\"https://csrc.nist.gov/glossary/term/preimage_resistance\">NIST — preimage resistance</a> · <a href=\"https://csrc.nist.gov/glossary/term/second_preimage\">NIST — second preimage</a></p></section>","title":"ההבדל בין preimage, second preimage והתנגשות","old_number":9,"id":"P15","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":15}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"ממוקד","evidence":["Q067","Q140","Q150"],"mock":2,"answer_origin":"תרגיל 9 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת · ההסבר נבדק ונערך מחדש ב-14/11/2026, כולל כל ארבע החלופות","accepted_indices":[0],"reviewed":"2026-11-14","option_explanations":[{"option":"Second pre-image resistance.","correct":true,"reason":"Second pre-image resistance דורשת שיהיה קשה למצוא m₁ שונה עבור m₀ הנתונה, עם h(m₁)=h(m₀). תנאי הקלט וההצלחה תואמים במדויק לשאלה."},{"option":"Pre-image resistance כאשר נתון רק digest ואין הודעה.","correct":false,"reason":"ב-preimage נתון יעד hash ומחפשים קלט שמגיע אליו. כאן ניתן גם המסר המקורי ויש דרישה מפורשת למסרים שונים, ולכן זו הבעיה הספציפית של קדם-תמונה שנייה."},{"option":"סודיות מושלמת של OTP.","correct":false,"reason":"סודיות מושלמת של OTP עוסקת במידע שהצופן חושף על הודעה. כאן אין מפתח OTP או ciphertext, אלא חיפוש קלטים לפונקציית hash."},{"option":"עמידות להתנגשות שבה התוקף חופשי לבחור את שתי ההודעות מלכתחילה.","correct":false,"reason":"הזוג המתקבל אכן מהווה התנגשות; אין טענה אחרת. אך החלופה מתארת ניסוי שבו שני המסרים חופשיים לבחירה, בעוד שבשאלה m₀ נכפתה מראש. לכן היא אינה שם הניסוי המסוים שהתבקש: second preimage."}],"confidence":53,"confidence_kind":"skill-confidence-not-probability","skill":"second-preimage","skill_label":"קדם־תמונה שנייה: הודעה מקור ></div><div class=\"option-review\" data-option-review=\"3\"><h4>שגויה — 40</h4><p>40 הוא ערך φ(n), לא ההופכי. המכפלה 3×40 מתחלקת ב-40 ללא שארית ולכן אינה עומדת בדרישת שארית 1.</p></div><h3>דגש והנחות שחשוב לזכור</h3><p>חשוב לשמור על התנאי שניתן בשאלה. הגדרות RSA עשויות להשתמש גם ב-λ(n), אך כאן נדרשה במפורש הופכיות מודולו φ(n). אין להחליף בין המודולוס של פעולת RSA, שהוא n, לבין המודולוס המשמש במשוואה למציאת המעריך הפרטי.</p><p class=\"study-source\">מקורות לבדיקת המנגנון: <a href=\"https://www.rfc-editor.org/rfc/rfc8017.html#section-5.2.2\">RFC 8017 — RSA primitives</a></p></section>","title":"RSA — מציאת המעריך הפרטי","old_number":2,"id":"P16","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":16}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"משלים","evidence":["Q100","Q104","Q138","Q155"],"mock":2,"answer_origin":"תרגיל 2 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת · ההסבר נבדק ונערך מחדש ב-14/11/2026, כולל כל ארבע החלופות","accepted_indices":[0],"reviewed":"2026-11-14","option_explanations":[{"option":"27","correct":true,"reason":"3×27=81=2×40+1, ולכן המכפלה משאירה שארית 1 כנדרש. זו בדיקה ישירה של התשובה במשוואת המפתח."},{"option":"13","correct":false,"reason":"3×13=39≡−1 mod 40, ולא 1. המספר 13 מופיע בחלוקה האוקלידית, אבל ההופכי מתקבל מן המקדם השלילי −13, כלומר 27."},{"option":"3","correct":false,"reason":"3×3=9, ושאריתה מודולו 40 היא 9. אין כלל שאומר שהמעריך הפרטי שווה למעריך הציבורי; יש לבדוק את ההופכיות בפועל."},{"option":"40","correct":false,"reason":"40 הוא ערך φ(n), לא ההופכי. המכפלה 3×40 מתחלקת ב-40 ללא שארית ולכן אינה עומדת בדרישת שארית 1."}],"confidence":59,"confidence_kind":"skill-confidence-not-probability","skill":"rsa-gen","skill_label":"RSA: פרמטרים, הופכי ומעריכים","confidence_basis":{"topic_counts":{"exams":13,"a":6,"b":4,"both":4,"summer_b":3},"total_exams":18,"total_pairs":7,"summer_pair w\" data-option-review=\"3\"><h4>שגויה — מספר הפורט של הדפדפן.</h4><p>פורט הוא פרט ניתוב או זיהוי חיבור, לא תג אימות של המשא ומתן. הוא אינו מאפשר לזהות שינוי ברשימת האלגוריתמים.</p></div><h3>דגש והנחות שחשוב לזכור</h3><p>תחביר תקין לבדו אינו שולל כשל מוקדם, למשל היעדר אלגוריתם משותף. לכן השאלה מבהירה שהצדדים הגיעו לשלב האימות. RSA key exchange הוא מודל TLS היסטורי, ואין להחיל את רצף ההודעות שלו על TLS 1.3.</p><p class=\"study-source\">מקורות לבדיקת המנגנון: <a href=\"https://www.rfc-editor.org/rfc/rfc5246.html#section-7.4.9\">RFC 5246 — TLS 1.2 Finished</a></p></section>","title":"TLS 1.2 — זיהוי שינוי בתמליל באמצעות Finished","old_number":4,"id":"P19","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":19}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"רשת ביטחון","evidence":["Q003","Q005","Q033","Q061","Q107","Q110","Q124","Q134","Q144","Q158"],"mock":2,"answer_origin":"תרגיל 4 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת · ההסבר נבדק ונערך מחדש ב-14/11/2026, כולל כל ארבע החלופות","accepted_indices":[0],"reviewed":"2026-11-14","option_explanations":[{"option":"כישלון באימות Finished המחושב על תמליל ה-handshake.","correct":true,"reason":"Finished קושר את האימות גם לתמליל ההקמה. הלקוח והשרת מכניסים אליו בתים שונים, ולכן הבדיקה אינה אמורה לעבור לאחר השינוי המתואר."},{"option":"בדיקת ה-CA בלבד.","correct":false,"reason":"חתימת CA מאמתת קשרים בתעודה, כגון מפתח וזהות. היא אינה חתימה על רשימת האלגוריתמים ששלח הלקוח בחיבור המסוים הזה."},{"option":"עצם הגעת ClientHello תמיד גורמת לגילוי מיידי.","correct":false,"reason":"ClientHello חוקי תחבירית אינו בהכרח מעורר התרעה מיד עם הגעתו. ייתכנו כשלים מוקדמים מסיבות אחרות, אבל ההנחה המעודכנת אומרת שהחיבור הגיע ל-Finished."},{"option":"מספר הפורט של הדפדפן.","correct":false,"reason":"פורט הוא פרט ניתוב או זיהוי חיבור, לא תג אימות של המשא ומתן. הוא אינו מאפשר לזהות שינוי ברשימת \"option-review\" data-option-review=\"1\"><h4>שגויה — הוא חייב להישמר בסוד גם מהשרת.</h4><p>השרת זקוק ל-salt כדי לבדוק ניסיון כניסה, ואין דרישה שהוא יהיה סודי. סוד נוסף שנשמר בנפרד נקרא בדרך כלל pepper וממלא תפקיד אחר.</p></div><div class=\"option-review\" data-option-review=\"2\"><h4>שגויה — הוא מבטיח שאין שתי סיסמאות הנותנות אותו hash.</h4><p>salt אינו מבטל התנגשויות מתמטיות בפונקציה בעלת פלט סופי. הוא משנה את קלט הגיבוב ומפריד משתמשים, אך אינו מבטיח שלכל סיסמה יהיה פלט ייחודי.</p></div><div class=\"option-review\" data-option-review=\"3\"><h4>שגויה — הוא מאפשר לשחזר את הסיסמה המקורית בפענוח.</h4><p>hash אינו הצפנה בעלת פעולת פענוח. ה-salt אינו מפתח לשחזור הסיסמה; תוקף בדרך כלל מנחש מועמדים ומשווה תוצאות.</p></div><h3>דגש והנחות שחשוב לזכור</h3><p>הכתיב h(salt || password) הוא מודל השאלה, לא המלצה להשתמש ב-hash מהיר לאחסון סיסמאות. פונקציית גזירת סיסמאות ייעודית ועלות מתאימה מאטות כל ניחוש. גם הן אינן הופכות סיסמה חלשה לחסינה. salts אקראיים ארוכים מספיק נבחרים כדי שהשימוש החוזר בהם יהיה נדיר.</p><p class=\"study-source\">מקורות לבדיקת המנגנון: <a href=\"https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html\">OWASP — password storage</a></p></section>","title":"Salt — מה הוא מונע ומה אינו מונע","old_number":11,"id":"P24","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":24}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"משלים","evidence":["Q014","Q069","Q085","Q103","Q136"],"mock":3,"answer_origin":"תרגיל 11 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת · ההסבר נבדק ונערך מחדש ב-14/11/2026, כולל כל ארבע החלופות","accepted_indices":[0],"reviewed":"2026-11-14","option_explanations":[{"option":"הוא מקשה על שימוש חוזר בחישובי מילון בין משתמשים, אך אינו מונע ניחוש offline לכל משתמש.","correct":true,"reason":"המלחה מפרידה בין החישובים של משתמשים ומקשה על שימוש בטבלאות מוכנות מראש. היא עדי
