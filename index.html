סיון ניחוש.</p>\n<h3>זמינות פרמטרים ועלות ניחוש</h3>\n<p>הסתרת ערך ההמלחה באמצעות גיבוב בלבד יכולה דווקא לשבור את האימות החוקי: השרת מכיר את סיסמת הניסיון אך אינו יודע איזה ערך צריך לשרשר אליה. אם הערך המקורי אקראי וארוך, אין דרך מעשית לשחזר אותו מהגיבוב. קושי שהתכוון המפתח להטיל על התוקף הוטל במקרה זה גם על עצמו. לעומת זאת, שרשור שם משתמש שמור או הפעלת גיבוב נוסף הם חישובים שאפשר לשחזר מן הנתונים הזמינים.</p>\n<p>הגדלת מספר סבבי החישוב יכולה להעלות את המחיר של כל ניחוש. השרת מבצע את החישוב רק בכניסות לגיטימיות, בעוד תוקף שבודק מיליוני סיסמאות משלם את העלות שוב ושוב. הגרלת הרבה ערכי המלחה ושמירת האחרון בלבד אינה משיגה זאת, כי בבדיקת ניחוש לא חוזרים על ההגרלות שנזרקו. עלות מכוונת חייבת להיות חלק מחישוב ערך הבדיקה. פתרונות מעשיים משתמשים בפונקציית גזירת סיסמאות ייעודית ובפרמטרי עלות, אך בשאלה יש לנתח קודם את המבנה המוצע ולא להניח שכל שימוש בפונקציית גיבוב הוא בטוח אוטומטית.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>גם לאחר בחירת מבנה תקין יש להגביל ניסיונות כניסה מקוונים, להגן על ערוץ השליחה ולשמור הרשאות מצומצמות למסד. ערך המלחה אינו מגדיל את האקראיות של הסיסמה שהמשתמש בחר, ולכן סיסמה נפוצה עדיין עשויה להימצא בניחוש. ההגנה גורמת לתוקף לעבוד בנפרד לכל משתמש; היא אינה הופכת כל סיסמה קצרה לסוד ארוך ואקראי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_17092024_0 2 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q085.html"},{"id":"Q086","year":"2024","stem":"אילו מהסכנות הבאות עלולות להתרחש אם משתמשים באותם מפתחות בשני הכיוונים (מהלקוח לשרת ומהשרת ללקוח), והן אינן מתקיימות במידה ומשתמשים במפתחות שונים לכל כיוון?","options":["מתקפת reflection, כלומר התוקף יכול לשלוח ללקוח הודעה שהלקוח שלח לשרת, כאילו השרת שלח אותה.","התקפת One time pad.","שיבוש ביטים בהודעה.","מתקפת האזנה, כלומר, התוקף יוכל להסניף את ה plaintext."],"note":"","sources":[{"file":"2024/689156_04_17092024_0 2 (1).pdf","date":"17/09/2024","num":10}],"topic":"TLS / HTTPS","topic_manual":true,"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-16-10\" data-doc=\"original-16\" data-body-words=\"421\"><h2>שאלה 10 — מפתחות זהים בשני הכיוונים</h2><div class=\"answer-body\">\n<p><strong>א — reflection.</strong> תוקף עשוי להחזיר ללקוח הודעה שהלקוח עצמו הצפין ותייג, והלקוח יקבל אותה כאילו נוצרה בשרת. הפרדת מפתחות לפי כיוון מונעת קבלה זו: התג בכיוון האחר נבדק במפתח אחר. ב אינה שם התקפה שנובעת בהכרח מההנחה; ג תלויה בשלמות ואינה נפתרת רק בהפרדת כיוונים; ד האזנה אינה חושפת plaintext רק מפני שהמפתחות זהים בכיוונים. בדיקות תפקיד ומספרי רצף עשויות לספק הגנות נוספות.</p>\n<h3>למה צריך להפריד בין תפקידי שני הצדדים</h3>\n<p>בערוץ דו־כיווני אותה פעולה של הצפנה ותיוג עשויה להופיע גם בהודעות שהלקוח שולח וגם בהודעות שהשרת שולח. אם שני הצדדים משתמשים באותו מפתח, באותו פורמט ובאותן בדיקות, הודעה חוקית בכיוון אחד עלולה להיות חוקית גם בכיוון ההפוך. תוקף אינו צריך ליצור תוכן חדש: הוא יכול לקחת הודעה שכבר נוצרה בידי צד חוקי ולהחזיר אותה אליו כאילו הגיעה מן האחר.</p>\n<p>זהו רעיון ההשתקפות. למשל, צד שולח אתגר או בקשה מוצפנת, והתוקף מציג לו בחזרה את אותו ערך בתפקיד של תשובה. אם המקבל בודק רק שההצפנה והתג תקינים תחת המפתח המשותף, הוא עשוי להתעלם מהשאלה מי היה אמור ליצור את הערך ומה משמעותו בשלב הזה. ההתקפה מנצלת בלבול תפקידים והקשר, ולא בהכרח פגם מתמטי בצופן או יכולת לקרוא את ההודעה.</p>\n<h3>גזירת מפתחות לפי כיוון והגנות משלימות</h3>\n<p>דרך מניעה מרכזית היא להפיק מסוד משותף מפתחות שונים לכיוונים שונים, בעזרת תוויות שמבחינות ביניהם. אז הודעה שהלקוח תייג במפתח המיועד ממנו לשרת לא תעבור בדיקה במפתח שהלקוח מצפה לו עבור הודעות מן השרת. גם אם הבתים עצמם מועתקים ללא שינוי, ההרשאה הקריפטוגרפית שלהם קשורה לכיוון המקורי. זאת דוגמה להפרדת תחומים: משתמשים באותו מקור סוד אך לא באותו מפתח לכל מטרה.</p>\n<p>אפשר להוסיף גם סוג הודעה, זהויות תפקיד, מזהי סשן ומספרי רצף לתוכן המאומת. אלה מונעים העברה בין שלבים, חיבורים או סוגי פעולות שונים. עם זאת אין להסיק שהפרדת מפתחות לבדה פותרת כל התקפה: טיפול במספרים אקראיים, מניעת שידור חוזר ואימות זהות עדיין דורשים תכנון.</p>\n<p>ההשוואה בין החלופות צריכה לזהות מה נובע במיוחד משימוש משותף בשני הכיוונים. האזנה אינה מגלה פתאום מסר רק מפני שהמפתחות זהים בכיוונים, ושיבוש ביטים יכול להיות בעיה גם עם מפתחות נפרדים אם אין שלמות. לכן הסכנה הייחודית היא קבלת הודעה חוקית בתפקיד הלא נכון. הסבר זה גם מבהיר מדוע כדאי לקשור במפורש כל ערך קריפטוגרפי להקשרו, ולא להסתפק בהבטחה שמישהו בעל אותו סוד יצר אותו.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>מבחן מועיל לתכנון הוא לשאול אם הודעה שהצד עצמו מסוגל לייצר יכולה להתקבל אצלו בהמשך כראיה למעשה של האחר. אם התשובה חיובית, יש לבדוק איזה רכיב מבדיל בין תפקידים. תווית כיוון בתוך מידע מאומת או מפתח נגזר נפרד יכולים ליצור את ההבחנה. כותרת לא מאומתת שהתוקף יכול להחליף אינה מספקת אותו ביטחון.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_17092024_0 2 (1).pdf","question_type":"multiple-choice","solution":"solutions/Q086.html"},{"id":"Q087","year":"2024","stem":"להלן רשימה של סקריפטים המייצגים ביצוע של טרנזקציה בביטקוין (כל סקריפט כבר מכיל את השילוב של ה input script עם ה output script). רק סקריפט אחד הינו חוקי ותקני. סמנו אותו.","options":["[Signature] [Public Key] DUP HASH160 [Key Hash] EQUALVERIFY CHECKSIG","[Signature] [Public Key] DUP HASH160 [Key Hash] EQUALVERIFY","[Public Key] [Signature] HASH160 DUP [Key Hash] EQUALVERIFY CHECKSIG","CHECKSIG [Public Key] [Signature] HASH160 DUP [Key Hash] EQUALVERIFY"],"note":"","sources":[{"file":"2024/689156_04_20102024_0 3.pdf","date":"20/10/2024","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.365,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-17-01\" data-doc=\"original-17\" data-body-words=\"408\"><h2>שאלה 1 — סקריפט P2PKH תקין</h2><div class=\"answer-body\">\n<p><strong>א — [Signature] [Public Key] DUP HASH160 [Key Hash] EQUALVERIFY CHECKSIG.</strong> לאחר דחיפת חתימה ומפתח, משכפלים את המפתח, מגבבים עותק ומשווים לערך הנעול; לאחר מכן החתימה והמפתח נשארים ל־CHECKSIG. ב חסרה CHECKSIG ולכן אינה בודקת הוכחת בעלות ואינה תבנית P2PKH התקנית. ג דוחפת בסדר הפוך ומגבבת/משכפלת פריט שגוי; ד מתחילה ב־CHECKSIG לפני דחיפת הארגומנטים ולכן נכשלת. שימו לב שהשאלה דורשת סקריפט חוקי ותקני, ולא רק רצף שבנסיבות מסוימות אינו מפיל את המפרש.</p>\n<h3>נעילת פלט והוכחת הזכות להוציא אותו</h3>\n<p>בביטקוין אין צורך שהארנק ימסור את המפתח הפרטי לכורה או לשרת מרכזי. פלט של עסקה קודמת מכיל תנאי נעילה, ועסקה שמנסה להוציא אותו צריכה לספק נתונים שמקיימים את התנאי. בתבנית הנדונה התנאי מתייחס לגיבוב של מפתח ציבורי מסוים, ולכן המוציא מציג את המפתח עצמו וחתימה שנוצרה באמצעות הפרטי המתאים. אלה שני תפקידים משלימים: המפתח מאפשר לבדוק שהפונה מתאים לזהות הנעולה, והחתימה מוכיחה יכולת שימוש בסוד.</p>\n<p>אפשר לחשוב על ההבדל בין כתובת למשלוח מכתב לבין חתימה המאשרת הוראת תשלום. כתובת היעד אינה עצמה הרשאה לבצע פעולה, ובאותו אופן ידיעת גיבוב המפתח אינה הוכחת שליטה במטבעות. הגיבוב רשום כבר בפלט הציבורי וכל אחד יכול להעתיק אותו. לכן חלופה שמספקת רק מפתח ציבורי וגיבוב, ללא חתימה, אינה מסוגלת להוכיח שהמוציא מחזיק במפתח הפרטי.</p>\n<h3>ביצוע הסקריפט על המחסנית</h3>\n<p>סדר הנתונים חשוב משום שסקריפט פועל באמצעות מחסנית: כל פעולה לוקחת פריטים שהוכנסו לפניה ומחזירה תוצאה או נכשלת. תחילה נדחפות החתימה והמפתח הציבורי. פעולת השכפול משאירה עותק של המפתח לשלב אימות החתימה, בעוד העותק האחר נשלח לגיבוב. ערך הגיבוב המחושב מושווה לערך שנכתב בתנאי הנעילה. אם הם שונים הבדיקה נכשלת מיד; אם הם שווים, נותר לבדוק את החתימה בעזרת המפתח הציבורי המקורי.</p>\n<p>הבדיקה האחרונה קושרת את ההרשאה לעסקה שעליה נחתם. בתנאי חתימה רגילים אי אפשר להעתיק חתימה לעסקה אחרת עם נמענים אחרים ולצפות שתאומת, משום שהתוכן הנחתם השתנה. כשמציגים בשאלה את הסקריפט המשולב, צריך אפוא לעקוב לא רק אחרי רשימת המילים אלא גם אחרי סדר הדחיפה, אילו פריטים נשארים ואיזו פעולה צורכת אותם. היעדר פעולת אימות חתימה הוא כשל מהותי בתבנית התקנית, גם אם רצף אחר מסוגל לסיים ריצה בתנאים מסוימים. הציבוריות של המפתח אינה פוגעת בסודיות הפרטי, ואין צורך או הצדקה לחשוף את הפרטי במהלך הפדיון.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>מפתח ציבורי שאינו תואם לגיבוב הנעול ייכשל עוד לפני בדיקת החתימה, גם אם החתימה תקינה עבור אותו מפתח אחר. לעומת זאת, מפתח מתאים בלי חתימה נכונה יעבור את השוואת הגיבוב וייכשל בשלב האחרון. חלוקת הכשל לשני שלבים מבהירה מדוע שניהם הכרחיים: זיהוי תנאי היעד והוכחת הרשאה הם בדיקות שונות, ואין נתון יחיד המחליף את שניהם.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_20102024_0 3.pdf","question_type":"multiple-choice","solution":"solutions/Q087.html"},{"id":"Q088","year":"2024","stem":"אתר foo.com הוא רשת חברתית פשוטה, בה כל משתמש רשום, למשל בוב (Bob), יכול להעלות הודעה קצרה, למשל msg, ע\"י מילוי ושליחת טופס ב\"דף הבית\" שלו (בכתובת foo.com/Bob); שליחת הטופס תבוצע ע\"י בקשת GET לכתובת foo.com/Bob?m=msg. ההודעה תוצג בדף הבית של בוב וכן ב\"קיר של בוב\" בכתובת foo.com/Bob/wall, וגם בדפי הבית של ה\"חברים\" של בוב, למשל בדף foo.com/Alice. האתר משתמש ב\"עוגיות\" לזיהוי המשתמש, כדי למנוע למשל מתוקף (עם או בלי חשבון) להעלות הודעה תוך התחזות לבוב. איזה מבין הטענות הבאות נכונה?","options":["אם בוב יבקר באתר שבשליטת תוקף, התוקף יכול להעלות הודעות תוך התחזות לבוב","השימוש המתואר בשאלה בעוגיות מבטיח שתוקף לא יוכל להעלות הודעות תוך התחזות לבוב","השימוש המתואר בשאלה בבקשת GET מבטיח שתוקף לא יוכל להעלות הודעות תוך התחזות לבוב","אם השרת היה משתמש ב blind sql התוקף לא היה יכול להעלות הודעות תוך התחזות לבוב"],"note":"","sources":[{"file":"2024/689156_04_20102024_0 3.pdf","date":"20/10/2024","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.189,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-17-02\" data-doc=\"original-17\" data-body-words=\"409\"><h2>שאלה 2 — פרסום הודעה באמצעות GET ועוגיות</h2><div class=\"answer-body\">\n<p><strong>א — תוקף יכול לפרסם בשם בוב כשבוב מבקר באתר התוקף.</strong> האתר הזדוני גורם לדפדפן לבקש foo.com/Bob?m=...; אם עוגיות האימות מצורפות, השרת אינו מבחין בכוונת המשתמש. זו CSRF. ב שגויה: cookies מאמתות סשן אך לא כוונה; ג שגויה: GET דווקא מקל על יצירת הבקשה, והוא אינו ראוי לפעולה משנה מצב; ד אינה הגנה — blind SQL injection היא חולשה אחרת. ההנחה היא שאין SameSite/טוקן/בדיקת Origin שמונעים את צירוף ההרשאה או הפעולה.</p>\n<h3>האימות שמצליח והכוונה שאינה נבדקת</h3>\n<p>זיוף בקשות בין אתרים מנצל מצב שבו הדפדפן מוסיף הרשאה לבקשה באופן אוטומטי, בעוד האתר מפרש את עצם קבלת הבקשה כאילו המשתמש התכוון לבצע פעולה. התוקף אינו חייב לדעת את הסיסמה או לקרוא את עוגיית הכניסה. די בכך שהמשתמש כבר מחובר, שהדפדפן מצרף את העוגייה בהקשר התקיפה, ושהשרת מקבל פעולה רגישה ללא בדיקה נוספת של מקורה והקשרה.</p>\n<p>אפשר לדמיין דף תוקף שמפעיל ניווט לכתובת המעדכנת העדפה או מפרסמת הודעה בחשבון. מבחינת שרת היעד הגיעה בקשה בעלת עוגייה חוקית. מבחינת המשתמש הוא רק ביקר באתר אחר ולא אישר את השינוי. גם אם מדיניות המקור הזהה מונעת מהתוקף לקרוא את התשובה, עצם השינוי כבר עלול להתבצע. לכן תגובה ריקה או היעדר גישה למידע החוזר אינם שוללים את ההתקפה.</p>\n<h3>אילו הגנות משנות את תנאי התקיפה</h3>\n<p>טוקן אקראי שאינו נגיש לאתר התוקף מוסיף ערך שהדפדפן אינו מצרף אוטומטית רק מפני שיש לו עוגייה. האתר החוקי מכניס את הטוקן לטופס או לקוד שלו, והשרת בודק את התאמתו לסשן לפני הפעולה. המשתמש בדרך כלל אינו מקליד אותו. הגבלה של עוגיות בין אתרים יכולה למנוע את הצטרפות ההרשאה במסלולים מסוימים, ובדיקת מקור הבקשה מוסיפה מידע על ההקשר שממנו יצאה. חשוב לבדוק כל הגנה לפי פרטי המימוש ולא להניח שהיא פועלת רק משום ששמה מופיע בתיאור.</p>\n<p>שימוש בבקשה שאינה מיועדת לשנות מצב מתאים לתכנון פעולה פסיבית בלבד, ואינו מנגנון הרשאה. גם מעבר משליחת פרמטרים בכתובת לשליחת טופס אינו לבדו תיקון, משום שתוקף מסוגל להגיש טפסים. שמירת סיסמאות באופן מומלח מגינה על גניבת מאגר ולא על כוונת הבקשה. בנוסף, אם קיימת באתר הזרקת סקריפט, הקוד עשוי לקרוא את הטוקן ולשלוח פעולה תקינה בשם הקורבן. לפיכך הגנה טובה על בקשות רגילות והגנה מפני הרצת קוד לא מהימן משלימות זו את זו, וכל אחת תלויה בהנחת איום אחרת.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>פעולה רגישה צריכה לעבור גם בדיקת הרשאה רגילה: טוקן תקין אינו מתיר למשתמש שאינו מנהל לבצע פעולה ניהולית. הטוקן עוזר להראות שהבקשה שייכת להקשר הנכון, בעוד ההרשאה קובעת מה אותו משתמש רשאי לעשות. ערבוב שתי הבדיקות עלול ליצור מערכת שמונעת חלק מהבקשות המזויפות אך עדיין מאפשרת שימוש לרעה בחשבון בעל הרשאות נמוכות.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_20102024_0 3.pdf","question_type":"multiple-choice","solution":"solutions/Q088.html"},{"id":"Q089","year":"2024","stem":"אליס גלשה לאתר של בוב ב HTTPS , ונתון תוקף Man in the Middle נמצא בין אליס לאתר. נתון שהתוקף השיג את המפתחות הפרטיים של בוב המשמשים את בוב לתקשורת HTTPS ושבוב גילה שהמפתחות שלו הגיעו לידיו של התוקף. איזה מהסעיפים הבאים לא יסייעו לעצירת התקפות אפשריות של התוקף?","options":["Soft fail","Certificate Revocation List (CRL)","Online certificate status protocol (OCSP)","CRLsets"],"note":"","sources":[{"file":"2024/689156_04_20102024_0 3.pdf","date":"20/10/2024","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.184,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-17-03\" data-doc=\"original-17\" data-body-words=\"391\"><h2>שאלה 3 — מה אינו מסייע לאחר גניבת מפתח</h2><div class=\"answer-body\">\n<p><strong>א — Soft fail.</strong> אם בדיקת ביטול נכשלת עקב תקשורת והדפדפן ממשיך, MITM עשוי לחסום בירור ביטול ולהמשיך להציג תעודה שנגנבה. ב CRL, ג OCSP וד CRLsets יכולים להעביר מידע ביטול ולסייע בחסימה, בהתאם לכיסוי ועדכניות. הם אינם מבטיחים עדכון מיידי בכל לקוח, אך הם מנגנוני הפצה/בדיקת ביטול; soft fail הוא מדיניות המשכיות שמחלישה את האכיפה.</p>\n<h3>ביטול תעודה הוא עדכון אמון ולא שינוי במתמטיקה</h3>\n<p>תעודה עשויה להיות חתומה כחוק ועדיין להפסיק להיות אמינה לפני תאריך הפקיעה שלה, למשל מפני שמפתח פרטי נגנב. החתימה על התעודה אינה נעלמת כאשר הרשות מחליטה לבטל אותה, ולכן הלקוח זקוק למידע נוסף על סטטוסה. רשימת ביטול מפרסמת אוסף תעודות שבוטלו, ושירות סטטוס מקוון מאפשר לברר את המצב של תעודה מסוימת. בשני המקרים המקבל צריך לאמת שהמידע הגיע מגורם מורשה ושאינו ישן מדי.</p>\n<p>למפתח הפרטי של שרת האתר ולמפתח החתימה של רשות התעודות יש תפקידים שונים. גניבת מפתח האתר מאפשרת להתחזות לאתר בהקשרים שבהם התעודה עוד מתקבלת, אך אינה מאפשרת לחתום בשם הרשות על רשימת ביטול או תשובת סטטוס. אחרת כל שרת היה יכול לבטל את ביטולה של תעודתו בעצמו, וכל שרשרת האמון הייתה מאבדת את משמעותה. גם העתקת אישור קיים אינה מאפשרת לשנות את השדות שלו בלי לפגוע בחתימה.</p>\n<h3>הצמדה, פרטיות וכשל תקשורת</h3>\n<p>כאשר הדפדפן פונה ישירות לשירות הסטטוס, השירות עשוי ללמוד באיזו תעודת אתר הדפדפן מתעניין, ונוספות השהיה ותלות בזמינות רשת. הצמדת תשובת סטטוס מאפשרת לשרת האתר לקבל תשובה חתומה ולהגיש אותה ללקוחות במהלך ההקמה. השרת מעביר ראיה חתומה, ואינו מחליף את המשיב המורשה כחותם. הלקוח עדיין בודק התאמה, חתימה וטריות.</p>\n<p>מדיניות המשך במקרה כשל פירושה שאם הבירור אינו אפשרי, הלקוח עשוי להמשיך במקום לחסום. הדבר משפר זמינות אך עלול לאפשר לתוקף לחסום גישה לשירות הסטטוס ולנצל תעודה שכבר בוטלה. מכאן שפער בין ביטול אצל הרשות לבין אכיפה אצל משתמשים אינו מצביע בהכרח על זיוף חתימה: ייתכנו כשל תקשורת או מידע שמור שעוד נחשב עדכני. שקיפות תעודות פותרת בעיית גילוי הנפקות ואינה מחליפה את העברת הסטטוס הזה. גם שרתי שורש של מערכת שמות מתחם אינם רשויות ההפצה של ביטול תעודות, אף שבשני התחומים משתמשים במושג שורש.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>יש להבדיל גם בין ביטול תעודה לבין יצירת תעודה חדשה. הנפקת חלופה אינה גורמת אוטומטית לכל הדפדפנים להפסיק לקבל את הישנה, ותוקף עשוי להמשיך להציג את העותק שבידו. ניהול האירוע כולל לכן החלפת מפתח, הפצת מידע ביטול ובדיקת אכיפה אצל לקוחות. פעולה בצד שרת האתר בלבד אינה משנה את כל עוגני האמון והמטמונים של המשתמשים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_20102024_0 3.pdf","question_type":"multiple-choice","solution":"solutions/Q089.html"},{"id":"Q090","year":"2024","stem":"איזו מבין הטענות הבאות נכונה?","options":["שרת Root CA חותם על המפתח הפומבי של intermediate CA","ב TLS, לא משתמשים ב chain of trust","לקוח הגולש לשרת foo.com מוודא את תקינות התעודה שקיבל מהשרת ע\"י וידוא שהתעודה נחתמה באופן קריפטוגרפי חוקי ע\"י foo.com","שרת אינטרנט ניגש ל Root CA ומבקש ממנו לחתום על המפתח הפרטי של שרת האינטרנט"],"note":"","sources":[{"file":"2024/689156_04_20102024_0 3.pdf","date":"20/10/2024","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.308,"exam_count":1,"in_sample_exam":false,"variant_group":"V05","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-17-04\" data-doc=\"original-17\" data-body-words=\"394\"><h2>שאלה 4 — חתימת Root CA</h2><div class=\"answer-body\">\n<p><strong>א — Root CA חותם על תעודת intermediate CA הכוללת את המפתח הפומבי שלו.</strong> פורמלית נחתמת תעודה עם שדות וזהות, ולא המפתח לבדו. ב שגויה: TLS מבוסס תעודות משתמש בשרשרת אמון; ג שגויה: אימות חתימה עצמית של אתר אינו יוצר אמון של CA; ד שגויה: אין מוסרים מפתח פרטי ל־Root CA ואין חותמים עליו כחלק מהנפקת התעודה.</p>\n<h3>איך מפתח ציבורי נקשר לזהות</h3>\n<p>מפתח ציבורי ניתן לפרסום, אך ידיעת מפתח כלשהו אינה מספיקה כדי לדעת שהוא שייך לאתר המבוקש. תעודה פותרת את בעיית הקישור באמצעות חתימה של מנפיק על פרטי זהות, מפתח, תקופת תוקף ושדות הרשאה. הלקוח בודק את חתימת המנפיק באמצעות המפתח הציבורי שלו, ואם גם המנפיק אינו מוכר ישירות, ממשיך דרך תעודות ביניים עד לשורש אמון שכבר קיים אצלו.</p>\n<p>לכן לא נדרש שהמנפיק הישיר של כל אתר יופיע במאגר השורשים. רשות ביניים יכולה להיות מוסמכת בידי רשות גבוהה יותר, וההסמכה עצמה מיוצגת בתעודה חתומה עם מגבלות מתאימות. מנגד, חתימה עצמית של אתר אינה יוצרת אמון רק משום שהיא נכונה מבחינה מתמטית; כל אחד יכול ליצור זוג מפתחות ולחתום על תעודה של עצמו. עוגן האמון צריך להגיע ממקור שהלקוח כבר בחר לקבל.</p>\n<h3>אילו בדיקות נפרדות נדרשות</h3>\n<p>אימות כל החתימות בשרשרת הוא חלק הכרחי, אך צריך לבדוק גם התאמה לשם השרת, תקופות תוקף, הרשאות שימוש ומגבלות של הרשויות. זמני הפקיעה של כל התעודות אינם צריכים להיות זהים; כל תעודה צריכה להיות מתאימה למועד ולתפקיד בבדיקה. תעודה חוקית לאתר אחד אינה מתירה לתוקף להציג אותה כראיה לזהותו של אתר אחר. זהות היעד שהמשתמש ביקש היא חלק מן ההחלטה, ולא רק העובדה שקיימת חתימה ממנפיק מוכר.</p>\n<p>הרשות חותמת על נתונים הכוללים מפתח ציבורי ואינה צריכה לקבל את המפתח הפרטי של האתר. כתוצאה מכך עצם ההנפקה אינה מעניקה לה יכולת לפענח כל חיבור של האתר. כדי להבין פגיעה בעקבות גניבת מפתח צריך לברר איזה מפתח נגנב ואיזה פרוטוקול חילוף מפתחות הופעל. אין לערבב בין מפתחות תעודות, מפתחות תעבורה סימטריים ומפתחות של משיבי סטטוס. כל אחד מהם משמש להרשאה אחרת, וחתימה המתקבלת בהקשר אחד אינה בהכרח קבילה בהקשר אחר. ההפרדה הזאת היא הבסיס לבדיקת החלופות בשאלת שרשרת אמון ולהבנת גבולות הנזק של מפתח שנחשף.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בדיקת שם האתר צריכה להתייחס ליעד שהלקוח התכוון אליו לפני קבלת התעודה, ולא לשם שהתוקף הציג בתוך התעודה עצמה. אחרת תעודה חוקית לכל אתר הייתה מספיקה להתחזות לכל אתר אחר. זהו מקרה פרטי של קישור להקשר חיצוני מהימן: החתימה מאשרת שדות, והיישום צריך להשוות אותם לציפייה שלו כדי לקבל החלטת אמון.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_20102024_0 3.pdf","question_type":"multiple-choice","solution":"solutions/Q090.html"},{"id":"Q091","year":"2024","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["ב XSS מסוג DOM-based החולשה נמצאת בקוד שרץ בצד השרת","אחת מהדרכים להגן מפני התקפת CSRF היא בעזרת anti CSRF token. הגנה זאת הינה שקופה עבור המשתמשים ולא מצריכה מהם התנהגות מיוחדת","התקפת CSRF קלאסית, כפי שנלמדה בכיתה, בנויה על כך שהדפדפן מצרף עוגיות לבקשות","בהתקפת CSRF השרת אינו יודע שהבקשה אינה באמת של הקורבן"],"note":"","sources":[{"file":"2024/689156_04_20102024_0 3.pdf","date":"20/10/2024","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.243,"exam_count":1,"in_sample_exam":false,"variant_group":"V01","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-17-05\" data-doc=\"original-17\" data-body-words=\"390\"><h2>שאלה 5 — הטענה שאינה נכונה על DOM XSS</h2><div class=\"answer-body\">\n<p><strong>א — החולשה אינה בקוד שרת אלא בקוד שרץ בדפדפן.</strong> קלט לא אמין נכנס ל־DOM דרך sink מסוכן. ב נכונה: טוקן anti-CSRF נשלח אוטומטית ולרוב שקוף למשתמש; ג נכונה במודל CSRF קלאסי מבוסס cookies; ד נכונה כי השרת רואה בקשה בעלת הרשאה אך חסר לו אימות כוונת המשתמש. הצפנת התעבורה לבדה אינה מלמדת מי יזם את הפעולה.</p>\n<h3>כיצד קוד מוזרק מקבל את הרשאות האתר</h3>\n<p>הדפדפן אינו יודע איזו פיסת קוד נכתבה בכוונה בידי מפתח האתר ואיזו נכנסה בגלל חיבור לא בטוח של קלט אל תוכן העמוד. כאשר טקסט שמקורו בפרמטר, במסד נתונים או בכתובת מוכנס להקשר שמפורש כקוד, הוא עלול לרוץ כחלק מן האתר. הסקריפט מקבל אז את ההרשאות של מקור האתר הפגיע, ולא של האתר שבו התוקף הכין את הקלט. זו הסיבה שמדיניות ההפרדה בין מקורות אינה הגנה מספקת לאחר שההזרקה כבר הצליחה.</p>\n<p>בהזרקה מוחזרת השרת מחזיר קלט של הבקשה לתוך התגובה בצורה מסוכנת. בהזרקה שמורה הקלט נשמר קודם, למשל בהודעת משתמש, ומוצג בהמשך למבקרים. בהזרקה מבוססת מסמך הקוד הפגיע שרץ בדפדפן קורא קלט לא אמין ומעביר אותו לפעולה שמפרשת תוכן. חשוב להבדיל בין המיקום שבו נמצאת החולשה לבין המקום שבו הקוד הזדוני רץ: בכל המקרים הנדונים קוד התקיפה רץ בדפדפן, אך במסלול המבוסס על המסמך גם העיבוד הפגיע עשוי להתרחש שם ללא יצירת התוכן הפגום בשרת.</p>\n<h3>מדוע טוקן חבוי אינו מגן מקוד באותו מקור</h3>\n<p>טוקן נגד זיוף בקשות אמור להיות סוד שהתוקף שמפעיל אתר אחר אינו יכול לקרוא, אף שהדפדפן יכול לשלוח עוגיית כניסה אוטומטית. כאשר לתוקף יש קוד בתוך האתר עצמו, ההנחה הזאת נשברת: הקוד יכול לקרוא שדה חבוי, לאתר טופס, ולהגיש בקשה עם הטוקן יחד עם הרשאות הסשן. שדה חבוי מסתיר רכיב מהתצוגה הרגילה, אך אינו מצפין אותו ואינו מסתיר אותו מתוכנית בדפדפן.</p>\n<p>גם שימוש בבקשת שליחה שאינה כוללת פרמטרים בכתובת אינו מונע קריאה של הטוקן מתוך העמוד. בדומה לכך, חסימת קריאת עוגייה בסקריפט אינה מונעת מהסקריפט להפעיל פעולה שהדפדפן שולח אליה את העוגייה בעצמו. ההגנה הראשונית היא מניעת הזרקת הקוד באמצעות קידוד המתאים להקשר, פעולות מסמך בטוחות ומדיניות תוכן משלימה. הגנות אלה פועלות לפני שהקוד מקבל את הרשאות המקור.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>דוגמת פעולה תקינה שהופכת למסוכנת היא הצגת שם משתמש: אם המפתח מכניס את השם באמצעות פעולה שמפרשת תגיות, תו שנועד להיות חלק מהשם עלול לפתוח רכיב פעיל. אם אותו שם מוכנס כטקסט בלבד, התגים מוצגים ולא מבוצעים. ההבדל הוא באופן השימוש בקלט, ולא בהכרח במקור שממנו הגיע או בהרשאות המשתמש שהקליד אותו.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_20102024_0 3.pdf","question_type":"multiple-choice","solution":"solutions/Q091.html"},{"id":"Q092","year":"2024","stem":"אליס ובוב רוצים לתקשר ביניהם בצורה מאובטחת, באופן כזה שאם x שולח הודעה, x לא יוכל לאחר מכן להתכחש שהוא שלח את ההודעה. בכדי להשיג תקשורת שכזאת, עליהם להשתמש ב:","options":["חתימות דיגיטליות","Message authentication codes (MAC)","צופן קיסר","CSRF"],"note":"","sources":[{"file":"2024/689156_04_20102024_0 3.pdf","date":"20/10/2024","num":6}],"topic":"RSA, מפתח ציבורי וחתימות","topic_manual":true,"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":"V02","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-17-06\" data-doc=\"original-17\" data-body-words=\"369\"><h2>שאלה 6 — אי־יכולת הכחשה</h2><div class=\"answer-body\">\n<p><strong>א — חתימות דיגיטליות.</strong> רק השולח אמור להחזיק במפתח החתימה הפרטי, ואפשר לבדוק את החתימה בציבורי. ב MAC אינו ראיה לצד שלישי כי גם המקבל יכול לתייג. ג צופן קיסר הוא הצפנה חלשה ללא אימות; ד CSRF היא התקפה, לא מנגנון ראיות מקור. שיוך זהות אמין ושמירת המפתח עדיין נדרשים.</p>\n<h3>משמעות האימות ואופן הבדיקה</h3>\n<p>שלמות פירושה שהמקבל מסוגל לזהות שינוי בלתי מורשה בתוכן, ואותנטיות פירושה שיוך ההודעה למי שמחזיק בסוד המתאים. אלה תכונות נפרדות מסודיות: אפשר לפרסם הודעה לכל העולם ובכל זאת לוודא שלא שונתה ומי אישר אותה. בתהליך תיוג סימטרי הצדדים מחזיקים מפתח סודי משותף, השולח מפעיל פונקציית תיוג על המפתח ועל כל בתיה של ההודעה, והמקבל מחשב שוב את התג ומקבל רק אם הוא תואם לתג שנשלח. התוקף רשאי להכיר את האלגוריתם ואף לצפות בהודעות מתויגות רבות; הביטחון אמור לנבוע מחוסר ידיעת המפתח ולא מהסתרת שיטת החישוב.</p>\n<p>נניח שההודעה אומרת להעביר מאה שקלים, ומאזין מחליף אותה בהוראה להעביר תשע מאות. התג הישן חושב על רצף בתים אחר, ולכן בדיקת המקבל נכשלת. גם אם התוקף יודע לחשב גיבוב ציבורי, הוא אינו יכול להחליף אותו בתג תקף ללא המפתח. מסיבה זו גיבוב רגיל המצורף להודעה אינו מספק אותה הגנה: תוקף המשנה הודעה יכול פשוט לחשב מחדש את הגיבוב שלה.</p>\n<h3>מה אפשר להסיק ומה מחייב מנגנון נוסף</h3>\n<p>הבדיקה מעידה שההודעה אושרה בידי בעל המפתח, אך אינה מוכיחה למישהו חיצוני שרק השולח יכול היה ליצור אותה. גם המקבל יודע את המפתח ולכן מסוגל לייצר תג תקין. חתימה דיגיטלית משנה את חלוקת היכולות: החותם מחזיק מפתח פרטי, בעוד המאמתים מקבלים מפתח ציבורי שאינו מקנה יכולת חתימה. ההבחנה הזאת מסבירה מדוע אי־יכולת הכחשה דורשת חתימות ולא תג סימטרי בלבד. בשני המקרים צריך להגן על המפתחות ולקשור אותם לזהויות הנכונות. בנוסף, הודעה ישנה עם תג תקין נשארת תקינה מבחינה מתמטית; למניעת שידור חוזר יש לכלול מספר רצף, אתגר או מזהה פעולה ולבדוק אותם. התג אינו מצפין את התוכן, ולכן הצורך בסודיות מחייב שילוב מתאים עם הצפנה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>כדאי לבדוק גם בדיוק אילו שדות נכללים באימות: אם התג מכסה רק סכום אך אינו מכסה את הנמען, תוקף יכול להשאיר סכום תקין ולשנות את כתובת התשלום. המקבל צריך לאמת ייצוג חד־משמעי של כל פרטי הפעולה הרלוונטיים. עצם קיום תג אינו מבטיח ששדה שהושמט מן הקלט מוגן, ולכן ניתוח שלמות מתחיל בהגדרת המסר המאומת.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_20102024_0 3.pdf","question_type":"multiple-choice","solution":"solutions/Q092.html"},{"id":"Q093","year":"2024","stem":"איזו טענה אינה נכונה?","options":["מנגנון ה Signed Certificate Timestamp (SCT) נועד לפתור בעיית פרטיות הקיימת במנגנון ה OCSP","מנגנון ה Online Certificate Status Protocols (OCSP) ו מנגנון ה Certificate Transparency פותרים בעיות שונות","מנגנון Certificate Transparency ומנגנון Certificate Revocation List (CRL) פותרים בעיות שונות","מנגנון Certificate Transparency בא לידי ביטוי ב certificates על ידי ערכי ה Signed Certificate Timestamp (SCT)"],"note":"","sources":[{"file":"2024/689156_04_20102024_0 3.pdf","date":"20/10/2024","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.389,"exam_count":1,"in_sample_exam":false,"variant_group":"V09","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-17-07\" data-doc=\"original-17\" data-body-words=\"388\"><h2>שאלה 7 — הטענה השגויה על SCT</h2><div class=\"answer-body\">\n<p><strong>א — SCT אינו פתרון לבעיית הפרטיות של OCSP.</strong> הוא התחייבות חתומה של CT log לרישום תעודה. OCSP stapling הוא המנגנון שמאפשר לשרת להעביר תשובת OCSP חתומה ולחסוך פנייה ישירה של הדפדפן. ב וג נכונות: CT עוסק בהנפקות גלויות, OCSP ו־CRL בביטול. ד נכונה כתיאור שילוב SCT במערכת התעודות, גם אם ניתן למסרו גם מחוץ לגוף התעודה.</p>\n<h3>מדוע שרשרת אמון אינה מספיקה לביקורת הנפקות</h3>\n<p>רשות מוסמכת יכולה להנפיק בטעות תעודה לדומיין שאינו שייך למבקש, או שמפתח שלה עלול להיות מנוצל לרעה. לקוח הבודק רק חתימות עשוי לראות תעודה בעלת שרשרת חוקית, אף שבעל הדומיין האמיתי כלל לא ביקש אותה. שקיפות תעודות מוסיפה יכולת תצפית ציבורית: התעודות והתחייבויות הרישום שלהן מופיעות ביומנים שאפשר לבדוק ולנטר. המטרה אינה להצפין את התעודה או להסתיר את זהות האתר, אלא לאפשר גילוי של הנפקות חריגות גם לאחר שעברו את בדיקת החתימות הרגילה.</p>\n<p>יש להפריד בין הרשות המנפיקה, היומן והמנטר. היומן מקבל תעודות ומנהל מבנה נתונים שניתן לביקורת. המנטר קורא רישומים ומחפש למשל תעודות חדשות עבור דומיינים שהארגון מנהל. בעל דומיין שרואה תעודה שלא הזמין יכול לפתוח בירור ולבקש טיפול. עצם העובדה שתעודה מופיעה ביומן אינה אומרת שהיומן אישר שהמבקש הוא בעל הדומיין; בדיקת הזכאות להנפקה היא אחריות נפרדת.</p>\n<h3>התחייבות חתומה, הוכחת הכלה וביטול</h3>\n<p>חותמת הזמן החתומה היא הבטחה של יומן מסוים לכלול את התעודה בהתאם לכלליו. חתימת היומן מאפשרת לדפדפן לזהות מי נטל את ההתחייבות ולוודא שלא שינו אותה. היא שונה מהוכחת הכלה בעץ מרקל, שמראה כי רשומה מסוימת כבר נכללה במצב מסוים של היומן. הוכחת עקביות נועדה להראות שהיומן גדל באמצעות הוספה ולא שכתב את עברו. מבני הנתונים האלה מאפשרים ביקורת יעילה גם בלי שכל לקוח יוריד כל רשומה.</p>\n<p>דפדפן יכול לדרוש התחייבויות מיומנים שהוא מכיר, בהתאם למדיניותו, ועדיין חייב לבדוק זהות דומיין, שרשרת אמון וזמני תוקף. מנגנוני ביטול כגון רשימות ביטול או תשובות סטטוס פותרים בעיה אחרת: תעודה שהייתה קיימת כעת אינה אמורה להתקבל. רישום פומבי אינו מוחק תעודה ואינו מונע לבדו שימוש במפתח שנגנב. לכן חלופה המחליפה שקיפות בביטול, או טוענת שחותמת היומן פותרת את פרטיות בירור הסטטוס, מבלבלת בין מנגנונים שונים.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>נניח שבעל אתר מגלה ביומן תעודה שהונפקה בשמו בלי ידיעתו. הממצא מאפשר לפתוח בירור מול המנפיק ולנקוט פעולות ביטול והחלפה, אך היומן אינו מתקן לבדו את ההנפקה. זהו ההבדל בין ראיה ציבורית שמסייעת לגילוי ולהרתעה לבין אמצעי אכיפה שמונע קבלת תעודה מסוימת. שני התפקידים משלימים זה את זה ונחוצים בזמנים שונים של הטיפול באירוע.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_20102024_0 3.pdf","question_type":"multiple-choice","solution":"solutions/Q093.html"},{"id":"Q094","year":"2024","stem":"הבטיחות של מנגנון החלפת המפתחות של דיפי-הלמן מתבססת על?","options":["בעיית הלוגריתם הדיסקרטי","צופן ויז׳נר","אמון (trust)","בעיית ה 51%"],"note":"","sources":[{"file":"2024/689156_04_20102024_0 3.pdf","date":"20/10/2024","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"דיפי-הלמן והחלפת מפתחות","topic_score":0.309,"exam_count":1,"in_sample_exam":false,"variant_group":"V08","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-17-10\" data-doc=\"original-17\" data-body-words=\"410\"><h2>שאלה 10 — הנחת הקושי של דיפי–הלמן</h2><div class=\"answer-body\">\n<p><strong>א — בעיית הלוגריתם הדיסקרטי, במסגרת רמת הקורס.</strong> מתוך g ו־gᵃ modp קשה לשחזר a בחבורה מתאימה. ניסוח מדויק יותר לסוד המשותף הוא הנחת CDH, ולהבחנתו מאקראי DDH; קושי DLP לבדו אינו מבטיח לוגית כל אחת מהן בכל חבורה. ב צופן ויז׳נר אינו הבסיס; ג אמון נדרש לאימות זהויות אך אינו בעיית הקושי המתמטית; ד 51% עוסקת בקונצנזוס PoW. DH לא מאומת פגיע ל־MITM גם כאשר הבעיה המתמטית קשה.</p>\n<h3>איך נוצר סוד משותף בלי לשלוח אותו</h3>\n<p>בחילוף המפתחות הנדון שני הצדדים מסכימים על קבוצה מתמטית, בסיס ומודולוס. כל צד בוחר מעריך פרטי, מעלה את הבסיס בחזקה שלו ושולח רק את התוצאה הציבורית. לאחר מכן הוא מעלה את הערך שקיבל בחזקת הסוד הפרטי שלו. חוקי החזקות מבטיחים ששני הצדדים יגיעו לאותו ערך, משום שכפל המעריכים מתחלף. התמליל הציבורי כולל אפוא את הבסיס ושני ערכי החזקה, אך אינו כולל במפורש את שני המעריכים או את הסוד המשותף.</p>\n<p>בשאלות מספריות קטנות אפשר למצוא את המעריך המתאים לערך ציבורי באמצעות טבלת חזקות. אין כאן סתירה לביטחון העקרוני: המודולוסים הזעירים נבחרו כדי לאפשר חישוב בבחינה, ולא כדי לייצג פרמטרים בטוחים. אחרי שמוצאים מעריכים אפשריים, מחשבים את הסוד בשתי דרכים ובודקים התאמה. ריבועים חוזרים וצמצום השארית בכל צעד מקטינים את המספרים ומאפשרים לתפוס שגיאת חשבון לפני בחירת האפשרות.</p>\n<h3>הנחת הקושי לעומת אימות הזהויות</h3>\n<p>בעיית הלוגריתם הדיסקרטי שואלת כיצד לשחזר מעריך מתוך הבסיס ותוצאת החזקה. חישוב הסוד המשותף ישירות מתוך שני ערכים ציבוריים מנוסח באמצעות הנחת קושי קשורה, שאינה זהה בכל קבוצה מתמטית. במסגרת השאלון הייחוס ללוגריתם דיסקרטי הוא ההבחנה המבוקשת מול צפנים קלאסיים או מנגנוני קונצנזוס. בפרוטוקול מעשי צריך גם לבדוק את תקינות ערכי הקלט, לבחור קבוצה מתאימה ולהפיק מן הסוד מפתחות באמצעות פונקציית גזירה.</p>\n<p>המתמטיקה לבדה אינה מאמתת עם מי הוחלפו הערכים. תוקף פעיל יכול להציב ערך ציבורי משלו מול כל צד, ליצור שני סודות שונים ולתווך בין הצדדים. לעומת זאת, מאזין פסיבי שאינו משנה הודעות אינו יכול לבצע החלפה כזאת. לכן בתרחיש שמגביל במפורש את התוקף להאזנה, אין לפסול את השיטה רק מפני שהיא פגיעה לתוקף פעיל חזק יותר. כשנדרש אימות אפשר לחתום על ערכי ההחלפה והקשרם או להשתמש במנגנון מאומת אחר. יש להפריד בכל תשובה בין סודיות מול מאזין, חישוב הסוד המספרי והבטחת זהות הצד האחר.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אם מוצאים כמה מעריכים שמניבים אותו ערך ציבורי בקבוצה הקטנה, אין לבחור ביניהם לפי מראית עין. הם יכולים להיות שקולים לפי סדר תת־הקבוצה שנוצרת מן הבסיס, ולכן לייצר אותו סוד משותף. החישוב צריך להיעשות בתוך הקבוצה והמודולוס הנתונים. לא מחברים את הערכים הציבוריים זה לזה ולא מתייחסים לאחד מהם אוטומטית כאל המפתח הסופי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_04_20102024_0 3.pdf","question_type":"multiple-choice","solution":"solutions/Q094.html"},{"id":"Q095","year":"2024","stem":"נתון שרת אשר בונה שאילתא בעזרת המחרוזת הבאה על בסיס ערכי המשתנים InputUsername, InputPassword, אשר נשלחים לשרת מהדפדפן:\n```\n\"SELECT * FROM users WHERE username = '\" + InputUsername + \"' AND password = '\" + InputPassword + \"'\"\n```\nאילו ערכים יהוו sql injection תקין? (בכל האופציות הבאות, הפסיק מפריד בין שני המשתנים ואינו חלק מהערך של המשתנה והערך של המשתנה מופיע אחרי הנקודותיים)","options":["InputUsername: ' or 1=1 --, InputPassword: ' and '1' = '1","InputUsername: or 1=1, InputPassword: foo\"","InputUsername: and 1=1, InputPassword: ' and \"1\" = \"1","InputUsername: 'Alice', InputPassword: ' or 1 = 1"],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.261,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-23-01\" data-doc=\"original-23\" data-body-words=\"423\"><h2>שאלה 1 — SQL injection בתנאי התחברות</h2><div class=\"answer-body\">\n<p><strong>א — username: ′ or 1=1 --.</strong> בגרשי SQL רגילים השאילתה נעשית WHERE username='' or 1=1 --' AND password=... . התנאי 1=1 אמת והמשך השורה הופך להערה, ולכן ערך הסיסמה אינו משנה. ב וג אינן סוגרות את מחרוזת username ולכן נשארות קלט טקסט ולא אופרטורים; ד יוצרת גרשיים בלתי מאוזנים הן בשם והן בסוף הסיסמה. יש להניח תחביר DB שמכיר -- כהערה ולפי הצורך רווח אחריו. ההגנה היא פרמטרים ולא הרכבת SQL בקלט.</p>\n<h3>מתי קלט מפסיק להיות נתון והופך לתחביר</h3>\n<p>הזרקת שאילתות מתרחשת כשהיישום בונה פקודת מסד נתונים באמצעות חיבור טקסט של קלט משתמש אל קטעי פקודה. התוקף מנצל את העובדה שמפרש השאילתה אינו מכיר את הגבול שהמפתח התכוון להציב בין ערך הסיסמה לבין אופרטורים, תנאים והערות. אם גרש בקלט סוגר את מחרוזת הנתונים, ההמשך עלול להתפרש כפקודה ולא כשם משתמש או סיסמה.</p>\n<p>דרך מסודרת לבדוק חלופה היא להציב את הקלט בדיוק בתוך תבנית השאילתה, כולל הגרש הפותח, הגרש הסוגר והטקסט שמגיע אחריו. אחרי ההצבה מסמנים אילו חלקים נשארים בתוך מחרוזות ואילו חלקים הפכו לתחביר. לא מספיק לזהות את המילה המציינת או ואת התנאי שתמיד מתקיים; אם נשאר גרש עודף בסוף השאילתה, ייתכן שכל הביטוי ייכשל כשגיאת תחביר ולא יעקוף את האימות.</p>\n<h3>קדימות תנאים, הערות ותיקון מבני</h3>\n<p>תנאי חיבור לוגי מסוג וגם נבדק בדרך כלל לפני תנאי מסוג או. משום כך הוספת תנאי אמת באמצעות או יכולה להפוך את הביטוי הכולל לאמת גם כשהסיסמה אינה נכונה. הוספת אותו תנאי אמת באמצעות וגם אינה מבטלת את הצורך שסיסמת המקור תתאים. שימוש בהערת שורה עשוי לבטל את יתרת התנאי, אך יש לבדוק את תחביר מנוע המסד, לרבות דרישה אפשרית לרווח אחרי סימן ההערה. גרשיים טיפוגרפיים במסמך לימודי צריכים להתפרש כייצוג של התווים התחביריים המתאימים, ולא כהוכחה שכל תו מודפס יתקבל בכל מנוע.</p>\n<p>התיקון העקרוני הוא שימוש בשאילתה פרמטרית, שבה מבנה הפקודה נמסר בנפרד מן הערכים. כך המפרש מתייחס למחרוזת המשתמש כנתון גם כשהיא מכילה תווים מיוחדים. מנגנוני הצפנת תעבורה, הגנה מפני מסגור וטוקנים נגד זיוף בקשות אינם משנים את האופן שבו מסד הנתונים מפרש חיבור מחרוזות. גם סינון נקודתי של מילה או תו אינו תחליף להפרדה המבנית, משום שקיימות צורות תחביר רבות ותלויות הקשר. בשאלה מספיק להראות איזו הצבה יוצרת ביטוי חוקי ומעקף, ולמה יתר ההצבות נשארות טקסט, שגויות תחבירית או אינן משנות את תוצאת האימות.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>כדי להמחיש את ההבדל בין מתקפה לבין קלט חשוד, אפשר לבחור סיסמת ניסיון שגויה ולבדוק את הביטוי לאחר ההצבה. אם התנאי נשאר שקר, לא נוצר מעקף רק מפני שהקלט מכיל מילת מפתח. אם הפקודה אינה ניתנת לפירוש, התקבלה שגיאה ולא כניסה חוקית. ניתוח תחביר ותוצאת אמת נדרשים יחד, וזו הסיבה שיש להציב כל חלופה במלואה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_24112024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q095.html"},{"id":"Q096","year":"2024","stem":"נתון plaintext הבא: \"QUIZ\" (הplaintext הוא ללא הגרשיים). לפי צופן קיסר (צופן קיסר ממש כפי שנלמד ולא צפנים כלליים יותר), מה יהיה ה ciphertext?","options":["TXLC","RVMC","NLLW","OXFY"],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.365,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-23-02\" data-doc=\"original-23\" data-body-words=\"392\"><h2>שאלה 2 — צופן קיסר למסר QUIZ</h2><div class=\"answer-body\">\n<p><strong>א — TXLC.</strong> בקיסר הקלאסי הזזה ב־3: Q→T,‏ U→X,‏ I→L,‏ Z→C תוך גלישה באלפבית. ב RVMC אינה הזזה עקבית ב־3, וג NLLW וד OXFY אינן מתקבלות מההזזה הנתונה. הייחוס הוא לקיסר הקלאסי שנלמד ולא לכל צופן הזזה אפשרי.</p>\n<h3>מפתח כפעולה על האלפבית</h3>\n<p>בצופן החלפה כל אות גלויה מקבלת אות פלט לפי מפתח. כאשר המפתח הוא תמורה מלאה, כל אות קלט ממופה לאות פלט אחרת, ואין שתי אותיות קלט שמתמזגות לאותה אות פלט. תכונת החד־חד־ערכיות היא שמאפשרת לפענח ללא עמימות. לכן יש להבחין בין מספר אותיות האלפבית לבין מספר המפתחות האפשריים: המפתח קובע את כל הטבלה, ולא רק בחירה של אות אחת.</p>\n<p>ספירת תמורות נעשית באמצעות כלל הכפל. לאות הראשונה יש מספר אפשרויות השווה לגודל האלפבית, לשנייה אפשרות אחת פחות, וכן הלאה עד האפשרות האחרונה. אם כבר ידוע מיפוי מסוים, מסירים מן החישוב את אות הקלט ואת אות הפלט שנקבעו. כל המיפויים הנותרים עדיין צריכים להיות התאמה חד־חד־ערכית. משום כך מידע על מיפוי אחד אינו פשוט מחסיר מספר קטן של מפתחות מתוך הרשימה המקורית, אלא מקבע אילוץ המתקיים רק בחלק ממנה.</p>\n<h3>הזזה קבועה לעומת תמורה כללית</h3>\n<p>צופן קיסר הוא מקרה מצומצם במיוחד של החלפה, שבו לכל האותיות מופעל אותו מרחק הזזה באלפבית. אפשר לייצג אות במספר, להוסיף את ההזזה ולצמצם מודולו גודל האלפבית. הצמצום הוא שמחזיר אותיות שעברו את סוף האלפבית לתחילתו. כאשר שאלה מתייחסת לקיסר הקלאסי, אין לבחור הזזה חדשה כרצוננו כדי להתאים לאחת החלופות; צריך להשתמש בהזזה שנקבעה בהגדרת הצופן.</p>\n<p>דרך טובה לבדוק פלט מוצע היא לחשב את ההפרש בכל מיקום. אם אות אחת דורשת הזזה מסוימת ואות אחרת דורשת הזזה אחרת, הפלט אינו תוצאת אותו צופן הזזה. אין צורך לנחש מילה שנראית סבירה, משום שהמבחן הוא מתמטי ונקבע אות אחר אות. גם סדר החישוב ואופן ספירת האות הראשונה צריכים להיות עקביים: שינוי בין מספור מאפס למספור מאחד בלי התאמת הנוסחה גורם לטעות קבועה. הצפנים האלה מדגימים מושגים של מפתח ומרחב מפתחות, אך אינם מספקים ביטחון מודרני; תדירויות, חזרות ומספר קטן של אפשרויות מאפשרים לתקוף אותם. ידיעת קטע מן המיפוי או מן המסר מצמצמת עוד יותר את אי־הוודאות.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אם התוקף מכיר זוג של אות גלויה ואות מוצפנת בצופן הזזה, הוא יכול להסיק את ההזזה ולבדוק אותה על כל יתר הטקסט. בצופן תמורה כללי אותו זוג חושף רק מיפוי אחד ואינו קובע את היתר. ההבדל הזה מחדד מדוע מרחבי המפתחות שונים מאוד למרות שבשניהם מחליפים אות באות. לא כל כלל שנכון למשפחה מצומצמת חל על כל צפני ההחלפה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_24112024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q096.html"},{"id":"Q097","year":"2024","stem":"בצופן Vigenère, המפתח ״CODE״ (בלי הגרשיים) משמש להצפנה של plaintext שהינו באורך 5 תווים. נתון שכל אות ב plaintext נבחרה באקראי מתוך 26 אותיות האלפבית. מה ההסתברות ששני תווים מוצפנים זהים יופיעו במרחק של 4 תווים אחד מהשני ב ciphertext?\n(יופיעו במרחק של 4 תווים אחד מהשני ==> בין המופע הראשון של התו למופע השני יש 3 תווים אחרים)","options":["1/26","1/13","1/16","1/4"],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.291,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-23-03\" data-doc=\"original-23\" data-body-words=\"396\"><h2>שאלה 3 — הסתברות לחזרת תווים ב־Vigenère</h2><div class=\"answer-body\">\n<p><strong>א — 1/26.</strong> במסר בן 5 תווים יש רק זוג מיקומים במרחק 4: הראשון והחמישי. המפתח CODE חוזר, לכן בשני המיקומים מוזזים באותה אות C. מתקיים C₁=C₅ אם ורק אם P₁=P₅. שני תווים אחידים ועצמאיים שווים בהסתברות 26/26²=1/26. ב,ג,ד אינן סופרות את 26 האפשרויות השוות־הסתברות; אורך המפתח קובע את המחזוריות, לא מכנה 4 או 16.</p>\n<h3>מחזור המפתח ותלות בין מיקומים</h3>\n<p>בצופן הנדון אותיות המפתח קובעות הזזות, והמפתח חוזר במחזוריות עד סוף ההודעה. לכן מיקומים שהפרשם שווה לאורך מחזור המפתח משתמשים באותה הזזה. העובדה הזאת אינה אומרת שהתווים המוצפנים בהם חייבים להיות שווים; היא אומרת שהשוואת תווים במיקומים האלה שקולה להשוואת התווים הגלויים המקוריים, כי הוספת אותה הזזה לשניהם שומרת על שוויון ועל אי־שוויון.</p>\n<p>את החישוב אפשר לנסח בחשבון מודולרי: תו הפלט הוא סכום ערך תו הקלט וערך תו המפתח, כשהתוצאה מצטמצמת לפי גודל האלפבית. אם לשני מיקומים אותו תו מפתח, אפשר להפחית משני הצדדים את אותה ההזזה. נשאר תנאי פשוט על שתי אותיות הקלט. זו הסיבה שהאורך המספרי של המפתח אינו הופך אוטומטית למכנה של ההסתברות; הוא קובע אילו מיקומים משתמשים באותה פעולה, ולא כמה ערכי אות אפשריים קיימים.</p>\n<h3>ספירת הזוגות וההנחות ההסתברותיות</h3>\n<p>לפני חישוב הסתברות צריך לבדוק כמה זוגות מיקומים עומדים בדרישת המרחק. במסר קצר יכול להיות רק זוג אחד, ובמסר ארוך יכולים להיות זוגות רבים ואף תלות בין האירועים. עבור זוג יחיד של אותיות שנבחרות באופן אחיד ועצמאי, אפשר לקבע את הראשונה ולשאול מה הסיכוי שהשנייה תיפול בדיוק על הערך היחיד המתאים. לחלופין סופרים את כל זוגות האותיות ואת מספר הזוגות השווים ומחלקים.</p>\n<p>אין לערבב את ההנחה שהמפתח חוזר עם הנחה שהמסר עצמו חוזר. המפתח קובע דפוס הזזות, בעוד התוכן הגלוי בשאלה מוגרל בנפרד. אם המקור היה טקסט טבעי ולא אותיות אחידות, ההסתברות לשוויון הייתה תלויה בהתפלגות השפה ואולי גם בתלות בין האותיות. גם אם בשני מיקומים יש הזזות שונות, אין פירוש הדבר ששוויון בפלט בלתי אפשרי: במקרה כזה נדרש הפרש מתאים בין אותיות הקלט. השאלה המסוימת מפשטת את הבעיה בעזרת מחזוריות זהה במיקומים הנבחנים. הבנת ההפחתה האלגברית מאפשרת לפתור אותה בלי לנחש תוצאות הצפנה ובלי לספור את כל המחרוזות האפשריות אחת אחת.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>במסר ארוך יותר שבו יש הרבה זוגות במרחק המבוקש, ההסתברות שקיימת לפחות חזרה אחת אינה שווה בדרך כלל להסתברות עבור זוג בודד. צריך לספור את אירועי השוויון ולבדוק תלות או להשתמש באירוע המשלים. לכן זיהוי אורך המסר ומספר הזוגות הוא חלק מן הפתרון, ולא פרט קישוט. במקרה הנתון המבנה הקצר מאפשר לצמצם את כל הבעיה לזוג יחיד.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_24112024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q097.html"},{"id":"Q098","year":"2024","stem":"איזו מהטענות הבאות על Certificate Transparency היא לא נכונה?","options":["CA חייב להשתמש ב CT logs כדי לרשום את כל התעודות שהוא מנפיק, אך לא כל רשומה ב log חייבת להיות גלויה לציבור.","Certificate Transparency מבוססת על שימוש ב public logs כדי לאפשר מעקב אחרי תעודות שניתנו על ידי CAים, ובכך לזהות בהקדם תעודות לא מורשות או מזויפות.","Certificate Transparency מאפשרת לבצע קריאות לשירותי CT logs כדי לבדוק אם תעודה נרשמה בלוגים פומביים.","Certificate Transparency כוללת את השימוש ב-SCT (Signed Certificate Timestamp), והדפדפן בודק את תקינות ה-SCT לפני שמאשר שימוש בתעודה."],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.444,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-23-04\" data-doc=\"original-23\" data-body-words=\"394\"><h2>שאלה 4 — הטענה השגויה על CT</h2><div class=\"answer-body\">\n<p><strong>א — היומן אינו מיועד להסתיר רשומות מהציבור.</strong> שקיפות הנפקות מחייבת גישה ציבורית וביקורת; עצם היות CA מגיש אינו מצדיק רשומה סודית במודל CT. ב נכונה: לוגים ציבוריים מסייעים לזהות הנפקות לא מורשות; ג נכונה: ניתן לבדוק רישום/הוכחות מול לוגים; ד נכונה במודל אכיפת CT באמצעות SCT. דיוק: מדיניות דפדפן והיקף חובת CT תלויים בסוג התעודה, והבטחת SCT אינה לבדה הוכחת הכלה מיידית.</p>\n<h3>מדוע שרשרת אמון אינה מספיקה לביקורת הנפקות</h3>\n<p>רשות מוסמכת יכולה להנפיק בטעות תעודה לדומיין שאינו שייך למבקש, או שמפתח שלה עלול להיות מנוצל לרעה. לקוח הבודק רק חתימות עשוי לראות תעודה בעלת שרשרת חוקית, אף שבעל הדומיין האמיתי כלל לא ביקש אותה. שקיפות תעודות מוסיפה יכולת תצפית ציבורית: התעודות והתחייבויות הרישום שלהן מופיעות ביומנים שאפשר לבדוק ולנטר. המטרה אינה להצפין את התעודה או להסתיר את זהות האתר, אלא לאפשר גילוי של הנפקות חריגות גם לאחר שעברו את בדיקת החתימות הרגילה.</p>\n<p>יש להפריד בין הרשות המנפיקה, היומן והמנטר. היומן מקבל תעודות ומנהל מבנה נתונים שניתן לביקורת. המנטר קורא רישומים ומחפש למשל תעודות חדשות עבור דומיינים שהארגון מנהל. בעל דומיין שרואה תעודה שלא הזמין יכול לפתוח בירור ולבקש טיפול. עצם העובדה שתעודה מופיעה ביומן אינה אומרת שהיומן אישר שהמבקש הוא בעל הדומיין; בדיקת הזכאות להנפקה היא אחריות נפרדת.</p>\n<h3>התחייבות חתומה, הוכחת הכלה וביטול</h3>\n<p>חותמת הזמן החתומה היא הבטחה של יומן מסוים לכלול את התעודה בהתאם לכלליו. חתימת היומן מאפשרת לדפדפן לזהות מי נטל את ההתחייבות ולוודא שלא שינו אותה. היא שונה מהוכחת הכלה בעץ מרקל, שמראה כי רשומה מסוימת כבר נכללה במצב מסוים של היומן. הוכחת עקביות נועדה להראות שהיומן גדל באמצעות הוספה ולא שכתב את עברו. מבני הנתונים האלה מאפשרים ביקורת יעילה גם בלי שכל לקוח יוריד כל רשומה.</p>\n<p>דפדפן יכול לדרוש התחייבויות מיומנים שהוא מכיר, בהתאם למדיניותו, ועדיין חייב לבדוק זהות דומיין, שרשרת אמון וזמני תוקף. מנגנוני ביטול כגון רשימות ביטול או תשובות סטטוס פותרים בעיה אחרת: תעודה שהייתה קיימת כעת אינה אמורה להתקבל. רישום פומבי אינו מוחק תעודה ואינו מונע לבדו שימוש במפתח שנגנב. לכן חלופה המחליפה שקיפות בביטול, או טוענת שחותמת היומן פותרת את פרטיות בירור הסטטוס, מבלבלת בין מנגנונים שונים.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>נניח שבעל אתר מגלה ביומן תעודה שהונפקה בשמו בלי ידיעתו. הממצא מאפשר לפתוח בירור מול המנפיק ולנקוט פעולות ביטול והחלפה, אך היומן אינו מתקן לבדו את ההנפקה. זהו ההבדל בין ראיה ציבורית שמסייעת לגילוי ולהרתעה לבין אמצעי אכיפה שמונע קבלת תעודה מסוימת. שני התפקידים משלימים זה את זה ונחוצים בזמנים שונים של הטיפול באירוע.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_24112024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q098.html"},{"id":"Q099","year":"2024","stem":"Alice ו Bob, מחליפים מפתח באמצעות פרוטוקול Diffie-Hellman, כאשר נתון ש n = 23 ו g = 5.\nAlice בוחרת x = 6 ו Bob בוחר x = 15. מהו המפתח הסודי המשותף של Alice ו-Bob בסוף התהליך?","options":["2","5","19","8"],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"דיפי-הלמן והחלפת מפתחות","topic_score":0.343,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-23-05\" data-doc=\"original-23\" data-body-words=\"381\"><h2>שאלה 5 — דיפי–הלמן g=5,n=23,a=6,b=15</h2><div class=\"answer-body\">\n<p><strong>א — 2.</strong> אליס שולחת A=5⁶ mod23=8; בוב שולח B=5¹⁵ mod23=19. אז K=B⁶ mod23: 19²≡16,‏ 19⁴≡3,‏ 19⁶≡3·16=48≡2. גם 8¹⁵≡2. אפשר לחשב 5⁹⁰, וכיוון 5²²≡1 מתקבל 5⁹⁰≡5²=25≡2. ב 5, ג 19 וד 8 הן בסיס או ערכים ציבוריים ולא הסוד המשותף.</p>\n<h3>איך נוצר סוד משותף בלי לשלוח אותו</h3>\n<p>בחילוף המפתחות הנדון שני הצדדים מסכימים על קבוצה מתמטית, בסיס ומודולוס. כל צד בוחר מעריך פרטי, מעלה את הבסיס בחזקה שלו ושולח רק את התוצאה הציבורית. לאחר מכן הוא מעלה את הערך שקיבל בחזקת הסוד הפרטי שלו. חוקי החזקות מבטיחים ששני הצדדים יגיעו לאותו ערך, משום שכפל המעריכים מתחלף. התמליל הציבורי כולל אפוא את הבסיס ושני ערכי החזקה, אך אינו כולל במפורש את שני המעריכים או את הסוד המשותף.</p>\n<p>בשאלות מספריות קטנות אפשר למצוא את המעריך המתאים לערך ציבורי באמצעות טבלת חזקות. אין כאן סתירה לביטחון העקרוני: המודולוסים הזעירים נבחרו כדי לאפשר חישוב בבחינה, ולא כדי לייצג פרמטרים בטוחים. אחרי שמוצאים מעריכים אפשריים, מחשבים את הסוד בשתי דרכים ובודקים התאמה. ריבועים חוזרים וצמצום השארית בכל צעד מקטינים את המספרים ומאפשרים לתפוס שגיאת חשבון לפני בחירת האפשרות.</p>\n<h3>הנחת הקושי לעומת אימות הזהויות</h3>\n<p>בעיית הלוגריתם הדיסקרטי שואלת כיצד לשחזר מעריך מתוך הבסיס ותוצאת החזקה. חישוב הסוד המשותף ישירות מתוך שני ערכים ציבוריים מנוסח באמצעות הנחת קושי קשורה, שאינה זהה בכל קבוצה מתמטית. במסגרת השאלון הייחוס ללוגריתם דיסקרטי הוא ההבחנה המבוקשת מול צפנים קלאסיים או מנגנוני קונצנזוס. בפרוטוקול מעשי צריך גם לבדוק את תקינות ערכי הקלט, לבחור קבוצה מתאימה ולהפיק מן הסוד מפתחות באמצעות פונקציית גזירה.</p>\n<p>המתמטיקה לבדה אינה מאמתת עם מי הוחלפו הערכים. תוקף פעיל יכול להציב ערך ציבורי משלו מול כל צד, ליצור שני סודות שונים ולתווך בין הצדדים. לעומת זאת, מאזין פסיבי שאינו משנה הודעות אינו יכול לבצע החלפה כזאת. לכן בתרחיש שמגביל במפורש את התוקף להאזנה, אין לפסול את השיטה רק מפני שהיא פגיעה לתוקף פעיל חזק יותר. כשנדרש אימות אפשר לחתום על ערכי ההחלפה והקשרם או להשתמש במנגנון מאומת אחר. יש להפריד בכל תשובה בין סודיות מול מאזין, חישוב הסוד המספרי והבטחת זהות הצד האחר.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אם מוצאים כמה מעריכים שמניבים אותו ערך ציבורי בקבוצה הקטנה, אין לבחור ביניהם לפי מראית עין. הם יכולים להיות שקולים לפי סדר תת־הקבוצה שנוצרת מן הבסיס, ולכן לייצר אותו סוד משותף. החישוב צריך להיעשות בתוך הקבוצה והמודולוס הנתונים. לא מחברים את הערכים הציבוריים זה לזה ולא מתייחסים לאחד מהם אוטומטית כאל המפתח הסופי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_24112024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q099.html"},{"id":"Q100","year":"2024","stem":"Alice משתמשת ב-RSA כדי ליצור חתימה דיגיטלית עבור הודעה שהיא שולחת ל-Bob. היא בוחרת שני מספרים ראשוניים, p = 13 ו q = 17 ובעזרתם מחשבת את n. Alice בוחרת מפתח פרטי d = 5 ומפתח פומבי e = 77. ההודעה m שהיא רוצה לחתום עליה היא m = 7. מהי החתימה שאותה Alice תשלח לבוב?","options":["11","21","12","193"],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.348,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-23-06\" data-doc=\"original-23\" data-body-words=\"366\"><h2>שאלה 6 — חתימת RSA על m=7</h2><div class=\"answer-body\">\n<p><strong>א — 11.</strong> n=13·17=221,‏ φ(n)=12·16=192, ו־ed=77·5=385=2·192+1. החתימה σ=mᵈ modn=7⁵ mod221. מחשבים 7²=49,‏ 7⁴=2401≡191,‏ 7⁵≡191·7=1337≡11. ב 21, ג 12 וד 193 אינן שארית זו. זו חתימת textbook על המסר המספרי ללא hash/padding, בהתאם לנוסח; שימוש מעשי דורש סכמת חתימה תקנית.</p>\n<h3>בניית המפתח ומשמעות החשבון המודולרי</h3>\n<p>באלגוריתם הנדון בוחרים שני ראשוניים שונים, מכפילים אותם לקבלת המודולוס, ומחשבים את מספר השאריות הזרות למודולוס. במקרה של מכפלת שני ראשוניים המספר הזה הוא מכפלת שני המספרים הקטנים באחד מן הראשוניים. לאחר מכן בוחרים מעריך ציבורי הזר למספר שהתקבל, ומוצאים לו הופכי כפל מודולרי שישמש כמעריך הפרטי. המודולוס משותף לשני המפתחות; החלפתו במספר אחר אינה יוצרת מפתח פרטי מתאים לאותו מפתח ציבורי.</p>\n<p>הדרישה להופכי פירושה שמכפלת שני המעריכים משאירה שארית אחת בחלוקה במספר השאריות הזרות. לכן אין צורך שהמעריכים יהיו שונים, גדולים במיוחד או אחד ראשוני ואחד לא. יש לבדוק את משוואת ההופכי במפורש. באימות חלופות של מפתח, חישוב המכפלה והשארית הוא בדיקה ישירה וקצרה הרבה יותר מניסיון להצפין אוסף מסרים ולקוות שהכול עובד.</p>\n<h3>חתימה, אימות ודרך חישוב יעילה</h3>\n<p>בחתימת ספר לימוד על מסר מספרי מעלים את המסר בחזקת המעריך הפרטי ומצמצמים מודולו המודולוס. לא מצפינים במפתח הציבורי כדי לחתום. כדי לאמת מעלים את החתימה בחזקת המעריך הציבורי ובודקים שחזר המסר. כאשר נדרשים לשחזר מסר מחתימה, זהו אותו כיוון אימות, גם אם השאלה מספקת תחילה דווקא את המעריך הפרטי. ההסבר המקדים לכל שאלה מיישם את התפקידים האלה על המספרים המסוימים שבה.</p>\n<p>אפשר לבצע את החזקות באמצעות ריבועים חוזרים: מחשבים חזקה שנייה, ממנה רביעית וכן הלאה, ובכל שלב שומרים רק את השארית. אחר כך מכפילים את החזקות המתאימות לפירוק הבינארי של המעריך. כך נשמרים מספרים קטנים ונמנעות טעויות של כתיבת מספר עצום. כל המספרים הקטנים בשאלון נועדו להדגים את המתמטיקה ואינם מפתחות בטוחים לשימוש. חתימה מעשית גם אינה חתימת ספר לימוד ישירה על מספר שרירותי; נדרשים גיבוב, קידוד חתימה תקני ובדיקת תקינות של המפתחות כדי למנוע מניפולציות שלא נלמדות מן החשבון הפשוט בלבד.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בדיקה נוספת מועילה היא להחזיר את התוצאה דרך הפעולה ההפוכה: אם חושבה חתימה, מאמתים אותה ומוודאים שחזר המסר; אם נבחר מעריך פרטי, בודקים את מכפלתו במעריך הציבורי. שאריות שליליות מותרות בזמן החישוב, אבל את התוצאה הסופית נוח להציג כנציג שאינו שלילי וקטן מן המודולוס. כך ניתן לזהות מסיח שמייצג מספר גדול או פעולה בכיוון הלא נכון.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_24112024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q100.html"},{"id":"Q101","year":"2024","stem":"מה היתרון של OCSP Stapling לעומת OCSP רגיל?","options":["הוא מאפשר לשרת האינטרנט לשלוח את סטטוס התעודה לדפדפן באופן מיידי, מה שמפחית את העומס וההשהיה שנגרמת מתקשורת עם שרתי OCSP.","הוא מאפשר לשרת להצפין את הנתונים בין הדפדפן לשרת ה OCSP.","הוא מספק גיבוי מאובטח לשרת האינטרנט במקרים שבהם הוא אינו זמין, וכך מאפשר המשך פעילות תקינה.","הוא מעביר את הבדיקה לתשתית PKI שמונעת את הצורך באימות דו-שלבי."],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.234,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-23-07\" data-doc=\"original-23\" data-body-words=\"389\"><h2>שאלה 7 — יתרון OCSP stapling</h2><div class=\"answer-body\">\n<p><strong>א — השרת מצרף תשובת OCSP חתומה, וחוסך ללקוח פנייה ישירה.</strong> זה מקטין השהיה/עומס ומפחית חשיפת אתרי הגלישה בפני משיב OCSP. ב שגויה: לא מדובר בהצפנת ערוץ הדפדפן למשיב; ג אינו גיבוי שרת; ד אינה קשורה לאימות דו־שלבי. הלקוח עדיין בודק את חתימת המשיב ואת עדכניות התגובה, והשרת אינו חותם במפתח האתר במקום המשיב.</p>\n<h3>ביטול תעודה הוא עדכון אמון ולא שינוי במתמטיקה</h3>\n<p>תעודה עשויה להיות חתומה כחוק ועדיין להפסיק להיות אמינה לפני תאריך הפקיעה שלה, למשל מפני שמפתח פרטי נגנב. החתימה על התעודה אינה נעלמת כאשר הרשות מחליטה לבטל אותה, ולכן הלקוח זקוק למידע נוסף על סטטוסה. רשימת ביטול מפרסמת אוסף תעודות שבוטלו, ושירות סטטוס מקוון מאפשר לברר את המצב של תעודה מסוימת. בשני המקרים המקבל צריך לאמת שהמידע הגיע מגורם מורשה ושאינו ישן מדי.</p>\n<p>למפתח הפרטי של שרת האתר ולמפתח החתימה של רשות התעודות יש תפקידים שונים. גניבת מפתח האתר מאפשרת להתחזות לאתר בהקשרים שבהם התעודה עוד מתקבלת, אך אינה מאפשרת לחתום בשם הרשות על רשימת ביטול או תשובת סטטוס. אחרת כל שרת היה יכול לבטל את ביטולה של תעודתו בעצמו, וכל שרשרת האמון הייתה מאבדת את משמעותה. גם העתקת אישור קיים אינה מאפשרת לשנות את השדות שלו בלי לפגוע בחתימה.</p>\n<h3>הצמדה, פרטיות וכשל תקשורת</h3>\n<p>כאשר הדפדפן פונה ישירות לשירות הסטטוס, השירות עשוי ללמוד באיזו תעודת אתר הדפדפן מתעניין, ונוספות השהיה ותלות בזמינות רשת. הצמדת תשובת סטטוס מאפשרת לשרת האתר לקבל תשובה חתומה ולהגיש אותה ללקוחות במהלך ההקמה. השרת מעביר ראיה חתומה, ואינו מחליף את המשיב המורשה כחותם. הלקוח עדיין בודק התאמה, חתימה וטריות.</p>\n<p>מדיניות המשך במקרה כשל פירושה שאם הבירור אינו אפשרי, הלקוח עשוי להמשיך במקום לחסום. הדבר משפר זמינות אך עלול לאפשר לתוקף לחסום גישה לשירות הסטטוס ולנצל תעודה שכבר בוטלה. מכאן שפער בין ביטול אצל הרשות לבין אכיפה אצל משתמשים אינו מצביע בהכרח על זיוף חתימה: ייתכנו כשל תקשורת או מידע שמור שעוד נחשב עדכני. שקיפות תעודות פותרת בעיית גילוי הנפקות ואינה מחליפה את העברת הסטטוס הזה. גם שרתי שורש של מערכת שמות מתחם אינם רשויות ההפצה של ביטול תעודות, אף שבשני התחומים משתמשים במושג שורש.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>יש להבדיל גם בין ביטול תעודה לבין יצירת תעודה חדשה. הנפקת חלופה אינה גורמת אוטומטית לכל הדפדפנים להפסיק לקבל את הישנה, ותוקף עשוי להמשיך להציג את העותק שבידו. ניהול האירוע כולל לכן החלפת מפתח, הפצת מידע ביטול ובדיקת אכיפה אצל לקוחות. פעולה בצד שרת האתר בלבד אינה משנה את כל עוגני האמון והמטמונים של המשתמשים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_24112024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q101.html"},{"id":"Q102","year":"2024","stem":"איזו מבין הטענות הבאות אינה נכונה?","options":["שימוש ב x-frame-options מיועד להגנה מפני sql injection","ב TLS, משתמשים ב chain of trust","בקריפטוגרפיה, MAC המיושם נכון מספק אמינות המידע","בעיה גדולה ב One Time Pad היא העברת המפתחות"],"note":"","sources":[{"file":"2024/689156_24112024_0 (2).pdf","date":"24/11/2024","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.176,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-23-10\" data-doc=\"original-23\" data-body-words=\"413\"><h2>שאלה 10 — טענה שאינה נכונה</h2><div class=\"answer-body\">\n<p><strong>א — X-Frame-Options אינו הגנה מפני SQL injection.</strong> הכותרת מגבילה מסגור דף ומסייעת נגד clickjacking. ב נכונה ב־TLS מבוסס תעודות; ג נכונה: MAC תקין מספק שלמות ואימות מול מי שאינו מכיר את המפתח; ד נכונה: OTP דורש הפצת סוד אקראי באורך המסר ושימוש יחיד, ולכן העברת מפתחות היא קושי מרכזי.</p>\n<h3>מסגור עמוד והטעיית המשתמש</h3>\n<p>דפדפן יכול להציג עמוד אחד בתוך מסגרת השייכת לעמוד אחר. היכולת הזאת שימושית לשילוב שירותים, אך עלולה לשמש תוקף כדי להציג ממשק אמיתי בתוך ממשק מטעה. המשתמש עשוי לחשוב שהוא לוחץ על רכיב תמים, בעוד הפעולה האמיתית מתרחשת באתר שהוא כבר מחובר אליו. בתקיפה כזאת אין בהכרח הזרקת פקודה למסד הנתונים או גניבת סיסמה; התוקף מנצל את אופן ההצגה ואת אמון המשתמש בממשק.</p>\n<p>כותרת המגבילה מסגור מורה לדפדפן האם מותר להציג את העמוד במסגרת, ולעיתים באילו הקשרים. אם הדפדפן מסרב למסגר את עמוד הפעולה, התוקף מתקשה להציב מעליו או מסביבו רכיבים מטעים. ההגנה פועלת בצד הדפדפן על הקשר התצוגה, ולא בצד מסד הנתונים על תחביר שאילתה. ההבדל הזה מספק מבחן ישיר לטענה שהיא אמורה למנוע הזרקת שאילתות: היא כלל אינה מפרידה בין קלט משתמש לבין פקודת מסד ואינה משנה כיצד השאילתה נבנית.</p>\n<h3>התאמת מנגנון לנכס שמגינים עליו</h3>\n<p>הזרקת שאילתות דורשת הפרדה מבנית באמצעות פרמטרים והרשאות מתאימות. שלמות הודעות דורשת מנגנון אימות המזהה שינוי בתוכן. הצפנת תעבורה מגינה מפני חשיפת תוכן למאזין, ושרשרת אמון מקשרת מפתח ציבורי לזהות שמאחוריו. כל אחד מהכלים האלה עובד בשכבה אחרת, ולכן אסור להסיק שמנגנון מונע כל תקיפה רק משום שהוא מופיע ככותרת אבטחה או משתמש בחתימה.</p>\n<p>כאשר שאלה כוללת כמה טענות מתחומים שונים, נכון לזהות לכל טענה את התוקף, הפעולה והבדיקה שמונעת אותה. למשל, אם השינוי המסוכן קורה כבר בזמן שהשרת מחבר קלט לשאילתה, החלטה מאוחרת של הדפדפן לא למסגר את התגובה אינה יכולה לתקן את פרשנות השאילתה שבוצעה. בדומה לכך, תיוג של הודעה אינו עוזר אם הפרוטוקול מאפשר לכל בעל מפתח משותף להפיק בדיוק את אותה ראיה.</p>\n<p>ההגנה מפני מסגור אף אינה מונעת כל דרך לשכנע משתמש לבצע פעולה; היא מצמצמת מסלול מוגדר של שילוב ממשק בתוך עמוד אחר. לתכנון בטוח יש צורך גם בבדיקת הרשאות, בהגנה על בקשות משנות מצב ובהצגה ברורה של פעולות רגישות. גבול ההבטחה חשוב לא פחות משם הכותרת.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>גם אם דף התוקף אינו יכול לקרוא את תוכן המסגרת בגלל הפרדת מקורות, המשתמש עצמו יכול לראות חלק מן התוכן וללחוץ עליו. לכן חסימת קריאה בתוכנית אינה פותרת לבדה הטעיית ממשק. זאת דוגמה נוספת לפער בין סודיות המידע לבין שימוש בהרשאת המשתמש: התקפה יכולה להצליח באמצעות פעולה של המשתמש גם בלי שהסקריפט יקבל את תוכן העמוד.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_24112024_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q102.html"},{"id":"Q103","year":"2025","stem":"להלן מספר שיטות לשמירת סיסמאות ב DB, כאשר כל שיטה מתארת את מבנה הטבלה (המידע שישמר בכל עמודה מופרד בפסיקים, והסימן || מסמל שירשור). Hash הינה פונק׳ hash בטוחה קריפטוגרפית. Salt הינה מחרוזת בגודל 256 ביט הנבחרת באקראי. איזה מבין השיטות הבאות אינה פרקטית?\nכלומר, האפליקציה שמנסה לאמת את המשתמשים בעזרת הטבלה הזאת לא תוכל לעשות זאת בזמן סביר אם הטבלה תיושם לפי השיטה הספציפית?","options":["Username, hash(salt), hash(password || salt)","Username, salt, hash(password || salt || username)","Username, salt, hash(hash(password || salt))","Username, salt, hash(password || salt)"],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":1},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":1},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.288,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-19-01\" data-doc=\"original-19\" data-body-words=\"411\"><h2>שאלה 1 — מבנה DB שאינו מאפשר אימות מעשי</h2><div class=\"answer-body\">\n<p><strong>א — Username,h(salt),h(password||salt).</strong> salt אקראי בן 256 סיביות אינו שמור בגלוי. כדי לחשב hash של סיסמת ניסיון צריך לדעת את salt, והיפוך h(salt) אינו מעשי; חיפוש כל האפשרויות הוא מסדר גודל עד 2²⁵⁶. ב,ג,ד שומרות את salt ולכן אפשר לשחזר את חישוב האימות: הוספת username או hash נוסף אינה הופכת אותו לבלתי אפשרי. salt אינו אמור להיות סוד ואינו תחליף ל־pepper.</p>\n<h3>מה צריך להישמר כדי שאפשר יהיה לבדוק סיסמה</h3>\n<p>שרת שאינו שומר סיסמאות גלויות צריך בכל זאת להיות מסוגל לבדוק ניסיון כניסה. לשם כך הוא שומר ערך בדיקה שאפשר לחשב מחדש מסיסמת הניסיון ומפרמטרים זמינים. ערך המלחה אקראי ושונה לכל משתמש נשמר לצד ערך הבדיקה ואינו אמור להיות סוד. הוא גורם לכך שגם שתי סיסמאות זהות של משתמשים שונים יניבו קלטי גיבוב שונים, ולכן תוקף אינו יכול להשתמש באותה טבלת חישובים מוכנה עבור כולם.</p>\n<p>סוד נוסף הנשמר בנפרד ממסד הנתונים ממלא תפקיד אחר: הוא מקשה על מי שגנב רק את הטבלה לבצע ניחושים לא מקוונים. כדי שההגנה תהיה רלוונטית, הסיסמה, ערך ההמלחה והסוד הנוסף צריכים להשפיע על אותו ערך בדיקה. אם שומרים גיבוב חשוף של הסיסמה ולצידו גיבוב אחר של פרמטרים, התוקף יכול להתעלם מן הרכיב השני ולבדוק את הראשון לבדו. זו דוגמה לכך שצירוף שמות של מנגנונים אינו מספיק; צריך לנתח מה נדרש לכל ניסיון ניחוש.</p>\n<h3>זמינות פרמטרים ועלות ניחוש</h3>\n<p>הסתרת ערך ההמלחה באמצעות גיבוב בלבד יכולה דווקא לשבור את האימות החוקי: השרת מכיר את סיסמת הניסיון אך אינו יודע איזה ערך צריך לשרשר אליה. אם הערך המקורי אקראי וארוך, אין דרך מעשית לשחזר אותו מהגיבוב. קושי שהתכוון המפתח להטיל על התוקף הוטל במקרה זה גם על עצמו. לעומת זאת, שרשור שם משתמש שמור או הפעלת גיבוב נוסף הם חישובים שאפשר לשחזר מן הנתונים הזמינים.</p>\n<p>הגדלת מספר סבבי החישוב יכולה להעלות את המחיר של כל ניחוש. השרת מבצע את החישוב רק בכניסות לגיטימיות, בעוד תוקף שבודק מיליוני סיסמאות משלם את העלות שוב ושוב. הגרלת הרבה ערכי המלחה ושמירת האחרון בלבד אינה משיגה זאת, כי בבדיקת ניחוש לא חוזרים על ההגרלות שנזרקו. עלות מכוונת חייבת להיות חלק מחישוב ערך הבדיקה. פתרונות מעשיים משתמשים בפונקציית גזירת סיסמאות ייעודית ובפרמטרי עלות, אך בשאלה יש לנתח קודם את המבנה המוצע ולא להניח שכל שימוש בפונקציית גיבוב הוא בטוח אוטומטית.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>גם לאחר בחירת מבנה תקין יש להגביל ניסיונות כניסה מקוונים, להגן על ערוץ השליחה ולשמור הרשאות מצומצמות למסד. ערך המלחה אינו מגדיל את האקראיות של הסיסמה שהמשתמש בחר, ולכן סיסמה נפוצה עדיין עשויה להימצא בניחוש. ההגנה גורמת לתוקף לעבוד בנפרד לכל משתמש; היא אינה הופכת כל סיסמה קצרה לסוד ארוך ואקראי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21072025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q103.html"},{"id":"Q104","year":"2025","stem":"אליס רוצה להשתמש ב textbook RSA . לשם כך, היא מריצה את אלגוריתם ה Gen. אליס התחילה את הרצת ה Gen ולכן בחרה שני מספרים ראשוניים: p=3, q=17, ובעזרתם חישבה: n=51. על בסיס נתונים אלו, מהי התוצאה של (n)ϕ?\nכאשר הפונקציה ϕ (האות היוונית phi) היא כפי שלמדנו בכיתה עבור אלגוריתם ה Gen.","options":["32","50","1","11"],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":2},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":2},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.396,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-19-02\" data-doc=\"original-19\" data-body-words=\"359\"><h2>שאלה 2 — חישוב φ(n) ב־RSA</h2><div class=\"answer-body\">\n<p><strong>א — 32.</strong> עבור ראשוניים שונים p=3,q=17, מתקיים φ(pq)=(p−1)(q−1)=2·16=32. ב 50 היא n−1, נוסחה שנכונה כש־n ראשוני, וכאן n=51 פריק. ג 1 וד 11 אינן מספר השאריות הזרות ל־51. לבדיקת הכללה/הפרדה: 51−17−3+1=32.</p>\n<h3>בניית המפתח ומשמעות החשבון המודולרי</h3>\n<p>באלגוריתם הנדון בוחרים שני ראשוניים שונים, מכפילים אותם לקבלת המודולוס, ומחשבים את מספר השאריות הזרות למודולוס. במקרה של מכפלת שני ראשוניים המספר הזה הוא מכפלת שני המספרים הקטנים באחד מן הראשוניים. לאחר מכן בוחרים מעריך ציבורי הזר למספר שהתקבל, ומוצאים לו הופכי כפל מודולרי שישמש כמעריך הפרטי. המודולוס משותף לשני המפתחות; החלפתו במספר אחר אינה יוצרת מפתח פרטי מתאים לאותו מפתח ציבורי.</p>\n<p>הדרישה להופכי פירושה שמכפלת שני המעריכים משאירה שארית אחת בחלוקה במספר השאריות הזרות. לכן אין צורך שהמעריכים יהיו שונים, גדולים במיוחד או אחד ראשוני ואחד לא. יש לבדוק את משוואת ההופכי במפורש. באימות חלופות של מפתח, חישוב המכפלה והשארית הוא בדיקה ישירה וקצרה הרבה יותר מניסיון להצפין אוסף מסרים ולקוות שהכול עובד.</p>\n<h3>חתימה, אימות ודרך חישוב יעילה</h3>\n<p>בחתימת ספר לימוד על מסר מספרי מעלים את המסר בחזקת המעריך הפרטי ומצמצמים מודולו המודולוס. לא מצפינים במפתח הציבורי כדי לחתום. כדי לאמת מעלים את החתימה בחזקת המעריך הציבורי ובודקים שחזר המסר. כאשר נדרשים לשחזר מסר מחתימה, זהו אותו כיוון אימות, גם אם השאלה מספקת תחילה דווקא את המעריך הפרטי. ההסבר המקדים לכל שאלה מיישם את התפקידים האלה על המספרים המסוימים שבה.</p>\n<p>אפשר לבצע את החזקות באמצעות ריבועים חוזרים: מחשבים חזקה שנייה, ממנה רביעית וכן הלאה, ובכל שלב שומרים רק את השארית. אחר כך מכפילים את החזקות המתאימות לפירוק הבינארי של המעריך. כך נשמרים מספרים קטנים ונמנעות טעויות של כתיבת מספר עצום. כל המספרים הקטנים בשאלון נועדו להדגים את המתמטיקה ואינם מפתחות בטוחים לשימוש. חתימה מעשית גם אינה חתימת ספר לימוד ישירה על מספר שרירותי; נדרשים גיבוב, קידוד חתימה תקני ובדיקת תקינות של המפתחות כדי למנוע מניפולציות שלא נלמדות מן החשבון הפשוט בלבד.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בדיקה נוספת מועילה היא להחזיר את התוצאה דרך הפעולה ההפוכה: אם חושבה חתימה, מאמתים אותה ומוודאים שחזר המסר; אם נבחר מעריך פרטי, בודקים את מכפלתו במעריך הציבורי. שאריות שליליות מותרות בזמן החישוב, אבל את התוצאה הסופית נוח להציג כנציג שאינו שלילי וקטן מן המודולוס. כך ניתן לזהות מסיח שמייצג מספר גדול או פעולה בכיוון הלא נכון.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21072025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q104.html"},{"id":"Q105","year":"2025","stem":"בהקשר של חתימה דיגיטלית לפי textbook RSA (כלומר ללא hash), אם ידוע שה private key הוא:\nn = 33 d = 7\nמהי החתימה הדיגיטלית על ההודעה m כאשר m = 5?","options":["14","26","5","61"],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":3},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":3},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.499,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-19-03\" data-doc=\"original-19\" data-body-words=\"364\"><h2>שאלה 3 — חתימת textbook RSA</h2><div class=\"answer-body\">\n<p><strong>א — 14.</strong> σ=mᵈ modn=5⁷ mod33. 5²=25,‏ 5⁴=625≡31≡−2, ולכן 5⁷≡31·25·5=3875≡14 mod33. ב 26 וג 5 אינן תוצאת החזקה; ד 61 אף אינה נציג קנוני בטווח 0..32. לזוג מתאים אפשר לבחור e=3 כי 7·3≡1 mod20; אכן 14³ mod33=5.</p>\n<h3>בניית המפתח ומשמעות החשבון המודולרי</h3>\n<p>באלגוריתם הנדון בוחרים שני ראשוניים שונים, מכפילים אותם לקבלת המודולוס, ומחשבים את מספר השאריות הזרות למודולוס. במקרה של מכפלת שני ראשוניים המספר הזה הוא מכפלת שני המספרים הקטנים באחד מן הראשוניים. לאחר מכן בוחרים מעריך ציבורי הזר למספר שהתקבל, ומוצאים לו הופכי כפל מודולרי שישמש כמעריך הפרטי. המודולוס משותף לשני המפתחות; החלפתו במספר אחר אינה יוצרת מפתח פרטי מתאים לאותו מפתח ציבורי.</p>\n<p>הדרישה להופכי פירושה שמכפלת שני המעריכים משאירה שארית אחת בחלוקה במספר השאריות הזרות. לכן אין צורך שהמעריכים יהיו שונים, גדולים במיוחד או אחד ראשוני ואחד לא. יש לבדוק את משוואת ההופכי במפורש. באימות חלופות של מפתח, חישוב המכפלה והשארית הוא בדיקה ישירה וקצרה הרבה יותר מניסיון להצפין אוסף מסרים ולקוות שהכול עובד.</p>\n<h3>חתימה, אימות ודרך חישוב יעילה</h3>\n<p>בחתימת ספר לימוד על מסר מספרי מעלים את המסר בחזקת המעריך הפרטי ומצמצמים מודולו המודולוס. לא מצפינים במפתח הציבורי כדי לחתום. כדי לאמת מעלים את החתימה בחזקת המעריך הציבורי ובודקים שחזר המסר. כאשר נדרשים לשחזר מסר מחתימה, זהו אותו כיוון אימות, גם אם השאלה מספקת תחילה דווקא את המעריך הפרטי. ההסבר המקדים לכל שאלה מיישם את התפקידים האלה על המספרים המסוימים שבה.</p>\n<p>אפשר לבצע את החזקות באמצעות ריבועים חוזרים: מחשבים חזקה שנייה, ממנה רביעית וכן הלאה, ובכל שלב שומרים רק את השארית. אחר כך מכפילים את החזקות המתאימות לפירוק הבינארי של המעריך. כך נשמרים מספרים קטנים ונמנעות טעויות של כתיבת מספר עצום. כל המספרים הקטנים בשאלון נועדו להדגים את המתמטיקה ואינם מפתחות בטוחים לשימוש. חתימה מעשית גם אינה חתימת ספר לימוד ישירה על מספר שרירותי; נדרשים גיבוב, קידוד חתימה תקני ובדיקת תקינות של המפתחות כדי למנוע מניפולציות שלא נלמדות מן החשבון הפשוט בלבד.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בדיקה נוספת מועילה היא להחזיר את התוצאה דרך הפעולה ההפוכה: אם חושבה חתימה, מאמתים אותה ומוודאים שחזר המסר; אם נבחר מעריך פרטי, בודקים את מכפלתו במעריך הציבורי. שאריות שליליות מותרות בזמן החישוב, אבל את התוצאה הסופית נוח להציג כנציג שאינו שלילי וקטן מן המודולוס. כך ניתן לזהות מסיח שמייצג מספר גדול או פעולה בכיוון הלא נכון.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21072025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q105.html"},{"id":"Q106","year":"2025","stem":"איזה מבין הטענות הבאות נכונה?","options":["עץ מרקל מאפשר לאמת אם טרנזקציה כלולה בבלוק מבלי להחזיק את כל הטרנזקציות של הבלוק.","עץ מרקל משמש לחישוב כתובת הארנק של משתמשי ביטקוין.","עץ מרקל מאפשר לבצע הצפנה על כל טרנזקציה באופן נפרד.","עץ מרקל משמש להצפנת הכתובות של השולחים והמקבלים בכל טרנזקציה."],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":4},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":4},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.258,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-19-04\" data-doc=\"original-19\" data-body-words=\"391\"><h2>שאלה 4 — מה מאפשר עץ מרקל</h2><div class=\"answer-body\">\n<p><strong>א — הוכחת הכלת טרנזקציה בלי כל טרנזקציות הבלוק.</strong> מוסרים hashes של אחים במסלול לשורש ומשווים לשורש בכותרת האמינה. ב: כתובת ביטקוין נגזרת ממפתח/תנאי פדיון לפי סוגה, לא מעץ הטרנזקציות. ג וד שגויות: hash אינו הצפנה, ועץ מרקל אינו מצפין עסקאות או כתובות. הוכחת הכלה לבדה אינה הוכחת חוקיות כל הטרנזקציות.</p>\n<h3>כיצד מחויבות לשורש נוצרת מן העלים</h3>\n<p>עץ מרקל הוא דרך לצמצם אוסף נתונים לערך קצר שמחייב את כל תוכנו. בעלים נמצאים ערכי גיבוב של פריטי המידע, וכל צומת פנימי מחושב מגיבוב של ערכי ילדיו לפי סדר מוגדר. חוזרים על הפעולה עד שמתקבל ערך יחיד בשורש. אם משנים פריט אחד, משתנה הגיבוב בעלה המתאים, ואז משתנים הקלטים של אביו ושל אבותיו עד השורש. ענף שאין בו את הפריט נשאר עם אותם קלטים, ולכן אינו צריך להשתנות.</p>\n<p>התלות הזאת מסבירה גם מה אינו מתקבל מן העץ: הנתונים אינם מוצפנים. מי שרואה את העסקאות יכול לקרוא אותן, ומי שרואה גיבוב אינו מקבל מכך הרשאה או הוכחה שמי שיצר עסקה היה מורשה. העץ מחייב סדר ואוסף נתונים ומאפשר להוכיח השתייכות אליהם. חוקיות העסקאות, חתימות הבעלים והסכמה על הבלוק הן בדיקות נוספות שמתקיימות במקום אחר במערכת.</p>\n<h3>בניית הוכחה יעילה ובדיקתה</h3>\n<p>כדי להוכיח עלה מסוים אין צורך לשלוח את כל העץ. מספיקים הנתון, הערכים של האחים לאורך הדרך לשורש ומיקומו של כל אח ביחס לצומת שכבר חושב. המקבל מחשב בכל רמה את גיבוב ההורה ומשווה בסיום לשורש שהוא כבר סומך עליו. אם השורש נמסר רק בידי אותו גורם לא אמין שמסר את ההוכחה, התוקף יכול להמציא עץ משלו; לכן מקור האמון בשורש הוא חלק הכרחי מן הפרוטוקול.</p>\n<p>בעץ בינארי מלא כל רמה מכפילה את מספר העלים שניתן להכיל, ולכן מספר ערכי ההוכחה גדל לוגריתמית ולא ביחס ישר למספר הפריטים. הכפלת מספר העלים מוסיפה רק רמה אחת. כאשר מספר העלים אינו חזקה של שתיים, נדרש כלל מוגדר לטיפול בעלה ללא אח או למבנה העץ, אך עדיין רק אבות הנתון תלויים בו. הטענה ששינוי בהכרח משנה גיבוב מניחה את מודל הביטחון של פונקציית הגיבוב: באופן מתמטי יכולה להיות התנגשות, אלא שבפונקציה מתאימה לא אמורה להיות לתוקף דרך מעשית לייצר אותה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בעת אימות הוכחה סדר הצירוף הוא מידע מהותי: גיבוב של ילד שמאלי ואחריו ימני אינו בהכרח שווה לגיבוב באותו סדר הפוך. לכן רשימת ערכי אחים בלי מיקומים או בלי דרך להסיק אותם אינה מספיקה בכל פורמט. במקרה הביטקוין גם כותרת הבלוק צריכה להיות קשורה לשרשרת שהלקוח מקבל, אחרת הוכחה נכונה לעץ מומצא אינה מועילה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21072025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q106.html"},{"id":"Q107","year":"2025","stem":"איזה מבין הטענות הבאות אינה נכונה בהקשר של TLS?","options":["ב ClientHello השרת מעביר ללקוח את ה cipher suite שהוא רוצה שהשרת והלקוח ישתמשו בו.","ב-TLS handshake השרת שולח ללקוח את תעודת השרת, אשר מכילה את מפתח ההצפנה הציבורי של השרת.","השרת מעביר ללקוח את התעודה של השרת, והלקוח צריך לוודא את התקינות של התעודה, בין השאר, לוודא שה subject שכתוב בתעודה (שעבורו הונפקה התעודה) הוא אכן השרת שהלקוח רוצה להקים איתו חיבור TLS.","השרת מעביר ללקוח את התעודה של השרת, והלקוח צריך לוודא את התקינות של התעודה, בין השאר, לוודא שתוקף התעודה לא פג."],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":5},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":5},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"TLS / HTTPS","topic_score":0.309,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-19-05\" data-doc=\"original-19\" data-body-words=\"379\"><h2>שאלה 5 — טענה שאינה נכונה על handshake</h2><div class=\"answer-body\">\n<p><strong>א — ClientHello נשלחת מהלקוח, לא מהשרת.</strong> הלקוח מציע רשימת cipher suites, והשרת בוחר באמצעות ServerHello. ב נכונה ב־TLS מבוסס תעודה: התעודה כוללת מפתח פומבי של השרת, שבגרסאות וסוויטות מסוימות מיועד לחתימה ולא להצפנה. ג נכונה במהותה: בודקים התאמה לשם השרת המבוקש, כיום בעיקר SAN; ד נכונה: נבדק תוקף הזמן של התעודה. אף שרשרת חתימות חוקית אינה מכשירה תעודה לדומיין אחר.</p>\n<h3>חלוקת התפקידים בהקמת הערוץ</h3>\n<p>בתחילת החיבור הלקוח והשרת עדיין אינם חולקים את מפתחות התעבורה החדשים. הלקוח פותח במשא ומתן על פרמטרים, השרת בוחר מבין האפשרויות המותרות ומציג אמצעי אימות מתאים, ובהמשך הצדדים מפיקים סוד משותף וממנו מפתחות. בהקשר מבוסס תעודות הלקוח בודק שהמפתח שהוצג קשור לשם האתר שאליו התכוון להגיע וששרשרת החתימות מובילה לשורש אמין. קיום חתימה חוקית כשלעצמו אינו מספיק אם התעודה שייכת לאתר אחר או אם אינה בתוקף.</p>\n<p>בשאלות המתארות חילוף מפתחות באמצעות הצפנה במפתח ציבורי של השרת, הלקוח יוצר סוד ראשוני ומצפין אותו כך שרק בעל המפתח הפרטי יוכל לפענחו. זהו מסלול היסטורי, ואין להשליך ממנו שכל חיבור מודרני פועל כך. בחילוף מפתחות זמני מבוסס דיפי–הלמן, מפתח התעודה משמש לאימות פרמטרים והסוד אינו מועבר באותה הצפנת מפתח ציבורי. להבחנה יש משמעות כאשר מפתח התעודה נגנב לאחר הקלטת התקשורת.</p>\n<h3>תמליל מאומת וגזירת מפתחות</h3>\n<p>בסוף הקמת החיבור הצדדים בודקים ערכים התלויים בתמליל הודעות ההקמה ובסודות שהפיקו. כך ניתן לזהות תוקף שהחליף הודעה בדרך גם אם היא נראית תקינה מבחינת התחביר. אם כל צד זוכר תמליל אחר, ערכי האימות אינם תואמים. שינוי שהורס תחביר או מונע הסכמה יכול כמובן לגרום לכשל מוקדם יותר, ולכן יש להבחין בין זיהוי אפשרי לבין זיהוי קריפטוגרפי מובטח בשלב האימות.</p>\n<p>מספרים אקראיים והקשר ההקמה נכללים בגזירת המפתחות כדי להבחין בין חיבורים ולהקטין שימוש חוזר בלתי רצוי בחומר מפתחות. נגזרים מפתחות נפרדים לכיווני התעבורה; באותו כיוון הצד המצפין והצד המפענח משתמשים בסוד הסימטרי המתאים. לאחר ההקמה אין צורך להצפין כל הודעת יישום בעזרת המפתח הציבורי שבתעודה. ההצפנה הסימטרית מגינה על התעבורה, ואימות השלמות מונע שינויים שקטים. כל זאת עדיין תלוי בבדיקה נכונה של זהות השרת ובהגנת המפתחות.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>יש גם להבחין בין מפתח ארוך־טווח שמזהה אתר לבין מפתח זמני של חיבור מסוים. תעודה יכולה לשמש חיבורים רבים, בעוד מפתחות תעבורה חדשים מופקים בכל הקמה מתאימה. לכן ידיעת תעודה ציבורית אינה ידיעת מפתח הפענוח של הסשן. חזרה של תעודת האתר בחיבורים שונים אינה כשלעצמה שימוש חוזר באותו מפתח הצפנה סימטרי לתוכן המשתמשים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21072025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q107.html"},{"id":"Q108","year":"2025","stem":"מה תפקידו של מנגנון OCSP stapling?","options":["לאפשר לשרת אינטרנט לשלוח ללקוח את הסטטוס המעודכן של התעודה של השרת (אם בוטלה או לא), בלי שהלקוח יצטרך לפנות בעצמו לשרת ה OCSP.","לאחסן רשימה של כל התעודות שה CA ביטל.","לייתר את הצורך לבדוק את ה chain of trust.","מדובר במנגנון challenge הנועד לוודא ששרת אינטרנט שפנה ל CA בטענה לבעלים של דומיין מסויים הוא אכן הבעלים של הדומיין הזה."],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":6},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":6},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.287,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-19-06\" data-doc=\"original-19\" data-body-words=\"381\"><h2>שאלה 6 — תפקיד OCSP stapling</h2><div class=\"answer-body\">\n<p><strong>א — השרת מעביר סטטוס חתום ללקוח בלי פנייה עצמאית של הלקוח למשיב.</strong> ב היא CRL, רשימת תעודות שבוטלו; ג שגויה: שרשרת אמון עדיין נדרשת; ד היא בדיקת שליטה בדומיין במסגרת הנפקה, ולא בדיקת ביטול לאחר הנפקה. הלקוח מוודא חתימה, התאמה לתעודה וטריות של תשובת OCSP.</p>\n<h3>ביטול תעודה הוא עדכון אמון ולא שינוי במתמטיקה</h3>\n<p>תעודה עשויה להיות חתומה כחוק ועדיין להפסיק להיות אמינה לפני תאריך הפקיעה שלה, למשל מפני שמפתח פרטי נגנב. החתימה על התעודה אינה נעלמת כאשר הרשות מחליטה לבטל אותה, ולכן הלקוח זקוק למידע נוסף על סטטוסה. רשימת ביטול מפרסמת אוסף תעודות שבוטלו, ושירות סטטוס מקוון מאפשר לברר את המצב של תעודה מסוימת. בשני המקרים המקבל צריך לאמת שהמידע הגיע מגורם מורשה ושאינו ישן מדי.</p>\n<p>למפתח הפרטי של שרת האתר ולמפתח החתימה של רשות התעודות יש תפקידים שונים. גניבת מפתח האתר מאפשרת להתחזות לאתר בהקשרים שבהם התעודה עוד מתקבלת, אך אינה מאפשרת לחתום בשם הרשות על רשימת ביטול או תשובת סטטוס. אחרת כל שרת היה יכול לבטל את ביטולה של תעודתו בעצמו, וכל שרשרת האמון הייתה מאבדת את משמעותה. גם העתקת אישור קיים אינה מאפשרת לשנות את השדות שלו בלי לפגוע בחתימה.</p>\n<h3>הצמדה, פרטיות וכשל תקשורת</h3>\n<p>כאשר הדפדפן פונה ישירות לשירות הסטטוס, השירות עשוי ללמוד באיזו תעודת אתר הדפדפן מתעניין, ונוספות השהיה ותלות בזמינות רשת. הצמדת תשובת סטטוס מאפשרת לשרת האתר לקבל תשובה חתומה ולהגיש אותה ללקוחות במה
