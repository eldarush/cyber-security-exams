"date":"05/10/2025","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.141,"exam_count":1,"in_sample_exam":false,"variant_group":"V07","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-18-09\" data-doc=\"original-18\" data-body-words=\"353\"><h2>שאלה 9 — הגדרת משאבים מותרים לדף</h2><div class=\"answer-body\">\n<p><strong>א — CSP.</strong> מדיניות כגון script-src ו־img-src מתפרשת בדפדפן ומגבילה טעינה והרצה. ב היא שיטת הצפנה; ג וד הן התקפות XSS ו־CSRF, ולא מנגנוני הגדרת מדיניות משאבים.</p>\n<h3>מדיניות שמגבילה מה העמוד רשאי לטעון</h3>\n<p>דף אינטרנט הוא מסמך שמסוגל לטעון רכיבים ממקורות רבים: קוד, תמונות, גופנים, מסגרות ועוד. בלי מגבלה נוספת, חולשת הזרקה עשויה לאפשר לתוקף להוסיף הוראה שטוענת קובץ קוד משרת שבשליטתו. מדיניות אבטחת תוכן מאפשרת לשרת למסור לדפדפן רשימת כללים שמגדירה אילו סוגי משאבים רשאים להגיע מאילו מקורות. הדפדפן אוכף את הכללים בזמן הטעינה או ההרצה, גם אם תגית שמבקשת משאב אסור כבר נמצאת במסמך.</p>\n<p>למשל, מדיניות שמאפשרת סקריפטים רק ממקור האתר יכולה לחסום תגית שמפנה לקובץ קוד באתר תוקף. אפשר להגדיר הוראות נפרדות לסקריפטים, תמונות וחיבורים, ולשלב מזהים אקראיים או גיבובים כדי לאשר קוד מסוים. המנגנון אינו מנחש מה בטוח מתוך שם הקובץ; הוא אוכף את המדיניות שהאתר ניסח. משום כך מדיניות רחבה מדי, או מקור מורשה שמאפשר לתוקפים להעלות תוכן פעיל, עלולים להשאיר מסלול תקיפה.</p>\n<h3>ההבדל מהצפנה ומאימות בקשות</h3>\n<p>הכללים אינם מצפינים את המסמך ואינם מסתירים אותו ממאזין בדרך. סודיות התעבורה ניתנת באמצעות ערוץ מוצפן. הם גם אינם דורשים מהמשתמש להקליד טוקן לכל פעולה, ואינם מחליפים אימות שהבקשה אכן נוצרה מתוך הטופס והסשן המתאימים. אתר יכול לקיים מדיניות תוכן טובה ובכל זאת לקבל בקשת פעולה מזויפת אם אינו בודק את מקור הכוונה וההרשאה.</p>\n<p>תפקידה העיקרי בהקשר השאלה הוא שכבת צמצום נזק מול הזרקת תוכן פעיל. היא משלימה קידוד פלט נכון ואינה מבטלת את הצורך בו, משום שלא כל תוכן מסוכן חייב להגיע מקובץ חיצוני חדש. גם שקיפות תעודות ובדיקת ביטול אינן שייכות לכללים האלה: הן עוסקות בזהות מפתח האתר ובתוקף האמון בו, בעוד כאן מגדירים התנהגות של המסמך לאחר שהגיע לדפדפן. בעת ניתוח חלופות צריך לבדוק איזה נכס כל מנגנון מגן עליו, ולא לבחור לפי כך שכל השמות קשורים באופן כללי לאבטחת רשת.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>רכיב מורשה אינו בטוח רק משום שהוא נטען מכתובת שמופיעה ברשימה. אם האתר מאפשר למשתמש לפרסם קובץ קוד באותו מקור מורשה, הזרקה עשויה לנצל אותו בלי לטעון כתובת חיצונית. לכן ניסוח המדיניות צריך להתאים למבנה האתר ולשליטת המשתמשים בתוכן. זו דוגמה לגבול מעשי שמסביר מדוע מדיניות משלימה נדרשת לצד טיפול נכון בקלט ובפלט.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_05102025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q131.html"},{"id":"Q132","year":"2025","stem":"מה מהבאים הינו אלגוריתם הצפנה (ופענוח) סימטרי?","options":["AES","RSA","HSTS","CT"],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf","date":"05/10/2025","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.237,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-18-10\" data-doc=\"original-18\" data-body-words=\"393\"><h2>שאלה 10 — אלגוריתם סימטרי</h2><div class=\"answer-body\">\n<p><strong>א — AES.</strong> זהו צופן בלוקים עם מפתח סודי משותף. ב RSA הוא אלגוריתם א־סימטרי עם זוג מפתחות. ג HSTS הוא מנגנון מדיניות HTTPS; ד CT הוא מנגנון שקיפות תעודות. לשימוש ב־AES על הודעות ארוכות נחוץ mode מתאים.</p>\n<h3>הבלוק, המפתח ושיטת ההפעלה</h3>\n<p>צופן בלוקים מגדיר פעולה הפיכה על מקטע בגודל קבוע תחת מפתח סודי. עבור אותו מפתח ואותו בלוק קלט מתקבל אותו בלוק פלט, והפענוח באמצעות המפתח המתאים מחזיר את הקלט. הגדרה זו אינה אומרת כיצד להצפין מסמך ארוך, איך לטפל במקטע אחרון קצר או איך למנוע חשיפת דפוסים בין בלוקים. לצרכים האלה בוחרים שיטת הפעלה ומגדירים כללי אתחול וריפוד מתאימים.</p>\n<p>בשיטת ספר קוד אלקטרוני כל בלוק מוצפן בנפרד, בלי תלות במיקומו או בבלוקים שכנים. לפיכך שני בלוקים זהים באותה הודעה ובאותו מפתח חייבים לתת פלט זהה. אפשר לנצל את הכלל הזה בשאלת בחירה בלי לחשב את הסבבים הפנימיים של הצופן: מחלקים את המסר לפי גודל הבלוק, מזהים חזרות ומשווים את המקטעים המקבילים בכל הצעת פלט. ייצוג הקסדצימלי משתמש בשני תווים לכל בית, ולכן צריך להקפיד על גבולות הבלוק ולא להשוות רק קטעים שנראים דומים.</p>\n<h3>מה אפשר ללמוד ומה אי אפשר להסיק מן הדפוס</h3>\n<p>חזרת בלוקים היא גם חולשה: הצופן אינו מסתיר שהופיעו מקטעים שווים, אפילו אם אינו חושף מיד מה תוכנם. לכן צופן בלוקים שנחשב חזק אינו הופך כל שיטת הפעלה לבטוחה. שימוש מעשי דורש בחירה לפי תכונות המידע והאיומים, ובדרך כלל גם אימות שלמות שמונע החלפת בלוקים או שינויים לא מורשים. הצפנה וסודיות אינן אותו דבר כמו הרשאה או מקור מאומת.</p>\n<p>ריפוד הוא עניין נפרד. אם מדיניות ההצפנה מוסיפה תמיד בלוק ריפוד גם כשהמסר כבר באורך מדויק, הפלט יהיה ארוך יותר ממספר בלוקי המסר המקוריים. בשאלה המציגה רק את שני הבלוקים המוצפנים צריך לקרוא את ההנחות ולא להמציא בלוק נוסף. גם אורך מפתח אינו גודל בלוק, והיותו מחרוזת קריאה אינו משנה את הכלל הדטרמיניסטי. לעומת הצפנה סימטרית, אלגוריתם מפתח ציבורי מחלק את יכולות ההצפנה או האימות והפענוח או החתימה בין מפתחות שונים. מדיניות דפדפן או יומן תעודות אינם כלל אלגוריתמי להצפנת בלוקים, גם אם מופיעות בהם אותיות לועזיות דומות.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>שוויון בין בלוקי פלט הוא תנאי הכרחי בהצפנה עצמאית של בלוקי קלט שווים, אך אינו מוכיח לבדו שכל שיטת הצפנה אחרת שגויה תמיד. ההכרעה כאן נשענת על הגדרת השיטה והמפתח הקבוע בשאלה. בשיטה הכוללת שרשור או קלט אתחול, אותה חזרה בקלט יכולה לתת פלט שונה. לכן יש לבדוק תחילה את שיטת ההפעלה ורק אז להסיק מסקנה מן הדפוס.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_05102025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q132.html"},{"id":"Q133","year":"2025","stem":"להלן פסאודו-קוד המציג פונק׳ המטפלת בצורה קריפטוגרפית במידע:\n```\nfunction foo(key_encryption, key_mac, ciphertext, tag):\n    if VerifyMAC(key_mac, ciphertext) != tag:\n        return \"Invalid!\"\n    else:\n        return Decrypt(key_encryption, ciphertext)\n```\nמהי השיטה בשימוש על פי פסאודו-קוד זה?","options":["Encrypt then MAC","MAC then Encrypt","Encrypt and MAC","Salt and Pepper"],"note":"","sources":[{"file":"2025/689156_02112025_0 (5).pdf","date":"02/11/2025","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.388,"exam_count":1,"in_sample_exam":false,"variant_group":"V12","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-14-01\" data-doc=\"original-14\" data-body-words=\"391\"><h2>שאלה 1 — זיהוי שילוב הצפנה ו־MAC</h2><div class=\"answer-body\">\n<p><strong>א — Encrypt then MAC.</strong> מאמתים את התג על ciphertext ורק לאחר הצלחה מפענחים אותו. ב הייתה מפענחת גם את התג ומחשבת MAC על plaintext; ג הייתה מעבירה תג על plaintext לצד ciphertext; ד שייכת לאחסון סיסמאות. VerifyMAC בנוסח השאלה משמש כחישוב/השוואת תג ולא כממשק בוליאני רגיל.</p>\n<h3>מה מתויג ומה מוצפן</h3>\n<p>כדי לסווג שילוב של הצפנה ותיוג צריך לענות על שתי שאלות: על איזה רצף בתים מחושב התג, והאם התג עצמו נמצא בתוך ההצפנה או לצידה. סדר שורות בקוד אינו מספיק, משום ששולח יכול לבצע חישובים עצמאיים בסדר כלשהו ולהישאר באותה בנייה קריפטוגרפית. החלק החשוב הוא מבנה התוצאה שהמקבל מקבל ואילו בדיקות עליו לבצע כדי לקבל בחזרה הודעה מאומתת.</p>\n<p>כאשר מצפינים ואז מתייגים, התג מחושב על התוכן המוצפן. המקבל יכול לבדוק את תקינות הקלט עוד לפני שפענח אותו. כאשר מתייגים ואז מצפינים, התג מחושב על המסר הגלוי ונכנס יחד איתו לתוך ההצפנה. המקבל חייב תחילה לפענח כדי לחלץ את שני החלקים, ורק אז הוא יכול לחשב תג ולבדוק התאמה. בבנייה השלישית מצפינים את המסר ובנפרד שולחים תג על המסר הגלוי; התג נמצא מחוץ להצפנה אך אינו מאמת ישירות את התוכן המוצפן.</p>\n<h3>קריאת קוד המקבל והשלכות אבטחתיות</h3>\n<p>קוד פענוח מספק בדרך כלל דרך פשוטה לזהות את הבנייה של השולח. אם השורה הראשונה מחשבת או בודקת תג של הטקסט המוצפן, מדובר במסלול של תיוג אחרי הצפנה. אם הפענוח מחזיר זוג של מסר ותג, ברור שבצד השולח שני אלה הוצפנו יחד. אם התג התקבל בנפרד ונבדק מול המסר המפוענח, זהו מסלול נפרד של הצפנה ותיוג. ההבחנה נקבעת לפי זרימת המידע, ולא לפי דמיון מילולי בין שמות האפשרויות.</p>\n<p>הצפנה לבדה נועדה לסודיות ואינה מתחייבת לזהות שינוי עוין. תיוג מוסיף שלמות ואימות מול מי שאינו מכיר את המפתח. עם זאת אין להסיק שכל חיבור שרירותי שלהם בטוח: טיפול שונה בשגיאות פענוח, חשיפת פרטי ריפוד או שימוש לא מתאים באותם מפתחות יכולים לפתוח ערוצי תקיפה. בתכנון מסודר מגדירים גם איך נמסר הווקטור ההתחלתי, על אילו שדות מחושב התג ומתי בודקים אותו. זיהוי שם הבנייה בשאלה אינו אישור אוטומטי לכל מימוש אפשרי שלה, אלא תיאור מדויק של היחס בין הפעולות והנתונים.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בעת העברת התג והטקסט המוצפן יש להגדיר גם את דרך הפרדת השדות. אם שני פורמטים שונים מתפרשים כאותו רצף בתים מאומת, עשוי להיווצר בלבול למרות שימוש בפרימיטיבים תקינים. לפיכך תיאור בנייה מלא כולל מבנה מסר חד־משמעי, מפתחות מתאימים וכללי דחייה. בשאלון זרימת הנתונים מספיקה לסיווג, אך היא אינה תחליף למפרט כזה במימוש אמיתי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_02112025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q133.html"},{"id":"Q134","year":"2025","stem":"ב TLS, נתון כי תוקף Man in the middle החליף תו בהודעת ה ClientHello שהלקוח שלח לשרת. מה השלב המוקדם ביותר שזה יתגלה?","options":["מיד לאחר שה ClientFinish הגיע לשרת","מיד לאחר שה ClientHello הגיע לשרת","מיד לאחר שה ServerHello הגיע ללקוח","מיד לאחר שה ClientKeyExchange הגיע לשרת"],"note":"","sources":[{"file":"2025/689156_02112025_0 (5).pdf","date":"02/11/2025","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"TLS / HTTPS","topic_score":0.31,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-14-02\" data-doc=\"original-14\" data-body-words=\"382\"><h2>שאלה 2 — שינוי ClientHello ב־TLS</h2><div class=\"answer-body\">\n<p><strong>א — בבדיקת ClientFinished בשרת.</strong> שינוי תקין מבחינה תחבירית עשוי לעבור את שלבי המשא ומתן; אך הצדדים מחזיקים תמלילי handshake שונים, וה־Finished מאמת את התמליל באמצעות סוד החיבור. ב וג אינם חייבים לזהות שינוי שנשאר הודעה תקינה; ד אינה מאמתת לבדה את כל התמליל. במימוש מסוים שינוי יכול לגרום לכשל מוקדם אם הוא משבש תחביר או פרמטר; התשובה היא זיהוי קריפטוגרפי מובטח במודל ההרצאה.</p>\n<h3>חלוקת התפקידים בהקמת הערוץ</h3>\n<p>בתחילת החיבור הלקוח והשרת עדיין אינם חולקים את מפתחות התעבורה החדשים. הלקוח פותח במשא ומתן על פרמטרים, השרת בוחר מבין האפשרויות המותרות ומציג אמצעי אימות מתאים, ובהמשך הצדדים מפיקים סוד משותף וממנו מפתחות. בהקשר מבוסס תעודות הלקוח בודק שהמפתח שהוצג קשור לשם האתר שאליו התכוון להגיע וששרשרת החתימות מובילה לשורש אמין. קיום חתימה חוקית כשלעצמו אינו מספיק אם התעודה שייכת לאתר אחר או אם אינה בתוקף.</p>\n<p>בשאלות המתארות חילוף מפתחות באמצעות הצפנה במפתח ציבורי של השרת, הלקוח יוצר סוד ראשוני ומצפין אותו כך שרק בעל המפתח הפרטי יוכל לפענחו. זהו מסלול היסטורי, ואין להשליך ממנו שכל חיבור מודרני פועל כך. בחילוף מפתחות זמני מבוסס דיפי–הלמן, מפתח התעודה משמש לאימות פרמטרים והסוד אינו מועבר באותה הצפנת מפתח ציבורי. להבחנה יש משמעות כאשר מפתח התעודה נגנב לאחר הקלטת התקשורת.</p>\n<h3>תמליל מאומת וגזירת מפתחות</h3>\n<p>בסוף הקמת החיבור הצדדים בודקים ערכים התלויים בתמליל הודעות ההקמה ובסודות שהפיקו. כך ניתן לזהות תוקף שהחליף הודעה בדרך גם אם היא נראית תקינה מבחינת התחביר. אם כל צד זוכר תמליל אחר, ערכי האימות אינם תואמים. שינוי שהורס תחביר או מונע הסכמה יכול כמובן לגרום לכשל מוקדם יותר, ולכן יש להבחין בין זיהוי אפשרי לבין זיהוי קריפטוגרפי מובטח בשלב האימות.</p>\n<p>מספרים אקראיים והקשר ההקמה נכללים בגזירת המפתחות כדי להבחין בין חיבורים ולהקטין שימוש חוזר בלתי רצוי בחומר מפתחות. נגזרים מפתחות נפרדים לכיווני התעבורה; באותו כיוון הצד המצפין והצד המפענח משתמשים בסוד הסימטרי המתאים. לאחר ההקמה אין צורך להצפין כל הודעת יישום בעזרת המפתח הציבורי שבתעודה. ההצפנה הסימטרית מגינה על התעבורה, ואימות השלמות מונע שינויים שקטים. כל זאת עדיין תלוי בבדיקה נכונה של זהות השרת ובהגנת המפתחות.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>יש גם להבחין בין מפתח ארוך־טווח שמזהה אתר לבין מפתח זמני של חיבור מסוים. תעודה יכולה לשמש חיבורים רבים, בעוד מפתחות תעבורה חדשים מופקים בכל הקמה מתאימה. לכן ידיעת תעודה ציבורית אינה ידיעת מפתח הפענוח של הסשן. חזרה של תעודת האתר בחיבורים שונים אינה כשלעצמה שימוש חוזר באותו מפתח הצפנה סימטרי לתוכן המשתמשים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_02112025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q134.html"},{"id":"Q135","year":"2025","stem":"מהי הטענה הנכונה?","options":["ב Dom based XSS הקוד הפגיע (הקוד עם החולשה) מורץ בדפדפן","מנגנון ה Same Origin Policy מונע Dom based XSS אך לא מונע Reflected XSS","ב Dom based XSS הקוד הפגיע (הקוד עם החולשה) מורץ בשרת","מנגנון ה Same Origin Policy מונע Reflected XSS אך לא מונע Dom based XSS"],"note":"","sources":[{"file":"2025/689156_02112025_0 (5).pdf","date":"02/11/2025","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.321,"exam_count":1,"in_sample_exam":false,"variant_group":"V13","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-14-03\" data-doc=\"original-14\" data-body-words=\"371\"><h2>שאלה 3 — DOM-based XSS</h2><div class=\"answer-body\">\n<p><strong>א — הקוד הפגיע רץ בדפדפן.</strong> למשל קוד קורא location.hash ומכניס אותו ל־innerHTML. ג מייחסת בטעות את החולשה לשרת. ב וד שגויות: SOP אינו מונע XSS, משום שהסקריפט הזדוני רץ במקור של האתר הפגיע, גם ב־DOM וגם ב־reflected.</p>\n<h3>כיצד קוד מוזרק מקבל את הרשאות האתר</h3>\n<p>הדפדפן אינו יודע איזו פיסת קוד נכתבה בכוונה בידי מפתח האתר ואיזו נכנסה בגלל חיבור לא בטוח של קלט אל תוכן העמוד. כאשר טקסט שמקורו בפרמטר, במסד נתונים או בכתובת מוכנס להקשר שמפורש כקוד, הוא עלול לרוץ כחלק מן האתר. הסקריפט מקבל אז את ההרשאות של מקור האתר הפגיע, ולא של האתר שבו התוקף הכין את הקלט. זו הסיבה שמדיניות ההפרדה בין מקורות אינה הגנה מספקת לאחר שההזרקה כבר הצליחה.</p>\n<p>בהזרקה מוחזרת השרת מחזיר קלט של הבקשה לתוך התגובה בצורה מסוכנת. בהזרקה שמורה הקלט נשמר קודם, למשל בהודעת משתמש, ומוצג בהמשך למבקרים. בהזרקה מבוססת מסמך הקוד הפגיע שרץ בדפדפן קורא קלט לא אמין ומעביר אותו לפעולה שמפרשת תוכן. חשוב להבדיל בין המיקום שבו נמצאת החולשה לבין המקום שבו הקוד הזדוני רץ: בכל המקרים הנדונים קוד התקיפה רץ בדפדפן, אך במסלול המבוסס על המסמך גם העיבוד הפגיע עשוי להתרחש שם ללא יצירת התוכן הפגום בשרת.</p>\n<h3>מדוע טוקן חבוי אינו מגן מקוד באותו מקור</h3>\n<p>טוקן נגד זיוף בקשות אמור להיות סוד שהתוקף שמפעיל אתר אחר אינו יכול לקרוא, אף שהדפדפן יכול לשלוח עוגיית כניסה אוטומטית. כאשר לתוקף יש קוד בתוך האתר עצמו, ההנחה הזאת נשברת: הקוד יכול לקרוא שדה חבוי, לאתר טופס, ולהגיש בקשה עם הטוקן יחד עם הרשאות הסשן. שדה חבוי מסתיר רכיב מהתצוגה הרגילה, אך אינו מצפין אותו ואינו מסתיר אותו מתוכנית בדפדפן.</p>\n<p>גם שימוש בבקשת שליחה שאינה כוללת פרמטרים בכתובת אינו מונע קריאה של הטוקן מתוך העמוד. בדומה לכך, חסימת קריאת עוגייה בסקריפט אינה מונעת מהסקריפט להפעיל פעולה שהדפדפן שולח אליה את העוגייה בעצמו. ההגנה הראשונית היא מניעת הזרקת הקוד באמצעות קידוד המתאים להקשר, פעולות מסמך בטוחות ומדיניות תוכן משלימה. הגנות אלה פועלות לפני שהקוד מקבל את הרשאות המקור.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>דוגמת פעולה תקינה שהופכת למסוכנת היא הצגת שם משתמש: אם המפתח מכניס את השם באמצעות פעולה שמפרשת תגיות, תו שנועד להיות חלק מהשם עלול לפתוח רכיב פעיל. אם אותו שם מוכנס כטקסט בלבד, התגים מוצגים ולא מבוצעים. ההבדל הוא באופן השימוש בקלט, ולא בהכרח במקור שממנו הגיע או בהרשאות המשתמש שהקליד אותו.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_02112025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q135.html"},{"id":"Q136","year":"2025","stem":"כאשר אליס נרשמת לאתר אינטרנט מסוים, נתון שהאתר לא שומר את הסיסמא עצמה של אליס, אלא מייצר salt ארוך ואקראי, ושומר עבור אליס את ה salt ואת תוצאת ביצוע hash על שרשור של ה salt עם הסיסמא של אליס, כלומר התוצאה של:\nhash(salt || password)\nעם זאת, במקרה נדיר, יכול להיות שמשתמש שאינו אליס, יוכל להתחבר בהצלחה ליוזר של אליס באתר זה, וזאת למרות שהוא אינו יודע את הסיסמא של אליס, ויתרה מכך, הוא מתחבר עם סיסמא שהיא שונה מהסיסמא שאליס נרשמה איתה לאתר. מהי התופעה שתגרום לכך?","options":["Hash collision","Pepper","Certificate Transparency","HSTS"],"note":"","sources":[{"file":"2025/689156_02112025_0 (5).pdf","date":"02/11/2025","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.266,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-14-04\" data-doc=\"original-14\" data-body-words=\"385\"><h2>שאלה 4 — סיסמה אחרת שמאמתת לאותו digest</h2><div class=\"answer-body\">\n<p><strong>א — התנגשות hash.</strong> עבור אותו salt, שתי סיסמאות שונות יכולות עקרונית לקיים h(salt||p)=h(salt||p′). במקרה שמכוונים לחשבון קיים זהו חיפוש קדם־תמונה שנייה, והצלחתו נותנת התנגשות. ב היא סוד נוסף באחסון סיסמאות; ג שקיפות תעודות; ד כפיית HTTPS. אין להסיק שהתנגשויות הן דרך מעשית לפרוץ hash קריפטוגרפי תקין.</p>\n<h3>שלוש בעיות חיפוש שונות</h3>\n<p>פונקציית גיבוב ממפה מסרים באורכים שונים לתוצאה באורך קבוע. מכיוון שיש יותר מסרים מתוצאות אפשריות, קיימים בהכרח מסרים שונים בעלי אותה תוצאה. דרישת האבטחה אינה שאין התנגשויות כלל, אלא שלא תהיה לתוקף דרך מעשית למצוא את ההתאמות המסוכנות הנדרשות בתקיפה. כדי להבין איזו תכונה נשאלת צריך קודם לשאול מה כבר ניתן לתוקף ומה הוא רשאי לבחור בעצמו.</p>\n<p>בעמידות לקדם־תמונה התוקף מקבל תוצאה ומנסה למצוא מסר שמגיע אליה. הוא אינו חייב למצוא דווקא את המסר המקורי; כל מסר בעל אותה תוצאה מספיק. בעמידות לקדם־תמונה שנייה התוקף מקבל מסר מסוים, וצריך למצוא מסר אחר בעל אותו גיבוב. בעמידות להתנגשויות שני המסרים נתונים לבחירתו, כל עוד יהיו שונים ויגיעו לאותה תוצאה. ההבדל בין קיבוע מסר אחד לבין בחירת שני מסרים מסביר מדוע שמות התכונות אינם ניתנים להחלפה.</p>\n<h3>קישור למקרה מעשי ולמסיחים</h3>\n<p>במערכת אימות סיסמאות, נתון חשבון מסוים עם ערך בדיקה שנוצר מסיסמה מסוימת. אם סיסמה שונה עוברת את אותה בדיקה תחת אותו ערך המלחה, שני קלטים שונים הובילו לאותו גיבוב. עצם האירוע הוא התנגשות; תקיפה מכוונת של החשבון הקבוע נוגעת לקדם־תמונה שנייה. הוספת ערך המלחה אינה מבטלת את האפשרות המתמטית להתנגשויות, אך מונעת שימוש באותו חישוב מוקדם עבור משתמשים רבים.</p>\n<p>לשם השוואה, מציאת שני מסרים עם תוצאות שונות היא פעולה קלה ורצויה. אם כמעט כל מסר היה מקבל אותה תוצאה, הפונקציה הייתה חסרת תועלת לזיהוי שינויים. גם יצירת מחרוזת תוצאה שונה מזו שניתנה אינה מעידה על קושי קריפטוגרפי. לכן חלופות שמחליפות את סימן השוויון באי־שוויון אינן וריאציה קטנה של ההגדרה אלא טענה אחרת לגמרי. מונחים מתחומים כגון תעודות, כפיית הצפנה או סוד נוסף באחסון סיסמאות עשויים להיות קשורים להגנה הכוללת, אך אינם מגדירים את בעיית החיפוש של הגיבוב עצמו. הבחירה הנכונה מבוססת על הקלט, יעד החיפוש ותנאי ההצלחה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אורך התוצאה משפיע על עלות התקיפות הכלליות: בחיפוש זוג חופשי קיימת תופעת יום ההולדת, שמאפשרת לפגוש התנגשות מוקדם יחסית לחיפוש קדם־תמונה של תוצאה קבועה. אין צורך לחשב את העלות המדויקת כדי לזהות את ההגדרה, אך העיקרון מסביר מדוע אסור להחליף בין שני סוגי החיפוש. חופש הבחירה של התוקף משנה את הבעיה גם באותה פונקציה עצמה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_02112025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q136.html"},{"id":"Q137","year":"2025","stem":"מה בביטקוין מונע Double spending?","options":["לתוקף אין מספיק משאבים חישוביים כי בביטקוין יש קונצנזוס סביב הבלוקצ׳יין בו מאמצים תמיד את השרשרת הארוכה ביותר, ולכן המתנה של מספיק בלוקים תפתור fork ים שיכלו לשמש ל double spending.","הביטקוין צמוד למשאב יציב (ספציפית, לערכו של הזהב), ולכן לתוקף אין מספיק זהב כדי לגרום שיתבצע double spending גם בביטקוין וגם בזהב.","מנגנון ה escrow transactions בו כל משתמש ביטקוין חייב ״לנעול״ בערבון מספיק ביטקוין מראש כך שאם ייתפס ינקו את הקנס מהערבון.","מנגנון ה escrow transactions בו כל miner חייב ״לנעול״ בערבון מספיק ביטקוין מראש כך שאם ייתפס שהminer אפשר לתוקף לבצע double spending ינקו את הקנס מהערבון של ה miner."],"note":"","sources":[{"file":"2025/689156_02112025_0 (5).pdf","date":"02/11/2025","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.327,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-14-05\" data-doc=\"original-14\" data-body-words=\"394\"><h2>שאלה 5 — מניעת double spending</h2><div class=\"answer-body\">\n<p><strong>א — קונצנזוס על השרשרת בעלת העבודה המצטברת המרבית.</strong> צמתים דוחים הוצאה של UTXO שכבר נצרך; אישורים נוספים מקטינים סיכון שענף מתחרה יחליף את ההיסטוריה, בהנחה שלתוקף אין די כוח כרייה. ניסוח ״השרשרת הארוכה״ הוא קיצור בהנחת קושי דומה. ב שגויה: ביטקוין אינו מגובה בזהב. ג וד ממציאות ערבון וקנסות שאינם מנגנון קונצנזוס ביטקוין. אין כאן מניעה מוחלטת של ארגון מחדש בכל מודל תוקף.</p>\n<h3>חוקיות עסקאות לעומת הכרעה על סדר ההיסטוריה</h3>\n<p>עסקת ביטקוין מנסה להוציא פלטים קיימים ולהגדיר פלטים חדשים. הצמתים בודקים בין היתר שהפלטים הנצרכים קיימים, שלא נצרכו כבר בהיסטוריה הרלוונטית, שתנאי הפדיון מתקיימים ושהסכומים עומדים בכללי הפרוטוקול. חתימה תקינה מוכיחה הרשאה להשתמש בפלט מסוים, אך אינה פותרת לבדה מצב שבו בעל המפתח חתם על שתי עסקאות סותרות. לשתי עסקאות יכולות להיות חתימות תקינות, בעוד שאי אפשר לקבל את שתיהן באותה היסטוריה תקפה.</p>\n<p>הקונצנזוס מספק דרך להכריע איזו היסטוריה תיחשב פעילה כשיש ענפים מתחרים. כורים אוספים עסקאות לבלוק מועמד ומחפשים כותרת שעומדת ביעד הוכחת העבודה. צמתים המקבלים בלוק אינם צריכים לסמוך על הכרזת הכורה: הם מחשבים ובודקים את העבודה ואת חוקיות התוכן בעצמם. כורה רשאי לבחור מבין עסקאות תקינות, ואין כלל בסיסי שמחייב אותו לבחור דווקא את בעלות העמלות הגבוהות ביותר.</p>\n<h3>אישורים, הסתעפויות והיעדר סמכות מרכזית</h3>\n<p>שני כורים יכולים למצוא בלוקים קרובים בזמן ולגרום להסתעפות זמנית. בהמשך מתווספת עבודה לאחד הענפים, והצמתים מעדיפים את השרשרת התקפה בעלת העבודה המצטברת המרבית. אישורים נוספים מגדילים את העבודה שתידרש כדי להחליף את העסקה בהיסטוריה מתחרה. זו הגנה התלויה בהנחות על כוח התוקף ועל תנאי הרשת, ולא משפט שלפיו ארגון מחדש בלתי אפשרי לאחר מספר קבוע של בלוקים.</p>\n<p>לא נדרש שרת מרכזי שיחתום על כל בלוק שהתקבל, ולא נדרש מכל משתמש לכרות כדי לבצע עסקה. הארנק מנהל מפתחות וחתימות, הכורים מציעים סדר באמצעות בלוקים, והצמתים מאמתים באופן עצמאי. אין גם מנגנון כללי שבו כורה חייב להפקיד ערבון שנחתך בגלל הוצאה כפולה; רעיון כזה שייך לתכנונים אחרים ואינו הבסיס המתואר כאן. עצי מרקל מאפשרים לחייב אוסף עסקאות ולהוכיח הכלה ביעילות, אך אינם מצפינים אותן ואינם מחליפים את בדיקות החוקיות. ההפרדה בין התפקידים מונעת בלבול בין פרטיות, הרשאה, הוכחת עבודה וקונצנזוס.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בעת שינוי כללי הרשת צריך לבדוק גם תאימות בין צמתים שכבר עודכנו לבין צמתים ישנים. כלל חדש שמקבל בלוקים שנדחו בעבר עלול ליצור שרשראות שכל קבוצה מקבלת אחרת. כלל מצמצם בלבד יכול לאפשר תאימות מסוג אחר. לכן סיווג שינוי נקבע לפי קבוצת הבלוקים החוקיים ולא לפי השאלה אם ההצעה נשמעת מועילה, מהירה או חדשנית.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_02112025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q137.html"},{"id":"Q138","year":"2025","stem":"בהקשר של textbook RSA (כלומר ללא hash), בחרו את שני המספרים הראשוניים הבאים:\np = 5, q = 7\nמהערכים הללו, יצרו את המפתח הפומבי הבא:\nn = 35, e = 11\nמה מבין הבאים הינו מפתח פרטי מתאים?","options":["n = 35, d = 11","n = 35, d = 12","n = 35, d = 13","n = 5, d = 12"],"note":"","sources":[{"file":"2025/689156_02112025_0 (5).pdf","date":"02/11/2025","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.361,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-14-06\" data-doc=\"original-14\" data-body-words=\"356\"><h2>שאלה 6 — מפתח RSA</h2><div class=\"answer-body\">\n<p><strong>א — n=35,d=11.</strong> φ(35)=24 ו־11·11=121≡1 mod 24. ב נותנת 11·12≡12; ג נותנת 11·13≡23; ד משנה גם את n ולכן אינה תואמת למפתח הפומבי. המפתח הפרטי חייב להתאים לאותו מודולוס.</p>\n<h3>בניית המפתח ומשמעות החשבון המודולרי</h3>\n<p>באלגוריתם הנדון בוחרים שני ראשוניים שונים, מכפילים אותם לקבלת המודולוס, ומחשבים את מספר השאריות הזרות למודולוס. במקרה של מכפלת שני ראשוניים המספר הזה הוא מכפלת שני המספרים הקטנים באחד מן הראשוניים. לאחר מכן בוחרים מעריך ציבורי הזר למספר שהתקבל, ומוצאים לו הופכי כפל מודולרי שישמש כמעריך הפרטי. המודולוס משותף לשני המפתחות; החלפתו במספר אחר אינה יוצרת מפתח פרטי מתאים לאותו מפתח ציבורי.</p>\n<p>הדרישה להופכי פירושה שמכפלת שני המעריכים משאירה שארית אחת בחלוקה במספר השאריות הזרות. לכן אין צורך שהמעריכים יהיו שונים, גדולים במיוחד או אחד ראשוני ואחד לא. יש לבדוק את משוואת ההופכי במפורש. באימות חלופות של מפתח, חישוב המכפלה והשארית הוא בדיקה ישירה וקצרה הרבה יותר מניסיון להצפין אוסף מסרים ולקוות שהכול עובד.</p>\n<h3>חתימה, אימות ודרך חישוב יעילה</h3>\n<p>בחתימת ספר לימוד על מסר מספרי מעלים את המסר בחזקת המעריך הפרטי ומצמצמים מודולו המודולוס. לא מצפינים במפתח הציבורי כדי לחתום. כדי לאמת מעלים את החתימה בחזקת המעריך הציבורי ובודקים שחזר המסר. כאשר נדרשים לשחזר מסר מחתימה, זהו אותו כיוון אימות, גם אם השאלה מספקת תחילה דווקא את המעריך הפרטי. ההסבר המקדים לכל שאלה מיישם את התפקידים האלה על המספרים המסוימים שבה.</p>\n<p>אפשר לבצע את החזקות באמצעות ריבועים חוזרים: מחשבים חזקה שנייה, ממנה רביעית וכן הלאה, ובכל שלב שומרים רק את השארית. אחר כך מכפילים את החזקות המתאימות לפירוק הבינארי של המעריך. כך נשמרים מספרים קטנים ונמנעות טעויות של כתיבת מספר עצום. כל המספרים הקטנים בשאלון נועדו להדגים את המתמטיקה ואינם מפתחות בטוחים לשימוש. חתימה מעשית גם אינה חתימת ספר לימוד ישירה על מספר שרירותי; נדרשים גיבוב, קידוד חתימה תקני ובדיקת תקינות של המפתחות כדי למנוע מניפולציות שלא נלמדות מן החשבון הפשוט בלבד.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בדיקה נוספת מועילה היא להחזיר את התוצאה דרך הפעולה ההפוכה: אם חושבה חתימה, מאמתים אותה ומוודאים שחזר המסר; אם נבחר מעריך פרטי, בודקים את מכפלתו במעריך הציבורי. שאריות שליליות מותרות בזמן החישוב, אבל את התוצאה הסופית נוח להציג כנציג שאינו שלילי וקטן מן המודולוס. כך ניתן לזהות מסיח שמייצג מספר גדול או פעולה בכיוון הלא נכון.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_02112025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q138.html"},{"id":"Q139","year":"2025","stem":"כיצד דפדפנים אוכפים את השימוש ב Certificate Transparency (CT)?","options":["הדפדפן דורש שלתעודה תקינה יהיה מספר SCTs שנחתמו על ידי לוגרים שהדפדפן סומך עליהם.","הדפדפן בודק את התעודה מול הCRL של הCA שהנפיק את התעודה.","הדפדפן דורש שהתעודה תוצפן בעזרת המפתח הסימטרי של הלוגרים.","הדפדפן בודק האם המוניטורים הצפינו את התעודה ואחסנו את תוצאת ההצפנה אצל הלוגרים."],"note":"","sources":[{"file":"2025/689156_02112025_0 (5).pdf","date":"02/11/2025","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.339,"exam_count":1,"in_sample_exam":false,"variant_group":"V14","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-14-07\" data-doc=\"original-14\" data-body-words=\"375\"><h2>שאלה 7 — אכיפת CT</h2><div class=\"answer-body\">\n<p><strong>א — בדיקת SCTs מלוגים אמינים.</strong> אלה חתימות על הבטחה לכלול את התעודה בלוג. ב היא בדיקת ביטול דרך CRL; ג אינה מנגנון CT ואין הצפנה סימטרית כזאת; ד מבלבלת מוניטורים עם לוגים ועם אחסון הצפנה. מוניטורים סורקים את הרישומים כדי לאתר הנפקות חשודות.</p>\n<h3>מדוע שרשרת אמון אינה מספיקה לביקורת הנפקות</h3>\n<p>רשות מוסמכת יכולה להנפיק בטעות תעודה לדומיין שאינו שייך למבקש, או שמפתח שלה עלול להיות מנוצל לרעה. לקוח הבודק רק חתימות עשוי לראות תעודה בעלת שרשרת חוקית, אף שבעל הדומיין האמיתי כלל לא ביקש אותה. שקיפות תעודות מוסיפה יכולת תצפית ציבורית: התעודות והתחייבויות הרישום שלהן מופיעות ביומנים שאפשר לבדוק ולנטר. המטרה אינה להצפין את התעודה או להסתיר את זהות האתר, אלא לאפשר גילוי של הנפקות חריגות גם לאחר שעברו את בדיקת החתימות הרגילה.</p>\n<p>יש להפריד בין הרשות המנפיקה, היומן והמנטר. היומן מקבל תעודות ומנהל מבנה נתונים שניתן לביקורת. המנטר קורא רישומים ומחפש למשל תעודות חדשות עבור דומיינים שהארגון מנהל. בעל דומיין שרואה תעודה שלא הזמין יכול לפתוח בירור ולבקש טיפול. עצם העובדה שתעודה מופיעה ביומן אינה אומרת שהיומן אישר שהמבקש הוא בעל הדומיין; בדיקת הזכאות להנפקה היא אחריות נפרדת.</p>\n<h3>התחייבות חתומה, הוכחת הכלה וביטול</h3>\n<p>חותמת הזמן החתומה היא הבטחה של יומן מסוים לכלול את התעודה בהתאם לכלליו. חתימת היומן מאפשרת לדפדפן לזהות מי נטל את ההתחייבות ולוודא שלא שינו אותה. היא שונה מהוכחת הכלה בעץ מרקל, שמראה כי רשומה מסוימת כבר נכללה במצב מסוים של היומן. הוכחת עקביות נועדה להראות שהיומן גדל באמצעות הוספה ולא שכתב את עברו. מבני הנתונים האלה מאפשרים ביקורת יעילה גם בלי שכל לקוח יוריד כל רשומה.</p>\n<p>דפדפן יכול לדרוש התחייבויות מיומנים שהוא מכיר, בהתאם למדיניותו, ועדיין חייב לבדוק זהות דומיין, שרשרת אמון וזמני תוקף. מנגנוני ביטול כגון רשימות ביטול או תשובות סטטוס פותרים בעיה אחרת: תעודה שהייתה קיימת כעת אינה אמורה להתקבל. רישום פומבי אינו מוחק תעודה ואינו מונע לבדו שימוש במפתח שנגנב. לכן חלופה המחליפה שקיפות בביטול, או טוענת שחותמת היומן פותרת את פרטיות בירור הסטטוס, מבלבלת בין מנגנונים שונים.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>נניח שבעל אתר מגלה ביומן תעודה שהונפקה בשמו בלי ידיעתו. הממצא מאפשר לפתוח בירור מול המנפיק ולנקוט פעולות ביטול והחלפה, אך היומן אינו מתקן לבדו את ההנפקה. זהו ההבדל בין ראיה ציבורית שמסייעת לגילוי ולהרתעה לבין אמצעי אכיפה שמונע קבלת תעודה מסוימת. שני התפקידים משלימים זה את זה ונחוצים בזמנים שונים של הטיפול באירוע.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_02112025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q139.html"},{"id":"Q140","year":"2025","stem":"מה מבין הבאים היא ההגדרה של תכונת ה second pre image resistance?","options":["Given a random message m<sub>0</sub>, it is hard to find a message m<sub>1</sub> that is not equal to m<sub>0</sub> such that h(m<sub>0</sub>) = h(m<sub>1</sub>)","Given a digest d of a random message, it is hard to find a message m such that d = h(m)","It is hard to find messages m<sub>0</sub> ≠ m<sub>1</sub> such that h(m<sub>0</sub>) = h(m<sub>1</sub>)","It is hard to find messages m<sub>0</sub> ≠ m<sub>1</sub> such that h(m<sub>0</sub>) ≠ h(m<sub>1</sub>)"],"note":"","sources":[{"file":"2025/689156_02112025_0 (5).pdf","date":"02/11/2025","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.31,"exam_count":1,"in_sample_exam":false,"variant_group":"V11","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-14-08\" data-doc=\"original-14\" data-body-words=\"392\"><h2>שאלה 8 — הגדרת second preimage resistance</h2><div class=\"answer-body\">\n<p><strong>א — בהינתן m₀ קשה למצוא m₁≠m₀ עם h(m₀)=h(m₁).</strong> ההודעה הראשונה נתונה מראש. ב היא preimage resistance, שבה נתון רק digest. ג היא collision resistance, שבה התוקף בוחר את שתי ההודעות. ד דורשת קושי למצוא hashes שונים, משימה קלה שאינה דרישת אבטחה. באנגלית שבמקור האפשרויות הוזזו מתחת לשאלה בעקבות החילוץ; זהו שיוכן לפי הסדר.</p>\n<h3>שלוש בעיות חיפוש שונות</h3>\n<p>פונקציית גיבוב ממפה מסרים באורכים שונים לתוצאה באורך קבוע. מכיוון שיש יותר מסרים מתוצאות אפשריות, קיימים בהכרח מסרים שונים בעלי אותה תוצאה. דרישת האבטחה אינה שאין התנגשויות כלל, אלא שלא תהיה לתוקף דרך מעשית למצוא את ההתאמות המסוכנות הנדרשות בתקיפה. כדי להבין איזו תכונה נשאלת צריך קודם לשאול מה כבר ניתן לתוקף ומה הוא רשאי לבחור בעצמו.</p>\n<p>בעמידות לקדם־תמונה התוקף מקבל תוצאה ומנסה למצוא מסר שמגיע אליה. הוא אינו חייב למצוא דווקא את המסר המקורי; כל מסר בעל אותה תוצאה מספיק. בעמידות לקדם־תמונה שנייה התוקף מקבל מסר מסוים, וצריך למצוא מסר אחר בעל אותו גיבוב. בעמידות להתנגשויות שני המסרים נתונים לבחירתו, כל עוד יהיו שונים ויגיעו לאותה תוצאה. ההבדל בין קיבוע מסר אחד לבין בחירת שני מסרים מסביר מדוע שמות התכונות אינם ניתנים להחלפה.</p>\n<h3>קישור למקרה מעשי ולמסיחים</h3>\n<p>במערכת אימות סיסמאות, נתון חשבון מסוים עם ערך בדיקה שנוצר מסיסמה מסוימת. אם סיסמה שונה עוברת את אותה בדיקה תחת אותו ערך המלחה, שני קלטים שונים הובילו לאותו גיבוב. עצם האירוע הוא התנגשות; תקיפה מכוונת של החשבון הקבוע נוגעת לקדם־תמונה שנייה. הוספת ערך המלחה אינה מבטלת את האפשרות המתמטית להתנגשויות, אך מונעת שימוש באותו חישוב מוקדם עבור משתמשים רבים.</p>\n<p>לשם השוואה, מציאת שני מסרים עם תוצאות שונות היא פעולה קלה ורצויה. אם כמעט כל מסר היה מקבל אותה תוצאה, הפונקציה הייתה חסרת תועלת לזיהוי שינויים. גם יצירת מחרוזת תוצאה שונה מזו שניתנה אינה מעידה על קושי קריפטוגרפי. לכן חלופות שמחליפות את סימן השוויון באי־שוויון אינן וריאציה קטנה של ההגדרה אלא טענה אחרת לגמרי. מונחים מתחומים כגון תעודות, כפיית הצפנה או סוד נוסף באחסון סיסמאות עשויים להיות קשורים להגנה הכוללת, אך אינם מגדירים את בעיית החיפוש של הגיבוב עצמו. הבחירה הנכונה מבוססת על הקלט, יעד החיפוש ותנאי ההצלחה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אורך התוצאה משפיע על עלות התקיפות הכלליות: בחיפוש זוג חופשי קיימת תופעת יום ההולדת, שמאפשרת לפגוש התנגשות מוקדם יחסית לחיפוש קדם־תמונה של תוצאה קבועה. אין צורך לחשב את העלות המדויקת כדי לזהות את ההגדרה, אך העיקרון מסביר מדוע אסור להחליף בין שני סוגי החיפוש. חופש הבחירה של התוקף משנה את הבעיה גם באותה פונקציה עצמה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_02112025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q140.html"},{"id":"Q141","year":"2025","stem":"אם אתר אינטרנט רוצה שדפדפנים יפנו אליו תמיד ב HTTPS ולא ב HTTP שאינו על גבי TLS, כולל דפדפנים שמעולם לא גלשו אליו, עליו להשתמש ב:","options":["HSTS preload","Same Origin Policy","OCSP","OCSP stapling"],"note":"","sources":[{"file":"2025/689156_02112025_0 (5).pdf","date":"02/11/2025","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"TLS / HTTPS","topic_score":0.271,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-14-09\" data-doc=\"original-14\" data-body-words=\"372\"><h2>שאלה 9 — HTTPS גם בביקור ראשון</h2><div class=\"answer-body\">\n<p><strong>א — HSTS preload.</strong> רשימה שמופצת מראש בדפדפן מאפשרת שדרוג לפני בקשת HTTP ראשונה. ב מגבילה גישה בין origins; ג וד בודקות סטטוס ביטול תעודה ולא בוחרות תעבורה מוצפנת. כותרת HSTS שנלמדת רק בביקור מוצלח אינה מספיקה לדרישת ״מעולם לא גלשו״.</p>\n<h3>כיצד הדפדפן לומד שאין להשתמש בחיבור פתוח</h3>\n<p>כאשר משתמש מקליד כתובת שאינה מציינת ערוץ מוצפן, או פותח קישור המתחיל בפרוטוקול פתוח, הפניה רגילה של השרת לערוץ מוצפן מגיעה רק אחרי שהבקשה הראשונה כבר יצאה. תוקף השולט בדרך עשוי לנצל את הבקשה הזאת כדי לשנות את ההפניה או להחזיר תוכן משלו. מדיניות אבטחת תעבורה מחמירה מאפשרת לדפדפן לזכור מראש שעבור שם אתר מסוים אין להתחיל בערוץ הפתוח, אלא לשדרג מקומית לערוץ מוצפן עוד לפני יציאת הבקשה.</p>\n<p>במסלול הלמידה הרגיל האתר שולח כותרת מדיניות בתגובה שהתקבלה בחיבור מוצפן ומאומת. הכותרת כוללת משך זמן שבו המדיניות נשמרת, ולעיתים מציינת שגם שמות המשנה נכללים. הדפדפן אינו אמור לסמוך על הוראה כזאת שנשלחה בחיבור פתוח, כי תוקף יכול היה ליצור אותה. לאחר שלמד את המדיניות, גם הקלדה מפורשת של כתובת פתוחה לא מחייבת שליחת בקשה פתוחה בפועל.</p>\n<h3>בעיית הביקור הראשון והמשמעות של טעינה מראש</h3>\n<p>הזיכרון המקומי אינו פותר לבדו ביקור בדפדפן שמעולם לא פגש את האתר. לרשימת טעינה מראש יש תפקיד שונה: המידע שהאתר מחייב ערוץ מוצפן נכלל במידע שמופץ עם הדפדפן, ולכן ניתן לשדרג גם בביקור הראשון. זאת הנקודה שמכריעה בשאלה אם אפשר להבטיח את המדיניות ללקוחות חדשים לגמרי, ולא רק לאלו שכבר קיבלו כותרת תקפה.</p>\n<p>המנגנון אינו מאמת בעצמו שתעודת השרת הונפקה כראוי, אינו מחליף שרשרת אמון ואינו מאחסן סטטוס ביטול תעודה. הוא קובע באיזה סוג ערוץ מותר לנסות להשתמש, והערוץ המוצפן עדיין צריך לעבור את בדיקותיו הרגילות. גם הגבלת גישה בין מקורות וטוקנים נגד זיוף בקשות פותרים בעיות אחרות: אתר יכול לחייב הצפנה ועדיין להיות פגיע לקוד מוזרק או לפעולה שנשלחה ללא כוונת המשתמש. יש גם משמעות להגדרת שמות המשנה ולמשך המדיניות; הצהרה על אתר אחד אינה מחילה אוטומטית מדיניות על כל אתר בעל שם דומה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>הפניה של השרת והחלטה מקומית של הדפדפן עשויות להיראות למשתמש דומות, משום שבשתיהן הוא מגיע בסוף לכתובת מוצפנת. מבחינת תוקף רשת ההבדל מכריע: בהפניה כבר נשלחה בקשה ראשונה שניתן להשפיע עליה, ובהחלטה מקומית היא כלל לא יוצאת בערוץ הפתוח. לכן לא די לבדוק את הכתובת הסופית; צריך להבין מה קרה לפני תחילת התקשורת.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_02112025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q141.html"},{"id":"Q142","year":"2025","stem":"בצופן החלפה מונואלפבתי של השפה האנגלית (בה יש 26 אותיות), תוקף יודע שבciphertext מסויים האות X בciphertext מחליפה את האות Y בplaintext. כמה מפתחות ישנם שיכולים להתאים (מתוך מרחב המפתחות שהיה אם התוקף לא היה יודע את המידע הזה)?","options":["25!","26!","26","26!-2"],"note":"","sources":[{"file":"2025/689156_02112025_0 (5).pdf","date":"02/11/2025","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.287,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-14-10\" data-doc=\"original-14\" data-body-words=\"402\"><h2>שאלה 10 — מרחב מפתחות של צופן החלפה</h2><div class=\"answer-body\">\n<p><strong>א — 25!.</strong> מפתח הוא תמורה של 26 אותיות, כלומר 26! מפתחות. קיבוע המיפוי Y→X משאיר התאמה חד־חד־ערכית בין 25 אותיות הקלט ל־25 אותיות הפלט שנותרו, ולכן 25!. ב מתעלמת מהמידע; ג סופרת רק בחירת אות; ד מפחיתה שתי תמורות בלבד במקום לקבע מיפוי שלם. היחס הוא 26!/25!=26.</p>\n<h3>מפתח כפעולה על האלפבית</h3>\n<p>בצופן החלפה כל אות גלויה מקבלת אות פלט לפי מפתח. כאשר המפתח הוא תמורה מלאה, כל אות קלט ממופה לאות פלט אחרת, ואין שתי אותיות קלט שמתמזגות לאותה אות פלט. תכונת החד־חד־ערכיות היא שמאפשרת לפענח ללא עמימות. לכן יש להבחין בין מספר אותיות האלפבית לבין מספר המפתחות האפשריים: המפתח קובע את כל הטבלה, ולא רק בחירה של אות אחת.</p>\n<p>ספירת תמורות נעשית באמצעות כלל הכפל. לאות הראשונה יש מספר אפשרויות השווה לגודל האלפבית, לשנייה אפשרות אחת פחות, וכן הלאה עד האפשרות האחרונה. אם כבר ידוע מיפוי מסוים, מסירים מן החישוב את אות הקלט ואת אות הפלט שנקבעו. כל המיפויים הנותרים עדיין צריכים להיות התאמה חד־חד־ערכית. משום כך מידע על מיפוי אחד אינו פשוט מחסיר מספר קטן של מפתחות מתוך הרשימה המקורית, אלא מקבע אילוץ המתקיים רק בחלק ממנה.</p>\n<h3>הזזה קבועה לעומת תמורה כללית</h3>\n<p>צופן קיסר הוא מקרה מצומצם במיוחד של החלפה, שבו לכל האותיות מופעל אותו מרחק הזזה באלפבית. אפשר לייצג אות במספר, להוסיף את ההזזה ולצמצם מודולו גודל האלפבית. הצמצום הוא שמחזיר אותיות שעברו את סוף האלפבית לתחילתו. כאשר שאלה מתייחסת לקיסר הקלאסי, אין לבחור הזזה חדשה כרצוננו כדי להתאים לאחת החלופות; צריך להשתמש בהזזה שנקבעה בהגדרת הצופן.</p>\n<p>דרך טובה לבדוק פלט מוצע היא לחשב את ההפרש בכל מיקום. אם אות אחת דורשת הזזה מסוימת ואות אחרת דורשת הזזה אחרת, הפלט אינו תוצאת אותו צופן הזזה. אין צורך לנחש מילה שנראית סבירה, משום שהמבחן הוא מתמטי ונקבע אות אחר אות. גם סדר החישוב ואופן ספירת האות הראשונה צריכים להיות עקביים: שינוי בין מספור מאפס למספור מאחד בלי התאמת הנוסחה גורם לטעות קבועה. הצפנים האלה מדגימים מושגים של מפתח ומרחב מפתחות, אך אינם מספקים ביטחון מודרני; תדירויות, חזרות ומספר קטן של אפשרויות מאפשרים לתקוף אותם. ידיעת קטע מן המיפוי או מן המסר מצמצמת עוד יותר את אי־הוודאות.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אם התוקף מכיר זוג של אות גלויה ואות מוצפנת בצופן הזזה, הוא יכול להסיק את ההזזה ולבדוק אותה על כל יתר הטקסט. בצופן תמורה כללי אותו זוג חושף רק מיפוי אחד ואינו קובע את היתר. ההבדל הזה מחדד מדוע מרחבי המפתחות שונים מאוד למרות שבשניהם מחליפים אות באות. לא כל כלל שנכון למשפחה מצומצמת חל על כל צפני ההחלפה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_02112025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q142.html"},{"id":"Q143","year":"2025","stem":"להלן פסאודו-קוד המציג פונק׳ המטפלת בצורה קריפטוגרפית במידע:\n```\nfunction foo(key_encryption, key_mac, ciphertext):\n    (plaintext, received_tag) = Decrypt(key_encryption, ciphertext)\n    computed_tag = ComputeMAC(key_mac, plaintext)\n    if computed_tag != received_tag:\n        return \"Invalid!\"\n    else:\n        return plaintext\n```\nמהי השיטה בשימוש על פי פסאודו-קוד זה?","options":["MAC then Encrypt","Encrypt then MAC","Encrypt and MAC","RSA"],"note":"","sources":[{"file":"2025/689156_30112025_0 (3).pdf","date":"30/11/2025","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.361,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-24-01\" data-doc=\"original-24\" data-body-words=\"395\"><h2>שאלה 1 — קוד פענוח עם תג פנימי</h2><div class=\"answer-body\">\n<p><strong>א — MAC then Encrypt.</strong> המפענח מוציא מן ciphertext זוג (plaintext,tag), ואז מחשב MAC על plaintext. לכן השולח תייג את המסר ואז הצפין את המסר והתג יחד. ב הייתה בודקת תג על ciphertext לפני הפענוח; ג הייתה שולחת תג נפרד על המסר; ד RSA אינו שם של סדר שילוב MAC והצפנה.</p>\n<h3>מה מתויג ומה מוצפן</h3>\n<p>כדי לסווג שילוב של הצפנה ותיוג צריך לענות על שתי שאלות: על איזה רצף בתים מחושב התג, והאם התג עצמו נמצא בתוך ההצפנה או לצידה. סדר שורות בקוד אינו מספיק, משום ששולח יכול לבצע חישובים עצמאיים בסדר כלשהו ולהישאר באותה בנייה קריפטוגרפית. החלק החשוב הוא מבנה התוצאה שהמקבל מקבל ואילו בדיקות עליו לבצע כדי לקבל בחזרה הודעה מאומתת.</p>\n<p>כאשר מצפינים ואז מתייגים, התג מחושב על התוכן המוצפן. המקבל יכול לבדוק את תקינות הקלט עוד לפני שפענח אותו. כאשר מתייגים ואז מצפינים, התג מחושב על המסר הגלוי ונכנס יחד איתו לתוך ההצפנה. המקבל חייב תחילה לפענח כדי לחלץ את שני החלקים, ורק אז הוא יכול לחשב תג ולבדוק התאמה. בבנייה השלישית מצפינים את המסר ובנפרד שולחים תג על המסר הגלוי; התג נמצא מחוץ להצפנה אך אינו מאמת ישירות את התוכן המוצפן.</p>\n<h3>קריאת קוד המקבל והשלכות אבטחתיות</h3>\n<p>קוד פענוח מספק בדרך כלל דרך פשוטה לזהות את הבנייה של השולח. אם השורה הראשונה מחשבת או בודקת תג של הטקסט המוצפן, מדובר במסלול של תיוג אחרי הצפנה. אם הפענוח מחזיר זוג של מסר ותג, ברור שבצד השולח שני אלה הוצפנו יחד. אם התג התקבל בנפרד ונבדק מול המסר המפוענח, זהו מסלול נפרד של הצפנה ותיוג. ההבחנה נקבעת לפי זרימת המידע, ולא לפי דמיון מילולי בין שמות האפשרויות.</p>\n<p>הצפנה לבדה נועדה לסודיות ואינה מתחייבת לזהות שינוי עוין. תיוג מוסיף שלמות ואימות מול מי שאינו מכיר את המפתח. עם זאת אין להסיק שכל חיבור שרירותי שלהם בטוח: טיפול שונה בשגיאות פענוח, חשיפת פרטי ריפוד או שימוש לא מתאים באותם מפתחות יכולים לפתוח ערוצי תקיפה. בתכנון מסודר מגדירים גם איך נמסר הווקטור ההתחלתי, על אילו שדות מחושב התג ומתי בודקים אותו. זיהוי שם הבנייה בשאלה אינו אישור אוטומטי לכל מימוש אפשרי שלה, אלא תיאור מדויק של היחס בין הפעולות והנתונים.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בעת העברת התג והטקסט המוצפן יש להגדיר גם את דרך הפרדת השדות. אם שני פורמטים שונים מתפרשים כאותו רצף בתים מאומת, עשוי להיווצר בלבול למרות שימוש בפרימיטיבים תקינים. לפיכך תיאור בנייה מלא כולל מבנה מסר חד־משמעי, מפתחות מתאימים וכללי דחייה. בשאלון זרימת הנתונים מספיקה לסיווג, אך היא אינה תחליף למפרט כזה במימוש אמיתי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_30112025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q143.html"},{"id":"Q144","year":"2025","stem":"ב TLS , נתון כי תוקף Man in the middle החליף את תעודת השרת שנשלחה אל הלקוח בתעודה חוקית, אך של אתר אחר (כלומר עם דומיין שונה מהדומיין של השרת), וצירף chain of trust תקין. מה השלב המוקדם ביותר שזה יתגלה?","options":["מיד לאחר שה ServerHello הגיע ללקוח","מיד לאחר שה ClientHello הגיע לשרת","מיד לאחר שה ClientFinish הגיע לשרת","מיד לאחר שה ClientKeyExchange הגיע לשרת"],"note":"","sources":[{"file":"2025/689156_30112025_0 (3).pdf","date":"30/11/2025","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"TLS / HTTPS","topic_score":0.299,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-24-02\" data-doc=\"original-24\" data-body-words=\"376\"><h2>שאלה 2 — תעודה חוקית לדומיין אחר</h2><div class=\"answer-body\">\n<p><strong>א — בשלב קבלת ואימות הודעות השרת, המסומן כאן ״לאחר ServerHello״.</strong> שרשרת אמון תקינה אינה מספיקה: שם השרת המבוקש חייב להתאים לשמות בתעודה. ב קודמת לקבלת התעודה; ג וד מאוחרות ללא צורך. דיוק: ב־TLS 1.2 התעודה היא הודעת Certificate נפרדת אחרי ServerHello; אין לגלות את השינוי מתוך ServerHello לבדו. א היא האפשרות המכוונת לשלב הודעות השרת במודל השאלה.</p>\n<h3>חלוקת התפקידים בהקמת הערוץ</h3>\n<p>בתחילת החיבור הלקוח והשרת עדיין אינם חולקים את מפתחות התעבורה החדשים. הלקוח פותח במשא ומתן על פרמטרים, השרת בוחר מבין האפשרויות המותרות ומציג אמצעי אימות מתאים, ובהמשך הצדדים מפיקים סוד משותף וממנו מפתחות. בהקשר מבוסס תעודות הלקוח בודק שהמפתח שהוצג קשור לשם האתר שאליו התכוון להגיע וששרשרת החתימות מובילה לשורש אמין. קיום חתימה חוקית כשלעצמו אינו מספיק אם התעודה שייכת לאתר אחר או אם אינה בתוקף.</p>\n<p>בשאלות המתארות חילוף מפתחות באמצעות הצפנה במפתח ציבורי של השרת, הלקוח יוצר סוד ראשוני ומצפין אותו כך שרק בעל המפתח הפרטי יוכל לפענחו. זהו מסלול היסטורי, ואין להשליך ממנו שכל חיבור מודרני פועל כך. בחילוף מפתחות זמני מבוסס דיפי–הלמן, מפתח התעודה משמש לאימות פרמטרים והסוד אינו מועבר באותה הצפנת מפתח ציבורי. להבחנה יש משמעות כאשר מפתח התעודה נגנב לאחר הקלטת התקשורת.</p>\n<h3>תמליל מאומת וגזירת מפתחות</h3>\n<p>בסוף הקמת החיבור הצדדים בודקים ערכים התלויים בתמליל הודעות ההקמה ובסודות שהפיקו. כך ניתן לזהות תוקף שהחליף הודעה בדרך גם אם היא נראית תקינה מבחינת התחביר. אם כל צד זוכר תמליל אחר, ערכי האימות אינם תואמים. שינוי שהורס תחביר או מונע הסכמה יכול כמובן לגרום לכשל מוקדם יותר, ולכן יש להבחין בין זיהוי אפשרי לבין זיהוי קריפטוגרפי מובטח בשלב האימות.</p>\n<p>מספרים אקראיים והקשר ההקמה נכללים בגזירת המפתחות כדי להבחין בין חיבורים ולהקטין שימוש חוזר בלתי רצוי בחומר מפתחות. נגזרים מפתחות נפרדים לכיווני התעבורה; באותו כיוון הצד המצפין והצד המפענח משתמשים בסוד הסימטרי המתאים. לאחר ההקמה אין צורך להצפין כל הודעת יישום בעזרת המפתח הציבורי שבתעודה. ההצפנה הסימטרית מגינה על התעבורה, ואימות השלמות מונע שינויים שקטים. כל זאת עדיין תלוי בבדיקה נכונה של זהות השרת ובהגנת המפתחות.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>יש גם להבחין בין מפתח ארוך־טווח שמזהה אתר לבין מפתח זמני של חיבור מסוים. תעודה יכולה לשמש חיבורים רבים, בעוד מפתחות תעבורה חדשים מופקים בכל הקמה מתאימה. לכן ידיעת תעודה ציבורית אינה ידיעת מפתח הפענוח של הסשן. חזרה של תעודת האתר בחיבורים שונים אינה כשלעצמה שימוש חוזר באותו מפתח הצפנה סימטרי לתוכן המשתמשים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_30112025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q144.html"},{"id":"Q145","year":"2025","stem":"מהי הטענה הנכונה?","options":["מנגנון ה Same Origin Policy לא מונע התקפות CSRF (כלומר, עדיין ייתכנו התקפות CSRF)","ב Dom based XSS הקוד הפגיע (הקוד עם החולשה) מורץ בdatabase","ב Dom based XSS הקוד הפגיע (הקוד עם החולשה) מורץ בשרת","מנגנון ה Same Origin Policy מונע Reflected XSS אך לא מונע Dom based XSS"],"note":"","sources":[{"file":"2025/689156_30112025_0 (3).pdf","date":"30/11/2025","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.333,"exam_count":1,"in_sample_exam":false,"variant_group":"V13","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-24-03\" data-doc=\"original-24\" data-body-words=\"390\"><h2>שאלה 3 — SOP ו־CSRF</h2><div class=\"answer-body\">\n<p><strong>א — SOP אינו מונע CSRF.</strong> הוא מגביל קריאת מידע בין מקורות, אך אינו חוסם כל שליחת טופס/בקשה עם הרשאות דפדפן. ב וג שגויות: בקוד DOM-based XSS החולשה נמצאת בצד הדפדפן, לא במסד ולא בשרת. ד שגויה משום ש־SOP אינו מונע reflected XSS.</p>\n<h3>ההבחנה בין שליחת בקשה לקריאת תשובה</h3>\n<p>מדיניות המקור הזהה מגבילה יכולת של קוד שמגיע ממקור אחד לקרוא מידע רגיש של מקור אחר. מקור מוגדר לפי סכימה, שם מארח ופורט, ולא רק לפי הופעת שם דומה בכתובת. לדוגמה, קוד באתר תוקף אינו רשאי לקבל את תוכן עמוד החשבון באתר בנק רק מפני שהמשתמש מחובר לשניהם באותו דפדפן. בלי הפרדה כזאת כל אתר שהמשתמש פותח היה יכול לנסות לקרוא מידע מכל שירות שבו נשמרה הרשאה.</p>\n<p>עם זאת, הדפדפן מאפשר פעולות רבות שחוצות מקורות כחלק רגיל מהאינטרנט: הצגת תמונה, ניווט ושליחת טופס הם דוגמאות מרכזיות. מכאן נובע ההבדל בין היכולת לגרום לבקשה לצאת לבין היכולת לקרוא את תשובתה. תוקף עשוי לא להיות מסוגל לראות את גוף התגובה ובכל זאת להצליח לגרום לפעולה שמשנה מצב בשרת. תשובה ריקה אף מדגישה שלא תמיד יש צורך לגנוב מידע כדי לגרום נזק.</p>\n<h3>מדוע נדרשת הגנה נפרדת על פעולות רגישות</h3>\n<p>כאשר עוגיית כניסה נשלחת אוטומטית בבקשה, השרת יודע לאיזה סשן הבקשה שייכת, אך אינו יודע בהכרח אם המשתמש התכוון להפעיל אותה. אתר תוקף יכול לגרום לדפדפן לבקר בכתובת פעולה או להגיש טופס. טוקן אקראי הקשור לסשן, בדיקת הקשר מקור והגבלת עוגיות בין אתרים מספקים שכבות אימות נוספות. עצם השימוש בעוגיות או בשיטת בקשה מסוימת אינו הוכחה שהפעולה יזומה ומותרת.</p>\n<p>המדיניות גם אינה מונעת קוד שכבר רץ בתוך המקור הפגיע מלקרוא את תוכנו. בהזרקת סקריפט מוצלחת התוקף אינו מבקש לקרוא מבחוץ; הוא גרם לאתר עצמו להריץ את הקוד שלו. לכן טענה שהפרדה בין מקורות פותרת סוג מסוים של הזרקת סקריפט ומותירה רק סוג אחר אינה נכונה כעיקרון כללי. מאידך, קוד רגיל באתר זר שמנסה לקרוא ישירות עוגייה או תגובה של האתר האחר אכן אמור להיחסם, אלא אם ניתנה הרשאה מתאימה. שיטת הניתוח היא תמיד לזהות את מקור הקוד, את משאב היעד ואת הפעולה המדויקת: קריאה, טעינה או שליחה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>גם לשם אתר ולמושג מקור יש גבולות שונים ממושג אתר בהגדרת עוגיות. לפיכך שתי כתובות שנראות קשורות ארגונית עשויות להיות מקורות שונים, והחלפת פורט או סכימה יכולה לשנות את כללי הקריאה. בשאלון משתמשים במקרים הפשוטים כדי להדגיש את ההבדל בין מקורות, אבל במימוש יש לחשב את המקור המדויק ולא להסתפק בבדיקת קטע משותף בשם.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_30112025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q145.html"},{"id":"Q146","year":"2025","stem":"מוצע הפרוטוקול הבא, הנועד לבצע אימות לקוח מול שרת על גבי חיבור tcp רגיל:\n- לקוח שולח לשרת את השם משתמש שלו (Username) ואת תוצאת ביצוע hash על השרשור של שם המשתמש של הלקוח והסיסמא של הלקוח, כלומר:\nHash(Username || Password)\n- השרת משווה את ערך hash שהלקוח שלח למה ששמור אצלו בבסיס הנתונים, ואם הערכים זהים, הלקוח מאומת. מהי הטענה הנכונה ביחס לפרוטוקול זה?","options":["הפרוטוקול המוצע פגיע לתוקף Eavesdropper","אין בעיה אבטחתית בפרוטוקול המוצע","הפרוטוקול המוצע אינו פגיע לתוקף Eavesdropper אך פגיע לתוקף MitM","הפרוטוקול המוצע בטוח בתנאי שמשתמשים בפונק׳ hash בטוחה קריפטוגרפית, למשל, SHA256"],"note":"","sources":[{"file":"2025/689156_30112025_0 (3).pdf","date":"30/11/2025","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.17,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-24-04\" data-doc=\"original-24\" data-body-words=\"418\"><h2>שאלה 4 — אימות עם hash סטטי על TCP</h2><div class=\"answer-body\">\n<p><strong>א — פגיע למאזין.</strong> המאזין מקליט Username ו־H(Username||Password), ואז מתחבר מחדש ומשדר את אותו זוג. הוא אינו צריך לפענח את ה־hash: ערך ה־hash עצמו הוא credential הניתן לשימוש חוזר. ב שגויה בשל replay; ג שוללת בטעות יכולת של מאזין; ד לא נפתרת באמצעות SHA256 כי הבעיה בפרוטוקול, לא בחולשת hash. nonce/אתגר וערוץ מאומת משנים את המצב.</p>\n<h3>ערך סודי שקול לסיסמה גם אם שמו גיבוב</h3>\n<p>שליחת גיבוב של סיסמה במקום הסיסמה עצמה עשויה להסתיר את תווי הסיסמה, אך אינה מבטיחה שפרוטוקול האימות בטוח. אם השרת מקבל תמיד אותו ערך כראיה מספקת לכניסה, אותו ערך נעשה אמצעי הרשאה שאפשר להשתמש בו מחדש. מאזין יכול להקליט את הבקשה הלגיטימית ולשלוח אחר כך את אותם בתים, בלי להבין כיצד נוצרו ובלי לשחזר את הסיסמה המקורית.</p>\n<p>לכן יש להבחין בין עמידות לפענוח או לניחוש לבין מניעת שידור חוזר. פונקציית גיבוב חזקה יכולה למנוע חיפוש יעיל של קדם־תמונה ובכל זאת לא לשנות את העובדה שהשרת משווה רק לערך סטטי. אפילו הכללת שם המשתמש בחישוב אינה מוסיפה טריות, כי גם השם נשאר זהה בכל כניסה לאותו חשבון. היא עשויה לקשור את הערך לחשבון, אך אינה קושרת אותו לניסיון הכניסה המסוים.</p>\n<h3>מה התוקף יודע ואילו שינויים אכן עוזרים</h3>\n<p>מודל מאזין פסיבי מתאר את יכולתו בעת צפייה בתקשורת; אין פירוש הדבר שאינו יכול בעתיד לנסות להתחבר כלקוח ולשלוח ערך שלמד. אם הוא רואה את שם המשתמש ואת ערך האימות הקבוע, ניסיון ההתחברות החוזר אינו דורש שליטה בנתיב של הלקוח המקורי. אין צורך להמתין להתנגשות, לזייף חתימה או למצוא פרצה בפונקציית הגיבוב.</p>\n<p>פרוטוקול אתגר־מענה יכול לדרוש תג המחושב גם על אתגר טרי של השרת ועל הקשר החיבור. השרת בודק שהאתגר נוצר עבור ניסיון זה ולא כבר נצרך. כך תג שהוקלט קודם אינו בהכרח תקף לאתגר הבא. ערוץ מוצפן ומאומת מונע מן המאזין ללמוד את ערך האימות מלכתחילה, אך יש להקים אותו מול הזהות הנכונה ולהגדיר את מדיניות האימות בו באופן מסודר.</p>\n<p>שמירת סיסמאות עם ערך המלחה פותרת בעיה שונה: היא מקשה על תקיפה בעקבות גניבת מסד נתונים. אין להניח שהגנה על האחסון הופכת כל תמליל כניסה למוגן, ולהפך. בשאלה צריך לעקוב אחר הערך שיוצא לרשת ולשאול האם השרת דורש דבר שהשתנה בין שתי כניסות. אם לא, החלפת שם הגיבוב או בחירת גרסה חזקה יותר אינה מטפלת בכשל הפרוטוקולי.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אפשר לתאר את הבדיקה הפשוטה ביותר של הפרוטוקול כהשוואת שתי כניסות עוקבות: אם המשתמש אינו משנה סיסמה, האם כל ערכי האימות הנשלחים זהים? אם כן, תוקף שכבר ראה כניסה מוצלחת מחזיק במועמד ברור לשידור חוזר. כדי לדחות אותו השרת צריך מידע נוסף על טריות, ולא רק פונקציה חזקה יותר שמייצרת שוב בדיוק את אותו ערך קבוע.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_30112025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q146.html"},{"id":"Q147","year":"2025","stem":"איזו מבין הטענות הבאות נכונה?","options":["בביטקוין, לא משתמשים ב One Time Pad בכדי לייצר את הארנקים","בביטקוין, חובה לכרות ביטקוין בעצמנו אם אנחנו רוצים לבצע עסקאות בביטקוין","ב escrow transactions, המוכר חייב לאשר את העסקה כדי שהיא תהיה חוקית","בביטקוין, מנגנון ה escrow transactions מחייב כל miner ״לנעול״ בערבון מספיק ביטקוין מראש כך שאם ייתפס שהminer איפשר לתוקף לבצע double spending ינקו את הקנס מהערבון של ה miner."],"note":"","sources":[{"file":"2025/689156_30112025_0 (3).pdf","date":"30/11/2025","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.319,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-24-05\" data-doc=\"original-24\" data-body-words=\"384\"><h2>שאלה 5 — טענה על ביטקוין</h2><div class=\"answer-body\">\n<p><strong>א — אין שימוש ב־OTP לייצור ארנקים.</strong> ארנק מסתמך על מפתחות חתימה ויצירה/גזירה של סודות, לא על הצפנת one-time pad. ב: אפשר לקבל ולהוציא מטבעות בלי לכרות. ג: במנגנון escrow כללי התנאים נקבעים בסקריפט, למשל 2-of-3, ואין כלל שהמוכר לבדו חייב לאשר בכל מסלול. ד: אין ערבון חובה לכורים שנחתך בעת double spending בביטקוין.</p>\n<h3>חוקיות עסקאות לעומת הכרעה על סדר ההיסטוריה</h3>\n<p>עסקת ביטקוין מנסה להוציא פלטים קיימים ולהגדיר פלטים חדשים. הצמתים בודקים בין היתר שהפלטים הנצרכים קיימים, שלא נצרכו כבר בהיסטוריה הרלוונטית, שתנאי הפדיון מתקיימים ושהסכומים עומדים בכללי הפרוטוקול. חתימה תקינה מוכיחה הרשאה להשתמש בפלט מסוים, אך אינה פותרת לבדה מצב שבו בעל המפתח חתם על שתי עסקאות סותרות. לשתי עסקאות יכולות להיות חתימות תקינות, בעוד שאי אפשר לקבל את שתיהן באותה היסטוריה תקפה.</p>\n<p>הקונצנזוס מספק דרך להכריע איזו היסטוריה תיחשב פעילה כשיש ענפים מתחרים. כורים אוספים עסקאות לבלוק מועמד ומחפשים כותרת שעומדת ביעד הוכחת העבודה. צמתים המקבלים בלוק אינם צריכים לסמוך על הכרזת הכורה: הם מחשבים ובודקים את העבודה ואת חוקיות התוכן בעצמם. כורה רשאי לבחור מבין עסקאות תקינות, ואין כלל בסיסי שמחייב אותו לבחור דווקא את בעלות העמלות הגבוהות ביותר.</p>\n<h3>אישורים, הסתעפויות והיעדר סמכות מרכזית</h3>\n<p>שני כורים יכולים למצוא בלוקים קרובים בזמן ולגרום להסתעפות זמנית. בהמשך מתווספת עבודה לאחד הענפים, והצמתים מעדיפים את השרשרת התקפה בעלת העבודה המצטברת המרבית. אישורים נוספים מגדילים את העבודה שתידרש כדי להחליף את העסקה בהיסטוריה מתחרה. זו הגנה התלויה בהנחות על כוח התוקף ועל תנאי הרשת, ולא משפט שלפיו ארגון מחדש בלתי אפשרי לאחר מספר קבוע של בלוקים.</p>\n<p>לא נדרש שרת מרכזי שיחתום על כל בלוק שהתקבל, ולא נדרש מכל משתמש לכרות כדי לבצע עסקה. הארנק מנהל מפתחות וחתימות, הכורים מציעים סדר באמצעות בלוקים, והצמתים מאמתים באופן עצמאי. אין גם מנגנון כללי שבו כורה חייב להפקיד ערבון שנחתך בגלל הוצאה כפולה; רעיון כזה שייך לתכנונים אחרים ואינו הבסיס המתואר כאן. עצי מרקל מאפשרים לחייב אוסף עסקאות ולהוכיח הכלה ביעילות, אך אינם מצפינים אותן ואינם מחליפים את בדיקות החוקיות. ההפרדה בין התפקידים מונעת בלבול בין פרטיות, הרשאה, הוכחת עבודה וקונצנזוס.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בעת שינוי כללי הרשת צריך לבדוק גם תאימות בין צמתים שכבר עודכנו לבין צמתים ישנים. כלל חדש שמקבל בלוקים שנדחו בעבר עלול ליצור שרשראות שכל קבוצה מקבלת אחרת. כלל מצמצם בלבד יכול לאפשר תאימות מסוג אחר. לכן סיווג שינוי נקבע לפי קבוצת הבלוקים החוקיים ולא לפי השאלה אם ההצעה נשמעת מועילה, מהירה או חדשנית.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_30112025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q147.html"},{"id":"Q148","year":"2025","stem":"עבור n=23 ו g=3, אליס ובוב הריצו את פרוטוקול דיפי הלמן. במהלך הרצת הפרוטוקול, אליס שלחה לבוב את המספר 13 ובוב שלח לה את המספר 4. מה מהבאים יכול להיות המספר הסודי המשותף שנבחר בסוף התהליך?","options":["12","18","17","10"],"note":"","sources":[{"file":"2025/689156_30112025_0 (3).pdf","date":"30/11/2025","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"דיפי-הלמן והחלפת מפתחות","topic_score":0.558,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-24-06\" data-doc=\"original-24\" data-body-words=\"383\"><h2>שאלה 6 — דיפי–הלמן עם g=3,n=23</h2><div class=\"answer-body\">\n<p><strong>א — 12.</strong> מחפשים a,b כך ש־3ᵃ≡13 ו־3ᵇ≡4 mod 23. למשל a=5,b=3: 3⁵=243≡13, 3³=27≡4. לכן K=4⁵ mod23=1024 mod23=12; גם 13³=2197≡12. החבורה שנוצרת כאן מסדר 11, ולכן מעריכים השקולים מודולו 11 נותנים אותו סוד. ב 18, ג 17 וד 10 אינם תוצאת החישוב.</p>\n<h3>איך נוצר סוד משותף בלי לשלוח אותו</h3>\n<p>בחילוף המפתחות הנדון שני הצדדים מסכימים על קבוצה מתמטית, בסיס ומודולוס. כל צד בוחר מעריך פרטי, מעלה את הבסיס בחזקה שלו ושולח רק את התוצאה הציבורית. לאחר מכן הוא מעלה את הערך שקיבל בחזקת הסוד הפרטי שלו. חוקי החזקות מבטיחים ששני הצדדים יגיעו לאותו ערך, משום שכפל המעריכים מתחלף. התמליל הציבורי כולל אפוא את הבסיס ושני ערכי החזקה, אך אינו כולל במפורש את שני המעריכים או את הסוד המשותף.</p>\n<p>בשאלות מספריות קטנות אפשר למצוא את המעריך המתאים לערך ציבורי באמצעות טבלת חזקות. אין כאן סתירה לביטחון העקרוני: המודולוסים הזעירים נבחרו כדי לאפשר חישוב בבחינה, ולא כדי לייצג פרמטרים בטוחים. אחרי שמוצאים מעריכים אפשריים, מחשבים את הסוד בשתי דרכים ובודקים התאמה. ריבועים חוזרים וצמצום השארית בכל צעד מקטינים את המספרים ומאפשרים לתפוס שגיאת חשבון לפני בחירת האפשרות.</p>\n<h3>הנחת הקושי לעומת אימות הזהויות</h3>\n<p>בעיית הלוגריתם הדיסקרטי שואלת כיצד לשחזר מעריך מתוך הבסיס ותוצאת החזקה. חישוב הסוד המשותף ישירות מתוך שני ערכים ציבוריים מנוסח באמצעות הנחת קושי קשורה, שאינה זהה בכל קבוצה מתמטית. במסגרת השאלון הייחוס ללוגריתם דיסקרטי הוא ההבחנה המבוקשת מול צפנים קלאסיים או מנגנוני קונצנזוס. בפרוטוקול מעשי צריך גם לבדוק את תקינות ערכי הקלט, לבחור קבוצה מתאימה ולהפיק מן הסוד מפתחות באמצעות פונקציית גזירה.</p>\n<p>המתמטיקה לבדה אינה מאמתת עם מי הוחלפו הערכים. תוקף פעיל יכול להציב ערך ציבורי משלו מול כל צד, ליצור שני סודות שונים ולתווך בין הצדדים. לעומת זאת, מאזין פסיבי שאינו משנה הודעות אינו יכול לבצע החלפה כזאת. לכן בתרחיש שמגביל במפורש את התוקף להאזנה, אין לפסול את השיטה רק מפני שהיא פגיעה לתוקף פעיל חזק יותר. כשנדרש אימות אפשר לחתום על ערכי ההחלפה והקשרם או להשתמש במנגנון מאומת אחר. יש להפריד בכל תשובה בין סודיות מול מאזין, חישוב הסוד המספרי והבטחת זהות הצד האחר.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אם מוצאים כמה מעריכים שמניבים אותו ערך ציבורי בקבוצה הקטנה, אין לבחור ביניהם לפי מראית עין. הם יכולים להיות שקולים לפי סדר תת־הקבוצה שנוצרת מן הבסיס, ולכן לייצר אותו סוד משותף. החישוב צריך להיעשות בתוך הקבוצה והמודולוס הנתונים. לא מחברים את הערכים הציבוריים זה לזה ולא מתייחסים לאחד מהם אוטומטית כאל המפתח הסופי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_30112025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q148.html"},{"id":"Q149","year":"2025","stem":"איזה טענה אינה נכונה?","options":["מנגנון Signed Certificate Timestamp (SCT) נועד לפתור בעיית פרטיות הקיימת במנגנון ה OCSP","מנגנון CT ומנגנון CRL פותרים בעיות שונות","מנגנון CT ומנגנון OCSP פותרים בעיות שונות","מנגנון CT בא לידי ביטוי בתעודות על ידי ערכי ה SCT"],"note":"","sources":[{"file":"2025/689156_30112025_0 (3).pdf","date":"30/11/2025","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.351,"exam_count":1,"in_sample_exam":false,"variant_group":"V09","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-24-07\" data-doc=\"original-24\" data-body-words=\"379\"><h2>שאלה 7 — הטענה שאינה נכונה על SCT</h2><div class=\"answer-body\">\n<p><strong>א — SCT אינו פתרון לפרטיות OCSP.</strong> SCT הוא הבטחה חתומה של CT log לכלול תעודה ביומן. הפחתת פניות דפדפן לשרת OCSP נעשית באמצעות stapling. ב וג נכונות כי CT עוסק בשקיפות הנפקה ו־CRL/OCSP בסטטוס ביטול. ד נכונה כתיאור נשיאת SCTs עם תעודה; קיימות גם דרכי מסירה אחרות.</p>\n<h3>מדוע שרשרת אמון אינה מספיקה לביקורת הנפקות</h3>\n<p>רשות מוסמכת יכולה להנפיק בטעות תעודה לדומיין שאינו שייך למבקש, או שמפתח שלה עלול להיות מנוצל לרעה. לקוח הבודק רק חתימות עשוי לראות תעודה בעלת שרשרת חוקית, אף שבעל הדומיין האמיתי כלל לא ביקש אותה. שקיפות תעודות מוסיפה יכולת תצפית ציבורית: התעודות והתחייבויות הרישום שלהן מופיעות ביומנים שאפשר לבדוק ולנטר. המטרה אינה להצפין את התעודה או להסתיר את זהות האתר, אלא לאפשר גילוי של הנפקות חריגות גם לאחר שעברו את בדיקת החתימות הרגילה.</p>\n<p>יש להפריד בין הרשות המנפיקה, היומן והמנטר. היומן מקבל תעודות ומנהל מבנה נתונים שניתן לביקורת. המנטר קורא רישומים ומחפש למשל תעודות חדשות עבור דומיינים שהארגון מנהל. בעל דומיין שרואה תעודה שלא הזמין יכול לפתוח בירור ולבקש טיפול. עצם העובדה שתעודה מופיעה ביומן אינה אומרת שהיומן אישר שהמבקש הוא בעל הדומיין; בדיקת הזכאות להנפקה היא אחריות נפרדת.</p>\n<h3>התחייבות חתומה, הוכחת הכלה וביטול</h3>\n<p>חותמת הזמן החתומה היא הבטחה של יומן מסוים לכלול את התעודה בהתאם לכלליו. חתימת היומן מאפשרת לדפדפן לזהות מי נטל את ההתחייבות ולוודא שלא שינו אותה. היא שונה מהוכחת הכלה בעץ מרקל, שמראה כי רשומה מסוימת כבר נכללה במצב מסוים של היומן. הוכחת עקביות נועדה להראות שהיומן גדל באמצעות הוספה ולא שכתב את עברו. מבני הנתונים האלה מאפשרים ביקורת יעילה גם בלי שכל לקוח יוריד כל רשומה.</p>\n<p>דפדפן יכול לדרוש התחייבויות מיומנים שהוא מכיר, בהתאם למדיניותו, ועדיין חייב לבדוק זהות דומיין, שרשרת אמון וזמני תוקף. מנגנוני ביטול כגון רשימות ביטול או תשובות סטטוס פותרים בעיה אחרת: תעודה שהייתה קיימת כעת אינה אמורה להתקבל. רישום פומבי אינו מוחק תעודה ואינו מונע לבדו שימוש במפתח שנגנב. לכן חלופה המחליפה שקיפות בביטול, או טוענת שחותמת היומן פותרת את פרטיות בירור הסטטוס, מבלבלת בין מנגנונים שונים.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>נניח שבעל אתר מגלה ביומן תעודה שהונפקה בשמו בלי ידיעתו. הממצא מאפשר לפתוח בירור מול המנפיק ולנקוט פעולות ביטול והחלפה, אך היומן אינו מתקן לבדו את ההנפקה. זהו ההבדל בין ראיה ציבורית שמסייעת לגילוי ולהרתעה לבין אמצעי אכיפה שמונע קבלת תעודה מסוימת. שני התפקידים משלימים זה את זה ונחוצים בזמנים שונים של הטיפול באירוע.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_30112025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q149.html"},{"id":"Q150","year":"2025","stem":"מה מבין הבאים היא ההגדרה של תכונת ה collision resistance? (שימו לב, השאלה מבקשת collision resistance ולא מבקשת weak collision resistance)","options":["It is hard to find messages m<sub>0</sub> ≠ m<sub>1</sub> such that h(m<sub>0</sub>) = h(m<sub>1</sub>)","Given a digest d of a random message, it is hard to find a message m such that d = h(m)","Given a random message m<sub>0</sub>, it is hard to find a message m<sub>1</sub> that is not equal to m<sub>0</sub> such that h(m<sub>0</sub>) = h(m<sub>1</sub>)","It is hard to find messages m<sub>0</sub> ≠ m<sub>1</sub> such that h(m<sub>0</sub>) ≠ h(m<sub>1</sub>)"],"note":"","sources":[{"file":"2025/689156_30112025_0 (3).pdf","date":"30/11/2025","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.352,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-24-08\" data-doc=\"original-24\" data-body-words=\"382\"><h2>שאלה 8 — הגדרת collision resistance</h2><div class=\"answer-body\">\n<p><strong>א — קשה למצוא כל זוג m₀≠m₁ עם h(m₀)=h(m₁).</strong> שתי ההודעות חופשיות לבחירת התוקף. ב היא קדם־תמונה; ג היא קדם־תמונה שנייה משום שאחת ההודעות נתונה; ד מבקשת hashes שונים ולכן אינה תכונת קושי רצויה. המילה weak בשאלה מבדילה מן ההגדרה שבה הודעה אחת קבועה.</p>\n<h3>שלוש בעיות חיפוש שונות</h3>\n<p>פונקציית גיבוב ממפה מסרים באורכים שונים לתוצאה באורך קבוע. מכיוון שיש יותר מסרים מתוצאות אפשריות, קיימים בהכרח מסרים שונים בעלי אותה תוצאה. דרישת האבטחה אינה שאין התנגשויות כלל, אלא שלא תהיה לתוקף דרך מעשית למצוא את ההתאמות המסוכנות הנדרשות בתקיפה. כדי להבין איזו תכונה נשאלת צריך קודם לשאול מה כבר ניתן לתוקף ומה הוא רשאי לבחור בעצמו.</p>\n<p>בעמידות לקדם־תמונה התוקף מקבל תוצאה ומנסה למצוא מסר שמגיע אליה. הוא אינו חייב למצוא דווקא את המסר המקורי; כל מסר בעל אותה תוצאה מספיק. בעמידות לקדם־תמונה שנייה התוקף מקבל מסר מסוים, וצריך למצוא מסר אחר בעל אותו גיבוב. בעמידות להתנגשויות שני המסרים נתונים לבחירתו, כל עוד יהיו שונים ויגיעו לאותה תוצאה. ההבדל בין קיבוע מסר אחד לבין בחירת שני מסרים מסביר מדוע שמות התכונות אינם ניתנים להחלפה.</p>\n<h3>קישור למקרה מעשי ולמסיחים</h3>\n<p>במערכת אימות סיסמאות, נתון חשבון מסוים עם ערך בדיקה שנוצר מסיסמה מסוימת. אם סיסמה שונה עוברת את אותה בדיקה תחת אותו ערך המלחה, שני קלטים שונים הובילו לאותו גיבוב. עצם האירוע הוא התנגשות; תקיפה מכוונת של החשבון הקבוע נוגעת לקדם־תמונה שנייה. הוספת ערך המלחה אינה מבטלת את האפשרות המתמטית להתנגשויות, אך מונעת שימוש באותו חישוב מוקדם עבור משתמשים רבים.</p>\n<p>לשם השוואה, מציאת שני מסרים עם תוצאות שונות היא פעולה קלה ורצויה. אם כמעט כל מסר היה מקבל אותה תוצאה, הפונקציה הייתה חסרת תועלת לזיהוי שינויים. גם יצירת מחרוזת תוצאה שונה מזו שניתנה אינה מעידה על קושי קריפטוגרפי. לכן חלופות שמחליפות את סימן השוויון באי־שוויון אינן וריאציה קטנה של ההגדרה אלא טענה אחרת לגמרי. מונחים מתחומים כגון תעודות, כפיית הצפנה או סוד נוסף באחסון סיסמאות עשויים להיות קשורים להגנה הכוללת, אך אינם מגדירים את בעיית החיפוש של הגיבוב עצמו. הבחירה הנכונה מבוססת על הקלט, יעד החיפוש ותנאי ההצלחה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אורך התוצאה משפיע על עלות התקיפות הכלליות: בחיפוש זוג חופשי קיימת תופעת יום ההולדת, שמאפשרת לפגוש התנגשות מוקדם יחסית לחיפוש קדם־תמונה של תוצאה קבועה. אין צורך לחשב את העלות המדויקת כדי לזהות את ההגדרה, אך העיקרון מסביר מדוע אסור להחליף בין שני סוגי החיפוש. חופש הבחירה של התוקף משנה את הבעיה גם באותה פונקציה עצמה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_30112025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q150.html"},{"id":"Q151","year":"2025","stem":"אלגוריתם 3DES יכול לתמוך אחורה בהצפנת DES. נתונים שלושה מפתחות K1, K2, K3. כיצד מוגדרת פעולת ההצפנה ב 3DES שתאפשר הצפנה גם עבור 3DES וגם תאפשר תמיכה אחורה בצופן DES המקורי?","options":["C = Enc<sub>K3</sub>(Dec<sub>K2</sub>(Enc<sub>K1</sub>(m)))","C = Dec<sub>K1</sub>(Enc<sub>K2</sub>(Enc<sub>K3</sub>(m)))","C = Dec<sub>K1</sub>(Dec<sub>K2</sub>(Dec<sub>K3</sub>(m)))","C = Enc<sub>K3</sub>(Dec<sub>K2</sub>(Dec<sub>K1</sub>(m)))"],"note":"","sources":[{"file":"2025/689156_30112025_0 (3).pdf","date":"30/11/2025","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.245,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-24-09\" data-doc=\"original-24\" data-body-words=\"395\"><h2>שאלה 9 — מבנה 3DES</h2><div class=\"answer-body\">\n<p><strong>א — C=E_K3(D_K2(E_K1(m))).</strong> זהו EDE. לתאימות DES מציבים K1=K2=K3=K; אז E_K(D_K(E_K(m)))=E_K(m). ב וד אינן שרשרת EDE בסדר המפתחות המבוקש, וג היא DDD. דיוק: גם חלק מהסידורים האחרים מתבטלים לצעד יחיד כשכל המפתחות שווים; תכונת התאימות לבדה אינה מגדירה באופן יחיד את האלגוריתם. א היא ההגדרה התקנית של 3DES EDE לפי סדר המפתחות הנתון.</p>\n<h3>הרכבת פעולות הפיכות</h3>\n<p>כאשר מפעילים צופן מספר פעמים, צריך לכתוב במפורש איזה מפתח משמש בכל שלב והאם הפעולה היא הצפנה או פענוח. פענוח הוא הפעולה ההפוכה להצפנה באותו מפתח, ולא שם אחר לאותו חישוב. לכן החלפת שלב אמצעי של הצפנה בפענוח משנה בדרך כלל את הפלט, אפילו אם מספר השלבים נשאר שלוש. מפתחות שונים אינם מאפשרים לבטל שתי פעולות סמוכות כאילו השתמשו באותו מפתח.</p>\n<p>במבנה התקני הנדון מפעילים תחילה הצפנה במפתח הראשון, אחריה פענוח בשני, ולבסוף הצפנה בשלישי. את סדר הביצוע קוראים מתוך הביטוי מבפנים החוצה: ההודעה היא קלט הפעולה הפנימית, והפלט שלה עובר לשלב הבא. כדי לפענח את התוצאה הופכים גם את הפעולות וגם את סדר השלבים. צורת קריאה זו חיונית למניעת טעות כששמות המפתחות מופיעים ברצף חזותי שונה מן הרצף הכרונולוגי.</p>\n<h3>תאימות לאחור ומה היא אינה מוכיחה</h3>\n<p>היתרון ההיסטורי של הכנסת פענוח באמצע הוא שאפשר להציב את אותו מפתח בשלוש העמדות ולקבל בסוף פעולה השקולה להצפנה יחידה בצופן המקורי. ההצפנה והפענוח הסמוכים באותו מפתח מבטלים זה את זה. זאת בדיקה אלגברית ולא תכונה של מסר מסוים, ולכן היא צריכה להתקיים לכל מסר מתאים ולכל מפתח שאפשר להשתמש בו.</p>\n<p>עם זאת, עצם הדרישה שתהיה אפשרות לצמצם הרכבה לצעד אחד אינה מייחדת כל כתיב אפשרי של שלוש פעולות. ניתן לבנות גם הרכבות אחרות עם ביטול כאשר כל המפתחות שווים. משום כך בשאלה המבקשת את הגדרת האלגוריתם נדרשת התאמה למבנה התקני ולסדר המפתחות, ולא רק בדיקת תאימות במצב מיוחד. מנגד, הטענה ששתי הרכבות שונות חייבות לתת תמיד אותו פלט אינה נובעת מהיותן בעלות אותה כמות מפתחות או שלבים. עוד יש להבחין בין מספר מפתחות נומינלי לבין רמת ביטחון בפועל, ובין מבנה הצופן לבין שיטת ההפעלה על הודעה ארוכה. הדיון כאן מסביר את ההרכבה ואת התאימות המבוקשות בבחינה, ואינו ממליץ להשתמש בצופן ההיסטורי למערכת חדשה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אפשר לנתח את ההרכבה גם באמצעות שמות ביניים: רושמים את תוצאת השלב הראשון, אחריה את תוצאת השני ולבסוף את השלישי. כאשר בודקים תאימות מציבים את המפתחות השווים רק לאחר כתיבת שלושת השלבים. סדר זה מונע ביטול של פעולות שאינן סמוכות או שמשתמשות במפתחות שונים. השיטה מועילה גם להבנת מסיחים שהחליפו רק מיקום של מפתח אחד.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_30112025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q151.html"},{"id":"Q152","year":"2025","stem":"נתון עץ מרקל המכיל 1000 עלים. אם נשנה רק עלה אחד בעץ, כמה קודקודים (צמתים) שאינם עלים ישתנו כתוצאה מכך?","options":["רק הצמתים בנתיב מהעלה שהשתנה ועד לשורש העץ (כולל) ישתנו","רק הצומת אב (הישירה בלבד) של העלה שהשתנה","כל הצמתים בעץ (שאינם עלים) חוץ מהשורש","כל הצמתים בעץ (שאינם עלים) כולל השורש"],"note":"","sources":[{"file":"2025/689156_30112025_0 (3).pdf","date":"30/11/2025","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.151,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-24-10\" data-doc=\"original-24\" data-body-words=\"401\"><h2>שאלה 10 — שינוי עלה בעץ מרקל</h2><div class=\"answer-body\">\n<p><strong>א — רק אבות העלה עד השורש, כולל השורש.</strong> כל צומת תלוי ב־hash של ילדיו. ענפים שאין בהם העלה נותרים עם אותם קלטים ולכן אותו hash; בכל רמה במסלול מעלה יש קלט שהשתנה. ב מתעלמת מהתפשטות השינוי; ג מוציאה בטעות את השורש; ד משנה גם ענפים בלתי תלויים. מדובר בהשפעה על התלות, ובהנחה שאין התנגשות hash; בעץ מאוזן כ־log₂1000≈10 צמתים פנימיים.</p>\n<h3>כיצד מחויבות לשורש נוצרת מן העלים</h3>\n<p>עץ מרקל הוא דרך לצמצם אוסף נתונים לערך קצר שמחייב את כל תוכנו. בעלים נמצאים ערכי גיבוב של פריטי המידע, וכל צומת פנימי מחושב מגיבוב של ערכי ילדיו לפי סדר מוגדר. חוזרים על הפעולה עד שמתקבל ערך יחיד בשורש. אם משנים פריט אחד, משתנה הגיבוב בעלה המתאים, ואז משתנים הקלטים של אביו ושל אבותיו עד השורש. ענף שאין בו את הפריט נשאר עם אותם קלטים, ולכן אינו צריך להשתנות.</p>\n<p>התלות הזאת מסבירה גם מה אינו מתקבל מן העץ: הנתונים אינם מוצפנים. מי שרואה את העסקאות יכול לקרוא אותן, ומי שרואה גיבוב אינו מקבל מכך הרשאה או הוכחה שמי שיצר עסקה היה מורשה. העץ מחייב סדר ואוסף נתונים ומאפשר להוכיח השתייכות אליהם. חוקיות העסקאות, חתימות הבעלים והסכמה על הבלוק הן בדיקות נוספות שמתקיימות במקום אחר במערכת.</p>\n<h3>בניית הוכחה יעילה ובדיקתה</h3>\n<p>כדי להוכיח עלה מסוים אין צורך לשלוח את כל העץ. מספיקים הנתון, הערכים של האחים לאורך הדרך לשורש ומיקומו של כל אח ביחס לצומת שכבר חושב. המקבל מחשב בכל רמה את גיבוב ההורה ומשווה בסיום לשורש שהוא כבר סומך עליו. אם השורש נמסר רק בידי אותו גורם לא אמין שמסר את ההוכחה, התוקף יכול להמציא עץ משלו; לכן מקור האמון בשורש הוא חלק הכרחי מן הפרוטוקול.</p>\n<p>בעץ בינארי מלא כל רמה מכפילה את מספר העלים שניתן להכיל, ולכן מספר ערכי ההוכחה גדל לוגריתמית ולא ביחס ישר למספר הפריטים. הכפלת מספר העלים מוסיפה רק רמה אחת. כאשר מספר העלים אינו חזקה של שתיים, נדרש כלל מוגדר לטיפול בעלה ללא אח או למבנה העץ, אך עדיין רק אבות הנתון תלויים בו. הטענה ששינוי בהכרח משנה גיבוב מניחה את מודל הביטחון של פונקציית הגיבוב: באופן מתמטי יכולה להיות התנגשות, אלא שבפונקציה מתאימה לא אמורה להיות לתוקף דרך מעשית לייצר אותה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בעת אימות הוכחה סדר הצירוף הוא מידע מהותי: גיבוב של ילד שמאלי ואחריו ימני אינו בהכרח שווה לגיבוב באותו סדר הפוך. לכן רשימת ערכי אחים בלי מיקומים או בלי דרך להסיק אותם אינה מספיקה בכל פורמט. במקרה הביטקוין גם כותרת הבלוק צריכה להיות קשורה לשרשרת שהלקוח מקבל, אחרת הוכחה נכונה לעץ מומצא אינה מועילה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_30112025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q152.html"},{"id":"Q153","year":"2026","stem":"אליס רוצה לשלוח הודעות לבוב, ושבוב יוכל לוודא ששתי הדרישות הבאות מתקיימות:\nא) ההודעה הגיעה אליו בדיוק כפי שאליס שלחה אותה. ב) אליס אכן חיברה את ההודעה. נתון שבוב ואליס כבר החליפו ביניהם בצורה מאובטחת את כל סוגי המפתחות הנדרשים לתהליך. מה תשלח אליס לבוב?","options":["את ההודעה + MAC על ההודעה.","את ההודעה + חתימה דיגיטלית בעזרת המפתח הפומבי של בוב.","את ההודעה מוצפנת במפתח הסימטרי המשותף ביניהם.","את ההודעה מוצפנת במפתח הפומבי של בוב."],"note":"","sources":[{"file":"2026/689156_01_12072026_0 (2).pdf","date":"12/07/2026","num":1}],"topic":"Hash, MAC וסיסמאות","topic_manual":true,"flags":[],"fixed_order":false,"exclude":false,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-13-01\" data-doc=\"original-13\" data-body-words=\"385\"><h2>שאלה 1 — אימות ושלמות הודעה</h2><div class=\"answer-body\">\n<p><strong>א — ההודעה ו־MAC עליה.</strong> בהנחת מפתח משותף סודי ו־MAC בטוח, שינוי בהודעה מתגלה והמקבל יודע שהתג נוצר בידי בעל המפתח. ב שגויה: חותמים במפתח הפרטי של השולח, לא במפתח הפומבי של בוב. ג וד מציעות הצפנה בלבד, שאינה מבטיחה שלמות ואימות מקור. MAC אינו הוכחה לצד שלישי שאליס לבדה חיברה את ההודעה, משום שגם בוב יודע את המפתח; במסגרת השאלה הוא מספק אימות בין הצדדים.</p>\n<h3>משמעות האימות ואופן הבדיקה</h3>\n<p>שלמות פירושה שהמקבל מסוגל לזהות שינוי בלתי מורשה בתוכן, ואותנטיות פירושה שיוך ההודעה למי שמחזיק בסוד המתאים. אלה תכונות נפרדות מסודיות: אפשר לפרסם הודעה לכל העולם ובכל זאת לוודא שלא שונתה ומי אישר אותה. בתהליך תיוג סימטרי הצדדים מחזיקים מפתח סודי משותף, השולח מפעיל פונקציית תיוג על המפתח ועל כל בתיה של ההודעה, והמקבל מחשב שוב את התג ומקבל רק אם הוא תואם לתג שנשלח. התוקף רשאי להכיר את האלגוריתם ואף לצפות בהודעות מתויגות רבות; הביטחון אמור לנבוע מחוסר ידיעת המפתח ולא מהסתרת שיטת החישוב.</p>\n<p>נניח שההודעה אומרת להעביר מאה שקלים, ומאזין מחליף אותה בהוראה להעביר תשע מאות. התג הישן חושב על רצף בתים אחר, ולכן בדיקת המקבל נכשלת. גם אם התוקף יודע לחשב גיבוב ציבורי, הוא אינו יכול להחליף אותו בתג תקף ללא המפתח. מסיבה זו גיבוב רגיל המצורף להודעה אינו מספק אותה הגנה: תוקף המשנה הודעה יכול פשוט לחשב מחדש את הגיבוב שלה.</p>\n<h3>מה אפשר להסיק ומה מחייב מנגנון נוסף</h3>\n<p>הבדיקה מעידה שההודעה אושרה בידי בעל המפתח, אך אינה מוכיחה למישהו חיצוני שרק השולח יכול היה ליצור אותה. גם המקבל יודע את המפתח ולכן מסוגל לייצר תג תקין. חתימה דיגיטלית משנה את חלוקת היכולות: החותם מחזיק מפתח פרטי, בעוד המאמתים מקבלים מפתח ציבורי שאינו מקנה יכולת חתימה. ההבחנה הזאת מסבירה מדוע אי־יכולת הכחשה דורשת חתימות ולא תג סימטרי בלבד. בשני המקרים צריך להגן על המפתחות ולקשור אותם לזהויות הנכונות. בנוסף, הודעה ישנה עם תג תקין נשארת תקינה מבחינה מתמטית; למניעת שידור חוזר יש לכלול מספר רצף, אתגר או מזהה פעולה ולבדוק אותם. התג אינו מצפין את התוכן, ולכן הצורך בסודיות מחייב שילוב מתאים עם הצפנה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>כדאי לבדוק גם בדיוק אילו שדות נכללים באימות: אם התג מכסה רק סכום אך אינו מכסה את הנמען, תוקף יכול להשאיר סכום תקין ולשנות את כתובת התשלום. המקבל צריך לאמת ייצוג חד־משמעי של כל פרטי הפעולה הרלוונטיים. עצם קיום תג אינו מבטיח ששדה שהושמט מן הקלט מוגן, ולכן ניתוח שלמות מתחיל בהגדרת המסר המאומת.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_01_12072026_0 (2).pdf","question_type":"multiple-choice","solution":"solutions/Q153.html"},{"id":"Q154","year":"2026","stem":"מה ישיג התוקף בעזרת התקפה מלאה ומוצלחת של ARP Poisoning על אליס ובוב?","options":["יכולות MITM בין אליס לבוב.","גילוי המפתח הסימטרי שמשותף בין אליס ובוב.","יכולת זיוף חתימה דיגיטלית של אליס או בוב.","יכולות CSRF."],"note":"","sources":[{"file":"2026/689156_01_12072026_0 (2).pdf","date":"12/07/2026","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.275,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-13-02\" data-doc=\"original-13\" data-body-words=\"385\"><h2>שאלה 2 — תוצאת ARP poisoning</h2><div class=\"answer-body\">\n<p><strong>א — יכולת MITM בין אליס לבוב.</strong> הרעלה דו־כיוונית ממפה כל IP למק של התוקף ומאפשרת לו להעביר את התעבורה דרכו. ב וג אינן נובעות מכך: צפייה בתעבורה אינה שבירת הצפנה או זיוף חתימה. ד היא התקפת יישום בדפדפן שאינה תוצאה ישירה של ARP.</p>\n<h3>מסלול החבילה לפני ההרעלה ואחריה</h3>\n<p>ברשת מקומית יש להבחין בין כתובת היעד של חבילת האינטרנט לבין כתובת המתאם שאליו נמסרת המסגרת המקומית. כתובת אינטרנט מזהה את היעד הלוגי של התקשורת, ואילו כתובת חומרה משמשת למסירת מסגרת ברשת המקומית. כאשר היעד נמצא באותה רשת, המחשב צריך למצוא איזו כתובת חומרה מתאימה לכתובת האינטרנט שלו. פרוטוקול פתרון הכתובות מספק את המיפוי הזה ושומר אותו במטמון כדי שלא יהיה צורך לשאול מחדש בכל מסגרת.</p>\n<p>הכשל שנוצל במודל השאלה הוא היעדר אימות קריפטוגרפי של הודעות המיפוי. התוקף משדר הודעה שלפיה כתובת האינטרנט של הקורבן האחר נמצאת בכתובת החומרה של התוקף. הקורבן מעדכן את המטמון וממשיך לבנות חבילות לאותו יעד מקורי, אך עוטף אותן במסגרת המיועדת לתוקף. אם התוקף מעביר את החבילות הלאה, התקשורת עשויה להיראות רגילה והמשתמשים אינם מקבלים בהכרח סימן גלוי להרעלה.</p>\n<h3>יכולות התוקף וגבולות ההתקפה</h3>\n<p>כדי לקבל מיקום בין שני הצדדים בדרך כלל מרעילים את המיפוי בכל אחד מהם, או את המיפוי בין הקורבן לשער ברירת המחדל. התוקף יכול אז לצפות, לעכב, להשמיט ולהעביר מסגרות, ובהיעדר הגנות גבוהות יותר גם לשנות נתונים. מכאן לא נובעת ידיעה של מפתח הצפנה: כאשר מופעל ערוץ מוצפן ומאומת כראוי, הנתונים נשארים מוצפנים ושינויים בלתי מורשים מתגלים. עצם ההגעה לתעבורה אינה מאפשרת לייצר חתימה דיגיטלית בשם אחר.</p>\n<p>המושג הזרקה מחוץ לנתיב מתאר כאן תוקף שיש לו גישה מתאימה לאותו תחום שידור, אך עדיין אינו מעביר את התקשורת דרכו. ההרעלה היא שיוצרת לו עמדה כזאת. אין פירוש הדבר שכל מחשב מרוחק באינטרנט יכול לשלוח הודעות כאלה דרך נתבים. יש גם להבחין מהצפת טבלת מתג: זו התקפה על למידת מיקומי כתובות חומרה במתג, בעוד כאן משנים את הבנת המחשבים לגבי הקשר בין שתי שכבות כתובות. בקרות ברשת המקומית או אימות הערוץ בשכבות העליונות מתמודדים עם היבטים שונים של הבעיה.</p>\n<h3>בדיקה נוספת וגבול ההבט
