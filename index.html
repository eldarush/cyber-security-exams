וצאות לפי תנאי הפלטים. אם משנים את ההנחה לרוב זדוני מתמשך, הטיעון על דעיכת הסיכון משתנה. חשוב לציין את ההנחה לפני ההסקה, ולא לזכור כלל בלתי מותנה ״6=בטוח״.</p><h3>העמקה ודוגמה נוספת מהבחינה המקורית</h3><p><strong>המתנה לאישורים מקטינה את הסיכון ל-double spending.</strong> כאשר הטרנזקציה נכללת בבלוק, ייתכן שענף מתחרה יחליף אותו. ככל שנוספים בלוקים על גבי הבלוק המכיל את התשלום, תוקף המבקש להחליף את ההיסטוריה הזאת צריך להשלים יותר עבודה מצטברת. תחת ההנחות המקובלות על כוח החישוב של התוקף והרשת, הסיכון להחלפה פוחת עם העומק.</p><p>אישור ראשון הוא בדרך כלל עצם ההכללה בבלוק, וחמישה בלוקים נוספים מעליו מביאים לשישה אישורים. אין כאן מספר קסם שמעניק ודאות מוחלטת. הסיכון תלוי בין השאר בחלקו של התוקף בכוח החישוב, בתנאי הרשת ובערך העסקה. אם לתוקף רוב מתמשך של כוח החישוב, אין להצדיק הבטחת בטיחות רק על בסיס ״שישה״.</p><p>הטרנזקציות אינן נעשות קריאות רק לאחר שישה בלוקים: התוכן אינו מוצפן באמצעות מנגנון ההמתנה הזה. הפצה לרשת אינה מונה קבוע של שישה בלוקים, והחוקיות אינה מבוססת על שש חתימות כורים. חתימת בעל הזכות להוציא את הפלט מוכיחה הרשאה להוצאה, אך אינה לבדה פותרת התנגשות בין שתי הוצאות מורשות של אותו UTXO.</p><p>חשוב להפריד שלוש שאלות: האם חתימת ההוצאה תקינה; האם הפלט טרם בוזבז במצב השרשרת שהצומת מאמת; ועד כמה עמוקה ההכללה בשרשרת בעלת העבודה המצטברת התקפה. עץ מרקל יכול להוכיח הכללה תחת שורש מסוים, אבל אינו הופך את הבלוק לבלתי ניתן להחלפה. בבחינה, חפשו אם השאלה עוסקת בהרשאה, בהכללה או בסופיות הסתברותית—אלה מנגנונים שונים.</p><p>להסבר המלא של המנגנון ולניתוח המסיחים: <a href=\"solutions/Q177.html\">פתרון Q177</a>.</p>","title":"גבולות אישורים וכוח כרייה","guide":"Q177","id":"P08","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":8}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"ליבה","evidence":["Q177","Q167"],"mock":1,"answer_origin":"וריאציה חדשה לצורך תרגול מועד ב׳","accepted_indices":[0],"solution":"solutions/P08.html"},{"stem":"בדיפי הלמן נבחרו p=23, ‏g=5, ‏a=6, ‏b=15. מהו המפתח המשותף?","options":["2","8","19","21"],"topic":"דיפי-הלמן והחלפת מפתחות","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>הערך הציבורי של אליס הוא A=5^6 mod 23=8 ושל בוב B=5^15 mod 23=19. אליס מחשבת 19^6 mod 23=2, ובוב 8^15 mod 23=2. ‏8 ו-19 הם ערכים ציבוריים ולא הסוד. חשבון אליס: 19² mod23=16; ‏19⁴ mod23=3; לכן 19⁶ mod23=3×16 mod23=2. אלה פרמטרים קטנים לתרגול בלבד.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>לחישוב ידני של A אפשר להשתמש בריבוע חוזר: חמש בריבוע נותן שתיים מודולו עשרים ושלוש, ולכן חמש ברביעית נותן ארבע, וחמש בשישית נותן שמונה. החישוב מהצד השני אינו בדיקה באמצעות אותו מספר ציבורי: אליס מעלה את הערך שקיבלה מבוב בסוד שלה, ובוב מעלה את הערך שקיבל מאליס בסוד שלו. ההשוואה בין שתי התוצאות היא בדיקת נכונות שימושית. מספר ציבורי שנשלח בפרוטוקול אינו התשובה רק משום שהוא נראה כמו תוצאת חישוב. הסכמת מפתח ללא אימות עדיין חשופה לתוקף פעיל בתרחיש כללי.</p>\n<h3>איך נוצר סוד משותף בלי לשלוח אותו</h3>\n<p>בחילוף המפתחות הנדון שני הצדדים מסכימים על קבוצה מתמטית, בסיס ומודולוס. כל צד בוחר מעריך פרטי, מעלה את הבסיס בחזקה שלו ושולח רק את התוצאה הציבורית. לאחר מכן הוא מעלה את הערך שקיבל בחזקת הסוד הפרטי שלו. חוקי החזקות מבטיחים ששני הצדדים יגיעו לאותו ערך, משום שכפל המעריכים מתחלף. התמליל הציבורי כולל אפוא את הבסיס ושני ערכי החזקה, אך אינו כולל במפורש את שני המעריכים או את הסוד המשותף.</p>\n<p>בשאלות מספריות קטנות אפשר למצוא את המעריך המתאים לערך ציבורי באמצעות טבלת חזקות. אין כאן סתירה לביטחון העקרוני: המודולוסים הזעירים נבחרו כדי לאפשר חישוב בבחינה, ולא כדי לייצג פרמטרים בטוחים. אחרי שמוצאים מעריכים אפשריים, מחשבים את הסוד בשתי דרכים ובודקים התאמה. ריבועים חוזרים וצמצום השארית בכל צעד מקטינים את המספרים ומאפשרים לתפוס שגיאת חשבון לפני בחירת האפשרות.</p>\n<h3>הנחת הקושי לעומת אימות הזהויות</h3>\n<p>בעיית הלוגריתם הדיסקרטי שואלת כיצד לשחזר מעריך מתוך הבסיס ותוצאת החזקה. חישוב הסוד המשותף ישירות מתוך שני ערכים ציבוריים מנוסח באמצעות הנחת קושי קשורה, שאינה זהה בכל קבוצה מתמטית. במסגרת השאלון הייחוס ללוגריתם דיסקרטי הוא ההבחנה המבוקשת מול צפנים קלאסיים או מנגנוני קונצנזוס. בפרוטוקול מעשי צריך גם לבדוק את תקינות ערכי הקלט, לבחור קבוצה מתאימה ולהפיק מן הסוד מפתחות באמצעות פונקציית גזירה.</p>\n<p>המתמטיקה לבדה אינה מאמתת עם מי הוחלפו הערכים. תוקף פעיל יכול להציב ערך ציבורי משלו מול כל צד, ליצור שני סודות שונים ולתווך בין הצדדים. לעומת זאת, מאזין פסיבי שאינו משנה הודעות אינו יכול לבצע החלפה כזאת. לכן בתרחיש שמגביל במפורש את התוקף להאזנה, אין לפסול את השיטה רק מפני שהיא פגיעה לתוקף פעיל חזק יותר. כשנדרש אימות אפשר לחתום על ערכי ההחלפה והקשרם או להשתמש במנגנון מאומת אחר. יש להפריד בכל תשובה בין סודיות מול מאזין, חישוב הסוד המספרי והבטחת זהות הצד האחר.</p>","title":"DH","old_number":12,"id":"P09","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":9}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"משלים","evidence":["Q164","Q148"],"mock":1,"answer_origin":"תרגיל 12 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P09.html"},{"stem":"מצפינים HELLO במפתח KEY בצופן Vigenère, עם A=0. מהו ה-ciphertext?","options":["RIJVS","IFMMP","RIJWT","HELLO"],"topic":"הצפנה סימטרית וצפנים קלאסיים","answer_html":"<p>חוזרים על המפתח: KEYKE. ערכי H,E,L,L,O הם 7,4,11,11,14 וערכי K,E,Y,K,E הם 10,4,24,10,4. מחברים מודולו 26 ומקבלים 17,8,9,21,18, כלומר RIJVS. במיקום השלישי 11+24=35, ושארית 35 מודולו 26 היא 9.</p><p>IFMMP הוא הזזה קבועה של אחת, ולא שימוש במפתח KEY. ‏RIJWT נובע משגיאות במיקומים האחרונים. HELLO משאיר את ההודעה ללא הצפנה. בפענוח מחסרים את אותיות המפתח באותו יישור. הנימוק לתרגיל: אוקטובר בחן חישוב Vigenère בפועל, בעוד נובמבר 2024 בחן היבט של אותו צופן; זו וריאציה ממוקדת של מיומנות, לא ראיה שהמספרים יחזרו.</p><h3>העמקה ודוגמה נוספת מהבחינה המקורית</h3><p><strong>התשובה הנכונה היא LXFOPVEFRNHR.</strong> בצופן Vigenère כל אות של הטקסט מוזזת לפי הערך המספרי של אות המפתח שמתחתיה. המפתח חוזר מחזורית עד לאורך ההודעה. כאן יש 12 אותיות בטקסט ו-5 במפתח, ולכן כותבים LEMONLEMONLE. אין להוסיף רווחים ואין להתחיל מחדש את המפתח בתחילת מילה: הנתון הוא המחרוזת הרציפה ATTACKATDAWN.</p><p>ממירים אותיות לערכים בין 0 ל-25. בכל מיקום מחשבים Cᵢ=(Pᵢ+Kᵢ) mod 26. למשל A+L נותן 0+11=11, כלומר L; האות השנייה T+E נותנת 19+4=23, כלומר X. במיקום השלישי T+M נותן 31, ומפחיתים 26 כדי לקבל 5, כלומר F.</p><pre dir=\"ltr\">P: A  T  T  A  C  K  A  T  D  A  W  N\nK: L  E  M  O  N  L  E  M  O  N  L  E\nC: L  X  F  O  P  V  E  F  R  N  H  R</pre><p>הבדיקה האחרונה חשובה: N+E=13+4=17, ולכן האות האחרונה היא R ולא S. החלופה המסתיימת ב-S נועדה לתפוס שגיאה מקומית. BUUBDLBUEBXO מתקבל מהזזה קבועה באחד, שאינה משתמשת במפתח LEMON. החלופה LXFOPVLXFOPV חוזרת על קטע מוצפן כאילו חזרה על טקסט מחייבת אותו פלט בלי להתחשב במיקום המפתח; זו אינה שיטת Vigenère.</p><p>בדיקת הבנה: בפענוח מבצעים Pᵢ=(Cᵢ−Kᵢ) mod 26. במקרה של תוצאה שלילית מוסיפים 26. יש להבחין בין צופן הזזה עם מספר קבוע, צופן החלפה כללי, ו-Vigenère עם סדרת הזזות מחזורית. זהו צופן לימודי היסטורי: מפתח קצר שחוזר אינו OTP ואינו מעניק סודיות מושלמת. בשאלה מספרית עדיף לכתוב שלוש שורות מיושרות ולבדוק אות מההתחלה, מהאמצע ומהסוף, במקום לזהות רק תחילית מוכרת.</p><p>להסבר המלא של המנגנון ולניתוח המסיחים: <a href=\"solutions/Q173.html\">פתרון Q173</a>.</p>","title":"Vigenère עם מפתח חוזר","guide":"Q173","id":"P10","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":10}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"ממוקד","evidence":["Q173","Q097"],"mock":1,"answer_origin":"וריאציה חדשה לצורך תרגול מועד ב׳","accepted_indices":[0],"solution":"solutions/P10.html"},{"stem":"CA שנפרץ הנפיק תעודה מזויפת לדומיין אמיתי. הפעם התוקף הגיש אותה ללוגים וקיבל SCTs שעומדים במדיניות הדפדפן. מה נכון?","options":["CT לבדו לא מבטיח דחייה; הרישום עשוי לאפשר גילוי ההנפקה החריגה","CT מבטיח שהתעודה אינה מזויפת ולכן זהות התוקף הפכה אמיתית","SCT מבטל אוטומטית את התעודה בכל הדפדפנים","ה-SCT חייב להיות חתום במפתח הפרטי של האתר"],"topic":"PKI, תעודות, CT ו-OCSP","answer_html":"<p>התשובה היא שאין הבטחת דחייה על ידי CT לבדו. באוקטובר חסרו SCTs, ולכן דפדפן האוכף CT דחה לפי הנחת השאלה. כאן שינינו במכוון את התנאי: קיימות ראיות לוג שעומדות במדיניות. CT אינו בודק במקום ה-CA את אמיתות כל הנפקה ואינו הופך תעודה מזויפת לנכונה.</p><p>הערך של הרישום הוא שקיפות: בעלי הדומיין ומוניטורים עשויים לזהות תעודה שלא ביקשו ולפעול. SCT הוא התחייבות לוג, לא ביטול אוטומטי ולא חתימת האתר. עדיין יש לבדוק את יתר דרישות התעודה; מהנתון שה-CT תקין אי אפשר להסיק שכל הבדיקות האחרות בהכרח עוברות. זו דוגמה לשינוי הנחה קטן שהופך את התשובה, ולכן עדיף לתרגל אותו מלשנן ״CA שנפרץ → דחייה״.</p><h3>העמקה ודוגמה נוספת מהבחינה המקורית</h3><p><strong>לפי הנחות השאלה, הדפדפן ידחה את התעודה.</strong> חתימת CA מהימן ועמידה בדרישות CT הן בדיקות נפרדות. דפדפן שאוכף את מדיניות CT המתאימה דורש ראיות קבילות מהלוגים. התוקף השיג מפתח של CA, אבל לא השיג בכך את מפתחות החתימה של לוגי CT ולא יצר SCTs תקינים.</p><p>SCT הוא התחייבות חתומה של לוג לכלול את התעודה או הרשומה המתאימה בתוך מסגרת הזמן המוגדרת. הוא אינו חתימת ה-CA ואינו הוכחת בעלות בדומיין. לכן CA שנפרץ יכול להנפיק תעודה עם חתימת CA תקינה, אך אינו יכול להמציא חתימת לוג תקינה רק באמצעות אותו מפתח. אם התוקף כן יגיש את התעודה ללוג ויעמוד במדיניות, CT אינו מבטיח חסימה של ההתחזות; השקיפות מסייעת לחשיפת הנפקה חריגה ולפיקוח עליה.</p><p>CT אינו מנגנון ביטול תעודות. CRL ו-OCSP עוסקים בסטטוס ביטול, ולא ברישום ציבורי של הנפקה. OCSP אינו שירות שבעזרתו הדפדפן רושם בעצמו תעודה חסרה ואז מכשיר אותה. בנוסף, אין להסיק ש-SCT חייב תמיד להיות מוטמע בתוך גוף התעודה: קיימים מסלולי מסירה שונים לפי הפרוטוקול ומדיניות הלקוח. בשאלה נאמר שלא הייתה הגשה לאף לוג, ולכן חסרה הראיה עצמה ולא רק מיקומה.</p><p>במבחן סמנו את שרשרת הסמכויות: CA חותם על התעודה, לוגר חותם על SCT, דפדפן בודק מדיניות, ומוניטור מחפש הנפקות חשודות. ההפרדה הזאת מונעת את הטעות שלפיה שליטה ברכיב אחד מעניקה אוטומטית את מפתחות כל הרכיבים. התשובה מתייחסת במפורש לדפדפן שאוכף CT ולתעודה שחייבת במדיניות זו, ולא לכל לקוח TLS אפשרי.</p><p>להסבר המלא של המנגנון ולניתוח המסיחים: <a href=\"solutions/Q181.html\">פתרון Q181</a>.</p>","title":"מה CT כן ומה אינו מבטיח","guide":"Q181","id":"P11","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":11}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"ליבה","evidence":["Q181","Q139"],"mock":2,"answer_origin":"וריאציה חדשה לצורך תרגול מועד ב׳","accepted_indices":[0],"solution":"solutions/P11.html"},{"stem":"ב-OCSP stapling השרת מצרף תשובת OCSP חתומה וטרייה. מהו היתרון העיקרי לעומת פנייה ישירה של כל לקוח אל המשיב?","options":["צמצום חשיפת הרגלי הגלישה למשיב OCSP וצמצום פניות נפרדות אליו.","ביטול הצורך באימות חתימת תשובת OCSP.","החלפת המפתח הציבורי של השרת במפתח ה-CA.","הוכחה שהתעודה רשומה ב-CT."],"topic":"PKI, תעודות, CT ו-OCSP","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>השרת משיג תשובת סטטוס חתומה ומפיץ אותה ללקוחות כל עוד היא תקפה. כך המשיב אינו רואה פנייה נפרדת מכל לקוח בעת הביקור. הלקוח עדיין מאמת את חתימת המשיב המוסמך, שיוך התשובה לתעודה וזמני התוקף; אחרת ניתן היה לצרף תשובה מזויפת או ישנה. Stapling אינו SCT ואינו מחליף את שרשרת האמון.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>השרת אינו יוצר בעצמו הצהרה חופשית שהוא לא בוטל; הוא מצרף הצהרה חתומה מגורם מוסמך. הלקוח בודק שההצהרה נוגעת לתעודה הנכונה ושהיא אינה ישנה מעבר לזמן המקובל. בלעדי בדיקת זמן, תוקף המחזיק תשובה ישנה מסוג ״תקין״ היה יכול להמשיך להציגה לאחר שינוי הסטטוס. יתרון הפרטיות נובע מכך שהמשיב רואה בעיקר את בקשות השרת לתשובה ולא פנייה נפרדת מכל מבקר. אין כאן מפתח ציבורי חלופי לשרת, והחתימה על תשובת הסטטוס אינה הוכחה לכך שהתעודה נכללה ביומן CT.</p>\n<h3>ביטול תעודה הוא עדכון אמון ולא שינוי במתמטיקה</h3>\n<p>תעודה עשויה להיות חתומה כחוק ועדיין להפסיק להיות אמינה לפני תאריך הפקיעה שלה, למשל מפני שמפתח פרטי נגנב. החתימה על התעודה אינה נעלמת כאשר הרשות מחליטה לבטל אותה, ולכן הלקוח זקוק למידע נוסף על סטטוסה. רשימת ביטול מפרסמת אוסף תעודות שבוטלו, ושירות סטטוס מקוון מאפשר לברר את המצב של תעודה מסוימת. בשני המקרים המקבל צריך לאמת שהמידע הגיע מגורם מורשה ושאינו ישן מדי.</p>\n<p>למפתח הפרטי של שרת האתר ולמפתח החתימה של רשות התעודות יש תפקידים שונים. גניבת מפתח האתר מאפשרת להתחזות לאתר בהקשרים שבהם התעודה עוד מתקבלת, אך אינה מאפשרת לחתום בשם הרשות על רשימת ביטול או תשובת סטטוס. אחרת כל שרת היה יכול לבטל את ביטולה של תעודתו בעצמו, וכל שרשרת האמון הייתה מאבדת את משמעותה. גם העתקת אישור קיים אינה מאפשרת לשנות את השדות שלו בלי לפגוע בחתימה.</p>\n<h3>הצמדה, פרטיות וכשל תקשורת</h3>\n<p>כאשר הדפדפן פונה ישירות לשירות הסטטוס, השירות עשוי ללמוד באיזו תעודת אתר הדפדפן מתעניין, ונוספות השהיה ותלות בזמינות רשת. הצמדת תשובת סטטוס מאפשרת לשרת האתר לקבל תשובה חתומה ולהגיש אותה ללקוחות במהלך ההקמה. השרת מעביר ראיה חתומה, ואינו מחליף את המשיב המורשה כחותם. הלקוח עדיין בודק התאמה, חתימה וטריות.</p>\n<p>מדיניות המשך במקרה כשל פירושה שאם הבירור אינו אפשרי, הלקוח עשוי להמשיך במקום לחסום. הדבר משפר זמינות אך עלול לאפשר לתוקף לחסום גישה לשירות הסטטוס ולנצל תעודה שכבר בוטלה. מכאן שפער בין ביטול אצל הרשות לבין אכיפה אצל משתמשים אינו מצביע בהכרח על זיוף חתימה: ייתכנו כשל תקשורת או מידע שמור שעוד נחשב עדכני. שקיפות תעודות פותרת בעיית גילוי הנפקות ואינה מחליפה את העברת הסטטוס הזה. גם שרתי שורש של מערכת שמות מתחם אינם רשויות ההפצה של ביטול תעודות, אף שבשני התחומים משתמשים במושג שורש.</p>","title":"OCSP","old_number":14,"id":"P12","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":12}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"ליבה","evidence":["Q170","Q108"],"mock":2,"answer_origin":"תרגיל 14 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P12.html"},{"stem":"ב-CBC ללא MAC הוחלף ביט אחד ב-C₄ בלבד. מה קורה ל-plaintext לאחר הפענוח?","options":["P₄ מתערבל, וב-P₅ מתהפך הביט המקביל; שאר הבלוקים נשארים","רק P₄ משתנה בביט אחד","כל הבלוקים החל מ-P₄ נהרסים","P₃ מתערבל ו-P₄ משתנה בביט אחד"],"topic":"הצפנה סימטרית וצפנים קלאסיים","answer_html":"<p>נוסחת הפענוח היא Pᵢ=Dₖ(Cᵢ) XOR Cᵢ₋₁. ב-P₄ השתנה הקלט לפונקציית הפענוח, ולכן יש ערבול שאינו שינוי ביט צפוי. ב-P₅ הפענוח Dₖ(C₅) נשאר, אבל הוא מחובר ב-XOR ל-C₄ ששונה; מכאן שינוי בדיוק בביט המקביל. P₆ משתמש ב-C₆ וב-C₅ המקוריים ולכן אינו מושפע.</p><p>אין התפשטות אינסופית: כל בלוק plaintext תלוי בשני בלוקי ciphertext נתונים, לא ב-plaintext הקודם. P₃ אינו תלוי ב-C₄ ולכן אינו נפגע. המונח ״מתערבל״ אינו אומר שכל ביט מתהפך, אלא שלא ניתן לקבוע את השינויים בלי מידע נוסף. זו וריאציה ישירה של אוגוסט 2026, אך משתמשת במיקום אחר כדי למנוע שינון של ״בלוקים שני ושלישי״.</p><h3>העמקה ודוגמה נוספת מהבחינה המקורית</h3><p><strong>בלוק 2 מתערבל, ובבלוק 3 מתהפך בדיוק הביט המקביל.</strong> נוסחת פענוח CBC היא Pᵢ=Dₖ(Cᵢ) XOR Cᵢ₋₁. שינוי ביט בתוך C₂ משנה את הקלט ל-Dₖ בחישוב P₂; עבור צופן טוב השינוי מתפזר על פני הבלוק, ולא ניתן לחזות אילו ביטים ישתנו.</p><p>בחישוב P₃, לעומת זאת, C₂ מופיע אחרי הפענוח כחלק מ-XOR. לכן אם C₂′=C₂ XOR Δ, מתקבל P₃′=P₃ XOR Δ. כש-Δ כולל ביט אחד, בדיוק הביט הזה משתנה ב-P₃. ב-P₄ משתמשים ב-C₄ וב-C₃, שלא השתנו, ולכן ההתפשטות נעצרת.</p><p>P₁ אינו נפגע. החלופה שטוענת שכל הבלוקים מהשני והלאה נהרסים מבלבלת בין שרשרת ההצפנה לבין שימוש ב-ciphertext שכבר התקבל בפענוח. החלופה המהפכת בין שני הבלוקים מתעלמת מהמיקום של Dₖ; והטענה ש-P₃ נשאר זהה מתעלמת מה-XOR עם C₂.</p><p>״שונה לחלוטין״ בנוסח הבחינה מתאר אפקט ערבול, ולא הבטחה שכל ביט ב-P₂ מתהפך. בצופן אידאלי מצפים שכמחצית מהביטים ישתנו בממוצע. הניתוח מניח CBC ללא אימות שדוחה את ההודעה קודם; בסכמה מאומתת תקינה שינוי בתעבורה צריך לגרום לדחייה, ולא לקבלת plaintext ששונה. כתיבת נוסחת הפענוח לפני קריאת החלופות מונעת את רוב הטעויות.</p><p>להסבר המלא של המנגנון ולניתוח המסיחים: <a href=\"solutions/Q168.html\">פתרון Q168</a>.</p>","title":"שיבוש בבלוק CBC","guide":"Q168","id":"P13","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":13}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"ליבה","evidence":["Q168"],"mock":2,"answer_origin":"וריאציה חדשה לצורך תרגול מועד ב׳","accepted_indices":[0],"solution":"solutions/P13.html"},{"stem":"בעץ מרקל בינארי מושלם, שכל 2048 העלים שלו באותה רמה, הלקוח כבר מכיר שורש מאומת ואת הטרנזקציה הרצויה. כמה ערכי hash אחים נדרשים להוכחת הכללה של עלה אחד?","options":["11","2047","1024","12"],"topic":"ביטקוין ובלוקצ׳יין","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>2048=2^11 ולכן במסלול מהעלה לשורש יש 11 רמות. בכל רמה נחוץ hash של האח, וביחד עם הצומת המחושב אפשר לחשב את האב. אין צורך להעביר את כל שאר העלים. 12 סופר בטעות גם את השורש, שכבר ידוע, או את hash העלה שאפשר לחשב מהטרנזקציה. סדר ימין ושמאל של כל אח חייב להיות ידוע אף הוא, אך אינו מוסיף ערך hash.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>בונים מסלול מפורש: לאחר הרמה הראשונה העלה מייצג קבוצה בת שני עלים, לאחר השנייה ארבעה, ובהמשך שמונה וכן הלאה. לאחר אחת עשרה הכפלות מתקבלת קבוצה בת אלפיים ארבעים ושמונה עלים. בכל שלב משלים אח יחיד את החצי החסר. אין לשלוח שוב את hash העלה אם הטרנזקציה עצמה נתונה, ואין לספור שורש שהלקוח כבר מאמין בו כפריט הוכחה חדש. ההנחה שכל העלים באותו עומק חיונית: עץ שכל צומת פנימי בו בעל שני ילדים בלבד יכול להיות בלתי מאוזן, ואז מספר האחים תלוי בעלה שנבחר.</p>\n<h3>כיצד מחויבות לשורש נוצרת מן העלים</h3>\n<p>עץ מרקל הוא דרך לצמצם אוסף נתונים לערך קצר שמחייב את כל תוכנו. בעלים נמצאים ערכי גיבוב של פריטי המידע, וכל צומת פנימי מחושב מגיבוב של ערכי ילדיו לפי סדר מוגדר. חוזרים על הפעולה עד שמתקבל ערך יחיד בשורש. אם משנים פריט אחד, משתנה הגיבוב בעלה המתאים, ואז משתנים הקלטים של אביו ושל אבותיו עד השורש. ענף שאין בו את הפריט נשאר עם אותם קלטים, ולכן אינו צריך להשתנות.</p>\n<p>התלות הזאת מסבירה גם מה אינו מתקבל מן העץ: הנתונים אינם מוצפנים. מי שרואה את העסקאות יכול לקרוא אותן, ומי שרואה גיבוב אינו מקבל מכך הרשאה או הוכחה שמי שיצר עסקה היה מורשה. העץ מחייב סדר ואוסף נתונים ומאפשר להוכיח השתייכות אליהם. חוקיות העסקאות, חתימות הבעלים והסכמה על הבלוק הן בדיקות נוספות שמתקיימות במקום אחר במערכת.</p>\n<h3>בניית הוכחה יעילה ובדיקתה</h3>\n<p>כדי להוכיח עלה מסוים אין צורך לשלוח את כל העץ. מספיקים הנתון, הערכים של האחים לאורך הדרך לשורש ומיקומו של כל אח ביחס לצומת שכבר חושב. המקבל מחשב בכל רמה את גיבוב ההורה ומשווה בסיום לשורש שהוא כבר סומך עליו. אם השורש נמסר רק בידי אותו גורם לא אמין שמסר את ההוכחה, התוקף יכול להמציא עץ משלו; לכן מקור האמון בשורש הוא חלק הכרחי מן הפרוטוקול.</p>\n<p>בעץ בינארי מלא כל רמה מכפילה את מספר העלים שניתן להכיל, ולכן מספר ערכי ההוכחה גדל לוגריתמית ולא ביחס ישר למספר הפריטים. הכפלת מספר העלים מוסיפה רק רמה אחת. כאשר מספר העלים אינו חזקה של שתיים, נדרש כלל מוגדר לטיפול בעלה ללא אח או למבנה העץ, אך עדיין רק אבות הנתון תלויים בו. הטענה ששינוי בהכרח משנה גיבוב מניחה את מודל הביטחון של פונקציית הגיבוב: באופן מתמטי יכולה להיות התנגשות, אלא שבפונקציה מתאימה לא אמורה להיות לתוקף דרך מעשית לייצר אותה.</p>","title":"Merkle","old_number":6,"id":"P14","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":14}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"ליבה","evidence":["Q159","Q165"],"mock":2,"answer_origin":"תרגיל 6 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P14.html"},{"stem":"נתונה הודעה מסוימת m0 והתוקף מחפש m1≠m0 כך ש-h(m1)=h(m0). איזו תכונת בטיחות הוא מנסה לשבור?","options":["Second pre-image resistance.","Pre-image resistance כאשר נתון רק digest ואין הודעה.","סודיות מושלמת של OTP.","עמידות להתנגשות שבה התוקף חופשי לבחור את שתי ההודעות מלכתחילה."],"topic":"Hash, MAC וסיסמאות","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>המאפיין הקובע הוא שההודעה הראשונה ניתנת לתוקף והוא חייב להתאים לה הודעה שנייה. במתקפת pre-image נתון יעד פלט בלבד; במתקפת collision רגילה אפשר לבחור את שני הקלטים. שלושת המצבים עשויים להסתיים בשוויון ערכי hash, אך משחק האבטחה שונה. אין כאן כלל מפתח הצפנה או OTP.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>דרך טובה לזהות את המשחק היא להדגיש מה התוקף קיבל לפני שהתחיל לעבוד. כאן הוא קיבל הודעה מסוימת, ולא רק מספר פלט. אם חיפש שתי הודעות חדשות בלי אילוץ על אחת מהן, היה מדובר במשחק התנגשות. אם קיבל רק digest וחיפש קלט כלשהו שממופה אליו, היה זה משחק קדם תמונה. אין לדרוש שההודעה השנייה תהיה בעלת אותה משמעות אנושית או אותה סיסמה: התנאי הוא אי שוויון בקלט ושוויון בפלט. גם מציאת פלט אחר אינה מתקפה; פונקציה שימושית אמורה להפיק לעיתים קרובות פלטים שונים עבור קלטים שונים.</p>\n<h3>שלוש בעיות חיפוש שונות</h3>\n<p>פונקציית גיבוב ממפה מסרים באורכים שונים לתוצאה באורך קבוע. מכיוון שיש יותר מסרים מתוצאות אפשריות, קיימים בהכרח מסרים שונים בעלי אותה תוצאה. דרישת האבטחה אינה שאין התנגשויות כלל, אלא שלא תהיה לתוקף דרך מעשית למצוא את ההתאמות המסוכנות הנדרשות בתקיפה. כדי להבין איזו תכונה נשאלת צריך קודם לשאול מה כבר ניתן לתוקף ומה הוא רשאי לבחור בעצמו.</p>\n<p>בעמידות לקדם־תמונה התוקף מקבל תוצאה ומנסה למצוא מסר שמגיע אליה. הוא אינו חייב למצוא דווקא את המסר המקורי; כל מסר בעל אותה תוצאה מספיק. בעמידות לקדם־תמונה שנייה התוקף מקבל מסר מסוים, וצריך למצוא מסר אחר בעל אותו גיבוב. בעמידות להתנגשויות שני המסרים נתונים לבחירתו, כל עוד יהיו שונים ויגיעו לאותה תוצאה. ההבדל בין קיבוע מסר אחד לבין בחירת שני מסרים מסביר מדוע שמות התכונות אינם ניתנים להחלפה.</p>\n<h3>קישור למקרה מעשי ולמסיחים</h3>\n<p>במערכת אימות סיסמאות, נתון חשבון מסוים עם ערך בדיקה שנוצר מסיסמה מסוימת. אם סיסמה שונה עוברת את אותה בדיקה תחת אותו ערך המלחה, שני קלטים שונים הובילו לאותו גיבוב. עצם האירוע הוא התנגשות; תקיפה מכוונת של החשבון הקבוע נוגעת לקדם־תמונה שנייה. הוספת ערך המלחה אינה מבטלת את האפשרות המתמטית להתנגשויות, אך מונעת שימוש באותו חישוב מוקדם עבור משתמשים רבים.</p>\n<p>לשם השוואה, מציאת שני מסרים עם תוצאות שונות היא פעולה קלה ורצויה. אם כמעט כל מסר היה מקבל אותה תוצאה, הפונקציה הייתה חסרת תועלת לזיהוי שינויים. גם יצירת מחרוזת תוצאה שונה מזו שניתנה אינה מעידה על קושי קריפטוגרפי. לכן חלופות שמחליפות את סימן השוויון באי־שוויון אינן וריאציה קטנה של ההגדרה אלא טענה אחרת לגמרי. מונחים מתחומים כגון תעודות, כפיית הצפנה או סוד נוסף באחסון סיסמאות עשויים להיות קשורים להגנה הכוללת, אך אינם מגדירים את בעיית החיפוש של הגיבוב עצמו. הבחירה הנכונה מבוססת על הקלט, יעד החיפוש ותנאי ההצלחה.</p>","title":"hash","old_number":9,"id":"P15","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":15}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"ליבה","evidence":["Q140","Q150"],"mock":2,"answer_origin":"תרגיל 9 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P15.html"},{"stem":"במערכת textbook RSA נבחרו p=5 ו-q=11 והמעריך הפומבי e=3. מהו d המתאים לפי הדרישה ed ≡ 1 mod φ(n)?","options":["27","13","3","40"],"topic":"RSA, מפתח ציבורי וחתימות","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>n=55 ו-φ(n)=(5−1)(11−1)=40. צריך למצוא הופכי של 3 מודולו 40. מתקיים 3×27=81=2×40+1, ולכן d=27. לעומת זאת 3×13=39, ‏3×3=9 ו-3×40=120 נותנים שאריות 39, 9 ו-0. זו דוגמה זעירה לחישוב בלבד; textbook RSA ללא קידוד בטוח אינו הצפנה מאובטחת לשימוש מעשי.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>דרך שיטתית למצוא את ההופכי היא אלגוריתם אוקלידס המורחב: ארבעים שווה לשלוש כפול שלוש עשרה ועוד אחד, ולכן אחד שווה ארבעים פחות שלוש כפול שלוש עשרה. מכאן שהמקדם של שלוש הוא מינוס שלוש עשרה, ששקול לעשרים ושבע מודולו ארבעים. לאחר מציאת התוצאה מחזירים אותה למשוואה ולא מסתפקים בזכירת מספר. גם העובדה ששלוש זר לארבעים חשובה: בלעדיה לא היה הופכי כלל. בבחינה אין צורך לחשב חזקה עצומה כדי לבדוק כל חלופה; מספיקה כפל ושארית.</p>\n<h3>בניית המפתח ומשמעות החשבון המודולרי</h3>\n<p>באלגוריתם הנדון בוחרים שני ראשוניים שונים, מכפילים אותם לקבלת המודולוס, ומחשבים את מספר השאריות הזרות למודולוס. במקרה של מכפלת שני ראשוניים המספר הזה הוא מכפלת שני המספרים הקטנים באחד מן הראשוניים. לאחר מכן בוחרים מעריך ציבורי הזר למספר שהתקבל, ומוצאים לו הופכי כפל מודולרי שישמש כמעריך הפרטי. המודולוס משותף לשני המפתחות; החלפתו במספר אחר אינה יוצרת מפתח פרטי מתאים לאותו מפתח ציבורי.</p>\n<p>הדרישה להופכי פירושה שמכפלת שני המעריכים משאירה שארית אחת בחלוקה במספר השאריות הזרות. לכן אין צורך שהמעריכים יהיו שונים, גדולים במיוחד או אחד ראשוני ואחד לא. יש לבדוק את משוואת ההופכי במפורש. באימות חלופות של מפתח, חישוב המכפלה והשארית הוא בדיקה ישירה וקצרה הרבה יותר מניסיון להצפין אוסף מסרים ולקוות שהכול עובד.</p>\n<h3>חתימה, אימות ודרך חישוב יעילה</h3>\n<p>בחתימת ספר לימוד על מסר מספרי מעלים את המסר בחזקת המעריך הפרטי ומצמצמים מודולו המודולוס. לא מצפינים במפתח הציבורי כדי לחתום. כדי לאמת מעלים את החתימה בחזקת המעריך הציבורי ובודקים שחזר המסר. כאשר נדרשים לשחזר מסר מחתימה, זהו אותו כיוון אימות, גם אם השאלה מספקת תחילה דווקא את המעריך הפרטי. ההסבר המקדים לכל שאלה מיישם את התפקידים האלה על המספרים המסוימים שבה.</p>\n<p>אפשר לבצע את החזקות באמצעות ריבועים חוזרים: מחשבים חזקה שנייה, ממנה רביעית וכן הלאה, ובכל שלב שומרים רק את השארית. אחר כך מכפילים את החזקות המתאימות לפירוק הבינארי של המעריך. כך נשמרים מספרים קטנים ונמנעות טעויות של כתיבת מספר עצום. כל המספרים הקטנים בשאלון נועדו להדגים את המתמטיקה ואינם מפתחות בטוחים לשימוש. חתימה מעשית גם אינה חתימת ספר לימוד ישירה על מספר שרירותי; נדרשים גיבוב, קידוד חתימה תקני ובדיקת תקינות של המפתחות כדי למנוע מניפולציות שלא נלמדות מן החשבון הפשוט בלבד.</p>","title":"RSA","old_number":2,"id":"P16","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":16}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"ליבה","evidence":["Q155","Q138"],"mock":2,"answer_origin":"תרגיל 2 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P16.html"},{"stem":"אתר משנה כתובת דואר דרך בקשת POST מאומתת ב-cookie בלבד. דפדפן הקורבן יכול לשלוח cookie זה בבקשה בין אתרים. האם SOP לבדו מונע CSRF?","options":["לא. ייתכן שהבקשה תבוצע גם אם האתר התוקף אינו יכול לקרוא את התשובה.","כן, SOP מונע כל בקשת POST בין אתרים.","כן, כי POST הוא מנגנון הצפנה.","לא, משום ש-SOP פועל רק בשרת SQL."],"topic":"אבטחת Web","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>יש להבחין בין קריאת תשובה לבין שליחת בקשה שמשנה מצב. אתר זדוני יכול בנסיבות המתוארות להגיש טופס, והדפדפן יצמיד cookie מתאים. השרת עלול לבצע את הפעולה אף שהתוקף לא יקרא את הפלט. נדרשת הגנה כגון טוקן מאומת וקשור לסשן, בדיקות Origin או מדיניות cookies מתאימה. SOP נאכף בדפדפן, ו-POST אינו הצפנה.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>אפשר לתאר מתקפה בלי לקרוא אף בית מן התגובה: דף התוקף מגיש טופס לכתובת שינוי הדואר, הדפדפן שולח את אמצעי ההזדהות המותרים, והשרת מבצע. לאחר מכן הדפדפן עשוי למנוע מקוד התוקף לראות את התוצאה, אבל הנזק כבר התרחש. נתון במפורש שה-cookie יכול להישלח, ולכן אין להסתמך על ברירת מחדל אפשרית של SameSite שלא נמסרה. העובדה שהשיטה היא POST אינה מוכיחה כוונת משתמש. בהערכת כל מסיח יש לשאול אם הוא משנה את סמכות הבקשה בשרת או רק את קריאות התשובה בדפדפן.</p>\n<h3>האימות שמצליח והכוונה שאינה נבדקת</h3>\n<p>זיוף בקשות בין אתרים מנצל מצב שבו הדפדפן מוסיף הרשאה לבקשה באופן אוטומטי, בעוד האתר מפרש את עצם קבלת הבקשה כאילו המשתמש התכוון לבצע פעולה. התוקף אינו חייב לדעת את הסיסמה או לקרוא את עוגיית הכניסה. די בכך שהמשתמש כבר מחובר, שהדפדפן מצרף את העוגייה בהקשר התקיפה, ושהשרת מקבל פעולה רגישה ללא בדיקה נוספת של מקורה והקשרה.</p>\n<p>אפשר לדמיין דף תוקף שמפעיל ניווט לכתובת המעדכנת העדפה או מפרסמת הודעה בחשבון. מבחינת שרת היעד הגיעה בקשה בעלת עוגייה חוקית. מבחינת המשתמש הוא רק ביקר באתר אחר ולא אישר את השינוי. גם אם מדיניות המקור הזהה מונעת מהתוקף לקרוא את התשובה, עצם השינוי כבר עלול להתבצע. לכן תגובה ריקה או היעדר גישה למידע החוזר אינם שוללים את ההתקפה.</p>\n<h3>אילו הגנות משנות את תנאי התקיפה</h3>\n<p>טוקן אקראי שאינו נגיש לאתר התוקף מוסיף ערך שהדפדפן אינו מצרף אוטומטית רק מפני שיש לו עוגייה. האתר החוקי מכניס את הטוקן לטופס או לקוד שלו, והשרת בודק את התאמתו לסשן לפני הפעולה. המשתמש בדרך כלל אינו מקליד אותו. הגבלה של עוגיות בין אתרים יכולה למנוע את הצטרפות ההרשאה במסלולים מסוימים, ובדיקת מקור הבקשה מוסיפה מידע על ההקשר שממנו יצאה. חשוב לבדוק כל הגנה לפי פרטי המימוש ולא להניח שהיא פועלת רק משום ששמה מופיע בתיאור.</p>\n<p>שימוש בבקשה שאינה מיועדת לשנות מצב מתאים לתכנון פעולה פסיבית בלבד, ואינו מנגנון הרשאה. גם מעבר משליחת פרמטרים בכתובת לשליחת טופס אינו לבדו תיקון, משום שתוקף מסוגל להגיש טפסים. שמירת סיסמאות באופן מומלח מגינה על גניבת מאגר ולא על כוונת הבקשה. בנוסף, אם קיימת באתר הזרקת סקריפט, הקוד עשוי לקרוא את הטוקן ולשלוח פעולה תקינה בשם הקורבן. לפיכך הגנה טובה על בקשות רגילות והגנה מפני הרצת קוד לא מהימן משלימות זו את זו, וכל אחת תלויה בהנחת איום אחרת.</p>","title":"CSRF","old_number":19,"id":"P17","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":17}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"ליבה","evidence":["Q145","Q180"],"mock":2,"answer_origin":"תרגיל 19 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P17.html"},{"stem":"ב-P2PKH רגיל, מה נדרש לספק בעת הוצאת פלט נעול ל-hash של מפתח ציבורי?","options":["מפתח ציבורי מתאים וחתימה תקפה במפתח הפרטי התואם.","את המפתח הפרטי עצמו בגלוי לכורים.","את hash המפתח בלבד ללא חתימה.","חתימה הנוצרת במפתח הציבורי."],"topic":"ביטקוין ובלוקצ׳יין","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>הבדיקה מאמתת שה-hash של המפתח הציבורי שסופק מתאים ליעד הנעילה, וכן שהחתימה מתאימה להודעת העסקה ולמפתח הציבורי. המפתח הפרטי משמש ליצירת החתימה ונשאר סודי. ידיעת הכתובת או hash של מפתח אינה מוכיחה הרשאת הוצאה. חתימה קריפטוגרפית נוצרת באמצעות מפתח פרטי, בעוד אימותה משתמש במפתח ציבורי.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>הפלט הקודם מכיל תנאי נעילה המבוסס על hash של מפתח ציבורי. בשלב ההוצאה מספקים מפתח ציבורי מלא כדי לחשב עליו את ה-hash ולהשוות, וחתימה כדי להוכיח הרשאה ביחס למפתח הזה ולהודעת העסקה. שני השלבים נפרדים: חתימה תקפה במפתח אחר אינה מספיקה, ומפתח תואם ללא חתימה גם הוא אינו מספיק. המפתח הפרטי משמש בצד המשתמש ליצירת החתימה ואינו חלק מן ההוכחה הציבורית. בשאלה זו אין צורך לחשב ערך מספרי של hash; צריך לזהות מה נבדק בכל תנאי של הסקריפט.</p>\n<h3>נעילת פלט והוכחת הזכות להוציא אותו</h3>\n<p>בביטקוין אין צורך שהארנק ימסור את המפתח הפרטי לכורה או לשרת מרכזי. פלט של עסקה קודמת מכיל תנאי נעילה, ועסקה שמנסה להוציא אותו צריכה לספק נתונים שמקיימים את התנאי. בתבנית הנדונה התנאי מתייחס לגיבוב של מפתח ציבורי מסוים, ולכן המוציא מציג את המפתח עצמו וחתימה שנוצרה באמצעות הפרטי המתאים. אלה שני תפקידים משלימים: המפתח מאפשר לבדוק שהפונה מתאים לזהות הנעולה, והחתימה מוכיחה יכולת שימוש בסוד.</p>\n<p>אפשר לחשוב על ההבדל בין כתובת למשלוח מכתב לבין חתימה המאשרת הוראת תשלום. כתובת היעד אינה עצמה הרשאה לבצע פעולה, ובאותו אופן ידיעת גיבוב המפתח אינה הוכחת שליטה במטבעות. הגיבוב רשום כבר בפלט הציבורי וכל אחד יכול להעתיק אותו. לכן חלופה שמספקת רק מפתח ציבורי וגיבוב, ללא חתימה, אינה מסוגלת להוכיח שהמוציא מחזיק במפתח הפרטי.</p>\n<h3>ביצוע הסקריפט על המחסנית</h3>\n<p>סדר הנתונים חשוב משום שסקריפט פועל באמצעות מחסנית: כל פעולה לוקחת פריטים שהוכנסו לפניה ומחזירה תוצאה או נכשלת. תחילה נדחפות החתימה והמפתח הציבורי. פעולת השכפול משאירה עותק של המפתח לשלב אימות החתימה, בעוד העותק האחר נשלח לגיבוב. ערך הגיבוב המחושב מושווה לערך שנכתב בתנאי הנעילה. אם הם שונים הבדיקה נכשלת מיד; אם הם שווים, נותר לבדוק את החתימה בעזרת המפתח הציבורי המקורי.</p>\n<p>הבדיקה האחרונה קושרת את ההרשאה לעסקה שעליה נחתם. בתנאי חתימה רגילים אי אפשר להעתיק חתימה לעסקה אחרת עם נמענים אחרים ולצפות שתאומת, משום שהתוכן הנחתם השתנה. כשמציגים בשאלה את הסקריפט המשולב, צריך אפוא לעקוב לא רק אחרי רשימת המילים אלא גם אחרי סדר הדחיפה, אילו פריטים נשארים ואיזו פעולה צורכת אותם. היעדר פעולת אימות חתימה הוא כשל מהותי בתבנית התקנית, גם אם רצף אחר מסוגל לסיים ריצה בתנאים מסוימים. הציבוריות של המפתח אינה פוגעת בסודיות הפרטי, ואין צורך או הצדקה לחשוף את הפרטי במהלך הפדיון.</p>","title":"Bitcoin","old_number":27,"id":"P18","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":18}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"ליבה","evidence":["Q162","Q058"],"mock":2,"answer_origin":"תרגיל 27 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P18.html"},{"stem":"במודל TLS עם RSA שנלמד בקורס, תוקף משנה אלגוריתם מוצע ב-ClientHello אך ההודעות נותרות חוקיות תחבירית. מה מאפשר לשרת לגלות את השינוי?","options":["כישלון באימות Finished המחושב על תמליל ה-handshake.","בדיקת ה-CA בלבד.","עצם הגעת ClientHello תמיד גורמת לגילוי מיידי.","מספר הפורט של הדפדפן."],"topic":"TLS / HTTPS","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>הלקוח והשרת ראו תמלילים שונים: הלקוח כולל את ההודעה המקורית והשרת את ההודעה ששונתה. אימות Finished נקשר לתמליל ולסודות החיבור, ולכן השינוי גורם לחוסר התאמה. CA מאמת קשר זהות ומפתח ולא את תוכן ClientHello, ומספר פורט אינו מאמת משא ומתן. אם השינוי היה שובר תחביר היה ייתכן כשל מוקדם יותר; השאלה שוללת זאת במפורש.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>אפשר לרשום שני עותקים של השיחה, אחד אצל הלקוח ואחד אצל השרת. בעותק הראשון מופיעה רשימת האלגוריתמים המקורית, ובשני הרשימה ששינה התוקף. בהמשך שניהם מחשבים ערך אימות על תמליל, ולכן גם אם החליפו אותו סוד משותף תוצאות האימות אינן אמורות להתאים. ההנחה שההודעה נותרה תקינה תחבירית שוללת תשובה המבוססת על שגיאת פענוח מוקדמת. אם שאלת בחינה שואלת על השלב הראשון האפשרי, חובה לקרוא את מודל ההודעות הנתון ולא להחליף אותו אוטומטית בזרימה של גרסת TLS אחרת.</p>\n<h3>חלוקת התפקידים בהקמת הערוץ</h3>\n<p>בתחילת החיבור הלקוח והשרת עדיין אינם חולקים את מפתחות התעבורה החדשים. הלקוח פותח במשא ומתן על פרמטרים, השרת בוחר מבין האפשרויות המותרות ומציג אמצעי אימות מתאים, ובהמשך הצדדים מפיקים סוד משותף וממנו מפתחות. בהקשר מבוסס תעודות הלקוח בודק שהמפתח שהוצג קשור לשם האתר שאליו התכוון להגיע וששרשרת החתימות מובילה לשורש אמין. קיום חתימה חוקית כשלעצמו אינו מספיק אם התעודה שייכת לאתר אחר או אם אינה בתוקף.</p>\n<p>בשאלות המתארות חילוף מפתחות באמצעות הצפנה במפתח ציבורי של השרת, הלקוח יוצר סוד ראשוני ומצפין אותו כך שרק בעל המפתח הפרטי יוכל לפענחו. זהו מסלול היסטורי, ואין להשליך ממנו שכל חיבור מודרני פועל כך. בחילוף מפתחות זמני מבוסס דיפי–הלמן, מפתח התעודה משמש לאימות פרמטרים והסוד אינו מועבר באותה הצפנת מפתח ציבורי. להבחנה יש משמעות כאשר מפתח התעודה נגנב לאחר הקלטת התקשורת.</p>\n<h3>תמליל מאומת וגזירת מפתחות</h3>\n<p>בסוף הקמת החיבור הצדדים בודקים ערכים התלויים בתמליל הודעות ההקמה ובסודות שהפיקו. כך ניתן לזהות תוקף שהחליף הודעה בדרך גם אם היא נראית תקינה מבחינת התחביר. אם כל צד זוכר תמליל אחר, ערכי האימות אינם תואמים. שינוי שהורס תחביר או מונע הסכמה יכול כמובן לגרום לכשל מוקדם יותר, ולכן יש להבחין בין זיהוי אפשרי לבין זיהוי קריפטוגרפי מובטח בשלב האימות.</p>\n<p>מספרים אקראיים והקשר ההקמה נכללים בגזירת המפתחות כדי להבחין בין חיבורים ולהקטין שימוש חוזר בלתי רצוי בחומר מפתחות. נגזרים מפתחות נפרדים לכיווני התעבורה; באותו כיוון הצד המצפין והצד המפענח משתמשים בסוד הסימטרי המתאים. לאחר ההקמה אין צורך להצפין כל הודעת יישום בעזרת המפתח הציבורי שבתעודה. ההצפנה הסימטרית מגינה על התעבורה, ואימות השלמות מונע שינויים שקטים. כל זאת עדיין תלוי בבדיקה נכונה של זהות השרת ובהגנת המפתחות.</p>","title":"TLS","old_number":4,"id":"P19","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":19}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"משלים","evidence":["Q134","Q158"],"mock":2,"answer_origin":"תרגיל 4 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P19.html"},{"stem":"תוקף באותה רשת מקומית מרעיל בהצלחה את טבלאות ARP של אליס ושל שער ברירת המחדל, ומעביר את החבילות ביניהם. מה מתקבל מכך לבדו?","options":["מיקום ברשת המאפשר תיווך בתעבורה, בלי יכולת אוטומטית לפענח TLS תקין.","מיקום ברשת המאפשר תמיד לפענח TLS בלי להשיג מפתח נוסף.","יכולת לצפות בתעבורה בלבד, בלי יכולת לחסום או לשנות חבילות.","הסטת שמות במטמון DNS כצעד הכרחי של כל הרעלת ARP."],"topic":"רשתות: ARP, DNS, DoS ו-Firewall","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>ההרעלה משנה מיפוי IP לכתובת MAC ולכן יכולה להסיט מסגרות אל התוקף. זו יכולת רשת של MitM, ולא פריצה למנגנוני ההצפנה או האימות שמעליה. חיבור TLS עם אימות תעודה תקין עדיין מגן על התוכן והשלמות. התוקף יכול לשבש או לחסום תעבורה; כדי לקרוא אותה נדרשת חולשה או פגיעה נוספת.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>נפריד בין שתי שכבות. בשכבת הקישור אליס שולחת מסגרות לכתובת MAC שקיבלה ממנגנון ARP. אם המיפוי הוחלף, התוקף יכול לקבל ולהעביר אותן וכך להימצא בדרך. בשכבת TLS יש בדיקות קריפטוגרפיות שאינן מסתמכות רק על MAC של השכן המקומי. לכן שינוי המסלול אינו מספק מפתח פענוח או תעודת אתר מתקבלת. המסיח המגביל את התוקף לצפייה בלבד שגוי, כי מיקום מתווך עשוי לאפשר גם השמטה או שינוי של חבילות. גם שינוי DNS אינו שלב חובה של ARP: מדובר במנגנוני מיפוי שונים.</p>\n<h3>מסלול החבילה לפני ההרעלה ואחריה</h3>\n<p>ברשת מקומית יש להבחין בין כתובת היעד של חבילת האינטרנט לבין כתובת המתאם שאליו נמסרת המסגרת המקומית. כתובת אינטרנט מזהה את היעד הלוגי של התקשורת, ואילו כתובת חומרה משמשת למסירת מסגרת ברשת המקומית. כאשר היעד נמצא באותה רשת, המחשב צריך למצוא איזו כתובת חומרה מתאימה לכתובת האינטרנט שלו. פרוטוקול פתרון הכתובות מספק את המיפוי הזה ושומר אותו במטמון כדי שלא יהיה צורך לשאול מחדש בכל מסגרת.</p>\n<p>הכשל שנוצל במודל השאלה הוא היעדר אימות קריפטוגרפי של הודעות המיפוי. התוקף משדר הודעה שלפיה כתובת האינטרנט של הקורבן האחר נמצאת בכתובת החומרה של התוקף. הקורבן מעדכן את המטמון וממשיך לבנות חבילות לאותו יעד מקורי, אך עוטף אותן במסגרת המיועדת לתוקף. אם התוקף מעביר את החבילות הלאה, התקשורת עשויה להיראות רגילה והמשתמשים אינם מקבלים בהכרח סימן גלוי להרעלה.</p>\n<h3>יכולות התוקף וגבולות ההתקפה</h3>\n<p>כדי לקבל מיקום בין שני הצדדים בדרך כלל מרעילים את המיפוי בכל אחד מהם, או את המיפוי בין הקורבן לשער ברירת המחדל. התוקף יכול אז לצפות, לעכב, להשמיט ולהעביר מסגרות, ובהיעדר הגנות גבוהות יותר גם לשנות נתונים. מכאן לא נובעת ידיעה של מפתח הצפנה: כאשר מופעל ערוץ מוצפן ומאומת כראוי, הנתונים נשארים מוצפנים ושינויים בלתי מורשים מתגלים. עצם ההגעה לתעבורה אינה מאפשרת לייצר חתימה דיגיטלית בשם אחר.</p>\n<p>המושג הזרקה מחוץ לנתיב מתאר כאן תוקף שיש לו גישה מתאימה לאותו תחום שידור, אך עדיין אינו מעביר את התקשורת דרכו. ההרעלה היא שיוצרת לו עמדה כזאת. אין פירוש הדבר שכל מחשב מרוחק באינטרנט יכול לשלוח הודעות כאלה דרך נתבים. יש גם להבחין מהצפת טבלת מתג: זו התקפה על למידת מיקומי כתובות חומרה במתג, בעוד כאן משנים את הבנת המחשבים לגבי הקשר בין שתי שכבות כתובות. בקרות ברשת המקומית או אימות הערוץ בשכבות העליונות מתמודדים עם היבטים שונים של הבעיה.</p>","title":"ARP","old_number":10,"id":"P20","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":20}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"משלים","evidence":["Q154","Q171"],"mock":2,"answer_origin":"תרגיל 10 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P20.html"},{"stem":"בארגון 20 עובדים. במודל סימטרי מפתח שונה לכל זוג לא מסודר, ובמודל א-סימטרי זוג אישי לכל עובד. מה נדרש?","options":["190 מפתחות סימטריים ו-20 זוגות א-סימטריים","380 מפתחות סימטריים ו-40 זוגות","400 מפתחות סימטריים ו-20 זוגות","20 מפתחות סימטריים ו-190 זוגות"],"topic":"RSA, מפתח ציבורי וחתימות","answer_html":"<p>מספר הזוגות הלא מסודרים הוא 20×19/2=190. המכפלה 20×19 סופרת גם אליס–בוב וגם בוב–אליס, ולכן מחלקים בשתיים. במודל הא-סימטרי לכל אחד מ-20 העובדים זוג אחד, כלומר 20 זוגות או 40 רכיבי מפתח.</p><p>המסיח 380 מכפיל כיוונים; 400 סופר גם תקשורת עצמית. 20 מפתחות סימטריים אינם נותנים מפתח עצמאי לכל זוג. התרגיל מבוסס כרגע על הופעה מפורשת אחת במועד א האחרון, ולכן הוא תרגול ממוקד של פער בתחזית הקודמת ולא נושא בעל חזרתיות מוכחת גבוהה. אם משנים את הדרישה למפתח שונה לכל כיוון, התשובה הסימטרית משתנה ל-380; תמיד מתחילים מקריאת הנחת הספירה.</p><h3>העמקה ודוגמה נוספת מהבחינה המקורית</h3><p><strong>נדרשים 4,950 מפתחות סימטריים ו-100 זוגות מפתחות א-סימטריים.</strong> במודל הסימטרי שהוגדר, כל זוג עובדים מקבל סוד אחר. זוג אליס–בוב הוא אותו זוג כמו בוב–אליס, ואין צורך בזוג של עובד עם עצמו. לכן מספר הסודות השונים הוא מספר הזוגות הלא מסודרים מתוך 100 עובדים.</p><pre dir=\"ltr\">C(n,2) = n(n-1)/2\n100 * 99 / 2 = 4,950\nAsymmetric: 100 key pairs = 100 public + 100 private keys</pre><p>המספר 9,900 סופר כל זוג פעמיים, פעם לכל כיוון. מודל שבו חייבים מפתח שונה לכל כיוון היה נותן תשובה אחרת, אבל אינו מה שנכתב. 10,000 כולל גם תקשורת עצמית וגם ספירה לפי כיוון. שימוש במפתח סימטרי אחד לכל הארגון מאפשר לכל עובד לקרוא תקשורת של האחרים, ולכן אינו עומד בדרישה.</p><p>במודל הא-סימטרי לכל עובד זוג אישי. כדי לשלוח לבוב, מצפינים באמצעות המפתח הפומבי של בוב; בוב מפענח בפרטי שלו. 100 זוגות הם 200 רכיבי מפתח, ולכן צריך לקרוא היטב אם החלופה סופרת ״מפתחות״ או ״זוגות״. אין צורך בזוג נפרד לכל זוג מתקשרים במודל הזה.</p><p>הספירה אינה טענה שמערכת אמיתית תשתמש רק ב-100 זוגות לכל מטרותיה. בפועל ייתכנו מפתחות סשן, הפרדה בין חתימה להצפנה, החלפה תקופתית ומפתחות לתעודות. גם אמינות המפתחות הפומביים אינה מגיעה מספירתם: צריך לוודא שהמפתח המזוהה עם בוב אכן שלו. השאלה היא תרגיל ניהול מפתחות תחת הנחות פשוטות. דרך טובה לזכור את הנוסחה היא לצייר ארבעה עובדים: יש שש צלעות, ולא 12 או 16.</p><p>להסבר המלא של המנגנון ולניתוח המסיחים: <a href=\"solutions/Q178.html\">פתרון Q178</a>.</p>","title":"זוגות מפתחות לעומת רכיבי מפתח","guide":"Q178","id":"P21","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":21}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"ממוקד","evidence":["Q178"],"mock":3,"answer_origin":"וריאציה חדשה לצורך תרגול מועד ב׳","accepted_indices":[0],"solution":"solutions/P21.html"},{"stem":"בהצפנת ECB תחת אותו מפתח התקבל plaintext הבנוי משלושה בלוקים P || Q || P. מה מתקיים תמיד?","options":["בלוק ה-ciphertext הראשון שווה לשלישי.","כל שלושת בלוקי ה-ciphertext שונים בהכרח.","הבלוק הראשון שווה לשני גם אם P≠Q.","ECB מוסיף MAC אוטומטית לכל בלוק."],"topic":"הצפנה סימטרית וצפנים קלאסיים","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>ECB מחשב לכל בלוק בנפרד C_i=E_K(P_i). אותה תמורה דטרמיניסטית מוחלת על שני מופעים של P ולכן תוצאותיהם זהות. אם P≠Q, הפיכות צופן הבלוקים מבטיחה שהפלטים עבורם שונים. דליפת שוויון הבלוקים חושפת תבניות; היא אינה מגלה בהכרח את ערך P עצמו. ECB הוא מצב הצפנה ואינו כולל אימות MAC.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>רושמים שלוש פעולות נפרדות: הפעלת אותו צופן ואותו מפתח על P, על Q ושוב על P. הפלט הראשון והשלישי זהים מפני שהאלגוריתם אינו מקבל בהפעלה הזו מספר בלוק או וקטור משתנה. אם P שונה מ-Q, גם הפלט השני שונה בשל היות הצופן תמורה הפיכה; אחרת היה אי אפשר לדעת איזה קלט לפענח מאותו פלט. השאלה בודקת חשיפת תבנית ולא דורשת למצוא את המפתח או את תוכן P. הוספת אימות היא דרישה נפרדת, ולכן אסור לייחס ל-ECB תג MAC שאינו חלק מהגדרתו.</p>\n<h3>הבלוק, המפתח ושיטת ההפעלה</h3>\n<p>צופן בלוקים מגדיר פעולה הפיכה על מקטע בגודל קבוע תחת מפתח סודי. עבור אותו מפתח ואותו בלוק קלט מתקבל אותו בלוק פלט, והפענוח באמצעות המפתח המתאים מחזיר את הקלט. הגדרה זו אינה אומרת כיצד להצפין מסמך ארוך, איך לטפל במקטע אחרון קצר או איך למנוע חשיפת דפוסים בין בלוקים. לצרכים האלה בוחרים שיטת הפעלה ומגדירים כללי אתחול וריפוד מתאימים.</p>\n<p>בשיטת ספר קוד אלקטרוני כל בלוק מוצפן בנפרד, בלי תלות במיקומו או בבלוקים שכנים. לפיכך שני בלוקים זהים באותה הודעה ובאותו מפתח חייבים לתת פלט זהה. אפשר לנצל את הכלל הזה בשאלת בחירה בלי לחשב את הסבבים הפנימיים של הצופן: מחלקים את המסר לפי גודל הבלוק, מזהים חזרות ומשווים את המקטעים המקבילים בכל הצעת פלט. ייצוג הקסדצימלי משתמש בשני תווים לכל בית, ולכן צריך להקפיד על גבולות הבלוק ולא להשוות רק קטעים שנראים דומים.</p>\n<h3>מה אפשר ללמוד ומה אי אפשר להסיק מן הדפוס</h3>\n<p>חזרת בלוקים היא גם חולשה: הצופן אינו מסתיר שהופיעו מקטעים שווים, אפילו אם אינו חושף מיד מה תוכנם. לכן צופן בלוקים שנחשב חזק אינו הופך כל שיטת הפעלה לבטוחה. שימוש מעשי דורש בחירה לפי תכונות המידע והאיומים, ובדרך כלל גם אימות שלמות שמונע החלפת בלוקים או שינויים לא מורשים. הצפנה וסודיות אינן אותו דבר כמו הרשאה או מקור מאומת.</p>\n<p>ריפוד הוא עניין נפרד. אם מדיניות ההצפנה מוסיפה תמיד בלוק ריפוד גם כשהמסר כבר באורך מדויק, הפלט יהיה ארוך יותר ממספר בלוקי המסר המקוריים. בשאלה המציגה רק את שני הבלוקים המוצפנים צריך לקרוא את ההנחות ולא להמציא בלוק נוסף. גם אורך מפתח אינו גודל בלוק, והיותו מחרוזת קריאה אינו משנה את הכלל הדטרמיניסטי. לעומת הצפנה סימטרית, אלגוריתם מפתח ציבורי מחלק את יכולות ההצפנה או האימות והפענוח או החתימה בין מפתחות שונים. מדיניות דפדפן או יומן תעודות אינם כלל אלגוריתמי להצפנת בלוקים, גם אם מופיעות בהם אותיות לועזיות דומות.</p>","title":"blockcipher","old_number":18,"id":"P22","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":22}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"ליבה","evidence":["Q166","Q064"],"mock":3,"answer_origin":"תרגיל 18 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P22.html"},{"stem":"פונקציה למחרוזות a–z מחשבת את סכום מספרי האותיות מודולו 26, כאשר a=0 ו-b=1. איזה זוג הוא התנגשות מפורשת?","options":["ab וכן ba","a וכן b","a וכן c","b וכן c"],"topic":"Hash, MAC וסיסמאות","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>h(ab)=(0+1) mod26=1 וגם h(ba)=(1+0) mod26=1, בעוד המחרוזות שונות. חילופיות החיבור מספקת כאן מתקפה מיידית, מעבר לעובדה שיש רק 26 פלטים. בזוגות a,b,c בעלי אות אחת הפלטים הם 0,1,2 ולכן אינם מתנגשים זה בזה. התנגשות מפורשת עדיפה על אמירה כללית שלפיה חייבות להיות התנגשויות.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>הוכחה באמצעות זוג קלטים מפורש מספיקה לפסול עמידות להתנגשויות. כאן אין צורך לחפש באקראי: סדר האיברים אינו משפיע על סכום, ולכן החלפת שני תווים נותנת אותו פלט. אפשר להראות משפחה נוספת: הוספת a, שערכה אפס, אינה משנה סכום כלל. דוגמאות אלה מסבירות כיצד תוקף משנה תוכן תוך שמירה על digest. שלוש החלופות עם אות אחת שונות מקבלות כאן מספרים שונים, ולכן הן אינן דוגמאות להתנגשות. אין להסיק מכך ש-hash קריפטוגרפי אמיתי אינו בטוח רק מפני שיש לו פלט סופי; הבעיה היא מציאה יעילה של זוג מתאים.</p>\n<h3>שלוש בעיות חיפוש שונות</h3>\n<p>פונקציית גיבוב ממפה מסרים באורכים שונים לתוצאה באורך קבוע. מכיוון שיש יותר מסרים מתוצאות אפשריות, קיימים בהכרח מסרים שונים בעלי אותה תוצאה. דרישת האבטחה אינה שאין התנגשויות כלל, אלא שלא תהיה לתוקף דרך מעשית למצוא את ההתאמות המסוכנות הנדרשות בתקיפה. כדי להבין איזו תכונה נשאלת צריך קודם לשאול מה כבר ניתן לתוקף ומה הוא רשאי לבחור בעצמו.</p>\n<p>בעמידות לקדם־תמונה התוקף מקבל תוצאה ומנסה למצוא מסר שמגיע אליה. הוא אינו חייב למצוא דווקא את המסר המקורי; כל מסר בעל אותה תוצאה מספיק. בעמידות לקדם־תמונה שנייה התוקף מקבל מסר מסוים, וצריך למצוא מסר אחר בעל אותו גיבוב. בעמידות להתנגשויות שני המסרים נתונים לבחירתו, כל עוד יהיו שונים ויגיעו לאותה תוצאה. ההבדל בין קיבוע מסר אחד לבין בחירת שני מסרים מסביר מדוע שמות התכונות אינם ניתנים להחלפה.</p>\n<h3>קישור למקרה מעשי ולמסיחים</h3>\n<p>במערכת אימות סיסמאות, נתון חשבון מסוים עם ערך בדיקה שנוצר מסיסמה מסוימת. אם סיסמה שונה עוברת את אותה בדיקה תחת אותו ערך המלחה, שני קלטים שונים הובילו לאותו גיבוב. עצם האירוע הוא התנגשות; תקיפה מכוונת של החשבון הקבוע נוגעת לקדם־תמונה שנייה. הוספת ערך המלחה אינה מבטלת את האפשרות המתמטית להתנגשויות, אך מונעת שימוש באותו חישוב מוקדם עבור משתמשים רבים.</p>\n<p>לשם השוואה, מציאת שני מסרים עם תוצאות שונות היא פעולה קלה ורצויה. אם כמעט כל מסר היה מקבל אותה תוצאה, הפונקציה הייתה חסרת תועלת לזיהוי שינויים. גם יצירת מחרוזת תוצאה שונה מזו שניתנה אינה מעידה על קושי קריפטוגרפי. לכן חלופות שמחליפות את סימן השוויון באי־שוויון אינן וריאציה קטנה של ההגדרה אלא טענה אחרת לגמרי. מונחים מתחומים כגון תעודות, כפיית הצפנה או סוד נוסף באחסון סיסמאות עשויים להיות קשורים להגנה הכוללת, אך אינם מגדירים את בעיית החיפוש של הגיבוב עצמו. הבחירה הנכונה מבוססת על הקלט, יעד החיפוש ותנאי ההצלחה.</p>","title":"hash","old_number":22,"id":"P23","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":23}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"ממוקד","evidence":["Q182"],"mock":3,"answer_origin":"תרגיל 22 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P23.html"},{"stem":"מסד סיסמאות שומר לכל משתמש salt אקראי ו-h(salt || password). תוקף גנב את המסד. מה נכון לגבי salt?","options":["הוא מקשה על שימוש חוזר בחישובי מילון בין משתמשים, אך אינו מונע ניחוש offline לכל משתמש.","הוא חייב להישמר בסוד גם מהשרת.","הוא מבטיח שאין שתי סיסמאות הנותנות אותו hash.","הוא מאפשר לשחזר את הסיסמה המקורית בפענוח."],"topic":"Hash, MAC וסיסמאות","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>salt נשמר בדרך כלל ליד verifier הסיסמה. לכל מועמד התוקף יכול לחשב h(salt||candidate) ולהשוות, אך salt שונה מונע שימוש באותה טבלת חישובים לכולם. הוא אינו הופך hash להצפנה ואינו מסלק התנגשויות מתמטיות. במערכת מעשית מוסיפים פונקציית גזירת סיסמאות יקרה; תפקיד ה-salt עצמו הוא הפרדת החישוב ולא הסתרת הערך.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>כדאי לדמיין שני משתמשים שבחרו אותה סיסמה. בלי salt, אותו חישוב מועמד יכול להתאים לשניהם ואותה טבלה מוכנה מראש עשויה לשמש מול מסדים רבים. עם שני salts שונים, התוקף חייב לחשב עבור כל משתמש את השילוב המתאים. עם זאת salt מופיע בקובץ שנגנב, ולכן הוא אינו מונע מהתוקף לבדוק את המועמד ״123456״ מול אליס. הטענה הנכונה מצמצמת שימוש חוזר בחישובים ואינה מבטיחה סיסמאות חזקות. יש להבחין גם בין התנגשות מתמטית אפשרית לבין סיכוי מעשי לנחש סיסמה אנושית מתוך מרחב קטן.</p>\n<h3>מה צריך להישמר כדי שאפשר יהיה לבדוק סיסמה</h3>\n<p>שרת שאינו שומר סיסמאות גלויות צריך בכל זאת להיות מסוגל לבדוק ניסיון כניסה. לשם כך הוא שומר ערך בדיקה שאפשר לחשב מחדש מסיסמת הניסיון ומפרמטרים זמינים. ערך המלחה אקראי ושונה לכל משתמש נשמר לצד ערך הבדיקה ואינו אמור להיות סוד. הוא גורם לכך שגם שתי סיסמאות זהות של משתמשים שונים יניבו קלטי גיבוב שונים, ולכן תוקף אינו יכול להשתמש באותה טבלת חישובים מוכנה עבור כולם.</p>\n<p>סוד נוסף הנשמר בנפרד ממסד הנתונים ממלא תפקיד אחר: הוא מקשה על מי שגנב רק את הטבלה לבצע ניחושים לא מקוונים. כדי שההגנה תהיה רלוונטית, הסיסמה, ערך ההמלחה והסוד הנוסף צריכים להשפיע על אותו ערך בדיקה. אם שומרים גיבוב חשוף של הסיסמה ולצידו גיבוב אחר של פרמטרים, התוקף יכול להתעלם מן הרכיב השני ולבדוק את הראשון לבדו. זו דוגמה לכך שצירוף שמות של מנגנונים אינו מספיק; צריך לנתח מה נדרש לכל ניסיון ניחוש.</p>\n<h3>זמינות פרמטרים ועלות ניחוש</h3>\n<p>הסתרת ערך ההמלחה באמצעות גיבוב בלבד יכולה דווקא לשבור את האימות החוקי: השרת מכיר את סיסמת הניסיון אך אינו יודע איזה ערך צריך לשרשר אליה. אם הערך המקורי אקראי וארוך, אין דרך מעשית לשחזר אותו מהגיבוב. קושי שהתכוון המפתח להטיל על התוקף הוטל במקרה זה גם על עצמו. לעומת זאת, שרשור שם משתמש שמור או הפעלת גיבוב נוסף הם חישובים שאפשר לשחזר מן הנתונים הזמינים.</p>\n<p>הגדלת מספר סבבי החישוב יכולה להעלות את המחיר של כל ניחוש. השרת מבצע את החישוב רק בכניסות לגיטימיות, בעוד תוקף שבודק מיליוני סיסמאות משלם את העלות שוב ושוב. הגרלת הרבה ערכי המלחה ושמירת האחרון בלבד אינה משיגה זאת, כי בבדיקת ניחוש לא חוזרים על ההגרלות שנזרקו. עלות מכוונת חייבת להיות חלק מחישוב ערך הבדיקה. פתרונות מעשיים משתמשים בפונקציית גזירת סיסמאות ייעודית ובפרמטרי עלות, אך בשאלה יש לנתח קודם את המבנה המוצע ולא להניח שכל שימוש בפונקציית גיבוב הוא בטוח אוטומטית.</p>","title":"password","old_number":11,"id":"P24","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":24}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"משלים","evidence":["Q103","Q136"],"mock":3,"answer_origin":"תרגיל 11 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P24.html"},{"stem":"איזה זוג כתובות שייך לאותו origin, כאשר מתעלמים מפורטים ברירת מחדל שנכתבו במפורש?","options":["https://shop.example/a וכן https://shop.example/b","http://shop.example וכן https://shop.example","https://shop.example:8443 וכן https://shop.example","https://shop.example וכן https://api.shop.example"],"topic":"אבטחת Web","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>origin נקבע לפי scheme, host ו-port. נתיב /a לעומת /b אינו משנה origin. לעומת זאת HTTP ו-HTTPS שונים בסכמה, 8443 שונה מפורט HTTPS הרגיל 443, ו-api.shop.example הוא host אחר. SOP הוא כלל בדפדפן להגבלת גישה בין מקורות; אין פירושו שהשרת מעניק אותה הרשאה לכל משתמש באותו origin.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>מפרקים כל כתובת לשלושה רכיבים ורק אז משווים. שני הנתיבים בדוגמה נשארים באותו host ובאותו פורט HTTPS ולכן אין ביניהם גבול origin. לעומת זאת תת דומיין אחר אינו זהה ל-host המקורי, אפילו אם אותו אדם מפעיל את שניהם. גם פורט מפורש שמספרו שמונה ארבע ארבע שלוש אינו הפורט התקני ארבע ארבע שלוש. לעיתים מתבלבלים בין origin לבין site המשמש במדיניות cookies; אלה מושגים שונים. החלופה הנכונה עוסקת בבידוד הדפדפן בלבד, ואינה מעניקה למשתמש הרשאה לקרוא כל מידע שהשרת מאחסן תחת אותו origin.</p>\n<h3>ההבחנה בין שליחת בקשה לקריאת תשובה</h3>\n<p>מדיניות המקור הזהה מגבילה יכולת של קוד שמגיע ממקור אחד לקרוא מידע רגיש של מקור אחר. מקור מוגדר לפי סכימה, שם מארח ופורט, ולא רק לפי הופעת שם דומה בכתובת. לדוגמה, קוד באתר תוקף אינו רשאי לקבל את תוכן עמוד החשבון באתר בנק רק מפני שהמשתמש מחובר לשניהם באותו דפדפן. בלי הפרדה כזאת כל אתר שהמשתמש פותח היה יכול לנסות לקרוא מידע מכל שירות שבו נשמרה הרשאה.</p>\n<p>עם זאת, הדפדפן מאפשר פעולות רבות שחוצות מקורות כחלק רגיל מהאינטרנט: הצגת תמונה, ניווט ושליחת טופס הם דוגמאות מרכזיות. מכאן נובע ההבדל בין היכולת לגרום לבקשה לצאת לבין היכולת לקרוא את תשובתה. תוקף עשוי לא להיות מסוגל לראות את גוף התגובה ובכל זאת להצליח לגרום לפעולה שמשנה מצב בשרת. תשובה ריקה אף מדגישה שלא תמיד יש צורך לגנוב מידע כדי לגרום נזק.</p>\n<h3>מדוע נדרשת הגנה נפרדת על פעולות רגישות</h3>\n<p>כאשר עוגיית כניסה נשלחת אוטומטית בבקשה, השרת יודע לאיזה סשן הבקשה שייכת, אך אינו יודע בהכרח אם המשתמש התכוון להפעיל אותה. אתר תוקף יכול לגרום לדפדפן לבקר בכתובת פעולה או להגיש טופס. טוקן אקראי הקשור לסשן, בדיקת הקשר מקור והגבלת עוגיות בין אתרים מספקים שכבות אימות נוספות. עצם השימוש בעוגיות או בשיטת בקשה מסוימת אינו הוכחה שהפעולה יזומה ומותרת.</p>\n<p>המדיניות גם אינה מונעת קוד שכבר רץ בתוך המקור הפגיע מלקרוא את תוכנו. בהזרקת סקריפט מוצלחת התוקף אינו מבקש לקרוא מבחוץ; הוא גרם לאתר עצמו להריץ את הקוד שלו. לכן טענה שהפרדה בין מקורות פותרת סוג מסוים של הזרקת סקריפט ומותירה רק סוג אחר אינה נכונה כעיקרון כללי. מאידך, קוד רגיל באתר זר שמנסה לקרוא ישירות עוגייה או תגובה של האתר האחר אכן אמור להיחסם, אלא אם ניתנה הרשאה מתאימה. שיטת הניתוח היא תמיד לזהות את מקור הקוד, את משאב היעד ואת הפעולה המדויקת: קריאה, טעינה או שליחה.</p>","title":"SOP","old_number":16,"id":"P25","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":25}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"משלים","evidence":["Q126","Q145"],"mock":3,"answer_origin":"תרגיל 16 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P25.html"},{"stem":"משתמש מתקין דפדפן חדש ונכנס לראשונה אל http://bank.example. בהנחה שהדומיין נמצא ברשימת preload של הדפדפן, מה מונע את שליחת בקשת ה-HTTP הראשונית?","options":["HSTS preload גורם לדפדפן לשדרג את הכתובת ל-HTTPS מראש.","כותרת HSTS שתתקבל רק בתשובת HTTP.","OCSP stapling לבדו.","הוכחת הכללה בעץ CT לבדה."],"topic":"TLS / HTTPS","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>רשימת preload מספקת לדפדפן את מדיניות HSTS לפני ביקור ראשון. לכן הדפדפן מחליף את הסכמה ל-HTTPS עוד לפני בקשת HTTP. כותרת HSTS נלמדת דרך חיבור HTTPS מהימן, ולא ניתן לבסס אמון בכותרת שנשלחה ב-HTTP בלתי מוגן. OCSP עוסק בסטטוס תעודה ו-CT בשקיפות הנפקתה; אף אחד מהם אינו מחייב כשלעצמו שדרוג כתובת HTTP.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>הפרט המכריע הוא ״דפדפן חדש״: אין בו מדיניות שנלמדה מביקור קודם. אילו היה נשלח קודם HTTP והתוקף היה שולט בקישור, הוא היה יכול להסיר הפניה או להחזיר עמוד אחר לפני שהדפדפן הגיע לערוץ המוגן. preload משנה את סדר הפעולות: ההחלטה להשתמש ב-HTTPS מתקבלת מקומית עוד לפני הבקשה הראשונה. בדיקת ביטול או שקיפות תעודה מתרחשת בהקשר של תעודה שכבר הוצגה בחיבור המוגן; היא אינה מונעת את יצירת בקשת ה-HTTP הראשונית. גם אז אסור לדפדפן לקבל תעודה בלתי תקינה רק בגלל קיום preload.</p>\n<h3>כיצד הדפדפן לומד שאין להשתמש בחיבור פתוח</h3>\n<p>כאשר משתמש מקליד כתובת שאינה מציינת ערוץ מוצפן, או פותח קישור המתחיל בפרוטוקול פתוח, הפניה רגילה של השרת לערוץ מוצפן מגיעה רק אחרי שהבקשה הראשונה כבר יצאה. תוקף השולט בדרך עשוי לנצל את הבקשה הזאת כדי לשנות את ההפניה או להחזיר תוכן משלו. מדיניות אבטחת תעבורה מחמירה מאפשרת לדפדפן לזכור מראש שעבור שם אתר מסוים אין להתחיל בערוץ הפתוח, אלא לשדרג מקומית לערוץ מוצפן עוד לפני יציאת הבקשה.</p>\n<p>במסלול הלמידה הרגיל האתר שולח כותרת מדיניות בתגובה שהתקבלה בחיבור מוצפן ומאומת. הכותרת כוללת משך זמן שבו המדיניות נשמרת, ולעיתים מציינת שגם שמות המשנה נכללים. הדפדפן אינו אמור לסמוך על הוראה כזאת שנשלחה בחיבור פתוח, כי תוקף יכול היה ליצור אותה. לאחר שלמד את המדיניות, גם הקלדה מפורשת של כתובת פתוחה לא מחייבת שליחת בקשה פתוחה בפועל.</p>\n<h3>בעיית הביקור הראשון והמשמעות של טעינה מראש</h3>\n<p>הזיכרון המקומי אינו פותר לבדו ביקור בדפדפן שמעולם לא פגש את האתר. לרשימת טעינה מראש יש תפקיד שונה: המידע שהאתר מחייב ערוץ מוצפן נכלל במידע שמופץ עם הדפדפן, ולכן ניתן לשדרג גם בביקור הראשון. זאת הנקודה שמכריעה בשאלה אם אפשר להבטיח את המדיניות ללקוחות חדשים לגמרי, ולא רק לאלו שכבר קיבלו כותרת תקפה.</p>\n<p>המנגנון אינו מאמת בעצמו שתעודת השרת הונפקה כראוי, אינו מחליף שרשרת אמון ואינו מאחסן סטטוס ביטול תעודה. הוא קובע באיזה סוג ערוץ מותר לנסות להשתמש, והערוץ המוצפן עדיין צריך לעבור את בדיקותיו הרגילות. גם הגבלת גישה בין מקורות וטוקנים נגד זיוף בקשות פותרים בעיות אחרות: אתר יכול לחייב הצפנה ועדיין להיות פגיע לקוד מוזרק או לפעולה שנשלחה ללא כוונת המשתמש. יש גם משמעות להגדרת שמות המשנה ולמשך המדיניות; הצהרה על אתר אחד אינה מחילה אוטומטית מדיניות על כל אתר בעל שם דומה.</p>","title":"HSTS","old_number":7,"id":"P26","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":26}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"משלים","evidence":["Q141","Q160"],"mock":3,"answer_origin":"תרגיל 7 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P26.html"},{"stem":"שרת מגדיר CSP המאפשר הרצת סקריפטים רק עם nonce אקראי ייחודי לתגובה, ללא unsafe-inline. מהי מטרת ההגדרה?","options":["להגביל הרצת סקריפטים ולעזור לצמצם ניצול XSS.","להצפין את גוף תגובת HTTP.","להחליף בדיקת anti-CSRF token בכל endpoint.","להוכיח שהתעודה לא בוטלה."],"topic":"אבטחת Web","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>מדיניות script-src עם nonce מאפשרת לדפדפן להבחין בין סקריפט שאושר לתגובה לבין הזרקה ללא nonce מתאים. היא שכבת הגנה משלימה ואינה תחליף לקידוד פלט ולטיפול בטוח ב-DOM; דליפת nonce או תכנון פגום עלולים להחלישה. CSP אינו פרוטוקול הצפנה, אינו מגדיר הרשאות לבקשות שמשנות מצב ואינו מנגנון ביטול תעודות.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>בתרחיש של השאלה השרת יוצר nonce חדש לתגובה ומצמיד אותו לסקריפטים שהוא רוצה לאשר. הזרקה פשוטה של תג סקריפט ללא הערך הזה לא אמורה לקבל הרשאת הרצה מן המדיניות. אם משתמשים באותו nonce קבוע בכל תגובה, או חושפים אותו דרך תכנון פגיע, תכונת ההפרדה עלולה להיחלש. משום כך אין להסיק שדי בהופעת הכותרת כדי שהאתר יהיה חסין. גם מדיניות נכונה אינה משנה את הצפנת התעבורה ואינה מחליטה אם בקשת העברה בנקאית מורשית; יש להצמיד כל אחד מן המסיחים למנגנון שאכן מספק אותו.</p>\n<h3>מדיניות שמגבילה מה העמוד רשאי לטעון</h3>\n<p>דף אינטרנט הוא מסמך שמסוגל לטעון רכיבים ממקורות רבים: קוד, תמונות, גופנים, מסגרות ועוד. בלי מגבלה נוספת, חולשת הזרקה עשויה לאפשר לתוקף להוסיף הוראה שטוענת קובץ קוד משרת שבשליטתו. מדיניות אבטחת תוכן מאפשרת לשרת למסור לדפדפן רשימת כללים שמגדירה אילו סוגי משאבים רשאים להגיע מאילו מקורות. הדפדפן אוכף את הכללים בזמן הטעינה או ההרצה, גם אם תגית שמבקשת משאב אסור כבר נמצאת במסמך.</p>\n<p>למשל, מדיניות שמאפשרת סקריפטים רק ממקור האתר יכולה לחסום תגית שמפנה לקובץ קוד באתר תוקף. אפשר להגדיר הוראות נפרדות לסקריפטים, תמונות וחיבורים, ולשלב מזהים אקראיים או גיבובים כדי לאשר קוד מסוים. המנגנון אינו מנחש מה בטוח מתוך שם הקובץ; הוא אוכף את המדיניות שהאתר ניסח. משום כך מדיניות רחבה מדי, או מקור מורשה שמאפשר לתוקפים להעלות תוכן פעיל, עלולים להשאיר מסלול תקיפה.</p>\n<h3>ההבדל מהצפנה ומאימות בקשות</h3>\n<p>הכללים אינם מצפינים את המסמך ואינם מסתירים אותו ממאזין בדרך. סודיות התעבורה ניתנת באמצעות ערוץ מוצפן. הם גם אינם דורשים מהמשתמש להקליד טוקן לכל פעולה, ואינם מחליפים אימות שהבקשה אכן נוצרה מתוך הטופס והסשן המתאימים. אתר יכול לקיים מדיניות תוכן טובה ובכל זאת לקבל בקשת פעולה מזויפת אם אינו בודק את מקור הכוונה וההרשאה.</p>\n<p>תפקידה העיקרי בהקשר השאלה הוא שכבת צמצום נזק מול הזרקת תוכן פעיל. היא משלימה קידוד פלט נכון ואינה מבטלת את הצורך בו, משום שלא כל תוכן מסוכן חייב להגיע מקובץ חיצוני חדש. גם שקיפות תעודות ובדיקת ביטול אינן שייכות לכללים האלה: הן עוסקות בזהות מפתח האתר ובתוקף האמון בו, בעוד כאן מגדירים התנהגות של המסמך לאחר שהגיע לדפדפן. בעת ניתוח חלופות צריך לבדוק איזה נכס כל מנגנון מגן עליו, ולא לבחור לפי כך שכל השמות קשורים באופן כללי לאבטחת רשת.</p>","title":"CSP","old_number":8,"id":"P27","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":27}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"משלים","evidence":["Q161","Q131"],"mock":3,"answer_origin":"תרגיל 8 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P27.html"},{"stem":"איזו פעולה היא ההגנה הישירה ביותר מפני SQL injection כאשר ערך שהמשתמש מסר צריך להיכנס לתנאי WHERE?","options":["שאילתה עם פרמטר קשור, כך שהערך מטופל כנתון ולא כתחביר SQL.","מחיקת המילה union פעם אחת מן הקלט.","בדיקת JavaScript בדפדפן בלבד.","הגדרת X-Frame-Options ללא שינוי השאילתה."],"topic":"אבטחת Web","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>פרמטריזציה מפרידה בין מבנה השאילתה לבין ערכי הנתונים. מחיקת מילות מפתח ניתנת לעקיפה ואינה מתמודדת עם כל תחביר מסוכן. בדיקת לקוח ניתנת לעקיפה באמצעות בקשה ישירה. X-Frame-Options שולט בהטמעת דפים במסגרת ואינו משנה כיצד מסד הנתונים מפרש SQL. גם ORM או stored procedure עלולים להיות פגיעים אם הם בונים SQL דינמי בשרשור.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>לדוגמה, ערך שמכיל גרש ומילות SQL צריך להישאר ערך מחרוזת אחד ולא לסיים את המחרוזת בשאילתה. פרמטר קשור מוסר למסד את הערך בנפרד מן מבנה הפקודה. לעומת זאת החלפת המילה union יכולה להשאיר מתקפות שאינן משתמשות בה כלל, ואף לייצר מחדש מילה מסוכנת אחרי החלפה. בדיקת לקוח משפרת שימושיות אך התוקף אינו מחויב להפעיל אותה. כאשר שם טבלה או עמודה חייב להיות דינמי, לא תמיד אפשר לקשור אותו כערך רגיל; נדרשת רשימת שמות מורשים ובניית מבנה מבוקרת. זו מגבלה שמסבירה מה פרמטריזציה עושה ומה לא.</p>\n<h3>מתי קלט מפסיק להיות נתון והופך לתחביר</h3>\n<p>הזרקת שאילתות מתרחשת כשהיישום בונה פקודת מסד נתונים באמצעות חיבור טקסט של קלט משתמש אל קטעי פקודה. התוקף מנצל את העובדה שמפרש השאילתה אינו מכיר את הגבול שהמפתח התכוון להציב בין ערך הסיסמה לבין אופרטורים, תנאים והערות. אם גרש בקלט סוגר את מחרוזת הנתונים, ההמשך עלול להתפרש כפקודה ולא כשם משתמש או סיסמה.</p>\n<p>דרך מסודרת לבדוק חלופה היא להציב את הקלט בדיוק בתוך תבנית השאילתה, כולל הגרש הפותח, הגרש הסוגר והטקסט שמגיע אחריו. אחרי ההצבה מסמנים אילו חלקים נשארים בתוך מחרוזות ואילו חלקים הפכו לתחביר. לא מספיק לזהות את המילה המציינת או ואת התנאי שתמיד מתקיים; אם נשאר גרש עודף בסוף השאילתה, ייתכן שכל הביטוי ייכשל כשגיאת תחביר ולא יעקוף את האימות.</p>\n<h3>קדימות תנאים, הערות ותיקון מבני</h3>\n<p>תנאי חיבור לוגי מסוג וגם נבדק בדרך כלל לפני תנאי מסוג או. משום כך הוספת תנאי אמת באמצעות או יכולה להפוך את הביטוי הכולל לאמת גם כשהסיסמה אינה נכונה. הוספת אותו תנאי אמת באמצעות וגם אינה מבטלת את הצורך שסיסמת המקור תתאים. שימוש בהערת שורה עשוי לבטל את יתרת התנאי, אך יש לבדוק את תחביר מנוע המסד, לרבות דרישה אפשרית לרווח אחרי סימן ההערה. גרשיים טיפוגרפיים במסמך לימודי צריכים להתפרש כייצוג של התווים התחביריים המתאימים, ולא כהוכחה שכל תו מודפס יתקבל בכל מנוע.</p>\n<p>התיקון העקרוני הוא שימוש בשאילתה פרמטרית, שבה מבנה הפקודה נמסר בנפרד מן הערכים. כך המפרש מתייחס למחרוזת המשתמש כנתון גם כשהיא מכילה תווים מיוחדים. מנגנוני הצפנת תעבורה, הגנה מפני מסגור וטוקנים נגד זיוף בקשות אינם משנים את האופן שבו מסד הנתונים מפרש חיבור מחרוזות. גם סינון נקודתי של מילה או תו אינו תחליף להפרדה המבנית, משום שקיימות צורות תחביר רבות ותלויות הקשר. בשאלה מספיק להראות איזו הצבה יוצרת ביטוי חוקי ומעקף, ולמה יתר ההצבות נשארות טקסט, שגויות תחבירית או אינן משנות את תוצאת האימות.</p>","title":"SQLi","old_number":29,"id":"P28","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":28}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"רשת ביטחון","evidence":["Q060","Q095"],"mock":3,"answer_origin":"תרגיל 29 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P28.html"},{"stem":"resolver שולח בקשה יחידה עם TXID אקראי בן 16 ביט, ופורט המקור ידוע. תוקף off-path שולח תשובה מזויפת יחידה עם שאר השדות נכונים בזמן חלון התשובה. מה סיכוי ניחוש ה-TXID?","options":["1/65536","1/256","1/16","1/2"],"topic":"רשתות: ARP, DNS, DoS ו-Firewall","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>למזהה אחיד בן 16 ביט יש 2^16=65536 ערכים אפשריים. ניחוש אחד מול בקשה אחת מצליח בהסתברות 2^-16. סדר גודל של 256 קשור לפרדוקס יום ההולדת בתרחישים עם אפשרויות התאמה רבות, ואינו חל אוטומטית על ניחוש יחיד למזהה יחיד. אקראיות עצמאית של פורט המקור הייתה מוסיפה אי ודאות, אך השאלה מניחה שהפורט ידוע.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>בתרחיש יש יעד ניחוש אחד ומועמד אחד, ולכן הסיכוי הוא אחד חלקי מספר הערכים האפשריים ולא אחד חלקי שורשו. אם התוקף היה רשאי לשלוח מאה ניחושים שונים בזמן, היה אפשר לדון בהסתברות מצטברת; כאן אין לכך היתר. גם ״שש עשרה ביט״ אינו אומר שיש שש עשרה אפשרויות: כל ביט מכפיל את המרחב ולכן מתקבלות שישים וחמש אלף חמש מאות שלושים ושש. נוסף על הניחוש נדרשת התאמת שם הבקשה ושדות המקור והיעד וזכייה במרוץ מול התשובה האמיתית. ההסתברות שניתנה מתנה על כך ששאר התנאים שבשאלה אכן מתקיימים.</p>\n<h4>התאמת תשובת DNS לשאילתה והזדמנות הזיוף</h4>\n<p>resolver הוא רכיב המבקש תשובה לשם דומיין ושומר תוצאות לזמן מוגבל במטמון. כאשר פרוטוקול התשובה אינו מאומת קריפטוגרפית, רכיב המקבל צריך להחליט אם חבילה באמת שייכת לבקשה פתוחה. בין הנתונים הנבדקים נמצאים המזהה, שם השאילתה, השרת המצופה ופורט המקור של הבקשה. תוקף יכול לזייף מקור של תשובה ולנסות לפגוע בניחוש הערכים הדרושים לפני שמגיעה התשובה האמיתית. כניסה של ערך כוזב למטמון עלולה להשפיע גם על לקוחות נוספים המשתמשים בו.</p>\n<p>תוקף הנמצא בנתיב רואה יותר מידע מתוקף מרוחק שאינו רואה את הבקשה, אך אין פירוש הדבר שרק הראשון יכול לתקוף. אם המרחב לניחוש קטן והתוקף מקבל מספיק הזדמנויות, קיימת גם מתקפת off-path. מזהה אחיד בן שש עשרה סיביות נותן שישים וחמישה אלף וחמש מאות שלושים ושישה ערכים אפשריים; פורט אקראי עצמאי מוסיף אי־ודאות רק אם אינו ידוע לתוקף. חשוב להפריד בין סיכוי בניסיון בודד לבין סיכוי מצטבר לאורך ניסיונות חוזרים. מדיניות שמבטלת שאילתה אחרי תגובות שגויות עלולה למנוע גם את קבלת התשובה הנכונה וליצור מניעת שירות. הוספת זיהוי התקפה אינה שקולה לאימות התשובה, וגם התרעה אינה חסימה.</p>","title":"DNS","old_number":20,"id":"P29","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":29}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"רשת ביטחון","evidence":["Q037","Q171"],"mock":3,"answer_origin":"תרגיל 20 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P29.html"},{"stem":"שרת מקצה משאב לכל בקשת HTTP שטרם הסתיימה. תוקף שולח חלקי כותרות באיטיות ומשאיר חיבורים פתוחים. מהי ההתקפה ומה הגנה מתאימה?","options":["Slowloris; קצבי מינימום או מגבלות זמן לקבלת headers ומגבלות חיבורים עשויים לסייע.","SYN flood; הצפנת תעודת השרת לבדה פותרת זאת.","CSRF; החלפת שם cookie בלבד פותרת זאת.","CT split world; הוספת SCT בלבד פותרת זאת."],"topic":"רשתות: ARP, DNS, DoS ו-Firewall","answer_html":"<h3>ההכרעה ונימוקיה</h3>\n<p>המטרה כאן היא החזקת משאבי יישום באמצעות בקשות איטיות, לאחר יצירת חיבורים. מגבלת זמן ומגבלת קצב מפחיתות את משך החזקת המשאב, ויש לבחור אותן בלי לחסום משתמשים איטיים לגיטימיים. SYN flood תוקף בעיקר מצב של חיבור TCP שטרם הושלם. הצפנה, שינוי שם cookie או SCT אינם מטפלים בפני עצמם בבקשות HTTP האיטיות.</p>\n<h3>דרך פתרון ובדיקת החלופות</h3>\n<p>התוקף בתרחיש אינו צריך לשלוח את כמות הבתים המרבית; הוא רוצה שהשרת יחכה לו זמן רב. כל חיבור מחזיק משאב שאחרת היה יכול לשרת משתמש חדש. לכן הגנה ממוקדת יכולה להגביל זמן להשלמת כותרות או לדרוש קצב מינימום, ולצד זאת להגביל מספר חיבורים למשאב. מגבלה אגרסיבית מדי תפגע בלקוחות איטיים אמיתיים, ולכן יש שיקול תפעולי ולא רק כלל בינארי. השוואה ל-SYN flood מבהירה שהפרוטוקול הגיע לשלב אחר: כאן החיבור כבר קיים והמתנה היא למידע HTTP, ולא ל-ACK האחרון של הקמת TCP.</p>\n<h4>מניעת שירות היא פגיעה במשאב מוגבל</h4>\n<p>מטרת DoS היא להקשות על משתמשים לגיטימיים לקבל שירות. המשאב המותקף יכול להיות רוחב פס, זיכרון, מקום בטבלת חיבורים, זמן מעבד או משאב יישומי אחר. בהתקפה מבוזרת מקורות רבים פועלים יחד, למשל מחשבים נגועים ב־botnet, ולכן קשה יותר להסתפק בחסימת כתובת יחידה. אין הכרח שכל מקור יהיה מחשב אישי או שההתקפה תתרחש דווקא בשכבת הרשת; גם רכיבי תקשורת ומכשירי קצה יכולים להשתתף, וגם בקשות יישום יכולות להתיש שרת.</p>\n<p>Slowloris מדגימה שמתקפה אינה חייבת לשלוח כמות בתים עצומה. התוקף מחזיק בקשות HTTP לא שלמות ומתקדם באיטיות, כך שהשרת ממשיך להקצות להן משאבים. SYN flood פועלת בשלב אחר ומשתמשת במצב חיבור שטרם הושלם. ההבחנה קובעת מהי הגנה מועילה: הגבלת זמן לקבלת כותרות ומספר חיבורים מתאימה לבקשות איטיות, בעוד שמנגנון SYN cookies מטפל בהקצאת מצב מוקדמת בחיבור TCP. הגנה גורפת מדי יכולה לפגוע גם בלקוח איטי או בשירות גיבוי לגיטימי. לכן שיעור תעבורה גבוה הוא סימן לבדיקה ולא הוכחה לזדון, והסבר טוב צריך לזהות איזה משאב נשמר, באיזה שלב הוא מוקצה, וכיצד התוקף גורם לו להישאר תפוס.</p>\n<h4>לחיצת היד של TCP והמשמעות של RST</h4>\n<p>בחיבור TCP רגיל הלקוח שולח SYN, השרת מחזיר SYN+ACK, והלקוח משלים ACK. במימוש ששומר מצב כבר אחרי ההודעה הראשונה, כל ניסיון התחלה יכול לתפוס מקום גם לפני שנבדק שהמקור באמת מסוגל לקבל תשובה. SYN flood מנצלת זאת באמצעות הרבה ניסיונות שאינם מושלמים. אם כתובת המקור מזויפת, התשובה הולכת למחשב אחר ולא לתוקף, ולכן צריך לבחון מה אותו מחשב יעשה כשיקבל הודעה שלא ציפה לה.</p>\n<p>מחשב חי עשוי להחזיר RST עבור חיבור שאינו מכיר. הודעה זו יכולה לגרום לשרת לשחרר את המצב החצי פתוח, ולכן מבחינת התוקף זו תוצאה לא רצויה. בחירת מקורות שאינם משיבים מצמצמת את האפשרות הזו. מנגד, כאשר השרת משתמש ב־SYN cookies, הוא מקודד מידע מתאים במספר הרצף של תשובתו ואינו חייב לשמור את כל מצב החיבור מיד. רק ACK תקין מאפשר לשחזר ולאשר את המידע. המנגנון מצמצם סוג מסוים של התשת מצב, אך אינו מבטיח חסינות מהצפת רוחב פס או מכל תקיפת יישום. אין גם קשר בין המילה cookies כאן לבין cookie הזדהות של דפדפן. אלה עצמים שונים לגמרי, ולכן SYN cookies אינם הגנת CSRF ואינם בדיקת הרשאות של משתמש באתר.</p>","title":"DoS","old_number":30,"id":"P30","year":"תרגול","note":"תחזית לימודית, לא שאלה שנצפתה בבחינה עתידית","sources":[{"file":"predictions.html","date":null,"num":30}],"flags":[],"fixed_order":false,"exclude":false,"exam_count":0,"in_sample_exam":false,"variant_group":null,"priority":"רשת ביטחון","evidence":["Q002","Q172"],"mock":3,"answer_origin":"תרגיל 30 מהמאגר שנכתב ב-17/10/2026; נבחר מחדש לפי ההשוואה המעודכנת","accepted_indices":[0],"solution":"solutions/P30.html"}];

/* ---------- rich text (same rules as make_exam.py) ---------- */
const HEB = /[֐-׿]/;
function inline(text, rtl){
  if (text.includes('`')) return text.split('`').map((p,i) => i%2 ? `<bdi dir="ltr"><code>${esc(p)}</code></bdi>` : inline(p, rtl)).join('');
  const PH = {'<sub>':'\x01','</sub>':'\x02','<sup>':'\x03','</sup>':'\x04'};
  for (const [t,p] of Object.entries(PH)) text = text.split(t).join(p);
  const fin = s => { s = esc(s); for (const [t,p] of Object.entries(PH)) s = s.split(p).join(t); return s; };
  if (!rtl) return fin(text);
  let out = '', pos = 0; const re = /[A-Za-z0-9\x01\x03][^֐-׿]*/g; let m;
  while ((m = re.exec(text))){
    let run = m[0];
    const cnt = (s,c) => s.split(c).length-1;
    while (run && (' .,:;?!(-–'.includes(run.at(-1)) || (')]'.includes(run.at(-1)) && cnt(run,'(')+cnt(run,'[') < cnt(run,')')+cnt(run,']')))) run = run.slice(0,-1);
    out += fin(text.slice(pos, m.index)) + `<bdi dir="ltr">${fin(run)}</bdi>`;
    pos = m.index + run.length; re.lastIndex = pos > m.index ? pos : m.index + 1;
  }
  return out + fin(text.slice(pos));
}
function rich(text){
  const L = text.split('\n'); let out = '', i = 0;
  const dir = s => HEB.test(s) ? 'rtl' : 'ltr';
  while (i < L.length){
    const l = L[i];
    if (l.trim().startsWith('```')){ const c=[]; i++; while(i<L.length && !L[i].trim().startsWith('```')) c.push(L[i++]); i++; out += `<pre>${esc(c.join('\n'))}</pre>`; continue; }
    if (l.trim().startsWith('|')){
      const rows=[]; while(i<L.length && L[i].trim().startsWith('|')) rows.push(L[i++].trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
      out += '<div class="tbl"><table>' + rows.map((r,ri)=>'<tr>'+r.map(c=>`<${ri?'td':'th'} dir="${dir(c)}">${inline(c,dir(c)==='rtl')}</${ri?'td':'th'}>`).join('')+'</tr>').join('') + '</table></div>';
      continue;
    }
    if (l.trim()) out += `<div class="ln" dir="${dir(l)}">${inline(l, dir(l)==='rtl')}</div>`;
    i++;
  }
  return out;
}

function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

function makeItems(qs, r){
  return qs.map(q => ({ q, order: AnswerOrder.indices(q.options.length), ans: null, flag: false }));
}
function start(ids){
  const c = S.cfg;
  const seed = c.seed ? +c.seed : Math.floor(Math.random()*900000)+100000;
  const r = rng(seed);
  const P = Array.isArray(ids) ? QS.filter(q => ids.includes(q.id)) : pool();
  const n = Array.isArray(ids) ? P.length : Math.min(c.n, P.length);
  if (c.mode === 'print' && !Array.isArray(ids)){
    const versions = []; let remaining = P.slice(); const base = shuffle(P, r).slice(0, n);
    for (let v=0; v<c.versions; v++){
      let chosen;
      if (c.verMode==='same') chosen = shuffle(base, r);
      else if (c.verMode==='norepeat'){ chosen = shuffle(remaining, r).slice(0,n); remaining = remaining.filter(q => !chosen.includes(q)); }
      else chosen = shuffle(P, r).slice(0, n);
      versions.push(makeItems(chosen, r));
    }
    S.print = {seed, versions}; go('print'); return;
  }
  const mode = Array.isArray(ids) ? 'digital' : c.mode;
  const minutes = mode!=='digital' ? 0 : Array.isArray(ids) ? Math.round(n*8) : (c.minutes ?? Math.round(n*8));
  S.exam = {seed, mode, items: makeItems(shuffle(P, r).slice(0, n), r), cur: 0, start: Date.now(), limit: minutes*60, done: false};
  go('exam'); startTimer();
}

/* ---------- exam ---------- */
let timerId = null;
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(() => {
    const E = S.exam; if (!E || E.done){ clearInterval(timerId); return; }
    const el = $('#timer'); if (!el) return;
    const t = timerText(E); el.textContent = t.text; el.classList.toggle('low', t.low);
    if (E.limit && (Date.now()-E.start)/1000 >= E.limit) submit(true);
  }, 1000);
}
function timerText(E){
  const el = Math.floor((Date.now()-E.start)/1000);
  const sec = E.limit ? Math.max(0, E.limit - el) : el;
  const f = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  return {text: (E.limit ? '' : '⏱ ') + f(sec), low: E.limit && sec < 300};
}
function renderExam(app){
  const E = S.exam; if (!E){ go('setup'); return; }

            return `<button class="opt ${cls}" role="radio" aria-checked="${it.ans===j && !locked}" data-j="${j}" ${locked?'disabled':''}><span class="bub">${LET[j]}</span><span class="t">${rich(q.options[oi])}</span>${mark}</button>`; }).join('')}
        </div>

    </div>
    <aside class="sheet" aria-label="דף קידוד">
      <h3>דף קידוד <span class="mono" style="color:var(--muted);font-weight:400">${answered}/${E.items.length}</span></h3>

          let cls = x.ans===j ? 'on' : '';
          if (practice && x.ans!==null){ if (isCorrect(x.q,x.order[j])) cls='ok'; else if (x.ans===j) cls='bad'; }

  app.querySelectorAll('.opts .opt').forEach(b => b.onclick = () => choose(E.cur, +b.dataset.j));

  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { E.cur = +b.dataset.go; renderExam(app); });
  $('#prev').onclick = () => { E.cur--; renderExam(app); };
  if ($('#next')) $('#next').onclick = () => { E.cur++; renderExam(app); };
  $('#flag').onclick = () => { it.flag = !it.flag; renderExam(app); };
  $('#submit').onclick = () => submit(false);
  if ($('#submit2')) $('#submit2').onclick = () => submit(false);
}
document.addEventListener('keydown', e => {
  if (S.tab !== 'exam' || !S.exam || S.exam.done || $('.modal')) return;
  if (e.target.matches('input,select,textarea')) return;
  const E = S.exam;
  if (e.key === 'ArrowLeft' && E.cur < E.items.length-1){ E.cur++; render(); }
  else if (e.key === 'ArrowRight' && E.cur > 0){ E.cur--; render(); }
  else if (/^[1-4]$/.test(e.key)){ const b = document.querySelector(`.opts .opt[data-j="${+e.key-1}"]`); if (b && !b.disabled) b.click(); }
});
function submit(timeUp){
  const E = S.exam;
  const un = E.items.filter(x => x.ans === null).length;
  const fl = E.items.filter(x => x.flag).length;
  if (!timeUp && E.mode === 'digital' && (un || fl)){
    confirmModal(`${un ? `נשארו ${un} שאלות בלי תשובה.` : ''} ${fl ? `${fl} שאלות מסומנות לחזרה.` : ''} להגיש בכל זאת?`, 'הגש מבחן', finish);
    return;
  }
  finish(timeUp);
}
function finish(timeUp){
  const E = S.exam; E.done = true; clearInterval(timerId);
  const secs = Math.round((Date.now()-E.start)/1000);
  const answers = E.items.map(x => ({id: x.q.id, topic: x.q.topic, ok: x.ans !== null && isCorrect(x.q,x.order[x.ans]), skipped: x.ans === null}));
  const counted = E.mode === 'practice' ? answers.filter(a => !a.skipped) : answers;
  const correct = counted.filter(a => a.ok).length;
  const score = counted.length ? Math.round(correct / counted.length * 100) : 0;
  S.result = {exam: E, secs, correct, total: counted.length, score, timeUp};
  if (counted.length){
    const hist = store.get('history', []);
    hist.push({t: Date.now(), mode: E.mode, seed: E.seed, n: counted.length, correct, score, secs, answers: counted});
    store.set('history', hist.slice(-200));
  }
  go('result');
}

/* ---------- results ---------- */
let reviewFilter = 'all';
function renderResult(app){

  const items = E.items.map((x,i) => ({x,i})).filter(({x}) => reviewFilter==='all' || (reviewFilter==='wrong' ? (x.ans!==null && !isCorrect(x.q,x.order[x.ans])) : x.ans===null));
