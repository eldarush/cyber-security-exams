לך ההקמה. השרת מעביר ראיה חתומה, ואינו מחליף את המשיב המורשה כחותם. הלקוח עדיין בודק התאמה, חתימה וטריות.</p>\n<p>מדיניות המשך במקרה כשל פירושה שאם הבירור אינו אפשרי, הלקוח עשוי להמשיך במקום לחסום. הדבר משפר זמינות אך עלול לאפשר לתוקף לחסום גישה לשירות הסטטוס ולנצל תעודה שכבר בוטלה. מכאן שפער בין ביטול אצל הרשות לבין אכיפה אצל משתמשים אינו מצביע בהכרח על זיוף חתימה: ייתכנו כשל תקשורת או מידע שמור שעוד נחשב עדכני. שקיפות תעודות פותרת בעיית גילוי הנפקות ואינה מחליפה את העברת הסטטוס הזה. גם שרתי שורש של מערכת שמות מתחם אינם רשויות ההפצה של ביטול תעודות, אף שבשני התחומים משתמשים במושג שורש.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>יש להבדיל גם בין ביטול תעודה לבין יצירת תעודה חדשה. הנפקת חלופה אינה גורמת אוטומטית לכל הדפדפנים להפסיק לקבל את הישנה, ותוקף עשוי להמשיך להציג את העותק שבידו. ניהול האירוע כולל לכן החלפת מפתח, הפצת מידע ביטול ובדיקת אכיפה אצל לקוחות. פעולה בצד שרת האתר בלבד אינה משנה את כל עוגני האמון והמטמונים של המשתמשים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21072025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q108.html"},{"id":"Q109","year":"2025","stem":"השם המלא של אליס הוא אליס אליסוביץ׳. לאחרונה, אליס נרשמה לאתר אינטרנט מסוים בשמה המלא (כפי שהופיע במשפט הקודם), אך שמה לב לתופעה מוזרה. במקומות מסוימים, האתר מציג את שמה נכון:\nאליס אליסוביץ׳\nאך במקומות מסוימים אחרים שקשורים לאתר הזה, שמה מוצג בצורה שונה:\nאליס אליסוביץ`&#39;`\nמהי הסיבה לכך?","options":["שימוש במנגנון קידוד (encoding) על ידי האתר על מנת למנוע התקפות injection.","השרת הגדיר Content Security Policy עבור מנגנון OCSP.","שימוש במנגנון ה preload ב HSTS בלי רישום באתר https://hstspreload.org","תופעת לוואי של מנגנון ה anti CSRF token."],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":7},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":7},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.196,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-19-07\" data-doc=\"original-19\" data-body-words=\"419\"><h2>שאלה 7 — הופעת קוד הישות &#39;</h2><div class=\"answer-body\">\n<p><strong>א — קידוד פלט למניעת הזרקה.</strong> הגרש הומר לישות HTML כגון &#39;. אם הישות מוצגת כטקסט במקום להתפרש, למשל עקב קידוד כפול או הצגה בהקשר טקסט שונה, המשתמש רואה את הרצף עצמו. ב מערבבת CSP עם OCSP; ג HSTS preload אינו ממיר תווים; ד anti-CSRF token אינו מקודד שמות משתמש. הנוסח מצביע על encoding אך אינו מוכיח לבדו בדיוק באיזה רכיב נעשה קידוד כפול.</p>\n<h3>ההבדל בין טקסט שהמשתמש כתב לבין הוראה לדפדפן</h3>\n<p>תוכן עמוד עשוי לכלול טקסט משתמש, תגים, מאפיינים וקוד, ולכל הקשר יש תווים בעלי משמעות תחבירית. קידוד פלט מתאים מבטא תווים מיוחדים בדרך שהמפרש יציג כנתונים במקום לפרש כהוראות. למשל, תו שמשמש כתחילת תג או כסוגר מחרוזת לא אמור להקנות למשתמש יכולת לצאת מהשדה שהוקצה לו ולהוסיף רכיב פעיל חדש. לכן קידוד הוא שינוי ייצוג לצורך שמירת הגבול בין נתון לתחביר, ולא הצפנה שמסתירה את הנתון.</p>\n<p>ישות תו היא רצף תווים שהדפדפן עשוי לתרגם לתו אחד בהקשר המתאים. כאשר רואים על המסך את הרצף עצמו, ייתכן שהאתר קידד אותו שוב, הציב אותו בהקשר שבו אינו מפורש כישות, או טיפל באופן שונה באותו שדה בין עמודים. מכאן אפשר לזהות מנגנון קידוד, אך לא תמיד לקבוע מתוך צילום התוצאה לבדו באיזה רכיב תוכנה בדיוק נוצר הכפל. ההבחנה חשובה כדי לא לטעון שהופעת רצף מילולי מוכיחה סוג יחיד של תקלה.</p>\n<h3>קידוד נכון תלוי בהקשר</h3>\n<p>טקסט גוף מסמך, ערך מאפיין, מחרוזת קוד וכתובת אינם בהכרח משתמשים באותם כללי קידוד. פונקציה שמתאימה לאחד מהם עלולה לא להספיק לאחר. כאשר רוצים להציג שם של אדם, הדרך הבטוחה היא לשמור את ערכו הלוגי כנתון ולבצע את הקידוד המתאים בנקודת ההצגה. שמירת ייצוג שכבר קודד ואז קידודו שוב בכל פלט עלולה לייצר תצוגה משובשת ולהקשות על הבנת הגבול בין שכבות.</p>\n<p>קידוד אינו טוקן נגד זיוף בקשות ואינו מנגנון בירור תוקף תעודות. הוא גם אינו שקול לחיטוי, שבו מסירים או מתירים מבני תוכן לפי רשימה מוגדרת, למשל כשמותר למשתמש לפרסם חלק מתגי העיצוב. המטרה המשותפת היא למנוע פרשנות מסוכנת של קלט, אך דרך הפעולה שונה. בהקשר הבחינה סימן התו המוצג מספק רמז ישיר לתהליך הייצוג הזה, בעוד שמנגנונים הקשורים לערוץ מוצפן או לסטטוס תעודות אינם אמורים להחליף גרש בשם משתמש בישות טקסטואלית. יש להתאים את ההסבר לתופעה המוצגת במקום לבחור מושג אבטחה מוכר שאינו פועל על תוכן הפלט.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>כדי לאבחן פלט כזה באופן מסודר אפשר להשוות את הערך הלוגי שנשמר, את הבתים שנשלחו בתגובה ואת אופן הצגתם במסמך. אם הערך כבר מכיל ייצוג מקודד, שלב תצוגה נוסף עשוי לקודד את סימן תחילת הישות ולהציג את כולה מילולית. ההבחנה בין הנתון לבין הייצוג שלו מסבירה את התופעה בלי לייחס אותה לשינוי בפרוטוקול ההתחברות.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21072025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q109.html"},{"id":"Q110","year":"2025","stem":"תוקף הצליח לגנוב את המפתח הפרטי של שרת אינטרנט מסוים. לקוחות מתקשרים מול שרת האינטרנט הזה בעזרת חיבורי TLS מבוססי RSA. שרת האינטרנט לא יודע שהמפתח הפרטי נגנב והתעודה הנוכחית שהונפקה עבורו היא התעודה היחידה שאי פעם היה לו. איזה מבין הטענות הבאות אינה נכונה?","options":["התוקף יכול לחתום על ה CRL של ה CA שהנפיק את התעודה של שרת האינטרנט, ולקבוע איזה תעודות יכללו ב CRL הזה.","אם לתוקף יש יכולת Man in the Middle כאשר לקוח מקים חיבור TLS מול שרת האינטרנט הנ״ל, התוקף יכול כעת להשלים חיבור מול הלקוח תוך התחזות אל שרת האינטרנט והלקוח יחשוב שהוא הקים חיבור TLS עם שרת האינטרנט האמיתי כשבפועל החיבור הוקם מול התוקף.","אם לתוקף יש עותק של תעבורת https ישנה של השרת אינטרנט הנ״ל מול לקוחות, התוקף יכול כעת לפענח את התעבורה הזו ולראות את ה plaintext שנשלח בה.","התוקף יכול לחתום על מידע כלשהו בשם שרת האינטרנט, כך שהמידע יראה ככזה שבאמת נחתם על ידי שרת האינטרנט."],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":8},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":8},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.211,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-19-08\" data-doc=\"original-19\" data-body-words=\"408\"><h2>שאלה 8 — גניבת מפתח RSA של שרת</h2><div class=\"answer-body\">\n<p><strong>א — התוקף אינו יכול לחתום על CRL של ה־CA.</strong> נדרש מפתח הרשות המתאים, לא מפתח האתר. ב נכונה: עם MITM והמפתח אפשר להתחזות לשרת כל עוד התעודה מתקבלת. ג נכונה בהנחת RSA key exchange והקלטת handshake ישן תחת אותו מפתח: אפשר לשחזר pre-master secret ולפענח עבר. ד נכונה אם המפתח מורשה לחתימה: המפתח שנגנב מאפשר חתימות בשם האתר. RSA בתעודה עם ECDHE לבדו אינו מאפשר פענוח עבר; זו הנחת המודל הישן בשאלה.</p>\n<h3>ביטול תעודה הוא עדכון אמון ולא שינוי במתמטיקה</h3>\n<p>תעודה עשויה להיות חתומה כחוק ועדיין להפסיק להיות אמינה לפני תאריך הפקיעה שלה, למשל מפני שמפתח פרטי נגנב. החתימה על התעודה אינה נעלמת כאשר הרשות מחליטה לבטל אותה, ולכן הלקוח זקוק למידע נוסף על סטטוסה. רשימת ביטול מפרסמת אוסף תעודות שבוטלו, ושירות סטטוס מקוון מאפשר לברר את המצב של תעודה מסוימת. בשני המקרים המקבל צריך לאמת שהמידע הגיע מגורם מורשה ושאינו ישן מדי.</p>\n<p>למפתח הפרטי של שרת האתר ולמפתח החתימה של רשות התעודות יש תפקידים שונים. גניבת מפתח האתר מאפשרת להתחזות לאתר בהקשרים שבהם התעודה עוד מתקבלת, אך אינה מאפשרת לחתום בשם הרשות על רשימת ביטול או תשובת סטטוס. אחרת כל שרת היה יכול לבטל את ביטולה של תעודתו בעצמו, וכל שרשרת האמון הייתה מאבדת את משמעותה. גם העתקת אישור קיים אינה מאפשרת לשנות את השדות שלו בלי לפגוע בחתימה.</p>\n<h3>הצמדה, פרטיות וכשל תקשורת</h3>\n<p>כאשר הדפדפן פונה ישירות לשירות הסטטוס, השירות עשוי ללמוד באיזו תעודת אתר הדפדפן מתעניין, ונוספות השהיה ותלות בזמינות רשת. הצמדת תשובת סטטוס מאפשרת לשרת האתר לקבל תשובה חתומה ולהגיש אותה ללקוחות במהלך ההקמה. השרת מעביר ראיה חתומה, ואינו מחליף את המשיב המורשה כחותם. הלקוח עדיין בודק התאמה, חתימה וטריות.</p>\n<p>מדיניות המשך במקרה כשל פירושה שאם הבירור אינו אפשרי, הלקוח עשוי להמשיך במקום לחסום. הדבר משפר זמינות אך עלול לאפשר לתוקף לחסום גישה לשירות הסטטוס ולנצל תעודה שכבר בוטלה. מכאן שפער בין ביטול אצל הרשות לבין אכיפה אצל משתמשים אינו מצביע בהכרח על זיוף חתימה: ייתכנו כשל תקשורת או מידע שמור שעוד נחשב עדכני. שקיפות תעודות פותרת בעיית גילוי הנפקות ואינה מחליפה את העברת הסטטוס הזה. גם שרתי שורש של מערכת שמות מתחם אינם רשויות ההפצה של ביטול תעודות, אף שבשני התחומים משתמשים במושג שורש.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>יש להבדיל גם בין ביטול תעודה לבין יצירת תעודה חדשה. הנפקת חלופה אינה גורמת אוטומטית לכל הדפדפנים להפסיק לקבל את הישנה, ותוקף עשוי להמשיך להציג את העותק שבידו. ניהול האירוע כולל לכן החלפת מפתח, הפצת מידע ביטול ובדיקת אכיפה אצל לקוחות. פעולה בצד שרת האתר בלבד אינה משנה את כל עוגני האמון והמטמונים של המשתמשים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21072025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q110.html"},{"id":"Q111","year":"2025","stem":"אתר מסויים מאפשר למנהלים לשנות את הסיסמה של כל משתמש דרך בקשת GET לכתובת:\nhttp://www.foo.com/change-password?user=alice&password=1234 כלומר, אם מנהל ייגש לכתובת הזו, הסיסמא של אליס תשתנה להיות 1234 (ורק הסיסמא תשתנה), והתשובה של השרת היא 204 (סטטוס 204 של http אומר שהפעולה בוצעה בהצלחה ואין שום תוכן טקסטואלי או html וכו׳ נוסף להחזיר - ולכן גוף התשובה ריק). זה כמובן יתרחש רק אם המשתמש שניגש\nלכתובת הוא אכן מנהל של המערכת (נבדק על ידי cookies). נתון כי השרת לא שומר את הסיסמאות באופן גלוי, אלא משתמש ב hash ו salt כפי שנלמד. המימוש הזה של האתר הזה מכיל חולשה. החולשה הזאת היא חולשה מסוג?","options":["Cross Site Request Forgery.","Cross Site Scripting.","הלוגריתם הדיסקרטי.","X-Frame-options."],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":9},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":9},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.247,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-19-09\" data-doc=\"original-19\" data-body-words=\"407\"><h2>שאלה 9 — שינוי סיסמה ב־GET</h2><div class=\"answer-body\">\n<p><strong>א — CSRF.</strong> תוקף גורם לדפדפן מנהל לבקש את URL שינוי הסיסמה, והעוגייה מצטרפת ללא כוונה מודעת של המנהל. HTTP 204 רק אומר שאין גוף תגובה; הפעולה עדיין בוצעה. hash ו־salt מגינים על אחסון סיסמאות ולא על מקור הבקשה. ב XSS דורשת הרצת סקריפט בהקשר האתר, שלא נדרשה כאן; ג בעיה מתמטית שאינה החולשה; ד מנגנון נגד מסגור ולא שם התקפה. ההנחה היא שהעוגייה נשלחת ואין הגנת CSRF אחרת.</p>\n<h3>האימות שמצליח והכוונה שאינה נבדקת</h3>\n<p>זיוף בקשות בין אתרים מנצל מצב שבו הדפדפן מוסיף הרשאה לבקשה באופן אוטומטי, בעוד האתר מפרש את עצם קבלת הבקשה כאילו המשתמש התכוון לבצע פעולה. התוקף אינו חייב לדעת את הסיסמה או לקרוא את עוגיית הכניסה. די בכך שהמשתמש כבר מחובר, שהדפדפן מצרף את העוגייה בהקשר התקיפה, ושהשרת מקבל פעולה רגישה ללא בדיקה נוספת של מקורה והקשרה.</p>\n<p>אפשר לדמיין דף תוקף שמפעיל ניווט לכתובת המעדכנת העדפה או מפרסמת הודעה בחשבון. מבחינת שרת היעד הגיעה בקשה בעלת עוגייה חוקית. מבחינת המשתמש הוא רק ביקר באתר אחר ולא אישר את השינוי. גם אם מדיניות המקור הזהה מונעת מהתוקף לקרוא את התשובה, עצם השינוי כבר עלול להתבצע. לכן תגובה ריקה או היעדר גישה למידע החוזר אינם שוללים את ההתקפה.</p>\n<h3>אילו הגנות משנות את תנאי התקיפה</h3>\n<p>טוקן אקראי שאינו נגיש לאתר התוקף מוסיף ערך שהדפדפן אינו מצרף אוטומטית רק מפני שיש לו עוגייה. האתר החוקי מכניס את הטוקן לטופס או לקוד שלו, והשרת בודק את התאמתו לסשן לפני הפעולה. המשתמש בדרך כלל אינו מקליד אותו. הגבלה של עוגיות בין אתרים יכולה למנוע את הצטרפות ההרשאה במסלולים מסוימים, ובדיקת מקור הבקשה מוסיפה מידע על ההקשר שממנו יצאה. חשוב לבדוק כל הגנה לפי פרטי המימוש ולא להניח שהיא פועלת רק משום ששמה מופיע בתיאור.</p>\n<p>שימוש בבקשה שאינה מיועדת לשנות מצב מתאים לתכנון פעולה פסיבית בלבד, ואינו מנגנון הרשאה. גם מעבר משליחת פרמטרים בכתובת לשליחת טופס אינו לבדו תיקון, משום שתוקף מסוגל להגיש טפסים. שמירת סיסמאות באופן מומלח מגינה על גניבת מאגר ולא על כוונת הבקשה. בנוסף, אם קיימת באתר הזרקת סקריפט, הקוד עשוי לקרוא את הטוקן ולשלוח פעולה תקינה בשם הקורבן. לפיכך הגנה טובה על בקשות רגילות והגנה מפני הרצת קוד לא מהימן משלימות זו את זו, וכל אחת תלויה בהנחת איום אחרת.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>פעולה רגישה צריכה לעבור גם בדיקת הרשאה רגילה: טוקן תקין אינו מתיר למשתמש שאינו מנהל לבצע פעולה ניהולית. הטוקן עוזר להראות שהבקשה שייכת להקשר הנכון, בעוד ההרשאה קובעת מה אותו משתמש רשאי לעשות. ערבוב שתי הבדיקות עלול ליצור מערכת שמונעת חלק מהבקשות המזויפות אך עדיין מאפשרת שימוש לרעה בחשבון בעל הרשאות נמוכות.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21072025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q111.html"},{"id":"Q112","year":"2025","stem":"מה מהבאים מתאר בצורה הנכונה ביותר את ההבדל המרכזי בין הצפנה לחתימה דיגיטלית?","options":["הצפנה נועדה לשמור על סודיות המידע, בעוד שחתימה דיגיטלית נועדה לאמת את מקור ושלמות המידע.","הצפנה משתמשת תמיד במפתחות סימטריים, ואילו חתימה דיגיטלית תמיד משתמשת במפתחות א-סימטריים.","הצפנה מונעת זיופים של המסר, בעוד שחתימה דיגיטלית מונעת גישה לא מורשית למידע.","חתימה דיגיטלית היא תהליך הממיר טקסט קריא לטקסט מוצפן, בעוד שהצפנה מאמתת זהות שולח ההודעה."],"note":"","sources":[{"file":"2025/689156_21072025_0 (5).pdf","date":"21/07/2025","num":10},{"file":"2025/689156_21072025_0 (6).pdf","date":"21/07/2025","num":10},{"file":"2025/File_0_689156_21072025_0.pdf","date":"21/07/2025","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.212,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-19-10\" data-doc=\"original-19\" data-body-words=\"370\"><h2>שאלה 10 — הבדל בין הצפנה לחתימה</h2><div class=\"answer-body\">\n<p><strong>א — הצפנה מיועדת לסודיות וחתימה לאימות מקור ושלמות.</strong> ב שגויה כי יש הצפנה סימטרית וגם א־סימטרית. ג הופכת את המטרות ואינה מתארת סודיות לעומת אימות. ד מייחסת לחתימה הסתרת טקסט ולהצפנה אימות שולח, שאינם המטרות המובטחות כשלעצמן. אפשר לשלב הצפנה וחתימה/AEAD להשגת כמה תכונות, אך אחת אינה נובעת אוטומטית מהאחרת.</p>\n<h3>משמעות האימות ואופן הבדיקה</h3>\n<p>שלמות פירושה שהמקבל מסוגל לזהות שינוי בלתי מורשה בתוכן, ואותנטיות פירושה שיוך ההודעה למי שמחזיק בסוד המתאים. אלה תכונות נפרדות מסודיות: אפשר לפרסם הודעה לכל העולם ובכל זאת לוודא שלא שונתה ומי אישר אותה. בתהליך תיוג סימטרי הצדדים מחזיקים מפתח סודי משותף, השולח מפעיל פונקציית תיוג על המפתח ועל כל בתיה של ההודעה, והמקבל מחשב שוב את התג ומקבל רק אם הוא תואם לתג שנשלח. התוקף רשאי להכיר את האלגוריתם ואף לצפות בהודעות מתויגות רבות; הביטחון אמור לנבוע מחוסר ידיעת המפתח ולא מהסתרת שיטת החישוב.</p>\n<p>נניח שההודעה אומרת להעביר מאה שקלים, ומאזין מחליף אותה בהוראה להעביר תשע מאות. התג הישן חושב על רצף בתים אחר, ולכן בדיקת המקבל נכשלת. גם אם התוקף יודע לחשב גיבוב ציבורי, הוא אינו יכול להחליף אותו בתג תקף ללא המפתח. מסיבה זו גיבוב רגיל המצורף להודעה אינו מספק אותה הגנה: תוקף המשנה הודעה יכול פשוט לחשב מחדש את הגיבוב שלה.</p>\n<h3>מה אפשר להסיק ומה מחייב מנגנון נוסף</h3>\n<p>הבדיקה מעידה שההודעה אושרה בידי בעל המפתח, אך אינה מוכיחה למישהו חיצוני שרק השולח יכול היה ליצור אותה. גם המקבל יודע את המפתח ולכן מסוגל לייצר תג תקין. חתימה דיגיטלית משנה את חלוקת היכולות: החותם מחזיק מפתח פרטי, בעוד המאמתים מקבלים מפתח ציבורי שאינו מקנה יכולת חתימה. ההבחנה הזאת מסבירה מדוע אי־יכולת הכחשה דורשת חתימות ולא תג סימטרי בלבד. בשני המקרים צריך להגן על המפתחות ולקשור אותם לזהויות הנכונות. בנוסף, הודעה ישנה עם תג תקין נשארת תקינה מבחינה מתמטית; למניעת שידור חוזר יש לכלול מספר רצף, אתגר או מזהה פעולה ולבדוק אותם. התג אינו מצפין את התוכן, ולכן הצורך בסודיות מחייב שילוב מתאים עם הצפנה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>כדאי לבדוק גם בדיוק אילו שדות נכללים באימות: אם התג מכסה רק סכום אך אינו מכסה את הנמען, תוקף יכול להשאיר סכום תקין ולשנות את כתובת התשלום. המקבל צריך לאמת ייצוג חד־משמעי של כל פרטי הפעולה הרלוונטיים. עצם קיום תג אינו מבטיח ששדה שהושמט מן הקלט מוגן, ולכן ניתוח שלמות מתחיל בהגדרת המסר המאומת.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21072025_0 (5).pdf","question_type":"multiple-choice","solution":"solutions/Q112.html"},{"id":"Q113","year":"2025","stem":"בהקשר של חתימה דיגיטלית לפי textbook RSA (כלומר ללא hash), אם ידוע שה private key הוא:\nn = 33 d = 7 ונתונה החתימה הדיגיטלית σ כאשר 30=σ. מהי ההודעה המקורית שחתמו עליה?","options":["6","5","7","4"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":1},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.495,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-21-01\" data-doc=\"original-21\" data-body-words=\"360\"><h2>שאלה 1 — שחזור הודעה מחתימת RSA</h2><div class=\"answer-body\">\n<p><strong>א — 6.</strong> n=33=3·11 ולכן φ(n)=20. ל־d=7 מתאים e=3 כי 7·3=21≡1 mod20. m=σᵉ modn=30³ mod33. מאחר ש־30≡−3, מתקבל (−3)³=−27≡6. ב 5, ג 7 וד 4 אינן השארית. בדיקה ישירה: 6²≡3,‏ 6⁴≡9,‏ 6⁷≡9·3·6=162≡30 mod33.</p>\n<h3>בניית המפתח ומשמעות החשבון המודולרי</h3>\n<p>באלגוריתם הנדון בוחרים שני ראשוניים שונים, מכפילים אותם לקבלת המודולוס, ומחשבים את מספר השאריות הזרות למודולוס. במקרה של מכפלת שני ראשוניים המספר הזה הוא מכפלת שני המספרים הקטנים באחד מן הראשוניים. לאחר מכן בוחרים מעריך ציבורי הזר למספר שהתקבל, ומוצאים לו הופכי כפל מודולרי שישמש כמעריך הפרטי. המודולוס משותף לשני המפתחות; החלפתו במספר אחר אינה יוצרת מפתח פרטי מתאים לאותו מפתח ציבורי.</p>\n<p>הדרישה להופכי פירושה שמכפלת שני המעריכים משאירה שארית אחת בחלוקה במספר השאריות הזרות. לכן אין צורך שהמעריכים יהיו שונים, גדולים במיוחד או אחד ראשוני ואחד לא. יש לבדוק את משוואת ההופכי במפורש. באימות חלופות של מפתח, חישוב המכפלה והשארית הוא בדיקה ישירה וקצרה הרבה יותר מניסיון להצפין אוסף מסרים ולקוות שהכול עובד.</p>\n<h3>חתימה, אימות ודרך חישוב יעילה</h3>\n<p>בחתימת ספר לימוד על מסר מספרי מעלים את המסר בחזקת המעריך הפרטי ומצמצמים מודולו המודולוס. לא מצפינים במפתח הציבורי כדי לחתום. כדי לאמת מעלים את החתימה בחזקת המעריך הציבורי ובודקים שחזר המסר. כאשר נדרשים לשחזר מסר מחתימה, זהו אותו כיוון אימות, גם אם השאלה מספקת תחילה דווקא את המעריך הפרטי. ההסבר המקדים לכל שאלה מיישם את התפקידים האלה על המספרים המסוימים שבה.</p>\n<p>אפשר לבצע את החזקות באמצעות ריבועים חוזרים: מחשבים חזקה שנייה, ממנה רביעית וכן הלאה, ובכל שלב שומרים רק את השארית. אחר כך מכפילים את החזקות המתאימות לפירוק הבינארי של המעריך. כך נשמרים מספרים קטנים ונמנעות טעויות של כתיבת מספר עצום. כל המספרים הקטנים בשאלון נועדו להדגים את המתמטיקה ואינם מפתחות בטוחים לשימוש. חתימה מעשית גם אינה חתימת ספר לימוד ישירה על מספר שרירותי; נדרשים גיבוב, קידוד חתימה תקני ובדיקת תקינות של המפתחות כדי למנוע מניפולציות שלא נלמדות מן החשבון הפשוט בלבד.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בדיקה נוספת מועילה היא להחזיר את התוצאה דרך הפעולה ההפוכה: אם חושבה חתימה, מאמתים אותה ומוודאים שחזר המסר; אם נבחר מעריך פרטי, בודקים את מכפלתו במעריך הציבורי. שאריות שליליות מותרות בזמן החישוב, אבל את התוצאה הסופית נוח להציג כנציג שאינו שלילי וקטן מן המודולוס. כך ניתן לזהות מסיח שמייצג מספר גדול או פעולה בכיוון הלא נכון.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21082025_0 (6).pdf","question_type":"multiple-choice","solution":"solutions/Q113.html"},{"id":"Q114","year":"2025","stem":"כאשר לקוח בודק את שרשרת התעודות (Chain of trust) ב-TLS, מה הוא בודק?","options":["חתימות דיגיטליות תקינות על התעודות עד ל Root CA שהוא סומך עליו","מפתח סימטרי תואם","התאמה בין המפתח הציבורי למפתח הפרטי של הלקוח","זמן פקיעה זהה של כל התעודות בשרשרת"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":2},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.251,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-21-02\" data-doc=\"original-21\" data-body-words=\"396\"><h2>שאלה 2 — בדיקת שרשרת האמון</h2><div class=\"answer-body\">\n<p><strong>א — אימות חתימות התעודות עד Root CA שהלקוח סומך עליו.</strong> כל מנפיק מעיד על תעודת הבא בשרשרת תוך בדיקת מגבלות CA. ב עוסקת במפתח תעבורה סימטרי ואינה שרשרת תעודות; ג אינה בדיקת זהות שרת; ד שגויה כי לתעודות בשרשרת יכולים להיות זמני פקיעה שונים, וכולן צריכות להיות תקפות במועד הבדיקה. נדרשות בנוסף בדיקת שם השרת, זמן ושימוש מורשה.</p>\n<h3>איך מפתח ציבורי נקשר לזהות</h3>\n<p>מפתח ציבורי ניתן לפרסום, אך ידיעת מפתח כלשהו אינה מספיקה כדי לדעת שהוא שייך לאתר המבוקש. תעודה פותרת את בעיית הקישור באמצעות חתימה של מנפיק על פרטי זהות, מפתח, תקופת תוקף ושדות הרשאה. הלקוח בודק את חתימת המנפיק באמצעות המפתח הציבורי שלו, ואם גם המנפיק אינו מוכר ישירות, ממשיך דרך תעודות ביניים עד לשורש אמון שכבר קיים אצלו.</p>\n<p>לכן לא נדרש שהמנפיק הישיר של כל אתר יופיע במאגר השורשים. רשות ביניים יכולה להיות מוסמכת בידי רשות גבוהה יותר, וההסמכה עצמה מיוצגת בתעודה חתומה עם מגבלות מתאימות. מנגד, חתימה עצמית של אתר אינה יוצרת אמון רק משום שהיא נכונה מבחינה מתמטית; כל אחד יכול ליצור זוג מפתחות ולחתום על תעודה של עצמו. עוגן האמון צריך להגיע ממקור שהלקוח כבר בחר לקבל.</p>\n<h3>אילו בדיקות נפרדות נדרשות</h3>\n<p>אימות כל החתימות בשרשרת הוא חלק הכרחי, אך צריך לבדוק גם התאמה לשם השרת, תקופות תוקף, הרשאות שימוש ומגבלות של הרשויות. זמני הפקיעה של כל התעודות אינם צריכים להיות זהים; כל תעודה צריכה להיות מתאימה למועד ולתפקיד בבדיקה. תעודה חוקית לאתר אחד אינה מתירה לתוקף להציג אותה כראיה לזהותו של אתר אחר. זהות היעד שהמשתמש ביקש היא חלק מן ההחלטה, ולא רק העובדה שקיימת חתימה ממנפיק מוכר.</p>\n<p>הרשות חותמת על נתונים הכוללים מפתח ציבורי ואינה צריכה לקבל את המפתח הפרטי של האתר. כתוצאה מכך עצם ההנפקה אינה מעניקה לה יכולת לפענח כל חיבור של האתר. כדי להבין פגיעה בעקבות גניבת מפתח צריך לברר איזה מפתח נגנב ואיזה פרוטוקול חילוף מפתחות הופעל. אין לערבב בין מפתחות תעודות, מפתחות תעבורה סימטריים ומפתחות של משיבי סטטוס. כל אחד מהם משמש להרשאה אחרת, וחתימה המתקבלת בהקשר אחד אינה בהכרח קבילה בהקשר אחר. ההפרדה הזאת היא הבסיס לבדיקת החלופות בשאלת שרשרת אמון ולהבנת גבולות הנזק של מפתח שנחשף.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בדיקת שם האתר צריכה להתייחס ליעד שהלקוח התכוון אליו לפני קבלת התעודה, ולא לשם שהתוקף הציג בתוך התעודה עצמה. אחרת תעודה חוקית לכל אתר הייתה מספיקה להתחזות לכל אתר אחר. זהו מקרה פרטי של קישור להקשר חיצוני מהימן: החתימה מאשרת שדות, והיישום צריך להשוות אותם לציפייה שלו כדי לקבל החלטת אמון.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21082025_0 (6).pdf","question_type":"multiple-choice","solution":"solutions/Q114.html"},{"id":"Q115","year":"2025","stem":"למה גורם דגל הHttpOnly בעוגיות?","options":["מונע גישה באמצעות JavaScript לעוגיה","מונע שליחה של העוגיה ל-DOM","מאפשר שמירת מפתחות הצפנה בצד הלקוח","מונע שליחה של העוגיה ב-HTTPS"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":3},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.164,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-21-03\" data-doc=\"original-21\" data-body-words=\"400\"><h2>שאלה 3 — דגל HttpOnly</h2><div class=\"answer-body\">\n<p><strong>א — מונע גישה לעוגייה דרך ממשקי JavaScript כמו document.cookie.</strong> הוא אינו מונע מהדפדפן לשלוח אותה בבקשות HTTP(S) מתאימות. ב ״שליחה ל־DOM״ אינה תיאור מוגדר של פעולה בעוגיות; ג אינה תפקיד הדגל; ד הפוכה ושגויה: HttpOnly אינו אוסר HTTPS. הדגל Secure מגביל שליחה לערוץ מאובטח. XSS עדיין יכול לבצע פעולות בשם המשתמש גם אם אינו יכול לקרוא את העוגייה.</p>\n<h3>מה עוגייה עושה ומה הדגל משנה</h3>\n<p>עוגייה היא נתון שהדפדפן שומר ושולח לשרת בבקשות שעומדות בכללי ההתאמה שלה. שימוש נפוץ הוא מזהה סשן, שמאפשר לשרת לקשר בקשות חוזרות למשתמש שכבר הזדהה. יש להבחין בין פעולת הדפדפן בעת בניית בקשת רשת לבין גישת קוד שרץ בעמוד למאגר העוגיות. מניעת גישה דרך ממשק הסקריפט אינה מחייבת שהדפדפן יפסיק לשלוח את העוגייה לשרת.</p>\n<p>דגל המיועד להגביל גישת סקריפט חוסם את חשיפת ערך העוגייה באמצעות הממשק הרגיל של קוד העמוד. אם תוקף הצליח להזריק קוד, הוא אינו יכול פשוט לקרוא את מזהה הסשן ולשלוח אותו החוצה באותה דרך. זו הגנה חשובה מפני גניבת הערך, אך היא אינה הופכת את העוגייה למפתח הצפנה ואינה גורמת להצפנת כל הנתונים בצד הלקוח. אין גם פעולה תקנית כללית בשם שליחת עוגייה למסמך; העוגייה שייכת לניהול הבקשות והאחסון של הדפדפן.</p>\n<h3>הגנה מפני גניבה לעומת הגנה מפני פעולה</h3>\n<p>גם כשאין לסקריפט יכולת לקרוא את מזהה הסשן, הוא יכול במקרים רבים להגיש טופס או לשלוח בקשה מתוך אותו מקור. הדפדפן עשוי לצרף את העוגייה, והשרת יקבל פעולה מאומתת בשם המשתמש. לכן הסתרת הערך אינה מתקנת הזרקת קוד ואינה מוכיחה שכל פעולה רגישה מוגנת. יש לבדוק בנפרד הרשאות, אימות כוונה וטיפול בטוקנים רלוונטיים.</p>\n<p>דגל שמגביל שליחה לערוץ מאובטח עוסק בשאלה אחרת: האם להעביר את העוגייה ברשת רק בחיבור מוצפן. הגבלה לפי הקשר אתר עוסקת בצירוף העוגייה לבקשה שמקורה בהקשר אחר. שלושת המנגנונים יכולים להשתלב, אך אינם שמות שונים לאותה תכונה. בפרט, דגל שמונע גישה מסקריפט אינו אוסר שליחה בערוץ מוצפן; שליחה כזאת היא דווקא המסלול הרגיל של עוגיית סשן מוגנת. ניתוח חלופות צריך אפוא לזהות מי מבצע את הפעולה, לאן הנתון מועבר ואיזה ממשק נחסם. ההבדל בין קריאה מקומית לבין שימוש אוטומטי בהרשאה הוא שמסביר גם את גבולות ההגנה נגד הזרקת קוד וגם את הקשר שלה לזיוף בקשות.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>גם עוגייה שאינה נגישה לסקריפט נשמרת במחשב הלקוח ומנוהלת בידי הדפדפן. הדגל אינו הצפנה כללית של אחסון הדפדפן ואינו מתיימר להגן על מחשב שכבר נשלט במלואו בידי תוקף. מודל האיום המצומצם הוא קוד עמוד שמנסה להשתמש בממשקי גישה רגילים. הבנת הגבול הזה מונעת הבטחה רחבה מדי מתוך דגל יחיד בהגדרת עוגייה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21082025_0 (6).pdf","question_type":"multiple-choice","solution":"solutions/Q115.html"},{"id":"Q116","year":"2025","stem":"נתון הפסאודו-קוד הבא:\n```\ndef receive_secure_message(ciphertext, k1, k2):\n    decrypted = decrypt(ciphertext, k1)\n\n    (message, tag) = separate_to_message_and_tag(decrypted)\n\n    if mac(message, k2) != tag:\n        raise Exception(\"Authentication failed!\")\n\n    return message\n```\nאיזו מהשיטות הבאות היא השיטה שהשתמשו בה?","options":["MAC-then-Encrypt","Encrypt-then-MAC","Encrypt-and-MAC","Salt-and-Pepper"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":4},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.354,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-21-04\" data-doc=\"original-21\" data-body-words=\"396\"><h2>שאלה 4 — סיווג receive_secure_message</h2><div class=\"answer-body\">\n<p><strong>א — MAC then Encrypt.</strong> המפענח קודם מפענח ciphertext ומוציא message ו־tag, ורק אז מחשב MAC על message. משמע, בשולח תייגו plaintext והצפינו יחד את ההודעה והתג. ב הייתה בודקת תג על ciphertext לפני הפענוח; ג שולחת תג לא מוצפן על המסר לצד ההצפנה; ד נוגעת לאחסון סיסמאות, לא לסדר הבנייה הזה.</p>\n<h3>מה מתויג ומה מוצפן</h3>\n<p>כדי לסווג שילוב של הצפנה ותיוג צריך לענות על שתי שאלות: על איזה רצף בתים מחושב התג, והאם התג עצמו נמצא בתוך ההצפנה או לצידה. סדר שורות בקוד אינו מספיק, משום ששולח יכול לבצע חישובים עצמאיים בסדר כלשהו ולהישאר באותה בנייה קריפטוגרפית. החלק החשוב הוא מבנה התוצאה שהמקבל מקבל ואילו בדיקות עליו לבצע כדי לקבל בחזרה הודעה מאומתת.</p>\n<p>כאשר מצפינים ואז מתייגים, התג מחושב על התוכן המוצפן. המקבל יכול לבדוק את תקינות הקלט עוד לפני שפענח אותו. כאשר מתייגים ואז מצפינים, התג מחושב על המסר הגלוי ונכנס יחד איתו לתוך ההצפנה. המקבל חייב תחילה לפענח כדי לחלץ את שני החלקים, ורק אז הוא יכול לחשב תג ולבדוק התאמה. בבנייה השלישית מצפינים את המסר ובנפרד שולחים תג על המסר הגלוי; התג נמצא מחוץ להצפנה אך אינו מאמת ישירות את התוכן המוצפן.</p>\n<h3>קריאת קוד המקבל והשלכות אבטחתיות</h3>\n<p>קוד פענוח מספק בדרך כלל דרך פשוטה לזהות את הבנייה של השולח. אם השורה הראשונה מחשבת או בודקת תג של הטקסט המוצפן, מדובר במסלול של תיוג אחרי הצפנה. אם הפענוח מחזיר זוג של מסר ותג, ברור שבצד השולח שני אלה הוצפנו יחד. אם התג התקבל בנפרד ונבדק מול המסר המפוענח, זהו מסלול נפרד של הצפנה ותיוג. ההבחנה נקבעת לפי זרימת המידע, ולא לפי דמיון מילולי בין שמות האפשרויות.</p>\n<p>הצפנה לבדה נועדה לסודיות ואינה מתחייבת לזהות שינוי עוין. תיוג מוסיף שלמות ואימות מול מי שאינו מכיר את המפתח. עם זאת אין להסיק שכל חיבור שרירותי שלהם בטוח: טיפול שונה בשגיאות פענוח, חשיפת פרטי ריפוד או שימוש לא מתאים באותם מפתחות יכולים לפתוח ערוצי תקיפה. בתכנון מסודר מגדירים גם איך נמסר הווקטור ההתחלתי, על אילו שדות מחושב התג ומתי בודקים אותו. זיהוי שם הבנייה בשאלה אינו אישור אוטומטי לכל מימוש אפשרי שלה, אלא תיאור מדויק של היחס בין הפעולות והנתונים.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בעת העברת התג והטקסט המוצפן יש להגדיר גם את דרך הפרדת השדות. אם שני פורמטים שונים מתפרשים כאותו רצף בתים מאומת, עשוי להיווצר בלבול למרות שימוש בפרימיטיבים תקינים. לפיכך תיאור בנייה מלא כולל מבנה מסר חד־משמעי, מפתחות מתאימים וכללי דחייה. בשאלון זרימת הנתונים מספיקה לסיווג, אך היא אינה תחליף למפרט כזה במימוש אמיתי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21082025_0 (6).pdf","question_type":"multiple-choice","solution":"solutions/Q116.html"},{"id":"Q117","year":"2025","stem":"כיצד מבוצעת אימות עסקה ברשת ביטקוין?","options":["על ידי הכורים המאמתים את העסקה ומוסיפים אותה לבלוק הבא","על ידי הרשויות הממשלתיות בלבד","על ידי המשתמש ששולח את העסקה","על ידי שרת מרכזי של ביטקוין"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":5},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.219,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-21-05\" data-doc=\"original-21\" data-body-words=\"381\"><h2>שאלה 5 — אימות עסקה ברשת ביטקוין</h2><div class=\"answer-body\">\n<p><strong>א — הכורים מאמתים עסקאות ובוחרים עסקאות תקינות לבלוק מועמד.</strong> זו האפשרות המתאימה מתוך הנתונות, אך גם צמתים מלאים מאמתים עצמאית עסקאות ובלוקים; לא כל עסקה תקינה תיכלל בהכרח דווקא בבלוק הבא. ב אין סמכות ממשלתית מרכזית; ג השולח חותם ומשדר אך אינו המאמת היחיד; ד אין שרת מרכזי המכריע חוקיות.</p>\n<h3>חוקיות עסקאות לעומת הכרעה על סדר ההיסטוריה</h3>\n<p>עסקת ביטקוין מנסה להוציא פלטים קיימים ולהגדיר פלטים חדשים. הצמתים בודקים בין היתר שהפלטים הנצרכים קיימים, שלא נצרכו כבר בהיסטוריה הרלוונטית, שתנאי הפדיון מתקיימים ושהסכומים עומדים בכללי הפרוטוקול. חתימה תקינה מוכיחה הרשאה להשתמש בפלט מסוים, אך אינה פותרת לבדה מצב שבו בעל המפתח חתם על שתי עסקאות סותרות. לשתי עסקאות יכולות להיות חתימות תקינות, בעוד שאי אפשר לקבל את שתיהן באותה היסטוריה תקפה.</p>\n<p>הקונצנזוס מספק דרך להכריע איזו היסטוריה תיחשב פעילה כשיש ענפים מתחרים. כורים אוספים עסקאות לבלוק מועמד ומחפשים כותרת שעומדת ביעד הוכחת העבודה. צמתים המקבלים בלוק אינם צריכים לסמוך על הכרזת הכורה: הם מחשבים ובודקים את העבודה ואת חוקיות התוכן בעצמם. כורה רשאי לבחור מבין עסקאות תקינות, ואין כלל בסיסי שמחייב אותו לבחור דווקא את בעלות העמלות הגבוהות ביותר.</p>\n<h3>אישורים, הסתעפויות והיעדר סמכות מרכזית</h3>\n<p>שני כורים יכולים למצוא בלוקים קרובים בזמן ולגרום להסתעפות זמנית. בהמשך מתווספת עבודה לאחד הענפים, והצמתים מעדיפים את השרשרת התקפה בעלת העבודה המצטברת המרבית. אישורים נוספים מגדילים את העבודה שתידרש כדי להחליף את העסקה בהיסטוריה מתחרה. זו הגנה התלויה בהנחות על כוח התוקף ועל תנאי הרשת, ולא משפט שלפיו ארגון מחדש בלתי אפשרי לאחר מספר קבוע של בלוקים.</p>\n<p>לא נדרש שרת מרכזי שיחתום על כל בלוק שהתקבל, ולא נדרש מכל משתמש לכרות כדי לבצע עסקה. הארנק מנהל מפתחות וחתימות, הכורים מציעים סדר באמצעות בלוקים, והצמתים מאמתים באופן עצמאי. אין גם מנגנון כללי שבו כורה חייב להפקיד ערבון שנחתך בגלל הוצאה כפולה; רעיון כזה שייך לתכנונים אחרים ואינו הבסיס המתואר כאן. עצי מרקל מאפשרים לחייב אוסף עסקאות ולהוכיח הכלה ביעילות, אך אינם מצפינים אותן ואינם מחליפים את בדיקות החוקיות. ההפרדה בין התפקידים מונעת בלבול בין פרטיות, הרשאה, הוכחת עבודה וקונצנזוס.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בעת שינוי כללי הרשת צריך לבדוק גם תאימות בין צמתים שכבר עודכנו לבין צמתים ישנים. כלל חדש שמקבל בלוקים שנדחו בעבר עלול ליצור שרשראות שכל קבוצה מקבלת אחרת. כלל מצמצם בלבד יכול לאפשר תאימות מסוג אחר. לכן סיווג שינוי נקבע לפי קבוצת הבלוקים החוקיים ולא לפי השאלה אם ההצעה נשמעת מועילה, מהירה או חדשנית.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21082025_0 (6).pdf","question_type":"multiple-choice","solution":"solutions/Q117.html"},{"id":"Q118","year":"2025","stem":"נתון דף אינטרנט שמוצג בגלישה לURL הבא:\n```\nhttp://foo.com/?name=VALUE\n```\nהדף מציג את הערך של הפרמטר name ישירות בתוך תגית HTML כך:\n```\n<div id=\"greeting\">Welcome, VALUE</div>\n```\nללא כל סינון או קידוד של התוכן שמגיע מה-URL.\nבנוסף, בדף יש טופס עם Anti-CSRF Token שמוצג בטופס כך:\n```\n<form method=\"POST\" action=\"/update_password\">\n<input type=\"hidden\" name=\"csrf_token\" value=\"random_token_value\">\n<input type=\"password\" name=\"new_password\">\n<input type=\"submit\" value=\"Submit\">\n</form>\n```\nכאשר במקום random_token_value יופיע token אקראי שהשרת בחר.\nאיזו מהטענות הבאות אינה נכונה?","options":["ה-CSRF Token לא יכול להיגנב כי הוא ב-POST בלבד ולא ב-URL","הדף פגיע ל-Reflected XSS מכיוון שהפרמטר name מוצג ללא סינון","תוקף יכול להזריק קוד JavaScript ב-name ולגנוב את ה-csrf_token מהטופס","גניבת ה-csrf_token מאפשרת לתוקף לבצע בקשות POST עם טוקן תקין שהשרת יקבל כתקין"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":6},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.219,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-21-06\" data-doc=\"original-21\" data-body-words=\"405\"><h2>שאלה 6 — הטענה השגויה על XSS וטוקן</h2><div class=\"answer-body\">\n<p><strong>א — העובדה שהטוקן נשלח ב־POST אינה מונעת גניבה ב־XSS.</strong> הקוד הזדוני רץ ב־origin של foo.com ויכול לקרוא input[name=csrf_token] מה־DOM ולשלוח בקשת POST עם הטוקן. ב נכונה כי name מוחזר ל־HTML ללא קידוד ויוצר reflected XSS. ג נכונה כי ניתן לקרוא את השדה החבוי בסקריפט. ד נכונה בהקשר הסשן הנפגע: בקשה עם טוקן וסשן תואמים תתקבל; טוקן שנגנב אינו בהכרח שימושי בסשן אחר. hidden פירושו לא מוצג למשתמש, ולא סודי מפני JavaScript.</p>\n<h3>כיצד קוד מוזרק מקבל את הרשאות האתר</h3>\n<p>הדפדפן אינו יודע איזו פיסת קוד נכתבה בכוונה בידי מפתח האתר ואיזו נכנסה בגלל חיבור לא בטוח של קלט אל תוכן העמוד. כאשר טקסט שמקורו בפרמטר, במסד נתונים או בכתובת מוכנס להקשר שמפורש כקוד, הוא עלול לרוץ כחלק מן האתר. הסקריפט מקבל אז את ההרשאות של מקור האתר הפגיע, ולא של האתר שבו התוקף הכין את הקלט. זו הסיבה שמדיניות ההפרדה בין מקורות אינה הגנה מספקת לאחר שההזרקה כבר הצליחה.</p>\n<p>בהזרקה מוחזרת השרת מחזיר קלט של הבקשה לתוך התגובה בצורה מסוכנת. בהזרקה שמורה הקלט נשמר קודם, למשל בהודעת משתמש, ומוצג בהמשך למבקרים. בהזרקה מבוססת מסמך הקוד הפגיע שרץ בדפדפן קורא קלט לא אמין ומעביר אותו לפעולה שמפרשת תוכן. חשוב להבדיל בין המיקום שבו נמצאת החולשה לבין המקום שבו הקוד הזדוני רץ: בכל המקרים הנדונים קוד התקיפה רץ בדפדפן, אך במסלול המבוסס על המסמך גם העיבוד הפגיע עשוי להתרחש שם ללא יצירת התוכן הפגום בשרת.</p>\n<h3>מדוע טוקן חבוי אינו מגן מקוד באותו מקור</h3>\n<p>טוקן נגד זיוף בקשות אמור להיות סוד שהתוקף שמפעיל אתר אחר אינו יכול לקרוא, אף שהדפדפן יכול לשלוח עוגיית כניסה אוטומטית. כאשר לתוקף יש קוד בתוך האתר עצמו, ההנחה הזאת נשברת: הקוד יכול לקרוא שדה חבוי, לאתר טופס, ולהגיש בקשה עם הטוקן יחד עם הרשאות הסשן. שדה חבוי מסתיר רכיב מהתצוגה הרגילה, אך אינו מצפין אותו ואינו מסתיר אותו מתוכנית בדפדפן.</p>\n<p>גם שימוש בבקשת שליחה שאינה כוללת פרמטרים בכתובת אינו מונע קריאה של הטוקן מתוך העמוד. בדומה לכך, חסימת קריאת עוגייה בסקריפט אינה מונעת מהסקריפט להפעיל פעולה שהדפדפן שולח אליה את העוגייה בעצמו. ההגנה הראשונית היא מניעת הזרקת הקוד באמצעות קידוד המתאים להקשר, פעולות מסמך בטוחות ומדיניות תוכן משלימה. הגנות אלה פועלות לפני שהקוד מקבל את הרשאות המקור.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>דוגמת פעולה תקינה שהופכת למסוכנת היא הצגת שם משתמש: אם המפתח מכניס את השם באמצעות פעולה שמפרשת תגיות, תו שנועד להיות חלק מהשם עלול לפתוח רכיב פעיל. אם אותו שם מוכנס כטקסט בלבד, התגים מוצגים ולא מבוצעים. ההבדל הוא באופן השימוש בקלט, ולא בהכרח במקור שממנו הגיע או בהרשאות המשתמש שהקליד אותו.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21082025_0 (6).pdf","question_type":"multiple-choice","solution":"solutions/Q118.html"},{"id":"Q119","year":"2025","stem":"אתר מסחר אלקטרוני גדול מגלה שהמפתח הפרטי של תעודת ה-SSL/TLS שלו נגנב. הוא פונה ל CA שהנפיק לו את התעודה, וה CA מבטל את התעודה באופן מיידי. למרות זאת, חוקרי אבטחה מדווחים כי דפדפנים של משתמשים רבים עדיין מקבלים את התעודה הגנובה כתקפה במשך שעות לאחר הביטול הרשמי, ומאפשרים לתוקפים להפעיל אתרי פישינג. מבין האפשרויות הבאות, מהי סיבה אפשרית לפער הזמנים בין הביטול הרשמי לחוסר האפקטיביות שלו בפועל אצל משתמשי קצה?","options":["כאשר דפדפנים נתקלים בבעיית תקשורת רגעית או עיכוב בקבלת תשובה משרתי הביטול המוסמכים מטעם ה-CA, הם בוחרים להתייחס לתעודה כתקפה כדי לא לפגוע בחוויית המשתמש (מדיניות Fail-Soft)","שרתי אתר המסחר השתמשו ב-OCSP Stapling. התוקפים משתמשים במפתח הפרטי שגנבו כדי לחתום על אישור ה OCSP Stapling","יומני ה Certificate Transparency טרם התעדכנו באופן גלובלי בסטטוס הביטול. דפדפנים מסוימים המסתמכים על יומנים אלה לקבלת מידע נוסף על תעודות, מפספסים את עובדת הביטול","העדכון של כל שרתי השורש (Root Servers) בעולם לוקח מספר ימים"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":7},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.253,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-21-07\" data-doc=\"original-21\" data-body-words=\"404\"><h2>שאלה 7 — ביטול תעודה שאינו נאכף מיד</h2><div class=\"answer-body\">\n<p><strong>א — soft fail במקרה של כשל בירור.</strong> דפדפן עשוי להמשיך כאשר שרת הביטול אינו נגיש, ולכן תעודה מבוטלת עלולה להמשיך להתקבל. ב שגויה: מפתח האתר אינו מאפשר לזייף תשובת OCSP חתומה בידי משיב מורשה. ג שגויה: לוגי CT אינם מנגנון סטטוס ביטול שממנו מחכים לעדכון. ד מערבבת DNS root servers עם PKI וביטול. גם מטמון ותוקף תשובות יכולים להשפיע על השהיה בפועל; א היא הסיבה האפשרית המופיעה באפשרויות.</p>\n<h3>ביטול תעודה הוא עדכון אמון ולא שינוי במתמטיקה</h3>\n<p>תעודה עשויה להיות חתומה כחוק ועדיין להפסיק להיות אמינה לפני תאריך הפקיעה שלה, למשל מפני שמפתח פרטי נגנב. החתימה על התעודה אינה נעלמת כאשר הרשות מחליטה לבטל אותה, ולכן הלקוח זקוק למידע נוסף על סטטוסה. רשימת ביטול מפרסמת אוסף תעודות שבוטלו, ושירות סטטוס מקוון מאפשר לברר את המצב של תעודה מסוימת. בשני המקרים המקבל צריך לאמת שהמידע הגיע מגורם מורשה ושאינו ישן מדי.</p>\n<p>למפתח הפרטי של שרת האתר ולמפתח החתימה של רשות התעודות יש תפקידים שונים. גניבת מפתח האתר מאפשרת להתחזות לאתר בהקשרים שבהם התעודה עוד מתקבלת, אך אינה מאפשרת לחתום בשם הרשות על רשימת ביטול או תשובת סטטוס. אחרת כל שרת היה יכול לבטל את ביטולה של תעודתו בעצמו, וכל שרשרת האמון הייתה מאבדת את משמעותה. גם העתקת אישור קיים אינה מאפשרת לשנות את השדות שלו בלי לפגוע בחתימה.</p>\n<h3>הצמדה, פרטיות וכשל תקשורת</h3>\n<p>כאשר הדפדפן פונה ישירות לשירות הסטטוס, השירות עשוי ללמוד באיזו תעודת אתר הדפדפן מתעניין, ונוספות השהיה ותלות בזמינות רשת. הצמדת תשובת סטטוס מאפשרת לשרת האתר לקבל תשובה חתומה ולהגיש אותה ללקוחות במהלך ההקמה. השרת מעביר ראיה חתומה, ואינו מחליף את המשיב המורשה כחותם. הלקוח עדיין בודק התאמה, חתימה וטריות.</p>\n<p>מדיניות המשך במקרה כשל פירושה שאם הבירור אינו אפשרי, הלקוח עשוי להמשיך במקום לחסום. הדבר משפר זמינות אך עלול לאפשר לתוקף לחסום גישה לשירות הסטטוס ולנצל תעודה שכבר בוטלה. מכאן שפער בין ביטול אצל הרשות לבין אכיפה אצל משתמשים אינו מצביע בהכרח על זיוף חתימה: ייתכנו כשל תקשורת או מידע שמור שעוד נחשב עדכני. שקיפות תעודות פותרת בעיית גילוי הנפקות ואינה מחליפה את העברת הסטטוס הזה. גם שרתי שורש של מערכת שמות מתחם אינם רשויות ההפצה של ביטול תעודות, אף שבשני התחומים משתמשים במושג שורש.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>יש להבדיל גם בין ביטול תעודה לבין יצירת תעודה חדשה. הנפקת חלופה אינה גורמת אוטומטית לכל הדפדפנים להפסיק לקבל את הישנה, ותוקף עשוי להמשיך להציג את העותק שבידו. ניהול האירוע כולל לכן החלפת מפתח, הפצת מידע ביטול ובדיקת אכיפה אצל לקוחות. פעולה בצד שרת האתר בלבד אינה משנה את כל עוגני האמון והמטמונים של המשתמשים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21082025_0 (6).pdf","question_type":"multiple-choice","solution":"solutions/Q119.html"},{"id":"Q120","year":"2025","stem":"נתון הפרוטוקול הבא להעברה של מפתח משותף K מאליס לבוב:\n1. אליס מגרילה באקראי מפתח ארוך K.\n2. אליס מגרילה מחרוזת K<sub>A</sub> חד פעמית אקראית באורך |K|.\n3. אליס מחשבת את K<sub>1</sub> באופן הבא: K<sub>1</sub> = K xor K<sub>A</sub>, ואליס שולחת את K<sub>1</sub> לבוב.\n4. בוב מגריל מחרוזת K<sub>B</sub> חד פעמית אקראית באורך |K<sub>1</sub>|.\n5. בוב מחשב את K<sub>2</sub> באופן הבא: K<sub>2</sub> = K<sub>1</sub> xor K<sub>B</sub>, ושולח לאליס את K<sub>2</sub>.\n6. אליס מחשבת את K<sub>3</sub> באופן הבא: K<sub>3</sub> = K<sub>2</sub> xor K<sub>A</sub>, ואליס שולחת את K<sub>3</sub> לבוב.\n7. בוב מחשב: K<sub>3</sub> xor K<sub>B</sub>, ומקבל את K. איזו מהטענות הבאות נכונה?","options":["הפרוטוקול אינו מוגן כנגד אויב מאזין","הפרוטוקול מוגן כנגד אויב מאזין אך אינו מוגן כנגד אויב MitM","הפרוטוקול מוגן כנגד אויב מאזין וגם מוגן כנגד אויב MitM","הפרוטוקול מוגן כנגד אויב MitM, בתנאי שהאויב לא יכול לעכב הודעות"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":8},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.159,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-21-08\" data-doc=\"original-21\" data-body-words=\"416\"><h2>שאלה 8 — פרוטוקול שלוש הודעות XOR</h2><div class=\"answer-body\">\n<p><strong>א — אינו מוגן אפילו מול מאזין.</strong> המאזין רואה K₁=K⊕K_A,‏ K₂=K⊕K_A⊕K_B,‏ K₃=K⊕K_B. הוא מחשב K₁⊕K₂⊕K₃=K, כי כל מסכה מופיעה פעמיים ונעלמת ו־K מופיע שלוש פעמים. לכן ב וג שגויות כבר בהגנה הפסיבית, וד שגויה כי לא נדרש כלל לעכב או לשנות הודעות. למשל K=1010,‏ K_A=0011,‏ K_B=0101 נותנים 1001,1100,1111; XOR של שלושתם הוא 1010. העובדה שכל הודעה בנפרד ממוסכת אינה מבטיחה שכל התמליל בטוח.</p>\n<h3>ביטול מסכות בחיבור בלעדי</h3>\n<p>פעולת חיבור בלעדי על ביטים מחזירה אחת כאשר שני הביטים שונים ואפס כאשר הם שווים. יש לה שתי תכונות שמכריעות בניתוח פרוטוקולים עם מסכות: ערך המחובר לעצמו מתבטל לאפס, וחיבור לאפס אינו משנה את הערך. בנוסף אפשר לשנות את סדר האיברים ואת אופן קיבוצם בלי לשנות את התוצאה. לכן אפשר להסתכל על כל ביט בנפרד ולספור כמה פעמים כל סוד או מסכה מופיעים בביטוי.</p>\n<p>כאשר מסכה אקראית וחד־פעמית מסתירה מסר יחיד, צפייה בתוצאה לבדה אינה מספקת מידע על המסר. לכל מסר אפשרי קיימת מסכה מתאימה באותה הסתברות. אבל זאת טענה על התצפית היחידה והנחותיה, ולא רישיון להשתמש באותה מסכה ביחסים שונים ולשלוח את כולם. אם התמליל מספק כמה משוואות תלויות, המאזין יכול לחבר אותן ולבטל את המסכות בלי לנחש אף סוד.</p>\n<h3>ניתוח התמליל במקום כל הודעה בנפרד</h3>\n<p>בפרוטוקול של הוספת מסכה, הוספת מסכה נוספת והסרת הראשונה, שני הצדדים אכן יכולים להגיע בסוף לאותו סוד. נכונות הפעולה אינה שקולה לסודיות: העובדה שהמקבל משחזר כראוי אינה אומרת שמאזין חסר יכולת שיחזור. צריך לכתוב את כל ההודעות הנראות לתוקף, להציב זו בזו ולחפש צירוף שמבטל את הפרמטרים שאינם ידועים.</p>\n<p>אם כל מסכה מופיעה מספר זוגי של פעמים בצירוף כזה, היא נעלמת. אם המסר עצמו מופיע מספר אי־זוגי של פעמים, הוא נשאר. התקיפה דורשת רק הקלטת הודעות וביצוע חיבור בלעדי מקומי, ולכן עיכוב הודעות, שליטה בנתיב וזיוף צדדים אינם דרישות מוקדמות. חלופה הטוענת לביטחון מול מאזין נופלת כבר מול התצפית הזאת, עוד לפני שבודקים תוקף פעיל.</p>\n<p>המסקנה אינה שפעולת החיבור הבלעדי חלשה תמיד. אותה פעולה משמשת בבניות קריפטוגרפיות רבות כשהמפתחות והמסכות מנוהלים נכון. הכשל הוא חשיפת יחסים שמאפשרים ביטול. כדי לתכנן חילוף מפתחות אמיתי צריך להגדיר מה כל צד יודע מראש, מה המאזין רואה ואיזו הנחת קושי מונעת הסקת הסוד. בחירת שמות מסכות שונים אינה יוצרת הנחת קושי אם האלגברה הציבורית חושפת את התוצאה ישירות.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אפשר לאמת את התקיפה גם באופן ניסויי על ביט יחיד: בוחרים ערכים לסוד ולשתי המסכות, מחשבים את שלוש ההודעות ואז מחברים את כולן. לאחר מכן חוזרים עם בחירות אחרות ורואים שהזהות מתקיימת תמיד. ההוכחה האלגברית מסבירה מדוע הניסוי אינו צירוף מקרים. מאחר שכל ביט פועל בנפרד, אין משמעות ביטחונית להארכת המחרוזות בפרוטוקול הפגום הזה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21082025_0 (6).pdf","question_type":"multiple-choice","solution":"solutions/Q120.html"},{"id":"Q121","year":"2025","stem":"איזו מהטענות הבאות נכונה?","options":["צופן בלוקים פחות מאובטח מצופן One time pad (בגלל תכונת ה perfect secrecy)","ב PKI, שרת אינטרנט X שקיבל תעודה חתומה מ CA על ה public key של שרת האינטרנט, חייב ש ה\nCA שנתן לו (ל X) את התעודה יהיה ב root store של הלקוחות","ב TLS, שרת אינטרנט חייב לייצר בעצמו תעודה עבור כל חיבור TLS","הקמת חיבור TLS מחייבת שימוש בתעודה רק במקרה והחיבור מוקם בין שני שרתים"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":9},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":9}],"flags":[],"fixed_order":false,"exclude":false,"topic":"הצפנה סימטרית וצפנים קלאסיים","topic_score":0.309,"exam_count":1,"in_sample_exam":false,"variant_group":"V03","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-21-09\" data-doc=\"original-21\" data-body-words=\"420\"><h2>שאלה 9 — צופן בלוקים לעומת OTP</h2><div class=\"answer-body\">\n<p><strong>א — OTP תקין מספק perfect secrecy, בעוד צופן בלוקים רגיל מספק ביטחון חישובי.</strong> התנאים: מפתח אחיד, סודי, באורך המסר ושימוש יחיד. אין להסיק ש־OTP בשימוש שגוי עדיף בפועל. ב שגויה: מנפיק ישיר יכול להיות intermediate שמושרש ב־root אמין; ג אין צורך בתעודה חדשה לכל חיבור ואין דרישה שהשרת ינפיק לעצמו; ד תעודות שרת מופיעות גם בחיבור דפדפן־שרת רגיל, ומצבי TLS מסוימים מבוססי PSK אף אינם צריכים תעודות.</p>\n<h3>סודיות מושלמת לעומת ביטחון חישובי</h3>\n<p>בהצפנה באמצעות פנקס חד־פעמי המסר מחובר למסכה אחידה ועצמאית באותו אורך, והמסכה משותפת רק לצדדים המורשים. לכל טקסט מוצפן נתון ולכל מסר אפשרי באורך המתאים יש בדיוק מסכה אחת שמחברת ביניהם. מכיוון שכל המסכות באותה הסתברות, התצפית בטקסט המוצפן אינה משנה את התפלגות ההסתברות של המסר. זהו רעיון הסודיות המושלמת: גם תוקף עם כוח חישוב בלתי מוגבל אינו מקבל מידע נוסף מן ההצפנה תחת ההנחות הנכונות.</p>\n<p>צופן בלוקים רגיל משתמש במפתח קצר יחסית כדי להגן על נתונים רבים. מספר המפתחות האפשריים מוגבל, ובאופן עקרוני אפשר לנסות את כולם אם מתעלמים מעלות החישוב. הביטחון שלו לכן חישובי, והוא מבוסס על כך שהחיפוש או התקיפה הטובה ביותר אינם מעשיים בפרמטרים שנבחרו. אין פירוש הדבר שהצופן חסר תועלת; ההבדל הוא בסוג ההבטחה ובמשאבים הנדרשים מן התוקף.</p>\n<h3>המחיר של ההבטחה והקשר להפצת מפתחות</h3>\n<p>כדי לקבל את ההבטחה המושלמת צריך מפתח אקראי באמת, באורך המסר, הנשמר בסוד ושאינו משמש שוב. שימוש חוזר באותה מסכה לשני מסרים מאפשר לחבר את שני הטקסטים המוצפנים ולבטל את המסכה, וכך לחשוף יחס בין המסרים. בחירה של מסכה קצרה והרחבתה באמצעות מחולל דטרמיניסטי משנה גם היא את סוג ההבטחה, משום שהסוד הכולל כבר אינו אחיד על כל מחרוזות אורך המסר.</p>\n<p>הפצת כמות כזאת של סוד לצד האחר היא קושי מעשי מרכזי. שליחת המסכה באותו ערוץ שמאזין יכול לקרוא אינה פותרת את הבעיה; היא מספקת לו את הכלי לפענוח. הצפנת מפתח ציבורי או חילוף מפתחות יכולים להתמודד עם הפצה בהנחות חישוביות שונות, ולכן אין להתבלבל ביניהם לבין פנקס חד־פעמי.</p>\n<p>בנוסף, סודיות מושלמת אינה מבטיחה שלמות או מקור מאומת. מי שיכול לשנות ביטים בטקסט המוצפן עשוי לגרום לשינויים מתאימים אחרי הפענוח אם אין שכבת אימות. ההשוואה בשאלה צריכה להישאר בתכונת הסודיות המבוקשת ולתנאי השימוש המדויקים, ולא להפוך לטענה שכל שימוש בפנקס חד־פעמי בטוח יותר מכל מערכת מודרנית בכל היבט.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>כאשר משווים מנגנונים יש לקבע גם מה נחשב סוד מראש. אם לשני הצדדים כבר קיים מפתח אקראי ארוך שהופץ בבטחה, לפנקס החד־פעמי יש הבטחה חזקה. אם כל התקשורת מתחילה בערוץ חשוף בלי סוד משותף, אי אפשר פשוט להניח שמסכה כזאת זמינה. הצגת שתי הנחות ההתחלה מונעת פתרון מדומה שבו קושי הפצת המפתח הועבר לשלב שלא הוסבר.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21082025_0 (6).pdf","question_type":"multiple-choice","solution":"solutions/Q121.html"},{"id":"Q122","year":"2025","stem":"איזה מהאלגוריתמים הבאים הוא אלגוריתם השייך לקריפטוגרפיה א-סימטרית?","options":["RSA","MAC","HASH","AES"],"note":"","sources":[{"file":"2025/689156_21082025_0 (6).pdf","date":"21/08/2025","num":10},{"file":"2025/689156_21082025_0 (7).pdf","date":"21/08/2025","num":10}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.213,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-21-10\" data-doc=\"original-21\" data-body-words=\"369\"><h2>שאלה 10 — אלגוריתם א־סימטרי</h2><div class=\"answer-body\">\n<p><strong>א — RSA.</strong> הוא משתמש במפתח פומבי ופרטי. ב MAC רגיל מבוסס סוד סימטרי משותף; ג hash הוא פונקציה לא ממופתחת ואינו הצפנת מפתח פומבי; ד AES הוא צופן סימטרי. אלגוריתם hash יכול להיות רכיב בסכמת חתימה, אך אינו א־סימטרי בפני עצמו.</p>\n<h3>בניית המפתח ומשמעות החשבון המודולרי</h3>\n<p>באלגוריתם הנדון בוחרים שני ראשוניים שונים, מכפילים אותם לקבלת המודולוס, ומחשבים את מספר השאריות הזרות למודולוס. במקרה של מכפלת שני ראשוניים המספר הזה הוא מכפלת שני המספרים הקטנים באחד מן הראשוניים. לאחר מכן בוחרים מעריך ציבורי הזר למספר שהתקבל, ומוצאים לו הופכי כפל מודולרי שישמש כמעריך הפרטי. המודולוס משותף לשני המפתחות; החלפתו במספר אחר אינה יוצרת מפתח פרטי מתאים לאותו מפתח ציבורי.</p>\n<p>הדרישה להופכי פירושה שמכפלת שני המעריכים משאירה שארית אחת בחלוקה במספר השאריות הזרות. לכן אין צורך שהמעריכים יהיו שונים, גדולים במיוחד או אחד ראשוני ואחד לא. יש לבדוק את משוואת ההופכי במפורש. באימות חלופות של מפתח, חישוב המכפלה והשארית הוא בדיקה ישירה וקצרה הרבה יותר מניסיון להצפין אוסף מסרים ולקוות שהכול עובד.</p>\n<h3>חתימה, אימות ודרך חישוב יעילה</h3>\n<p>בחתימת ספר לימוד על מסר מספרי מעלים את המסר בחזקת המעריך הפרטי ומצמצמים מודולו המודולוס. לא מצפינים במפתח הציבורי כדי לחתום. כדי לאמת מעלים את החתימה בחזקת המעריך הציבורי ובודקים שחזר המסר. כאשר נדרשים לשחזר מסר מחתימה, זהו אותו כיוון אימות, גם אם השאלה מספקת תחילה דווקא את המעריך הפרטי. ההסבר המקדים לכל שאלה מיישם את התפקידים האלה על המספרים המסוימים שבה.</p>\n<p>אפשר לבצע את החזקות באמצעות ריבועים חוזרים: מחשבים חזקה שנייה, ממנה רביעית וכן הלאה, ובכל שלב שומרים רק את השארית. אחר כך מכפילים את החזקות המתאימות לפירוק הבינארי של המעריך. כך נשמרים מספרים קטנים ונמנעות טעויות של כתיבת מספר עצום. כל המספרים הקטנים בשאלון נועדו להדגים את המתמטיקה ואינם מפתחות בטוחים לשימוש. חתימה מעשית גם אינה חתימת ספר לימוד ישירה על מספר שרירותי; נדרשים גיבוב, קידוד חתימה תקני ובדיקת תקינות של המפתחות כדי למנוע מניפולציות שלא נלמדות מן החשבון הפשוט בלבד.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בדיקה נוספת מועילה היא להחזיר את התוצאה דרך הפעולה ההפוכה: אם חושבה חתימה, מאמתים אותה ומוודאים שחזר המסר; אם נבחר מעריך פרטי, בודקים את מכפלתו במעריך הציבורי. שאריות שליליות מותרות בזמן החישוב, אבל את התוצאה הסופית נוח להציג כנציג שאינו שלילי וקטן מן המודולוס. כך ניתן לזהות מסיח שמייצג מספר גדול או פעולה בכיוון הלא נכון.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_21082025_0 (6).pdf","question_type":"multiple-choice","solution":"solutions/Q122.html"},{"id":"Q123","year":"2025","stem":"איזו תכונה חתימות דיגיטליות מאפשרות ש Message Authentication Codes לא מאפשרות?","options":["אי-יכולת הכחשה","סודיות","אמינות המידע","אותנטיות"],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf","date":"05/10/2025","num":1}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.311,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-18-01\" data-doc=\"original-18\" data-body-words=\"373\"><h2>שאלה 1 — חתימות לעומת MAC</h2><div class=\"answer-body\">\n<p><strong>א — אי־יכולת הכחשה.</strong> חתימה ניתנת לאימות ציבורי ורק בעל המפתח הפרטי אמור להיות מסוגל לייצרה; ב־MAC גם המקבל מכיר את סוד התיוג ולכן יכול לייצר תג בעצמו. ב אינה מובטחת לא בחתימה ולא ב־MAC; ג וד מתקבלות בשניהם בהנחות המפתחות המתאימות. הוכחה מחייבת גם קישור אמין בין מפתח לזהות ושמירה על המפתח הפרטי.</p>\n<h3>משמעות האימות ואופן הבדיקה</h3>\n<p>שלמות פירושה שהמקבל מסוגל לזהות שינוי בלתי מורשה בתוכן, ואותנטיות פירושה שיוך ההודעה למי שמחזיק בסוד המתאים. אלה תכונות נפרדות מסודיות: אפשר לפרסם הודעה לכל העולם ובכל זאת לוודא שלא שונתה ומי אישר אותה. בתהליך תיוג סימטרי הצדדים מחזיקים מפתח סודי משותף, השולח מפעיל פונקציית תיוג על המפתח ועל כל בתיה של ההודעה, והמקבל מחשב שוב את התג ומקבל רק אם הוא תואם לתג שנשלח. התוקף רשאי להכיר את האלגוריתם ואף לצפות בהודעות מתויגות רבות; הביטחון אמור לנבוע מחוסר ידיעת המפתח ולא מהסתרת שיטת החישוב.</p>\n<p>נניח שההודעה אומרת להעביר מאה שקלים, ומאזין מחליף אותה בהוראה להעביר תשע מאות. התג הישן חושב על רצף בתים אחר, ולכן בדיקת המקבל נכשלת. גם אם התוקף יודע לחשב גיבוב ציבורי, הוא אינו יכול להחליף אותו בתג תקף ללא המפתח. מסיבה זו גיבוב רגיל המצורף להודעה אינו מספק אותה הגנה: תוקף המשנה הודעה יכול פשוט לחשב מחדש את הגיבוב שלה.</p>\n<h3>מה אפשר להסיק ומה מחייב מנגנון נוסף</h3>\n<p>הבדיקה מעידה שההודעה אושרה בידי בעל המפתח, אך אינה מוכיחה למישהו חיצוני שרק השולח יכול היה ליצור אותה. גם המקבל יודע את המפתח ולכן מסוגל לייצר תג תקין. חתימה דיגיטלית משנה את חלוקת היכולות: החותם מחזיק מפתח פרטי, בעוד המאמתים מקבלים מפתח ציבורי שאינו מקנה יכולת חתימה. ההבחנה הזאת מסבירה מדוע אי־יכולת הכחשה דורשת חתימות ולא תג סימטרי בלבד. בשני המקרים צריך להגן על המפתחות ולקשור אותם לזהויות הנכונות. בנוסף, הודעה ישנה עם תג תקין נשארת תקינה מבחינה מתמטית; למניעת שידור חוזר יש לכלול מספר רצף, אתגר או מזהה פעולה ולבדוק אותם. התג אינו מצפין את התוכן, ולכן הצורך בסודיות מחייב שילוב מתאים עם הצפנה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>כדאי לבדוק גם בדיוק אילו שדות נכללים באימות: אם התג מכסה רק סכום אך אינו מכסה את הנמען, תוקף יכול להשאיר סכום תקין ולשנות את כתובת התשלום. המקבל צריך לאמת ייצוג חד־משמעי של כל פרטי הפעולה הרלוונטיים. עצם קיום תג אינו מבטיח ששדה שהושמט מן הקלט מוגן, ולכן ניתוח שלמות מתחיל בהגדרת המסר המאומת.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_05102025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q123.html"},{"id":"Q124","year":"2025","stem":"ב TLS, ה pre master secret מוצפן לפני העברתו אל השרת על ידי:","options":["המפתח הפומבי של השרת","המפתח הפרטי של השרת","המפתח הפומבי של הלקוח","המפתח הפרטי של הלקוח"],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf","date":"05/10/2025","num":2}],"flags":[],"fixed_order":false,"exclude":false,"topic":"TLS / HTTPS","topic_score":0.391,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-18-02\" data-doc=\"original-18\" data-body-words=\"363\"><h2>שאלה 2 — הצפנת pre-master secret</h2><div class=\"answer-body\">\n<p><strong>א — במפתח הפומבי של השרת.</strong> זהו חילוף מפתחות RSA ב־TLS הישן: הלקוח מצפין והשרת מפענח בפרטי שלו. ב הופכת את תפקידי המפתחות; ג הייתה מייעדת פענוח ללקוח; ד היא מפתח חתימה של הלקוח, אם בכלל יש כזה. ב־TLS 1.3 אין חילוף מפתחות RSA כזה.</p>\n<h3>חלוקת התפקידים בהקמת הערוץ</h3>\n<p>בתחילת החיבור הלקוח והשרת עדיין אינם חולקים את מפתחות התעבורה החדשים. הלקוח פותח במשא ומתן על פרמטרים, השרת בוחר מבין האפשרויות המותרות ומציג אמצעי אימות מתאים, ובהמשך הצדדים מפיקים סוד משותף וממנו מפתחות. בהקשר מבוסס תעודות הלקוח בודק שהמפתח שהוצג קשור לשם האתר שאליו התכוון להגיע וששרשרת החתימות מובילה לשורש אמין. קיום חתימה חוקית כשלעצמו אינו מספיק אם התעודה שייכת לאתר אחר או אם אינה בתוקף.</p>\n<p>בשאלות המתארות חילוף מפתחות באמצעות הצפנה במפתח ציבורי של השרת, הלקוח יוצר סוד ראשוני ומצפין אותו כך שרק בעל המפתח הפרטי יוכל לפענחו. זהו מסלול היסטורי, ואין להשליך ממנו שכל חיבור מודרני פועל כך. בחילוף מפתחות זמני מבוסס דיפי–הלמן, מפתח התעודה משמש לאימות פרמטרים והסוד אינו מועבר באותה הצפנת מפתח ציבורי. להבחנה יש משמעות כאשר מפתח התעודה נגנב לאחר הקלטת התקשורת.</p>\n<h3>תמליל מאומת וגזירת מפתחות</h3>\n<p>בסוף הקמת החיבור הצדדים בודקים ערכים התלויים בתמליל הודעות ההקמה ובסודות שהפיקו. כך ניתן לזהות תוקף שהחליף הודעה בדרך גם אם היא נראית תקינה מבחינת התחביר. אם כל צד זוכר תמליל אחר, ערכי האימות אינם תואמים. שינוי שהורס תחביר או מונע הסכמה יכול כמובן לגרום לכשל מוקדם יותר, ולכן יש להבחין בין זיהוי אפשרי לבין זיהוי קריפטוגרפי מובטח בשלב האימות.</p>\n<p>מספרים אקראיים והקשר ההקמה נכללים בגזירת המפתחות כדי להבחין בין חיבורים ולהקטין שימוש חוזר בלתי רצוי בחומר מפתחות. נגזרים מפתחות נפרדים לכיווני התעבורה; באותו כיוון הצד המצפין והצד המפענח משתמשים בסוד הסימטרי המתאים. לאחר ההקמה אין צורך להצפין כל הודעת יישום בעזרת המפתח הציבורי שבתעודה. ההצפנה הסימטרית מגינה על התעבורה, ואימות השלמות מונע שינויים שקטים. כל זאת עדיין תלוי בבדיקה נכונה של זהות השרת ובהגנת המפתחות.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>יש גם להבחין בין מפתח ארוך־טווח שמזהה אתר לבין מפתח זמני של חיבור מסוים. תעודה יכולה לשמש חיבורים רבים, בעוד מפתחות תעבורה חדשים מופקים בכל הקמה מתאימה. לכן ידיעת תעודה ציבורית אינה ידיעת מפתח הפענוח של הסשן. חזרה של תעודת האתר בחיבורים שונים אינה כשלעצמה שימוש חוזר באותו מפתח הצפנה סימטרי לתוכן המשתמשים.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_05102025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q124.html"},{"id":"Q125","year":"2025","stem":"איזה מהתיאורים הבאים מתאר את התקפת ARP poisoning?","options":["תוקף שולח הודעות ARP שקריות בהן הוא משקר לגבי מיפוי בין כתובת MAC ו IP, כדי שהתעבורה של הקורבן תגיע אליו (אל התוקף).","תוקף שולח הודעות ARP רבות אל ה switch כדי להציף את הטבלה של ה switch במיפויים שקריים.","תוקף מאזין לתעבורת ARP ומזהה הודעות ARP פגיעות, ומחלץ מהן את כתובת ה IP של הקורבנות.","תוקף שולח הודעות ARP אל שרת ה DNS המקומי של הרשת, כדי ששרת ה DNS יעבוד כמו hub במקום כמו switch."],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf","date":"05/10/2025","num":3}],"flags":[],"fixed_order":false,"exclude":false,"topic":"רשתות: ARP, DNS, DoS ו-Firewall","topic_score":0.34,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-18-03\" data-doc=\"original-18\" data-body-words=\"382\"><h2>שאלה 3 — ARP poisoning</h2><div class=\"answer-body\">\n<p><strong>א — הודעות ARP כוזבות שמחליפות מיפוי IP→MAC במיפוי לתוקף.</strong> כך מסגרות מגיעות אליו. ב מבלבלת עם הצפת טבלת MAC של מתג; ג היא האזנה בלבד ולא הרעלה; ד מייחסת לשרת DNS מצב עבודה של ציוד שכבה שנייה, ללא משמעות בפרוטוקול.</p>\n<h3>מסלול החבילה לפני ההרעלה ואחריה</h3>\n<p>ברשת מקומית יש להבחין בין כתובת היעד של חבילת האינטרנט לבין כתובת המתאם שאליו נמסרת המסגרת המקומית. כתובת אינטרנט מזהה את היעד הלוגי של התקשורת, ואילו כתובת חומרה משמשת למסירת מסגרת ברשת המקומית. כאשר היעד נמצא באותה רשת, המחשב צריך למצוא איזו כתובת חומרה מתאימה לכתובת האינטרנט שלו. פרוטוקול פתרון הכתובות מספק את המיפוי הזה ושומר אותו במטמון כדי שלא יהיה צורך לשאול מחדש בכל מסגרת.</p>\n<p>הכשל שנוצל במודל השאלה הוא היעדר אימות קריפטוגרפי של הודעות המיפוי. התוקף משדר הודעה שלפיה כתובת האינטרנט של הקורבן האחר נמצאת בכתובת החומרה של התוקף. הקורבן מעדכן את המטמון וממשיך לבנות חבילות לאותו יעד מקורי, אך עוטף אותן במסגרת המיועדת לתוקף. אם התוקף מעביר את החבילות הלאה, התקשורת עשויה להיראות רגילה והמשתמשים אינם מקבלים בהכרח סימן גלוי להרעלה.</p>\n<h3>יכולות התוקף וגבולות ההתקפה</h3>\n<p>כדי לקבל מיקום בין שני הצדדים בדרך כלל מרעילים את המיפוי בכל אחד מהם, או את המיפוי בין הקורבן לשער ברירת המחדל. התוקף יכול אז לצפות, לעכב, להשמיט ולהעביר מסגרות, ובהיעדר הגנות גבוהות יותר גם לשנות נתונים. מכאן לא נובעת ידיעה של מפתח הצפנה: כאשר מופעל ערוץ מוצפן ומאומת כראוי, הנתונים נשארים מוצפנים ושינויים בלתי מורשים מתגלים. עצם ההגעה לתעבורה אינה מאפשרת לייצר חתימה דיגיטלית בשם אחר.</p>\n<p>המושג הזרקה מחוץ לנתיב מתאר כאן תוקף שיש לו גישה מתאימה לאותו תחום שידור, אך עדיין אינו מעביר את התקשורת דרכו. ההרעלה היא שיוצרת לו עמדה כזאת. אין פירוש הדבר שכל מחשב מרוחק באינטרנט יכול לשלוח הודעות כאלה דרך נתבים. יש גם להבחין מהצפת טבלת מתג: זו התקפה על למידת מיקומי כתובות חומרה במתג, בעוד כאן משנים את הבנת המחשבים לגבי הקשר בין שתי שכבות כתובות. בקרות ברשת המקומית או אימות הערוץ בשכבות העליונות מתמודדים עם היבטים שונים של הבעיה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>במקרה שבו יעד החבילה נמצא מחוץ לרשת המקומית, המחשב בדרך כלל פותר את כתובת החומרה של שער ברירת המחדל ולא של השרת המרוחק. התוקף יכול להתחזות לשער באותו מנגנון עקרוני. גם אז כתובת היעד של חבילת האינטרנט נשארת כתובת השרת; רק התחנה המקומית הראשונה שאליה נמסרת המסגרת הוחלפה. הבחנה זו מונעת בלבול בין הרעלה לשינוי נתיב לוגי.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_05102025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q125.html"},{"id":"Q126","year":"2025","stem":"איזה מהתרחישים הבאים ייחסמו על ידי מנגנון ה Same Origin Policy?","options":["סקריפט שהגיע מ foo.com (זה ה origin של הסקריפט) מנסה לקרוא תוכן של תשובת http שמגיעה מ bar.com","עמוד שהגיע מ foo.com מנסה לטעון תמונה מהדומיין bar.com","סקריפט זדוני שהוחדר לעמוד שהגיע מ foo.com ושולח את פרטי הcookie של הקורבן אל bar.com","משתמש גלש לאתר foo.com ובאתר זה ישנו סקריפט ששולח טופס אל הדומיין bar.com שאליו המשתמש מחובר (ולכן הדפדפן צירף את ה cookie של המשתמש לבקשה)"],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf","date":"05/10/2025","num":4}],"flags":[],"fixed_order":false,"exclude":false,"topic":"אבטחת Web","topic_score":0.25,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-18-04\" data-doc=\"original-18\" data-body-words=\"403\"><h2>שאלה 4 — מה SOP חוסם</h2><div class=\"answer-body\">\n<p><strong>א — קריאת תגובת bar.com מתוך סקריפט שמקורו foo.com, בהיעדר היתר CORS.</strong> ב: הטענת תמונה בין מקורות מותרת בדרך כלל. ג: SOP אינה מונעת מסקריפט שכבר רץ ב־foo לקרוא את עוגיות foo הנגישות לו ולשלוח מידע החוצה. ד: שליחת טופס בין מקורות אינה חסומה עקרונית, וזה הבסיס ל־CSRF. הגבלות SameSite או CSP עשויות להוסיף הגנות אחרות.</p>\n<h3>ההבחנה בין שליחת בקשה לקריאת תשובה</h3>\n<p>מדיניות המקור הזהה מגבילה יכולת של קוד שמגיע ממקור אחד לקרוא מידע רגיש של מקור אחר. מקור מוגדר לפי סכימה, שם מארח ופורט, ולא רק לפי הופעת שם דומה בכתובת. לדוגמה, קוד באתר תוקף אינו רשאי לקבל את תוכן עמוד החשבון באתר בנק רק מפני שהמשתמש מחובר לשניהם באותו דפדפן. בלי הפרדה כזאת כל אתר שהמשתמש פותח היה יכול לנסות לקרוא מידע מכל שירות שבו נשמרה הרשאה.</p>\n<p>עם זאת, הדפדפן מאפשר פעולות רבות שחוצות מקורות כחלק רגיל מהאינטרנט: הצגת תמונה, ניווט ושליחת טופס הם דוגמאות מרכזיות. מכאן נובע ההבדל בין היכולת לגרום לבקשה לצאת לבין היכולת לקרוא את תשובתה. תוקף עשוי לא להיות מסוגל לראות את גוף התגובה ובכל זאת להצליח לגרום לפעולה שמשנה מצב בשרת. תשובה ריקה אף מדגישה שלא תמיד יש צורך לגנוב מידע כדי לגרום נזק.</p>\n<h3>מדוע נדרשת הגנה נפרדת על פעולות רגישות</h3>\n<p>כאשר עוגיית כניסה נשלחת אוטומטית בבקשה, השרת יודע לאיזה סשן הבקשה שייכת, אך אינו יודע בהכרח אם המשתמש התכוון להפעיל אותה. אתר תוקף יכול לגרום לדפדפן לבקר בכתובת פעולה או להגיש טופס. טוקן אקראי הקשור לסשן, בדיקת הקשר מקור והגבלת עוגיות בין אתרים מספקים שכבות אימות נוספות. עצם השימוש בעוגיות או בשיטת בקשה מסוימת אינו הוכחה שהפעולה יזומה ומותרת.</p>\n<p>המדיניות גם אינה מונעת קוד שכבר רץ בתוך המקור הפגיע מלקרוא את תוכנו. בהזרקת סקריפט מוצלחת התוקף אינו מבקש לקרוא מבחוץ; הוא גרם לאתר עצמו להריץ את הקוד שלו. לכן טענה שהפרדה בין מקורות פותרת סוג מסוים של הזרקת סקריפט ומותירה רק סוג אחר אינה נכונה כעיקרון כללי. מאידך, קוד רגיל באתר זר שמנסה לקרוא ישירות עוגייה או תגובה של האתר האחר אכן אמור להיחסם, אלא אם ניתנה הרשאה מתאימה. שיטת הניתוח היא תמיד לזהות את מקור הקוד, את משאב היעד ואת הפעולה המדויקת: קריאה, טעינה או שליחה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>גם לשם אתר ולמושג מקור יש גבולות שונים ממושג אתר בהגדרת עוגיות. לפיכך שתי כתובות שנראות קשורות ארגונית עשויות להיות מקורות שונים, והחלפת פורט או סכימה יכולה לשנות את כללי הקריאה. בשאלון משתמשים במקרים הפשוטים כדי להדגיש את ההבדל בין מקורות, אבל במימוש יש לחשב את המקור המדויק ולא להסתפק בבדיקת קטע משותף בשם.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_05102025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q126.html"},{"id":"Q127","year":"2025","stem":"אליס פיתחה קליינט ביטקוין ״רזה״, כלומר, הקליינט שפיתחה שומר רק את רשימת העסקאות שנכללות בבלוקצ׳יין אבל עדיין לא בוזבזו ורק את הבלוק האחרון בבלוקצ׳יין. איזו מבין הטענות הבאות נכונה?","options":["הקליינט הזה לא יכול להתמודד בעצמו עם forkים מסויימים.","הקליינט הזה שומר יותר מידע ממה ש miner שומר.","הקליינט הזה לא יכול לוודא את ה proof of work של בלוק חדש שמוצג בפניו.","הקליינט הזה לא יכול להיות בשימוש, כי אינו קליינט רשמי שאושר על ידי ביטקוין."],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf","date":"05/10/2025","num":5}],"flags":[],"fixed_order":false,"exclude":false,"topic":"ביטקוין ובלוקצ׳יין","topic_score":0.228,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-18-05\" data-doc=\"original-18\" data-body-words=\"391\"><h2>שאלה 5 — לקוח ביטקוין ששומר רק מצב נוכחי</h2><div class=\"answer-body\">\n<p><strong>א — אינו יכול להתמודד בעצמו עם forks מסוימים.</strong> כדי לבטל ענף קודם וליישם אחר צריך מידע על היסטוריה או נתוני undo שאין לו. ב: הוא שומר פחות מצומת מלא. ג: ניתן לבדוק hash ויעד קושי של כותרת בלוק חדש בלי כל ההיסטוריה, אף שאימות מלא של שרשרת הקושי דורש הקשר נוסף. ד: אין חובה בלקוח ״רשמי״, רק בעמידה בכללי הרשת.</p>\n<h3>חוקיות עסקאות לעומת הכרעה על סדר ההיסטוריה</h3>\n<p>עסקת ביטקוין מנסה להוציא פלטים קיימים ולהגדיר פלטים חדשים. הצמתים בודקים בין היתר שהפלטים הנצרכים קיימים, שלא נצרכו כבר בהיסטוריה הרלוונטית, שתנאי הפדיון מתקיימים ושהסכומים עומדים בכללי הפרוטוקול. חתימה תקינה מוכיחה הרשאה להשתמש בפלט מסוים, אך אינה פותרת לבדה מצב שבו בעל המפתח חתם על שתי עסקאות סותרות. לשתי עסקאות יכולות להיות חתימות תקינות, בעוד שאי אפשר לקבל את שתיהן באותה היסטוריה תקפה.</p>\n<p>הקונצנזוס מספק דרך להכריע איזו היסטוריה תיחשב פעילה כשיש ענפים מתחרים. כורים אוספים עסקאות לבלוק מועמד ומחפשים כותרת שעומדת ביעד הוכחת העבודה. צמתים המקבלים בלוק אינם צריכים לסמוך על הכרזת הכורה: הם מחשבים ובודקים את העבודה ואת חוקיות התוכן בעצמם. כורה רשאי לבחור מבין עסקאות תקינות, ואין כלל בסיסי שמחייב אותו לבחור דווקא את בעלות העמלות הגבוהות ביותר.</p>\n<h3>אישורים, הסתעפויות והיעדר סמכות מרכזית</h3>\n<p>שני כורים יכולים למצוא בלוקים קרובים בזמן ולגרום להסתעפות זמנית. בהמשך מתווספת עבודה לאחד הענפים, והצמתים מעדיפים את השרשרת התקפה בעלת העבודה המצטברת המרבית. אישורים נוספים מגדילים את העבודה שתידרש כדי להחליף את העסקה בהיסטוריה מתחרה. זו הגנה התלויה בהנחות על כוח התוקף ועל תנאי הרשת, ולא משפט שלפיו ארגון מחדש בלתי אפשרי לאחר מספר קבוע של בלוקים.</p>\n<p>לא נדרש שרת מרכזי שיחתום על כל בלוק שהתקבל, ולא נדרש מכל משתמש לכרות כדי לבצע עסקה. הארנק מנהל מפתחות וחתימות, הכורים מציעים סדר באמצעות בלוקים, והצמתים מאמתים באופן עצמאי. אין גם מנגנון כללי שבו כורה חייב להפקיד ערבון שנחתך בגלל הוצאה כפולה; רעיון כזה שייך לתכנונים אחרים ואינו הבסיס המתואר כאן. עצי מרקל מאפשרים לחייב אוסף עסקאות ולהוכיח הכלה ביעילות, אך אינם מצפינים אותן ואינם מחליפים את בדיקות החוקיות. ההפרדה בין התפקידים מונעת בלבול בין פרטיות, הרשאה, הוכחת עבודה וקונצנזוס.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>בעת שינוי כללי הרשת צריך לבדוק גם תאימות בין צמתים שכבר עודכנו לבין צמתים ישנים. כלל חדש שמקבל בלוקים שנדחו בעבר עלול ליצור שרשראות שכל קבוצה מקבלת אחרת. כלל מצמצם בלבד יכול לאפשר תאימות מסוג אחר. לכן סיווג שינוי נקבע לפי קבוצת הבלוקים החוקיים ולא לפי השאלה אם ההצעה נשמעת מועילה, מהירה או חדשנית.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_05102025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q127.html"},{"id":"Q128","year":"2025","stem":"אליס ובוב מעוניינים לדבר אחד עם השניה בצורה מאובטחת, כך שרק הם ידעו מה הם שולחים ביניהם. אליס ובוב יצרו לעצמם (כל אחד בנפרד), מפתח פומבי ומפתח פרטי. אליס ובוב אינם יודעים את המפתחות אחד של השני, גם לא את הפומביים. הם משתמשים בשירות מסרים, ולשירות זה יש שרת שיודע את המפתחות הפומביים האמיתיים של כל הלקוחות, כולל של אליס ובוב. השרת הינו תקין ואינו בשליטת תוקף.\nאליס פונה אל השרת ומבקשת את המפתח הפומבי של בוב. השרת שולח לה בחזרה: את המפתח הפומבי של בוב, את התאריך והשעה הנוכחיים, וחתימה דיגיטלית על הערכים הללו (מפתח פומבי ותאריך ושעה) שנחתמה על ידי המפתח הפרטי של השרת (כל הלקוחות יודעים את המפתח הפומבי האמיתי של השרת). האם הפרוטוקול הנ״ל בטוח?","options":["לא, תוקף MitM יכול לגרום לאליס לחשוב שהמפתח של התוקף זה המפתח של בוב.","לא, תוקף off-path יכול לגרום לשרת לחשוב שהמפתח של בוב זה המפתח של אליס.","לא, תוקף eavesdropper יכול לגרום לשרת לחשוב שהמפתח של בוב זה המפתח של אליס.","כן, שום תוקף לא יכול לנצל לרעה את הפרוטוקול בזכות השימוש המתואר בחתימה דיגיטלית."],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf","date":"05/10/2025","num":6}],"flags":[],"fixed_order":false,"exclude":false,"topic":"RSA, מפתח ציבורי וחתימות","topic_score":0.21,"exam_count":1,"in_sample_exam":false,"variant_group":null,"accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-18-06\" data-doc=\"original-18\" data-body-words=\"420\"><h2>שאלה 6 — שרת מפתחות עם חתימה חסרת זהות</h2><div class=\"answer-body\">\n<p><strong>א — הפרוטוקול אינו בטוח מול MITM.</strong> החתימה מכסה רק (מפתח, זמן) ואינה קושרת אותם לבוב. התוקף משנה את בקשת אליס לבקשה למפתח שלו, מקבל מהשרת חתימה חוקית ורעננה על מפתח התוקף, ומעביר אותה לאליס כתשובה לבקשת בוב. אליס תוודא חתימה תקינה אך תשייך את המפתח לזהות שגויה. ב וג אינן מתארות את התקיפה והמאזין הפסיבי אינו משנה בקשות. ד שגויה: חתימה אינה מגינה על שדה זהות שלא נחתם. תיקון: לחתום על זהות, מפתח, תוקף והקשר הבקשה.</p>\n<h3>חתימה מאמתת רק את מה שנכלל בה</h3>\n<p>חתימה דיגיטלית מוכיחה שמי שמחזיק במפתח החתימה הפרטי אישר רצף נתונים מסוים. היא אינה משלימה בעצמה שדות שהושמטו, ואינה קובעת למה התכוון המקבל בבקשה ששלח קודם. אם שרת מדריך חותם על מפתח ציבורי וזמן אבל אינו כולל את שם בעל המפתח, המקבל יכול לבדוק שהשרת אישר את המפתח ובכל זאת לשייך אותו לאדם הלא נכון. תאריך רענן מונע שימוש בתשובה ישנה במקרים מסוימים, אך אינו מתקן בלבול זהויות.</p>\n<p>אפשר לבחון זאת בהחלפת בקשה: התוקף גורם לשרת החוקי לענות על זהות שבשליטת התוקף, ואז מוסר את התשובה החתומה למי שביקש זהות אחרת. אין צורך לזייף חתימה או לשבור גיבוב. כל הביטים המכוסים בחתימה נשארים בדיוק כפי שהשרת יצר אותם; רק ההקשר שבו המקבל מפרש אותם שגוי. מכאן שמנגנון חתימה תקין אינו מבטיח שפרוטוקול שלם תוכנן נכון.</p>\n<h3>חתימה על מפתח ביניים לעומת חתימה על המסר</h3>\n<p>כשל דומה מופיע כאשר שולח חותם רק על מפתח סימטרי המשמש אחר כך לתיוג הודעות. מקבל שיודע את אותו מפתח יכול ליצור תגים להודעות נוספות. אם הוא יכול להעביר את המפתח והחתימה למקבל אחר, המקבל החדש רואה הוכחה שהשולח אישר את המפתח אך אינו רואה הוכחה שהשולח אישר את ההודעה המסוימת. חתימה על הסוד אינה הופכת כל שימוש עתידי בסוד לחתימת השולח המקורי.</p>\n<p>בתכנון מתוקן יש לקשור יחד את זהות השולח, זהות הנמען, המסר או המפתח, ההקשר ומזהי הפעולה לפי צורכי הפרוטוקול. טוקן זמן או אתגר יכולים לתרום טריות, אך אינם מחליפים קישור לזהות. גם הצפנת המפתח למקבל אינה מתקנת לבדה חתימה שחסרים בה השדות הדרושים, כי מקבל חוקי מסוגל לפענח ואז להעביר הלאה נתונים שהוא יודע. בשאלה חשוב להראות תמליל תקיפה מלא: מה התוקף מקבל, איזה חלק הוא משנה, איזה חלק חתום נשמר ומדוע כל בדיקות המקבל עדיין מצליחות. כך נבדל ניתוח פרוטוקול מהסתפקות באמירה שכל הפרימיטיבים בטוחים.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>חשוב לבדוק בתקיפה גם מדוע המקבל אינו מבחין בשינוי: החתימה ממשיכה להתאמת, ערך הזמן נשאר רענן וההצפנה מיועדת למקבל הנוכחי. הכישלון מתרחש ברמת המשמעות שהמקבל מייחס לנתונים המאומתים. ראיה על מפתח אינה בהכרח ראיה על בעל מפתח, וראיה על בעל מפתח אינה בהכרח ראיה על הודעה מסוימת שלא נכללה בחתימה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_05102025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q128.html"},{"id":"Q129","year":"2025","stem":"איזה מבין הטענות הבאות נכונה בהקשר של Certificate Transparency (CT)?","options":["CT מוסיף יומן ציבורי שבעזרתו ניתן לזהות הנפקת תעודות שגויות או זדוניות על ידי CAים.","CT מבטל את הצורך ב CRL ו-OCSP על ידי חסימת כל תעודה שפג תוקפה באופן אוטומטי.","CT מחליף את פרוטוקול TLS.","CT מאפשר לדפדפן לאמת את זהות השרת ללא צורך בשרשרת אמון."],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf","date":"05/10/2025","num":7}],"flags":[],"fixed_order":false,"exclude":false,"topic":"PKI, תעודות, CT ו-OCSP","topic_score":0.412,"exam_count":1,"in_sample_exam":false,"variant_group":"V10","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-18-07\" data-doc=\"original-18\" data-body-words=\"370\"><h2>שאלה 7 — מטרת CT</h2><div class=\"answer-body\">\n<p><strong>א — יומן ציבורי לזיהוי הנפקות שגויות או זדוניות.</strong> מוניטורים ובעלי דומיינים מזהים בו תעודות שלא ציפו להן. ב: CT אינו מבטל CRL/OCSP ואינו מנגנון חסימת ביטול. ג: אינו מחליף TLS. ד: אינו מחליף שרשרת אמון ובדיקת שם השרת.</p>\n<h3>מדוע שרשרת אמון אינה מספיקה לביקורת הנפקות</h3>\n<p>רשות מוסמכת יכולה להנפיק בטעות תעודה לדומיין שאינו שייך למבקש, או שמפתח שלה עלול להיות מנוצל לרעה. לקוח הבודק רק חתימות עשוי לראות תעודה בעלת שרשרת חוקית, אף שבעל הדומיין האמיתי כלל לא ביקש אותה. שקיפות תעודות מוסיפה יכולת תצפית ציבורית: התעודות והתחייבויות הרישום שלהן מופיעות ביומנים שאפשר לבדוק ולנטר. המטרה אינה להצפין את התעודה או להסתיר את זהות האתר, אלא לאפשר גילוי של הנפקות חריגות גם לאחר שעברו את בדיקת החתימות הרגילה.</p>\n<p>יש להפריד בין הרשות המנפיקה, היומן והמנטר. היומן מקבל תעודות ומנהל מבנה נתונים שניתן לביקורת. המנטר קורא רישומים ומחפש למשל תעודות חדשות עבור דומיינים שהארגון מנהל. בעל דומיין שרואה תעודה שלא הזמין יכול לפתוח בירור ולבקש טיפול. עצם העובדה שתעודה מופיעה ביומן אינה אומרת שהיומן אישר שהמבקש הוא בעל הדומיין; בדיקת הזכאות להנפקה היא אחריות נפרדת.</p>\n<h3>התחייבות חתומה, הוכחת הכלה וביטול</h3>\n<p>חותמת הזמן החתומה היא הבטחה של יומן מסוים לכלול את התעודה בהתאם לכלליו. חתימת היומן מאפשרת לדפדפן לזהות מי נטל את ההתחייבות ולוודא שלא שינו אותה. היא שונה מהוכחת הכלה בעץ מרקל, שמראה כי רשומה מסוימת כבר נכללה במצב מסוים של היומן. הוכחת עקביות נועדה להראות שהיומן גדל באמצעות הוספה ולא שכתב את עברו. מבני הנתונים האלה מאפשרים ביקורת יעילה גם בלי שכל לקוח יוריד כל רשומה.</p>\n<p>דפדפן יכול לדרוש התחייבויות מיומנים שהוא מכיר, בהתאם למדיניותו, ועדיין חייב לבדוק זהות דומיין, שרשרת אמון וזמני תוקף. מנגנוני ביטול כגון רשימות ביטול או תשובות סטטוס פותרים בעיה אחרת: תעודה שהייתה קיימת כעת אינה אמורה להתקבל. רישום פומבי אינו מוחק תעודה ואינו מונע לבדו שימוש במפתח שנגנב. לכן חלופה המחליפה שקיפות בביטול, או טוענת שחותמת היומן פותרת את פרטיות בירור הסטטוס, מבלבלת בין מנגנונים שונים.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>נניח שבעל אתר מגלה ביומן תעודה שהונפקה בשמו בלי ידיעתו. הממצא מאפשר לפתוח בירור מול המנפיק ולנקוט פעולות ביטול והחלפה, אך היומן אינו מתקן לבדו את ההנפקה. זהו ההבדל בין ראיה ציבורית שמסייעת לגילוי ולהרתעה לבין אמצעי אכיפה שמונע קבלת תעודה מסוימת. שני התפקידים משלימים זה את זה ונחוצים בזמנים שונים של הטיפול באירוע.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_05102025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q129.html"},{"id":"Q130","year":"2025","stem":"מה מבין הבאים היא ההגדרה של תכונת ה pre image resistance?","options":["Given a digest d of a random message, it is hard to find a message m s.t. d = h(m)","Given a random message m<sub>0</sub>, it is hard to find a message m<sub>1</sub> that is not equal to m<sub>0</sub> s.t. h(m<sub>0</sub>) = h(m<sub>1</sub>)","It is hard to find messages m<sub>0</sub> ≠ m<sub>1</sub> s.t. h(m<sub>0</sub>) = h(m<sub>1</sub>)","It is hard to find messages m<sub>0</sub> ≠ m<sub>1</sub> s.t. h(m<sub>0</sub>) ≠ h(m<sub>1</sub>)"],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf","date":"05/10/2025","num":8}],"flags":[],"fixed_order":false,"exclude":false,"topic":"Hash, MAC וסיסמאות","topic_score":0.306,"exam_count":1,"in_sample_exam":false,"variant_group":"V11","accepted_indices":[0],"answer_html":"<article class=\"answer-section\" data-answer-id=\"original-18-08\" data-doc=\"original-18\" data-body-words=\"381\"><h2>שאלה 8 — הגדרת preimage resistance</h2><div class=\"answer-body\">\n<p><strong>א — בהינתן digest d של הודעה אקראית קשה למצוא m כך ש־h(m)=d.</strong> ב היא קדם־תמונה שנייה; ג היא עמידות להתנגשויות; ד היא מציאת זוג בעל hashes שונים, דבר קל ושאינו תכונת אבטחה. לא נדרש למצוא דווקא את ההודעה המקורית, אלא כל קדם־תמונה.</p>\n<h3>שלוש בעיות חיפוש שונות</h3>\n<p>פונקציית גיבוב ממפה מסרים באורכים שונים לתוצאה באורך קבוע. מכיוון שיש יותר מסרים מתוצאות אפשריות, קיימים בהכרח מסרים שונים בעלי אותה תוצאה. דרישת האבטחה אינה שאין התנגשויות כלל, אלא שלא תהיה לתוקף דרך מעשית למצוא את ההתאמות המסוכנות הנדרשות בתקיפה. כדי להבין איזו תכונה נשאלת צריך קודם לשאול מה כבר ניתן לתוקף ומה הוא רשאי לבחור בעצמו.</p>\n<p>בעמידות לקדם־תמונה התוקף מקבל תוצאה ומנסה למצוא מסר שמגיע אליה. הוא אינו חייב למצוא דווקא את המסר המקורי; כל מסר בעל אותה תוצאה מספיק. בעמידות לקדם־תמונה שנייה התוקף מקבל מסר מסוים, וצריך למצוא מסר אחר בעל אותו גיבוב. בעמידות להתנגשויות שני המסרים נתונים לבחירתו, כל עוד יהיו שונים ויגיעו לאותה תוצאה. ההבדל בין קיבוע מסר אחד לבין בחירת שני מסרים מסביר מדוע שמות התכונות אינם ניתנים להחלפה.</p>\n<h3>קישור למקרה מעשי ולמסיחים</h3>\n<p>במערכת אימות סיסמאות, נתון חשבון מסוים עם ערך בדיקה שנוצר מסיסמה מסוימת. אם סיסמה שונה עוברת את אותה בדיקה תחת אותו ערך המלחה, שני קלטים שונים הובילו לאותו גיבוב. עצם האירוע הוא התנגשות; תקיפה מכוונת של החשבון הקבוע נוגעת לקדם־תמונה שנייה. הוספת ערך המלחה אינה מבטלת את האפשרות המתמטית להתנגשויות, אך מונעת שימוש באותו חישוב מוקדם עבור משתמשים רבים.</p>\n<p>לשם השוואה, מציאת שני מסרים עם תוצאות שונות היא פעולה קלה ורצויה. אם כמעט כל מסר היה מקבל אותה תוצאה, הפונקציה הייתה חסרת תועלת לזיהוי שינויים. גם יצירת מחרוזת תוצאה שונה מזו שניתנה אינה מעידה על קושי קריפטוגרפי. לכן חלופות שמחליפות את סימן השוויון באי־שוויון אינן וריאציה קטנה של ההגדרה אלא טענה אחרת לגמרי. מונחים מתחומים כגון תעודות, כפיית הצפנה או סוד נוסף באחסון סיסמאות עשויים להיות קשורים להגנה הכוללת, אך אינם מגדירים את בעיית החיפוש של הגיבוב עצמו. הבחירה הנכונה מבוססת על הקלט, יעד החיפוש ותנאי ההצלחה.</p>\n<h3>בדיקה נוספת וגבול ההבטחה</h3>\n<p>אורך התוצאה משפיע על עלות התקיפות הכלליות: בחיפוש זוג חופשי קיימת תופעת יום ההולדת, שמאפשרת לפגוש התנגשות מוקדם יחסית לחיפוש קדם־תמונה של תוצאה קבועה. אין צורך לחשב את העלות המדויקת כדי לזהות את ההגדרה, אך העיקרון מסביר מדוע אסור להחליף בין שני סוגי החיפוש. חופש הבחירה של התוקף משנה את הבעיה גם באותה פונקציה עצמה.</p></div></article>","answer_origin":"פתרון מפורט מהתיקייה organized exams · 17/10/2026","answer_source":"689156_05102025_0 (3).pdf","question_type":"multiple-choice","solution":"solutions/Q130.html"},{"id":"Q131","year":"2025","stem":"איזה מנגנון מאפשר לשרת להגיד לדפדפן אלו משאבים מותר לדפדפן לטעון/להריץ בהקשר של העמוד הנוכחי?","options":["CSP","One time pad","XSS","CSRF"],"note":"","sources":[{"file":"2025/689156_05102025_0 (3).pdf",
